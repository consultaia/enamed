   nucleo:["Períodos: dilatação · expulsivo · dequitação · 4º (Greenberg, 1ª hora).",
     "Fase ativa a partir de 5-6 cm. Curva de Friedman (1 cm/h) SUPERADA — lentidão com bem-estar não é distocia.",
     "Planos de DeLee: espinhas isquiáticas = 0 (acima negativo, abaixo positivo).",
     "Partograma: linha de alerta → reavaliar; linha de ação (4h à direita) → decidir.",
     "Fazer: acompanhante (Lei 11.108/2005), liberdade de posição, alívio não farmacológico, pele a pele, clampeamento tardio (1-3 min), aleitamento na 1ª hora.",
     "NÃO de rotina: episiotomia, Kristeller (PROIBIDA), enema, tricotomia, amniotomia, ocitocina, litotomia, aspiração do RN.",
     "Baixo risco: ausculta intermitente; cardiotocografia contínua de rotina aumenta cesárea sem melhorar desfecho."],
   pega:"Manobra de Kristeller é PROIBIDA e episiotomia não é de rotina. E a curva de Friedman caiu: parto lento com mãe e feto bem NÃO é parada de progressão nem indicação de cesárea.",
   mne:"Na dúvida, marque a alternativa que respeita a fisiologia e a autonomia — e desconfie de tudo que for 'de rotina'.",
   sus:"Diretrizes Nacionais de Assistência ao Parto Normal e Rede Cegonha/Rede Alyne; acompanhante é direito legal (Lei 11.108/2005)."},
  {id:"go-contracepcao",area:"GO",nome:"Contracepção e planejamento reprodutivo",yield:3,
   questoes:["go_contra_q1","go_contra_q2","go_contra_q3","go_contra_q4"],
   fonte:"Critérios Médicos de Elegibilidade para Uso de Métodos Anticoncepcionais (OMS, 5ª edição — adaptação do Ministério da Saúde); Protocolos da Atenção Básica: Saúde das Mulheres (MS); FEBRASGO; Lei 9.263/1996 alterada pela Lei 14.443/2022 (esterilização).",
   aula:["Contracepção é assunto de atenção primária e a prova cobra dois eixos: eficácia real e ELEGIBILIDADE. Primeiro a eficácia, com uma distinção que muda tudo: existe o uso PERFEITO (no laboratório, sem falha humana) e o uso TÍPICO (na vida real, com esquecimento e atraso). A pílula tem eficácia altíssima no uso perfeito e cai muito no típico — porque depende de lembrar todo dia. Já os LARC (contraceptivos reversíveis de longa ação: DIU e implante) não dependem do usuário, e por isso mantêm eficácia acima de 99% nos dois cenários. Essa é a lógica moderna: quanto MENOS o método depende da memória da pessoa, mais ele funciona.",
     "O segundo eixo são os CRITÉRIOS DE ELEGIBILIDADE da OMS, que classificam cada método para cada condição em 4 categorias: 1 = usar sem restrição; 2 = benefício supera o risco (pode usar); 3 = risco supera o benefício (não recomendado, só se não houver alternativa); 4 = risco INACEITÁVEL (não usar). A prova quase sempre pergunta a categoria 4 do combinado — ou seja, quando o ESTROGÊNIO está proibido. Decore esta lista: ENXAQUECA COM AURA (em qualquer idade — risco de AVC); tabagista com 35 anos ou mais que fuma 15 ou mais cigarros por dia; hipertensão grave; trombose venosa profunda ou embolia atual ou prévia, e trombofilias; câncer de mama atual; doença hepática grave; cardiopatia isquêmica ou AVC prévio; lúpus com anticorpo antifosfolípide; puérpera amamentando nos primeiros 21 dias. Em todas elas, a saída é o mesmo raciocínio: TIRE O ESTROGÊNIO — use progestágeno isolado ou DIU de cobre.",
     "Os métodos, em blocos. COMBINADOS (estrogênio + progestágeno: pílula, adesivo, anel): além de contracepção, regulam o ciclo, reduzem dismenorreia e diminuem o risco de câncer de ovário e de endométrio. PROGESTÁGENO ISOLADO (minipílula, desogestrel, injetável trimestral, implante de etonogestrel): a alternativa quando o estrogênio é proibido — inclusive na amamentação e na enxaqueca com aura. DIU DE COBRE: não hormonal, dura cerca de 10 anos, e o efeito adverso a informar é aumento de fluxo e cólica. DIU/SIU DE LEVONORGESTREL: reduz muito o fluxo, a ponto de ser tratamento para sangramento aumentado. BARREIRA: o preservativo é o único método que também previne IST — por isso a lógica da dupla proteção. E os DEFINITIVOS: laqueadura e vasectomia.",
     "Agora os MITOS que a banca usa como alternativa errada, e a lei. Mito número um: 'DIU não pode em nuligesta nem em adolescente' — PODE, é categoria elegível, e é inclusive uma excelente opção para adolescentes justamente por não depender de adesão diária. DIU não causa infertilidade e não exige uma bateria de exames prévios. Não é preciso 'já ter filhos' para usar. Sobre a esterilização, a Lei 9.263/1996 foi alterada pela Lei 14.443/2022 e três pontos mudaram e caem: a idade mínima caiu para 21 anos (ou ter 2 filhos vivos); NÃO se exige mais o consentimento do cônjuge; e passou a ser permitida durante o parto ou cesárea. Mantém-se o prazo mínimo de 60 dias entre a manifestação da vontade e o procedimento, com aconselhamento.",
     "Fechando com duas situações práticas. CONTRACEPÇÃO DE EMERGÊNCIA: levonorgestrel 1,5 mg, o quanto antes — a eficácia é tanto maior quanto mais precoce —, com limite de até 5 dias. Seu mecanismo é inibir ou atrasar a OVULAÇÃO; ela NÃO é abortiva e não interrompe gravidez já implantada. E o método de emergência mais eficaz de todos é o DIU DE COBRE, também até 5 dias, com a vantagem de já ficar como contracepção contínua. PÓS-PARTO: quem amamenta evita estrogênio (nos primeiros 6 meses), usando progestágeno isolado; o DIU pode ser inserido no pós-parto imediato ou após 4 semanas. Resumo do raciocínio de prova: procure a contraindicação ao estrogênio (enxaqueca com aura é a campeã), lembre que LARC é o mais eficaz e liberado para adolescente e nuligesta, e que a emergência vai até 5 dias e não é aborto."],
   raciocinio:["Comece perguntando: há contraindicação ao ESTROGÊNIO? Enxaqueca COM AURA, tabagista ≥35 anos e ≥15 cigarros/dia, TVP/TEP, HAS grave, CA de mama, amamentação <21 dias = categoria 4.",
     "Se o estrogênio está proibido: use progestágeno isolado ou DIU de cobre.",
     "Quer máxima eficácia real? LARC (DIU ou implante) — não dependem de adesão diária.",
     "Adolescente ou nuligesta pode usar DIU — não é contraindicação; é ótima indicação.",
     "Precisa prevenir IST também? Preservativo (dupla proteção) — é o único que protege.",
     "Emergência: levonorgestrel 1,5 mg até 5 dias (quanto antes, melhor); DIU de cobre é o mais eficaz. Não é abortivo.",
     "Esterilização (Lei 14.443/2022): ≥21 anos ou 2 filhos vivos, 60 dias de intervalo, SEM consentimento do cônjuge, permitida no parto/cesárea."],
   nucleo:["Uso perfeito x uso típico: a pílula cai muito no típico (esquecimento); LARC (DIU/implante) mantém >99% porque independe do usuário.",
     "Critérios OMS: 1 = sem restrição · 2 = pode usar · 3 = não recomendado · 4 = NÃO usar.",
     "Categoria 4 do combinado (estrogênio proibido): enxaqueca COM AURA, tabagista ≥35a e ≥15 cig/dia, HAS grave, TVP/TEP atual ou prévia, trombofilia, CA de mama, hepatopatia grave, coronariopatia/AVC, LES com antifosfolípide, amamentando <21 dias pós-parto.",
     "Estrogênio proibido → progestágeno isolado ou DIU de cobre.",
     "DIU PODE em nuligesta e adolescente; não causa infertilidade. DIU de cobre aumenta fluxo/cólica; SIU-levonorgestrel REDUZ fluxo.",
     "Preservativo é o único que previne IST (dupla proteção).",
     "Emergência: levonorgestrel 1,5 mg até 5 dias — atrasa/inibe a OVULAÇÃO, NÃO é abortivo. DIU de cobre é a emergência mais eficaz.",
     "Esterilização (Lei 14.443/2022): ≥21 anos ou 2 filhos vivos; 60 dias entre manifestação e ato; SEM anuência do cônjuge; permitida no parto/cesárea."],
   pega:"Enxaqueca COM AURA proíbe estrogênio em qualquer idade (categoria 4, risco de AVC). E DIU NÃO é contraindicado em nuligesta ou adolescente — esse é o mito mais cobrado. A contracepção de emergência não é abortiva: ela atrasa a ovulação.",
   mne:"Estrogênio proibido = 'AURA, 35+15, TROMBO, MAMA'. LARC = eficácia que não depende de memória. Emergência: 5 dias.",
   sus:"Planejamento reprodutivo é atribuição da APS; métodos e DIU disponíveis no SUS, com inserção na própria UBS."},

  {id:"go-corrimentos",area:"GO",nome:"Corrimentos, úlceras genitais e DIP",yield:3,
   questoes:["go_corr_q1","go_corr_q2","go_corr_q3","go_corr_q4"],
   fonte:"PCDT para Atenção Integral às Pessoas com Infecções Sexualmente Transmissíveis (Ministério da Saúde); FEBRASGO; abordagem sindrômica das IST (MS).",
   aula:["Corrimento vaginal se resolve com três perguntas: qual a COR e a consistência, tem ODOR, e tem PRURIDO? Três quadros dominam. VAGINOSE BACTERIANA (Gardnerella e flora anaeróbia): corrimento branco-acinzentado, homogêneo, fino, com ODOR DE PEIXE que piora depois da relação e da menstruação — e, importante, SEM inflamação: não há prurido nem ardor significativos, porque é um desequilíbrio da flora, não uma infecção invasiva. O pH fica ACIMA de 4,5, o teste das aminas (KOH) é positivo e vêem-se clue cells. Trata-se com METRONIDAZOL e NÃO se trata o parceiro — não é IST clássica.",
     "CANDIDÍASE é o oposto no eixo do prurido: corrimento branco, GRUMOSO, tipo leite coalhado, aderente, SEM odor, com PRURIDO INTENSO, ardor e hiperemia vulvar. O pH permanece NORMAL (abaixo de 4,5) — este é o detalhe que separa das outras duas. Trata-se com azólico (fluconazol oral ou tópico) e não se trata parceria assintomática. Vale procurar o que a favoreceu: diabetes descompensado, uso recente de antibiótico, gestação, imunossupressão. TRICOMONÍASE é a única das três que é IST de verdade: corrimento amarelo-esverdeado, BOLHOSO, abundante, com odor, prurido, e o achado clássico do colo em framboesa (colpite em morango); pH acima de 4,5. Trata-se com metronidazol E TRATA-SE O PARCEIRO — e, por ser IST, obriga a testar as demais.",
     "Subindo do canal vaginal para o colo, entram gonococo e clamídia, causando cervicite — que na mulher é frequentemente ASSINTOMÁTICA, e é exatamente por isso que evolui em silêncio para a DIP e para a infertilidade. Pela abordagem sindrômica, trata-se os dois juntos, empiricamente: ceftriaxona (gonococo) mais azitromicina (clamídia), sem esperar cultura, e tratam-se as parcerias. A DOENÇA INFLAMATÓRIA PÉLVICA (DIP) é essa infecção ascendendo para útero, tubas e pelve. Os critérios MÍNIMOS para tratar são três: dor em hipogástrio/pélvica, dor à MOBILIZAÇÃO DO COLO e dor anexial. Presentes esses, INICIA-SE o tratamento empírico — não se espera confirmação, porque o preço de não tratar é infertilidade, gravidez ectópica e dor pélvica crônica. Interna-se quando: gestante, abscesso tubo-ovariano, quadro grave/toxemiado, falha do tratamento ambulatorial, impossibilidade de seguimento ou dúvida diagnóstica. E há uma complicação com nome próprio: a síndrome de FITZ-HUGH-CURTIS, peri-hepatite com aderências 'em corda de violino', que dá dor em hipocôndrio direito e engana como doença de vesícula.",
     "As ÚLCERAS genitais se organizam por dois eixos: número e DOR. ÚNICA e INDOLOR, de fundo limpo e base endurecida, com adenopatia que não supura = CANCRO DURO, a sífilis primária — tratamento com penicilina benzatina. MÚLTIPLAS e DOLOROSAS, de fundo sujo e bordas irregulares, com adenopatia que supura (o bubão que fistuliza) = CANCRO MOLE (Haemophilus ducreyi) — azitromicina. Se antes da úlcera houve VESÍCULAS agrupadas, com ardência e história de recorrência, é HERPES genital — aciclovir. O linfogranuloma venéreo (clamídia L1-L3) dá úlcera fugaz que passa despercebida e depois uma linfadenopatia exuberante com o 'sinal do sulco' — doxiciclina por 21 dias. E a donovanose é úlcera crônica, vegetante, indolor e sem adenopatia. Guarde o par-chave: única e indolor = sífilis; múltiplas e dolorosas = cancro mole (ou herpes, se veio de vesículas).",
     "Fecham o tema as regras que valem para qualquer IST e que a prova cobra como conduta. Diante de UMA IST, teste o PACOTE: HIV, sífilis, hepatite B e hepatite C — elas andam juntas. Trate as PARCERIAS quando indicado (tricomoníase sim, vaginose e candidíase não). Ofereça prevenção: preservativo, vacina de HPV e de hepatite B, e PrEP para quem tem risco continuado. Notifique o que é compulsório — sífilis adquirida, sífilis em gestante, sífilis congênita e HIV. E lembre que a abordagem sindrômica existe justamente para não perder o paciente: trata-se na primeira consulta, com o que se tem, sem depender de laboratório que talvez nunca volte."],
   raciocinio:["Corrimento com ODOR de peixe, acinzentado, SEM prurido, pH >4,5 = vaginose → metronidazol, NÃO trata parceiro.",
     "Corrimento branco GRUMOSO, muito prurido, SEM odor, pH NORMAL = candidíase → azólico; procure diabetes, ATB recente, gestação.",
     "Corrimento amarelo-esverdeado BOLHOSO, colo em framboesa, pH >4,5 = tricomoníase → metronidazol E TRATA O PARCEIRO (é IST).",
     "Cervicite (gonococo/clamídia) é muitas vezes assintomática → abordagem sindrômica: ceftriaxona + azitromicina, tratar parcerias.",
     "Dor pélvica + dor à mobilização do colo + dor anexial = critérios mínimos de DIP → TRATE EMPIRICAMENTE, não espere confirmação.",
     "Interne a DIP se: gestante, abscesso tubo-ovariano, quadro grave, falha ambulatorial, impossibilidade de seguimento ou dúvida.",
     "Úlcera ÚNICA e INDOLOR = sífilis (penicilina). MÚLTIPLAS e DOLOROSAS = cancro mole (azitromicina); vesículas antes = herpes.",
     "Sempre: teste o pacote (HIV, sífilis, hepatites B e C), vacine (HPV, hepB) e notifique o que é compulsório."],
   nucleo:["Vaginose bacteriana: branco-acinzentado, odor de peixe, SEM prurido, pH >4,5, clue cells, aminas + → metronidazol. NÃO trata parceiro.",
     "Candidíase: branco grumoso (leite coalhado), PRURIDO intenso, sem odor, pH NORMAL (<4,5) → azólico. Procurar DM, ATB, gestação.",
     "Tricomoníase (É IST): amarelo-esverdeado, bolhoso, colo em framboesa, pH >4,5 → metronidazol + TRATAR PARCEIRO + testar outras IST.",
     "Cervicite (gonococo + clamídia): frequentemente ASSINTOMÁTICA → abordagem sindrômica com ceftriaxona + azitromicina.",
     "DIP — critérios mínimos: dor pélvica + dor à mobilização do colo + dor anexial → tratar EMPIRICAMENTE (risco de infertilidade, ectópica, dor crônica).",
     "Internar DIP: gestante, abscesso tubo-ovariano, quadro grave, falha ambulatorial, sem seguimento, dúvida diagnóstica. Fitz-Hugh-Curtis = peri-hepatite (corda de violino).",
     "Úlceras: ÚNICA + INDOLOR = cancro duro (sífilis, penicilina) · MÚLTIPLAS + DOLOROSAS = cancro mole (azitromicina) · vesículas prévias = herpes (aciclovir) · úlcera fugaz + adenopatia com sinal do sulco = LGV (doxiciclina 21 dias).",
     "Toda IST: testar HIV, sífilis, hepatites B e C; tratar parcerias; vacinar (HPV, hepB); notificar sífilis e HIV."],
   pega:"Candidíase tem pH NORMAL — vaginose e tricomoníase têm pH >4,5. Vaginose NÃO trata parceiro; tricomoníase trata (é IST). E DIP se trata com os critérios MÍNIMOS, empiricamente: esperar confirmação custa fertilidade.",
   mne:"Peixe = vaginose (metronidazol, sem parceiro). Leite coalhado + prurido = candidíase (pH normal). Framboesa/bolhoso = tricomoníase (trata parceiro). Úlcera única indolor = sífilis.",
   sus:"Abordagem sindrômica permite tratar na 1ª consulta sem laboratório; testagem rápida e notificação compulsória de sífilis e HIV na APS."},

  {id:"go-sua",area:"GO",nome:"Sangramento uterino anormal",yield:2,
   questoes:["go_sua_q1","go_sua_q2","go_sua_q3","go_sua_q4"],
   fonte:"Classificação FIGO PALM-COEIN; FEBRASGO — Sangramento Uterino Anormal; Protocolos da Atenção Básica: Saúde das Mulheres (Ministério da Saúde).",
   aula:["Sangramento uterino anormal (SUA) é qualquer alteração no volume, na duração, na frequência ou na regularidade do sangramento. A FIGO aposentou a terminologia antiga — menorragia, metrorragia, hipermenorreia — porque confundia mais do que explicava; hoje se descreve o que se vê. E antes de qualquer raciocínio diagnóstico, existem dois passos obrigatórios. Primeiro: EXCLUIR GRAVIDEZ, com beta-hCG, em TODA mulher em idade fértil que sangra — abortamento, ectópica e doença trofoblástica se apresentam assim, e esquecer isso é o erro mais grosseiro. Segundo: avaliar a estabilidade hemodinâmica; sangramento intenso é urgência antes de ser diagnóstico.",
     "A organização das causas é o mnemônico PALM-COEIN, e ele é elegante porque separa por natureza. PALM são as causas ESTRUTURAIS, as que você VÊ na imagem: Pólipo, Adenomiose, Leiomioma (mioma) e Malignidade/hiperplasia. COEIN são as NÃO estruturais, que a imagem não mostra: Coagulopatia, disfunção Ovulatória, causa Endometrial, Iatrogênica (medicamentos, DIU, anticoagulante, hormônios) e Não classificada. Diante de uma questão, encaixe a hipótese em uma das letras — isso já organiza a investigação.",
     "A IDADE é o melhor atalho. Na ADOLESCENTE, a causa mais comum é a imaturidade do eixo hipotálamo-hipófise-ovário, que gera ciclos anovulatórios. Mas há um alerta específico: adolescente com sangramento intenso DESDE A MENARCA obriga a investigar COAGULOPATIA — a doença de von Willebrand é a mais comum e é subdiagnosticada. Na idade REPRODUTIVA: mioma, pólipo, disfunção ovulatória (a síndrome dos ovários policísticos é a campeã), gravidez e causas iatrogênicas. E na PÓS-MENOPAUSA vale a regra que não admite exceção: sangramento após a menopausa é CÂNCER DE ENDOMÉTRIO até prova em contrário — jamais se tranquiliza a paciente, sempre se investiga.",
     "A investigação segue uma ordem. Beta-hCG primeiro. Depois hemograma (para dimensionar a perda), TSH (o hipotireoidismo causa SUA e é barato de excluir) e coagulograma quando há suspeita. A imagem inicial é a ULTRASSONOGRAFIA TRANSVAGINAL, que enxerga as letras do PALM. Na pós-menopausa ela ganha um papel específico: mede o eco endometrial, e espessura acima de 4-5 mm exige amostragem — biópsia ou histeroscopia. A HISTEROSCOPIA com biópsia é o padrão-ouro para avaliar a cavidade, permitindo ver e tratar no mesmo ato. E se o sangramento é PÓS-COITO, olhe o COLO: exame especular e citologia, pensando em lesão cervical.",
     "O tratamento se divide em agudo e crônico. No AGUDO com instabilidade: estabilizar primeiro (acesso, volume, hemoderivado se preciso), e controlar o sangramento com alta dose hormonal (estrogênio ou combinado) e ÁCIDO TRANEXÂMICO; se refratário, abordagem cirúrgica. No CRÔNICO, trata-se a causa, e as opções vão do mais simples ao mais invasivo: não hormonais (anti-inflamatórios e ácido tranexâmico, úteis e subutilizados), combinados orais, progestágenos e — a estrela — o SIU de LEVONORGESTREL (DIU hormonal), que reduz drasticamente o fluxo e é excelente para SUA por disfunção ovulatória, adenomiose e miomas pequenos, evitando cirurgia. Ablação endometrial e histerectomia ficam para prole completa ou falha das demais. Resumo do que a banca quer: excluiu gravidez? classificou pelo PALM-COEIN? e, se é pós-menopausa, foi investigar o endométrio?"],
   raciocinio:["Passo zero: beta-hCG em TODA mulher em idade fértil que sangra. Depois, avalie estabilidade hemodinâmica.",
     "Classifique pelo PALM-COEIN: estruturais (Pólipo, Adenomiose, Leiomioma, Malignidade) x não estruturais (Coagulopatia, Ovulatória, Endometrial, Iatrogênica, Não classificada).",
     "Use a idade: adolescente = anovulação por imaturidade do eixo; MAS sangramento intenso desde a MENARCA = investigar von Willebrand.",
     "Idade reprodutiva: mioma, pólipo, SOP, gravidez, iatrogenia.",
     "PÓS-MENOPAUSA sangrando = câncer de endométrio até prova em contrário → USG transvaginal; eco >4-5 mm = biópsia/histeroscopia. Nunca tranquilizar.",
     "Investigue: beta-hCG, hemograma, TSH, coagulograma se suspeita; USG transvaginal (inicial) e histeroscopia com biópsia (padrão-ouro da cavidade).",
     "Sangramento PÓS-COITO? Examine o COLO (especular + citologia).",
     "Trate: agudo = estabilizar + hormônio em alta dose + ácido tranexâmico. Crônico = pela causa; SIU-levonorgestrel é excelente e evita cirurgia."],
   nucleo:["Primeiro passo SEMPRE: excluir gravidez (beta-hCG). Depois, estabilidade hemodinâmica.",
     "PALM (estruturais, vê na imagem): Pólipo, Adenomiose, Leiomioma, Malignidade/hiperplasia. COEIN (não estruturais): Coagulopatia, Ovulatória, Endometrial, Iatrogênica, Não classificada.",
     "Adolescente: anovulação por imaturidade do eixo. Sangramento intenso DESDE A MENARCA = investigar coagulopatia (von Willebrand).",
     "Idade reprodutiva: mioma, pólipo, disfunção ovulatória (SOP), gravidez, iatrogênica.",
     "PÓS-MENOPAUSA: sangramento = CÂNCER DE ENDOMÉTRIO até prova em contrário. USG transvaginal; eco endometrial >4-5 mm → biópsia/histeroscopia.",
     "Investigação: beta-hCG, hemograma, TSH, coagulograma (se suspeita); USG transvaginal inicial; histeroscopia com biópsia = padrão-ouro.",
     "Agudo instável: estabilizar + alta dose hormonal + ácido tranexâmico. Crônico: AINE, tranexâmico, combinados, progestágeno, SIU-LNG (reduz muito o fluxo); ablação/histerectomia por último."],
   pega:"Sangramento na PÓS-MENOPAUSA é câncer de endométrio até prova em contrário — investigar sempre. E adolescente com sangramento intenso desde a MENARCA não é 'só imaturidade do eixo': investigue von Willebrand. Antes de tudo, beta-hCG.",
   mne:"PALM = estrutural (vê). COEIN = não estrutural (não vê). Pós-menopausa sangrou = endométrio até prova em contrário.",
   sus:"Investigação inicial e USG transvaginal acessíveis pela APS; sangramento pós-menopausa exige referência rápida à ginecologia."},

  {id:"go-climaterio",area:"GO",nome:"Climatério e menopausa",yield:2,
   questoes:["go_clim_q1","go_clim_q2","go_clim_q3","go_clim_q4"],
   fonte:"FEBRASGO — Climatério; Protocolos da Atenção Básica: Saúde das Mulheres (Ministério da Saúde); posicionamento da North American Menopause Society (NAMS) sobre terapia hormonal; reanálises do Women's Health Initiative (WHI).",
   aula:["Comece pelas definições, porque a prova as troca. CLIMATÉRIO é a FASE de transição do período reprodutivo para o não reprodutivo — um processo, que dura anos. MENOPAUSA é um EVENTO: a última menstruação. E o detalhe: o diagnóstico da menopausa é RETROSPECTIVO, feito só depois de 12 meses consecutivos de amenorreia. A idade média fica em torno dos 50 anos (faixa de 45 a 55). Abaixo dos 40 anos, não se chama menopausa: é insuficiência ovariana prematura, e exige investigação. Um ponto prático que cai: em mulher acima de 45 anos com sintomas típicos, o diagnóstico é CLÍNICO — não é preciso dosar FSH de rotina.",
     "Os sintomas se dividem em dois grupos com destinos diferentes. Os VASOMOTORES — fogachos, ondas de calor, sudorese noturna — são a marca do climatério, incomodam muito, e tendem a melhorar com o tempo. Já a SÍNDROME GENITURINÁRIA DA MENOPAUSA (secura vaginal, dispareunia, urgência urinária, infecções urinárias de repetição) é o oposto: ela é PROGRESSIVA e NÃO melhora sozinha — sem tratamento, piora. Some-se distúrbio do sono e alterações de humor. No longo prazo, a queda do estrogênio acelera a perda óssea (osteoporose) e o risco cardiovascular sobe.",
     "A TERAPIA HORMONAL (TH) é o assunto mais mal compreendido da ginecologia, e a prova cobra a virada. O estudo WHI, em 2002, assustou o mundo e fez uma geração inteira abandonar a TH. Mas as reanálises mostraram que o problema não era o hormônio, e sim QUEM estava sendo tratada: mulheres já idosas, muito longe da menopausa. Daí nasceu o conceito que você precisa saber: a JANELA DE OPORTUNIDADE. Iniciar a TH antes dos 60 anos OU dentro de 10 anos da menopausa, em mulher sem contraindicação, faz o benefício superar o risco — é a melhor opção para sintomas vasomotores moderados a graves. Fora dessa janela, a conta se inverte.",
     "E existe uma regra de segurança que não se negocia: mulher COM ÚTERO precisa de estrogênio MAIS PROGESTÁGENO. O papel do progestágeno ali não é aliviar sintoma — é PROTEGER O ENDOMÉTRIO. Estrogênio isolado em quem tem útero estimula o endométrio sem oposição e causa hiperplasia e câncer de endométrio. Já a mulher HISTERECTOMIZADA, que não tem endométrio para proteger, usa estrogênio ISOLADO. As contraindicações à TH sistêmica: câncer de mama atual ou prévio, câncer de endométrio, sangramento vaginal não esclarecido (investigue antes!), TVP/TEP, doença coronariana ou AVC prévios, doença hepática grave e porfiria.",
     "Quando a TH não pode ou não se quer, há alternativas. Para os fogachos: ISRS e IRSN (paroxetina, venlafaxina) e gabapentina, além de medidas comportamentais. Para a síndrome geniturinária, a resposta é elegante: ESTROGÊNIO VAGINAL em baixa dose — como a absorção sistêmica é mínima, seu perfil de segurança é alto e ele é a opção mesmo para muitas mulheres que não podem usar TH sistêmica; somam-se lubrificantes e hidratantes vaginais. E o climatério é também uma janela de PREVENÇÃO na APS: manter os rastreios (mamografia, colo do útero), avaliar risco cardiovascular, garantir cálcio e vitamina D, prescrever exercício com carga, cessar tabagismo, e indicar densitometria conforme critério (a partir dos 65 anos, ou antes com fatores de risco). Resumo do que cai: FSH não é obrigatório acima de 45; com útero, nunca estrogênio isolado; e tudo gira em torno da janela de oportunidade."],
   raciocinio:["Separe: climatério = FASE; menopausa = EVENTO, diagnosticado RETROSPECTIVAMENTE após 12 meses de amenorreia.",
     "Mulher >45 anos com sintomas típicos: diagnóstico CLÍNICO — não peça FSH de rotina. Abaixo de 40 anos = insuficiência ovariana prematura, investigue.",
     "Sintoma vasomotor moderado a grave e sem contraindicação? Considere TH — respeitando a JANELA (antes dos 60 anos ou até 10 anos de menopausa).",
     "TEM ÚTERO? Estrogênio + PROGESTÁGENO (protege o endométrio). Histerectomizada: estrogênio isolado.",
     "Cheque contraindicações: CA de mama, CA de endométrio, sangramento não esclarecido, TVP/TEP, coronariopatia/AVC, hepatopatia grave.",
     "Não pode TH sistêmica? Fogachos: ISRS/IRSN (paroxetina, venlafaxina) ou gabapentina.",
     "Síndrome geniturinária (não melhora sozinha): ESTROGÊNIO VAGINAL de baixa dose + lubrificantes.",
     "Aproveite a consulta: rastreios em dia, risco cardiovascular, cálcio/vitamina D, exercício com carga, densitometria conforme indicação."],
   nucleo:["Climatério = fase de transição. Menopausa = última menstruação, diagnóstico RETROSPECTIVO após 12 meses de amenorreia (média ~50 anos).",
     ">45 anos com sintomas típicos: diagnóstico CLÍNICO, sem necessidade de FSH. <40 anos = insuficiência ovariana prematura.",
     "Vasomotores (fogachos) melhoram com o tempo; síndrome GENITURINÁRIA é PROGRESSIVA e não melhora sozinha.",
     "TH é a melhor opção para vasomotores moderados/graves, dentro da JANELA DE OPORTUNIDADE: <60 anos OU <10 anos de menopausa.",
     "COM útero: estrogênio + PROGESTÁGENO (protege o endométrio). SEM útero: estrogênio isolado. Estrogênio isolado com útero = hiperplasia/CA de endométrio.",
     "Contraindicações: CA de mama atual/prévio, CA de endométrio, sangramento não esclarecido, TVP/TEP, coronariopatia/AVC, hepatopatia grave, porfiria.",
     "Alternativas para fogachos: ISRS/IRSN (paroxetina, venlafaxina), gabapentina. Síndrome geniturinária: estrogênio VAGINAL de baixa dose (segurança alta).",
     "Prevenção: rastreios, risco cardiovascular, cálcio + vitamina D, exercício com carga, densitometria (≥65 anos ou antes com risco)."],
   pega:"Mulher COM útero nunca usa estrogênio isolado — o progestágeno existe para proteger o endométrio. E não peça FSH de rotina acima dos 45 anos: o diagnóstico é clínico. A janela de oportunidade (<60 anos ou <10 anos de menopausa) é o que reabilitou a TH após o susto do WHI.",
   mne:"Menopausa = 12 meses depois (retrospectivo). Com útero = E + P. Sem útero = E só. Janela: 60 anos / 10 anos.",
   sus:"Acompanhamento do climatério é da APS; rastreios de mama e colo e prevenção cardiovascular/óssea nessa faixa."},
  {id:"ped-desidratacao",area:"PED",nome:"Diarreia e desidratação (TRO)",yield:3,
   questoes:["ped_desidratacao_q1","ped_desidratacao_q2","ped_desidratacao_q3","ped_desidratacao_q4"],
   fonte:"Manejo do Paciente com Diarreia (Ministério da Saúde/SVSA, 2023 — unificado com SBP e SBI); estratégia AIDPI Criança.",
   aula:["A diarreia aguda é uma das principais causas de internação e morte de crianças pequenas no mundo, e quase sempre o que mata não é a infecção em si, mas a DESIDRATAÇÃO. Por isso o foco do atendimento é avaliar o grau de desidratação e repor líquidos na medida certa. A boa notícia é que a maioria se resolve com reidratação oral, uma das intervenções mais custo-efetivas da saúde pública.","Avaliar a desidratação é clínico, por sinais: estado geral (alerta, irritado ou letárgico), olhos (normais ou encovados), sede (bebe normal, bebe com avidez, ou não consegue beber), e o sinal da prega cutânea (some rápido, lento, ou muito lento). Com base nisso, classifica-se em: sem desidratação, com desidratação (moderada), ou desidratação grave/com choque.","A conduta segue três planos. Plano A (sem desidratação): orientação e reidratação em casa, mantendo a alimentação. Plano B (com desidratação, sem choque): terapia de reidratação oral (TRO) SUPERVISIONADA na unidade, com soro de reidratação oral em volume calculado, por algumas horas. Plano C (desidratação grave ou choque): hidratação VENOSA imediata. A regra prática: A em casa, B na unidade (oral), C na veia.","Pontos que a banca adora: a criança em choque ou que não consegue beber vai direto para o Plano C (venoso) — não se insiste na via oral. O antibiótico NÃO é rotina (a maioria é viral); fica para situações específicas (disenteria com gravidade, cólera). Mantém-se a alimentação (e o aleitamento materno). O ZINCO reduz duração e gravidade e, pela atualização do MS, é indicado para crianças de 6 meses a 5 anos, 20 mg/dia (antes era só a partir dos 5 anos). Outra novidade: a ONDANSETRONA (antiemético) pode ser usada em vômitos persistentes que atrapalham a reidratação oral — exceto em gestantes."],
   raciocinio:["Avalie o grau de desidratação por sinais: estado geral, olhos, sede, prega cutânea.","Sem desidratação → Plano A (casa, mantendo alimentação).","Com desidratação, sem choque → Plano B (TRO supervisionada na unidade).","Grave / choque / não consegue beber → Plano C (venoso, imediato).","Lembre: antibiótico não é rotina; mantenha alimentação e ofereça zinco."],
   nucleo:["Avaliar grau de desidratação por sinais (olhos, sede, prega, estado geral).","Plano A: casa. Plano B: TRO supervisionada na unidade. Plano C: venoso.","Choque ou incapaz de beber = Plano C direto.","Antibiótico não é rotina; manter alimentação. Zinco: 6 meses-5 anos, 20 mg/dia. Ondansetrona em vômitos persistentes (exceto gestante)."],
   pega:"Choque ou criança que não bebe = Plano C (venoso) direto. Antibiótico não é rotina na diarreia aguda.",mne:"A em casa, B na unidade (oral), C na veia.",sus:"A TRO é política clássica de saúde pública que reduziu a mortalidade infantil."},
  {id:"ped-respiratorio",area:"PED",nome:"IVAS, bronquiolite e pneumonia",yield:3,
   questoes:["ped_respiratorio_q1","ped_respiratorio_q2","ped_respiratorio_q3","ped_respiratorio_q4"],
   fonte:"Documento Científico de Pneumonia Comunitária da Sociedade Brasileira de Pediatria (SBP); estratégia AIDPI (Ministério da Saúde).",
   aula:["As infecções respiratórias são o motivo mais comum de atendimento pediátrico, e a habilidade cobrada é saber separar o que é leve do que é grave, e viral do que é bacteriano. A maioria das infecções de vias aéreas superiores (IVAS) é viral e autolimitada. O erro clássico é medicalizar resfriado com antibiótico.","A bronquiolite é típica do lactente (menor de 2 anos) e quase sempre causada por um vírus, o VSR (vírus sincicial respiratório). Começa como um resfriado e evolui com chiado (sibilância), tosse e desconforto respiratório. O ponto central: o tratamento é de SUPORTE — hidratação, oxigênio se necessário, desobstrução nasal. Broncodilatador e corticoide NÃO funcionam de rotina na bronquiolite, diferentemente da asma.","A pneumonia comunitária, por sua vez, costuma ter febre alta, taquipneia e sinais de esforço. Na criança de 2 meses a 5 anos, o tratamento ambulatorial de 1ª linha da pneumonia bacteriana típica (pneumococo) é a AMOXICILINA, 50 mg/kg/dia (de 8/8h ou 12/12h). Em escolares e adolescentes com quadro de pneumonia ATÍPICA (Mycoplasma pneumoniae), prefere-se um macrolídeo (azitromicina). O que decide se a criança fica em casa ou interna são os SINAIS DE GRAVIDADE: idade < 2 meses, tiragem (retração), taquipneia acima do corte para a idade, saturação < 92%, toxemia, derrame pleural ou incapacidade de aceitar líquidos.","Contar a frequência respiratória pela idade é o 'pulo do gato' — a OMS define taquipneia por faixas (por exemplo, mais alta em bebês). Uma criança com pneumonia e hipoxemia ou tiragem importante precisa de internação e antibiótico parenteral (como ceftriaxona), não de amoxicilina oral em casa. Resumo do raciocínio: bronquiolite (lactente, viral) = suporte; pneumonia típica = amoxicilina; e são os sinais de gravidade que definem o nível de cuidado."],
   raciocinio:["IVAS geralmente é viral e autolimitada — não medicalizar resfriado com antibiótico.","Lactente com sibilância pós-resfriado = bronquiolite (VSR): tratamento de SUPORTE.","Pneumonia bacteriana típica ambulatorial: amoxicilina de 1ª linha.","Conte a FR pela idade e busque sinais de gravidade da OMS (tiragem, hipoxemia).","Sinais de gravidade → internação + antibiótico parenteral (ex.: ceftriaxona)."],
   nucleo:["Bronquiolite (VSR, lactente): tratamento de suporte; broncodilatador/corticoide não de rotina.","Pneumonia típica (2m-5a): amoxicilina 50 mg/kg/dia. Atípica (escolar, Mycoplasma): macrolídeo.","Internar se: <2 meses, tiragem, taquipneia por idade, SatO2<92%, toxemia, derrame, não aceita líquidos.","Com gravidade: internar + antibiótico parenteral."],
   pega:"Bronquiolite não responde a broncodilatador/corticoide de rotina (é suporte). Contar a FR pela idade define gravidade.",mne:"Bronquiolite = suporte; pneumonia típica = amox.",sus:"Estratégia AIDPI orienta a abordagem das doenças prevalentes na infância na APS."},
  {id:"ped-vacinas",area:"PED",nome:"Calendário vacinal",yield:3,
   questoes:["ped_vacinas_q1","ped_vacinas_q2","ped_vacinas_q3","ped_vacinas_q4"],
   fonte:"Calendário Nacional de Vacinação 2025 e Instrução Normativa do PNI (Ministério da Saúde/SVSA).",
   aula:["O calendário vacinal é um dos maiores sucessos da saúde pública brasileira (PNI), e a prova cobra tanto o QUE se dá em cada idade quanto — principalmente — as falsas contraindicações. Saber que a maioria dos 'motivos' para adiar vacina é mito evita que a criança fique desprotegida.","Ao nascer, duas vacinas: BCG (contra formas graves de tuberculose) e hepatite B. No primeiro ano concentram-se as principais: pentavalente, poliomielite, pneumocócica, rotavírus, meningocócica C, entre outras, em esquema com doses e reforços. Não é preciso decorar cada data, mas reconhecer o 'ao nascer = BCG + hepatite B' e a lógica das doses no 1º ano.","As contraindicações VERDADEIRAS são poucas: reação anafilática grave a dose anterior/componente, e — para vacinas de vírus VIVO (como tríplice viral, febre amarela) — imunossupressão importante e gestação. O resto costuma ser FALSA contraindicação.","As falsas contraindicações são a pegadinha: resfriado leve, febre baixa, uso de antibiótico, desnutrição, prematuridade (segue idade cronológica), história de alergia não anafilática — NADA disso contraindica vacinar. O raciocínio de prova: diante de uma criança com quadro leve e vacina atrasada, a conduta correta quase sempre é VACINAR (e fazer a atualização/resgate do calendário), não adiar.","Atualização recente que cai na prova: a vacina HPV passou a ser em DOSE ÚNICA para meninas e meninos de 9 a 14 anos (quadrivalente: tipos 6, 11, 16 e 18). E lembre da vacina da gestante — a dTpa, a cada gestação, protege o recém-nascido contra coqueluche nos primeiros meses de vida."],
   raciocinio:["Ao nascer, pense BCG + hepatite B.","No 1º ano, as principais vacinas em doses e reforços.","Contraindicação verdadeira: anafilaxia prévia; e vírus vivo em imunossuprimido/gestante.","Resfriado leve, febre baixa, antibiótico, prematuridade = NÃO contraindicam.","Vacina atrasada + quadro leve = vacinar e fazer resgate."],
   nucleo:["Ao nascer: BCG + hepatite B.","1º ano: pentavalente (2-4-6m), pólio, pneumo, rotavírus, meningo C. HPV: dose única dos 9-14 anos.","Contraindicação real: anafilaxia; vírus vivo em imunossuprimido/gestante.","Falsas: resfriado leve, febre baixa, ATB, prematuridade."],
   pega:"A maioria das 'contraindicações' é FALSA (resfriado leve, febre baixa não contraindicam). A verdadeira para vírus vivo é imunossupressão/gestação.",mne:"Ao nascer = BCG + Hep B.",sus:"PNI é um dos maiores programas de imunização do mundo (viés de saúde pública)."},
  {id:"ped-desenvolvimento",area:"PED",nome:"Crescimento e aleitamento",yield:2,
   questoes:["ped_desenvolvimento_q1","ped_desenvolvimento_q2","ped_desenvolvimento_q3","ped_desenvolvimento_q4"],
   fonte:"Caderneta de Saúde da Criança e AIDPI (Ministério da Saúde); marcos do desenvolvimento (SBP); recomendações de aleitamento materno (OMS/MS).",
   aula:["Acompanhar crescimento e desenvolvimento é o coração da puericultura — as consultas periódicas da criança saudável. Crescimento é o ganho de tamanho (peso, comprimento/altura, perímetro cefálico), avaliado em curvas/percentis. Desenvolvimento é a aquisição de habilidades (motoras, linguagem, social), avaliada por marcos esperados para cada idade.","Os marcos motores dão o ritmo: sustento cefálico por volta dos 3 meses, sentar sem apoio por volta dos 6, engatinhar/ficar em pé lá pelos 9, andar por volta dos 12 meses, primeiras palavras com sentido em torno de 12 meses. Não é preciso cravar datas exatas, mas reconhecer a sequência e os SINAIS DE ALERTA (atraso importante em relação ao esperado), que exigem investigação.","A alimentação tem uma regra de ouro cobrada sempre: aleitamento materno EXCLUSIVO até os 6 meses (só leite materno, sem água, chá ou outros alimentos), e complementado (mantendo o peito + introdução alimentar) até 2 anos ou mais. Oferecer água/chá antes dos 6 meses no bebê em aleitamento exclusivo é erro.","As curvas de crescimento (percentis/escore-z) mostram se a criança cresce no seu canal. Uma criança que 'cai' de canal ou está muito abaixo do esperado merece investigação. Raciocínio de prova: reconhecer marcos por idade, saber AME até 6 meses, e identificar sinais de alerta que pedem avaliação."],
   raciocinio:["Separe crescimento (tamanho, curvas) de desenvolvimento (habilidades, marcos).","Reconheça os marcos motores por idade (sentar ~6m, andar ~12m).","AME até 6 meses; complementar até 2 anos ou mais.","Não ofereça água/chá antes dos 6 meses no aleitamento exclusivo.","Atraso importante ou queda de canal = investigar."],
   nucleo:["Marcos por idade (sustento cefálico ~3m, sentar ~6m, andar ~12m).","AME até 6 meses; complementar até 2 anos ou mais.","Curvas de crescimento (percentis/escore-z).","Sinais de alerta exigem investigação."],
   pega:"Aleitamento materno EXCLUSIVO até 6 meses — nada de água/chá antes disso. Atraso importante de marco = investigar.",mne:"AME até 6 meses.",sus:"Puericultura e caderneta da criança na APS."},
  {id:"ped-exantematicas",area:"PED",nome:"Doenças exantemáticas",yield:3,
   questoes:["ped_exant_q1","ped_exant_q2","ped_exant_q3","ped_exant_q4"],
   fonte:"Guia de Vigilância em Saúde — capítulos de Sarampo e Rubéola (Ministério da Saúde/SVSA); Documento Científico de Infectologia da Sociedade Brasileira de Pediatria; Calendário Nacional de Vacinação/PNI; Portaria 204/2016 (sarampo = notificação imediata).",
   aula:["Criança com febre e manchas na pele é cena diária, e a prova cobra o reconhecimento de padrões. Cinco perguntas organizam tudo: que idade tem? Como foi o pródromo (o que veio ANTES do exantema)? Que cara tem a mancha? Como ela progride pelo corpo? E o que a febre está fazendo quando o exantema aparece? A maioria dessas doenças é viral e benigna, e o tratamento é suporte. Mas duas fogem da regra e são o alvo real da questão: o SARAMPO, que mata e é emergência de vigilância, e a ESCARLATINA, que é bacteriana e tem antibiótico.",
     "SARAMPO é o que você não pode perder. O pródromo é CATARRAL e intenso: febre alta, tosse, coriza e conjuntivite com fotofobia — a criança parece um resfriado muito feio. Nessa fase, na mucosa da bochecha, aparecem as MANCHAS DE KOPLIK: pontos brancos sobre base avermelhada, PATOGNOMÔNICAS e que surgem ANTES do exantema — quem as vê, fecha o diagnóstico. Depois vem o exantema maculopapular morbiliforme, que começa atrás da orelha e na face e desce em progressão CRANIOCAUDAL, deixando descamação furfurácea. Detalhe traiçoeiro: a febre alta PERSISTE quando o exantema aparece (nas outras viroses ela costuma ceder). As complicações matam — pneumonia é a principal causa de óbito, além de otite e encefalite. O tratamento é suporte MAIS VITAMINA A, que reduz morbimortalidade e está indicada para toda criança com sarampo.",
     "E o sarampo tem três obrigações de saúde pública que caem direto: (1) NOTIFICAÇÃO IMEDIATA, em até 24 horas, de todo caso SUSPEITO — não se espera confirmação laboratorial; (2) BLOQUEIO VACINAL dos contatos suscetíveis em até 72 horas da exposição; (3) isolamento respiratório por aerossol, porque a transmissibilidade é altíssima. Rubéola tem cara mais branda: exantema róseo e discreto, febre baixa, e a marca registrada é a LINFADENOPATIA retroauricular, occipital e cervical posterior, dolorosa. O perigo da rubéola não é a criança — é a GESTANTE: a síndrome da rubéola congênita causa surdez, catarata e cardiopatia. Rubéola também é notificação imediata.",
     "ESCARLATINA é a exceção bacteriana: causada por toxina do Streptococcus pyogenes, vem junto de faringite. O exantema é micropapular e áspero ao tato — a clássica pele em LIXA. Três sinais fecham: palidez ao redor da boca (sinal de Filatov), acentuação vermelha nas dobras (sinal de Pastia) e língua em framboesa. Depois descama em placas, em 'dedos de luva'. É a única da lista que exige ANTIBIÓTICO — penicilina —, e o motivo não é encurtar a doença: é PREVENIR A FEBRE REUMÁTICA. VARICELA (catapora) se reconhece pelo polimorfismo: mácula, pápula, vesícula e crosta convivendo ao mesmo tempo, o 'céu estrelado', com prurido intenso e distribuição centrípeta. Aciclovir fica para grupos de risco, e jamais se dá AAS (síndrome de Reye).",
     "Três viroses fecham o repertório, cada uma com um truque. EXANTEMA SÚBITO (roséola, herpes-vírus 6): lactente com febre ALTA por 3 a 5 dias que desaparece ABRUPTAMENTE — e é justo aí, com a criança já sem febre, que o exantema surge. Ou seja: sumiu a febre, apareceu a mancha. É causa frequente de convulsão febril. ERITEMA INFECCIOSO (parvovírus B19, a 'quinta doença'): face esbofeteada, seguida de exantema rendilhado/reticulado no corpo que recidiva com sol e calor; importa porque causa crise aplásica em quem tem anemia falciforme e hidropsia no feto. MÃO-PÉ-BOCA (coxsackie): vesículas exatamente onde o nome diz. Resumo do raciocínio: Koplik + catarral + craniocaudal = sarampo (notifica em 24h, dá vitamina A); pele em lixa + faringite = escarlatina (penicilina); febre que some e exantema que aparece = roséola."],
   raciocinio:["Olhe o PRÓDROMO antes da mancha: catarral intenso (tosse, coriza, conjuntivite) puxa para sarampo.",
     "Procure Koplik na mucosa jugal — patognomônico de sarampo e aparece ANTES do exantema.",
     "Veja a progressão: craniocaudal a partir da face = sarampo. Note se a febre persiste com o exantema (sarampo) ou já cedeu.",
     "Suspeitou de sarampo? NOTIFIQUE em 24h (suspeita basta), dê vitamina A, isole e faça bloqueio vacinal dos contatos em até 72h.",
     "Exantema áspero (lixa) + faringite + Filatov/Pastia + língua em framboesa = escarlatina → PENICILINA (previne febre reumática).",
     "Lactente cuja febre alta some e só então surge o exantema = exantema súbito (roséola).",
     "Lesões em vários estágios ao mesmo tempo = varicela (sem AAS). Face esbofeteada + rendilhado = eritema infeccioso."],
   nucleo:["Sarampo: pródromo catarral + Koplik (patognomônico, antes do exantema) + exantema craniocaudal + febre que PERSISTE. Complicação que mais mata: pneumonia.",
     "Sarampo: notificação IMEDIATA (24h) da SUSPEITA + vitamina A + bloqueio vacinal dos contatos em 72h + isolamento aéreo.",
     "Rubéola: exantema róseo discreto + linfadenopatia retroauricular/occipital dolorosa. Risco = síndrome da rubéola congênita.",
     "Escarlatina: única BACTERIANA (S. pyogenes) — pele em lixa, Filatov, Pastia, língua em framboesa → penicilina para prevenir febre reumática.",
     "Varicela: lesões polimórficas simultâneas ('céu estrelado'), centrípeta. Nunca AAS (Reye).",
     "Exantema súbito (HHV-6): febre alta some ABRUPTAMENTE e o exantema aparece depois. Causa convulsão febril.",
     "Eritema infeccioso (parvovírus B19): face esbofeteada + rendilhado; crise aplásica na falciforme, hidropsia fetal."],
   pega:"Koplik é patognomônico de sarampo e aparece ANTES do exantema. No sarampo a febre PERSISTE com a mancha; na roséola é o contrário — a febre some e só então o exantema surge. E notificação de sarampo é da SUSPEITA, em 24h, sem esperar laboratório.",
   mne:"Sarampo = 3 C (Cough, Coryza, Conjuntivite) + Koplik + Craniocaudal. Escarlatina = pele de Lixa → Penicilina.",
   sus:"Sarampo e rubéola são notificação imediata; PNI (tríplice viral) e bloqueio vacinal em 72h são a resposta da APS."},

  {id:"ped-ictericia",area:"PED",nome:"Icterícia neonatal",yield:3,
   questoes:["ped_ict_q1","ped_ict_q2","ped_ict_q3","ped_ict_q4"],
   fonte:"Atenção à Saúde do Recém-Nascido — Guia para os Profissionais de Saúde (Ministério da Saúde); Documento Científico de Neonatologia da Sociedade Brasileira de Pediatria — Icterícia neonatal; nomograma de Bhutani.",
   aula:["Icterícia é bilirrubina se acumulando e pintando a pele de amarelo, e no recém-nascido ela é quase a regra: aparece em cerca de 60% dos RN a termo e 80% dos prematuros. Existe uma explicação fisiológica para isso: o bebê nasce com mais hemácias e elas vivem menos (produz mais bilirrubina), o fígado ainda é imaturo na enzima que conjuga (glucuroniltransferase), e a circulação êntero-hepática reabsorve bilirrubina de volta. Ou seja, produz mais e elimina menos. Ao exame, a icterícia progride de cima para baixo, o que gerou as ZONAS DE KRAMER (1 = face; 2 = tronco até o umbigo; 3 = abdome inferior e coxas; 4 = braços e pernas; 5 = mãos e pés) — quanto mais baixo chega, maior o nível. Mas atenção: Kramer só estima; a decisão se toma com a dosagem de bilirrubina.",
     "A pergunta que a banca faz é sempre a mesma: isto é FISIOLÓGICO ou PATOLÓGICO? A icterícia fisiológica aparece DEPOIS de 24-36 horas de vida, tem pico entre o 3º e o 5º dia, é à custa de bilirrubina INDIRETA, some em 1 a 2 semanas e o bebê está bem. Já os sinais de PATOLÓGICA são: (a) icterícia nas primeiras 24 HORAS de vida — esta NUNCA é fisiológica, sem exceção, e é o item mais cobrado de todos; (b) bilirrubina subindo rápido (mais de 5 mg/dL por dia); (c) bilirrubina DIRETA elevada (isso é colestase, e colestase nunca é fisiológica); (d) icterícia que persiste além de 2 semanas no termo; (e) qualquer sinal de doença no RN.",
     "As causas seguem o relógio. Nas primeiras 24 horas, pense HEMÓLISE. Incompatibilidade Rh: mãe Rh negativo sensibilizada, filho Rh positivo — é a forma grave, com Coombs direto positivo. Incompatibilidade ABO: mãe tipo O e filho A ou B — é a MAIS COMUM e costuma ser mais branda. Somam-se esferocitose e deficiência de G6PD. Depois disso entram a fisiológica e as duas icterícias ligadas ao peito, que a prova adora trocar: a icterícia DO NÃO-ALEITAMENTO (ou 'do jejum') é PRECOCE e acontece porque o bebê está mamando pouco — a conduta é oferecer MAIS peito, corrigindo a pega, e não suspender; já a icterícia DO LEITE MATERNO é TARDIA e prolongada, com bebê ganhando peso e bem, e também não indica suspender a amamentação de rotina. Por fim, quando a bilirrubina DIRETA está alta, pense colestase — e o nome que não pode escapar é ATRESIA DE VIAS BILIARES, cujo sinal é colúria com ACOLIA FECAL (fezes esbranquiçadas). É urgência: a cirurgia de Kasai precisa acontecer preferencialmente antes das 8 semanas de vida.",
     "Por que tratar? Porque a bilirrubina INDIRETA é lipossolúvel, atravessa a barreira hematoencefálica e se deposita nos núcleos da base. Primeiro vem a encefalopatia bilirrubínica aguda (letargia, hipotonia, sucção fraca, depois hipertonia, opistótono, choro agudo) e, se não se age, instala-se o KERNICTERUS: sequela permanente com paralisia cerebral atetoide, surdez neurossensorial e paralisia do olhar vertical. Kernicterus é uma tragédia inteiramente EVITÁVEL — e é exatamente por isso que existe fototerapia.",
     "O tratamento é a FOTOTERAPIA: a luz azul transforma a bilirrubina em fotoisômeros hidrossolúveis, que o bebê elimina SEM precisar conjugar no fígado. A indicação não é um número fixo decorado: depende das HORAS DE VIDA, da idade gestacional e dos fatores de risco, lidos em nomograma (Bhutani). Se os níveis são muito altos ou já há sinais de encefalopatia, escala-se para EXSANGUINEOTRANSFUSÃO; na doença hemolítica isoimune usa-se imunoglobulina. Três pegadinhas finais: fototerapia NÃO trata icterícia por bilirrubina DIRETA (colestase) — não resolve e ainda causa a síndrome do bebê bronzeado, então diante de BD alta o caminho é investigar, não iluminar; não se suspende aleitamento de rotina; e icterícia nas primeiras 24 horas manda investigar, sempre."],
   raciocinio:["Pergunte primeiro: com quantas HORAS de vida apareceu? Antes de 24h = SEMPRE patológica → investigue hemólise.",
     "Estime a extensão por Kramer, mas confirme com a dosagem de bilirrubina.",
     "Separe INDIRETA de DIRETA: direta alta = colestase (nunca fisiológica) → pense atresia de vias biliares, procure ACOLIA fecal.",
     "Nas primeiras 24h, investigue incompatibilidade Rh (grave, Coombs +) e ABO (mãe O, filho A/B — a mais comum).",
     "Icterícia precoce com bebê mamando mal = do não-aleitamento → ofereça MAIS peito, não suspenda.",
     "Decida a fototerapia pelo nomograma (horas de vida + IG + fatores de risco), não por número decorado.",
     "Níveis muito altos ou encefalopatia = exsanguineotransfusão. O que se quer evitar é o KERNICTERUS."],
   nucleo:["Icterícia nas primeiras 24 HORAS de vida NUNCA é fisiológica → investigar hemólise.",
     "Fisiológica: após 24-36h, pico no 3º-5º dia, bilirrubina INDIRETA, RN bem, resolve em 1-2 semanas.",
     "Zonas de Kramer (1 face → 5 mãos e pés) estimam; a bilirrubina sérica decide.",
     "Hemólise: Rh (mãe Rh−, Coombs direto +, grave) e ABO (mãe O / filho A ou B — a mais comum, mais branda).",
     "Bilirrubina DIRETA alta = colestase → atresia de vias biliares (colúria + ACOLIA fecal). Kasai preferencialmente antes de 8 semanas.",
     "Icterícia do não-aleitamento (precoce, mama pouco → ofertar mais peito) x do leite materno (tardia, prolongada, bebê bem). Não suspender aleitamento de rotina.",
     "Fototerapia por nomograma (horas de vida + IG + risco); exsanguineotransfusão nos níveis muito altos/encefalopatia. Evitar o KERNICTERUS (paralisia cerebral atetoide, surdez)."],
   pega:"Icterícia nas primeiras 24h nunca é fisiológica. E fototerapia NÃO serve para bilirrubina DIRETA (colestase) — nesse caso investiga-se atresia de vias biliares, e acolia fecal é o sinal que não pode passar.",
   mne:"Kramer desce (1 face → 5 mãos/pés). BI = fototerapia. BD = investiga (atresia). <24h = patológica.",
   sus:"Triagem neonatal e vigilância da icterícia na maternidade e na primeira consulta da APS; Kasai depende de referência precoce."},

  {id:"ped-febre",area:"PED",nome:"Febre sem foco e convulsão febril",yield:3,
   questoes:["ped_febre_q1","ped_febre_q2","ped_febre_q3","ped_febre_q4"],
   fonte:"Documento Científico da Sociedade Brasileira de Pediatria — Febre sem sinais localizatórios e Convulsão febril; estratégia AIDPI (Ministério da Saúde); protocolos Rochester/Step-by-Step.",
   aula:["Febre sem sinais localizatórios (FSSL) é a febre de poucos dias em que a anamnese e o exame não acham a origem. A imensa maioria é viral e passa sozinha — mas o motivo de existir protocolo é o medo da INFECÇÃO BACTERIANA INVASIVA (bacteremia, meningite) e, principalmente, da INFECÇÃO DO TRATO URINÁRIO, que é a causa bacteriana mais comum de febre sem foco no lactente e não dá sintoma nenhum nessa idade. Regra que salva questão: criança pequena com febre sem foco, peça URINA. Ela não vai te contar que dói para urinar.",
     "Quem manda na conduta é a IDADE, e a régua é rígida no começo. Recém-nascido (menos de 28 dias) com febre ≥ 38°C: INTERNA, sempre. Faz investigação completa — hemograma, hemocultura, urina com urocultura e LÍQUOR — e inicia antibiótico empírico. Não existe neonato febril de baixo risco para mandar para casa; o sistema imune é imaturo, a apresentação é pobre e ele despenca rápido. De 1 a 3 meses: aplica-se protocolo (aparência clínica + exames como leucograma, PCR/procalcitonina e urina), e só os de baixo risco, por critério, podem ser observados. Acima de 3 meses, vacinado e com bom estado geral: pode-se observar e tratar conforme o foco, mantendo a urina no radar quando não há foco.",
     "O termômetro engana; quem informa gravidade é o ESTADO GERAL. Os sinais de alerta (toxemia) são: letargia ou irritabilidade que não cede ao colo, perfusão ruim (enchimento capilar lento, extremidades frias), taquipneia, gemência, recusa alimentar, hipoatividade. Guarde a comparação que a banca gosta: uma criança com 40°C brincando e interagindo preocupa MENOS que uma com 38°C prostrada e gemente. E há um par que é emergência absoluta: FEBRE + PETÉQUIAS é meningococcemia até prova em contrário — antibiótico imediato, não se espera exame.",
     "Sobre tratar a febre em si, o conceito mudou e cai bastante: o antitérmico serve para CONFORTO, não para 'baixar o número'. A febre é resposta de defesa e não causa dano cerebral — a mãe teme, mas o dado é esse. Usa-se paracetamol, dipirona ou ibuprofeno; não se alterna antitérmicos de rotina (aumenta erro de dose sem ganho), banho frio/compressa gelada não é conduta, e AAS está proibido pela síndrome de Reye. Tratar o desconforto, hidratar e vigiar sinais de alerta é o pacote.",
     "A CONVULSÃO FEBRIL é o desdobramento clássico: crise associada a febre, dos 6 meses aos 5 anos, sem infecção do sistema nervoso central e sem causa metabólica. Ela se divide em duas, e essa divisão é toda a questão. SIMPLES: tônico-clônica GENERALIZADA, dura menos de 15 minutos, ocorre UMA vez em 24 horas e a criança volta ao normal depois. É benigna: NÃO exige punção lombar de rotina, NÃO exige EEG nem tomografia, NÃO vira epilepsia na grande maioria, e o tratamento é orientar e acalmar a família. COMPLEXA: focal, ou dura mais de 15 minutos, ou repete dentro de 24 horas, ou deixa déficit — essa investiga. A punção lombar entra quando há sinais meníngeos, quando o lactente (sobretudo abaixo de 12 meses) tem quadro duvidoso, ou quando o uso prévio de antibiótico pode estar mascarando meningite. E não se usa anticonvulsivante contínuo na convulsão febril simples."],
   raciocinio:["Febre sem foco em lactente? PEÇA URINA — ITU é a causa bacteriana mais comum e é silenciosa nessa idade.",
     "Olhe a idade primeiro: <28 dias com febre ≥38°C = internar + investigação completa (inclui LÍQUOR) + antibiótico empírico, sem exceção.",
     "1-3 meses: protocolo com aparência + exames; só baixo risco observa. >3 meses vacinado e bem: observar e tratar o foco.",
     "Avalie o ESTADO GERAL, não a altura da febre: letargia, perfusão ruim, gemência, taquipneia = toxemia.",
     "Febre + petéquias = meningococcemia até prova em contrário → antibiótico já.",
     "Antitérmico é para CONFORTO. Sem alternar de rotina, sem banho frio, nunca AAS.",
     "Convulsão febril: generalizada, <15 min, única em 24h, recupera bem = SIMPLES → sem punção/EEG/TC de rotina, orientar a família. Focal, >15 min ou repetida = COMPLEXA → investigar."],
   nucleo:["FSSL: maioria viral, mas ITU é a causa bacteriana mais comum no lactente — sempre pedir urina.",
     "<28 dias com febre ≥38°C: internação + hemograma/hemocultura + urina/urocultura + LÍQUOR + ATB empírico. Não existe neonato febril de baixo risco.",
     "1-3 meses: protocolo (aparência + exames). >3 meses vacinado e bem: observar.",
     "Gravidade = estado geral (letargia, perfusão, gemência), não a altura da febre. Febre + petéquias = meningococcemia.",
     "Antitérmico para conforto; febre não causa dano cerebral. Não alternar de rotina; AAS proibido (Reye).",
     "Convulsão febril SIMPLES: 6m-5a, generalizada, <15 min, única em 24h, recupera → benigna, sem punção lombar/EEG/TC de rotina, sem anticonvulsivante contínuo.",
     "COMPLEXA: focal, >15 min, repete em 24h ou deixa déficit → investigar. Punção se sinais meníngeos, lactente duvidoso ou ATB prévio mascarando."],
   pega:"Convulsão febril SIMPLES não pede punção lombar, EEG nem tomografia de rotina — o tratamento é orientar a família. E gravidade se mede pelo estado geral: 40°C brincando preocupa menos que 38°C prostrado.",
   mne:"Febre sem foco em lactente = peça URINA. Convulsão febril simples: Generalizada, <15 min, Única em 24h.",
   sus:"AIDPI orienta a busca de sinais gerais de perigo na APS; acolhimento com classificação de risco na porta de entrada."},

  {id:"ped-violencia",area:"PED",nome:"Violência contra a criança",yield:3,
   questoes:["ped_viol_q1","ped_viol_q2","ped_viol_q3","ped_viol_q4"],
   fonte:"Linha de Cuidado para a Atenção Integral à Saúde de Crianças, Adolescentes e suas Famílias em Situação de Violências (Ministério da Saúde); Estatuto da Criança e do Adolescente — Lei 8.069/1990 (arts. 13 e 245); Lei 13.010/2014 (Lei Menino Bernardo); Portaria 204/2016 (violência = notificação imediata); Norma Técnica de Atenção às Pessoas em Situação de Violência Sexual (MS).",
   aula:["Violência contra criança é problema de saúde, não só de polícia — e a prova cobra porque o médico é, muitas vezes, o único adulto de fora que vê aquele corpo. As formas são cinco: física, psicológica, sexual, NEGLIGÊNCIA (a mais frequente de todas, e a mais invisível) e a síndrome de Munchausen por procuração, em que o cuidador inventa ou provoca doença na criança. A porta de entrada costuma ser banal: uma consulta por queda, uma queixa vaga, um atraso de desenvolvimento.",
     "O que acende o alerta não é a lesão em si, é a INCOMPATIBILIDADE. Lesão que não combina com a história contada, ou que não combina com o estágio de desenvolvimento da criança — um bebê que ainda não anda não faz hematoma de canela, e não 'cai do sofá' fraturando o fêmur. Some-se: histórias que mudam a cada vez que se pergunta, atraso em procurar atendimento, lesões em VÁRIOS estágios de cicatrização (indicando repetição no tempo), marcas com formato de objeto (fivela, cinto, mão), queimaduras em 'luva' ou em 'meia' com limite nítido (imersão forçada), e fraturas de ossos longos, de arcos costais ou metafisárias em lactente. Há ainda um trio que fecha diagnóstico: hemorragias retinianas + hematoma subdural + ausência de trauma que explique = SÍNDROME DO BEBÊ SACUDIDO.",
     "Agora a parte que mais cai, e onde o candidato erra por excesso de zelo. Diante de SUSPEITA — apenas suspeita, sem nenhuma prova — a lei obriga a NOTIFICAÇÃO COMPULSÓRIA e IMEDIATA, em até 24 horas, por dois caminhos que se somam: a ficha de notificação (SINAN) E a comunicação ao CONSELHO TUTELAR. É o artigo 13 do ECA. Não notificar é infração prevista no artigo 245 do ECA, e o médico responde por isso. Guarde a frase: notifica-se a SUSPEITA, não a certeza. 'Aguardar confirmação para notificar' é a alternativa errada clássica. E não é papel do médico investigar o caso, interrogar a criança em detalhes ou confrontar o suposto agressor — o papel é acolher, cuidar, DOCUMENTAR bem no prontuário e notificar. Quem investiga é a rede de proteção.",
     "A VIOLÊNCIA SEXUAL tem regras próprias e igualmente cobradas. O atendimento é URGÊNCIA e não depende de boletim de ocorrência, nem de autorização judicial, nem de perícia prévia — exigir B.O. para atender é erro grave e ilegal. As profilaxias correm contra o relógio: PEP para HIV em até 72 horas (por 28 dias); profilaxia das demais ISTs; contracepção de emergência em até 5 dias para meninas após a menarca; e imunização/imunoglobulina para hepatite B conforme o caso. Ainda: a interrupção da gestação nos casos previstos em lei (gravidez resultante de estupro) TAMBÉM não exige boletim de ocorrência nem autorização judicial. Além disso, no Brasil, sexo com menor de 14 anos é estupro de vulnerável — a notificação é obrigatória independentemente de a adolescente relatar consentimento.",
     "A postura fecha o tema. O sigilo médico CEDE diante da necessidade de proteger a criança — proteger a vida está acima de manter segredo, e a notificação não é quebra indevida de sigilo, é dever legal. Registre no prontuário de forma objetiva e detalhada: descreva as lesões (localização, formato, coloração, estágio), transcreva o que foi dito entre aspas, sem adjetivar nem julgar a família — esse prontuário pode ser o documento que protege aquela criança depois. E acione a rede: saúde, Conselho Tutelar e assistência social trabalham juntos. Resumindo o que a banca quer ouvir: suspeitou, notifica em 24h (SINAN + Conselho Tutelar), atende sem exigir B.O., faz as profilaxias no tempo certo e documenta tudo."],
   raciocinio:["Desconfie da INCOMPATIBILIDADE: a lesão combina com a história e com o que a criança já consegue fazer sozinha?",
     "Procure os marcadores: lesões em vários estágios de cicatrização, marca de objeto, queimadura em luva/meia, fratura em lactente, demora em buscar atendimento, história que muda.",
     "Hemorragia retiniana + hematoma subdural sem trauma explicado = síndrome do bebê sacudido.",
     "SUSPEITOU? Notifique em até 24h — ficha (SINAN) E Conselho Tutelar. Não espere confirmação; a suspeita basta.",
     "Não interrogue nem confronte: acolha, cuide, documente objetivamente e acione a rede de proteção.",
     "Violência sexual: atenda JÁ, sem exigir B.O. PEP até 72h (28 dias), profilaxia de IST, contracepção de emergência até 5 dias, hepatite B.",
     "Lembre: sigilo cede à proteção da criança; notificar é dever legal (ECA art. 13; não notificar = infração do art. 245)."],
   nucleo:["Formas: física, psicológica, sexual, NEGLIGÊNCIA (a mais frequente) e Munchausen por procuração.",
     "Alarme = incompatibilidade entre lesão, história e estágio de desenvolvimento; lesões em vários estágios; marca de objeto; queimadura em luva/meia; fratura em lactente.",
     "Bebê sacudido: hemorragias retinianas + hematoma subdural sem trauma que explique.",
     "Notificação COMPULSÓRIA e IMEDIATA (24h) da SUSPEITA: ficha no SINAN + Conselho Tutelar (ECA art. 13). Não notificar é infração (art. 245).",
     "O médico não investiga nem confronta: acolhe, cuida, documenta objetivamente e aciona a rede.",
     "Violência sexual: atendimento é urgência e NÃO exige B.O. nem autorização judicial. PEP HIV até 72h (28 dias); IST; contracepção de emergência até 5 dias; hepatite B. Interrupção legal da gestação também não exige B.O.",
     "Sexo com menor de 14 anos = estupro de vulnerável; notifica-se independentemente de relato de consentimento."],
   pega:"Notifica-se a SUSPEITA, em 24h — esperar confirmação é erro e é infração ao ECA. E nunca exigir boletim de ocorrência para atender violência sexual: o atendimento e as profilaxias são urgência.",
   mne:"Suspeitou = notificou (SINAN + Conselho Tutelar, 24h). Violência sexual: PEP 72h · contracepção 5 dias · sem B.O.",
   sus:"Linha de cuidado das violências; notificação imediata (Portaria 204/2016) e articulação com Conselho Tutelar e assistência social."},
  {id:"ped-reanimacao",area:"PED",nome:"Reanimação neonatal",yield:3,
   questoes:["ped_rean_q1","ped_rean_q2","ped_rean_q3","ped_rean_q4"],
   fonte:"Diretrizes de Reanimação Neonatal da Sociedade Brasileira de Pediatria — Programa de Reanimação Neonatal (PRN/SBP); recomendações do ILCOR/AHA.",
   aula:["Cerca de 10% dos recém-nascidos precisam de alguma ajuda para iniciar a respiração, e apenas 1% precisa de manobras avançadas — mas como nascem milhões, esse 1% é muita gente, e a diferença entre viver bem e ficar sequelado se decide em minutos. Por isso tudo começa ANTES do nascimento: anamnese materna, material testado e equipe preparada. E ao nascer, você faz TRÊS perguntas: a gestação é a termo? o bebê está respirando ou chorando? o tônus está bom? Se a resposta for SIM às três, esse RN não precisa de nada além do que a natureza pede: fica com a mãe, em contato pele a pele, com CLAMPEAMENTO TARDIO do cordão (1 a 3 minutos) e cuidados de rotina junto dela. Se qualquer resposta for NÃO, ele vai para a mesa de reanimação.",
     "Na mesa, os PASSOS INICIAIS têm 30 segundos e uma sequência: prover CALOR (a hipotermia mata — a meta é manter entre 36,5 e 37,5°C; no prematuro abaixo de 34 semanas usa-se saco plástico e touca, sem secar), POSICIONAR a cabeça em leve extensão, ASPIRAR apenas SE necessário (boca antes das narinas — aspirar de rotina é erro, provoca bradicardia reflexa e apneia), SECAR e ESTIMULAR. Feito isso, você reavalia — e o que você avalia define tudo.",
     "O sinal que comanda a reanimação neonatal é a FREQUÊNCIA CARDÍACA. Se a FC está abaixo de 100 bpm, ou se há apneia ou respiração irregular, a conduta é VENTILAÇÃO COM PRESSÃO POSITIVA (VPP) — e aqui está o conceito central do tema: a VPP é a manobra MAIS IMPORTANTE da reanimação neonatal. O problema do bebê que não vai bem ao nascer é quase sempre PULMONAR (ele não abriu o pulmão, não fez a transição), e não cardíaco — ventile e o coração responde. A VPP deve começar dentro do primeiro minuto de vida, o chamado MINUTO DE OURO. A concentração de oxigênio inicial é AR AMBIENTE (21%) para o RN de 34 semanas ou mais, e 30% para o prematuro abaixo de 34 semanas — começar com oxigênio a 100% é conduta ultrapassada. Monitora-se com oxímetro no membro superior DIREITO (posição pré-ductal) e com monitor cardíaco, que é mais fidedigno que a ausculta.",
     "Se, após 30 segundos de VPP EFETIVA, a FC permanece abaixo de 60 bpm, entra a MASSAGEM CARDÍACA — mas antes disso a regra de ouro é CHECAR A TÉCNICA da ventilação (posição da cabeça, vedação da máscara, permeabilidade, pressão), porque a causa mais comum de falha é ventilação inadequada, não coração ruim. A massagem se faz no terço inferior do esterno, com a técnica dos DOIS POLEGARES, coordenada com a ventilação na relação 3:1 — três compressões para uma ventilação, totalizando 120 eventos por minuto. Nesse momento indica-se a intubação e sobe-se o oxigênio para 100%. Se, após 60 segundos de massagem bem coordenada, a FC continua abaixo de 60, entra a ADRENALINA, preferencialmente por via ENDOVENOSA (cateter venoso umbilical). Considera-se expansão de volume com soro fisiológico 10 mL/kg se houver sinais de hipovolemia (palidez, má perfusão, história de perda sanguínea).",
     "Dois pontos finais que a banca adora. O APGAR: ele é avaliado no 1º e no 5º minuto e serve para DESCREVER a condição e a resposta às manobras — mas ele NÃO determina a conduta, e a reanimação JAMAIS espera o Apgar do primeiro minuto para começar. Quem decide é a tríade das três perguntas e depois a frequência cardíaca. E o LÍQUIDO MECONIAL, cuja conduta MUDOU: não se aspira mais a orofaringe durante o parto (intraparto), nem se faz aspiração traqueal de ROTINA no RN não vigoroso. Hoje, diante de mecônio, o bebê não vigoroso recebe os passos iniciais e, se necessário, VPP — porque o que ele precisa é ventilar, e o tempo gasto aspirando é tempo sem oxigênio."],
   raciocinio:["Ao nascer, faça as 3 perguntas: a termo? respirando/chorando? tônus bom? Três SIM = fica com a mãe, pele a pele, clampeamento tardio (1-3 min).",
     "Qualquer NÃO = mesa: passos iniciais em 30 segundos — calor, posicionar, aspirar SE necessário, secar, estimular.",
     "Reavalie pela FREQUÊNCIA CARDÍACA: FC <100 ou apneia/respiração irregular → VPP, dentro do MINUTO DE OURO.",
     "Oxigênio inicial: ar ambiente (21%) se ≥34 semanas; 30% se <34 semanas. Oxímetro no membro superior DIREITO.",
     "FC <60 após 30s de VPP efetiva? CHEQUE A TÉCNICA primeiro (a falha mais comum é ventilação inadequada), depois inicie massagem 3:1 (120 eventos/min), intube e suba o O2 para 100%.",
     "FC <60 após 60s de massagem coordenada → ADRENALINA endovenosa (cateter umbilical). Hipovolemia? SF 0,9% 10 mL/kg.",
     "NÃO espere o Apgar para reanimar — ele descreve, não decide.",
     "Mecônio: não aspirar intraparto nem traqueia de rotina — passos iniciais e VPP se não vigoroso."],
   nucleo:["3 perguntas ao nascer: a termo? respirando/chorando? tônus bom? Três SIM = colo da mãe + clampeamento TARDIO (1-3 min).",
     "Passos iniciais (30s): calor (36,5-37,5; <34 sem = saco plástico e touca), posicionar, aspirar SÓ se necessário (aspiração de rotina causa bradicardia), secar, estimular.",
     "A FREQUÊNCIA CARDÍACA comanda. FC <100 ou apneia = VPP — a manobra MAIS IMPORTANTE (o problema é pulmonar, não cardíaco). Iniciar no MINUTO DE OURO.",
     "O2 inicial: 21% (ar ambiente) se ≥34 semanas; 30% se <34 semanas. Oxímetro em MSD (pré-ductal) + monitor cardíaco.",
     "FC <60 após VPP efetiva: checar TÉCNICA da ventilação (falha mais comum), intubar, O2 100% e massagem 3:1 (120 eventos/min), dois polegares no terço inferior do esterno.",
     "FC <60 após 60s de massagem: ADRENALINA endovenosa (cateter umbilical). Expansão com SF 10 mL/kg se hipovolemia.",
     "APGAR (1º e 5º min) descreve a resposta — NÃO define conduta e a reanimação não espera por ele.",
     "Mecônio: aspiração intraparto e aspiração traqueal de rotina foram ABANDONADAS — passos iniciais + VPP se não vigoroso."],
   pega:"A VPP é a manobra mais importante — e a causa mais comum de falha é técnica ruim de ventilação, então antes de massagear, CHECAR a ventilação. O Apgar não decide conduta (não espere por ele). E não se aspira mecônio de rotina.",
   mne:"3 perguntas → passos iniciais (30s) → FC<100 = VPP (minuto de ouro) → FC<60 = massagem 3:1 → FC<60 = adrenalina.",
   sus:"Programa de Reanimação Neonatal da SBP treina as maternidades do SUS; asfixia perinatal pesa no componente NEONATAL da mortalidade infantil."},

  {id:"ped-triagem",area:"PED",nome:"Triagem neonatal e cuidados com o RN",yield:3,
   questoes:["ped_triag_q1","ped_triag_q2","ped_triag_q3","ped_triag_q4"],
   fonte:"Programa Nacional de Triagem Neonatal (Ministério da Saúde); Lei 14.154/2021 (ampliação do teste do pezinho em etapas); Lei 13.002/2014 (teste da linguinha); Caderneta da Criança (MS); Sociedade Brasileira de Pediatria.",
   aula:["A maternidade é a janela mais barata e mais eficaz da saúde pública: em poucos dias, alguns testes simples detectam doenças que, se descobertas depois, já deixaram sequela irreversível. São os 'testes' que a prova cobra pelo nome popular, e o que você precisa saber de cada um é: QUANDO se faz e O QUE detecta.",
     "TESTE DO PEZINHO (triagem biológica): colhido por punção do calcanhar, idealmente entre o 3º e o 5º DIA de vida. O prazo tem razão: colher cedo demais gera falso-negativo (a criança precisa ter recebido proteína/leite para o fenilalanina subir, e o TSH tem um pico fisiológico logo após o nascimento), e colher tarde demais perde a janela de tratamento. A versão clássica do SUS detecta seis doenças: fenilcetonúria, hipotireoidismo congênito, doença falciforme e outras hemoglobinopatias, fibrose cística, hiperplasia adrenal congênita e deficiência de biotinidase. A Lei 14.154/2021 ampliou o painel para mais de 50 doenças, com implantação PROGRESSIVA em 5 ETAPAS — ou seja, a cobertura varia conforme o estado e o momento; confira o que já está vigente.",
     "TESTE DA ORELHINHA (triagem auditiva, por emissões otoacústicas): feito antes da alta, ou até o primeiro mês. Detecta surdez — e importa porque o cérebro tem janela para adquirir linguagem: identificar cedo muda a vida. TESTE DO OLHINHO (reflexo vermelho): feito antes da alta e REPETIDO nas consultas de puericultura. Rastreia catarata congênita, retinoblastoma e glaucoma congênito. E a regra é dura: reflexo vermelho ausente, assimétrico ou alterado = encaminhamento URGENTE ao oftalmologista — no retinoblastoma, tempo é olho e é vida.",
     "TESTE DO CORAÇÃOZINHO (oximetria de pulso): este tem os números que a banca cobra. É feito entre 24 e 48 HORAS de vida, em recém-nascidos com 34 semanas ou mais, medindo a saturação em DOIS pontos: membro superior DIREITO (pré-ductal) e um membro INFERIOR (pós-ductal). O teste é ALTERADO se a saturação for menor que 95% em qualquer um dos locais, OU se houver diferença de 3% ou mais entre eles. Diante de alteração: repete-se em 1 hora; se persistir, faz-se ECOCARDIOGRAMA dentro de 24 horas. O objetivo é pegar a cardiopatia congênita CRÍTICA antes que o canal arterial feche e o bebê colapse em casa. Completa a lista o TESTE DA LINGUINHA (avaliação do frênulo lingual, Lei 13.002/2014).",
     "Além dos testes, os cuidados de rotina do recém-nascido têm cinco itens que caem: VITAMINA K intramuscular (previne a doença hemorrágica do RN), CREDEIZAÇÃO (nitrato de prata ou eritromicina nos olhos, profilaxia da oftalmia neonatal gonocócica), vacinas BCG e hepatite B ainda na maternidade, contato pele a pele com aleitamento na PRIMEIRA HORA, e clampeamento oportuno do cordão. Na alta, orienta-se a PRIMEIRA CONSULTA na atenção primária até o 7º dia de vida (a 'Primeira Semana de Saúde Integral'), quando se avalia peso (a perda fisiológica vai até 10%, com recuperação até o 15º dia), icterícia, mamada e sinais de alerta. É essa consulta precoce que transforma a triagem em desfecho: o teste só serve se alguém buscar o resultado."],
   raciocinio:["PEZINHO: entre o 3º e o 5º dia (nem antes — falso-negativo —, nem tarde). Detecta 6 doenças no painel clássico do SUS; Lei 14.154/2021 amplia para 50+ em 5 etapas progressivas.",
     "ORELHINHA (emissões otoacústicas): antes da alta / até 1 mês — detecta surdez (janela da linguagem).",
     "OLHINHO (reflexo vermelho): antes da alta e repetido nas consultas — catarata, retinoblastoma, glaucoma. Alterado = encaminhamento URGENTE.",
     "CORAÇÃOZINHO: 24-48h de vida, RN ≥34 semanas; SatO2 em MSD (pré-ductal) e um MI (pós-ductal).",
     "Alterado se: SatO2 <95% em qualquer local OU diferença ≥3% entre eles → repetir em 1h → persistiu = ECOCARDIOGRAMA em 24h.",
     "Cuidados de rotina: vitamina K IM, credeização, BCG + hepatite B, pele a pele e aleitamento na 1ª hora, clampeamento oportuno.",
     "Agende a primeira consulta na APS até o 7º dia (Primeira Semana de Saúde Integral): peso, icterícia, mamada, sinais de alerta."],
   nucleo:["PEZINHO: 3º ao 5º dia. Painel clássico do SUS = fenilcetonúria, hipotireoidismo congênito, falciforme/hemoglobinopatias, fibrose cística, hiperplasia adrenal congênita, deficiência de biotinidase. Lei 14.154/2021 amplia para 50+ em 5 etapas.",
     "ORELHINHA: antes da alta/até 1 mês — surdez.",
     "OLHINHO (reflexo vermelho): antes da alta e nas consultas — catarata congênita, RETINOBLASTOMA, glaucoma. Alterado = urgência.",
     "CORAÇÃOZINHO: 24-48h, RN ≥34 semanas, SatO2 no MSD (pré-ductal) e em um MI (pós-ductal).",
     "Alterado: SatO2 <95% em qualquer local OU diferença ≥3% → repetir em 1h → persistindo, ECO em 24h. Detecta cardiopatia congênita CRÍTICA.",
     "LINGUINHA: avaliação do frênulo (Lei 13.002/2014).",
     "Rotina do RN: vitamina K IM (doença hemorrágica), credeização (oftalmia gonocócica), BCG + hepatite B, pele a pele/aleitamento na 1ª hora.",
     "Primeira consulta na APS até o 7º dia; perda ponderal fisiológica até 10%, recuperada até o 15º dia."],
   pega:"O pezinho não é 'quanto antes melhor': colhido antes de 48h dá falso-negativo — o ideal é entre o 3º e o 5º dia. O coraçãozinho é 24-48h e compara membro superior DIREITO com um inferior (alterado: <95% ou diferença ≥3%). E reflexo vermelho alterado é URGÊNCIA (retinoblastoma).",
   mne:"Pezinho 3º-5º dia · Coraçãozinho 24-48h (MSD x MI; <95% ou dif ≥3%) · Olhinho alterado = urgência · Orelhinha até 1 mês.",
   sus:"Programa Nacional de Triagem Neonatal é 100% SUS; a Lei 14.154/2021 amplia o painel em etapas e a APS fecha o ciclo buscando o resultado."},

  {id:"ped-cardiopatias",area:"PED",nome:"Cardiopatias congênitas",yield:2,
   questoes:["ped_cardio_q1","ped_cardio_q2","ped_cardio_q3","ped_cardio_q4"],
   fonte:"Documento Científico de Cardiologia da Sociedade Brasileira de Pediatria; Diretriz Brasileira de Cardiopatias Congênitas (Sociedade Brasileira de Cardiologia); protocolo do teste do coraçãozinho (Ministério da Saúde).",
   aula:["Cardiopatia congênita se organiza por uma pergunta simples: o bebê fica AZUL ou não? As ACIANÓTICAS têm shunt da esquerda para a direita — sangue já oxigenado voltando para o pulmão —, o que gera HIPERFLUXO pulmonar e insuficiência cardíaca, mas não cianose. As principais: CIV (comunicação interventricular), que é a cardiopatia congênita mais comum de todas; CIA; PCA (persistência do canal arterial); e coarctação de aorta. O quadro típico não é azul, é de IC no lactente: taquipneia, sudorese e cansaço DURANTE A MAMADA (o bebê 'não dá conta' de mamar — é o esforço dele), baixo ganho de peso, hepatomegalia e sopro.",
     "As CIANÓTICAS têm shunt da direita para a esquerda ou mistura: sangue sem oxigênio cai na circulação sistêmica. Guarde-as pelos '5 T': Tetralogia de Fallot (a cianótica mais comum no geral), Transposição das grandes artérias (a que mais se apresenta já no período NEONATAL), Tronco arterioso, atresia Tricúspide e drenagem anômala Total de veias pulmonares. E existe um teste clássico para separar cianose cardíaca de pulmonar: o TESTE DA HIPERÓXIA — ofereça oxigênio a 100%; se a saturação/PaO2 melhora bem, o problema é PULMONAR; se NÃO melhora, é CARDÍACO, porque no shunt o sangue simplesmente desvia do pulmão e nenhum oxigênio ofertado alcança aquele sangue.",
     "Agora o conceito que salva vida e é a estrela da prova: as cardiopatias DUCTO-DEPENDENTES. Algumas malformações só são compatíveis com a vida enquanto o CANAL ARTERIAL estiver aberto, porque é ele que faz o sangue chegar onde precisa. O canal fecha fisiologicamente nos primeiros dias — e é aí que o bebê, que estava bem na maternidade, DESCOMPENSA de forma súbita e dramática: choque, cianose intensa, acidose, muitas vezes já em casa. São exemplos a transposição das grandes artérias, a atresia pulmonar, a coarctação grave e a síndrome de hipoplasia do coração esquerdo. E a conduta que a banca quer: PROSTAGLANDINA E1 para MANTER O CANAL ABERTO, mais estabilização e transferência para centro terciário. Ou seja, diante de um recém-nascido que colapsa nos primeiros dias de vida sem explicação, pense ducto-dependente e ABRA o canal — não feche.",
     "Dois exames de beira de leito valem ouro. Na COARCTAÇÃO DE AORTA, o estreitamento fica depois dos vasos do braço: por isso há diferença de pulsos e de pressão entre membros SUPERIORES e INFERIORES, com pulsos FEMORAIS diminuídos ou ausentes. Palpar os pulsos femorais de todo recém-nascido é gesto simples que faz o diagnóstico. Na TETRALOGIA DE FALLOT (CIV + estenose pulmonar + dextroposição da aorta + hipertrofia de ventrículo direito), existe a crise hipoxêmica — o 'tet spell': a criança fica subitamente muito cianótica e agitada, tipicamente ao chorar ou se esforçar. A conduta tem uma manobra característica: posição GENUPEITORAL (joelhos no peito), que aumenta a resistência sistêmica e reduz o shunt, somada a oxigênio, morfina e volume.",
