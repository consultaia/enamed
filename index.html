     "O diagnóstico mudou e a prova cobra a mudança. O exame INICIAL de escolha é o TESTE RÁPIDO MOLECULAR (TRM-TB / Xpert MTB/RIF): em cerca de 2 horas detecta o DNA do bacilo e, de quebra, já informa se há resistência à RIFAMPICINA. A baciloscopia (pesquisa de BAAR no escarro) continua tendo dois papéis: onde o TRM não está disponível, e principalmente para o CONTROLE MENSAL do tratamento. A cultura com teste de sensibilidade é indicada em situações especiais: retratamento, suspeita de resistência, pessoas vivendo com HIV, populações vulneráveis e casos paucibacilares. A radiografia de tórax complementa (o clássico é cavitação em ápice). E uma regra que não se negocia: TODO paciente com tuberculose deve ser testado para HIV.",
     "O tratamento da TB sensível é o esquema básico, o famoso RIPE, em dose fixa combinada: 2 meses de RHZE (Rifampicina, isoniazida [H], Pirazinamida, Etambutol) na fase intensiva, seguidos de 4 meses de RH na fase de manutenção — total de 6 meses. O tratamento é gratuito e feito preferencialmente sob TDO (tratamento diretamente observado), porque o abandono é o maior inimigo: gera recaída e resistência. Os efeitos adversos têm dicas mnemônicas úteis: etambutol causa neurite óptica (afeta o OLHO, avalie a visão de cores); isoniazida causa neuropatia periférica (previne-se com piridoxina); pirazinamida eleva o ácido úrico; e rifampicina deixa a urina/secreções ALARANJADAS — isso NÃO é motivo para suspender, mas exige avisar o paciente e lembrar que ela reduz a eficácia do anticoncepcional oral. Hepatotoxicidade é o efeito grave a monitorar.",
     "Ao lado da doença ativa existe a INFECÇÃO LATENTE (ILTB): a pessoa carrega o bacilo dormente, não está doente e não transmite — mas pode adoecer no futuro, e tratar isso evita o caso novo. Rastreia-se em contatos, pessoas vivendo com HIV, candidatos a anti-TNF, transplantados, silicose. O diagnóstico é pela prova tuberculínica (PT) ou IGRA, SEMPRE depois de excluir doença ativa (clínica + radiografia). Atenção ao ponto que mais derruba: o corte da PT foi UNIFICADO em ≥5 mm, independentemente de vacinação prévia com BCG. As opções de tratamento são: rifampicina por 4 meses (120 doses) — preferida em menores de 10 anos, maiores de 50, hepatopatas e intolerantes à isoniazida; isoniazida por 9 meses (270 doses); ou o esquema 3HP, com rifapentina + isoniazida semanal, 12 doses — mais curto e com melhor adesão.",
     "Fechando com vigilância e as armadilhas. A tuberculose é doença de NOTIFICAÇÃO COMPULSÓRIA (SINAN), com investigação obrigatória dos contatos e acompanhamento até o encerramento. Nos casos com resistência, os esquemas orais modernos contendo bedaquilina substituíram os injetáveis, encurtando o tratamento. Duas pegadinhas de ouro: (1) baciloscopia NEGATIVA não exclui tuberculose — a sensibilidade é limitada, e é por isso que o TRM-TB é o exame inicial; (2) NUNCA prescreva fluoroquinolona (levofloxacino, moxifloxacino) a um tossidor crônico sem antes excluir TB: essas drogas têm ação antimicobacteriana, melhoram o paciente parcialmente, MASCARAM o diagnóstico e ainda selecionam resistência. E jamais monoterapia — tratar TB com uma droga só é fabricar bacilo resistente."],
   raciocinio:["Tosse ≥3 semanas = sintomático respiratório → investigue TB. Em PVHIV/contatos/vulneráveis, qualquer tosse.",
     "Peça o TRM-TB como exame INICIAL (2h, detecta DNA + resistência à rifampicina). Baciloscopia negativa NÃO exclui.",
     "Teste TODO paciente com TB para HIV. Cultura + TSA em retratamento, HIV, suspeita de resistência.",
     "Confirmou TB sensível: esquema básico 2RHZE + 4RH (6 meses), em TDO, e NOTIFIQUE no SINAN.",
     "Investigue os contatos: se assintomático + Rx normal + PT ≥5 mm → tratar ILTB (rifampicina 4 meses, isoniazida 9 meses ou 3HP).",
     "Nunca dar fluoroquinolona ao tossidor crônico antes de excluir TB; nunca monoterapia."],
   nucleo:["Sintomático respiratório = tosse ≥3 semanas (qualquer tosse em PVHIV/vulneráveis).",
     "Exame INICIAL: TRM-TB (detecta DNA + resistência à rifampicina). Baciloscopia: onde não há TRM e para controle mensal.",
     "Esquema básico: 2RHZE + 4RH = 6 meses, dose fixa combinada, com TDO. Testar HIV em todos.",
     "Efeitos: Etambutol = olho (neurite óptica) · Isoniazida = nervo (piridoxina) · Pirazinamida = ácido úrico · Rifampicina = urina laranja e corta o anticoncepcional.",
     "ILTB: PT ≥5 mm (corte unificado, independe de BCG) após excluir doença ativa → rifampicina 4 meses, isoniazida 9 meses ou 3HP (12 doses semanais).",
     "Notificação compulsória (SINAN) + investigação de contatos."],
   pega:"Baciloscopia negativa NÃO exclui TB — o inicial é o TRM-TB. E nunca prescrever fluoroquinolona a tossidor crônico sem excluir TB: mascara o diagnóstico e seleciona resistência. Corte da PT é ≥5 mm, mesmo com BCG prévio.",
   mne:"RIPE: 2RHZE + 4RH. Etambutol=Olho · Isoniazida=Nervo · Pirazinamida=Ácido úrico · Rifampicina=uRina laRanja.",
   sus:"Busca ativa do sintomático respiratório, TDO, tratamento gratuito e notificação compulsória — eixo da APS."},

  {id:"cm-pac",area:"CM",nome:"Pneumonia adquirida na comunidade",yield:3,
   questoes:["cm_pac_q1","cm_pac_q2","cm_pac_q3","cm_pac_q4"],
   fonte:"Diretrizes brasileiras para pneumonia adquirida na comunidade em adultos (Sociedade Brasileira de Pneumologia e Tisiologia — SBPT); Diretriz ATS/IDSA de PAC em adultos (2019); escores CURB-65/CRB-65.",
   aula:["Pneumonia adquirida na comunidade (PAC) é a infecção do parênquima pulmonar que começa fora do hospital. O agente mais comum, disparado, é o Streptococcus pneumoniae (pneumococo); os 'atípicos' (Mycoplasma, Chlamydophila, Legionella) e os vírus completam o quadro. A apresentação típica: febre, tosse produtiva, dor torácica que piora ao respirar (pleurítica), dispneia, e ao exame crepitações, sopro tubário ou egofonia numa região. Mas cuidado com a armadilha geriátrica: o IDOSO pode chegar SEM febre, apenas confuso, caindo mais, ou com uma comorbidade descompensada. Não exigir febre para pensar em pneumonia no idoso é um dos ganhos fáceis da prova.",
     "O diagnóstico é clínica + radiografia de tórax mostrando consolidação. Na atenção primária, onde muitas vezes não há raio-x na hora, o quadro clínico compatível já autoriza tratar — não se posterga antibiótico esperando imagem. Nos pacientes que internam, acrescentam-se hemograma, ureia, gasometria/oximetria e culturas. Um ponto que a banca adora: NÃO se pede radiografia de controle precoce de rotina. A imagem demora semanas para limpar e pode até 'piorar' nos primeiros dias enquanto o paciente melhora clinicamente — quem manda é a evolução clínica, não o filme.",
     "A decisão mais importante na PAC não é qual antibiótico, é ONDE tratar. Para isso existe o CURB-65, que soma 1 ponto para cada item: Confusão mental; Ureia > 50 mg/dL; frequência Respiratória ≥ 30; Blood pressure (PA) baixa — sistólica < 90 ou diastólica ≤ 60; e idade ≥ 65 anos. Interpretação: 0 a 1 ponto = tratamento ambulatorial; 2 pontos = considerar internação; 3 ou mais = internação, avaliando terapia intensiva. Na APS, onde não há ureia, usa-se o CRB-65 (os mesmos itens sem a ureia). Saturação de O2 < 92% também puxa para a internação, e o escore não substitui o julgamento clínico: suporte social ruim, incapacidade de tomar via oral ou comorbidade descompensada internam mesmo com escore baixo.",
     "Escolhido o local, vem o antibiótico. Ambulatorial, adulto previamente hígido e sem uso recente de antibiótico: AMOXICILINA (alternativa: macrolídeo). Ambulatorial com comorbidades ou uso recente de antibiótico: amoxicilina-clavulanato associado a macrolídeo, ou uma quinolona respiratória. Internado fora da UTI: betalactâmico + macrolídeo. UTI: betalactâmico + macrolídeo ou quinolona respiratória. A duração é curta — em geral 5 a 7 dias, com mínimo de 5 dias e o paciente estável e afebril por 48 a 72 horas. Prolongar antibiótico 'por garantia' não melhora desfecho e seleciona resistência.",
     "As armadilhas finais. A maior, no Brasil, é a QUINOLONA RESPIRATÓRIA (levofloxacino, moxifloxacino): ela tem atividade contra o bacilo da tuberculose, então tratar uma 'pneumonia' que na verdade é TB com quinolona melhora parcialmente o paciente, MASCARA o diagnóstico e seleciona resistência — por isso não é a primeira escolha empírica de rotina aqui, e diante de tosse arrastada com emagrecimento você pensa TB antes. Segunda: derrame pleural associado exige toracocentese para diferenciar derrame parapneumônico simples de EMPIEMA (que precisa de drenagem, não só antibiótico). Terceira: bronquite aguda é viral e não se trata com antibiótico. E a prevenção existe e é do SUS: vacina influenza anual e pneumocócica nos grupos indicados reduzem internação e óbito."],
   raciocinio:["Suspeitou de PAC? Clínica + raio-x. No idoso, não exija febre — confusão e queda podem ser a única pista.",
     "Calcule o CURB-65 (ou CRB-65 na APS) para decidir ONDE tratar: 0-1 casa · 2 considerar internar · ≥3 internar e avaliar UTI.",
     "Cheque também a saturação (<92% interna) e o contexto social — o escore não manda sozinho.",
     "Ambulatorial hígido: amoxicilina. Com comorbidade/ATB recente: amoxi-clavulanato + macrolídeo ou quinolona respiratória.",
     "Internado não-UTI: betalactâmico + macrolídeo. Duração 5-7 dias, afebril e estável por 48-72h.",
     "Tosse arrastada + emagrecimento? Pense TB ANTES de dar quinolona. Derrame? Toracocentese para excluir empiema."],
   nucleo:["Agente mais comum: pneumococo. Idoso pode não ter febre (só confusão/queda).",
     "CURB-65: Confusão · Ureia >50 · FR ≥30 · PA <90/≤60 · ≥65 anos. 0-1 ambulatorial · 2 considerar internar · ≥3 internar/UTI. Na APS: CRB-65.",
     "Ambulatorial hígido: amoxicilina. Com comorbidade: amoxi-clav + macrolídeo ou quinolona respiratória.",
     "Internado não-UTI: betalactâmico + macrolídeo. Duração 5-7 dias.",
     "Não pedir Rx de controle precoce de rotina — a imagem atrasa em relação à clínica.",
     "Quinolona mascara TB. Derrame pleural → toracocentese (empiema drena)."],
   pega:"Quinolona respiratória tem ação anti-TB: mascara tuberculose no tossidor crônico. E não peça raio-x de controle precoce — a imagem piora/atrasa enquanto o paciente melhora.",
   mne:"CURB-65 = Confusão · Ureia · Respiração ≥30 · Blood pressure baixa · ≥65 anos.",
   sus:"Vacina influenza e pneumocócica no PNI; manejo ambulatorial da PAC de baixo risco é da APS."},

  {id:"cm-hiv-ist",area:"CM",nome:"HIV e ISTs na APS",yield:3,
   questoes:["cm_hiv_q1","cm_hiv_q2","cm_hiv_q3","cm_hiv_q4"],
   fonte:"PCDT para Manejo da Infecção pelo HIV em Adultos (Ministério da Saúde, 2024); PCDT para Atenção Integral às Pessoas com Infecções Sexualmente Transmissíveis (MS); PCDT de PrEP e de PEP de risco à infecção pelo HIV (MS).",
   aula:["O HIV deixou de ser assunto exclusivo do infectologista: a testagem rápida, o diagnóstico e até o início do tratamento acontecem na atenção primária. O diagnóstico se faz com testes rápidos (dois testes, conforme o fluxograma do Ministério), e a mensagem central mudou completamente nos últimos anos: a terapia antirretroviral (TARV) está indicada para TODAS as pessoas vivendo com HIV, independentemente da contagem de CD4, e deve ser iniciada o mais cedo possível — idealmente no MESMO DIA do diagnóstico. Não se espera CD4 nem carga viral para começar. Quanto mais precoce a TARV, menor a mortalidade, menor o adoecimento e menor a transmissão. Daí o conceito de I=I: pessoa com carga viral INDETECTÁVEL não transmite o HIV por via sexual — é INTRANSMISSÍVEL.",
     "O esquema preferencial inicial no Brasil é a combinação TDF + 3TC + DTG (tenofovir + lamivudina + dolutegravir), em comprimido único diário, disponível gratuitamente no SUS. O dolutegravir tem alta barreira genética e boa tolerabilidade. Uma situação especial que cai em prova: na coinfecção com TUBERCULOSE em uso de rifampicina, o dolutegravir precisa de ajuste (dose dobrada, 12/12h), porque a rifampicina acelera seu metabolismo. O acompanhamento se faz por CARGA VIRAL (o marcador de eficácia do tratamento); o CD4 informa o risco imunológico e a necessidade de profilaxias de infecções oportunistas, mas não é mais o gatilho para tratar.",
     "A prevenção hoje é COMBINADA, e a prova cobra as siglas. Preservativo, testagem regular, tratamento como prevenção (I=I), redução de danos e vacinação (HPV, hepatite B) compõem a base. A PrEP (profilaxia PRÉ-exposição) é medicação de uso contínuo para pessoas sob maior risco, disponível no SUS. E a PEP (profilaxia PÓS-exposição) é a corrida contra o relógio: deve começar o quanto antes, idealmente nas primeiras 2 horas, e o limite máximo é 72 HORAS após a exposição — de risco sexual, ocupacional ou por violência sexual — mantida por 28 dias. Passou de 72h, não se indica PEP. Guardar '72 horas / 28 dias' resolve a questão.",
     "Na sífilis, a regra de ouro é uma só: o tratamento é PENICILINA BENZATINA, e na gestante ela é a ÚNICA opção que trata também o FETO. Sífilis recente (primária, secundária ou latente recente, com menos de 1 ano): 2,4 milhões UI, dose única. Sífilis tardia ou de duração ignorada: 2,4 milhões UI por semana, 3 doses (total 7,2 milhões UI). O seguimento é com VDRL/teste não treponêmico, esperando queda de pelo menos duas diluições. Duas pegadinhas pesadas: (1) a penicilina benzatina PODE e DEVE ser aplicada na UBS — o risco de anafilaxia é baixíssimo, e encaminhar a gestante 'para aplicar em outro lugar' é erro que produz sífilis congênita; (2) na gestante com alergia comprovada à penicilina, a conduta é DESSENSIBILIZAR e usar penicilina — doxiciclina não trata o feto e a gestante não é considerada adequadamente tratada.",
     "Fechando com o raciocínio da APS. As ISTs andam juntas: diante de uma, teste o 'pacote' — HIV, sífilis, hepatite B e hepatite C — e trate parcerias. Nas síndromes, usa-se a abordagem sindrômica: corrimento uretral/cervical cobre gonococo e clamídia (ceftriaxona + azitromicina), sem esperar cultura. E a vigilância é obrigatória: HIV/aids, sífilis ADQUIRIDA, sífilis em GESTANTE e sífilis CONGÊNITA são todas de notificação compulsória, assim como as hepatites virais. Resumo do que a banca quer: TARV para todos e no mesmo dia; TDF+3TC+DTG; PEP em até 72h por 28 dias; penicilina benzatina na UBS, com dessensibilização se alergia na gestante."],
   raciocinio:["Diagnosticou HIV? Inicie TARV IMEDIATAMENTE — não espere CD4 nem carga viral.",
     "Esquema preferencial: TDF + 3TC + DTG, 1 comprimido/dia. Com rifampicina (TB), dobre o dolutegravir para 12/12h.",
     "Monitore por CARGA VIRAL. Reforce I=I: indetectável = intransmissível.",
     "Exposição de risco? PEP o quanto antes, limite de 72 HORAS, por 28 dias. Maior risco contínuo? PrEP.",
     "Sífilis: penicilina benzatina. Recente = 1 dose (2,4 mi UI). Tardia/ignorada = 3 doses semanais.",
     "Gestante alérgica: DESSENSIBILIZE — doxiciclina não trata o feto. Aplique na própria UBS.",
     "Testou uma IST? Teste o pacote (HIV, sífilis, hepatites B e C), trate parcerias e notifique."],
   nucleo:["TARV para TODOS, independente de CD4, iniciada no mesmo dia. I=I (indetectável = intransmissível).",
     "Esquema inicial: TDF + 3TC + DTG (dose única diária). Com rifampicina: dolutegravir 12/12h.",
     "Acompanhamento pela CARGA VIRAL; CD4 avalia risco/profilaxias.",
     "PEP: até 72h da exposição, por 28 dias. PrEP: uso contínuo para maior risco, disponível no SUS.",
     "Sífilis: penicilina benzatina — recente 2,4 mi UI dose única; tardia/ignorada 3 doses semanais. Seguimento com VDRL.",
     "Penicilina se aplica na UBS. Gestante alérgica = dessensibilizar (doxiciclina não trata o feto).",
     "Notificação compulsória: HIV/aids, sífilis adquirida, em gestante e congênita, hepatites virais."],
   pega:"Penicilina benzatina PODE e DEVE ser aplicada na UBS — não encaminhe. Gestante alérgica: dessensibiliza, porque doxiciclina não trata o feto. E TARV começa no mesmo dia, sem esperar CD4.",
   mne:"HIV inicial = TDF + 3TC + DTG (1 comprimido/dia). PEP = 72 horas / 28 dias.",
   sus:"Testagem rápida, TARV, PrEP, PEP e penicilina na APS; HIV e sífilis (adquirida, gestante e congênita) são notificação compulsória."},
  {id:"cir-abdome",area:"CIR",nome:"Abdome agudo",yield:3,
   questoes:["cir_abdome_q1","cir_abdome_q2","cir_abdome_q3","cir_abdome_q4"],
   fonte:"Diretrizes para o Manejo da Apendicite Aguda (Sociedade Brasileira de Cirurgia Digestiva – SBCD, 2025); escore de Alvarado; WSES (World Society of Emergency Surgery).",
   aula:["Abdome agudo é dor abdominal de início recente que exige decisão rápida: operar ou não. A chave para não se perder é encaixar o quadro em um de quatro padrões, porque cada um tem uma cara e uma conduta. Inflamatório (apendicite, colecistite): dor que cresce e localiza, com febre. Obstrutivo (bridas, hérnia, tumor): dor em cólica, parada de eliminação de fezes e flatos, vômitos, distensão. Perfurativo (úlcera perfurada): dor súbita e intensa, abdome em tábua. Vascular/hemorrágico (isquemia mesentérica, aneurisma roto): dor desproporcional ao exame, paciente grave.","A apendicite é a estrela da prova porque tem uma história muito característica. Começa com dor mal localizada em volta do umbigo (o apêndice inflamado ainda 'avisa' pelo nervo visceral), e em algumas horas MIGRA para a fossa ilíaca direita, quando a inflamação atinge o peritônio parietal e a dor fica bem localizada. Junto vêm febre baixa, náusea, perda de apetite e leucocitose. No exame, sinais de irritação peritoneal como o Blumberg (dor à descompressão) apontam que já há peritônio inflamado.","O raciocínio que a banca quer: irritação peritoneal (peritonismo) fala a favor de abordagem cirúrgica. Numa apendicite típica, com quadro clínico claro e sinais peritoneais, a conduta é APENDICECTOMIA (preferencialmente laparoscópica, inclusive em gestantes) — não se fica pedindo exame atrás de exame nem tratando só com antibiótico ambulatorial quando o quadro é evidente. O escore de ALVARADO (0-10) auxilia: ≥7 indica alta probabilidade (autoriza a cirurgia em muitos protocolos); ≤3 torna o diagnóstico pouco provável. A imagem entra nos casos DUVIDOSOS/atípicos: a ultrassonografia é a 1ª escolha em CRIANÇAS e GESTANTES (evita radiação), e a tomografia com contraste é o padrão-ouro no ADULTO (apêndice > 6 mm, apendicolito). Já a apendicite COMPLICADA com abscesso/fleimão pode ser manejada com antibiótico + drenagem e apendicectomia de intervalo (8-12 semanas).","As armadilhas moram nos extremos de idade e na gestante. Na criança pequena, no idoso e na grávida a apresentação é atípica — o apêndice pode estar deslocado, a dor não migra classicamente, e o diagnóstico atrasa, aumentando o risco de perfuração. Outro alerta: dor abdominal DESPROPORCIONAL ao que se vê no exame, num paciente com fatores de risco vascular, deve levantar isquemia mesentérica, que é grave e engana por ter exame inicial 'pobre'."],
   raciocinio:["Encaixe a dor em um dos 4 padrões: inflamatório, obstrutivo, perfurativo, vascular/hemorrágico.","Procure irritação peritoneal (Blumberg, defesa). Presente = pense em abordagem cirúrgica.","Apendicite: dor que migra para FID + peritonismo + leucocitose = quadro clássico → apendicectomia.","Quadro claro não precisa de imagem para adiar; imagem é para casos atípicos/duvidosos.","Cuidado com apresentação atípica em criança, idoso e gestante; e com dor desproporcional (isquemia)."],
   nucleo:["4 padrões: inflamatório, obstrutivo, perfurativo, vascular/hemorrágico.","Apendicite clássica: dor periumbilical que MIGRA para FID + febre + Blumberg + leucocitose.","Irritação peritoneal = cirurgia (apendicectomia, preferir laparoscópica). Alvarado ≥7 = alta probabilidade.","Imagem só no duvidoso: USG em criança/gestante, TC no adulto. Atípico em criança/idoso/gestante; dor desproporcional = isquemia."],
   pega:"Não adie o óbvio pedindo exames num quadro clássico de apendicite; e lembre da apresentação atípica em criança/idoso/gestante.",mne:"Migração da dor + Blumberg = apendicite.",sus:"A APS reconhece e referencia a tempo a urgência cirúrgica."},
  {id:"cir-trauma",area:"CIR",nome:"Trauma — ABCDE (ATLS)",yield:3,
   questoes:["cir_trauma_q1","cir_trauma_q2","cir_trauma_q3","cir_trauma_q4"],
   fonte:"ATLS – Advanced Trauma Life Support 11ª edição (American College of Surgeons, 2025 — algoritmo xABCDE e ressuscitação com controle de danos); PHTLS.",
   aula:["No trauma grave, o que mata é o tempo e a desorganização. O ATLS resolve isso com uma sequência rígida que trata primeiro o que mata primeiro. A regra de ouro: você não passa para a próxima letra sem resolver a anterior. ATUALIZAÇÃO (ATLS 11ª edição/PHTLS): a sequência clássica ABCDE ganhou um X na frente — virou XABCDE. O X é a hemorragia eXsanguinante (sangramento externo maciço), que deve ser controlada ANTES mesmo da via aérea, porque uma hemorragia grande mata em minutos. Depois do X, segue-se a ordem tradicional.","A = Via aérea com proteção da coluna cervical. Antes de tudo, garantir que o ar entra, sempre imobilizando o pescoço (todo politraumatizado tem lesão cervical até prova em contrário). Sinais de via aérea ameaçada: estridor, sangue ou vômito na boca, rebaixamento de consciência. B = Respiração (ventilação): checar se os dois pulmões expandem — aqui se pega o pneumotórax hipertensivo, o tórax instável. C = Circulação: controlar hemorragias (comprimir, torniquete) e repor volume — o cristaloide preferido é o Ringer lactato. A maior causa de choque no trauma é sangramento (choque hemorrágico, estratificado em leve, moderado e grave — ver adiante). Conceitos-chave da 11ª edição (ressuscitação com controle de danos): controlar a hemorragia primeiro, USAR MENOS cristaloide e partir cedo para hemocomponentes na proporção 1:1:1 (hemácias:plasma:plaquetas); hipotensão permissiva (manter PAS ~80-90 até controlar o foco, exceto em traumatismo cranioencefálico); e uso PRECOCE do ácido tranexâmico (1 g EV + 1 g em 8h) no trauma com sangramento significativo.","D = Disfunção neurológica: avaliar consciência pela escala de Glasgow (a 11ª edição valoriza a pontuação por COMPONENTES — abertura ocular, resposta verbal e motora — e a tendência, não só o número total) e as pupilas. A prevenção da lesão cerebral SECUNDÁRIA (evitar hipóxia e hipotensão) já começa na avaliação primária. E = Exposição: despir o paciente para não perder lesões, evitando a hipotermia. O raciocínio-chave da prova: diante de um politraumatizado hipotenso, pense HEMORRAGIA até prova em contrário — não é 'pressão baixa de susto'. E a prioridade nunca muda: se há problema de via aérea (A), ele vem antes de tratar o choque (C).","Um exemplo típico de questão: vítima inconsciente com estridor e sangue na boca. Muitos se assustam com a pressão ou querem pedir tomografia — mas a resposta é garantir a via aérea (A) com proteção cervical, porque é o A que está falhando e vai matar primeiro. O FAST (ultrassom à beira do leito) e a reposição entram no C, depois. Seguir a ordem é o que a banca cobra.","Sobre o CHOQUE HEMORRÁGICO, houve uma mudança importante na 11ª edição: o antigo modelo RÍGIDO de quatro classes (I a IV por porcentagem de perda de sangue) foi SIMPLIFICADO para uma avaliação clínica e fisiológica em TRÊS categorias — LEVE, MODERADO e GRAVE. A lógica saiu de estimar o percentual de sangue perdido para reconhecer rápido a gravidade e interromper o ciclo do choque (a tríade letal: hipotermia, acidose e coagulopatia). Isso porque os sinais vitais isolados enganam: idosos, pacientes em uso de betabloqueador e atletas podem não taquicardizar, e a queda da pressão costuma ser tardia. Por isso valorizam-se marcadores fisiológicos de hipoperfusão — o LACTATO (>4 mmol/L indica gravidade, e seu clareamento é meta da ressuscitação) e o déficit de base — e o Shock Index (frequência cardíaca dividida pela pressão sistólica), mais sensível que os sinais vitais isolados. O manejo prioriza controle imediato da hemorragia + hemocomponentes precoces, em vez de estratificar em classes numéricas."],
   raciocinio:["Siga X → A → B → C → D → E, sem pular etapa (X = hemorragia exsanguinante externa, primeiro de tudo).","A: via aérea ameaçada (estridor, sangue, rebaixamento)? Garanta a via aérea com proteção cervical antes de tudo.","B: os dois pulmões expandem? Pegue aqui pneumotórax hipertensivo.","C: controle a hemorragia (comprima) e reponha volume. Hipotensão no trauma = hemorragia até prova em contrário.","D e E: avalie consciência/pupilas e exponha o paciente, evitando hipotermia."],
   nucleo:["Ordem XABCDE (ATLS 11): X hemorragia exsanguinante externa (antes do A), A via aérea + coluna cervical, B ventilação, C circulação, D neuro, E exposição.","Via aérea ameaçada tem prioridade máxima.","Hipotensão no trauma = hemorragia até prova em contrário. ATLS 11: choque em 3 categorias (leve/moderado/grave), foco em interromper o ciclo; lactato/déficit de base e Shock Index como marcadores; sinais vitais enganam idoso/betabloqueado.","C: Ringer lactato, ácido tranexâmico precoce (1g+1g/8h), hipotensão permissiva, transfusão 1:1:1."],
   pega:"A prioridade é sempre a via aérea (A) — não se trata o choque (C) antes de garantir o A. Hipotensão no trauma é sangramento.",mne:"ABCDE — nesta ordem, sempre.",sus:"Atendimento pré-hospitalar (SAMU) e regulação compõem a rede de urgência."},
  {id:"cir-posop",area:"CIR",nome:"Pré-op e complicações",yield:2,
   questoes:["cir_posop_q1","cir_posop_q2","cir_posop_q3","cir_posop_q4"],
   fonte:"Cuidados perioperatórios e complicações pós-operatórias (Sabiston; ACERTO/ERAS); segurança do paciente cirúrgico (OMS/checklist).",
   aula:["O cuidado cirúrgico não termina na sala de operação — boa parte das mortes evitáveis acontece no PÓS-operatório, por complicações que o médico precisa reconhecer cedo. Antes disso, no pré-operatório, avalia-se o risco do paciente (cardíaco, respiratório) e institui-se profilaxia, com destaque para a prevenção de trombose venosa profunda (TVP) em quem vai ficar imóvel.","A complicação mais cobrada é a FEBRE pós-operatória, e o truque é pensar pela CRONOLOGIA — quando a febre aparece sugere a causa. Nas primeiras 24-48h, costuma ser pulmonar (atelectasia, pelo pulmão que não expande direito deitado). Depois, entram infecção urinária (relacionada a sonda), infecção da ferida operatória, TVP e, mais tarde, coleções/abscessos. Essa linha do tempo organiza o raciocínio.","Uma regra mnemônica clássica ajuda: os '5 Ws' da febre pós-op — Wind (pulmão, atelectasia/pneumonia), Water (urina, ITU), Wound (ferida), Walking (TVP, panturrilha) e Wonder drugs (febre medicamentosa). Além da febre, vigiam-se a deiscência (abertura da ferida/anastomose) e a infecção do sítio cirúrgico.","O elo com o mundo real (e com o seu NSP): a segurança do paciente cirúrgico depende de checklists, profilaxia adequada e vigilância pós-operatória — reconhecer a febre pela cronologia e agir. Febre nas primeiras 48h geralmente é pulmonar (estimular respiração, deambulação); febre mais tardia puxa a investigação para infecção/coleção."],
   raciocinio:["No pré-op, avalie risco e institua profilaxia (TVP).","Diante de febre pós-op, pense na CRONOLOGIA.","Primeiras 24-48h: pense pulmão (atelectasia).","Mais tardia: ITU, ferida, TVP, coleção/abscesso.","Use os 5 Ws para não esquecer nenhuma causa."],
   nucleo:["Pré-op: avaliação de risco e profilaxia de TVP.","Febre pós-op pela cronologia: 24-48h → pulmão; tardia → infecção/coleção.","5 Ws: Wind, Water, Wound, Walking, Wonder drugs.","Vigiar deiscência e infecção do sítio cirúrgico."],
   pega:"Febre nas primeiras 24-48h costuma ser pulmonar (atelectasia); febre tardia sugere infecção/coleção.",mne:"Febre pós-op = 5 Ws.",sus:"Segurança do paciente e checklist cirúrgico (tema do NSP)."},
  {id:"cir-hernia",area:"CIR",nome:"Hérnias de parede",yield:1,
   questoes:["cir_hernia_q1","cir_hernia_q2","cir_hernia_q3","cir_hernia_q4"],
   fonte:"Diretrizes de hérnia da parede abdominal (European Hernia Society; Sociedade Brasileira de Hérnia); Sabiston - Tratado de Cirurgia.",
   aula:["Hérnia é a protrusão de um órgão (geralmente alça intestinal) por um ponto fraco da parede abdominal. As mais comuns são a inguinal (na virilha, a mais frequente), a femoral (abaixo do ligamento inguinal, mais comum e mais perigosa em mulheres), a umbilical e a incisional (na cicatriz de cirurgia prévia). A maioria é assintomática ou dá abaulamento que sai ao esforço e some deitado.","O que transforma uma hérnia banal em emergência são duas palavras que você precisa diferenciar. ENCARCERAMENTO: a hérnia fica IRREDUTÍVEL (não volta ao lugar), mas o conteúdo ainda tem circulação. ESTRANGULAMENTO: além de irredutível, o suprimento de sangue foi cortado — a alça está isquêmica e vai necrosar. O estrangulamento é emergência cirúrgica imediata.","Os sinais de alarme: hérnia que não reduz + dor intensa + sinais sistêmicos (vômitos, sinais de obstrução, febre, taquicardia) = pense estrangulamento. A hérnia femoral merece atenção especial porque, por passar num anel estreito, encarcera e estrangula com mais frequência — e costuma cair na prova exatamente com esse perfil (mulher idosa, abaulamento irredutível na virilha, obstrução).","A conduta: hérnia não complicada é cirurgia eletiva (na fila do SUS). Hérnia estrangulada é cirurgia de urgência — não se perde tempo. Resumo do raciocínio de prova: irredutível + dor + sinais sistêmicos = estrangulou = operou agora."],
   raciocinio:["Identifique o tipo (inguinal, femoral, umbilical, incisional).","A hérnia reduz (volta ao lugar) ou não? Irredutível é sinal de alerta.","Irredutível + dor + sinais sistêmicos (vômito, obstrução) = estrangulamento.","Estrangulou = cirurgia de urgência. Não complicada = eletiva.","Lembre: femoral encarcera/estrangula mais, sobretudo em mulheres."],
   nucleo:["Tipos: inguinal, femoral, umbilical, incisional.","Encarceramento = irredutível (circulação mantida). Estrangulamento = irredutível + isquemia.","Estrangulamento é emergência cirúrgica.","Femoral estrangula mais (anel estreito)."],
   pega:"Hérnia femoral estrangula mais; irredutível + dor + sinais sistêmicos = estrangulamento = operar agora.",mne:"Estrangulou = operou.",sus:"Hérnia não complicada entra na fila cirúrgica eletiva do SUS."},
  {id:"cm-tireoide",area:"CM",nome:"Distúrbios da tireoide",yield:3,
   questoes:["cm_tir_q1","cm_tir_q2","cm_tir_q3","cm_tir_q4"],
   fonte:"Diretrizes da Sociedade Brasileira de Endocrinologia e Metabologia (SBEM) para hipotireoidismo e hipertireoidismo; Diretrizes da American Thyroid Association (ATA); Protocolos da Atenção Básica: Saúde dos Adultos (Ministério da Saúde).",
   aula:["Tudo em tireoide se explica por um eixo com FEEDBACK NEGATIVO: o hipotálamo libera TRH, a hipófise libera TSH, e o TSH manda a tireoide produzir T4 e T3 — que, ao subirem, avisam a hipófise para parar. Entenda isso e você nunca mais erra a leitura do exame. Se a TIREOIDE falha (doença primária, que é a regra), o T4 cai e a hipófise 'grita' mais alto: o TSH SOBE. Se a tireoide trabalha demais, o T4 sobe e a hipófise cala: o TSH DESCE, suprimido. Por isso o TSH é o exame mais sensível e o de rastreio — ele se move primeiro, antes mesmo de o T4 sair da faixa.",
     "HIPOTIREOIDISMO: no Brasil, onde há iodo suficiente na dieta, a causa mais comum é a TIREOIDITE DE HASHIMOTO, autoimune, com anti-TPO positivo. O paciente vem devagar e inespecífico: fadiga, ganho de peso, intolerância ao frio, pele seca, constipação, bradicardia, sonolência, humor deprimido, reflexos lentos. Laboratório: TSH ALTO com T4 livre BAIXO = hipotireoidismo primário, trata. Mas existe o TSH ALTO com T4 livre NORMAL — o hipotireoidismo SUBCLÍNICO —, e aqui mora a pegadinha: NÃO se trata todo mundo. Trata-se quando o TSH está acima de 10, ou quando há sintomas, anti-TPO positivo, gestação ou planejamento de gestação. Fora disso, acompanha-se.",
     "O tratamento é levotiroxina, e os detalhes práticos caem: tomar em JEJUM, 30 a 60 minutos antes do café, e LONGE de cálcio, ferro e omeprazol, que atrapalham a absorção. O ajuste é pelo TSH a cada 6 a 8 semanas — não adianta redosar em duas semanas, o eixo demora a equilibrar. No idoso e no coronariopata, começa-se com dose BAIXA e sobe-se devagar, porque acelerar o metabolismo de um coração doente provoca angina e arritmia. E um capítulo à parte é a GESTAÇÃO: a demanda aumenta, a dose de levotiroxina precisa SUBIR (cerca de 30%) e as metas de TSH são mais rígidas. Hipotireoidismo não tratado na gestante compromete o neurodesenvolvimento fetal — e por isso a pegadinha mais cruel do tema é a alternativa que 'suspende a levotiroxina porque engravidou'. Nunca se suspende.",
     "HIPERTIREOIDISMO: a causa mais comum é a DOENÇA DE GRAVES, autoimune, com TRAb positivo e bócio difuso. Ela tem dois sinais que NENHUMA outra causa tem — e por isso valem diagnóstico: a OFTALMOPATIA (exoftalmia, retração palpebral) e o mixedema pré-tibial. O quadro é o espelho do hipotireoidismo: perda de peso apesar do apetite aumentado, palpitação, taquicardia (podendo abrir com fibrilação atrial no idoso), tremor fino, intolerância ao calor, sudorese, ansiedade, insônia, diarreia. Laboratório: TSH SUPRIMIDO com T4 livre alto. Os diferenciais importam: bócio multinodular tóxico, adenoma tóxico e — a armadilha — a TIREOIDITE SUBAGUDA, que é dolorosa, costuma vir após quadro viral e é autolimitada. Na tireoidite o hormônio está alto porque a glândula ROMPEU e LIBEROU estoque, não porque está produzindo; por isso ela CAPTA POUCO na cintilografia, e por isso antitireoidiano NÃO funciona — trata-se com anti-inflamatório e betabloqueador. É exatamente a cintilografia com captação que separa: capta muito (Graves, nódulo tóxico) versus capta pouco (tireoidite, hormônio exógeno).",
     "O tratamento do hipertireoidismo começa pelo sintoma, com BETABLOQUEADOR (propranolol) para taquicardia e tremor, somado ao antitireoidiano. E aqui está a regra mais cobrada: o METIMAZOL é a primeira escolha — EXCETO no PRIMEIRO TRIMESTRE da gestação, quando se usa PROPILTIOURACIL, porque o metimazol é teratogênico (aplasia cutis, atresia de coanas). As opções definitivas são o iodo radioativo (proibido na gestação e amamentação, e pode piorar a oftalmopatia de Graves) e a cirurgia. Duas emergências fecham o tema: a CRISE TIREOTÓXICA (febre, taquiarritmia, agitação, insuficiência cardíaca — mortalidade alta) e a AGRANULOCITOSE causada pelos antitireoidianos. Esta última tem um alerta prático que salva vida: paciente em uso de metimazol que apresenta FEBRE e DOR DE GARGANTA deve SUSPENDER a droga e fazer hemograma com urgência — não é 'só uma virose'."],
   raciocinio:["Leia o eixo: TSH alto + T4L baixo = hipotireoidismo primário. TSH suprimido + T4L alto = hipertireoidismo. O TSH se move primeiro.",
     "TSH alto com T4L NORMAL = subclínico → só trata se TSH >10, sintomas, anti-TPO+, gestação ou planejamento.",
     "Levotiroxina: jejum, longe de cálcio/ferro/omeprazol; ajustar pelo TSH a cada 6-8 semanas; idoso/coronariopata começa baixo.",
     "Gestante hipotireoidea: AUMENTAR a dose (~30%), nunca suspender.",
     "Hipertireoidismo com exoftalmia/mixedema pré-tibial = Graves (TRAb+).",
     "Tireoide DOLOROSA pós-viral com captação BAIXA = tireoidite subaguda → AINE + betabloqueador, NÃO antitireoidiano.",
     "Tratar Graves: betabloqueador + METIMAZOL (propiltiouracil só no 1º trimestre).",
     "Febre + dor de garganta em uso de metimazol = suspender e hemograma URGENTE (agranulocitose)."],
   nucleo:["Eixo com feedback: tireoide falha → TSH SOBE. Tireoide em excesso → TSH SUPRIME. TSH é o exame mais sensível/rastreio.",
     "Hipotireoidismo: causa mais comum = Hashimoto (anti-TPO+). TSH alto + T4L baixo = primário.",
     "Subclínico (TSH alto, T4L normal): tratar se TSH >10, sintomático, anti-TPO+, gestante ou planejando gestação.",
     "Levotiroxina em JEJUM, longe de cálcio/ferro/omeprazol; ajuste do TSH a cada 6-8 semanas; idoso/coronariopata: dose baixa inicial.",
     "GESTAÇÃO: aumentar a levotiroxina (~30%) e metas mais rígidas — nunca suspender.",
     "Hipertireoidismo: causa mais comum = Graves (TRAb+); só ele tem OFTALMOPATIA e mixedema pré-tibial. TSH suprimido + T4L alto.",
     "Cintilografia: capta MUITO (Graves/nódulo tóxico) x capta POUCO (tireoidite subaguda, hormônio exógeno). Tireoidite = AINE + betabloqueador.",
     "Tratamento: betabloqueador + METIMAZOL (1ª linha). PROPILTIOURACIL no 1º trimestre (metimazol é teratogênico). Definitivo: iodo radioativo (não na gestação; piora oftalmopatia) ou cirurgia.",
     "Emergências: crise tireotóxica e AGRANULOCITOSE (febre + dor de garganta = suspender e hemograma já)."],
   pega:"Hipotireoidismo SUBCLÍNICO não se trata sempre — só com TSH >10, sintomas, anti-TPO+ ou gestação. Na gestante hipotireoidea, AUMENTA-se a dose (jamais suspende). E metimazol é 1ª linha, exceto no 1º trimestre (aí, propiltiouracil).",
   mne:"TSH alto = tireoide preguiçosa. Metimazol 1ª linha, PTU no 1º trimestre (P de Primeiro). Febre + garganta no metimazol = agranulocitose.",
   sus:"Rastreio e manejo do hipotireoidismo são da APS; levotiroxina disponível na Rename e TSH acessível na rede."},

  {id:"cm-anemias",area:"CM",nome:"Anemias",yield:3,
   questoes:["cm_anem_q1","cm_anem_q2","cm_anem_q3","cm_anem_q4"],
   fonte:"Diretrizes da Associação Brasileira de Hematologia, Hemoterapia e Terapia Celular (ABHH); Protocolos da Atenção Básica (Ministério da Saúde); Programa Nacional de Triagem Neonatal — doença falciforme; critérios de anemia da OMS.",
   aula:["Anemia é hemoglobina abaixo do esperado para idade, sexo e condição (a gestante tem corte próprio). E existe um atalho que organiza o assunto inteiro: olhe o VCM. Microcítica (VCM abaixo de 80): pense ferro, talassemia, doença crônica. Normocítica (80 a 100): doença crônica, renal, hemólise, sangramento agudo. Macrocítica (acima de 100): B12, folato, álcool, hipotireoidismo. Com o VCM na mão, você já dividiu o problema em três.",
     "A MICROCÍTICA campeã, no mundo e no Brasil, é a FERROPRIVA. O exame mais precoce e específico é a FERRITINA, que reflete o ESTOQUE de ferro: ferritina baixa fecha o diagnóstico. Mas há uma armadilha laboratorial: ferritina é proteína de FASE AGUDA — na inflamação ou infecção ela sobe e pode MASCARAR uma deficiência real. Completam o padrão: ferro sérico baixo, transferrina/TIBC ALTA (o corpo fabrica mais transportador, procurando ferro), saturação baixa e RDW alto. E o raciocínio que separa a boa resposta: no HOMEM adulto ou na mulher PÓS-MENOPAUSA, anemia ferropriva é SANGRAMENTO até prova em contrário — obriga investigar o trato gastrointestinal, pensando em câncer colorretal. Na mulher em idade fértil, a menstruação explica a maioria; na criança, dieta e verminose. O tratamento é ferro oral (sulfato ferroso), em jejum, com vitamina C, longe de leite e café — e mantido por 3 a 6 meses DEPOIS que a hemoglobina normalizar, para repor o estoque. Os diferenciais microcíticos: TALASSEMIA (ferritina normal ou alta, RDW normal, muitos eritrócitos para o grau de anemia) e anemia de doença crônica (ferritina normal/alta, TIBC baixa).",
     "As MACROCÍTICAS megaloblásticas são B12 e folato, e no sangue aparecem os neutrófilos HIPERSEGMENTADOS. A deficiência de B12 vem da anemia perniciosa (autoimune, contra o fator intrínseco), de gastrectomia, de vegetarianismo estrito, do uso crônico de metformina e da idade avançada. E existe uma diferença crucial entre as duas: a B12 causa sintomas NEUROLÓGICOS — parestesias, ataxia, a degeneração combinada subaguda da medula —, enquanto o folato NÃO. Daí nasce uma das pegadinhas mais graves da medicina: dar FOLATO isolado a quem tem deficiência de B12 CORRIGE a anemia e MASCARA o problema, enquanto a lesão neurológica segue progredindo, e ela pode ser irreversível. Regra: sempre dose e reponha a B12 antes.",
     "Nas NORMOCÍTICAS, a mais comum em internados é a anemia de doença crônica; some-se a anemia da doença renal crônica (falta eritropoetina), a hemólise e o sangramento agudo. O padrão da HEMÓLISE tem quatro marcadores que andam juntos: reticulócitos ALTOS (a medula está respondendo), LDH alto, bilirrubina INDIRETA alta e haptoglobina BAIXA (ela é consumida ligando a hemoglobina livre). O teste de Coombs direto então separa as hemólises imunes das não imunes.",
     "Fecha o tema a DOENÇA FALCIFORME, de alto rendimento no Brasil, rastreada no teste do pezinho. A hemoglobina S polimeriza quando desoxigenada, deforma a hemácia em foice e entope a microcirculação. A crise ÁLGICA vaso-oclusiva é a manifestação mais comum, e seu tratamento é HIDRATAÇÃO + ANALGESIA POTENTE, com opioide sem receio — subtratar a dor por medo de dependência é o erro clássico e documentado nessa população —, mais oxigênio se houver hipoxemia. As complicações a conhecer: SÍNDROME TORÁCICA AGUDA (febre + dor torácica + infiltrado novo no raio-x), que é a principal causa de morte; AVC; sequestro esplênico; priapismo; e a crise aplásica pelo parvovírus B19. Na prevenção: como a criança falciforme tem asplenia funcional, faz-se PENICILINA profilática até os 5 anos, contra o pneumococo, além de vacinação ampliada; e a HIDROXIUREIA reduz crises e mortalidade."],
   raciocinio:["Comece pelo VCM: <80 microcítica (ferro, talassemia, doença crônica) · 80-100 normocítica · >100 macrocítica (B12, folato).",
     "Microcítica? Dose FERRITINA: baixa = ferropriva. Lembre que ferritina sobe na inflamação (pode mascarar).",
     "Ferropriva em homem ou mulher pós-menopausa = SANGRAMENTO até prova em contrário → investigar TGI (câncer colorretal).",
     "Trate com ferro oral em jejum + vitamina C, longe de leite/café, e mantenha 3-6 meses APÓS normalizar a Hb.",
     "Macrocítica com hipersegmentação? Dose B12 e folato. NUNCA reponha folato isolado sem excluir B12 (mascara a anemia e a neuropatia progride).",
     "Suspeita de hemólise? Reticulócitos altos + LDH alto + BI alta + haptoglobina baixa. Coombs direto separa imune de não imune.",
     "Falciforme em crise álgica: hidratação + ANALGESIA POTENTE (opioide, sem subtratar) + O2 se hipoxemia.",
     "Falciforme com febre + dor torácica + infiltrado novo = síndrome torácica aguda (principal causa de morte)."],
   nucleo:["Divida pelo VCM: micro (<80) · normo (80-100) · macro (>100).",
     "Ferropriva: FERRITINA baixa (mais precoce/específica) + ferro baixo + TIBC/transferrina ALTA + RDW alto. Ferritina é fase aguda — sobe na inflamação.",
     "Ferropriva em homem/pós-menopausa = investigar TGI (câncer colorretal). Ferro oral em jejum + vit C; manter 3-6 meses após normalizar a Hb.",
     "Diferenciais micro: talassemia (ferritina normal/alta, RDW normal, Mentzer <13) e doença crônica (ferritina normal/alta, TIBC baixa).",
     "Megaloblástica: neutrófilos hipersegmentados. B12 dá sintomas NEUROLÓGICOS; folato NÃO. Folato isolado em deficiência de B12 mascara a anemia e a neuropatia progride.",
     "Hemólise: reticulócitos ALTOS + LDH alto + bilirrubina INDIRETA alta + haptoglobina BAIXA. Coombs direto = imune x não imune.",
     "Falciforme: triagem no teste do pezinho. Crise álgica = hidratação + analgesia potente (opioide) + O2.",
     "Complicações: síndrome torácica aguda (febre + dor torácica + infiltrado novo = principal causa de morte), AVC, sequestro esplênico, priapismo, crise aplásica (parvovírus B19).",
     "Profilaxia: penicilina até 5 anos (asplenia funcional) + vacinação ampliada; hidroxiureia reduz crises e mortalidade."],
   pega:"Nunca reponha folato isolado sem excluir deficiência de B12 — corrige a anemia e deixa a neuropatia progredir. Anemia ferropriva em homem adulto é sangramento do TGI até prova em contrário. E na crise falciforme, não subtrate a dor: opioide é indicado.",
   mne:"Ferritina = estoque (mas sobe na inflamação). B12 = Neurológico; folato não. Hemólise = Retic↑ LDH↑ BI↑ Hapto↓.",
   sus:"Triagem neonatal (teste do pezinho) detecta a falciforme; ferro e ácido fólico na Rename; hidroxiureia dispensada pelo SUS."},

  {id:"cm-drc",area:"CM",nome:"Doença renal crônica",yield:3,
   questoes:["cm_drc_q1","cm_drc_q2","cm_drc_q3","cm_drc_q4"],
   fonte:"Diretriz KDIGO 2024 para Avaliação e Manejo da Doença Renal Crônica; Diretrizes da Sociedade Brasileira de Nefrologia (SBN); Protocolos da Atenção Básica — prevenção da DRC (Ministério da Saúde).",
   aula:["Doença renal crônica é definida por alteração ESTRUTURAL ou FUNCIONAL do rim mantida por pelo menos 3 MESES — e esse prazo é o que a separa da lesão renal aguda. O diagnóstico se faz de dois jeitos, e o segundo é o mais esquecido: TFG abaixo de 60, OU marcador de lesão renal (albuminúria, alteração do sedimento urinário, imagem ou biópsia) MESMO com TFG normal. Ou seja, um diabético com TFG de 95 e albuminúria já tem DRC. No Brasil, as duas causas que dominam são DIABETES em primeiro lugar e HIPERTENSÃO em segundo — o que faz da DRC um problema que nasce e deveria ser barrado na atenção primária.",
     "O estadiamento do KDIGO é BIDIMENSIONAL, e a prova cobra as duas dimensões. Pela TFG: G1 (≥90), G2 (60-89), G3a (45-59), G3b (30-44), G4 (15-29) e G5 (<15). Pela ALBUMINÚRIA: A1 (<30 mg/g), A2 (30-300) e A3 (>300). O prognóstico depende da combinação — é o mapa de cores do KDIGO. Repare na consequência: G1 e G2 só são DRC se houver marcador de lesão; uma TFG de 85 isolada, sem albuminúria e sem mais nada, não é doença. E a albuminúria não é um detalhe: ela é, ao mesmo tempo, marcador diagnóstico, marcador prognóstico e alvo de tratamento.",
     "O RASTREIO é atribuição da APS. Quem rastrear: diabéticos, hipertensos, pessoas acima de 60 anos, com história familiar de doença renal ou com doença cardiovascular. Como rastrear: creatinina com TFG estimada MAIS a relação ALBUMINA/CREATININA em amostra ISOLADA de urina — e aqui está uma pegadinha operacional muito cobrada: não é preciso urina de 24 horas, a amostra isolada basta e é o padrão atual. No diabetes tipo 2, rastreia-se desde o diagnóstico (porque ele já pode existir há anos); no tipo 1, a partir de 5 anos de doença.",
     "O tratamento tem pilares que RETARDAM a progressão. (1) Controle pressórico, com meta em torno de 130/80. (2) IECA ou BRA quando há albuminúria: eles reduzem a pressão dentro do glomérulo e a proteinúria — o benefício é RENAL, além do anti-hipertensivo. (3) iSGLT2 (dapagliflozina, empagliflozina): hoje pilar consagrado, reduzem progressão da DRC e eventos cardiovasculares INCLUSIVE em não diabéticos. (4) Controle glicêmico, (5) estatina e (6) evitar nefrotóxicos — anti-inflamatórios, contraste iodado, aminoglicosídeos. E um detalhe que a banca adora: ao INICIAR IECA/BRA, é ESPERADO que a creatinina suba até cerca de 30% — isso reflete a queda desejada da pressão intraglomerular e NÃO é motivo para suspender. Suspende-se apenas se a elevação for maior que isso ou se houver hipercalemia importante.",
     "As complicações acompanham a queda da função: ANEMIA (o rim para de produzir eritropoetina — trata-se repondo ferro e, se preciso, EPO), distúrbio MINERAL-ÓSSEO (fósforo alto, vitamina D baixa, PTH alto), acidose metabólica e hipercalemia. Quando encaminhar ao nefrologista: TFG abaixo de 30 (estágio G4), albuminúria importante (A3), progressão rápida, hipercalemia ou acidose refratárias, e causa indefinida. E a indicação de DIÁLISE fecha o tema com outra pegadinha: ela NÃO se decide por um número isolado de creatinina. Dialisa-se por SÍNDROME URÊMICA ou complicações refratárias ao tratamento clínico — hipercalemia grave, acidose grave, hipervolemia com edema agudo de pulmão, pericardite urêmica e encefalopatia. Quem manda é o paciente, não o valor do exame."],
   raciocinio:["DRC = alteração estrutural/funcional por ≥3 MESES. Diagnóstico: TFG <60 OU marcador de lesão (albuminúria) mesmo com TFG normal.",
     "Estadie nas DUAS dimensões: TFG (G1-G5) e albuminúria (A1-A3). G1/G2 só é DRC se houver marcador de lesão.",
     "Rastreie diabéticos, hipertensos, >60 anos, história familiar e doença cardiovascular: creatinina/TFG + relação albumina/creatinina em amostra ISOLADA (não precisa de 24h).",
     "Trate para retardar progressão: PA <130/80, IECA/BRA se albuminúria, iSGLT2 (mesmo em não diabéticos), controle glicêmico, estatina.",
     "Evite nefrotóxicos: AINE, contraste, aminoglicosídeo.",
     "Iniciou IECA/BRA e a creatinina subiu até ~30%? É ESPERADO — não suspenda. Acima disso ou com hipercalemia, reavalie.",
     "Encaminhe ao nefrologista: TFG <30 (G4), A3, progressão rápida, hipercalemia/acidose refratária, causa indefinida.",
     "Diálise: por síndrome urêmica ou complicação refratária (hipercalemia, acidose, hipervolemia/EAP, pericardite, encefalopatia) — nunca por um número de creatinina."],
   nucleo:["DRC: alteração estrutural/funcional ≥3 MESES. TFG <60 OU marcador de lesão (albuminúria) mesmo com TFG normal.",
     "Causas no Brasil: DIABETES (1ª) e HIPERTENSÃO (2ª).",
     "KDIGO bidimensional: TFG G1 (≥90) · G2 (60-89) · G3a (45-59) · G3b (30-44) · G4 (15-29) · G5 (<15). Albuminúria A1 (<30) · A2 (30-300) · A3 (>300 mg/g).",
     "Rastreio na APS: creatinina/TFG + relação albumina/creatinina em AMOSTRA ISOLADA (não precisa urina de 24h). DM2 desde o diagnóstico; DM1 após 5 anos.",
     "Pilares: PA ~130/80 · IECA/BRA se albuminúria · iSGLT2 (reduz progressão mesmo em não diabéticos) · controle glicêmico · estatina · evitar nefrotóxicos (AINE, contraste, aminoglicosídeo).",
     "Aumento de até ~30% da creatinina ao iniciar IECA/BRA é ESPERADO — não suspender.",
     "Complicações: anemia (falta eritropoetina), distúrbio mineral-ósseo (P alto, PTH alto, vit D baixa), acidose, hipercalemia.",
     "Referência ao nefrologista: G4 (TFG <30), A3, progressão rápida, hipercalemia/acidose refratária, causa indefinida.",
     "Diálise por SÍNDROME URÊMICA/complicações refratárias (hipercalemia, acidose, EAP, pericardite, encefalopatia) — não por número de creatinina."],
   pega:"Albuminúria se rastreia em AMOSTRA ISOLADA (relação albumina/creatinina) — não é preciso urina de 24h. Elevação de até 30% da creatinina após iniciar IECA/BRA é esperada e NÃO indica suspender. E diálise não se indica por valor de creatinina, e sim por síndrome urêmica/complicação refratária.",
   mne:"DRC = 3 meses. G pela TFG, A pela albuminúria. IECA subiu creatinina até 30%? Segue. Diálise = clínica, não número.",
   sus:"Rastreio de DRC em diabéticos e hipertensos é da APS; linhas de cuidado de HAS/DM previnem a diálise, que é o desfecho mais caro do SUS."},

  {id:"cm-hepatites",area:"CM",nome:"Hepatites virais",yield:3,
   questoes:["cm_hep_q1","cm_hep_q2","cm_hep_q3","cm_hep_q4"],
   fonte:"PCDT para Hepatite B e Coinfecções e PCDT para Hepatite C e Coinfecções (Ministério da Saúde); Guia de Vigilância em Saúde (MS); Calendário Nacional de Vacinação/PNI.",
   aula:["As hepatites virais se organizam pela TRANSMISSÃO, e isso já resolve metade das questões. A e E são de transmissão FECAL-ORAL: água e alimento contaminados — a A é a das crianças, dos surtos e do saneamento precário. B, C e D vão por SANGUE, sexo e via vertical. O segundo eixo é a CRONIFICAÇÃO: a hepatite A NÃO cronifica (raramente fulmina e acabou); a E é habitualmente benigna, mas é GRAVE na gestante; a B cronifica em cerca de 5% dos adultos — porém em até 90% dos recém-nascidos infectados por via vertical, e é essa assimetria que justifica a vacina logo ao nascer; e a C é a campeã de cronicidade, com cerca de 70 a 85% evoluindo para doença crônica.",
     "A SOROLOGIA DA HEPATITE B é o assunto favorito da banca, e ela é lógica quando você lê cada sigla pelo que ela significa. HBsAg é o antígeno de superfície: se está presente, há VÍRUS — infecção ativa (aguda, ou crônica se persistir além de 6 meses). Anti-HBs é o ANTICORPO contra a superfície: significa IMUNIDADE, seja por vacina, seja por cura. Anti-HBc IgM indica infecção AGUDA/recente. Anti-HBc IgG (total) indica contato PRÉVIO com o vírus selvagem — e aqui está a chave, porque a vacina contém apenas o antígeno de superfície e NÃO produz anti-HBc. HBeAg indica replicação intensa e alta infectividade.",
     "Com isso, monte os três padrões que caem sempre. (1) Anti-HBs POSITIVO com anti-HBc NEGATIVO = VACINADO (tem o anticorpo da superfície, mas nunca viu o vírus inteiro). (2) Anti-HBs positivo COM anti-HBc IgG positivo e HBsAg negativo = infecção prévia CURADA (viu o vírus e resolveu). (3) HBsAg positivo por mais de 6 meses = hepatite B CRÔNICA. Guarde a frase: quem separa vacina de infecção natural é o anti-HBc.",
     "No tratamento e na prevenção da B: nem todo portador crônico trata — a indicação segue critérios (carga viral, ALT, grau de fibrose, cirrose, coinfecções, gestante com carga viral alta), com tenofovir ou entecavir. A VACINA está no calendário desde o NASCIMENTO. E existe uma conduta de prova que não pode falhar: recém-nascido de mãe HBsAg POSITIVO recebe VACINA + IMUNOGLOBULINA específica (HBIG) nas primeiras 12 HORAS de vida — as duas coisas, e nesse prazo. Isso reduz drasticamente a transmissão vertical, que é a que mais cronifica. A hepatite D merece uma linha: ela é um vírus defectivo, só sobrevive na presença do HBsAg — portanto, vacinar contra a B previne também a D.",
     "A hepatite C mudou de patamar: os antivirais de ação direta (DAA) CURAM mais de 95% dos casos, por via oral, em 8 a 12 semanas, e estão disponíveis no SUS — a meta é a eliminação até 2030. Mas atenção a duas coisas: NÃO existe vacina para hepatite C, e o anti-HCV positivo indica apenas CONTATO, não infecção ativa — porque ele pode permanecer positivo mesmo depois da cura. A confirmação exige CARGA VIRAL (HCV-RNA). Todo infectado tem indicação de tratar. Por fim, a vigilância: as hepatites virais são de NOTIFICAÇÃO COMPULSÓRIA, e diante de qualquer IST testa-se o pacote (HIV, sífilis, hepatites B e C). Na hepatite aguda o manejo é suporte, sem antiviral de rotina na A, evitando álcool e hepatotóxicos — e o sinal de alarme é a hepatite FULMINANTE: encefalopatia com INR alargado, que é indicação de transplante."],
   raciocinio:["Separe pela transmissão: A e E = fecal-oral. B, C e D = sangue/sexual/vertical.",
     "Separe pela cronificação: A não cronifica; B cronifica ~5% no adulto mas até 90% no RN (vertical); C cronifica 70-85%.",
     "Leia a sorologia da B pelo significado: HBsAg = vírus presente · anti-HBs = imunidade · anti-HBc = contato com o vírus SELVAGEM.",
     "Anti-HBs+ com anti-HBc NEGATIVO = vacinado. Anti-HBs+ COM anti-HBc IgG+ = curado. HBsAg+ por >6 meses = crônica.",
     "RN de mãe HBsAg+: VACINA + IMUNOGLOBULINA (HBIG) nas primeiras 12 HORAS.",
     "Hepatite C: anti-HCV+ indica contato → confirme com CARGA VIRAL (HCV-RNA). DAA curam >95%; não há vacina.",
     "Notifique (compulsória) e teste o pacote junto às IST: HIV, sífilis, hepatites B e C.",
     "Encefalopatia + INR alargado = hepatite fulminante → transplante."],
   nucleo:["Transmissão: A e E = FECAL-ORAL (E é grave na gestante). B, C, D = sangue/sexual/vertical.",
     "Cronificação: A NÃO cronifica; B ~5% no adulto e até 90% no RN (vertical); C 70-85% (campeã).",
     "HBsAg = infecção (crônica se >6 meses) · anti-HBs = imunidade (vacina ou cura) · anti-HBc IgM = aguda · anti-HBc IgG = contato PRÉVIO com o vírus · HBeAg = replicação/infectividade.",
     "Anti-HBs+ e anti-HBc NEGATIVO = VACINADO. Anti-HBs+ e anti-HBc IgG+ com HBsAg− = CURADO. O anti-HBc é quem separa vacina de infecção natural.",
     "Nem todo portador crônico de B trata (critérios: carga viral, ALT, fibrose, cirrose, gestante com carga alta) — tenofovir ou entecavir.",
     "RN de mãe HBsAg+: VACINA + IMUNOGLOBULINA (HBIG) nas primeiras 12 HORAS de vida.",
     "Hepatite D só existe com HBsAg — vacinar contra B previne a D.",
     "Hepatite C: DAA curam >95% em 8-12 semanas (SUS); NÃO há vacina. Anti-HCV = contato; confirmar com CARGA VIRAL (HCV-RNA).",
     "Hepatites virais = notificação compulsória. Fulminante: encefalopatia + INR alargado → transplante."],
   pega:"O anti-HBc é o que separa VACINADO (anti-HBs+ isolado) de quem teve infecção natural (anti-HBc IgG+). RN de mãe HBsAg+ recebe vacina E imunoglobulina em até 12 horas. E hepatite C tem CURA (>95% com DAA) mas NÃO tem vacina — enquanto a A tem vacina e não cronifica.",
   mne:"A e E entram pela bocA/Água. B, C, D pelo sangue. Anti-HBc = viu o vírus de verdade (vacina não dá). C = Cura, sem vaCina.",
   sus:"Testagem rápida e DAA para hepatite C no SUS (meta de eliminação até 2030); vacina de hepatite B ao nascer no PNI; notificação compulsória."},
  {id:"cm-tev",area:"CM",nome:"Trombose venosa profunda e TEP",yield:3,
   questoes:["cm_tev_q1","cm_tev_q2","cm_tev_q3","cm_tev_q4"],
   fonte:"Diretriz de Tromboembolismo Venoso da Sociedade Brasileira de Angiologia e Cirurgia Vascular e da Sociedade Brasileira de Cardiologia (SBC); Diretriz ESC 2019 de Embolia Pulmonar Aguda; escores de Wells, PERC, Padua e Caprini.",
   aula:["Trombose venosa profunda (TVP) e embolia pulmonar (TEP) não são duas doenças: são a MESMA doença em dois momentos — o tromboembolismo venoso (TEV). O trombo se forma na perna e, se solta, viaja até a artéria pulmonar. A explicação está na tríade de Virchow: ESTASE, LESÃO endotelial e HIPERCOAGULABILIDADE. Os fatores de risco derivam dela: imobilização, cirurgia (especialmente ortopédica de grande porte), câncer, gestação e puerpério, contraceptivo com estrogênio, trombofilias, viagem prolongada, obesidade, idade e TEV prévio. Repare que quase todo paciente internado tem pelo menos um — e é por isso que TEV é a principal causa de morte hospitalar EVITÁVEL.",
     "A TVP dá dor, edema ASSIMÉTRICO de panturrilha, empastamento e aumento da temperatura local; o sinal de Homans é famoso mas tem acurácia ruim. O exame é a ULTRASSONOGRAFIA com doppler (compressão). Já o TEP é o grande IMITADOR: dispneia SÚBITA, dor pleurítica, taquipneia, taquicardia e hipoxemia; pode abrir com síncope ou hemoptise. Os exames de rotina servem mais para afastar outra coisa do que para confirmar: o ECG mostra mais frequentemente apenas taquicardia sinusal (o clássico S1Q3T3 é raro), o raio-x costuma ser normal ou inespecífico, e a gasometria mostra hipoxemia com HIPOCAPNIA (o paciente hiperventila) — ou seja, um raio-x normal em paciente muito dispneico e hipoxêmico deve AUMENTAR sua suspeita de TEP, não diminuir.",
     "A lógica diagnóstica é PROBABILÍSTICA, e é aqui que a prova separa quem entende. Primeiro estime a probabilidade com o escore de WELLS. Se ela é BAIXA, peça o D-DÍMERO: sendo NEGATIVO, ele EXCLUI o diagnóstico — é o exemplo perfeito do SnNout (teste sensível que, negativo, afasta). Se o D-dímero vier positivo, ou se a probabilidade já era ALTA, vá direto para a ANGIOTOMOGRAFIA de tórax, que é o exame confirmatório na prática. E guarde a pegadinha: o D-dímero NÃO confirma nada — ele é inespecífico e sobe em câncer, gestação, infecção, pós-operatório e simplesmente com a idade. Pedir D-dímero em paciente de ALTA probabilidade é erro: você perde tempo e vai fazer a tomografia de qualquer jeito. Quando o contraste é contraindicado (doença renal, alergia) ou na gestante, a alternativa é a cintilografia de ventilação/perfusão.",
     "O tratamento é a ANTICOAGULAÇÃO, e ela começa já na suspeita ALTA, antes mesmo da confirmação, desde que não haja contraindicação — esperar o exame para anticoagular um paciente com alta probabilidade é conduta errada. Hoje os DOAC (rivaroxabana, apixabana) são a escolha na maioria dos casos, por não exigirem controle de INR. A varfarina permanece obrigatória em situações específicas: síndrome antifosfolípide, prótese valvar mecânica e doença renal avançada. Na gestante, a resposta é HEPARINA de baixo peso molecular — varfarina e DOAC estão contraindicados. Quanto ao TEMPO: 3 meses quando havia um fator provocador TRANSITÓRIO (cirurgia, imobilização); anticoagulação INDEFINIDA quando o evento foi não provocado, recorrente, ou há trombofilia/câncer ativo.",
     "A gravidade define o que vem além. TEP de ALTO RISCO (maciço) é aquele com INSTABILIDADE hemodinâmica — hipotensão ou choque: a conduta é TROMBÓLISE (alteplase), e a decisão não espera nada. No risco INTERMEDIÁRIO, o paciente está normotenso mas tem sinais de sobrecarga do ventrículo direito (disfunção de VD no ecocardiograma, troponina ou BNP elevados): anticoagula-se e monitora-se de perto, considerando resgate se deteriorar. O filtro de veia cava tem indicação estreita: apenas quando a anticoagulação está contraindicada. E o mais importante de tudo, porque é onde se salva mais gente: a PROFILAXIA. Todo paciente internado deve ter o risco avaliado (escores de Padua ou Caprini) e receber profilaxia mecânica ou farmacológica — prevenir o TEV vale mais do que tratá-lo bem."],
   raciocinio:["Dispneia SÚBITA + taquicardia + hipoxemia com raio-x normal? Suspeite de TEP — o Rx normal AUMENTA a suspeita.",
     "Estime a probabilidade (Wells) ANTES de pedir exame.",
     "Baixa probabilidade → D-DÍMERO: negativo EXCLUI. Positivo → angioTC.",
     "ALTA probabilidade → vá DIRETO para a angioTC. Não peça D-dímero (ele não confirma).",
     "Contraste contraindicado ou gestante → cintilografia V/Q. TVP → USG com doppler.",
     "Suspeita alta sem contraindicação: ANTICOAGULE já, antes da confirmação.",
     "Instabilidade hemodinâmica (hipotensão/choque) = TEP de alto risco → TROMBÓLISE.",
     "Escolha e duração: DOAC na maioria; varfarina se SAAF/valva mecânica/DRC grave; HBPM na gestante. 3 meses se fator transitório; indefinido se não provocado/recorrente/câncer.",
     "Todo internado: avalie risco (Padua/Caprini) e faça PROFILAXIA."],
   nucleo:["TVP e TEP = mesma doença (TEV). Tríade de Virchow: estase, lesão endotelial, hipercoagulabilidade.",
     "TVP: edema assimétrico → USG com doppler. TEP: dispneia súbita, taquicardia, hipoxemia com HIPOCAPNIA; ECG mais comum = taquicardia sinusal (S1Q3T3 é raro); Rx normal não afasta.",
     "Wells define a estratégia: baixa probabilidade → D-DÍMERO (negativo EXCLUI). Alta probabilidade → ANGIOTC direto.",
     "D-dímero NÃO confirma (sobe em câncer, gestação, infecção, idade, pós-op) — só serve para excluir em baixa probabilidade.",
     "Contraste contraindicado/gestante: cintilografia V/Q.",
     "Anticoagular já na suspeita ALTA. DOAC (rivaroxabana/apixabana) na maioria; varfarina em SAAF, prótese mecânica, DRC grave; HBPM na gestante (varfarina e DOAC proibidos).",
     "Duração: 3 meses se fator provocador transitório; indefinida se não provocado, recorrente, trombofilia ou câncer ativo.",
     "TEP de ALTO RISCO = instabilidade hemodinâmica → TROMBÓLISE (alteplase). Intermediário: disfunção de VD/troponina → anticoagular e monitorar.",
     "Filtro de veia cava só se anticoagulação contraindicada. TEV é a principal causa de morte hospitalar EVITÁVEL: avaliar risco (Padua/Caprini) e profilaxia."],
   pega:"D-dímero EXCLUI (em baixa probabilidade), mas NÃO confirma — em alta probabilidade vá direto para a angioTC. Raio-x normal não afasta TEP: num dispneico hipoxêmico, aumenta a suspeita. E instabilidade hemodinâmica = trombólise.",
   mne:"Wells baixo → D-dímero (negativo afasta). Wells alto → angioTC. Instável → trombolisa. Gestante → HBPM.",
   sus:"Profilaxia de TEV em internados é indicador de segurança do paciente (NSP); TEV é a morte hospitalar mais evitável."},

  {id:"cm-fa",area:"CM",nome:"Fibrilação atrial",yield:3,
   questoes:["cm_fa_q1","cm_fa_q2","cm_fa_q3","cm_fa_q4"],
   fonte:"Diretriz Brasileira de Fibrilação Atrial (Sociedade Brasileira de Cardiologia); Diretriz ESC 2024 de Fibrilação Atrial; escores CHA2DS2-VASc e HAS-BLED.",
   aula:["Na fibrilação atrial (FA) o átrio deixa de contrair de forma organizada e passa a apenas 'tremer'. No ECG isso aparece de duas maneiras que fecham o diagnóstico: AUSÊNCIA de onda P e intervalos RR IRREGULARMENTE irregulares — sem qualquer padrão. É a arritmia sustentada mais comum, e ela faz mal por dois caminhos distintos. Primeiro, perde-se a contração atrial, que contribui com cerca de 20% do débito cardíaco: daí palpitação, cansaço e descompensação de insuficiência cardíaca. Segundo, e mais grave: o sangue ESTAGNA dentro do átrio esquerdo, sobretudo no apêndice atrial, forma-se TROMBO, e esse trombo emboliza para o cérebro. O AVC cardioembólico da FA é caracteristicamente grande e devastador — prevenir isso é o objetivo central do tratamento. Os fatores associados: hipertensão (o mais comum), idade, valvopatia mitral, insuficiência cardíaca, hipertireoidismo, álcool, apneia do sono e quadros agudos como sepse e pós-operatório.",
     "Diante de uma FA, faça três perguntas nesta ordem: o paciente está INSTÁVEL? preciso ANTICOAGULAR? e vou controlar FREQUÊNCIA ou RITMO? A primeira tem prioridade absoluta. Se há instabilidade — hipotensão, angina, insuficiência cardíaca aguda, síncope ou rebaixamento —, a conduta é CARDIOVERSÃO ELÉTRICA SINCRONIZADA IMEDIATA, sem discussão e sem esperar exame, escore ou tempo de arritmia.",
     "No paciente ESTÁVEL, escolhe-se a estratégia. CONTROLE DE FREQUÊNCIA: betabloqueador ou bloqueador de canal de cálcio não di-hidropiridínico (diltiazem, verapamil); a digoxina fica para o portador de insuficiência cardíaca ou o idoso sedentário. CONTROLE DE RITMO: antiarrítmico (amiodarona, propafenona) ou ablação por cateter. Historicamente as duas estratégias empataram em desfecho, mas os dados mais recentes apontam benefício do controle de ritmo PRECOCE, no primeiro ano após o diagnóstico. E aqui está a armadilha conceitual mais importante do tema: controlar o ritmo NÃO dispensa a anticoagulação. O paciente pode estar em ritmo sinusal e continuar embolizando — a decisão de anticoagular é independente da estratégia escolhida.",
     "A anticoagulação se decide pelo CHA2DS2-VASc, que soma: insuficiência Cardíaca (1), Hipertensão (1), Age ≥75 anos (2 pontos), Diabetes (1), Stroke/AVC ou AIT prévio (2 pontos), doença Vascular (1), Age 65-74 anos (1) e Sexo feminino (1). Indica-se anticoagular com 2 ou mais pontos no homem e 3 ou mais na mulher; com 1 (homem) ou 2 (mulher), considera-se. Note que um AVC prévio já vale 2 e anticoagula sozinho. Sobre a escolha da droga, duas regras de prova: os DOAC são preferidos à varfarina na FA não valvar; MAS na FA VALVAR — que significa estenose mitral moderada a grave ou prótese valvar MECÂNICA — o DOAC está CONTRAINDICADO e a varfarina é obrigatória. Mais duas pegadinhas: o escore HAS-BLED estima risco de sangramento, porém NÃO contraindica anticoagular — ele serve para identificar e corrigir fatores modificáveis; e o AAS NÃO substitui anticoagulante na prevenção do AVC da FA.",
     "Falta o fator TEMPO, que governa a cardioversão eletiva. Se a FA tem MAIS de 48 horas, ou se o tempo de início é indeterminado, existe risco de já haver trombo no átrio — e cardioverter nesse cenário é atirar o coágulo no cérebro. Então há duas saídas: anticoagular por 3 SEMANAS antes e 4 semanas depois da cardioversão; OU fazer um ECOCARDIOGRAMA TRANSESOFÁGICO para excluir trombo e, não havendo, cardioverter. Com menos de 48 horas, pode-se cardioverter, ajustando a anticoagulação ao risco. E depois de QUALQUER cardioversão, mantém-se anticoagulação por pelo menos 4 semanas, porque o átrio fica 'atordoado' e continua trombogênico mesmo em ritmo sinusal."],
   raciocinio:["ECG sem onda P + RR irregularmente irregular = FA.",
     "Pergunta 1: está INSTÁVEL (hipotensão, angina, IC aguda, rebaixamento)? → CARDIOVERSÃO ELÉTRICA sincronizada IMEDIATA.",
     "Pergunta 2: anticoagular? Calcule o CHA2DS2-VASc: ≥2 em homens e ≥3 em mulheres = anticoagular.",
     "Escolha a droga: DOAC na FA não valvar. FA VALVAR (estenose mitral moderada/grave ou prótese MECÂNICA) = VARFARINA obrigatória.",
     "HAS-BLED não contraindica anticoagulação — serve para corrigir fatores de sangramento modificáveis. AAS não substitui anticoagulante.",
     "Pergunta 3: frequência (betabloqueador, diltiazem/verapamil; digoxina se IC/idoso) ou ritmo (amiodarona, propafenona, ablação)?",
     "Lembre: controlar o RITMO não dispensa a ANTICOAGULAÇÃO.",
     "Cardioversão eletiva com FA >48h ou tempo indeterminado: anticoagular 3 semanas antes e 4 depois, OU eco TRANSESOFÁGICO para excluir trombo. Após qualquer cardioversão: anticoagular ≥4 semanas."],
   nucleo:["ECG: ausência de onda P + RR IRREGULARMENTE irregular. Arritmia sustentada mais comum.",
     "Dois danos: perda de ~20% do débito (sintoma/IC) e ESTASE no apêndice atrial → trombo → AVC cardioembólico grave.",
     "INSTÁVEL (hipotensão, angina, IC aguda, síncope) = CARDIOVERSÃO ELÉTRICA sincronizada IMEDIATA.",
     "CHA2DS2-VASc: IC(1) · HAS(1) · Idade ≥75 (2) · DM(1) · AVC/AIT prévio (2) · doença Vascular(1) · Idade 65-74(1) · Sexo feminino(1). Anticoagular: ≥2 homens, ≥3 mulheres.",
     "DOAC preferido na FA NÃO valvar. FA VALVAR (estenose mitral moderada/grave, prótese MECÂNICA) → VARFARINA (DOAC contraindicado).",
     "HAS-BLED NÃO contraindica anticoagular (corrige modificáveis). AAS NÃO substitui anticoagulante.",
     "Frequência: betabloqueador, diltiazem/verapamil (digoxina se IC/idoso). Ritmo: amiodarona, propafenona, ablação — há benefício do controle de ritmo PRECOCE (<1 ano).",
     "Controle de ritmo NÃO dispensa anticoagulação.",
     "Cardioversão com FA >48h/indeterminada: 3 semanas antes + 4 depois OU eco transesofágico. Após cardioverter: anticoagular ≥4 semanas (átrio atordoado)."],
   pega:"Controlar o ritmo NÃO dispensa a anticoagulação — são decisões independentes. DOAC é PROIBIDO na FA valvar (estenose mitral moderada/grave e prótese mecânica): usa-se varfarina. E HAS-BLED alto não contraindica anticoagular.",
   mne:"CHA2DS2-VASc: C-H-A2-D-S2-V-A-Sc. Instável = choque elétrico sincronizado. >48h = 3 semanas antes / 4 depois (ou eco TE).",
   sus:"FA é causa importante de AVC evitável; rastreio do pulso irregular e anticoagulação acompanhada na APS."},

  {id:"cm-cirrose",area:"CM",nome:"Cirrose e suas complicações",yield:3,
   questoes:["cm_cir_q1","cm_cir_q2","cm_cir_q3","cm_cir_q4"],
   fonte:"Diretrizes da Sociedade Brasileira de Hepatologia (SBH); Consenso de Baveno VII (hipertensão portal); diretrizes AASLD/EASL para ascite, PBE e encefalopatia hepática; escores Child-Pugh e MELD.",
   aula:["Cirrose é o ponto final de qualquer agressão crônica ao fígado: fibrose difusa com nódulos de regeneração, que distorcem a arquitetura e o fluxo. No Brasil, as causas principais são o ÁLCOOL, as hepatites B e C, e — em ascensão rápida — a doença hepática gordurosa metabólica. As consequências se organizam em dois grandes eixos, e todo o resto deriva deles. INSUFICIÊNCIA HEPATOCELULAR: o fígado deixa de fazer seu trabalho — daí icterícia, coagulopatia com INR alargado, hipoalbuminemia, encefalopatia, e os sinais do excesso de estrogênio não metabolizado (aranhas vasculares, eritema palmar, ginecomastia). HIPERTENSÃO PORTAL: o sangue não passa pelo fígado fibrótico e busca desvios — daí varizes esofágicas, ascite, esplenomegalia e circulação colateral.",
     "A cirrose COMPENSADA pode durar anos em silêncio; ela vira DESCOMPENSADA quando aparece uma destas quatro: ascite, sangramento por varizes, encefalopatia ou icterícia. O prognóstico se mede por dois escores: CHILD-PUGH (bilirrubina, albumina, INR, ascite e encefalopatia) e MELD (bilirrubina, INR e creatinina), este último usado para ordenar a fila de transplante. E não esqueça o rastreio que muda desfecho: todo cirrótico faz ULTRASSONOGRAFIA a cada 6 MESES para detectar carcinoma hepatocelular.",
     "A ASCITE se investiga com PARACENTESE — e o exame que responde a pergunta certa é o GASA, o gradiente de albumina soro-ascite: GASA maior ou igual a 1,1 significa HIPERTENSÃO PORTAL (cirrose, insuficiência cardíaca); menor que 1,1 aponta outras causas (carcinomatose peritoneal, tuberculose, doença pancreática). O tratamento combina restrição de SÓDIO com diuréticos, classicamente espironolactona e furosemida na proporção 100:40 — a espironolactona lidera porque o hiperaldosteronismo é parte do problema. Na ascite volumosa faz-se paracentese de alívio, e se retirar mais de 5 litros repõe-se ALBUMINA, para não precipitar disfunção circulatória. A complicação a temer é a PERITONITE BACTERIANA ESPONTÂNEA (PBE): o diagnóstico se faz pela contagem de POLIMORFONUCLEARES ≥ 250/mm³ no líquido ascítico — e essa é a pegadinha, porque a cultura é NEGATIVA em cerca de 40% dos casos e não se espera por ela. O tratamento é cefotaxima (ou ceftriaxona) MAIS ALBUMINA, que reduz a síndrome hepatorrenal e a mortalidade; depois, profilaxia secundária com norfloxacino.",
     "As VARIZES esofágicas se rastreiam por endoscopia. Havendo varizes de risco, a profilaxia PRIMÁRIA é betabloqueador não seletivo (propranolol, carvedilol) ou ligadura elástica. No SANGRAMENTO agudo, o pacote tem quatro peças e cada uma cai em prova: (1) estabilizar com transfusão RESTRITIVA, alvo de hemoglobina em torno de 7-8 — transfundir demais AUMENTA a pressão portal e provoca ressangramento, e essa contra-intuição é muito cobrada; (2) droga vasoativa (terlipressina ou octreotide); (3) ANTIBIÓTICO profilático com ceftriaxona, que reduz MORTALIDADE — não é opcional; e (4) endoscopia com ligadura elástica em até 12 horas. O balão de tamponamento é apenas ponte, e o TIPS entra no refratário.",
     "A ENCEFALOPATIA hepática se manifesta por inversão do ciclo do sono, confusão, rebaixamento e o FLAPPING (asterixis). E existe uma regra de ouro: encefalopatia quase sempre tem um FATOR PRECIPITANTE, e achá-lo é metade do tratamento — procure infecção (sobretudo PBE), sangramento digestivo, constipação, distúrbio eletrolítico, diurético em excesso, sedativos, ou um TIPS. O tratamento é LACTULOSE, titulada para 2 a 3 evacuações por dia, associada a rifaximina nos casos recorrentes. E aqui está a última pegadinha, uma conduta antiga que foi abandonada: NÃO se restringe proteína. O cirrótico é sarcopênico e desnutrido; restringir proteína piora o prognóstico. Mantém-se o aporte proteico adequado."],
   raciocinio:["Reconheça os dois eixos: insuficiência hepatocelular (icterícia, INR alargado, albumina baixa, encefalopatia) e hipertensão portal (varizes, ascite, esplenomegalia).",
     "Descompensou? Ascite, sangramento varicoso, encefalopatia ou icterícia. Estratifique com Child-Pugh e MELD (fila de transplante).",
     "Ascite: PARACENTESE + GASA. ≥1,1 = hipertensão portal; <1,1 = carcinomatose/TB/pâncreas.",
     "Trate a ascite: restrição de sódio + espironolactona/furosemida (100:40). Paracentese >5 L → repor ALBUMINA.",
     "Suspeita de PBE: PMN ≥250/mm³ no líquido fecha o diagnóstico (não espere a cultura, negativa em ~40%) → cefotaxima + ALBUMINA; depois norfloxacino.",
     "Varizes: rastreio endoscópico; profilaxia primária com betabloqueador não seletivo ou ligadura.",
     "Sangramento varicoso: transfusão RESTRITIVA (Hb ~7-8), terlipressina/octreotide, CEFTRIAXONA (reduz mortalidade) e ligadura em até 12h.",
     "Encefalopatia: procure o PRECIPITANTE (PBE, sangramento, constipação, eletrólitos, sedativo) e dê LACTULOSE (2-3 evacuações/dia) ± rifaximina. NÃO restrinja proteína.",
     "Todo cirrótico: USG a cada 6 meses para rastrear carcinoma hepatocelular."],
   nucleo:["Dois eixos: insuficiência hepatocelular (icterícia, INR, albumina, encefalopatia, aranhas/eritema palmar) e HIPERTENSÃO PORTAL (varizes, ascite, esplenomegalia, colaterais).",
     "Descompensação = ascite, sangramento varicoso, encefalopatia ou icterícia. Child-Pugh (BI, albumina, INR, ascite, encefalopatia) e MELD (BI, INR, creatinina — transplante).",
     "Ascite: GASA ≥1,1 = hipertensão portal; <1,1 = outras causas. Tratar com restrição de sódio + espironolactona:furosemida (100:40). Paracentese >5 L → albumina.",
     "PBE: diagnóstico por PMN ≥250/mm³ (cultura negativa em ~40% — não esperar). Tratar com cefotaxima/ceftriaxona + ALBUMINA (reduz síndrome hepatorrenal e mortalidade); profilaxia secundária com norfloxacino.",
     "Varizes: rastreio endoscópico; profilaxia primária com betabloqueador não seletivo (propranolol/carvedilol) ou ligadura.",
     "Sangramento varicoso: transfusão RESTRITIVA (alvo Hb ~7-8; transfundir demais aumenta a pressão portal e ressangra) + terlipressina/octreotide + CEFTRIAXONA profilática (reduz mortalidade) + ligadura em ≤12h. Balão = ponte; TIPS no refratário.",
     "Encefalopatia: flapping/asterixis; SEMPRE procurar precipitante (PBE, sangramento, constipação, eletrólitos, sedativo). Lactulose (2-3 evacuações/dia) + rifaximina. NÃO restringir proteína.",
     "Rastreio de carcinoma hepatocelular: USG a cada 6 meses."],
   pega:"No sangramento varicoso a transfusão é RESTRITIVA (Hb ~7-8) — transfundir demais aumenta a pressão portal e ressangra; e o antibiótico profilático (ceftriaxona) reduz MORTALIDADE, não é opcional. PBE se diagnostica pelo PMN ≥250, sem esperar cultura. E NÃO se restringe proteína na encefalopatia.",
   mne:"GASA ≥1,1 = Portal. PBE = PMN ≥250 → cefotaxima + Albumina. Varizes sangrando: Transfusão restritiva + Terlipressina + Ceftriaxona + Ligadura.",
   sus:"Hepatites B e C tratadas na rede previnem cirrose; MELD ordena a fila de transplante no SUS; USG semestral para rastreio de CHC."},

  {id:"cm-itu",area:"CM",nome:"ITU e pielonefrite",yield:3,
   questoes:["cm_itu_q1","cm_itu_q2","cm_itu_q3","cm_itu_q4"],
   fonte:"Diretrizes da Sociedade Brasileira de Urologia e da IDSA para infecção do trato urinário; Protocolos da Atenção Básica: Saúde das Mulheres (Ministério da Saúde); Manual de Gestação de Alto Risco (MS).",
   aula:["A infecção urinária se divide por ANDAR, e o divisor é a FEBRE. ITU BAIXA (cistite): disúria, polaciúria, urgência e dor suprapúbica, SEM febre e sem repercussão sistêmica — é uma infecção de mucosa. ITU ALTA (pielonefrite): febre, calafrios, dor lombar com punho-percussão (Giordano) positiva, náusea e vômito — o paciente parece doente, porque agora há invasão do parênquima renal. O agente é a Escherichia coli em cerca de 80% dos casos. Essa separação não é acadêmica: muda o exame, a droga e a duração.",
     "Na CISTITE não complicada — mulher jovem, não gestante, sem anormalidade do trato — o diagnóstico é CLÍNICO: não é preciso urocultura de rotina. E o tratamento é CURTO: nitrofurantoína por 5 dias, fosfomicina em dose única, ou sulfametoxazol-trimetoprim onde a resistência local é baixa. Evita-se QUINOLONA para cistite simples — por efeitos adversos, por resistência crescente e porque ela deve ser reservada. Já a ITU COMPLICADA é outro animal, e você a reconhece pelo hospedeiro ou pela anatomia: homem, gestante, criança, diabetes descompensado, cateter vesical, obstrução ou anormalidade anatômica, imunossupressão, ITU recorrente ou de origem hospitalar. Nesses casos: pede-se urocultura, trata-se por mais tempo e investiga-se a causa.",
     "Na PIELONEFRITE, a urocultura vem ANTES do antibiótico. O caso leve a moderado pode ser ambulatorial — aqui a quinolona TEM lugar, assim como as cefalosporinas —, com 7 a 14 dias de tratamento. Interna-se quem vomita e não tolera via oral, a gestante, quem está séptico, quem tem obstrução, e quem falhou no tratamento ambulatorial. E existe uma regra temporal que a prova cobra: se o paciente NÃO melhora em 48 a 72 horas de antibiótico adequado, faça IMAGEM (ultrassonografia ou tomografia) procurando ABSCESSO ou OBSTRUÇÃO. A pielonefrite OBSTRUÍDA é urgência UROLÓGICA — é pus sob pressão, e antibiótico sozinho não resolve: precisa desobstruir/drenar.",
