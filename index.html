  {id:"cm_hep_q1",area:"CM",tema:"Hepatites virais",transv:[],dif:2,premium:false,enun:"Paciente assintomático apresenta: HBsAg negativo, anti-HBs POSITIVO e anti-HBc TOTAL negativo. Interpretação?",alts:["Hepatite B crônica","VACINADO — a vacina contém apenas o antígeno de superfície e não gera anti-HBc; quem teve infecção natural teria anti-HBc positivo","Infecção aguda","Infecção prévia curada"],correta:1,coment:"O anti-HBc é o que separa vacina de infecção natural: a vacina não o produz. Anti-HBs positivo com anti-HBc NEGATIVO = vacinado. Se houvesse anti-HBc IgG positivo com anti-HBs positivo e HBsAg negativo, seria infecção prévia curada."},
  {id:"cm_hep_q2",area:"CM",tema:"Hepatites virais",transv:[],dif:2,premium:false,enun:"Recém-nascido de mãe com HBsAg POSITIVO. Qual a conduta correta?",alts:["Apenas a vacina de hepatite B ao nascer","VACINA + IMUNOGLOBULINA específica (HBIG) nas primeiras 12 HORAS de vida","Iniciar tenofovir no recém-nascido","Aguardar sorologia do RN aos 6 meses para decidir"],correta:1,coment:"A transmissão vertical é a que mais cronifica (até 90%). A profilaxia do RN de mãe HBsAg positivo exige vacina E imunoglobulina específica (HBIG), ambas nas primeiras 12 horas de vida."},
  {id:"cm_hep_q3",area:"CM",tema:"Hepatites virais",transv:[],dif:2,premium:false,enun:"Paciente com anti-HCV POSITIVO em testagem de rotina. Qual o próximo passo?",alts:["Iniciar tratamento imediatamente com antiviral de ação direta","Solicitar CARGA VIRAL (HCV-RNA): o anti-HCV indica apenas contato e pode permanecer positivo após a cura","Repetir o anti-HCV em 6 meses","Vacinar contra hepatite C"],correta:1,coment:"O anti-HCV positivo indica contato com o vírus, não necessariamente infecção ativa — ele pode persistir mesmo após cura espontânea ou tratada. A confirmação é pela carga viral (HCV-RNA). E não existe vacina para hepatite C."},
  {id:"cm_hep_q4",area:"CM",tema:"Hepatites virais",transv:[],dif:2,premium:false,enun:"Sobre as hepatites virais, assinale a alternativa CORRETA:",alts:["A hepatite A cronifica com frequência e tem tratamento antiviral de rotina","A hepatite C tem CURA em mais de 95% com antivirais de ação direta, mas NÃO tem vacina; a hepatite A tem vacina e não cronifica","A hepatite D pode ocorrer isoladamente, sem hepatite B","A hepatite E é sempre benigna, inclusive na gestante"],correta:1,coment:"Hepatite C: cura >95% com DAA em 8-12 semanas (disponíveis no SUS), sem vacina. Hepatite A: tem vacina e não cronifica. A hepatite D é defectiva e só ocorre na presença do HBsAg (vacinar contra B previne D). A hepatite E é grave na gestante."},
  {id:"cm_tev_q1",area:"CM",tema:"Trombose venosa profunda e TEP",transv:[],dif:2,premium:false,enun:"Paciente com ALTA probabilidade clínica de TEP pelo escore de Wells, dispneia súbita e taquicardia. Qual a conduta diagnóstica?",alts:["Solicitar D-dímero e, se negativo, liberar","Ir DIRETO para a angiotomografia de tórax — em alta probabilidade o D-dímero não ajuda (ele exclui, não confirma)","Solicitar apenas raio-x de tórax","Aguardar 24h e repetir o ECG"],correta:1,coment:"O D-dímero só tem utilidade em BAIXA probabilidade, onde um resultado negativo EXCLUI (SnNout). Em alta probabilidade, ele não muda a conduta — você fará a angioTC de qualquer forma. Pedir D-dímero aí é perder tempo."},
  {id:"cm_tev_q2",area:"CM",tema:"Trombose venosa profunda e TEP",transv:[],dif:2,premium:false,enun:"Paciente com TEP confirmado evolui com PA 78/40 mmHg e sinais de choque. Conduta?",alts:["Apenas anticoagulação plena com heparina","TROMBÓLISE (alteplase) — é TEP de alto risco (maciço), definido pela instabilidade hemodinâmica","Filtro de veia cava","Observação em enfermaria"],correta:1,coment:"TEP de alto risco é definido pela instabilidade hemodinâmica (hipotensão/choque) e tem indicação de trombólise. O filtro de veia cava reserva-se aos casos em que a anticoagulação está contraindicada."},
  {id:"cm_tev_q3",area:"CM",tema:"Trombose venosa profunda e TEP",transv:[],dif:2,premium:false,enun:"Gestante de 24 semanas com TVP confirmada. Qual anticoagulante é indicado?",alts:["Varfarina","Heparina de baixo peso molecular (enoxaparina)","Rivaroxabana","Apixabana"],correta:1,coment:"Na gestação, varfarina (teratogênica) e os DOAC estão contraindicados. A anticoagulação é feita com heparina de baixo peso molecular."},
  {id:"cm_tev_q4",area:"CM",tema:"Trombose venosa profunda e TEP",transv:[],dif:2,premium:false,enun:"Homem de 45 anos com TEP após imobilização por fratura (fator provocador transitório), sem trombofilia nem câncer. Qual a duração da anticoagulação?",alts:["3 meses","Indefinida para todos os casos","6 semanas","Apenas durante a internação"],correta:0,coment:"Com fator provocador TRANSITÓRIO, anticoagula-se por 3 meses. A anticoagulação indefinida fica para TEV não provocado, recorrente, com trombofilia ou câncer ativo."},

  {id:"cm_fa_q1",area:"CM",tema:"Fibrilação atrial",transv:[],dif:2,premium:false,enun:"Paciente com FA de início indeterminado chega ao PS com PA 75/45 mmHg, sudorese e rebaixamento do nível de consciência. Conduta?",alts:["Calcular o CHA2DS2-VASc antes de qualquer conduta","CARDIOVERSÃO ELÉTRICA SINCRONIZADA IMEDIATA — a instabilidade hemodinâmica tem prioridade absoluta","Anticoagular por 3 semanas e depois cardioverter","Iniciar digoxina e observar"],correta:1,coment:"Instabilidade hemodinâmica (hipotensão, angina, IC aguda, síncope/rebaixamento) indica cardioversão elétrica sincronizada imediata, independentemente do tempo de arritmia ou do escore. A regra das 3 semanas vale para a cardioversão ELETIVA no paciente estável."},
  {id:"cm_fa_q2",area:"CM",tema:"Fibrilação atrial",transv:[],dif:2,premium:false,enun:"Mulher de 78 anos com FA, hipertensa, diabética, sem AVC prévio. Qual a conduta quanto à anticoagulação?",alts:["Apenas AAS","ANTICOAGULAR: o CHA2DS2-VASc já soma idade ≥75 (2) + HAS (1) + DM (1) + sexo feminino (1) = 5 pontos","Nenhuma profilaxia","Anticoagular somente se houver sintomas"],correta:1,coment:"Somando: idade ≥75 = 2, hipertensão = 1, diabetes = 1, sexo feminino = 1, total 5 pontos. Indica-se anticoagulação (≥2 em homens, ≥3 em mulheres). O AAS NÃO substitui o anticoagulante na prevenção do AVC da FA."},
  {id:"cm_fa_q3",area:"CM",tema:"Fibrilação atrial",transv:[],dif:2,premium:false,enun:"Paciente com FA e prótese valvar MECÂNICA em mitral. Qual anticoagulante deve ser usado?",alts:["Rivaroxabana","VARFARINA — os DOAC são CONTRAINDICADOS na FA valvar (estenose mitral moderada/grave e prótese mecânica)","Apixabana","AAS + clopidogrel"],correta:1,coment:"Na FA VALVAR — estenose mitral moderada a grave ou prótese valvar mecânica — os DOAC estão contraindicados e a varfarina é obrigatória, com controle de INR. Nos demais casos (FA não valvar), os DOAC são preferidos."},
  {id:"cm_fa_q4",area:"CM",tema:"Fibrilação atrial",transv:[],dif:2,premium:false,enun:"Paciente estável com FA há mais de 48 horas, para quem se planeja cardioversão eletiva. Conduta?",alts:["Cardioverter imediatamente, pois está estável","Anticoagular por 3 SEMANAS antes e 4 semanas depois, OU realizar ecocardiograma TRANSESOFÁGICO para excluir trombo e então cardioverter","Apenas AAS por 7 dias e cardioverter","Não há necessidade de anticoagulação em nenhum momento"],correta:1,coment:"Com FA >48h ou de duração indeterminada, pode já existir trombo no átrio: cardioverter sem preparo embolizaria. As opções são anticoagular 3 semanas antes (e 4 semanas depois) ou excluir trombo por eco transesofágico. Após qualquer cardioversão, mantém-se anticoagulação por pelo menos 4 semanas."},

  {id:"cm_cir_q1",area:"CM",tema:"Cirrose e suas complicações",transv:[],dif:2,premium:false,enun:"Cirrótico com ascite. A paracentese revela GASA (gradiente albumina soro-ascite) de 1,6 g/dL. Interpretação?",alts:["Carcinomatose peritoneal","HIPERTENSÃO PORTAL (GASA ≥1,1) — compatível com cirrose","Tuberculose peritoneal","Ascite pancreática"],correta:1,coment:"GASA ≥1,1 g/dL indica hipertensão portal (cirrose, insuficiência cardíaca). GASA <1,1 aponta para carcinomatose, tuberculose ou causa pancreática."},
  {id:"cm_cir_q2",area:"CM",tema:"Cirrose e suas complicações",transv:[],dif:2,premium:false,enun:"Cirrótico com ascite, febre e dor abdominal. Paracentese: 480 polimorfonucleares/mm³, cultura ainda pendente. Conduta?",alts:["Aguardar a cultura antes de tratar","Diagnosticar PBE (PMN ≥250/mm³) e iniciar cefotaxima + ALBUMINA — a cultura é negativa em cerca de 40% e não se espera por ela","Apenas aumentar o diurético","Realizar laparotomia exploradora"],correta:1,coment:"O diagnóstico de peritonite bacteriana espontânea é feito pela contagem de PMN ≥250/mm³ no líquido ascítico, independentemente da cultura (negativa em ~40%). Trata-se com cefotaxima/ceftriaxona MAIS albumina, que reduz síndrome hepatorrenal e mortalidade. Depois, profilaxia secundária com norfloxacino."},
  {id:"cm_cir_q3",area:"CM",tema:"Cirrose e suas complicações",transv:[],dif:2,premium:false,enun:"Cirrótico com hemorragia digestiva alta por varizes esofágicas, hemoglobina de 7,5 g/dL e estável. Qual conduta está CORRETA?",alts:["Transfundir agressivamente até hemoglobina de 12 g/dL","Estratégia RESTRITIVA (alvo Hb ~7-8) + terlipressina/octreotide + CEFTRIAXONA profilática + ligadura endoscópica em até 12h","Antibiótico apenas se houver febre","Contraindicar endoscopia na fase aguda"],correta:1,coment:"Transfundir demais aumenta a pressão portal e favorece o ressangramento — a estratégia é restritiva (alvo ~7-8 g/dL). O pacote inclui droga vasoativa, antibiótico profilático com ceftriaxona (que reduz MORTALIDADE, não é opcional) e ligadura endoscópica em até 12 horas."},
  {id:"cm_cir_q4",area:"CM",tema:"Cirrose e suas complicações",transv:[],dif:2,premium:false,enun:"Cirrótico com confusão mental e flapping (asterixis). Qual conduta está CORRETA?",alts:["Restringir proteína da dieta","Procurar o FATOR PRECIPITANTE (PBE, sangramento, constipação, eletrólitos, sedativos) e iniciar LACTULOSE (2-3 evacuações/dia) — sem restringir proteína","Iniciar apenas sedação","Indicar diálise"],correta:1,coment:"A encefalopatia hepática quase sempre tem precipitante — achá-lo é metade do tratamento. O tratamento é lactulose titulada para 2-3 evacuações diárias (± rifaximina). A restrição proteica é conduta ANTIGA e abandonada: piora a sarcopenia e o prognóstico."},

  {id:"cm_itu_q1",area:"CM",tema:"ITU e pielonefrite",transv:[],dif:2,premium:false,enun:"Mulher de 25 anos, não gestante, hígida, com disúria, polaciúria e dor suprapúbica há 2 dias, SEM febre. Conduta?",alts:["Solicitar urocultura e aguardar o resultado para tratar","Diagnóstico CLÍNICO de cistite não complicada: tratamento curto (nitrofurantoína 5 dias ou fosfomicina dose única), sem urocultura de rotina","Iniciar ciprofloxacino por 14 dias","Solicitar tomografia de abdome"],correta:1,coment:"Cistite não complicada em mulher jovem não gestante tem diagnóstico clínico e tratamento curto. Urocultura de rotina é desnecessária. Evita-se quinolona nesse cenário (efeitos adversos, resistência e necessidade de reservá-la)."},
  {id:"cm_itu_q2",area:"CM",tema:"ITU e pielonefrite",transv:[],dif:2,premium:false,enun:"Idoso de 82 anos, assintomático, faz exame de urina de rotina que mostra bacteriúria e urocultura com 100.000 UFC/mL. Sem febre, sem disúria. Conduta?",alts:["Tratar com antibiótico por 7 dias","NÃO tratar: bacteriúria assintomática não se trata — exceto em GESTANTE e antes de procedimento urológico invasivo","Internar para antibiótico venoso","Trocar de antibiótico a cada 3 meses profilaticamente"],correta:1,coment:"Tratar bacteriúria assintomática em idoso ou cateterizado é erro clássico: não melhora desfecho e seleciona resistência. As únicas exceções em que se trata são a gestante e o paciente que será submetido a procedimento urológico invasivo."},
  {id:"cm_itu_q3",area:"CM",tema:"ITU e pielonefrite",transv:[],dif:2,premium:false,enun:"Paciente internado com pielonefrite mantém febre e dor lombar após 72 horas de antibiótico adequado. Conduta?",alts:["Manter o mesmo esquema por mais 7 dias","Solicitar IMAGEM (USG/TC) para procurar ABSCESSO ou OBSTRUÇÃO — pielonefrite obstruída é urgência urológica e exige desobstrução/drenagem","Suspender o antibiótico","Alta com sintomáticos"],correta:1,coment:"Falha de resposta em 48-72 horas obriga imagem para procurar complicação. A pielonefrite obstruída é pus sob pressão: antibiótico isolado não resolve, é preciso desobstruir ou drenar — trata-se de urgência urológica."},
  {id:"cm_itu_q4",area:"CM",tema:"ITU e pielonefrite",transv:[],dif:2,premium:false,enun:"Gestante de 20 semanas, assintomática, com urocultura de rotina do pré-natal positiva (100.000 UFC/mL de E. coli). Conduta?",alts:["Não tratar, pois está assintomática","TRATAR: na gestante, a bacteriúria assintomática é rastreada e sempre tratada (risco de pielonefrite e parto prematuro), com urocultura de controle após o tratamento","Tratar com ciprofloxacino","Aguardar o aparecimento de sintomas"],correta:1,coment:"A gestante é a principal exceção à regra de não tratar bacteriúria assintomática: nela o risco de progressão para pielonefrite é alto, com associação a parto prematuro. Usa-se cefalexina, amoxicilina ou nitrofurantoína (esta evitada próximo ao termo); quinolona é evitada na gestação. Faz-se urocultura de controle."},
  {id:"ped_rean_q1",area:"PED",tema:"Reanimação neonatal",transv:[],dif:2,premium:false,enun:"Recém-nascido a termo, chorando vigorosamente, com bom tônus. Conduta?",alts:["Levar imediatamente à mesa de reanimação e aspirar vias aéreas","Manter com a mãe: contato pele a pele, clampeamento TARDIO do cordão (1-3 min) e cuidados de rotina","Aspirar traqueia por precaução","Iniciar VPP profilática"],correta:1,coment:"As três perguntas iniciais (a termo? respirando/chorando? tônus bom?) foram todas SIM: o RN não precisa de reanimação. Fica com a mãe, em contato pele a pele, com clampeamento tardio do cordão. Aspiração de rotina é erro (causa bradicardia reflexa)."},
  {id:"ped_rean_q2",area:"PED",tema:"Reanimação neonatal",transv:[],dif:2,premium:false,enun:"RN de 38 semanas, apneico e hipotônico após os passos iniciais, com FC de 80 bpm. Qual a conduta e com qual concentração de oxigênio?",alts:["Massagem cardíaca imediata com O2 a 100%","VENTILAÇÃO COM PRESSÃO POSITIVA (VPP) com AR AMBIENTE (21%), iniciada no 'minuto de ouro'","Adrenalina endovenosa","Aguardar o Apgar do 1º minuto para decidir"],correta:1,coment:"FC <100 bpm com apneia indica VPP — a manobra MAIS importante da reanimação neonatal, pois o problema é pulmonar. Em RN ≥34 semanas inicia-se com ar ambiente (21%); abaixo de 34 semanas, 30%. A massagem só entra se a FC permanecer <60 após VPP efetiva, e o Apgar não define conduta."},
  {id:"ped_rean_q3",area:"PED",tema:"Reanimação neonatal",transv:[],dif:2,premium:false,enun:"Após 30 segundos de VPP, o RN mantém FC de 50 bpm. Qual o passo ANTES de iniciar a massagem cardíaca?",alts:["Administrar adrenalina","CHECAR A TÉCNICA da ventilação (posição da cabeça, vedação da máscara, permeabilidade, pressão) — ventilação inadequada é a causa mais comum de falha","Expandir com soro fisiológico","Repetir o Apgar"],correta:1,coment:"Antes de escalar para massagem, garante-se que a ventilação está EFETIVA — a falha técnica de VPP é a causa mais comum de má resposta. Assegurada a técnica (e indicada a intubação, com O2 a 100%), inicia-se massagem coordenada 3:1 se a FC persistir <60."},
  {id:"ped_rean_q4",area:"PED",tema:"Reanimação neonatal",transv:[],dif:2,premium:false,enun:"RN nasce banhado em líquido meconial espesso, hipotônico e sem respiração eficaz. Conduta ATUAL?",alts:["Aspirar a orofaringe ainda no períneo (intraparto) e a traqueia de rotina antes de ventilar","Passos iniciais e, se necessário, VPP — a aspiração intraparto e a aspiração traqueal de ROTINA foram abandonadas","Intubar e aspirar traqueia obrigatoriamente antes de qualquer manobra","Massagem cardíaca imediata"],correta:1,coment:"As diretrizes abandonaram a aspiração intraparto da orofaringe e a aspiração traqueal de rotina no RN não vigoroso com mecônio. O que esse bebê precisa é VENTILAR — o tempo gasto aspirando é tempo sem oxigênio."},

  {id:"ped_triag_q1",area:"PED",tema:"Triagem neonatal e cuidados com o RN",transv:[],dif:2,premium:false,enun:"Qual é o período IDEAL para a coleta do teste do pezinho e por quê?",alts:["Nas primeiras 12 horas de vida, quanto antes melhor","Entre o 3º e o 5º dia de vida — colher cedo demais gera falso-negativo (a criança precisa ter recebido leite/proteína e o TSH tem pico fisiológico ao nascer)","Somente após o 30º dia","No momento do parto, com sangue do cordão"],correta:1,coment:"O ideal é entre o 3º e o 5º dia. Colher antes de 48h produz falso-negativo (fenilalanina ainda não se elevou e o TSH tem pico fisiológico pós-nascimento); colher tarde demais perde a janela de tratamento."},
  {id:"ped_triag_q2",area:"PED",tema:"Triagem neonatal e cuidados com o RN",transv:[],dif:2,premium:false,enun:"Sobre o teste do coraçãozinho (oximetria de pulso), assinale a alternativa CORRETA:",alts:["É feito no primeiro dia apenas em RN prematuros, medindo os dois membros inferiores","É feito entre 24 e 48 horas em RN ≥34 semanas, medindo SatO2 no membro superior DIREITO (pré-ductal) e em um membro inferior; é ALTERADO se SatO2 <95% em qualquer local OU diferença ≥3% entre eles","É feito com 7 dias de vida e detecta surdez","Substitui o ecocardiograma em caso de alteração"],correta:1,coment:"O teste do coraçãozinho é realizado entre 24 e 48 horas de vida em RN com 34 semanas ou mais, comparando membro superior direito (pré-ductal) com um membro inferior (pós-ductal). Alterado: saturação <95% em qualquer local ou diferença ≥3%. Repete-se em 1h e, persistindo, faz-se ECOCARDIOGRAMA em 24h."},
  {id:"ped_triag_q3",area:"PED",tema:"Triagem neonatal e cuidados com o RN",transv:[],dif:2,premium:false,enun:"Em consulta de puericultura, o teste do reflexo vermelho ('olhinho') mostra-se ausente no olho direito. Conduta?",alts:["Repetir em 6 meses","Encaminhamento URGENTE ao oftalmologista — pode ser catarata congênita, glaucoma ou RETINOBLASTOMA","Prescrever colírio lubrificante","Tranquilizar os pais, pois é variação normal"],correta:1,coment:"Reflexo vermelho ausente, alterado ou assimétrico exige encaminhamento urgente: as causas incluem catarata congênita, glaucoma e retinoblastoma — neste último, o atraso custa o olho e pode custar a vida."},
  {id:"ped_triag_q4",area:"PED",tema:"Triagem neonatal e cuidados com o RN",transv:[],dif:2,premium:false,enun:"Qual medicação é administrada por via intramuscular ao recém-nascido na sala de parto para prevenir a doença hemorrágica do RN?",alts:["Vitamina D","Vitamina K","Sulfato ferroso","Imunoglobulina anti-D"],correta:1,coment:"A vitamina K intramuscular previne a doença hemorrágica do recém-nascido. Compõem ainda a rotina: credeização (profilaxia da oftalmia neonatal gonocócica), vacinas BCG e hepatite B, contato pele a pele e aleitamento na primeira hora."},

  {id:"ped_cardio_q1",area:"PED",tema:"Cardiopatias congênitas",transv:[],dif:2,premium:false,enun:"RN de 4 dias, que teve alta bem da maternidade, retorna em choque, com cianose intensa, acidose e pulsos femorais fracos. Qual a hipótese e a conduta imediata?",alts:["Sepse neonatal; apenas antibiótico","Cardiopatia DUCTO-DEPENDENTE (o canal arterial fechou); iniciar PROSTAGLANDINA E1 para MANTER o canal aberto, estabilizar e transferir","Bronquiolite; suporte","Fechar o canal arterial com ibuprofeno"],correta:1,coment:"RN que estava bem e colapsa nos primeiros dias, quando o canal arterial fisiologicamente fecha, sugere cardiopatia ducto-dependente (TGA, atresia pulmonar, coarctação grave, hipoplasia de VE). A conduta que salva é prostaglandina E1 para MANTER o canal ABERTO — jamais fechá-lo."},
  {id:"ped_cardio_q2",area:"PED",tema:"Cardiopatias congênitas",transv:[],dif:2,premium:false,enun:"Recém-nascido cianótico. Ofertado oxigênio a 100%, a saturação praticamente NÃO melhora. Como interpretar?",alts:["Causa pulmonar","Causa CARDÍACA — teste da hiperóxia negativo indica shunt: o sangue desvia do pulmão e o O2 ofertado não o alcança","Metemoglobinemia sempre","Erro do oxímetro"],correta:1,coment:"No teste da hiperóxia, a cianose de causa pulmonar melhora com O2 a 100%; a de causa cardíaca (shunt direita-esquerda) NÃO melhora, porque o sangue simplesmente não passa pelo pulmão."},
  {id:"ped_cardio_q3",area:"PED",tema:"Cardiopatias congênitas",transv:[],dif:2,premium:false,enun:"Criança com tetralogia de Fallot apresenta crise hipoxêmica ('tet spell') durante o choro, com cianose súbita e intensa. Qual manobra é característica do manejo?",alts:["Colocar em posição de Trendelenburg","Posição GENUPEITORAL (joelhos no peito), somada a O2, morfina e volume","Hiperventilar com ambu","Aplicar vasodilatador sistêmico"],correta:1,coment:"A posição genupeitoral aumenta a resistência vascular sistêmica, reduz o shunt direita-esquerda e melhora o fluxo pulmonar — é a manobra clássica da crise hipoxêmica, associada a oxigênio, morfina e expansão volêmica. Vasodilatador sistêmico PIORA o shunt."},
  {id:"ped_cardio_q4",area:"PED",tema:"Cardiopatias congênitas",transv:[],dif:2,premium:false,enun:"Qual característica de sopro em criança NUNCA deve ser considerada inocente?",alts:["Sopro sistólico suave que muda com a posição","Sopro DIASTÓLICO","Sopro em criança assintomática","Sopro que desaparece de pé"],correta:1,coment:"Sopro diastólico nunca é inocente e exige investigação com ecocardiograma. Outros sinais de alerta: holossistólico, frêmito, intensidade ≥3/6, sintomas (cansaço à mamada, baixo ganho de peso), cianose e pulsos alterados. A maioria dos sopros na infância, porém, é inocente."},

  {id:"ped_cong_q1",area:"PED",tema:"Infecções congênitas (STORCH)",transv:[],dif:2,premium:false,enun:"RN com rinite serossanguinolenta, lesões bolhosas em palmas e plantas, hepatoesplenomegalia e periostite ao raio-x de ossos longos. Diagnóstico?",alts:["Citomegalovirose congênita","SÍFILIS congênita","Toxoplasmose congênita","Rubéola congênita"],correta:1,coment:"Rinite sanguinolenta, pênfigo palmoplantar, lesões ósseas (periostite, pseudoparalisia de Parrot) e hepatoesplenomegalia compõem o quadro clássico da sífilis congênita — doença 100% evitável e de notificação compulsória, cuja ocorrência denuncia falha do pré-natal."},
  {id:"ped_cong_q2",area:"PED",tema:"Infecções congênitas (STORCH)",transv:[],dif:2,premium:false,enun:"Gestante com sífilis recebeu penicilina benzatina, esquema completo e adequado ao estágio, concluído 10 DIAS antes do parto. Como classificar o tratamento e qual a conduta com o RN?",alts:["Adequadamente tratada; nenhuma investigação é necessária","NÃO adequadamente tratada (o esquema deve estar concluído até 30 dias antes do parto): investigar o RN (VDRL, hemograma, Rx de ossos longos, líquor) e tratar conforme achados","Adequadamente tratada, desde que o VDRL esteja negativo","Irrelevante, pois só importa o VDRL do RN"],correta:1,coment:"Um dos critérios de 'mãe adequadamente tratada' é que o esquema com penicilina benzatina, completo e apropriado ao estágio, tenha sido iniciado/concluído até 30 dias antes do parto, com queda de titulação (e parceiro tratado). Fora disso, o RN é investigado integralmente e tratado conforme os achados."},
  {id:"ped_cong_q3",area:"PED",tema:"Infecções congênitas (STORCH)",transv:[],dif:2,premium:false,enun:"Lactente com coriorretinite, hidrocefalia e calcificações cerebrais DIFUSAS. Diagnóstico mais provável?",alts:["Citomegalovirose congênita","TOXOPLASMOSE congênita (tríade de Sabin)","Sífilis congênita","Zika congênito"],correta:1,coment:"A tríade de Sabin — coriorretinite + hidrocefalia + calcificações DIFUSAS — caracteriza a toxoplasmose congênita. O CMV, ao contrário, cursa com MICROCEFALIA e calcificações PERIVENTRICULARES: é esse par que a banca troca."},
  {id:"ped_cong_q4",area:"PED",tema:"Infecções congênitas (STORCH)",transv:[],dif:2,premium:false,enun:"Qual é a infecção congênita MAIS COMUM e a principal causa não genética de surdez neurossensorial?",alts:["Toxoplasmose","CITOMEGALOVÍRUS (CMV)","Rubéola","Herpes"],correta:1,coment:"O CMV é a infecção congênita mais frequente e a principal causa não genética de surdez neurossensorial. Cursa com microcefalia e calcificações periventriculares; o diagnóstico se faz por PCR em urina ou saliva nas primeiras 3 semanas de vida, e casos selecionados (sintomáticos/com acometimento do SNC) tratam com ganciclovir/valganciclovir, melhorando o desfecho auditivo."},
  {id:"cir_tx_q1",area:"CIR",tema:"Trauma torácico",transv:[],dif:2,premium:false,enun:"Vítima de acidente com dispneia intensa, PA 70/40, turgência jugular, desvio de traqueia para a esquerda, timpanismo e ausência de murmúrio vesicular à direita. Conduta?",alts:["Solicitar raio-x de tórax para confirmar antes de qualquer intervenção","Descompressão IMEDIATA por agulha (5º espaço intercostal, linha axilar média) seguida de drenagem torácica — o diagnóstico de pneumotórax hipertensivo é CLÍNICO","Pericardiocentese","Intubar e observar"],correta:1,coment:"Pneumotórax hipertensivo é diagnóstico clínico: esperar o raio-x mata. A conduta é descompressão imediata por agulha — o ATLS 11ª edição recomenda o 5º espaço intercostal na linha axilar média (antes era 2º EIC/linha hemiclavicular) — seguida de drenagem definitiva."},
  {id:"cir_tx_q2",area:"CIR",tema:"Trauma torácico",transv:[],dif:2,premium:false,enun:"Vítima de ferimento por arma branca em região precordial, hipotensa, com turgência jugular e BULHAS ABAFADAS, mas com murmúrio vesicular presente e simétrico. Diagnóstico?",alts:["Pneumotórax hipertensivo","TAMPONAMENTO CARDÍACO (tríade de Beck)","Hemotórax maciço","Contusão pulmonar"],correta:1,coment:"Tríade de Beck: hipotensão + turgência jugular + bulhas abafadas, típica do trauma penetrante precordial. O que separa do pneumotórax hipertensivo é o exame do pulmão: aqui o murmúrio está NORMAL e não há desvio de traqueia. O FAST confirma; pericardiocentese é ponte e o definitivo é cirúrgico."},
  {id:"cir_tx_q3",area:"CIR",tema:"Trauma torácico",transv:[],dif:2,premium:false,enun:"Paciente com hemotórax é submetido a drenagem torácica, com saída IMEDIATA de 1.800 mL de sangue. Conduta?",alts:["Manter apenas o dreno e observar","TORACOTOMIA — drenagem inicial >1.500 mL (ou >200 mL/h por 2-4h) indica cirurgia","Retirar o dreno","Apenas repor volume e reavaliar em 24h"],correta:1,coment:"Hemotórax maciço com saída imediata superior a 1.500 mL, ou débito mantido acima de 200 mL/h por 2 a 4 horas, indica toracotomia. A drenagem e a reposição volêmica correm simultaneamente."},
  {id:"cir_tx_q4",area:"CIR",tema:"Trauma torácico",transv:[],dif:2,premium:false,enun:"Diante de um pneumotórax ABERTO (ferida soprante), qual conduta é correta e qual erro deve ser evitado?",alts:["Ocluir a ferida nos quatro lados com curativo hermético","Curativo de TRÊS pontas (valvulado) e depois drenagem em outro sítio — ocluir os 4 lados converte em pneumotórax HIPERTENSIVO","Apenas observar","Suturar a ferida imediatamente sem drenagem"],correta:1,coment:"O curativo de três pontas funciona como válvula: deixa o ar sair e não deixa entrar. Fechar hermeticamente os quatro lados aprisiona o ar e transforma o pneumotórax aberto em hipertensivo — erro clássico. Depois, drena-se o tórax em outro local."},

  {id:"cir_abt_q1",area:"CIR",tema:"Trauma abdominal",transv:[],dif:2,premium:false,enun:"Vítima de trauma abdominal contuso, PA 80/50 mmHg, taquicárdica, sem resposta sustentada a volume. FAST POSITIVO (líquido livre no espaço hepatorrenal). Conduta?",alts:["Tomografia de abdome com contraste para estadiar a lesão","LAPAROTOMIA imediata — FAST positivo em paciente INSTÁVEL é indicação cirúrgica, sem tomografia","Manejo não operatório com observação","Angioembolização eletiva"],correta:1,coment:"A regra é direta: instabilidade hemodinâmica + FAST positivo = laparotomia imediata. A tomografia é para o paciente ESTÁVEL — levar um instável para a TC é levar o paciente para morrer no corredor."},
  {id:"cir_abt_q2",area:"CIR",tema:"Trauma abdominal",transv:[],dif:2,premium:false,enun:"Paciente ESTÁVEL, com trauma contuso e TC mostrando lesão esplênica grau III, sem sangramento ativo. Conduta atual?",alts:["Esplenectomia de urgência, pois o grau é alto","MANEJO NÃO OPERATÓRIO com observação monitorada — quem indica cirurgia é a INSTABILIDADE, não o grau da lesão (angioembolização se houver blush)","Laparotomia exploradora para todos os graus ≥II","Alta hospitalar imediata"],correta:1,coment:"O manejo não operatório é o padrão atual para trauma de baço e fígado em paciente ESTÁVEL, com observação em ambiente monitorado e angioembolização se houver extravasamento ativo de contraste. O grau da lesão não indica cirurgia por si só — a instabilidade indica."},
  {id:"cir_abt_q3",area:"CIR",tema:"Trauma abdominal",transv:[],dif:2,premium:false,enun:"Paciente politraumatizado INSTÁVEL com FAST NEGATIVO. Como interpretar?",alts:["Está descartada hemorragia; pode-se liberar o paciente","A hemorragia está em OUTRO compartimento — procure 'no chão e mais quatro': hemorragia externa, tórax, abdome, pelve/retroperitônio e ossos longos","O FAST está sempre errado nesse cenário","Indicação de laparotomia imediata mesmo assim"],correta:1,coment:"FAST negativo em paciente instável não tranquiliza: significa que o sangue está em outro lugar. Os compartimentos a investigar são a hemorragia externa ('no chão'), tórax, abdome, pelve/retroperitônio e ossos longos."},
  {id:"cir_abt_q4",area:"CIR",tema:"Trauma abdominal",transv:[],dif:2,premium:false,enun:"Paciente exangue, hipotérmico, acidótico e coagulopático em laparotomia por trauma. Qual a filosofia cirúrgica indicada?",alts:["Reconstrução definitiva completa no mesmo tempo cirúrgico","CIRURGIA DE CONTROLE DE DANOS: controlar sangramento e contaminação, deixar o abdome aberto, corrigir a TRÍADE LETAL na UTI e reoperar depois","Adiar toda cirurgia até a normalização laboratorial","Apenas laparoscopia diagnóstica"],correta:1,coment:"A tríade letal (hipotermia, acidose e coagulopatia) contraindica a cirurgia definitiva prolongada. O controle de danos limita-se a estancar sangramento e contaminação, com abdome aberto, levando o paciente à UTI para correção fisiológica e reoperação programada."},

  {id:"cir_tce_q1",area:"CIR",tema:"Traumatismo cranioencefálico",transv:[],dif:2,premium:false,enun:"Paciente com TCE, Glasgow de 7, respiração irregular e sem proteção de via aérea. Qual a primeira conduta?",alts:["Tomografia de crânio imediata antes de qualquer intervenção","INTUBAÇÃO orotraqueal — Glasgow ≤8 não protege a via aérea; evitar hipóxia e hipotensão é o que previne a lesão SECUNDÁRIA","Manitol em bolus","Aguardar reavaliação em 30 minutos"],correta:1,coment:"Glasgow ≤8 caracteriza TCE grave e indica intubação. O tratamento do TCE consiste em evitar a lesão secundária: hipóxia e hipotensão são os maiores vilões — um único episódio de hipotensão praticamente dobra a mortalidade."},
  {id:"cir_tce_q2",area:"CIR",tema:"Traumatismo cranioencefálico",transv:[],dif:2,premium:false,enun:"Jovem com trauma temporal, perda de consciência inicial, recuperação com período LÚCIDO e posterior deterioração. TC: coleção BICONVEXA que não cruza suturas. Diagnóstico?",alts:["Hematoma subdural agudo","Hematoma EPIDURAL (extradural) — arterial, da meníngea média, com intervalo lúcido; cirúrgico e de bom prognóstico se drenado a tempo","Hemorragia subaracnóidea","Contusão cerebral difusa"],correta:1,coment:"Imagem biconvexa (lenticular) que não cruza suturas + fratura temporal + intervalo lúcido caracteriza o hematoma epidural, de origem arterial (meníngea média). O subdural é em CRESCENTE, cruza suturas, é venoso (veias-ponte), típico de idoso/etilista e tem prognóstico pior."},
  {id:"cir_tce_q3",area:"CIR",tema:"Traumatismo cranioencefálico",transv:[],dif:2,premium:false,enun:"Paciente com TCE evolui com PA 190/110 mmHg, FC de 45 bpm e respiração irregular. Como interpretar?",alts:["Choque hipovolêmico","TRÍADE DE CUSHING — sinal TARDIO de hipertensão intracraniana (note que é o oposto do choque: pressão SOBE e pulso DESCE)","Reação vagal benigna","Efeito de opioide"],correta:1,coment:"Hipertensão + BRADICARDIA + respiração irregular compõem a tríade de Cushing, sinal tardio e grave de hipertensão intracraniana. É justamente o padrão inverso do choque hipovolêmico (hipotensão + taquicardia) — por isso a banca a usa como pegadinha."},
  {id:"cir_tce_q4",area:"CIR",tema:"Traumatismo cranioencefálico",transv:[],dif:2,premium:false,enun:"Paciente com TCE apresenta equimose periorbitária bilateral (sinal do guaxinim), equimose retroauricular (sinal de Battle) e rinorreia clara. Qual conduta está CONTRAINDICADA?",alts:["Elevar a cabeceira a 30°","Passar SONDA NASOGÁSTRICA — há sinais de fratura de base de crânio; a sonda pode atravessar a fratura e entrar no crânio. Usar via ORAL","Solicitar tomografia de crânio","Manter normocapnia"],correta:1,coment:"Sinal do guaxinim, sinal de Battle, hemotímpano e fístula liquórica indicam fratura de base de crânio. Nesse cenário, a sondagem NASOgástrica (e qualquer sonda nasal) está contraindicada pelo risco de trajeto intracraniano — usa-se a via orogástrica."},

  {id:"cir_colo_q1",area:"CIR",tema:"Doença diverticular e câncer colorretal",transv:[],dif:2,premium:false,enun:"Homem de 62 anos com dor em fossa ilíaca ESQUERDA, febre de 38,2°C e leucocitose. Qual o exame de escolha e qual conduta está contraindicada agora?",alts:["Colonoscopia imediata; tomografia é dispensável","TC de abdome com contraste é o exame de escolha; a COLONOSCOPIA está contraindicada na fase aguda (risco de perfuração) e deve ser feita em 6-8 semanas para excluir neoplasia","Raio-x simples é suficiente; colonoscopia em 24h","Laparotomia exploradora imediata para todos"],correta:1,coment:"O quadro é de diverticulite aguda ('apendicite do lado esquerdo'). A TC com contraste confirma e identifica complicações. Colonoscopia na fase aguda pode perfurar; ela é feita após 6-8 semanas, e é obrigatória para descartar que o quadro fosse um câncer de cólon."},
  {id:"cir_colo_q2",area:"CIR",tema:"Doença diverticular e câncer colorretal",transv:[],dif:2,premium:false,enun:"Paciente com diverticulite e TC mostrando peritonite FECAL generalizada (Hinchey IV). Conduta?",alts:["Antibiótico ambulatorial e reavaliação em 72h","CIRURGIA — Hinchey III (peritonite purulenta) e IV (peritonite fecal) são cirúrgicos (cirurgia de Hartmann ou ressecção com anastomose, conforme as condições)","Drenagem percutânea isolada","Colonoscopia descompressiva"],correta:1,coment:"A classificação de Hinchey guia a conduta: I (abscesso pericólico) e II (abscesso pélvico/à distância) podem ser manejados clinicamente ou com drenagem percutânea (abscessos >4-5 cm); III e IV, com peritonite generalizada, são cirúrgicos."},
  {id:"cir_colo_q3",area:"CIR",tema:"Doença diverticular e câncer colorretal",transv:[],dif:2,premium:false,enun:"Homem de 66 anos com anemia ferropriva, fadiga e perda de peso, sem alteração do hábito intestinal. Qual localização tumoral é mais provável e qual a conduta?",alts:["Cólon esquerdo; tratar a anemia com ferro e reavaliar em 1 ano","CÓLON DIREITO (lúmen largo, fezes líquidas: sangra oculto e obstrui tarde) → COLONOSCOPIA","Reto; tratar hemorroidas","Não investigar, pois não há sangramento visível"],correta:1,coment:"O câncer de cólon direito cresce sem obstruir e se manifesta por sangramento oculto, gerando anemia ferropriva e perda de peso. Já o esquerdo/reto obstrui e altera o hábito. Anemia ferropriva em homem adulto ou mulher pós-menopausa obriga colonoscopia."},
  {id:"cir_colo_q4",area:"CIR",tema:"Doença diverticular e câncer colorretal",transv:[],dif:2,premium:false,enun:"Mulher de 40 anos com hematoquezia e alteração do hábito intestinal há 3 meses procura a UBS. Conduta correta?",alts:["Aguardar os 50 anos para iniciar o rastreamento com sangue oculto","INVESTIGAR com colonoscopia: rastreamento é para ASSINTOMÁTICOS — paciente sintomático investiga direto, em qualquer idade","Solicitar apenas sangue oculto nas fezes","Tratar como hemorroida e reavaliar em 6 meses"],correta:1,coment:"Rastreamento se aplica a pessoas SEM sintomas. Diante de hematoquezia e mudança do hábito intestinal, o caminho é a investigação diagnóstica com colonoscopia, independentemente da idade — atribuir a hemorroida sem investigar é o erro que atrasa o diagnóstico de câncer em jovens."},
];

function schedule(prev,ok){
  let {ef=2.5,intervalo=0,reps=0}=prev||{};
  if(ok){reps+=1;intervalo=reps===1?1:reps===2?3:Math.round(intervalo*ef);ef=Math.max(1.3,ef+0.1);}
  else{reps=0;intervalo=1;ef=Math.max(1.3,ef-0.2);}
  return {ef,intervalo,reps,due:new Date(Date.now()+intervalo*86400000).toISOString()};
}
function Bar({pct,color}){return <div className="bar"><i style={{width:Math.max(2,pct)+"%",background:color||"var(--acc)"}}/></div>}
const sem=p=>p>=70?"var(--acc)":p>=50?"var(--warn)":"var(--bad)";
const dias=iso=>Math.floor((Date.now()-new Date(iso).getTime())/86400000);

function App(){
  const [session,setSession]=useState(null);
  const [booting,setBooting]=useState(true);
  useEffect(()=>{
    if(!CONFIGURADO){setBooting(false);return;}
    sb.auth.getSession().then(({data})=>{AUTH_TOKEN=(data.session&&data.session.access_token)||"";setSession(data.session);setBooting(false);});
    const {data:sub}=sb.auth.onAuthStateChange((_e,s)=>{AUTH_TOKEN=(s&&s.access_token)||"";setSession(s);});
    return ()=>sub.subscription.unsubscribe();
  },[]);
  if(!CONFIGURADO) return <SetupAviso/>;
  if(booting) return <div className="center"><div className="muted">Carregando...</div></div>;
  if(!session) return <Auth/>;
  return <Shell session={session}/>;
}

function SetupAviso(){
  return <div className="center"><div className="card auth">
    <h2 style={{fontSize:20,marginBottom:8}}>Falta configurar o Supabase</h2>
    <div className="muted" style={{fontSize:14,lineHeight:1.6}}>
      Abra o arquivo e cole sua <b>Project URL</b> e sua <b>anon key</b> nas constantes
      SUPABASE_URL e SUPABASE_ANON_KEY (topo do script). Você acha as duas em
      Project Settings → API no painel do Supabase. Depois rode o schema SQL que geramos.
    </div>
  </div></div>;
}

/* =================== AUTH =================== */
function Auth(){
  const [modo,setModo]=useState("entrar");
  const [nome,setNome]=useState(""),[email,setEmail]=useState(""),[senha,setSenha]=useState("");
  const [msg,setMsg]=useState(""),[busy,setBusy]=useState(false);
  const submit=async()=>{
    setBusy(true);setMsg("");
    try{
      if(modo==="criar"){
        const {error}=await sb.auth.signUp({email,password:senha,options:{data:{nome}}});
        if(error)throw error;
        setMsg("Conta criada. Se a confirmação por e-mail estiver ativa, confirme no seu e-mail e depois entre.");
        setModo("entrar");
      }else{
        const {error}=await sb.auth.signInWithPassword({email,password:senha});
        if(error)throw error;
      }
    }catch(e){setMsg(e.message||"Erro.");}
    setBusy(false);
  };
  return <div className="center"><div className="auth">
    <div className="tag" style={{color:"var(--acc)"}}>ENAMED Engine</div>
    <h1 style={{fontSize:26,margin:"6px 0 4px"}}>{modo==="criar"?"Criar conta":"Entrar"}</h1>
    <div className="muted" style={{fontSize:13,marginBottom:16}}>Seu progresso fica salvo e sincroniza entre aparelhos.</div>
    <div className="card">
      {modo==="criar" && <><label>Nome</label><input value={nome} onChange={e=>setNome(e.target.value)}/></>}
      <label>E-mail</label><input type="email" value={email} onChange={e=>setEmail(e.target.value)}/>
      <label>Senha</label><input type="password" value={senha} onChange={e=>setSenha(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()}/>
      {msg && <div className="muted" style={{fontSize:13,marginTop:12,color:"var(--acc2)"}}>{msg}</div>}
      <div style={{marginTop:16}}><button className="btn" style={{width:"100%"}} disabled={busy} onClick={submit}>{busy?"...":(modo==="criar"?"Criar conta":"Entrar")}</button></div>
    </div>
    <div style={{marginTop:14,fontSize:14}} className="muted">
      {modo==="criar"?"Já tem conta? ":"Ainda não tem conta? "}
      <span className="link" onClick={()=>{setModo(modo==="criar"?"entrar":"criar");setMsg("");}}>{modo==="criar"?"Entrar":"Criar agora"}</span>
    </div>
  </div></div>;
}

/* =================== SHELL (app autenticado) =================== */
function Shell({session}){
  const uid=session.user.id;
  const [tab,setTab]=useState("trilha");
  const [tema,setTema]=useState(()=>{try{return localStorage.getItem("enamed_tema")||"escuro"}catch(e){return "escuro"}});
  useEffect(()=>{document.documentElement.setAttribute("data-tema",tema);try{localStorage.setItem("enamed_tema",tema)}catch(e){}},[tema]);
  const [loading,setLoading]=useState(true);
  const [diag,setDiag]=useState(null); // null | "rapido" | "completo"
  const [temasFracos,setTemasFracos]=useState(()=>{try{return JSON.parse(localStorage.getItem("enamed_fracos")||"[]")}catch(e){return[]}});
  const [jaFezDiag,setJaFezDiag]=useState(()=>{try{return localStorage.getItem("enamed_diag_feito")==="1"}catch(e){return false}});
  const [questoes,setQuestoes]=useState([]);
  const [log,setLog]=useState([]);
  const [srs,setSrs]=useState({});
  const [dominio,setDominio]=useState({});
  const [assinatura,setAssinatura]=useState(null);
  const [showAssinar,setShowAssinar]=useState(false);

  const recarregarAssinatura=async()=>{
    const {data}=await sb.from("assinaturas").select("*").eq("user_id",uid).order("criado_em",{ascending:false}).limit(1);
    const a=(data&&data[0])||{plano:"free",status:"ativa"};
    setAssinatura(a);
    return a.status==="ativa"&&a.plano!=="free"&&(!a.expira_em||new Date(a.expira_em)>new Date());
  };

  useEffect(()=>{(async()=>{
    setLoading(true);
    const [q,r,d,s,a]=await Promise.all([
      sb.from("questoes").select("*"),
      sb.from("respostas").select("*").eq("user_id",uid),
      sb.from("dominio").select("*").eq("user_id",uid),
      sb.from("srs").select("*").eq("user_id",uid),
      sb.from("assinaturas").select("*").eq("user_id",uid).order("criado_em",{ascending:false}).limit(1),
    ]);
    let qs=(q.data||[]).map(x=>({id:x.id,area:x.area,tema:x.tema,transv:x.transv||[],dif:x.dificuldade,enun:x.enunciado,alts:x.alternativas,correta:x.correta,coment:x.comentario,premium:x.premium}));
    if(qs.length===0){ qs=SEED; }
    else { // garante que as questoes-de-assunto do SEED existam (mescla sem duplicar)
      const ids=new Set(qs.map(x=>x.id));
      SEED.forEach(sq=>{ if(!ids.has(sq.id)) qs.push(sq); });
    }
    setQuestoes(qs);
    setLog((r.data||[]).map(x=>({id:x.questao_id,area:x.area,tema:x.tema,ok:x.acertou})));
    const dm={};(d.data||[]).forEach(x=>dm[x.topico_id]={nivel:x.nivel,last:x.atualizado_em});setDominio(dm);
    const sr={};(s.data||[]).forEach(x=>sr[x.questao_id]={ef:x.ef,intervalo:x.intervalo,reps:x.reps,due:x.due});setSrs(sr);
    setAssinatura((a.data&&a.data[0])||{plano:"free",status:"ativa"});
    setLoading(false);
  })()},[uid]);

  const isPro = assinatura && assinatura.status==="ativa" && assinatura.plano!=="free" && (!assinatura.expira_em || new Date(assinatura.expira_em)>new Date());

  const registrar=async(q,ok)=>{
    setLog(l=>[...l,{id:q.id,area:q.area,tema:q.tema,ok}]);
    const nova=schedule(srs[q.id],ok);
    setSrs(s=>({...s,[q.id]:nova}));
    await sb.from("respostas").insert({user_id:uid,questao_id:q.id,area:q.area,tema:q.tema,acertou:ok});
    await sb.from("srs").upsert({user_id:uid,questao_id:q.id,ef:nova.ef,intervalo:nova.intervalo,reps:nova.reps,due:nova.due});
  };
  const avaliarDominio=async(topId,nivel)=>{
    setDominio(d=>({...d,[topId]:{nivel,last:new Date().toISOString()}}));
    await sb.from("dominio").upsert({user_id:uid,topico_id:topId,nivel,atualizado_em:new Date().toISOString()});
  };

  const acertoArea=useMemo(()=>{
    const m={};AREAS.forEach(a=>m[a.k]={t:0,ok:0});
    log.forEach(l=>{if(m[l.area]){m[l.area].t++;if(l.ok)m[l.area].ok++;}});
    const o={};AREAS.forEach(a=>o[a.k]=m[a.k].t?m[a.k].ok/m[a.k].t:null);return o;
  },[log]);

  const store={questoes,log,srs,dominio};

  // ---- Limites do plano FREE (amostra grátis enxuta) ----
  const FREE_TOPICO = "cm-has";   // único assunto liberado na Trilha (alto rendimento)
  const FREE_QUESTOES = 2;        // só 2 questões no Treinar
  // pool grátis: apenas 2 questões (as marcadas como não-premium), limitado a FREE_QUESTOES
  const poolFree = questoes.filter(q=>!q.premium).slice(0, FREE_QUESTOES);
  const poolVisivel = isPro ? questoes : poolFree;
  const bloqueadasFree = questoes.length - poolFree.length;

  if(loading) return <div className="center"><div className="muted">Sincronizando seu progresso...</div></div>;

  return <div>
    <div className="row" style={{justifyContent:"space-between",alignItems:"flex-start"}}>
      <div>
        <div className="tag" style={{color:"var(--acc)"}}>ENAMED Engine</div>
        <h1 style={{fontSize:28,marginTop:6}}>Olá{session.user.user_metadata&&session.user.user_metadata.nome?", "+session.user.user_metadata.nome:""}</h1>
      </div>
      <div style={{textAlign:"right"}}>
        <span className="pill" style={{color:isPro?"var(--gold)":"var(--muted)",borderColor:isPro?"var(--gold)":"var(--line)"}}>{isPro?"PRO":"Demonstração"}</span>
        <div className="row" style={{marginTop:8,justifyContent:"flex-end",gap:12}}>
          <span className="link" style={{fontSize:13}} onClick={()=>setTema(tema==="escuro"?"claro":"escuro")}>{tema==="escuro"?"☀ Claro":"🌙 Escuro"}</span>
          <span className="link" style={{fontSize:13}} onClick={()=>sb.auth.signOut()}>Sair</span>
        </div>
      </div>
    </div>

    {!isPro && <div className="lock" style={{marginTop:16,textAlign:"left"}}>
      <b>Você está na versão de demonstração.</b> Ela mostra 1 assunto da Trilha e 2 questões — uma amostra do método.
      <div className="muted" style={{fontSize:13,marginTop:6}}>O Combo até o ENAMED libera: os {CURRICULO.length} assuntos da Trilha, {questoes.length}+ questões, simulados no formato oficial, dashboard de padrões completo e resolver questão por foto.</div>
      <div style={{marginTop:12}}><button className="btn" onClick={()=>setShowAssinar(true)}>Liberar acesso — R$ 49,90 (6 meses)</button></div>
    </div>}
    {showAssinar && <Assinar uid={uid} email={session.user.email} onClose={()=>setShowAssinar(false)} onVerificar={recarregarAssinatura}/>}

    {diag ? <div>
        <button className="btn ghost sm" onClick={()=>setDiag(null)}>← Sair do teste</button>
        <div style={{marginTop:14}}>
          <Diagnostico pool={isPro?questoes:poolVisivel} registrar={registrar} modo={diag}
            onFim={(fracos)=>{
              const ids=(fracos||[]).map(f=>f.area+"||"+f.tema);
              setTemasFracos(ids); setJaFezDiag(true);
              try{localStorage.setItem("enamed_fracos",JSON.stringify(ids));localStorage.setItem("enamed_diag_feito","1");}catch(e){}
              setDiag(null); setTab("trilha");
            }}/>
        </div>
      </div>
    : <div>
      {!jaFezDiag && <div className="card" style={{marginBottom:16,borderColor:"var(--acc)"}}>
        <b style={{fontSize:16}}>Comece pelo diagnóstico</b>
        <div className="muted" style={{fontSize:13,margin:"6px 0 12px"}}>Responda ~20 questões rápidas. Vou descobrir seus pontos fracos e priorizar sua trilha em cima deles. Você pode refazer quando quiser.</div>
        <button className="btn" onClick={()=>setDiag("rapido")}>Fazer diagnóstico rápido</button>
      </div>}

      <div className="nav">
        {[["trilha","📚 Estudar"],["praticar","✍️ Praticar"],["internato","🩺 Internato"],["flash","🃏 Flashcards"],["dash","📈 Meu progresso"]].map(([k,l])=>
          <button key={k} className={tab===k?"on":""} onClick={()=>setTab(k)}>{l}</button>)}
      </div>

      {tab==="trilha" && <Trilha store={store} acertoArea={acertoArea} avaliarDominio={avaliarDominio} registrar={registrar} irTreinar={()=>setTab("praticar")} isPro={isPro} freeTopico={FREE_TOPICO} onAssinar={()=>setShowAssinar(true)} temasFracos={temasFracos}/>}
      {tab==="praticar" && <Praticar pool={poolVisivel} store={store} registrar={registrar} bloqueadas={isPro?0:bloqueadasFree} isPro={isPro} onAssinar={()=>setShowAssinar(true)} onNovasQuestoes={novas=>setQuestoes(v=>[...v,...novas])} onDiagnostico={m=>setDiag(m)} jaFezDiag={jaFezDiag}/>}
      {tab==="internato" && <Internato pool={questoes} registrar={registrar}/>}
      {tab==="flash" && (isPro ? <Flashcards cards={FLASHCARDS} curriculo={CURRICULO} sb={sb} uid={uid}/> : <TravaFree titulo="Flashcards é PRO" texto="Revise todos os assuntos em cartões rápidos, com baralho diário e sequência de dias estudados." onAssinar={()=>setShowAssinar(true)}/>)}
      {tab==="dash" && (isPro ? <Dash store={store} temasFracos={temasFracos} onRefazer={()=>setDiag("rapido")}/> : <TravaFree titulo="Meu progresso é PRO" texto="Veja seu acerto por área, os temas onde mais erra e o quanto já dominou da trilha." onAssinar={()=>setShowAssinar(true)}/>)}
    </div>}
  </div>;
}

/* =================== TRILHA =================== */
function prioridade(top,store,acertoArea){
  const d=store.dominio[top.id];const nivel=d?d.nivel:null;
  const need=nivel===null?1:(5-nivel)/4;
  const rec=d?Math.min(1,dias(d.last)/14):1;
  const aa=acertoArea[top.area];const fraq=aa===null?0.5:(1-aa);
  const score=top.yield*(0.55*need+0.25*rec+0.20*fraq);
  const motivos=[];
  if(top.yield>=3)motivos.push("alto rendimento na prova");
  if(nivel===null)motivos.push("voce ainda nao estudou este tema");
  else if(nivel<=2)motivos.push("seu dominio esta baixo ("+nivel+"/5)");
  if(d&&dias(d.last)>=7)motivos.push("faz "+dias(d.last)+" dias que revisou");
  if(aa!==null&&aa<0.6)motivos.push("acerta so "+Math.round(aa*100)+"% em "+areaNome(top.area));
  return {score,nivel,motivos};
}
function Trilha({store,acertoArea,avaliarDominio,registrar,irTreinar,isPro,freeTopico,onAssinar,temasFracos}){
  const fracosSet=new Set((temasFracos||[]).map(x=>x.split("||")[1]));
  const [areaSel,setAreaSel]=useState(null); // area escolhida
  const [aberto,setAberto]=useState(null);   // assunto em estudo
  const yc=y=>y>=3?"var(--gold)":y===2?"var(--acc2)":"var(--muted)";
  const yl=y=>y>=3?"ALTO RENDIMENTO":y===2?"IMPORTANTE":"COMPLEMENTAR";
  const liberado=t=>isPro||t.id===freeTopico;
  const concluido=t=>!!store.dominio[t.id];
  // assuntos de uma area, em ordem de rendimento (o caminho)
  const caminho=k=>CURRICULO.filter(t=>t.area===k).sort((a,b)=>b.yield-a.yield);
  const abrir=t=>{ if(!liberado(t)){onAssinar();return;} setAberto(t.id); window.scrollTo(0,0); };

  /* ---------- ESTADO 3: estudando um assunto (tela cheia) ---------- */
  if(aberto){
    const t=CURRICULO.find(x=>x.id===aberto);
    if(t) return <div>
      <button className="btn ghost sm" onClick={()=>{setAberto(null);window.scrollTo(0,0);}}>← Voltar ao caminho</button>
      <div style={{marginTop:14}}>
        <div className="row" style={{gap:9,marginBottom:4}}>
          <span className="yield" style={{color:yc(t.yield),border:"1px solid "+yc(t.yield)}}>{yl(t.yield)}</span>
          <span className="pill" style={{color:"var(--acc)",borderColor:"var(--acc)"}}>{areaNome(t.area)}</span>
        </div>
        <h2 style={{fontSize:22,margin:"6px 0 16px"}}>{t.nome}</h2>
        <EstudarAssunto t={t} store={store} avaliarDominio={avaliarDominio} registrar={registrar} irTreinar={irTreinar} isPro={isPro} onAssinar={onAssinar}
          onFim={()=>{ // ao concluir, emenda no proximo pendente da area
            const lista=caminho(t.area);
            const idx=lista.findIndex(x=>x.id===t.id);
            const prox=lista.slice(idx+1).find(x=>!concluido(x));
            if(prox && liberado(prox)){ setAberto(prox.id); } else { setAberto(null); }
            window.scrollTo(0,0);
          }}/>
      </div>
    </div>;
  }

  /* ---------- ESTADO 2: caminho de uma area ---------- */
  if(areaSel){
    const lista=caminho(areaSel);
    const feitos=lista.filter(concluido).length;
    const proximo=lista.find(t=>!concluido(t) && liberado(t)) || lista.find(t=>!concluido(t));
    return <div>
      <button className="btn ghost sm" onClick={()=>setAreaSel(null)}>← Todas as áreas</button>
      <div style={{marginTop:14,marginBottom:16}}>
        <h2 style={{fontSize:22}}>{areaNome(areaSel)}</h2>
        <div className="muted" style={{fontSize:13,marginTop:4}}>{feitos} de {lista.length} assuntos concluídos</div>
        <div className="bar" style={{marginTop:8}}><i style={{width:(feitos/lista.length*100)+"%",background:"var(--acc)"}}/></div>
      </div>

      {proximo && <div className="hero" style={{marginBottom:18}}>
        <div className="tag" style={{color:"var(--acc)"}}>Continue de onde parou</div>
        <h3 style={{fontSize:19,margin:"8px 0 4px"}}>{proximo.nome}</h3>
        <div className="muted" style={{fontSize:13,marginBottom:10}}>{concluido(proximo)?"Revisão":"Próximo assunto do caminho"}</div>
        <button className="btn" onClick={()=>abrir(proximo)}>{liberado(proximo)?"Continuar ›":"🔒 Assinar para continuar"}</button>
      </div>}

      {/* o caminho vertical */}
      <div style={{position:"relative"}}>
        {lista.map((t,i)=>{
          const done=concluido(t);const lock=!liberado(t);const isProx=proximo&&t.id===proximo.id;
          return <div key={t.id} className="row" style={{alignItems:"stretch",gap:12,marginBottom:2}}>
            {/* coluna do trilho */}
            <div style={{display:"flex",flexDirection:"column",alignItems:"center",width:30}}>
              <div style={{width:28,height:28,borderRadius:99,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:13,
                background:done?"var(--acc)":(isProx?"var(--panel2)":"transparent"),
                border:"2px solid "+(done?"var(--acc)":(isProx?"var(--acc)":"var(--line)")),
                color:done?"var(--bg)":"var(--ink)"}}>{done?"✓":(lock?"🔒":i+1)}</div>
              {i<lista.length-1 && <div style={{flex:1,width:2,background:done?"var(--acc)":"var(--line)",minHeight:14}}/>}
            </div>
            {/* card do assunto */}
            <div onClick={()=>abrir(t)} style={{flex:1,cursor:"pointer",marginBottom:12,padding:"12px 14px",borderRadius:12,
              border:"1px solid "+(isProx?"var(--acc)":"var(--line)"),background:isProx?"var(--panel2)":"var(--panel)",opacity:lock?.7:1}}>
              <div className="row" style={{justifyContent:"space-between"}}>
                <b style={{fontSize:14.5}}>{t.nome}</b>
                <span className="yield" style={{color:yc(t.yield),border:"1px solid "+yc(t.yield)}}>{yl(t.yield)}</span>
              </div>
              <div className="muted" style={{fontSize:12,marginTop:3}}>
                {done?("concluído · domínio "+store.dominio[t.id].nivel+"/5"):(lock?"disponível no PRO":(isProx?"você está aqui":"a seguir"))}
              </div>
            </div>
          </div>;
        })}
      </div>
    </div>;
  }

  /* ---------- ESTADO 1: escolher a area ---------- */
  const revisar=CURRICULO.map(t=>{
    const d=store.dominio[t.id]; if(!d) return null;
    const diasDesde=dias(d.last);const intervalo=[0,1,2,4,7,14][d.nivel]||1;
    return diasDesde>=intervalo ? {...t,diasDesde} : null;
  }).filter(Boolean).sort((a,b)=>b.diasDesde-a.diasDesde).slice(0,4);

  return <div>
    <h2 style={{fontSize:22,marginBottom:4}}>Escolha por onde começar</h2>
    <div className="muted" style={{fontSize:14,marginBottom:18}}>Cada área é um caminho. Siga do primeiro ao último no seu ritmo.</div>

    {fracosSet.size>0 && (()=>{
      const prioritarios=CURRICULO.filter(t=>fracosSet.has(t.nome));
      if(prioritarios.length===0) return null;
      return <div className="card" style={{marginBottom:18,borderColor:"var(--warn)"}}>
        <div className="row" style={{justifyContent:"space-between",marginBottom:8}}>
          <b style={{fontSize:15}}>🎯 Priorizado pelo seu diagnóstico</b>
          <span className="muted" style={{fontSize:12}}>onde você mais errou</span>
        </div>
        {prioritarios.map(t=><div key={t.id} className="row" style={{justifyContent:"space-between",padding:"8px 2px",borderBottom:"1px solid var(--line)"}}>
          <span style={{fontSize:14}}>{t.nome} <span className="muted">· {areaNome(t.area)}</span></span>
          <button className="btn sm" onClick={()=>abrir(t)}>Estudar</button>
        </div>)}
      </div>;
    })()}

    {revisar.length>0 && <div className="card" style={{marginBottom:18,borderColor:"var(--acc2)"}}>
      <div className="row" style={{justifyContent:"space-between",marginBottom:8}}>
        <b style={{fontSize:15}}>🔁 Revisar hoje</b><span className="muted" style={{fontSize:12}}>pra não esquecer</span>
      </div>
      {revisar.map(t=><div key={t.id} className="row" style={{justifyContent:"space-between",padding:"8px 2px",borderBottom:"1px solid var(--line)"}}>
        <span style={{fontSize:14}}>{t.nome} <span className="muted">· há {t.diasDesde}d · {store.dominio[t.id].nivel}/5</span></span>
        <button className="btn ghost sm" onClick={()=>abrir(t)}>Revisar</button>
      </div>)}
    </div>}

    <div className="grid" style={{gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))",gap:14}}>
      {AREAS.map(a=>{
        const lista=caminho(a.k);const feitos=lista.filter(concluido).length;const pct=Math.round(feitos/lista.length*100);
        return <div key={a.k} className="card" onClick={()=>{setAreaSel(a.k);window.scrollTo(0,0);}} style={{cursor:"pointer"}}>
          <div className="row" style={{justifyContent:"space-between",marginBottom:8}}>
            <span className="pill" style={{color:"var(--acc)",borderColor:"var(--acc)"}}>{a.k}</span>
            <span className="muted" style={{fontSize:12}}>{feitos}/{lista.length}</span>
          </div>
          <b style={{fontSize:16}}>{a.nome}</b>
          <div className="bar" style={{marginTop:10}}><i style={{width:pct+"%",background:"var(--acc)"}}/></div>
          <div style={{marginTop:12}}><span className="btn sm" style={{display:"inline-block"}}>{feitos>0?"Continuar ›":"Começar ›"}</span></div>
        </div>;
      })}
    </div>

    {!isPro && <div className="lock" style={{marginTop:18,textAlign:"left"}}>
      <b>Demonstração: 1 assunto liberado.</b>

/* =================== DASH =================== */
function Dash({store,temasFracos,onRefazer}){
  const s=useMemo(()=>{
    const byArea={};AREAS.forEach(a=>byArea[a.k]={t:0,ok:0,q:0});
    store.questoes.forEach(q=>{if(byArea[q.area])byArea[q.area].q++;});
    store.log.forEach(l=>{const b=byArea[l.area];if(b){b.t++;if(l.ok)b.ok++;}});
    const byTema={};store.log.forEach(l=>{(byTema[l.tema]=byTema[l.tema]||{t:0,ok:0,area:l.area});byTema[l.tema].t++;if(l.ok)byTema[l.tema].ok++;});
    return {byArea,byTema,tot:store.log.length,ok:store.log.filter(l=>l.ok).length};},[store]);
  const geral=s.tot?Math.round(s.ok/s.tot*100):0;
  const fracos=Object.entries(s.byTema).map(([tema,v])=>({tema,area:v.area,pct:Math.round(v.ok/v.t*100),t:v.t})).sort((a,b)=>a.pct-b.pct).slice(0,6);

  if(s.tot===0){

  }

    <div className="card">
      <div className="row" style={{justifyContent:"space-between",marginBottom:14}}>

      <h3 style={{fontSize:16,marginBottom:4}}>Onde você precisa focar</h3>
      <p className="muted" style={{fontSize:13,marginTop:0,marginBottom:14}}>Seus temas com menor acerto — comece por eles.</p>

              <span style={{fontSize:14,color:sem(f.pct),fontWeight:600}}>{f.pct}% de acerto</span>

function QuestionCard({q,onResp,indice,total}){
  const [sel,setSel]=useState(null);useEffect(()=>setSel(null),[q.id]);const L=["A","B","C","D"];
  return <div className="card">
    <div className="row" style={{justifyContent:"space-between",marginBottom:10}}>
      <div className="row" style={{gap:8}}><span className="pill" style={{color:"var(--acc)",borderColor:"var(--acc)"}}>{areaNome(q.area)}</span><span className="pill">{q.tema}</span>{(q.transv||[]).map(t=><span key={t} className="pill" style={{color:"var(--acc2)"}}>{t}</span>)}</div>
      {total>1&&<span className="muted" style={{fontSize:13}}>{indice+1}/{total}</span>}</div>
    <div style={{fontSize:15.5,lineHeight:1.6,marginBottom:6}}>{q.enun}</div>
    {q.alts.map((a,i)=>{let c="alt";if(sel!==null){if(i===q.correta)c+=" correct";else if(i===sel)c+=" wrong";else c+=" dim";}
      return <button key={i} className={c} disabled={sel!==null} onClick={()=>{setSel(i);onResp(q,i===q.correta);}}><b style={{color:"var(--muted)",marginRight:8}}>{L[i]}</b>{a}</button>;})}
    {sel!==null&&<div className="comment"><b style={{color:sel===q.correta?"var(--acc)":"var(--bad)"}}>{sel===q.correta?"Correto. ":"Incorreto. "}</b>{q.coment}</div>}
  </div>;
}

function Internato({pool, registrar}){
  const [modulo,setModulo]=useState(null);   // id da area do módulo aberto
  const [bloco,setBloco]=useState(null);      // tema aberto

  // só questões do internato (tema começa com "Internato — ")
  const doInternato = useMemo(()=>
    (pool||[]).filter(q=>typeof q.tema==="string" && q.tema.indexOf("Internato — ")===0)
  ,[pool]);

  const contaModulo = (areaId)=> doInternato.filter(q=>q.area===areaId).length;

  const blocosDoModulo = (areaId)=>{
    const m={};
    doInternato.filter(q=>q.area===areaId).forEach(q=>{ m[q.tema]=(m[q.tema]||0)+1; });
    return Object.keys(m).sort().map(tema=>({
      tema, nome: tema.replace("Internato — ",""), n: m[tema]
    }));
  };

  /* -------- TELA 3: respondendo um bloco -------- */
  if(bloco){
    const qs = doInternato.filter(q=>q.tema===bloco);
    return <RunnerInternato bloco={bloco} qs={qs} registrar={registrar} onVoltar={()=>setBloco(null)}/>;
  }

  /* -------- TELA 2: blocos de um módulo -------- */
  if(modulo){
    const m = MODULOS_INTERNATO.find(x=>x.id===modulo)||{nome:modulo};
    const blocos = blocosDoModulo(modulo);
    return <div>
      <button className="btn ghost sm" onClick={()=>setModulo(null)}>← Módulos</button>
      <div style={{margin:"14px 0 4px"}}>
        <div className="tag" style={{color:"var(--acc)"}}>INTERNATO</div>
        <h2 style={{fontSize:22,marginTop:4}}>{m.icone} {m.nome}</h2>
      </div>
      {blocos.length===0
        ? <div className="card muted">As questões deste módulo ainda não foram carregadas.</div>
        : <div className="grid" style={{gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",marginTop:12}}>
            {blocos.map(b=>
              <div key={b.tema} className="topico" style={{cursor:"pointer"}} onClick={()=>{setBloco(b.tema);window.scrollTo(0,0);}}>
                <div style={{fontWeight:700,fontSize:15.5,lineHeight:1.3}}>{b.nome}</div>
                <div className="row" style={{justifyContent:"space-between",marginTop:12}}>
                  <span className="pill" style={{color:"var(--acc)",borderColor:"var(--acc)"}}>{b.n} questões</span>
                  <span className="muted" style={{fontSize:12}}>Treinar →</span>
                </div>
              </div>
            )}
          </div>}
    </div>;
  }

  /* -------- TELA 1: escolher módulo -------- */
  return <div>
    <div className="tag" style={{color:"var(--acc)"}}>INTERNATO</div>
    <h1 style={{fontSize:28,marginTop:6,marginBottom:4}}>Internato</h1>
    <div className="muted" style={{fontSize:14,marginBottom:16}}>
      Questões no estilo dos rodízios do internato, com correção comentada. Novos módulos entram em breve.
    </div>
    <div className="grid" style={{gridTemplateColumns:"repeat(auto-fill,minmax(300px,1fr))"}}>
      {MODULOS_INTERNATO.map(m=>{
        const n = contaModulo(m.id);
        const pronto = n>0;
        return <div key={m.id} className="topico" style={{cursor:pronto?"pointer":"default",opacity:pronto?1:.7}}
          onClick={()=>{ if(pronto){setModulo(m.id);window.scrollTo(0,0);} }}>
          <div style={{fontWeight:700,fontSize:16}}>{m.icone} {m.nome}</div>
          <div className="muted" style={{fontSize:12.5,margin:"6px 0 12px"}}>{m.desc}</div>
          <div className="row" style={{justifyContent:"space-between"}}>
            <span className="pill" style={pronto?{color:"var(--acc)",borderColor:"var(--acc)"}:{}}>{pronto? n+" questões":"Em breve"}</span>
            <span className="muted" style={{fontSize:12}}>{pronto?"Abrir →":""}</span>
          </div>
        </div>;
      })}

  </div>;
}

function Treinar({pool,store,registrar,bloqueadas,isPro,onAssinar,onNovasQuestoes}){
  const [area,setArea]=useState("todas");
  const [tema,setTema]=useState("todos");
  const [extra,setExtra]=useState([]);   // questoes geradas na sessao
  const [gerando,setGerando]=useState(false);
  const [msg,setMsg]=useState("");
  const [seed,setSeed]=useState(1);       // trava a ordem ate o usuario pedir novo baralho

  // temas disponiveis para a area escolhida (do banco)
  const temasDaArea = useMemo(()=>{
    if(area==="todas") return [];
    const set=new Set(pool.filter(q=>q.area===area).map(q=>q.tema).filter(Boolean));
    return Array.from(set).sort();
  },[pool,area]);

  // base filtrada por area E tema
  const base = useMemo(()=>{
    let b = area==="todas" ? pool : pool.filter(q=>q.area===area);
    if(area!=="todas" && tema!=="todos") b = b.filter(q=>q.tema===tema);
    return b;
  },[pool,area,tema]);

  // embaralha de forma ESTAVEL (so muda quando area/tema/seed mudam, nao a cada render)
  const fila = useMemo(()=>{
    const todas=[...base,...extra.filter(q=>(area==="todas"||q.area===area)&&(tema==="todos"||q.tema===tema))];
    // ordenacao estavel baseada no seed (nao usa Math.random a cada render)
    const arr=todas.slice();
    let s=seed*9973;
    const rnd=()=>{ s=(s*9301+49297)%233280; return s/233280; };
    for(let k=arr.length-1;k>0;k--){ const j=Math.floor(rnd()*(k+1)); [arr[k],arr[j]]=[arr[j],arr[k]]; }
    return arr;
  },[base,extra,area,tema,seed]);

  const [i,setI]=useState(0);const [feito,setFeito]=useState(false);
  useEffect(()=>{setI(0);setFeito(false);},[area,tema,seed]);
  useEffect(()=>{setTema("todos");},[area]);  // ao trocar area, reseta tema
  const q=fila[i];
  const workerOk=!WORKER_URL.startsWith("COLE_");

  const mais=async()=>{
    if(!isPro){onAssinar();return;}
    if(!workerOk){setMsg("O gerador entra no ar quando o app for publicado com o Worker.");return;}
    setGerando(true);setMsg("");
    const alvoArea = area==="todas"?["CM","CIR","GO","PED","MFC"][Math.floor(Math.random()*5)]:area;
    const alvoTema = (area!=="todas"&&tema!=="todos")?tema:null;
    try{
      const novas=[];
      for(let k=0;k<10;k++){
        const r=await wfetch("/gerar-questao",alvoTema?{area:alvoArea,tema:alvoTema}:{area:alvoArea});
        const d=await r.json();
        if(d.questao){
          const Q=d.questao;
          novas.push({id:"ai"+Date.now()+"_"+k,area:Q.area||alvoArea,tema:Q.tema||alvoTema||"Gerada por IA",transv:Q.transv||[],dif:2,enun:Q.enunciado,alts:Q.alternativas,correta:Q.correta,coment:Q.comentario||"",premium:true});
        }
      }
      if(novas.length===0) throw new Error("Não consegui gerar agora. Tente de novo.");
      setExtra(e=>[...e,...novas]);
      if(onNovasQuestoes) onNovasQuestoes(novas);
      setMsg("+"+novas.length+" questões novas na fila!");
    }catch(e){setMsg(e.message);}
    setGerando(false);
  };

  const filtroUI = <div style={{marginBottom:12}}>
    <div className="row" style={{justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
      <div className="row" style={{gap:8,flexWrap:"wrap"}}>
        <select value={area} onChange={e=>setArea(e.target.value)} style={{maxWidth:200}}>
          <option value="todas">Todas as áreas</option>
          {AREAS.map(a=><option key={a.k} value={a.k}>{a.nome}</option>)}
        </select>
        {area!=="todas" && temasDaArea.length>0 &&
          <select value={tema} onChange={e=>setTema(e.target.value)} style={{maxWidth:240}}>
            <option value="todos">Todos os temas</option>
            {temasDaArea.map(t=><option key={t} value={t}>{t}</option>)}
          </select>}
      </div>
      <span className="muted" style={{fontSize:13}}>{fila.length?(i+1)+" de "+fila.length:"0"}</span>
    </div>
  </div>;

  if(!q)return <div>
    {filtroUI}
    <div className="card">
      <div className="muted" style={{marginBottom:12}}>Você já respondeu todas as questões deste filtro. 🎉</div>
      <div className="row" style={{gap:8,flexWrap:"wrap"}}>
        <button className="btn ghost" onClick={()=>setSeed(s=>s+1)}>↻ Refazer estas questões</button>
        <button className="btn" disabled={gerando} onClick={mais}>{gerando?"Gerando...":"✨ Gerar 10 novas com IA"}</button>
      </div>
      {msg&&<div className="muted" style={{fontSize:13,marginTop:10,color:"var(--acc2)"}}>{msg}</div>}
    </div>
  </div>;

  const ultimaFree = !isPro && i>=fila.length-1;
  return <div>
    {filtroUI}
    <div className="bar" style={{marginBottom:14}}><i style={{width:((i+1)/fila.length*100)+"%",background:"var(--acc)"}}/></div>

    <QuestionCard q={q} indice={i} total={fila.length} onResp={(qq,ok)=>{registrar(qq,ok);setFeito(true);}}/>

    <div className="row" style={{marginTop:14}}>
      {ultimaFree && feito
        ? <button className="btn" onClick={onAssinar}>Liberar todas as questões (PRO)</button>
        : i<fila.length-1
          ? <button className="btn" disabled={!feito} onClick={()=>{setFeito(false);setI(x=>x+1);}}>Próxima</button>
          : <button className="btn" disabled={!feito||gerando} onClick={mais}>{gerando?"Gerando mais 10...":"✨ Mais questões deste tema"}</button>}
    </div>
    {msg&&<div className="muted" style={{fontSize:13,marginTop:10,color:"var(--acc2)"}}>{msg}</div>}

    {!isPro && feito && ultimaFree && <div className="lock" style={{marginTop:14,textAlign:"left"}}>
      <b>Você terminou a demonstração.</b>
      <div className="muted" style={{fontSize:13,marginTop:6}}>Assine o Combo até o ENAMED para treinar questões ilimitadas — inclusive geradas na hora pela IA.</div>
    </div>}
  </div>;
}

/* =================== DIAGNÓSTICO (teste inicial + simuladão) =================== */
function Diagnostico({pool,registrar,onFim,modo}){
  // modo: "rapido" (~20) ou "completo" (100)
  const alvo = modo==="completo" ? 100 : 20;
  const prova=useMemo(()=>{
    // distribuir por area de forma equilibrada
    const porArea={};
    pool.forEach(q=>{(porArea[q.area]=porArea[q.area]||[]).push(q);});
    const areas=Object.keys(porArea);
    const porCada=Math.max(1,Math.ceil(alvo/Math.max(1,areas.length)));
    let sel=[];
    areas.forEach(a=>{ sel=sel.concat(porArea[a].slice().sort(()=>Math.random()-0.5).slice(0,porCada)); });
    return sel.sort(()=>Math.random()-0.5).slice(0,Math.min(alvo,sel.length));
  },[modo]);
  const [i,setI]=useState(0);
  const [resp,setResp]=useState({}); // qid -> {ok, area, tema}
  const [sel,setSel]=useState(null);
  const [fim,setFim]=useState(false);
  const q=prova[i];

  if(prova.length===0) return <div className="card">Ainda não há questões suficientes no banco para o diagnóstico. Gere questões na aba Praticar.</div>;

  if(fim){
    // montar mapa de desempenho por área e por tema
    const porArea={}, porTema={};
    Object.values(resp).forEach(r=>{
      const a=porArea[r.area]=porArea[r.area]||{c:0,t:0}; a.t++; if(r.ok)a.c++;
      const k=r.area+"||"+r.tema; const tt=porTema[k]=porTema[k]||{c:0,t:0,area:r.area,tema:r.tema}; tt.t++; if(r.ok)tt.c++;
    });
    const areasOrd=Object.entries(porArea).map(([a,v])=>({a,pct:Math.round(v.c/v.t*100),...v})).sort((x,y)=>x.pct-y.pct);
    const fracos=Object.values(porTema).filter(t=>t.c/t.t<0.6).sort((x,y)=>(x.c/x.t)-(y.c/y.t)).slice(0,6);
    const acertos=Object.values(resp).filter(r=>r.ok).length;
    const nota=Math.round(acertos/prova.length*100);
    return <div>
      <div className="hero" style={{marginBottom:16}}>
        <div className="tag" style={{color:"var(--acc)"}}>Seu diagnóstico</div>
        <h2 style={{fontSize:26,margin:"6px 0"}}>{acertos}/{prova.length} <span style={{fontSize:16,color:"var(--muted)"}}>({nota}%)</span></h2>
        <div style={{fontSize:14,lineHeight:1.5}}>Montei seu mapa de forças e fraquezas. A trilha vai priorizar o que você mais errou.</div>
      </div>
      <h3 style={{fontSize:15,marginBottom:8}}>Desempenho por área</h3>
      {areasOrd.map(a=><div key={a.a} style={{marginBottom:10}}>
        <div className="row" style={{justifyContent:"space-between",marginBottom:3}}>
          <span style={{fontSize:14}}>{areaNome(a.a)}</span><span className="muted" style={{fontSize:13}}>{a.c}/{a.t} ({a.pct}%)</span>
        </div>
        <div className="bar"><i style={{width:a.pct+"%",background:a.pct<50?"var(--bad)":a.pct<70?"var(--warn)":"var(--acc)"}}/></div>
      </div>)}
      {fracos.length>0 && <div className="card" style={{marginTop:16,borderColor:"var(--warn)"}}>
        <b style={{fontSize:15}}>🎯 Focar primeiro nestes temas</b>
        <div style={{marginTop:8}}>{fracos.map((t,i)=><div key={i} className="row" style={{justifyContent:"space-between",padding:"7px 2px",borderBottom:"1px solid var(--line)"}}>
          <span style={{fontSize:14}}>{t.tema} <span className="muted">· {areaNome(t.area)}</span></span>
          <span className="muted" style={{fontSize:12}}>{t.c}/{t.t}</span>
        </div>)}</div>
      </div>}
      <div className="row" style={{marginTop:18}}><button className="btn" onClick={()=>onFim(fracos)}>Ir para minha trilha priorizada →</button></div>
    </div>;
  }

  return <div>
    <div className="row" style={{justifyContent:"space-between",marginBottom:10}}>
      <b style={{fontSize:15}}>{modo==="completo"?"Simulado completo":"Diagnóstico rápido"}</b>
      <span className="muted" style={{fontSize:13}}>{i+1} de {prova.length}</span>
    </div>
    <div className="bar" style={{marginBottom:14}}><i style={{width:((i+1)/prova.length*100)+"%",background:"var(--acc)"}}/></div>
    <QuestionCard q={q} indice={i} total={prova.length} onResp={(qq,ok)=>{
      setResp(r=>({...r,[qq.id]:{ok,area:qq.area,tema:qq.tema}}));
      registrar&&registrar(qq,ok); setSel(ok);
    }}/>
    <div className="row" style={{justifyContent:"space-between",marginTop:14}}>
      <span className="muted" style={{fontSize:12}}>{modo==="completo"?"Sem pressa: responda como numa prova.":"Responda no seu chute honesto — é só um mapa."}</span>
      <button className="btn sm" disabled={sel===null} onClick={()=>{
        setSel(null);
        if(i<prova.length-1) setI(i+1); else setFim(true);
      }}>{i<prova.length-1?"Próxima":"Ver resultado"}</button>
    </div>
  </div>;
}

/* =================== SIMULADO =================== */
function Simulado({pool,registrar,isPro}){
  const [run,setRun]=useState(false);const [prova,setProva]=useState([]);const [resp,setResp]=useState({});const [fim,setFim]=useState(false);
  const alvo=isPro?4:2; // por área; PRO monta simulado maior
  const montar=()=>{let sel=[];AREAS.forEach(a=>{const p=pool.filter(q=>q.area===a.k).sort(()=>Math.random()-0.5);sel=sel.concat(p.slice(0,alvo));});setProva(sel.sort(()=>Math.random()-0.5));setResp({});setFim(false);setRun(true);};
  const finalizar=()=>{prova.forEach(q=>{if(resp[q.id]!==undefined)registrar(q,resp[q.id]===q.correta);});setFim(true);};
  if(!run)return <div className="card"><h3 style={{fontSize:17,marginBottom:8}}>Simulado no formato oficial</h3>
    <div className="muted" style={{fontSize:14,marginBottom:14,lineHeight:1.6}}>Respeita a proporção de 20/área (escalada ao banco). {isPro?"":"No plano free o simulado é reduzido — o completo é PRO."}</div>
    <button className="btn" onClick={montar}>Gerar simulado</button></div>;
  const L=["A","B","C","D"];const ac=prova.filter(q=>resp[q.id]===q.correta).length;
  return <div>{!fim&&<div className="muted" style={{fontSize:13,marginBottom:12}}>{prova.length} questões · responda e finalize.</div>}
    {prova.map((q,idx)=><div key={q.id} className="card" style={{marginBottom:14}}>
      <div className="row" style={{gap:8,marginBottom:8}}><span className="muted" style={{fontSize:13}}>{idx+1}.</span><span className="pill" style={{color:"var(--acc)",borderColor:"var(--acc)"}}>{areaNome(q.area)}</span></div>
      <div style={{fontSize:15,lineHeight:1.55,marginBottom:4}}>{q.enun}</div>
      {q.alts.map((a,i)=>{let c="alt";if(fim){if(i===q.correta)c+=" correct";else if(resp[q.id]===i)c+=" wrong";else c+=" dim";}else if(resp[q.id]===i)c+=" correct";
        return <button key={i} className={c} disabled={fim} onClick={()=>setResp(r=>({...r,[q.id]:i}))}><b style={{color:"var(--muted)",marginRight:8}}>{L[i]}</b>{a}</button>;})}
      {fim&&<div className="comment">{q.coment}</div>}</div>)}
    {!fim?<button className="btn" onClick={finalizar}>Finalizar e corrigir</button>
      :<div className="card"><div className="row" style={{gap:30}}>
        <div><div className="tag muted">Nota</div><div className="kpi" style={{color:sem(Math.round(ac/prova.length*100))}}>{ac}/{prova.length}</div></div>
        <div><div className="tag muted">Percentual</div><div className="kpi">{Math.round(ac/prova.length*100)}%</div></div>
        <button className="btn ghost" onClick={()=>setRun(false)}>Novo</button></div></div>}
  </div>;
}

/* =================== BANCO =================== */
function Banco({questoes,uid,onAdd}){
  const porArea={};
  AREAS.forEach(a=>porArea[a.k]={tot:0,temas:new Set()});
  questoes.forEach(q=>{ if(porArea[q.area]){porArea[q.area].tot++; porArea[q.area].temas.add(q.tema);} });
  return <div>
    <div className="card" style={{marginBottom:16}}>
      <h3 style={{fontSize:17,marginBottom:4}}>Banco de questões</h3>
      <div className="muted" style={{fontSize:13}}>Você tem <b>{questoes.length}</b> questões no acervo. Precisa de mais? Gere questões inéditas no estilo INEP na aba <b>Gerar questão</b> — elas entram aqui automaticamente.</div>
    </div>
    <div className="grid" style={{gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",gap:12}}>
      {AREAS.map(a=><div key={a.k} className="card">
        <div className="row" style={{justifyContent:"space-between"}}>
          <span className="pill" style={{color:"var(--acc)",borderColor:"var(--acc)"}}>{a.k}</span>

        <div style={{fontSize:13,marginTop:4}}>{a.nome}</div>

    </div>
  </div>;
}

    temAula?"Aula":"Resumo",
    "Como pensar",
    "Pratique",
    "Fixe",

    {/* trilho de progresso das etapas */}

        : <div><div className="tag" style={{color:"var(--acc)",marginBottom:6}}>Resumo</div>
            <ul style={{margin:"0 0 0 18px",padding:0,fontSize:14.5,lineHeight:1.7}}>{t.nucleo.map((n,i)=><li key={i} style={{marginBottom:6}}>{n}</li>)}</ul>
          </div>}
      <TiraDuvida tema={t.nome} contexto={(t.aula||t.nucleo||[]).join(" ")}/>
    </div>}

    {/* ETAPA 1 — COMO PENSAR */}

      <div className="tag" style={{color:"var(--acc)",marginBottom:8}}>Como pensar (passo a passo)</div>
      {(t.raciocinio||t.nucleo).map((r,i)=>
        <div key={i} className="row" style={{alignItems:"flex-start",gap:10,marginBottom:10}}>

    {etapa===2 && <PraticaTema t={t} store={store} registrar={registrar} isPro={isPro} onAssinar={onAssinar}/>}

    {/* ETAPA 3 — FIXE */}
    {etapa===3 && <div>
      <div className="b-mne block"><b>Gancho pra memorizar:</b> {t.mne}</div>

      <div className="b-metodo block" style={{marginTop:10}}><b>Em uma frase:</b> {t.nucleo[0]}</div>
