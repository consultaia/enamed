/* Prática dentro do estudo: questões só do tema/área, grudadas na aula */
function PraticaTema({t,store,registrar,isPro,onAssinar}){
  // questoes DO ASSUNTO (ids listados no curriculo); fallback: por tema textual
  const idsDoTema=t.questoes||[];
  const pool=store.questoes.filter(q=>
    (idsDoTema.length ? idsDoTema.includes(q.id) : (q.tema&&t.nome&&q.tema.toLowerCase().includes(t.nome.split("—")[0].trim().toLowerCase())))
    && (isPro||!q.premium));
  const fila=useMemo(()=>pool.slice().sort(()=>Math.random()-0.5).slice(0,5),[t.id]);
  const [i,setI]=useState(0);const [feito,setFeito]=useState(false);
  useEffect(()=>{setI(0);setFeito(false);},[t.id]);
  if(fila.length===0) return <div className="b-metodo block" style={{fontSize:14}}>As questões específicas deste assunto entram aqui. Enquanto isso, use a aba <b>Praticar</b> para treinar questões de {areaNome(t.area)}.</div>;
  const q=fila[i];
  return <div>
    <div className="muted" style={{fontSize:13,marginBottom:10}}>Questões de <b>{t.nome}</b> — responda no calor da aula. ({i+1}/{fila.length})</div>
    <QuestionCard q={q} indice={i} total={fila.length} onResp={(qq,ok)=>{if(registrar)registrar(qq,ok);setFeito(true);}}/>
    <div className="row" style={{marginTop:12}}>
      {i<fila.length-1
        ? <button className="btn sm" disabled={!feito} onClick={()=>{setFeito(false);setI(i+1);}}>Próxima questão</button>
        : <span className="muted" style={{fontSize:13}}>{feito?"Boa! Avance para fixar. ✓":""}</span>}
    </div>
  </div>;
}

/* =================== AULA ADAPTATIVA =================== */
function AulaAdaptativa({tema,aula,fonte}){
  const [extra,setExtra]=useState(null); // texto reescrito pela IA
  const [busy,setBusy]=useState("");
  const workerOk=!WORKER_URL.startsWith("COLE_");
  const pedir=async(modo,rotulo)=>{
    if(!workerOk){setExtra("Este recurso fica ativo quando o app estiver publicado com o Worker.");return;}
    setBusy(rotulo);setExtra(null);
    try{
      const r=await wfetch("/reexplicar",{tema,aula:aula.join(" "),modo});
      const d=await r.json();
      if(!r.ok||d.error) throw new Error(typeof d.error==="string"?d.error:"Falha.");
      setExtra(d.texto||"");
    }catch(e){setExtra(e.message);}
    setBusy("");
  };
  const botoes=[
    ["outro","🔄 Explica de outro jeito"],
    ["basico","🐢 Mais básico / devagar"],
    ["exemplo","🩺 Me dá um exemplo clínico"],
    ["fundo","🔬 Vai mais fundo"],
  ];
  return <div style={{marginTop:6}}>
    <div className="tag" style={{color:"var(--acc)",marginBottom:6}}>A aula</div>
    {aula.map((p,i)=><p key={i} style={{fontSize:14.5,lineHeight:1.65,margin:"0 0 12px"}}>{p}</p>)}
    <div className="muted" style={{fontSize:12,marginBottom:6}}>Não ficou claro? Peça de outro jeito:</div>
    <div className="row" style={{gap:8}}>
      {botoes.map(([m,l])=><button key={m} className="btn ghost sm" disabled={!!busy} onClick={()=>pedir(m,l)}>{busy===l?"...":l}</button>)}
    </div>
    {extra && <div className="block b-nucleo" style={{marginTop:10}}>{extra.split("\n").filter(Boolean).map((p,i)=><p key={i} style={{fontSize:14,lineHeight:1.6,margin:"0 0 8px"}}>{p}</p>)}</div>}
    {fonte && <div className="b-sus block" style={{marginTop:12,fontSize:12.5}}><b>Fonte:</b> {fonte}</div>}
  </div>;
}

/* =================== TIRA-DUVIDA (IA por assunto) =================== */
function TiraDuvida({tema,contexto}){
  const [q,setQ]=useState("");
  const [msgs,setMsgs]=useState([]); // {quem:'voce'|'ia', txt}
  const [busy,setBusy]=useState(false);
  const workerOk=!WORKER_URL.startsWith("COLE_");
  const perguntar=async()=>{
    const pergunta=q.trim();
    if(!pergunta)return;
    setMsgs(m=>[...m,{quem:"voce",txt:pergunta}]);
    setQ("");setBusy(true);
    try{
      if(!workerOk) throw new Error("O tira-dúvida por IA fica disponível quando o app estiver publicado com o Worker.");
      const r=await wfetch("/tirar-duvida",{tema,contexto,pergunta});
      const d=await r.json();
      if(!r.ok||d.error) throw new Error(typeof d.error==="string"?d.error:"Falha ao responder.");
      setMsgs(m=>[...m,{quem:"ia",txt:d.resposta||"Sem resposta."}]);
    }catch(e){ setMsgs(m=>[...m,{quem:"ia",txt:e.message}]); }

      <div style={{fontSize:14,lineHeight:1.55}}>{m.txt}</div>
    </div>)}
    <div className="row" style={{marginTop:6}}>
      <input value={q} onChange={e=>setQ(e.target.value)} onKeyDown={e=>e.key==="Enter"&&perguntar()} placeholder="Ex.: por que o pulmão compensa mais rápido que o rim?" style={{flex:1}}/>

    </div>
  </div>;
}

/* =================== TRAVA FREE (cadeado reutilizavel) =================== */
function Flashcards({cards, curriculo, sb, uid}){
  const nomeAssunto = (a)=>{ const t=(curriculo||[]).find(x=>x.id===a); return t?t.nome:a; };
  const hoje = new Date().toISOString().slice(0,10);

  // mapa de prefixo -> area
  const PREFIXO_AREA = {cm:"CM", cir:"CIR", go:"GO", ped:"PED", mfc:"MFC"};
  const areaDoCard = (c)=> PREFIXO_AREA[(c.assunto||"").split("-")[0]] || "?";

  const [modo,setModo]=useState("dia");   // "dia" | "tudo" | "area"
  const [area,setArea]=useState("todas");
  const [assunto,setAssunto]=useState("todos");
  const [i,setI]=useState(0);
  const [virado,setVirado]=useState(false);
  const [feitos,setFeitos]=useState({sabia:0,revisar:0});
  const [streak,setStreak]=useState(null);
  const [fim,setFim]=useState(false);

  // baralho do dia: sorteio estável por data
  const baralhoDia = React.useMemo(()=>{
    const seed = hoje.split("-").join("");
    let s = parseInt(seed,10)||1;
    const rnd = ()=>{ s=(s*9301+49297)%233280; return s/233280; };
    const arr=[...cards];
    for(let k=arr.length-1;k>0;k--){ const j=Math.floor(rnd()*(k+1)); [arr[k],arr[j]]=[arr[j],arr[k]]; }
    return arr.slice(0, Math.min(20, arr.length));
  },[cards, hoje]);

  // assuntos disponíveis para a área escolhida
  const assuntosDaArea = React.useMemo(()=>{
    if(area==="todas") return [];
    const ids = Array.from(new Set(cards.filter(c=>areaDoCard(c)===area).map(c=>c.assunto)));
    return ids.map(id=>({id, nome:nomeAssunto(id)})).sort((a,b)=>a.nome.localeCompare(b.nome));
  },[cards, area]);

  // fila conforme o modo/filtro
  const fila = React.useMemo(()=>{
    if(modo==="dia") return baralhoDia;
    if(modo==="tudo") return cards;
    // modo === "area": aplica area + assunto
    let f = area==="todas" ? cards : cards.filter(c=>areaDoCard(c)===area);
    if(area!=="todas" && assunto!=="todos") f = f.filter(c=>c.assunto===assunto);
    return f;
  },[modo, area, assunto, cards, baralhoDia]);

  const card = fila[i];

  React.useEffect(()=>{ setI(0); setVirado(false); setFeitos({sabia:0,revisar:0}); setFim(false); },[modo,area,assunto]);
  React.useEffect(()=>{ setAssunto("todos"); },[area]);

  React.useEffect(()=>{
    if(!sb||!uid) return;
    sb.from("flashcard_streak").select("dias_seguidos,ultimo_dia").eq("user_id",uid).maybeSingle()
      .then(({data})=>{ if(data) setStreak(data); });
  },[sb,uid]);

  const marcar=async(sabia)=>{
    setFeitos(f=>({...f, sabia:f.sabia+(sabia?1:0), revisar:f.revisar+(sabia?0:1)}));
    if(sb&&uid&&card){
      try{ await sb.from("flashcard_progresso").upsert({user_id:uid, card_id:card.id, sabia, visto_em:new Date().toISOString()},{onConflict:"user_id,card_id"}); }catch(e){}
    }
    if(i+1>=fila.length){ await fecharDia(); setFim(true); }
    else { setI(i+1); setVirado(false); }
  };

  const fecharDia=async()=>{
    if(!sb||!uid) return;
    try{
      const prev = streak;
      let dias=1;
      if(prev&&prev.ultimo_dia){
        const ontem=new Date(Date.now()-86400000).toISOString().slice(0,10);
        if(prev.ultimo_dia===hoje){ dias=prev.dias_seguidos; }
        else if(prev.ultimo_dia===ontem){ dias=(prev.dias_seguidos||0)+1; }
        else { dias=1; }
      }
      await sb.from("flashcard_streak").upsert({user_id:uid, dias_seguidos:dias, ultimo_dia:hoje, atualizado_em:new Date().toISOString()},{onConflict:"user_id"});
      setStreak({dias_seguidos:dias, ultimo_dia:hoje});
    }catch(e){}
  };

  const irPara=(m)=>{ setModo(m); };

  // barra de modos + filtros (sempre visível no topo)
  const controles = <div style={{marginBottom:14}}>
    <div className="row" style={{justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
      <div className="row" style={{gap:8,flexWrap:"wrap"}}>
        <button className={"btn sm"+(modo==="dia"?"":" ghost")} onClick={()=>irPara("dia")}>🗓️ Baralho do dia</button>
        <button className={"btn sm"+(modo==="tudo"?"":" ghost")} onClick={()=>irPara("tudo")}>📚 Todos</button>
        <button className={"btn sm"+(modo==="area"?"":" ghost")} onClick={()=>irPara("area")}>🎯 Por área/tema</button>
      </div>
      {streak && <span style={{fontFamily:"var(--mono)",fontSize:13,color:"var(--gold,#e6b450)"}}>🔥 {streak.dias_seguidos} {streak.dias_seguidos===1?"dia":"dias"}</span>}
    </div>
    {modo==="area" && <div className="row" style={{gap:8,flexWrap:"wrap",marginTop:10}}>
      <select value={area} onChange={e=>setArea(e.target.value)} style={{maxWidth:200}}>
        <option value="todas">Todas as áreas</option>
        {AREAS.map(a=><option key={a.k} value={a.k}>{a.nome}</option>)}
      </select>
      {area!=="todas" && assuntosDaArea.length>0 &&
        <select value={assunto} onChange={e=>setAssunto(e.target.value)} style={{maxWidth:250}}>
          <option value="todos">Todos os assuntos</option>
          {assuntosDaArea.map(s=><option key={s.id} value={s.id}>{s.nome}</option>)}
        </select>}
    </div>}
  </div>;

  if(fim){
    return <div>
      {controles}
      <div className="card" style={{textAlign:"center",padding:"32px 22px"}}>
        <div style={{fontSize:34,marginBottom:6}}>🎉</div>
        <h3 style={{margin:"0 0 6px"}}>Baralho concluído!</h3>
        <p className="muted" style={{margin:"0 0 4px"}}>Você sabia <b style={{color:"var(--acc)"}}>{feitos.sabia}</b> e marcou <b>{feitos.revisar}</b> para revisar.</p>
        {streak && <p style={{margin:"8px 0 18px",fontFamily:"var(--mono)",color:"var(--gold,#e6b450)"}}>🔥 {streak.dias_seguidos} {streak.dias_seguidos===1?"dia":"dias"} seguidos</p>}
        <div className="row" style={{gap:10,justifyContent:"center",flexWrap:"wrap"}}>
          <button className="btn" onClick={()=>{setI(0);setVirado(false);setFeitos({sabia:0,revisar:0});setFim(false);}}>↻ Refazer estes cartões</button>
          <button className="btn ghost" onClick={()=>irPara("dia")}>Voltar ao baralho do dia</button>
        </div>
      </div>
    </div>;
  }

  if(!card) return <div>
    {controles}
    <div className="card"><div className="muted">Nenhum flashcard neste filtro ainda. Escolha outra área ou assunto.</div></div>
  </div>;

  return <div>
    {controles}
    <div className="muted" style={{fontSize:12.5,marginBottom:10}}>Cartão {i+1} de {fila.length} · {nomeAssunto(card.assunto)}</div>

    <div onClick={()=>setVirado(v=>!v)} style={{cursor:"pointer",minHeight:190,border:"1px solid var(--line)",borderRadius:16,
      padding:"30px 26px",display:"flex",flexDirection:"column",justifyContent:"center",alignItems:"center",textAlign:"center",
      background: virado?"linear-gradient(160deg,#123528,#16302b)":"var(--panel,#12211f)", transition:"background .2s"}}>
      <div style={{fontFamily:"var(--mono)",fontSize:11,letterSpacing:".08em",textTransform:"uppercase",color: virado?"var(--acc)":"var(--muted)",marginBottom:12}}>
        {virado?"Resposta":"Pergunta · toque para virar"}
      </div>
      <div style={{fontSize:17,lineHeight:1.5, color:"var(--ink)"}}>{virado?card.verso:card.frente}</div>
    </div>

    {!virado &&
      <button className="btn" style={{width:"100%",marginTop:14}} onClick={()=>setVirado(true)}>Virar cartão</button>}

    {virado &&
      <div className="row" style={{gap:10,marginTop:14}}>
        <button className="btn ghost" style={{flex:1}} onClick={()=>marcar(false)}>↻ Revisar depois</button>
        <button className="btn" style={{flex:1}} onClick={()=>marcar(true)}>✓ Sabia</button>
      </div>}
  </div>;
}

function TravaFree({titulo,texto,onAssinar}){
  return <div className="lock" style={{textAlign:"left"}}>
    <b>{titulo}</b>
    <div className="muted" style={{fontSize:13,margin:"8px 0 12px"}}>{texto}</div>

/* =================== GERAR QUESTAO (IA, estilo INEP) =================== */
function GerarQuestao({uid,onSalvar}){
  const [area,setArea]=useState("CM");
  const [tema,setTema]=useState("");
  const [q,setQ]=useState(null);
  const [sel,setSel]=useState(null);
  const [busy,setBusy]=useState(false);
  const [msg,setMsg]=useState("");
  const [salvou,setSalvou]=useState(false);
  const workerOk=!WORKER_URL.startsWith("COLE_");
  const L=["A","B","C","D","E"];
  const gerar=async()=>{
    if(!workerOk){setMsg("Disponível quando o app estiver publicado com o Worker.");return;}
    setBusy(true);setMsg("");setQ(null);setSel(null);setSalvou(false);
    try{
      const r=await wfetch("/gerar-questao",{area,tema});
      const d=await r.json();
      if(!r.ok||d.error||!d.questao) throw new Error(typeof d.error==="string"?d.error:"Falha ao gerar.");
      setQ(d.questao);
    }catch(e){setMsg(e.message);}
    setBusy(false);
  };
  const salvar=async()=>{
    if(!q)return;
    const id="ai"+Date.now();
    const row={id,area:q.area||area,tema:q.tema||tema||"Gerada por IA",transv:q.transv||[],dificuldade:2,
      enunciado:q.enunciado,alternativas:q.alternativas,correta:q.correta,comentario:q.comentario||"",premium:true};
    const {error}=await sb.from("questoes").insert(row);
    if(error){setMsg("Para salvar no banco, seu perfil precisa ser admin. Erro: "+error.message);return;}
    onSalvar({id,area:row.area,tema:row.tema,transv:row.transv,dif:2,enun:row.enunciado,alts:row.alternativas,correta:row.correta,coment:row.comentario,premium:true});
    setSalvou(true);
  };
  return <div>
    <div className="card">
      <h3 style={{fontSize:17,marginBottom:6}}>Gerar questão no estilo INEP</h3>
      <div className="muted" style={{fontSize:13,marginBottom:12,lineHeight:1.5}}>
        Questões inéditas no padrão <b>ENAMED / Revalida / ENARE</b>: caso clínico no SUS, conduta por protocolo, com a pegadinha típica da banca.
      </div>
      <div className="row" style={{gap:10}}>
        <select value={area} onChange={e=>setArea(e.target.value)} style={{maxWidth:220}}>
          {AREAS.map(a=><option key={a.k} value={a.k}>{a.nome}</option>)}
        </select>
        <input value={tema} onChange={e=>setTema(e.target.value)} placeholder="Tema (opcional): ex. dengue, HPP, sepse" style={{flex:1}}/>
      </div>
      {msg && <div className="muted" style={{fontSize:13,marginTop:10,color:"var(--warn)"}}>{msg}</div>}
      <div className="row" style={{marginTop:14}}><button className="btn" disabled={busy} onClick={gerar}>{busy?"Gerando...":"Gerar questão"}</button></div>
    </div>

    {q && <div className="card" style={{marginTop:16}}>
      <div className="row" style={{gap:8,marginBottom:8}}>
        <span className="pill" style={{color:"var(--acc)",borderColor:"var(--acc)"}}>{areaNome(q.area||area)}</span>
        {q.tema && <span className="pill">{q.tema}</span>}
        {(q.transv||[]).map(t=><span key={t} className="pill" style={{color:"var(--acc2)"}}>{t}</span>)}
      </div>
      <div style={{fontSize:15.5,lineHeight:1.6,marginBottom:6}}>{q.enunciado}</div>
      {q.alternativas.map((a,i)=>{let c="alt";if(sel!==null){if(i===q.correta)c+=" correct";else if(i===sel)c+=" wrong";else c+=" dim";}
        return <button key={i} className={c} disabled={sel!==null} onClick={()=>setSel(i)}><b style={{color:"var(--muted)",marginRight:8}}>{L[i]}</b>{a}</button>;})}
      {sel!==null && <div className="comment"><b style={{color:sel===q.correta?"var(--acc)":"var(--bad)"}}>{sel===q.correta?"Correto. ":"Incorreto. "}</b>{q.comentario}</div>}
      <div className="row" style={{marginTop:14}}>
        <button className="btn ghost sm" onClick={gerar}>Gerar outra</button>
        <button className="btn sm" disabled={salvou} onClick={salvar}>{salvou?"Salva no banco ✓":"Salvar no meu banco"}</button>
      </div>
      <div className="muted" style={{fontSize:11,marginTop:10}}>Questão gerada por IA. Revise antes de usar em avaliação real.</div>
    </div>}
  </div>;
}

/* =================== RESOLVER QUESTAO (IA / visao) =================== */
function Resolver({isPro,onAssinar}){
  const [imgs,setImgs]=useState([]); // dataURLs
  const [busy,setBusy]=useState(false);
  const [res,setRes]=useState(null);
  const [msg,setMsg]=useState("");
  const workerOk=!WORKER_URL.startsWith("COLE_");

  const addFiles=async(fileList)=>{
    setMsg("");
    const files=Array.from(fileList).slice(0,2-imgs.length);
    if(files.length===0){setMsg("Maximo de 2 imagens por vez.");return;}
    for(const f of files){
      if(!/^image\//.test(f.type)){setMsg("Envie apenas imagens (foto ou print).");continue;}
      const dataUrl=await new Promise((ok,err)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=err;r.readAsDataURL(f);});
      setImgs(prev=>prev.length<2?[...prev,dataUrl]:prev);
    }
  };
  const remover=i=>setImgs(prev=>prev.filter((_,idx)=>idx!==i));

  const resolver=async()=>{
    if(!workerOk){setMsg("Falta configurar a WORKER_URL no topo do arquivo.");return;}
    if(imgs.length===0){setMsg("Adicione ao menos 1 imagem.");return;}
    setBusy(true);setRes(null);setMsg("");
    try{
      const r=await wfetch("/resolver-questao",{imagens:imgs});
      const d=await r.json();
      if(!r.ok||d.error) throw new Error(typeof d.error==="string"?d.error:"Falha ao resolver.");
      setRes(d);
    }catch(e){setMsg(e.message);}
    setBusy(false);
  };

  if(!isPro) return <div className="lock" style={{textAlign:"left"}}>
    <b>Resolver questão por foto é um recurso PRO.</b>
    <div className="muted" style={{fontSize:13,margin:"8px 0 12px"}}>Fotografe ou printe qualquer questão (até 2 imagens) e receba a alternativa correta com comentário no estilo da banca.</div>
    <button className="btn" onClick={onAssinar}>Assinar para liberar</button>
  </div>;

  return <div>
    <div className="card">
      <h3 style={{fontSize:17,marginBottom:6}}>Resolver questão por imagem</h3>
      <div className="muted" style={{fontSize:13,marginBottom:12,lineHeight:1.5}}>
        Envie até <b>2 imagens</b> (foto ou print) de UMA questão. A IA devolve a alternativa correta, o comentário e a pegadinha. Ferramenta de estudo pessoal.
      </div>

      <div className="row" style={{gap:10}}>
        <label className="btn ghost" style={{margin:0}}>Adicionar imagem
          <input type="file" accept="image/*" multiple onChange={e=>addFiles(e.target.files)} style={{display:"none"}}/></label>
        <span className="muted" style={{fontSize:12}}>{imgs.length}/2</span>
      </div>

      {imgs.length>0 && <div className="row" style={{marginTop:12,gap:10}}>
        {imgs.map((src,i)=><div key={i} style={{position:"relative"}}>
          <img src={src} alt={"img"+i} style={{width:130,height:130,objectFit:"cover",borderRadius:10,border:"1px solid var(--line)"}}/>
          <button onClick={()=>remover(i)} style={{position:"absolute",top:4,right:4,background:"rgba(0,0,0,.6)",color:"#fff",border:"none",borderRadius:99,width:24,height:24,cursor:"pointer"}}>x</button>
        </div>)}
      </div>}

      {msg && <div className="muted" style={{fontSize:13,marginTop:10,color:"var(--warn)"}}>{msg}</div>}

      <div className="row" style={{marginTop:14}}>
        <button className="btn" disabled={busy||imgs.length===0} onClick={resolver}>{busy?"Analisando...":"Resolver"}</button>
        {imgs.length>0 && <button className="btn ghost sm" onClick={()=>{setImgs([]);setRes(null);}}>Limpar</button>}
      </div>
    </div>

    {res && <div className="card" style={{marginTop:16}}>
      <div className="row" style={{gap:10,marginBottom:6}}>
        <span className="pill" style={{color:"var(--acc)",borderColor:"var(--acc)",fontSize:16,padding:"6px 14px"}}>Resposta: {res.alternativa||"?"}</span>
        {res.tema && <span className="pill">{res.tema}</span>}
      </div>
      {res.explicacao && <div className="comment" style={{marginTop:10}}><b>Por quê:</b> {res.explicacao}</div>}
      {res.pegadinha && <div className="block b-pega"><b>Pegadinha:</b> {res.pegadinha}</div>}
      {Array.isArray(res.erros) && res.erros.length>0 && <div className="block b-metodo">
        <b>Por que as outras estão erradas:</b>
        <ul style={{margin:"6px 0 0 18px",padding:0}}>{res.erros.map((e,i)=><li key={i} style={{marginBottom:4}}><b>{e.letra}:</b> {e.motivo}</li>)}</ul>
      </div>}
      <div className="muted" style={{fontSize:11,marginTop:12}}>Resposta gerada por IA para seu estudo. Confira sempre com a fonte oficial.</div>
    </div>}
  </div>;
}

/* =================== ASSINAR (checkout Pix) =================== */
function Assinar({uid,email,onClose,onVerificar}){
  const [etapa,setEtapa]=useState("plano"); // plano | carregando | pix | sucesso | erro
  const [pix,setPix]=useState(null);
  const [cpf,setCpf]=useState("");
  const [msg,setMsg]=useState("");
  const [copiado,setCopiado]=useState(false);
  const pollRef=React.useRef(null);
  useEffect(()=>()=>{if(pollRef.current)clearInterval(pollRef.current);},[]);

  const workerOk = !WORKER_URL.startsWith("COLE_");

  const cpfLimpo=(cpf||"").replace(/\D/g,"");
  const criar=async(plano)=>{
    if(!workerOk){setMsg("Falta configurar a WORKER_URL no topo do arquivo.");setEtapa("erro");return;}
    if(cpfLimpo.length!==11){setMsg("Digite um CPF válido (11 dígitos) para gerar o Pix.");return;}
    setEtapa("carregando");
    try{
      const r=await wfetch("/criar-pix",{user_id:uid,email,plano,cpf:cpfLimpo});
      const d=await r.json();
      if(!r.ok||d.error) throw new Error(typeof d.error==="string"?d.error:"Falha ao gerar o Pix. Confira o Worker.");
      setPix(d);setEtapa("pix");
      pollRef.current=setInterval(async()=>{const ok=await onVerificar();if(ok){clearInterval(pollRef.current);setEtapa("sucesso");}},5000);
    }catch(e){setMsg(e.message);setEtapa("erro");}
  };
  const copiar=()=>{if(pix&&pix.qr_code){navigator.clipboard.writeText(pix.qr_code);setCopiado(true);setTimeout(()=>setCopiado(false),1500);}};
  const verificarAgora=async()=>{const ok=await onVerificar();if(ok){if(pollRef.current)clearInterval(pollRef.current);setEtapa("sucesso");}};

  const overlay={position:"fixed",inset:0,background:"rgba(0,0,0,.6)",display:"flex",alignItems:"center",justifyContent:"center",padding:18,zIndex:50};
  return <div style={overlay} onClick={onClose}>
    <div className="card" style={{maxWidth:420,width:"100%"}} onClick={e=>e.stopPropagation()}>
      <div className="row" style={{justifyContent:"space-between",marginBottom:6}}>
        <h3 style={{fontSize:18}}>Assinar</h3><span className="link" onClick={onClose}>fechar</span>
      </div>

      {etapa==="plano" && <div>
        <div className="muted" style={{fontSize:14,marginBottom:14}}>Pagamento único por Pix. Acesso liberado na hora após a confirmação.</div>

        <div className="card" style={{background:"linear-gradient(135deg,#123528,#16302b)",border:"1px solid var(--gold)",marginBottom:12,position:"relative"}}>
          <b style={{fontSize:16}}>Acesso completo — 6 meses</b>
          <div style={{fontSize:28,fontWeight:800,letterSpacing:"-.02em",margin:"4px 0 0"}}>R$ 49,90<span style={{fontSize:13,fontWeight:600,color:"var(--muted)"}}> pagamento único</span></div>
          <div className="muted" style={{fontSize:13,margin:"2px 0 6px"}}>Tudo liberado por 6 meses: 64 assuntos, 258 questões, simulados, aula adaptativa e correção por IA. Sem mensalidade, sem renovação automática.</div>
          <div style={{fontSize:12,color:"var(--acc)",marginBottom:12}}>Menos de R$ 9 por mês para organizar sua reta final.</div>
          <div style={{marginBottom:10}}>
            <label style={{fontSize:12,color:"var(--muted)",display:"block",marginBottom:4}}>CPF (obrigatório para o Pix)</label>
            <input value={cpf} onChange={e=>setCpf(e.target.value)} inputMode="numeric" placeholder="000.000.000-00" maxLength={14}
              style={{width:"100%",padding:"11px 13px",borderRadius:9,border:"1px solid var(--line)",background:"var(--bg)",color:"var(--ink)",fontSize:15}} />
            {cpf && cpfLimpo.length!==11 && <div style={{fontSize:11.5,color:"var(--bad,#ff6b6b)",marginTop:4}}>O CPF deve ter 11 dígitos.</div>}
          </div>
          {msg && etapa==="plano" && <div style={{fontSize:12.5,color:"var(--bad,#ff6b6b)",marginBottom:8}}>{msg}</div>}
          <button className="btn" style={{width:"100%",opacity:cpfLimpo.length===11?1:.6}} onClick={()=>criar("semestral")}>Pagar R$ 49,90 no Pix</button>
        </div>
      </div>}

      {etapa==="carregando" && <div className="muted" style={{padding:"20px 0",textAlign:"center"}}>Gerando cobrança Pix...</div>}

      {etapa==="pix" && pix && <div style={{textAlign:"center"}}>
        <div className="muted" style={{fontSize:13,marginBottom:10}}>Escaneie o QR ou use o copia-e-cola. A liberação é automática.</div>
        {pix.qr_code_base64 && <img alt="QR Pix" src={"data:image/png;base64,"+pix.qr_code_base64} style={{width:200,height:200,borderRadius:10,background:"#fff",padding:6}}/>}
        <div style={{marginTop:12}}><button className="btn ghost sm" onClick={copiar}>{copiado?"Copiado!":"Copiar código Pix"}</button></div>
        <div className="muted" style={{fontSize:12,marginTop:14}}>Aguardando pagamento...</div>
        <div style={{marginTop:8}}><button className="btn sm" onClick={verificarAgora}>Já paguei — verificar</button></div>
      </div>}

      {etapa==="sucesso" && <div style={{textAlign:"center",padding:"10px 0"}}>
        <div className="kpi" style={{color:"var(--acc)"}}>PRO ativo!</div>
        <div className="muted" style={{fontSize:14,margin:"8px 0 16px"}}>Tudo liberado. Bons estudos.</div>
        <button className="btn" onClick={onClose}>Começar</button>
      </div>}

      {etapa==="erro" && <div style={{textAlign:"center",padding:"10px 0"}}>
        <div style={{color:"var(--bad)",fontSize:14,marginBottom:14}}>{msg}</div>
        <button className="btn ghost" onClick={()=>setEtapa("plano")}>Tentar de novo</button>
      </div>}
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
