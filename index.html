  {id:"mfc_atributos_q2",area:"MFC",tema:"Atributos da APS (Starfield)",transv:[],dif:2,premium:false,enun:"A equipe garante à paciente ações de promoção, prevenção, tratamento e reabilitação, abraçando o conjunto de suas necessidades. Qual atributo?",alts:["Longitudinalidade","Integralidade","Coordenação","Orientação comunitária"],correta:1,coment:"Cuidado amplo, para o conjunto de necessidades = integralidade (amplitude)."},
  {id:"mfc_atributos_q3",area:"MFC",tema:"Atributos da APS (Starfield)",transv:[],dif:2,premium:false,enun:"A UBS organiza os encaminhamentos ao especialista, recebe os resultados e mantém a continuidade do cuidado na rede. Qual atributo?",alts:["Primeiro contato","Coordenação","Competência cultural","Integralidade"],correta:1,coment:"Integrar e organizar o cuidado que ocorre em outros pontos da rede = coordenação."},
  {id:"mfc_atributos_q4",area:"MFC",tema:"Atributos da APS (Starfield)",transv:[],dif:2,premium:false,enun:"Quais são os quatro atributos ESSENCIAIS da APS segundo Starfield?",alts:["Primeiro contato, longitudinalidade, integralidade e coordenação","Família, comunidade, cultura e território","Promoção, prevenção, cura e reabilitação","Universalidade, integralidade, equidade e descentralização"],correta:0,coment:"Os essenciais são: primeiro contato/acesso, longitudinalidade, integralidade e coordenação. Os demais são derivados."},
  {id:"mfc_vigilancia_q1",area:"MFC",tema:"Vigilância e notificação",transv:[],dif:2,premium:false,enun:"Na UBS, você confirma um caso de dengue. Qual a conduta correta de vigilância?",alts:["Notificar apenas se houver óbito","Notificação compulsória, registrada no SINAN","Notificar somente se virar surto","Não há necessidade de notificar"],correta:1,coment:"Dengue é de notificação compulsória e deve ser registrada no SINAN, independentemente da evolução."},
  {id:"mfc_vigilancia_q2",area:"MFC",tema:"Vigilância e notificação",transv:[],dif:2,premium:false,enun:"Qual dessas situações exige notificação IMEDIATA (em até 24 horas)?",alts:["Caso isolado de hipertensão","Caso suspeito de sarampo","Diabetes tipo 2","Cefaleia tensional"],correta:1,coment:"Sarampo (e surtos/doenças de interesse internacional) exige notificação imediata em 24h."},
  {id:"mfc_vigilancia_q3",area:"MFC",tema:"Vigilância e notificação",transv:[],dif:2,premium:false,enun:"Em qual sistema são registradas as doenças de notificação compulsória?",alts:["SISREG","SINAN","e-SUS apenas","Não há registro"],correta:1,coment:"As doenças de notificação compulsória são registradas no SINAN."},
  {id:"mfc_vigilancia_q4",area:"MFC",tema:"Vigilância e notificação",transv:[],dif:2,premium:false,enun:"A notificação de uma doença da lista depende de o paciente evoluir mal?",alts:["Sim, só se internar","Não — confirmado (ou suspeito, conforme a doença) o caso da lista, notifica-se","Só se houver óbito","Só em surtos"],correta:1,coment:"A notificação é feita pela presença do caso da lista, não pela gravidade da evolução."},
  {id:"cm_dm2_q1",area:"CM",tema:"Diabetes tipo 2",transv:[],dif:2,premium:false,enun:"Homem de 52 anos, DM2 recém-diagnosticado, risco cardiovascular baixo, sem doença cardiorrenal nem obesidade, HbA1c 7,0%, função renal normal. Conduta farmacológica inicial (SBD 2025)?",alts:["Insulina NPH ao deitar","Metformina em monoterapia","Iniciar iSGLT2 + GLP-1 de imediato","Apenas dieta por 12 meses"],correta:1,coment:"Na SBD 2025, a metformina em monoterapia segue como escolha inicial para risco CV baixo/intermediário, sem doença cardiorrenal/obesidade e HbA1c < 7,5%. Em alto risco CV/renal, iSGLT2 ou GLP-1 entrariam cedo."},
  {id:"cm_dm2_q2",area:"CM",tema:"Diabetes tipo 2",transv:[],dif:2,premium:false,enun:"Qual valor fecha diagnóstico de diabetes em jejum?",alts:["Glicemia de jejum ≥100","Glicemia de jejum ≥126","HbA1c ≥5,7%","TOTG 2h ≥140"],correta:1,coment:"Jejum ≥126 (confirmado) fecha diabetes. HbA1c ≥6,5% e TOTG 2h ≥200 também."},
  {id:"cm_dm2_q3",area:"CM",tema:"Diabetes tipo 2",transv:[],dif:2,premium:false,enun:"Paciente com DM2 e TFG muito reduzida. Qual cuidado com a metformina?",alts:["Aumentar a dose","Pode ser contraindicada pela função renal ruim","Associar sempre insulina","Não há restrição"],correta:1,coment:"Com função renal muito reduzida (TFG baixa) a metformina pode ser contraindicada."},
  {id:"cm_dm2_q4",area:"CM",tema:"Diabetes tipo 2",transv:[],dif:2,premium:false,enun:"Sobre a meta de HbA1c no DM2, é correto:",alts:["É igual para todos","É individualizada: mais rígida no jovem, mais frouxa no idoso frágil","Deve ser sempre <5%","Não importa a idade"],correta:1,coment:"A meta é individualizada (geral <7%), mais frouxa em idosos frágeis pelo risco de hipoglicemia."},
  {id:"cir_posop_q1",area:"CIR",tema:"Pré-op e complicações",transv:[],dif:2,premium:false,enun:"Paciente no 1º dia pós-operatório com febre de 38°C, sem outros sinais localizatórios. Causa mais provável?",alts:["Abscesso intracavitário","Atelectasia (causa pulmonar)","TVP","Infecção de ferida"],correta:1,coment:"Febre nas primeiras 24-48h costuma ser pulmonar (atelectasia). Estimular respiração e deambulação."},
  {id:"cir_posop_q2",area:"CIR",tema:"Pré-op e complicações",transv:[],dif:2,premium:false,enun:"A regra dos '5 Ws' organiza as causas de qual complicação pós-operatória?",alts:["Sangramento","Febre","Náusea","Dor"],correta:1,coment:"Os 5 Ws (Wind, Water, Wound, Walking, Wonder drugs) organizam as causas de febre pós-op."},
  {id:"cir_posop_q3",area:"CIR",tema:"Pré-op e complicações",transv:[],dif:2,premium:false,enun:"Qual profilaxia é fundamental no pré-operatório de paciente que ficará imóvel?",alts:["Profilaxia de TVP","Antibiótico por 30 dias","Corticoide","Diurético"],correta:0,coment:"A profilaxia de TVP é fundamental em pacientes que ficarão imóveis."},
  {id:"cir_posop_q4",area:"CIR",tema:"Pré-op e complicações",transv:[],dif:2,premium:false,enun:"Febre pós-operatória que aparece tardiamente (após alguns dias) sugere principalmente:",alts:["Atelectasia","Infecção (ferida, ITU) ou coleção/abscesso","Febre do jaleco","Nada relevante"],correta:1,coment:"Febre tardia puxa a investigação para infecção (ferida, urina) ou coleções/abscessos."},
  {id:"cir_hernia_q1",area:"CIR",tema:"Hérnias de parede",transv:[],dif:2,premium:false,enun:"Mulher idosa com abaulamento inguinal direito irredutível há 24h, vômitos, parada de eliminação de flatos e hiperemia local. Hipótese?",alts:["Hérnia inguinal redutível","Hérnia femoral encarcerada/estrangulada","Isquemia mesentérica primária","Neoplasia de cólon"],correta:1,coment:"Abaulamento irredutível + obstrução + sinais inflamatórios = hérnia encarcerada/estrangulada (femoral, mais comum em mulheres). Emergência cirúrgica."},
  {id:"cir_hernia_q2",area:"CIR",tema:"Hérnias de parede",transv:[],dif:2,premium:false,enun:"Qual a diferença entre encarceramento e estrangulamento?",alts:["São sinônimos","Encarceramento = irredutível com circulação; estrangulamento = irredutível com isquemia","Estrangulamento é sempre indolor","Encarceramento exige cirurgia imediata sempre"],correta:1,coment:"Encarceramento: irredutível, circulação mantida. Estrangulamento: irredutível + isquemia = emergência."},
  {id:"cir_hernia_q3",area:"CIR",tema:"Hérnias de parede",transv:[],dif:2,premium:false,enun:"Qual hérnia tem maior risco de estrangular, sobretudo em mulheres?",alts:["Umbilical","Femoral","Incisional","Epigástrica"],correta:1,coment:"A femoral, por passar num anel estreito, encarcera/estrangula mais, sobretudo em mulheres."},
  {id:"cir_hernia_q4",area:"CIR",tema:"Hérnias de parede",transv:[],dif:2,premium:false,enun:"Hérnia inguinal não complicada, redutível, assintomática. Conduta?",alts:["Cirurgia de urgência imediata","Correção cirúrgica eletiva (fila do SUS)","Nunca operar","Antibiótico"],correta:1,coment:"Hérnia não complicada é cirurgia eletiva; urgência é reservada ao estrangulamento."},
  {id:"go_hemorragias_q1",area:"GO",tema:"Hemorragias da gestação",transv:[],dif:2,premium:false,enun:"Gestante no 3º trimestre, hipertensa, com dor abdominal, útero hipertônico, sangramento escuro e BCF 90 bpm. Diagnóstico mais provável?",alts:["Placenta prévia","Descolamento prematuro de placenta (DPP)","Rotura de vasa prévia","Trabalho de parto normal"],correta:1,coment:"Dor + hipertonia + sangue escuro + sofrimento fetal, com fator de risco (HAS) = DPP. Emergência."},
  {id:"go_hemorragias_q2",area:"GO",tema:"Hemorragias da gestação",transv:[],dif:2,premium:false,enun:"Gestante no 3º trimestre com sangramento vermelho vivo, indolor, de repetição, sem hipertonia. Conduta que NÃO deve ser feita antes do ultrassom?",alts:["Monitorar sinais vitais","Toque vaginal","Avaliar BCF","Acesso venoso"],correta:1,coment:"Suspeita de placenta prévia: não fazer toque vaginal antes do US (risco de hemorragia maciça)."},
  {id:"go_hemorragias_q3",area:"GO",tema:"Hemorragias da gestação",transv:[],dif:2,premium:false,enun:"Qual exame confirma gestação ectópica?",alts:["Apenas exame físico","Beta-hCG seriado associado a ultrassom transvaginal","Raio-x de abdome","Hemograma isolado"],correta:1,coment:"Ectópica: beta-hCG (seriado) + ultrassom transvaginal."},
  {id:"go_hemorragias_q4",area:"GO",tema:"Hemorragias da gestação",transv:[],dif:2,premium:false,enun:"O sangramento típico da placenta prévia é:",alts:["Escuro e muito doloroso","Vermelho vivo e indolor","Sempre acompanhado de hipertonia","Apenas no parto"],correta:1,coment:"Placenta prévia: sangue vivo, indolor, frequentemente de repetição."},
  {id:"go_rastreio_q1",area:"GO",tema:"Rastreio CA colo e mama",transv:[],dif:2,premium:false,enun:"Mulher de 30 anos, assintomática, em município onde o teste de DNA-HPV já está implantado. Segundo a diretriz do MS (2025), o rastreamento de câncer de colo deve ser:",alts:["Citologia (Papanicolau) anual","Teste de DNA-HPV oncogênico, e se negativo repetir em 5 anos","Colposcopia imediata","Não rastrear antes dos 35 anos"],correta:1,coment:"Diretriz MS 2025: método primário é o teste de DNA-HPV oncogênico (25-64 anos); se negativo, repete em 5 anos."},
  {id:"go_rastreio_q2",area:"GO",tema:"Rastreio CA colo e mama",transv:[],dif:2,premium:false,enun:"Em uma UBS onde o teste de DNA-HPV ainda NÃO foi implantado, como deve ser feito o rastreamento de câncer de colo?",alts:["Suspender o rastreamento até o teste chegar","Manter a citologia a cada 3 anos, após dois exames anuais normais","Encaminhar todas para colposcopia","Fazer citologia anual por toda a vida"],correta:1,coment:"Na transição, onde o DNA-HPV não está disponível, mantém-se a citologia trienal após dois anuais consecutivos normais."},
  {id:"go_rastreio_q3",area:"GO",tema:"Rastreio CA colo e mama",transv:[],dif:2,premium:false,enun:"Adolescente de 20 anos, sexualmente ativa, assintomática, solicita 'preventivo'. Conduta quanto ao rastreamento de colo?",alts:["Iniciar o teste de DNA-HPV agora","Não iniciar o rastreamento antes dos 25 anos","Fazer colposcopia","Citologia a cada 6 meses"],correta:1,coment:"Não se inicia o rastreamento de colo (nem DNA-HPV nem citologia) antes dos 25 anos, pela alta taxa de infecções transitórias e risco de sobretratamento."},
  {id:"go_rastreio_q4",area:"GO",tema:"Rastreio CA colo e mama",transv:[],dif:2,premium:false,enun:"Qual a recomendação do rastreamento populacional de câncer de mama pelo Ministério da Saúde?",alts:["Mamografia anual dos 40 aos 70 anos","Mamografia a cada 2 anos, na faixa de 50 a 69 anos (ampliada para até 74 anos pelo MS em 2025)","Ultrassonografia anual a partir dos 30","Ressonância bienal dos 45 aos 60"],correta:1,coment:"Mamografia bienal; faixa 50-69 (INCA), ampliada para 50-74 pelo MS em 2025. Rastreio anual dos 40 não é o padrão populacional."},
  {id:"ped_vacinas_q1",area:"PED",tema:"Calendário vacinal",transv:[],dif:2,premium:false,enun:"Criança com resfriado leve e febre baixa (37,8°C), com vacina atrasada. Conduta?",alts:["Adiar todas as vacinas","Vacinar normalmente e atualizar o calendário","Só vacinar após 30 dias sem sintomas","Contraindicar por 6 meses"],correta:1,coment:"Resfriado leve e febre baixa NÃO contraindicam; deve-se vacinar e fazer o resgate do calendário."},
  {id:"ped_vacinas_q2",area:"PED",tema:"Calendário vacinal",transv:[],dif:2,premium:false,enun:"Quais vacinas são aplicadas ao nascer?",alts:["Tríplice viral e febre amarela","BCG e hepatite B","Pentavalente e pólio","HPV e meningo"],correta:1,coment:"Ao nascer: BCG (formas graves de TB) e hepatite B."},
  {id:"ped_vacinas_q3",area:"PED",tema:"Calendário vacinal",transv:[],dif:2,premium:false,enun:"Qual é uma contraindicação VERDADEIRA a vacina de vírus vivo (ex.: tríplice viral)?",alts:["Prematuridade","Imunossupressão importante ou gestação","Resfriado leve","Uso de antibiótico"],correta:1,coment:"Vírus vivo é contraindicado em imunossupressão importante e gestação."},
  {id:"ped_vacinas_q4",area:"PED",tema:"Calendário vacinal",transv:[],dif:2,premium:false,enun:"Prematuro em boas condições, na idade de vacinar. Conduta quanto ao calendário?",alts:["Adiar por ser prematuro","Seguir a idade cronológica e vacinar","Reduzir as doses pela metade","Contraindicar todas"],correta:1,coment:"Prematuridade não contraindica; segue-se a idade cronológica para vacinar."},
  {id:"ped_desenvolvimento_q1",area:"PED",tema:"Crescimento e aleitamento",transv:[],dif:2,premium:false,enun:"Até que idade se recomenda o aleitamento materno EXCLUSIVO?",alts:["Até 3 meses","Até 6 meses","Até 12 meses","Até 2 anos"],correta:1,coment:"AME até 6 meses (só leite materno); complementar até 2 anos ou mais."},
  {id:"ped_desenvolvimento_q2",area:"PED",tema:"Crescimento e aleitamento",transv:[],dif:2,premium:false,enun:"Por volta de qual idade se espera que a criança ande sem apoio?",alts:["6 meses","12 meses","18 meses apenas","3 meses"],correta:1,coment:"O andar sem apoio é esperado por volta dos 12 meses (com variação)."},
  {id:"ped_desenvolvimento_q3",area:"PED",tema:"Crescimento e aleitamento",transv:[],dif:2,premium:false,enun:"Bebê de 3 meses em aleitamento exclusivo. Pode-se oferecer chá para cólica?",alts:["Sim, à vontade","Não — no aleitamento exclusivo não se oferece água ou chá antes dos 6 meses","Sim, mas só à noite","Somente água"],correta:1,coment:"No AME não se oferece água/chá antes dos 6 meses."},
  {id:"ped_desenvolvimento_q4",area:"PED",tema:"Crescimento e aleitamento",transv:[],dif:2,premium:false,enun:"Uma criança que 'cai de canal' na curva de crescimento ou tem atraso importante de marcos deve:",alts:["Ser apenas observada por anos","Ser investigada","Receber alta da puericultura","Trocar de fórmula sem avaliação"],correta:1,coment:"Queda de canal ou atraso importante são sinais de alerta que exigem investigação."},
  {id:"mfc_rastreio_q1",area:"MFC",tema:"Rastreamentos no SUS",transv:[],dif:2,premium:false,enun:"Homem de 52 anos, assintomático, sem história familiar, na primeira consulta. Conforme rastreamento baseado em evidência, o médico de família deve:",alts:["Solicitar PSA e toque retal de rotina","Abordar estilo de vida/cessação do tabagismo e acompanhar, sem rastreios sem evidência","Pedir colonoscopia imediata","Solicitar TC de tórax de rotina"],correta:1,coment:"Prevenção quaternária: não rastrear o que não tem evidência (PSA em massa). Foco no que muda desfecho."},
  {id:"mfc_rastreio_q2",area:"MFC",tema:"Rastreamentos no SUS",transv:[],dif:2,premium:false,enun:"Evitar exames, diagnósticos e tratamentos desnecessários é qual nível de prevenção?",alts:["Primária","Secundária","Terciária","Quaternária"],correta:3,coment:"Prevenção quaternária: proteger o paciente do excesso de medicina."},
  {id:"mfc_rastreio_q3",area:"MFC",tema:"Rastreamentos no SUS",transv:[],dif:2,premium:false,enun:"O rastreamento populacional de câncer de próstata por PSA em massa é:",alts:["Recomendado para todos acima de 40","Não recomendado como rastreamento populacional pelo MS","Obrigatório anualmente","Recomendado só para mulheres"],correta:1,coment:"PSA em massa não é recomendado como rastreio populacional (balanço dano/benefício desfavorável)."},
  {id:"mfc_rastreio_q4",area:"MFC",tema:"Rastreamentos no SUS",transv:[],dif:2,premium:false,enun:"Reabilitar um paciente após AVC, reduzindo sequelas, é prevenção:",alts:["Primária","Secundária","Terciária","Quaternária"],correta:2,coment:"Reduzir sequelas de doença já instalada = prevenção terciária."},
  {id:"mfc_mccp_q1",area:"MFC",tema:"Método centrado na pessoa",transv:[],dif:2,premium:false,enun:"O médico de família explora não só o diagnóstico, mas o que a paciente sente, teme e espera, e constrói o plano junto com ela. Isso caracteriza:",alts:["Método centrado na doença","Método clínico centrado na pessoa (MCCP)","Abordagem exclusivamente biomédica","Consulta de urgência"],correta:1,coment:"Considerar a experiência da pessoa e decidir em conjunto é o MCCP."},
  {id:"mfc_mccp_q2",area:"MFC",tema:"Método centrado na pessoa",transv:[],dif:2,premium:false,enun:"Qual ferramenta mapeia as relações e doenças da família ao longo das gerações?",alts:["Ecomapa","Genograma","Territorialização","Prontuário eletrônico"],correta:1,coment:"O genograma mapeia relações e doenças familiares através das gerações."},
  {id:"mfc_mccp_q3",area:"MFC",tema:"Método centrado na pessoa",transv:[],dif:2,premium:false,enun:"Fatores como moradia, renda, trabalho e educação, que influenciam o adoecimento, são chamados de:",alts:["Fatores de risco laboratoriais","Determinantes sociais da saúde","Sinais de alarme","Contraindicações"],correta:1,coment:"São os determinantes sociais da saúde, centrais na abordagem da APS."},
  {id:"mfc_mccp_q4",area:"MFC",tema:"Método centrado na pessoa",transv:[],dif:2,premium:false,enun:"A decisão compartilhada com o paciente, no MCCP, tende a:",alts:["Piorar a adesão","Melhorar a adesão ao plano","Não influenciar nada","Substituir o diagnóstico"],correta:1,coment:"Envolver o paciente na decisão melhora a adesão ao tratamento."},
  {id:"tv_saudemental_q1",area:"CM",tema:"Saúde Mental na APS (transversal)",transv:[],dif:2,premium:false,enun:"Mulher de 34 anos na APS com humor deprimido, anedonia e insônia há 8 semanas, sem risco de suicídio e sem mania. Primeira linha de tratamento medicamentoso no SUS?",alts:["Amitriptilina em dose plena imediata","ISRS (fluoxetina/sertralina)","Benzodiazepínico contínuo","Antipsicótico"],correta:1,coment:"ISRS são 1ª linha por segurança e tolerabilidade, disponíveis na Rename."},
  {id:"tv_saudemental_q2",area:"CM",tema:"Saúde Mental na APS (transversal)",transv:[],dif:2,premium:false,enun:"Por que o benzodiazepínico não é 1ª linha para ansiedade/depressão crônica?",alts:["Não alivia nada","Causa dependência e não trata o transtorno de base","É proibido no SUS","Só serve para crianças"],correta:1,coment:"Benzodiazepínico pode aliviar sintoma agudo, mas causa dependência e não trata o transtorno de base."},
  {id:"tv_saudemental_q3",area:"CM",tema:"Saúde Mental na APS (transversal)",transv:[],dif:2,premium:false,enun:"Paciente com uso problemático de álcool. Qual a abordagem da APS?",alts:["Apenas internar","Rastrear (AUDIT/CAGE), abordar e articular com a RAPS/CAPS","Ignorar, não é papel da APS","Prescrever benzodiazepínico contínuo"],correta:1,coment:"A APS rastreia e articula com a RAPS (CAPS), com lógica de cuidado no território e redução de danos."},
  {id:"tv_saudemental_q4",area:"CM",tema:"Saúde Mental na APS (transversal)",transv:[],dif:2,premium:false,enun:"Diante de paciente com risco de suicídio, é correto:",alts:["Nunca perguntar para não induzir","Avaliar ativamente o risco e priorizar a segurança, podendo romper o sigilo para proteger a vida","Dar alta imediata","Aguardar piora"],correta:1,coment:"Avalia-se ativamente; a proteção da vida é prioridade e pode justificar romper o sigilo e acionar a rede."},
  {id:"tv_sus_q1",area:"MFC",tema:"Princípios do SUS (transversal)",transv:[],dif:2,premium:false,enun:"Tratar desigualmente os desiguais, oferecendo mais a quem precisa mais, corresponde a qual princípio do SUS?",alts:["Universalidade","Integralidade","Equidade","Descentralização"],correta:2,coment:"Equidade: dar conforme a necessidade (diferente de igualdade, que é dar o mesmo a todos)."},
  {id:"tv_sus_q2",area:"MFC",tema:"Princípios do SUS (transversal)",transv:[],dif:2,premium:false,enun:"Qual dos itens é uma DIRETRIZ organizativa do SUS (não um princípio)?",alts:["Universalidade","Integralidade","Equidade","Descentralização"],correta:3,coment:"Descentralização é diretriz organizativa; universalidade, integralidade e equidade são princípios."},
  {id:"tv_sus_q3",area:"MFC",tema:"Princípios do SUS (transversal)",transv:[],dif:2,premium:false,enun:"Os três princípios doutrinários do SUS são:",alts:["Universalidade, integralidade e equidade","Descentralização, regionalização e participação","Promoção, prevenção e cura","Eficiência, eficácia e economia"],correta:0,coment:"Princípios doutrinários: universalidade, integralidade e equidade."},
  {id:"tv_sus_q4",area:"MFC",tema:"Princípios do SUS (transversal)",transv:[],dif:2,premium:false,enun:"A participação da comunidade no SUS, via conselhos e conferências, é chamada de:",alts:["Descentralização","Controle social (participação social)","Regionalização","Hierarquização"],correta:1,coment:"É o controle social (participação social), diretriz do SUS exercida por conselhos e conferências."},
  {id:"cm_sca_q1",area:"CM",tema:"Síndrome coronariana aguda (IAM)",transv:[],dif:2,premium:false,enun:"Homem de 58 anos, dor torácica em aperto há 1 hora, sudorese. ECG com supradesnivelamento de ST em parede inferior. O hospital tem hemodinâmica disponível. Conduta prioritária?",alts:["Trombólise imediata","Angioplastia primária (reperfusão), idealmente com porta-balão ≤90 minutos","Aguardar a troponina para decidir","Alta com AAS e retorno ambulatorial"],correta:1,coment:"IAM COM supra em serviço com hemodinâmica: angioplastia primária é a 1ª escolha, meta porta-balão ≤90 min. Reperfusão tem prioridade absoluta."},
  {id:"cm_sca_q2",area:"CM",tema:"Síndrome coronariana aguda (IAM)",transv:[],dif:2,premium:false,enun:"Paciente com IAM com supra chega a hospital SEM hemodinâmica, e a transferência levaria mais de 2 horas. Qual a conduta?",alts:["Aguardar a transferência sem tratamento","Trombólise (fibrinolítico) com meta porta-agulha ≤30 minutos, se sem contraindicações","Apenas AAS e observação","Repetir ECG em 6 horas"],correta:1,coment:"Se não é possível angioplastia no tempo (transferência >120 min), indica-se trombólise (porta-agulha ≤30 min), em sintomas ≤12h e sem contraindicações. Depois, transferir para cateterismo."},
  {id:"cm_sca_q3",area:"CM",tema:"Síndrome coronariana aguda (IAM)",transv:[],dif:2,premium:false,enun:"Mulher de 65 anos com dor torácica, ECG SEM supra de ST, troponina elevada. Qual conduta está CORRETA?",alts:["Trombólise imediata","Estratificar risco (GRACE/TIMI) e definir cateterismo; NÃO trombolisar","Alta imediata","Fibrinolítico se dor persistir"],correta:1,coment:"IAM SEM supra (troponina elevada): não se trombolisa. Estratifica-se o risco e define-se o momento do cateterismo (precoce se alto risco)."},
  {id:"cm_sca_q4",area:"CM",tema:"Síndrome coronariana aguda (IAM)",transv:[],dif:2,premium:false,enun:"Por que a morfina não deve ser administrada de rotina precocemente no IAM com supra?",alts:["Porque causa hipertensão","Porque a melhora da dor é critério de reperfusão e a morfina a mascara (além de reduzir absorção dos antiplaquetários)","Porque não tem efeito analgésico","Porque está contraindicada em toda dor torácica"],correta:1,coment:"A analgesia precoce com morfina mascara a dor, que é um critério clínico de reperfusão, e reduz a absorção dos antiagregantes. Reserva-se para dor intolerável."},
  {id:"cm_ic_q1",area:"CM",tema:"Insuficiência cardíaca",transv:[],dif:2,premium:false,enun:"Homem de 60 anos, dispneia aos esforços, edema de MMII, eco com FE de 30%. Qual conjunto de fármacos comprovadamente REDUZ mortalidade nesse paciente?",alts:["Apenas furosemida","Os 4 pilares: IECA/BRA ou sacubitril-valsartana + betabloqueador + espironolactona + iSGLT2","Digoxina isolada","Apenas nitrato"],correta:1,coment:"ICFEr (FE ≤40%): os 4 pilares reduzem mortalidade. Diurético alivia congestão mas não muda mortalidade."},
  {id:"cm_ic_q2",area:"CM",tema:"Insuficiência cardíaca",transv:[],dif:2,premium:false,enun:"Sobre o uso de diuréticos na insuficiência cardíaca, é correto afirmar:",alts:["Reduzem a mortalidade","Aliviam a congestão e os sintomas, mas não reduzem mortalidade","Substituem os betabloqueadores","São contraindicados na IC"],correta:1,coment:"Diuréticos controlam a congestão/sintomas, porém não reduzem mortalidade — papel diferente dos 4 pilares."},
  {id:"cm_ic_q3",area:"CM",tema:"Insuficiência cardíaca",transv:[],dif:2,premium:false,enun:"Paciente com IC e FE de 55%, hipertenso, idoso. Como se classifica a IC quanto à fração de ejeção?",alts:["IC com FE reduzida","IC com FE preservada","Não é insuficiência cardíaca","IC intermediária"],correta:1,coment:"FE ≥50% = IC com fração de ejeção preservada (ICFEp), comum em idosos e hipertensos (coração enche mal)."},
  {id:"cm_ic_q4",area:"CM",tema:"Insuficiência cardíaca",transv:[],dif:2,premium:false,enun:"Qual exame laboratorial, quando NORMAL, praticamente afasta a IC como causa da dispneia?",alts:["Troponina","BNP / NT-proBNP","Hemograma","D-dímero"],correta:1,coment:"O BNP/NT-proBNP normal tem alto valor preditivo negativo: torna a IC improvável como causa da dispneia."},
  {id:"cm_avc_q1",area:"CM",tema:"AVC (isquêmico e hemorrágico)",transv:[],dif:2,premium:false,enun:"Paciente com hemiparesia súbita há 2 horas. Qual o primeiro exame e o objetivo?",alts:["Ressonância para confirmar o diagnóstico","Tomografia de crânio sem contraste, para separar AVC isquêmico de hemorrágico","Eletroencefalograma","Punção lombar"],correta:1,coment:"A TC de crânio sem contraste é o primeiro exame: diferencia isquêmico de hemorrágico, o que define condutas opostas."},
  {id:"cm_avc_q2",area:"CM",tema:"AVC (isquêmico e hemorrágico)",transv:[],dif:2,premium:false,enun:"AVC isquêmico confirmado, início dos sintomas há 3 horas, PA 160/90, sem contraindicações. Conduta de reperfusão?",alts:["Trombólise endovenosa (dentro da janela de 4,5h)","Aguardar 24 horas","Anti-hipertensivo agressivo primeiro","Nenhuma reperfusão é possível"],correta:0,coment:"Isquêmico dentro de 4,5h e sem contraindicação: trombólise endovenosa. A PA de 160/90 é tolerada no isquêmico."},
  {id:"cm_avc_q3",area:"CM",tema:"AVC (isquêmico e hemorrágico)",transv:[],dif:2,premium:false,enun:"Sobre a pressão arterial no AVC isquêmico agudo, é correto:",alts:["Deve ser baixada agressivamente sempre","É tolerada (permite-se PA mais elevada); baixar demais piora a isquemia","Não influencia a conduta","Deve ficar abaixo de 110/70"],correta:1,coment:"No isquêmico tolera-se hipertensão (mantém perfusão da área de penumbra); trata-se só acima de limites altos, ou antes da trombólise (>185/110)."},
  {id:"cm_avc_q4",area:"CM",tema:"AVC (isquêmico e hemorrágico)",transv:[],dif:2,premium:false,enun:"Paciente com AVC hemorrágico confirmado na TC. Qual conduta é adequada?",alts:["Trombólise endovenosa imediata","Controle rigoroso da pressão arterial, correção de coagulopatia e avaliação neurocirúrgica","Antiagregante em dose alta","Trombectomia mecânica"],correta:1,coment:"No hemorrágico NÃO se trombolisa: controla-se rigorosamente a PA, corrige-se coagulopatia e avalia-se neurocirurgia."},
  {id:"cm_asma_dpoc_q1",area:"CM",tema:"Asma e DPOC",transv:[],dif:2,premium:false,enun:"Jovem de 20 anos com asma, usando apenas salbutamol de resgate várias vezes por semana, com sintomas noturnos. Qual a conduta correta segundo a GINA?",alts:["Manter só o salbutamol de resgate","Introduzir corticoide inalatório como base do tratamento (controle da inflamação)","Prescrever antibiótico","Iniciar corticoide oral contínuo"],correta:1,coment:"A base do tratamento da asma é o corticoide inalatório. Tratar só com resgate não controla a doença e aumenta o risco de crise grave."},
  {id:"cm_asma_dpoc_q2",area:"CM",tema:"Asma e DPOC",transv:[],dif:2,premium:false,enun:"Criança/adulto em crise de asma (exacerbação) com dispneia e sibilância. Além de O2 e salbutamol, qual medida é fundamental e precoce?",alts:["Antibiótico de rotina","Corticoide sistêmico (oral ou venoso) precoce","Broncodilatador de longa ação isolado","Sedação"],correta:1,coment:"Na crise de asma, o corticoide sistêmico precoce reduz a inflamação e previne recaída. Antibiótico não é rotina."},
  {id:"cm_asma_dpoc_q3",area:"CM",tema:"Asma e DPOC",transv:[],dif:2,premium:false,enun:"Homem de 65 anos, tabagista de longa data, com dispneia progressiva e pouca reversibilidade ao broncodilatador. Qual a ÚNICA medida que altera a história natural da DPOC?",alts:["Corticoide inalatório","Cessação do tabagismo","Antibiótico contínuo","Mucolítico"],correta:1,coment:"A cessação do tabagismo é a única medida que muda a história natural da DPOC. Broncodilatadores aliviam sintomas; vacinação e O2 (se hipoxemia) também ajudam."},
  {id:"cm_asma_dpoc_q4",area:"CM",tema:"Asma e DPOC",transv:[],dif:2,premium:false,enun:"Sobre o papel do corticoide inalatório, qual afirmação está correta?",alts:["É a base tanto da asma quanto da DPOC","É a base da asma; na DPOC entra apenas em perfis selecionados (ex.: exacerbações, eosinofilia)","Não é usado na asma","É contraindicado na asma leve"],correta:1,coment:"Corticoide inalatório é a base da asma; na DPOC a base são os broncodilatadores de longa ação, e o CI é reservado a casos selecionados."},
  {id:"cm_dengue_q1",area:"CM",tema:"Dengue e arboviroses",transv:[],dif:2,premium:false,enun:"Homem de 40 anos, 5º dia de doença, refere que a febre cedeu ontem, mas evoluiu com dor abdominal intensa e contínua e vômitos persistentes. PA 110/70 (sem hipotensão), hematócrito em elevação. Classificação e conduta?",alts:["Grupo A; hidratação oral domiciliar","Grupo C; internação e expansão venosa com 10 mL/kg na primeira hora","Grupo B; apenas hemograma e alta","Grupo D; 20 mL/kg em 20 minutos"],correta:1,coment:"Dor abdominal intensa, vômitos persistentes e hematócrito subindo são sinais de ALARME, sem hipotensão = Grupo C: internação e expansão com soro fisiológico 10 mL/kg na 1ª hora, reavaliando (até 3 vezes). O Grupo D exige choque/hipotensão."},
  {id:"cm_dengue_q2",area:"CM",tema:"Dengue e arboviroses",transv:[],dif:2,premium:false,enun:"Por que o paciente com dengue tende a piorar justamente quando a febre cede, entre o 3º e o 7º dia?",alts:["Porque o vírus se multiplica mais sem febre","Porque é a fase crítica, em que ocorre extravasamento plasmático (hemoconcentração e hipovolemia)","Porque a plaqueta cai apenas após a febre","Porque a antibioticoterapia falhou"],correta:1,coment:"A defervescência marca a entrada na fase crítica: os capilares extravasam plasma, o hematócrito sobe e o volume intravascular cai, levando ao choque. Por isso 'a febre passou' não significa melhora."},
  {id:"cm_dengue_q3",area:"CM",tema:"Dengue e arboviroses",transv:[],dif:2,premium:false,enun:"Paciente com dengue e mialgia intensa solicita analgésico. Qual conduta está correta?",alts:["Prescrever ácido acetilsalicílico (AAS)","Prescrever paracetamol ou dipirona; AAS e AINEs são contraindicados","Prescrever ibuprofeno em dose alta","Prescrever diclofenaco intramuscular"],correta:1,coment:"Na dengue usa-se paracetamol ou dipirona. AAS e anti-inflamatórios não esteroidais são contraindicados pelo risco de sangramento e lesão renal."},
  {id:"cm_dengue_q4",area:"CM",tema:"Dengue e arboviroses",transv:[],dif:2,premium:false,enun:"Mulher de 30 anos, 3º dia de dengue, sem sinais de alarme e sem comorbidades, mas com prova do laço positiva. Conduta segundo o MS?",alts:["Grupo A: hidratação oral em casa, sem exame","Grupo B: solicitar hemograma na unidade e reclassificar conforme o hematócrito","Grupo C: expansão venosa imediata","Alta sem retorno"],correta:1,coment:"Prova do laço positiva (ou sangramento espontâneo de pele) sem sinais de alarme = Grupo B: hemograma na unidade com hidratação oral supervisionada; hematócrito normal reclassifica para conduta do Grupo A, hematócrito aumentado sobe para o Grupo C."},

  {id:"cm_tb_q1",area:"CM",tema:"Tuberculose",transv:[],dif:2,premium:false,enun:"Homem de 45 anos, em situação de rua, com tosse há 4 semanas, febre vespertina, sudorese noturna e emagrecimento. Qual o exame INICIAL de escolha para o diagnóstico?",alts:["Baciloscopia de escarro em 3 amostras","Teste rápido molecular para tuberculose (TRM-TB)","Prova tuberculínica (PPD)","Cultura para micobactérias apenas"],correta:1,coment:"O TRM-TB é o exame inicial de escolha: em cerca de 2h detecta o DNA do M. tuberculosis e ainda identifica resistência à rifampicina. A baciloscopia fica onde não há TRM e para o controle mensal do tratamento; a prova tuberculínica serve para ILTB, não para doença ativa."},
  {id:"cm_tb_q2",area:"CM",tema:"Tuberculose",transv:[],dif:2,premium:false,enun:"Confirmada tuberculose pulmonar sensível em adulto virgem de tratamento. Qual o esquema básico preconizado pelo Ministério da Saúde?",alts:["2RHZE + 4RH (total de 6 meses)","3RH + 3RE (total de 6 meses)","Rifampicina isolada por 4 meses","2RHZ + 7RH (total de 9 meses)"],correta:0,coment:"Esquema básico: 2 meses de RHZE (fase intensiva) + 4 meses de RH (manutenção), em dose fixa combinada, totalizando 6 meses, preferencialmente sob tratamento diretamente observado (TDO)."},
  {id:"cm_tb_q3",area:"CM",tema:"Tuberculose",transv:[],dif:2,premium:false,enun:"Paciente no 10º dia de RIPE retorna assustado porque a urina está alaranjada. Conduta?",alts:["Suspender todo o esquema imediatamente","Tranquilizar: é efeito esperado da rifampicina; manter o esquema e orientar que ela reduz a eficácia do anticoncepcional oral","Trocar a rifampicina por estreptomicina","Solicitar biópsia renal"],correta:1,coment:"A coloração alaranjada da urina e secreções é efeito esperado da rifampicina e NÃO indica suspensão. Vale orientar o paciente e lembrar da interação com o anticoncepcional oral (reduz a eficácia)."},
  {id:"cm_tb_q4",area:"CM",tema:"Tuberculose",transv:[],dif:2,premium:false,enun:"Contato domiciliar de paciente bacilífero: assintomático, radiografia de tórax normal, prova tuberculínica de 8 mm, vacinado com BCG na infância. Conduta?",alts:["Nada a fazer, pois o BCG explica o resultado","Tratar infecção latente (ILTB), pois o corte é ≥5 mm independentemente do BCG","Iniciar esquema básico RIPE por 6 meses","Repetir a prova tuberculínica em 2 anos"],correta:1,coment:"Excluída doença ativa (assintomático + Rx normal), PT ≥5 mm indica ILTB — o corte foi unificado em 5 mm, independentemente de BCG prévio. Trata-se com rifampicina 4 meses (120 doses), isoniazida 9 meses (270 doses) ou 3HP (rifapentina + isoniazida, 12 doses semanais). RIPE é para doença ativa."},

  {id:"cm_pac_q1",area:"CM",tema:"Pneumonia adquirida na comunidade",transv:[],dif:2,premium:false,enun:"Mulher de 72 anos com tosse e dispneia. Ao exame: confusa, FR 32 irpm, PA 85/55 mmHg. Ureia de 60 mg/dL. Qual a pontuação no CURB-65 e a conduta?",alts:["1 ponto; tratamento ambulatorial","3 pontos; ambulatorial com reavaliação em 48h","5 pontos; internação, com avaliação de terapia intensiva","0 ponto; apenas sintomáticos"],correta:2,coment:"Pontua em todos: Confusão (1) + Ureia >50 (1) + FR ≥30 (1) + PA sistólica <90 (1) + idade ≥65 (1) = 5 pontos. Com ≥3 pontos, interna-se e avalia-se terapia intensiva."},
  {id:"cm_pac_q2",area:"CM",tema:"Pneumonia adquirida na comunidade",transv:[],dif:2,premium:false,enun:"Homem de 35 anos, previamente hígido, sem uso recente de antibiótico, com PAC e CURB-65 de 0 ponto. Qual o tratamento ambulatorial de 1ª linha?",alts:["Amoxicilina","Levofloxacino","Ceftriaxona intramuscular","Vancomicina oral"],correta:0,coment:"Adulto hígido, sem comorbidade nem uso recente de ATB e escore baixo: amoxicilina (alternativa, macrolídeo). Quinolona respiratória não é a escolha empírica de rotina no Brasil."},
  {id:"cm_pac_q3",area:"CM",tema:"Pneumonia adquirida na comunidade",transv:[],dif:2,premium:false,enun:"Por que se evita prescrever quinolona respiratória (levofloxacino/moxifloxacino) empiricamente no Brasil a um paciente com tosse arrastada e emagrecimento?",alts:["Porque não cobre pneumococo","Porque tem ação contra o bacilo da tuberculose: melhora parcialmente, MASCARA o diagnóstico de TB e seleciona resistência","Porque não existe no SUS","Porque só pode ser usada por via venosa"],correta:1,coment:"As quinolonas respiratórias têm atividade antimicobacteriana. Num paciente que na verdade tem TB, elas mascaram o quadro, atrasam o diagnóstico e selecionam resistência — por isso não são a escolha empírica de rotina aqui."},
  {id:"cm_pac_q4",area:"CM",tema:"Pneumonia adquirida na comunidade",transv:[],dif:2,premium:false,enun:"Paciente internado com PAC, no 3º dia de antibiótico, afebril, sem dispneia e melhorando clinicamente. A radiografia de controle mostra consolidação um pouco maior. Conduta?",alts:["Trocar o antibiótico imediatamente por falha terapêutica","Manter o esquema: a imagem atrasa em relação à clínica e o Rx de controle precoce não é rotina","Solicitar tomografia e broncoscopia de urgência","Associar antifúngico"],correta:1,coment:"A resolução radiológica é lenta (semanas) e a imagem pode até piorar nos primeiros dias enquanto o paciente melhora. Quem define resposta é a evolução clínica; radiografia de controle precoce não é rotina."},

  {id:"cm_hiv_q1",area:"CM",tema:"HIV e ISTs na APS",transv:[],dif:2,premium:false,enun:"Homem de 28 anos recebe diagnóstico de HIV na UBS por testagem rápida. Está assintomático e ainda não colheu CD4 nem carga viral. Conduta?",alts:["Aguardar o CD4 para decidir se trata","Iniciar TARV imediatamente, independentemente do CD4 — idealmente no mesmo dia","Só tratar se CD4 < 350","Encaminhar e aguardar consulta com infectologista em 3 meses"],correta:1,coment:"A TARV está indicada para TODAS as pessoas vivendo com HIV, independentemente do CD4, com início o mais precoce possível (idealmente no mesmo dia do diagnóstico). Não se espera CD4 nem carga viral para iniciar."},
  {id:"cm_hiv_q2",area:"CM",tema:"HIV e ISTs na APS",transv:[],dif:2,premium:false,enun:"Qual o esquema antirretroviral inicial preferencial para adultos no Brasil?",alts:["AZT + 3TC + efavirenz","TDF + 3TC + dolutegravir (DTG)","Ritonavir isolado","TDF + 3TC apenas"],correta:1,coment:"O esquema preferencial é tenofovir (TDF) + lamivudina (3TC) + dolutegravir (DTG), em comprimido único diário, disponível no SUS. Em coinfecção com TB usando rifampicina, o dolutegravir passa a 12/12h."},
  {id:"cm_hiv_q3",area:"CM",tema:"HIV e ISTs na APS",transv:[],dif:2,premium:false,enun:"Gestante com VDRL 1:32 e teste treponêmico positivo, com história de alergia comprovada à penicilina. Conduta correta?",alts:["Tratar com doxiciclina","Dessensibilizar e tratar com penicilina benzatina — é a única opção que trata o feto","Tratar com azitromicina","Não tratar até o parto"],correta:1,coment:"Penicilina benzatina é a única droga que trata adequadamente o feto. Na gestante alérgica, indica-se dessensibilização. Doxiciclina é contraindicada na gestação e não trata o feto; usá-la significa gestante inadequadamente tratada e risco de sífilis congênita."},
  {id:"cm_hiv_q4",area:"CM",tema:"HIV e ISTs na APS",transv:[],dif:2,premium:false,enun:"Paciente procura a unidade 24 horas após relação sexual desprotegida com pessoa vivendo com HIV de carga viral desconhecida. Conduta?",alts:["Não há profilaxia possível após 12 horas","Indicar PEP: iniciar o quanto antes, no limite de 72 horas da exposição, mantendo por 28 dias","Iniciar PrEP contínua e reavaliar em 30 dias","Apenas testar em 3 meses"],correta:1,coment:"A PEP é indicada em até 72 horas da exposição (quanto antes, melhor — idealmente nas 2 primeiras horas) e mantida por 28 dias. Após 72h não se indica PEP. A PrEP é prevenção contínua, para uso ANTES da exposição."},
  {id:"go_pe_q1",area:"GO",tema:"Síndromes hipertensivas da gestação",transv:[],dif:2,premium:false,enun:"Gestante de 33 semanas, PA 165/112 mmHg, cefaleia persistente e escotomas, plaquetas 88.000, proteinúria negativa. Como classificar?",alts:["Hipertensão gestacional, pois não há proteinúria","Pré-eclâmpsia com sinais de gravidade — a proteinúria não é obrigatória quando há disfunção de órgão-alvo","Hipertensão crônica","Quadro sem repercussão, apenas observar"],correta:1,coment:"Após 20 semanas, PA ≥140/90 com disfunção de órgão-alvo (plaquetopenia <100.000, sintomas cerebrais/visuais) fecha pré-eclâmpsia MESMO sem proteinúria. PA ≥160/110, cefaleia e escotomas caracterizam gravidade."},
  {id:"go_pe_q2",area:"GO",tema:"Síndromes hipertensivas da gestação",transv:[],dif:2,premium:false,enun:"Gestante com pré-eclâmpsia apresenta crise convulsiva tônico-clônica. Qual a droga indicada e com que finalidade?",alts:["Sulfato de magnésio, para reduzir a pressão arterial","Sulfato de magnésio, para tratar e prevenir novas convulsões (não é anti-hipertensivo)","Hidralazina, para tratar a convulsão","Diazepam como primeira linha, substituindo o sulfato"],correta:1,coment:"Eclâmpsia trata-se com sulfato de magnésio (Pritchard ou Zuspan), que é ANTICONVULSIVANTE — não baixa a pressão. O controle pressórico é feito à parte, com hidralazina/nifedipino/labetalol. São dois eixos distintos."},
  {id:"go_pe_q3",area:"GO",tema:"Síndromes hipertensivas da gestação",transv:[],dif:2,premium:false,enun:"Durante a manutenção do sulfato de magnésio, a paciente apresenta abolição do reflexo patelar e FR de 10 irpm. Conduta imediata?",alts:["Aumentar a dose do sulfato","Suspender o sulfato e administrar gluconato de cálcio 10% EV","Administrar hidralazina","Manter a infusão e reavaliar em 1 hora"],correta:1,coment:"São sinais de intoxicação pelo magnésio. O tripé de monitorização é reflexo patelar presente, FR ≥16 irpm e diurese ≥25-30 mL/h. Diante da intoxicação: suspender o sulfato e aplicar o antídoto — gluconato de cálcio 10% EV."},

function schedule(prev,ok){
  let {ef=2.5,intervalo=0,reps=0}=prev||{};
  if(ok){reps+=1;intervalo=reps===1?1:reps===2?3:Math.round(intervalo*ef);ef=Math.max(1.3,ef+0.1);}
  else{reps=0;intervalo=1;ef=Math.max(1.3,ef-0.2);}
  return {ef,intervalo,reps,due:new Date(Date.now()+intervalo*86400000).toISOString()};
}
function Bar({pct,color}){return <div className="bar"><i style={{width:Math.max(2,pct)+"%",background:color||"var(--acc)"}}/></div>}
const sem=p=>p>=70?"var(--acc)":p>=50?"var(--warn)":"var(--bad)";
const dias=iso=>Math.floor((Date.now()-new Date(iso).getTime())/86400000);

/* =================== ROOT =================== */
function App(){
  const [session,setSession]=useState(null);
  const [booting,setBooting]=useState(true);
  useEffect(()=>{
    if(!CONFIGURADO){setBooting(false);return;}
    sb.auth.getSession().then(({data})=>{setSession(data.session);setBooting(false);});
    const {data:sub}=sb.auth.onAuthStateChange((_e,s)=>setSession(s));
    return ()=>sub.subscription.unsubscribe();
  },[]);
  if(!CONFIGURADO) return <SetupAviso/>;
  if(booting) return <div className="center"><div className="muted">Carregando...</div></div>;
  if(!session) return <Auth/>;
  return <Shell session={session}/>;
}

function SetupAviso(){
  return <div className="center"><div className="card auth">
    <h2 style={{fontSize:20,marginBottom:8}}>Falta configurar o Supabase</h2>
    <div className="muted" style={{fontSize:14,lineHeight:1.6}}>
      Abra o arquivo e cole sua <b>Project URL</b> e sua <b>anon key</b> nas constantes
      SUPABASE_URL e SUPABASE_ANON_KEY (topo do script). Você acha as duas em
      Project Settings → API no painel do Supabase. Depois rode o schema SQL que geramos.
    </div>
  </div></div>;
}

/* =================== AUTH =================== */
function Auth(){
  const [modo,setModo]=useState("entrar");
  const [nome,setNome]=useState(""),[email,setEmail]=useState(""),[senha,setSenha]=useState("");
  const [msg,setMsg]=useState(""),[busy,setBusy]=useState(false);
  const submit=async()=>{
    setBusy(true);setMsg("");
    try{
      if(modo==="criar"){
        const {error}=await sb.auth.signUp({email,password:senha,options:{data:{nome}}});
        if(error)throw error;
        setMsg("Conta criada. Se a confirmação por e-mail estiver ativa, confirme no seu e-mail e depois entre.");
        setModo("entrar");
      }else{
        const {error}=await sb.auth.signInWithPassword({email,password:senha});
        if(error)throw error;
      }
    }catch(e){setMsg(e.message||"Erro.");}
    setBusy(false);
  };
  return <div className="center"><div className="auth">
    <div className="tag" style={{color:"var(--acc)"}}>ENAMED Engine</div>
    <h1 style={{fontSize:26,margin:"6px 0 4px"}}>{modo==="criar"?"Criar conta":"Entrar"}</h1>
    <div className="muted" style={{fontSize:13,marginBottom:16}}>Seu progresso fica salvo e sincroniza entre aparelhos.</div>
    <div className="card">
      {modo==="criar" && <><label>Nome</label><input value={nome} onChange={e=>setNome(e.target.value)}/></>}
      <label>E-mail</label><input type="email" value={email} onChange={e=>setEmail(e.target.value)}/>
      <label>Senha</label><input type="password" value={senha} onChange={e=>setSenha(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()}/>
      {msg && <div className="muted" style={{fontSize:13,marginTop:12,color:"var(--acc2)"}}>{msg}</div>}
      <div style={{marginTop:16}}><button className="btn" style={{width:"100%"}} disabled={busy} onClick={submit}>{busy?"...":(modo==="criar"?"Criar conta":"Entrar")}</button></div>
    </div>
    <div style={{marginTop:14,fontSize:14}} className="muted">
      {modo==="criar"?"Já tem conta? ":"Ainda não tem conta? "}
      <span className="link" onClick={()=>{setModo(modo==="criar"?"entrar":"criar");setMsg("");}}>{modo==="criar"?"Entrar":"Criar agora"}</span>
    </div>
  </div></div>;
}

/* =================== SHELL (app autenticado) =================== */
function Shell({session}){
  const uid=session.user.id;
  const [tab,setTab]=useState("trilha");
  const [tema,setTema]=useState(()=>{try{return localStorage.getItem("enamed_tema")||"escuro"}catch(e){return "escuro"}});
  useEffect(()=>{document.documentElement.setAttribute("data-tema",tema);try{localStorage.setItem("enamed_tema",tema)}catch(e){}},[tema]);
  const [loading,setLoading]=useState(true);
  const [diag,setDiag]=useState(null); // null | "rapido" | "completo"
  const [temasFracos,setTemasFracos]=useState(()=>{try{return JSON.parse(localStorage.getItem("enamed_fracos")||"[]")}catch(e){return[]}});
  const [jaFezDiag,setJaFezDiag]=useState(()=>{try{return localStorage.getItem("enamed_diag_feito")==="1"}catch(e){return false}});
  const [questoes,setQuestoes]=useState([]);
  const [log,setLog]=useState([]);
  const [srs,setSrs]=useState({});
  const [dominio,setDominio]=useState({});
  const [assinatura,setAssinatura]=useState(null);
  const [showAssinar,setShowAssinar]=useState(false);

  const recarregarAssinatura=async()=>{
    const {data}=await sb.from("assinaturas").select("*").eq("user_id",uid).order("criado_em",{ascending:false}).limit(1);
    const a=(data&&data[0])||{plano:"free",status:"ativa"};
    setAssinatura(a);
    return a.status==="ativa"&&a.plano!=="free";
  };

  useEffect(()=>{(async()=>{
    setLoading(true);
    const [q,r,d,s,a]=await Promise.all([
      sb.from("questoes").select("*"),
      sb.from("respostas").select("*").eq("user_id",uid),
      sb.from("dominio").select("*").eq("user_id",uid),
      sb.from("srs").select("*").eq("user_id",uid),
      sb.from("assinaturas").select("*").eq("user_id",uid).order("criado_em",{ascending:false}).limit(1),
    ]);
    let qs=(q.data||[]).map(x=>({id:x.id,area:x.area,tema:x.tema,transv:x.transv||[],dif:x.dificuldade,enun:x.enunciado,alts:x.alternativas,correta:x.correta,coment:x.comentario,premium:x.premium}));
    if(qs.length===0){ qs=SEED; }
    else { // garante que as questoes-de-assunto do SEED existam (mescla sem duplicar)
      const ids=new Set(qs.map(x=>x.id));
      SEED.forEach(sq=>{ if(!ids.has(sq.id)) qs.push(sq); });
    }
    setQuestoes(qs);
    setLog((r.data||[]).map(x=>({id:x.questao_id,area:x.area,tema:x.tema,ok:x.acertou})));
    const dm={};(d.data||[]).forEach(x=>dm[x.topico_id]={nivel:x.nivel,last:x.atualizado_em});setDominio(dm);
    const sr={};(s.data||[]).forEach(x=>sr[x.questao_id]={ef:x.ef,intervalo:x.intervalo,reps:x.reps,due:x.due});setSrs(sr);
    setAssinatura((a.data&&a.data[0])||{plano:"free",status:"ativa"});
    setLoading(false);
  })()},[uid]);

  const isPro = assinatura && assinatura.status==="ativa" && assinatura.plano!=="free";

  const registrar=async(q,ok)=>{
    setLog(l=>[...l,{id:q.id,area:q.area,tema:q.tema,ok}]);
    const nova=schedule(srs[q.id],ok);
    setSrs(s=>({...s,[q.id]:nova}));
    await sb.from("respostas").insert({user_id:uid,questao_id:q.id,area:q.area,tema:q.tema,acertou:ok});
    await sb.from("srs").upsert({user_id:uid,questao_id:q.id,ef:nova.ef,intervalo:nova.intervalo,reps:nova.reps,due:nova.due});
  };
  const avaliarDominio=async(topId,nivel)=>{
    setDominio(d=>({...d,[topId]:{nivel,last:new Date().toISOString()}}));
    await sb.from("dominio").upsert({user_id:uid,topico_id:topId,nivel,atualizado_em:new Date().toISOString()});
  };

  const acertoArea=useMemo(()=>{
    const m={};AREAS.forEach(a=>m[a.k]={t:0,ok:0});
    log.forEach(l=>{if(m[l.area]){m[l.area].t++;if(l.ok)m[l.area].ok++;}});
    const o={};AREAS.forEach(a=>o[a.k]=m[a.k].t?m[a.k].ok/m[a.k].t:null);return o;
  },[log]);

  const store={questoes,log,srs,dominio};

  // ---- Limites do plano FREE (amostra grátis enxuta) ----
  const FREE_TOPICO = "cm-has";   // único assunto liberado na Trilha (alto rendimento)
  const FREE_QUESTOES = 2;        // só 2 questões no Treinar
  // pool grátis: apenas 2 questões (as marcadas como não-premium), limitado a FREE_QUESTOES
  const poolFree = questoes.filter(q=>!q.premium).slice(0, FREE_QUESTOES);
  const poolVisivel = isPro ? questoes : poolFree;
  const bloqueadasFree = questoes.length - poolFree.length;

  if(loading) return <div className="center"><div className="muted">Sincronizando seu progresso...</div></div>;

  return <div>
    <div className="row" style={{justifyContent:"space-between",alignItems:"flex-start"}}>
      <div>
        <div className="tag" style={{color:"var(--acc)"}}>ENAMED Engine</div>
        <h1 style={{fontSize:28,marginTop:6}}>Olá{session.user.user_metadata&&session.user.user_metadata.nome?", "+session.user.user_metadata.nome:""}</h1>
      </div>
      <div style={{textAlign:"right"}}>
        <span className="pill" style={{color:isPro?"var(--gold)":"var(--muted)",borderColor:isPro?"var(--gold)":"var(--line)"}}>{isPro?"PRO":"Demonstração"}</span>
        <div className="row" style={{marginTop:8,justifyContent:"flex-end",gap:12}}>
          <span className="link" style={{fontSize:13}} onClick={()=>setTema(tema==="escuro"?"claro":"escuro")}>{tema==="escuro"?"☀ Claro":"🌙 Escuro"}</span>
          <span className="link" style={{fontSize:13}} onClick={()=>sb.auth.signOut()}>Sair</span>
        </div>
      </div>
    </div>

    {!isPro && <div className="lock" style={{marginTop:16,textAlign:"left"}}>
      <b>Você está na versão de demonstração.</b> Ela mostra 1 assunto da Trilha e 2 questões — uma amostra do método.
      <div className="muted" style={{fontSize:13,marginTop:6}}>O Combo até o ENAMED libera: os {CURRICULO.length} assuntos da Trilha, {questoes.length}+ questões, simulados no formato oficial, dashboard de padrões completo e resolver questão por foto.</div>
      <div style={{marginTop:12}}><button className="btn" onClick={()=>setShowAssinar(true)}>Assinar Combo até o ENAMED</button></div>
    </div>}
    {showAssinar && <Assinar uid={uid} email={session.user.email} onClose={()=>setShowAssinar(false)} onVerificar={recarregarAssinatura}/>}

    {diag ? <div>
        <button className="btn ghost sm" onClick={()=>setDiag(null)}>← Sair do teste</button>
        <div style={{marginTop:14}}>
          <Diagnostico pool={isPro?questoes:poolVisivel} registrar={registrar} modo={diag}
            onFim={(fracos)=>{
              const ids=(fracos||[]).map(f=>f.area+"||"+f.tema);
              setTemasFracos(ids); setJaFezDiag(true);
              try{localStorage.setItem("enamed_fracos",JSON.stringify(ids));localStorage.setItem("enamed_diag_feito","1");}catch(e){}
              setDiag(null); setTab("trilha");
            }}/>
        </div>
      </div>
    : <div>
      {!jaFezDiag && <div className="card" style={{marginBottom:16,borderColor:"var(--acc)"}}>
        <b style={{fontSize:16}}>Comece pelo diagnóstico</b>
        <div className="muted" style={{fontSize:13,margin:"6px 0 12px"}}>Responda ~20 questões rápidas. Vou descobrir seus pontos fracos e priorizar sua trilha em cima deles. Você pode refazer quando quiser.</div>
        <button className="btn" onClick={()=>setDiag("rapido")}>Fazer diagnóstico rápido</button>
      </div>}

      <div className="nav">
        {[["trilha","📚 Estudar"],["praticar","✍️ Praticar"],["dash","📈 Meu progresso"]].map(([k,l])=>
          <button key={k} className={tab===k?"on":""} onClick={()=>setTab(k)}>{l}</button>)}
      </div>

      {tab==="trilha" && <Trilha store={store} acertoArea={acertoArea} avaliarDominio={avaliarDominio} registrar={registrar} irTreinar={()=>setTab("praticar")} isPro={isPro} freeTopico={FREE_TOPICO} onAssinar={()=>setShowAssinar(true)} temasFracos={temasFracos}/>}
      {tab==="praticar" && <Praticar pool={poolVisivel} store={store} registrar={registrar} bloqueadas={isPro?0:bloqueadasFree} isPro={isPro} onAssinar={()=>setShowAssinar(true)} onNovasQuestoes={novas=>setQuestoes(v=>[...v,...novas])} onDiagnostico={m=>setDiag(m)} jaFezDiag={jaFezDiag}/>}
      {tab==="dash" && (isPro ? <Dash store={store} temasFracos={temasFracos} onRefazer={()=>setDiag("rapido")}/> : <TravaFree titulo="Meu progresso é PRO" texto="Veja seu acerto por área, os temas onde mais erra e o quanto já dominou da trilha." onAssinar={()=>setShowAssinar(true)}/>)}
    </div>}
  </div>;
}

/* =================== TRILHA =================== */
function prioridade(top,store,acertoArea){
  const d=store.dominio[top.id];const nivel=d?d.nivel:null;
  const need=nivel===null?1:(5-nivel)/4;
  const rec=d?Math.min(1,dias(d.last)/14):1;
  const aa=acertoArea[top.area];const fraq=aa===null?0.5:(1-aa);
  const score=top.yield*(0.55*need+0.25*rec+0.20*fraq);
  const motivos=[];
  if(top.yield>=3)motivos.push("alto rendimento na prova");
  if(nivel===null)motivos.push("voce ainda nao estudou este tema");
  else if(nivel<=2)motivos.push("seu dominio esta baixo ("+nivel+"/5)");
  if(d&&dias(d.last)>=7)motivos.push("faz "+dias(d.last)+" dias que revisou");
  if(aa!==null&&aa<0.6)motivos.push("acerta so "+Math.round(aa*100)+"% em "+areaNome(top.area));
  return {score,nivel,motivos};
}
function Trilha({store,acertoArea,avaliarDominio,registrar,irTreinar,isPro,freeTopico,onAssinar,temasFracos}){
  const fracosSet=new Set((temasFracos||[]).map(x=>x.split("||")[1]));
  const [areaSel,setAreaSel]=useState(null); // area escolhida
  const [aberto,setAberto]=useState(null);   // assunto em estudo
  const yc=y=>y>=3?"var(--gold)":y===2?"var(--acc2)":"var(--muted)";
  const yl=y=>y>=3?"ALTO RENDIMENTO":y===2?"IMPORTANTE":"COMPLEMENTAR";
  const liberado=t=>isPro||t.id===freeTopico;
  const concluido=t=>!!store.dominio[t.id];
  // assuntos de uma area, em ordem de rendimento (o caminho)
  const caminho=k=>CURRICULO.filter(t=>t.area===k).sort((a,b)=>b.yield-a.yield);
  const abrir=t=>{ if(!liberado(t)){onAssinar();return;} setAberto(t.id); window.scrollTo(0,0); };

  /* ---------- ESTADO 3: estudando um assunto (tela cheia) ---------- */
  if(aberto){
    const t=CURRICULO.find(x=>x.id===aberto);
    if(t) return <div>
      <button className="btn ghost sm" onClick={()=>{setAberto(null);window.scrollTo(0,0);}}>← Voltar ao caminho</button>
      <div style={{marginTop:14}}>
        <div className="row" style={{gap:9,marginBottom:4}}>
          <span className="yield" style={{color:yc(t.yield),border:"1px solid "+yc(t.yield)}}>{yl(t.yield)}</span>
          <span className="pill" style={{color:"var(--acc)",borderColor:"var(--acc)"}}>{areaNome(t.area)}</span>
        </div>
        <h2 style={{fontSize:22,margin:"6px 0 16px"}}>{t.nome}</h2>
        <EstudarAssunto t={t} store={store} avaliarDominio={avaliarDominio} registrar={registrar} irTreinar={irTreinar} isPro={isPro} onAssinar={onAssinar}
          onFim={()=>{ // ao concluir, emenda no proximo pendente da area
            const lista=caminho(t.area);
            const idx=lista.findIndex(x=>x.id===t.id);
            const prox=lista.slice(idx+1).find(x=>!concluido(x));
            if(prox && liberado(prox)){ setAberto(prox.id); } else { setAberto(null); }
            window.scrollTo(0,0);
          }}/>
      </div>
    </div>;
  }

  /* ---------- ESTADO 2: caminho de uma area ---------- */
  if(areaSel){
    const lista=caminho(areaSel);
    const feitos=lista.filter(concluido).length;
    const proximo=lista.find(t=>!concluido(t) && liberado(t)) || lista.find(t=>!concluido(t));
    return <div>
      <button className="btn ghost sm" onClick={()=>setAreaSel(null)}>← Todas as áreas</button>
      <div style={{marginTop:14,marginBottom:16}}>
        <h2 style={{fontSize:22}}>{areaNome(areaSel)}</h2>
        <div className="muted" style={{fontSize:13,marginTop:4}}>{feitos} de {lista.length} assuntos concluídos</div>
        <div className="bar" style={{marginTop:8}}><i style={{width:(feitos/lista.length*100)+"%",background:"var(--acc)"}}/></div>
      </div>

      {proximo && <div className="hero" style={{marginBottom:18}}>
        <div className="tag" style={{color:"var(--acc)"}}>Continue de onde parou</div>
        <h3 style={{fontSize:19,margin:"8px 0 4px"}}>{proximo.nome}</h3>
        <div className="muted" style={{fontSize:13,marginBottom:10}}>{concluido(proximo)?"Revisão":"Próximo assunto do caminho"}</div>
        <button className="btn" onClick={()=>abrir(proximo)}>{liberado(proximo)?"Continuar ›":"🔒 Assinar para continuar"}</button>
      </div>}

      {/* o caminho vertical */}
      <div style={{position:"relative"}}>
        {lista.map((t,i)=>{

          <span className="muted" style={{fontSize:12}}>onde você mais errou</span>
        </div>
        {prioritarios.map(t=><div key={t.id} className="row" style={{justifyContent:"space-between",padding:"8px 2px",borderBottom:"1px solid var(--line)"}}>

      </div>
      {revisar.map(t=><div key={t.id} className="row" style={{justifyContent:"space-between",padding:"8px 2px",borderBottom:"1px solid var(--line)"}}>
        <span style={{fontSize:14}}>{t.nome} <span className="muted">· há {t.diasDesde}d · {store.dominio[t.id].nivel}/5</span></span>

        </div>;

    {!isPro && <div className="lock" style={{marginTop:18,textAlign:"left"}}>

}

/* =================== DASH =================== */
function Dash({store,temasFracos,onRefazer}){
  const s=useMemo(()=>{
    const byArea={};AREAS.forEach(a=>byArea[a.k]={t:0,ok:0,q:0});
    store.questoes.forEach(q=>{if(byArea[q.area])byArea[q.area].q++;});
    store.log.forEach(l=>{const b=byArea[l.area];if(b){b.t++;if(l.ok)b.ok++;}});
    const byTema={};store.log.forEach(l=>{(byTema[l.tema]=byTema[l.tema]||{t:0,ok:0,area:l.area});byTema[l.tema].t++;if(l.ok)byTema[l.tema].ok++;});
    return {byArea,byTema,tot:store.log.length,ok:store.log.filter(l=>l.ok).length};},[store]);
  const geral=s.tot?Math.round(s.ok/s.tot*100):0;
  const fracos=Object.entries(s.byTema).map(([tema,v])=>({tema,area:v.area,pct:Math.round(v.ok/v.t*100)})).sort((a,b)=>a.pct-b.pct).slice(0,6);
  return <div className="grid" style={{gridTemplateColumns:"1fr 1fr"}}>
    <div className="card" style={{gridColumn:"1 / -1"}}>
      <div className="row" style={{justifyContent:"space-between",marginBottom:12}}>
        <b style={{fontSize:15}}>Seu desempenho</b>
        {onRefazer && <button className="btn ghost sm" onClick={onRefazer}>Refazer diagnóstico</button>}
      </div>
      <div className="row" style={{gap:34}}>
      <div><div className="tag muted">Acerto geral</div><div className="kpi" style={{color:sem(geral)}}>{geral}%</div></div>
      <div><div className="tag muted">Respondidas</div><div className="kpi">{s.tot}</div></div>
      <div><div className="tag muted">No banco</div><div className="kpi">{store.questoes.length}</div></div>
      <div><div className="tag muted">Temas estudados</div><div className="kpi">{Object.keys(store.dominio).length}</div></div>
    </div></div>
    <div className="card" style={{gridColumn:"1 / -1"}}><h3 style={{fontSize:16,marginBottom:12}}>Desempenho por área</h3>
      {AREAS.map(a=>{const b=s.byArea[a.k];const p=b.t?Math.round(b.ok/b.t*100):0;
        return <div key={a.k} style={{marginBottom:14}}>
          <div className="row" style={{justifyContent:"space-between"}}><div className="row" style={{gap:8}}><span className="sem" style={{background:b.t?sem(p):"#2a4a43"}}/><b style={{fontSize:14}}>{a.nome}</b><span className="muted" style={{fontSize:12}}>· {b.q} no banco</span></div><span className="muted" style={{fontSize:13}}>{b.t?p+"% ("+b.ok+"/"+b.t+")":"sem dados"}</span></div>
          <div style={{marginTop:6}}><Bar pct={p} color={b.t?sem(p):"#2a4a43"}/></div></div>;})}</div>
    <div className="card"><h3 style={{fontSize:16,marginBottom:10}}>Onde você mais erra</h3>
      {fracos.length===0&&<div className="muted" style={{fontSize:14}}>Responda questões para o mapa aparecer.</div>}
      {fracos.map(f=><div key={f.tema} style={{marginBottom:11}}><div className="row" style={{justifyContent:"space-between"}}><span style={{fontSize:13}}>{f.tema} <span className="muted">· {areaNome(f.area)}</span></span><span style={{fontSize:13,color:sem(f.pct)}}>{f.pct}%</span></div><Bar pct={f.pct} color={sem(f.pct)}/></div>)}</div>
    <div className="card"><h3 style={{fontSize:16,marginBottom:10}}>Cobertura do blueprint</h3>
      {AREAS.map(a=>{const q=s.byArea[a.k].q;const p=Math.min(100,Math.round(q/a.meta*100));
        return <div key={a.k} style={{marginBottom:10}}><div className="row" style={{justifyContent:"space-between"}}><span style={{fontSize:13}}>{a.nome}</span><span className="muted" style={{fontSize:12}}>{q}/{a.meta}</span></div><Bar pct={p} color="var(--acc2)"/></div>;})}</div>
  </div>;
}

/* =================== TREINAR =================== */
function QuestionCard({q,onResp,indice,total}){
  const [sel,setSel]=useState(null);useEffect(()=>setSel(null),[q.id]);const L=["A","B","C","D"];
  return <div className="card">
    <div className="row" style={{justifyContent:"space-between",marginBottom:10}}>
      <div className="row" style={{gap:8}}><span className="pill" style={{color:"var(--acc)",borderColor:"var(--acc)"}}>{areaNome(q.area)}</span><span className="pill">{q.tema}</span>{(q.transv||[]).map(t=><span key={t} className="pill" style={{color:"var(--acc2)"}}>{t}</span>)}</div>
      {total>1&&<span className="muted" style={{fontSize:13}}>{indice+1}/{total}</span>}</div>
    <div style={{fontSize:15.5,lineHeight:1.6,marginBottom:6}}>{q.enun}</div>
    {q.alts.map((a,i)=>{let c="alt";if(sel!==null){if(i===q.correta)c+=" correct";else if(i===sel)c+=" wrong";else c+=" dim";}
      return <button key={i} className={c} disabled={sel!==null} onClick={()=>{setSel(i);onResp(q,i===q.correta);}}><b style={{color:"var(--muted)",marginRight:8}}>{L[i]}</b>{a}</button>;})}
    {sel!==null&&<div className="comment"><b style={{color:sel===q.correta?"var(--acc)":"var(--bad)"}}>{sel===q.correta?"Correto. ":"Incorreto. "}</b>{q.coment}</div>}
  </div>;
}
/* =================== PRATICAR (hub: treinar + simulado + foto) =================== */
function Praticar(props){
  const [modo,setModo]=useState("treinar");
  const sub=[["treinar","Questões"],["simulado","Simulado"],["resolver","Resolver por foto"]];
  return <div>
    <div className="card" style={{marginBottom:14,background:"var(--panel2)"}}>
      <div className="row" style={{justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
        <div><b style={{fontSize:14}}>Descubra seus pontos fracos</b><div className="muted" style={{fontSize:12,marginTop:2}}>Testes que reorganizam sua trilha pelos erros.</div></div>
        <div className="row" style={{gap:8}}>
          <button className="btn sm" onClick={()=>props.onDiagnostico&&props.onDiagnostico("rapido")}>Diagnóstico rápido (~20)</button>
          <button className="btn ghost sm" onClick={()=>props.isPro?(props.onDiagnostico&&props.onDiagnostico("completo")):props.onAssinar()}>{props.isPro?"Simulado 100 questões":"🔒 Simulado 100"}</button>
        </div>
      </div>
    </div>
    <div className="row" style={{gap:6,marginBottom:16}}>

    </div>

    {modo==="resolver" && <Resolver isPro={props.isPro} onAssinar={props.onAssinar}/>}
  </div>;
}

function Treinar({pool,store,registrar,bloqueadas,isPro,onAssinar,onNovasQuestoes}){
  const [area,setArea]=useState("todas");
  const [extra,setExtra]=useState([]);   // questoes geradas na sessao
  const [gerando,setGerando]=useState(false);
  const [msg,setMsg]=useState("");
  const base = area==="todas"?pool:pool.filter(q=>q.area===area);
  const fila=useMemo(()=>{
    const todas=[...base,...extra.filter(q=>area==="todas"||q.area===area)];
    const now=Date.now();
    const due=todas.filter(q=>!store.srs[q.id]||new Date(store.srs[q.id].due).getTime()<=now);
    return (due.length?due:todas).slice().sort(()=>Math.random()-0.5);
  },[base,extra,area]);
  const [i,setI]=useState(0);const [feito,setFeito]=useState(false);
  useEffect(()=>{setI(0);setFeito(false);},[area]);
  const q=fila[i];
  const workerOk=!WORKER_URL.startsWith("COLE_");

  const mais=async()=>{
    if(!isPro){onAssinar();return;}
    if(!workerOk){setMsg("O gerador entra no ar quando o app for publicado com o Worker.");return;}
    setGerando(true);setMsg("");
    const alvoArea = area==="todas"?["CM","CIR","GO","PED","MFC"][Math.floor(Math.random()*5)]:area;
    try{
      const novas=[];
      for(let k=0;k<10;k++){
        const r=await fetch(WORKER_URL+"/gerar-questao",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({area:alvoArea})});
        const d=await r.json();
        if(d.questao){
          const Q=d.questao;
          novas.push({id:"ai"+Date.now()+"_"+k,area:Q.area||alvoArea,tema:Q.tema||"Gerada por IA",transv:Q.transv||[],dif:2,enun:Q.enunciado,alts:Q.alternativas,correta:Q.correta,coment:Q.comentario||"",premium:true});
        }
      }
      if(novas.length===0) throw new Error("Não consegui gerar agora. Tente de novo.");
      setExtra(e=>[...e,...novas]);
      if(onNovasQuestoes) onNovasQuestoes(novas); // opcional: persistir no banco
      setMsg("+"+novas.length+" questões novas na fila!");
    }catch(e){setMsg(e.message);}
    setGerando(false);
  };

  if(!q)return <div className="card">
    <div className="muted" style={{marginBottom:12}}>Nenhuma questão nesta área ainda.</div>
    <button className="btn" disabled={gerando} onClick={mais}>{gerando?"Gerando...":"Gerar 10 questões com IA"}</button>
    {msg&&<div className="muted" style={{fontSize:13,marginTop:10,color:"var(--acc2)"}}>{msg}</div>}
  </div>;

  const ultimaFree = !isPro && i>=fila.length-1;
  return <div>
    <div className="row" style={{justifyContent:"space-between",marginBottom:12}}>
      <select value={area} onChange={e=>setArea(e.target.value)} style={{maxWidth:210}}>
        <option value="todas">Todas as áreas</option>
        {AREAS.map(a=><option key={a.k} value={a.k}>{a.nome}</option>)}
      </select>
      <span className="muted" style={{fontSize:13}}>{i+1} de {fila.length}</span>
    </div>
    <div className="bar" style={{marginBottom:14}}><i style={{width:((i+1)/fila.length*100)+"%",background:"var(--acc)"}}/></div>

    <QuestionCard q={q} indice={i} total={fila.length} onResp={(qq,ok)=>{registrar(qq,ok);setFeito(true);}}/>

    <div className="row" style={{marginTop:14}}>
      {ultimaFree && feito
        ? <button className="btn" onClick={onAssinar}>Liberar todas as questões (PRO)</button>
        : i<fila.length-1
          ? <button className="btn" disabled={!feito} onClick={()=>{setFeito(false);setI(x=>x+1);}}>Próxima</button>
          : <button className="btn" disabled={!feito||gerando} onClick={mais}>{gerando?"Gerando mais 10...":"✨ Mais questões deste tema"}</button>}
    </div>
    {msg&&<div className="muted" style={{fontSize:13,marginTop:10,color:"var(--acc2)"}}>{msg}</div>}

    {!isPro && feito && ultimaFree && <div className="lock" style={{marginTop:14,textAlign:"left"}}>
      <b>Você terminou a demonstração.</b>
      <div className="muted" style={{fontSize:13,marginTop:6}}>Assine o Combo até o ENAMED para treinar questões ilimitadas — inclusive geradas na hora pela IA.</div>
    </div>}
  </div>;
}

/* =================== DIAGNÓSTICO (teste inicial + simuladão) =================== */
function Diagnostico({pool,registrar,onFim,modo}){
  // modo: "rapido" (~20) ou "completo" (100)
  const alvo = modo==="completo" ? 100 : 20;
  const prova=useMemo(()=>{
    // distribuir por area de forma equilibrada
    const porArea={};
    pool.forEach(q=>{(porArea[q.area]=porArea[q.area]||[]).push(q);});
    const areas=Object.keys(porArea);
    const porCada=Math.max(1,Math.ceil(alvo/Math.max(1,areas.length)));
    let sel=[];
    areas.forEach(a=>{ sel=sel.concat(porArea[a].slice().sort(()=>Math.random()-0.5).slice(0,porCada)); });
    return sel.sort(()=>Math.random()-0.5).slice(0,Math.min(alvo,sel.length));
  },[modo]);
  const [i,setI]=useState(0);
  const [resp,setResp]=useState({}); // qid -> {ok, area, tema}
  const [sel,setSel]=useState(null);
  const [fim,setFim]=useState(false);
  const q=prova[i];

  if(prova.length===0) return <div className="card">Ainda não há questões suficientes no banco para o diagnóstico. Gere questões na aba Praticar.</div>;

  if(fim){
    // montar mapa de desempenho por área e por tema
    const porArea={}, porTema={};
    Object.values(resp).forEach(r=>{
      const a=porArea[r.area]=porArea[r.area]||{c:0,t:0}; a.t++; if(r.ok)a.c++;
      const k=r.area+"||"+r.tema; const tt=porTema[k]=porTema[k]||{c:0,t:0,area:r.area,tema:r.tema}; tt.t++; if(r.ok)tt.c++;
    });
    const areasOrd=Object.entries(porArea).map(([a,v])=>({a,pct:Math.round(v.c/v.t*100),...v})).sort((x,y)=>x.pct-y.pct);
    const fracos=Object.values(porTema).filter(t=>t.c/t.t<0.6).sort((x,y)=>(x.c/x.t)-(y.c/y.t)).slice(0,6);
    const acertos=Object.values(resp).filter(r=>r.ok).length;
    const nota=Math.round(acertos/prova.length*100);
    return <div>
      <div className="hero" style={{marginBottom:16}}>
        <div className="tag" style={{color:"var(--acc)"}}>Seu diagnóstico</div>
        <h2 style={{fontSize:26,margin:"6px 0"}}>{acertos}/{prova.length} <span style={{fontSize:16,color:"var(--muted)"}}>({nota}%)</span></h2>
        <div style={{fontSize:14,lineHeight:1.5}}>Montei seu mapa de forças e fraquezas. A trilha vai priorizar o que você mais errou.</div>
      </div>
      <h3 style={{fontSize:15,marginBottom:8}}>Desempenho por área</h3>
      {areasOrd.map(a=><div key={a.a} style={{marginBottom:10}}>
        <div className="row" style={{justifyContent:"space-between",marginBottom:3}}>
          <span style={{fontSize:14}}>{areaNome(a.a)}</span><span className="muted" style={{fontSize:13}}>{a.c}/{a.t} ({a.pct}%)</span>
        </div>
        <div className="bar"><i style={{width:a.pct+"%",background:a.pct<50?"var(--bad)":a.pct<70?"var(--warn)":"var(--acc)"}}/></div>
      </div>)}
      {fracos.length>0 && <div className="card" style={{marginTop:16,borderColor:"var(--warn)"}}>
        <b style={{fontSize:15}}>🎯 Focar primeiro nestes temas</b>
        <div style={{marginTop:8}}>{fracos.map((t,i)=><div key={i} className="row" style={{justifyContent:"space-between",padding:"7px 2px",borderBottom:"1px solid var(--line)"}}>
          <span style={{fontSize:14}}>{t.tema} <span className="muted">· {areaNome(t.area)}</span></span>
          <span className="muted" style={{fontSize:12}}>{t.c}/{t.t}</span>
        </div>)}</div>
      </div>}
      <div className="row" style={{marginTop:18}}><button className="btn" onClick={()=>onFim(fracos)}>Ir para minha trilha priorizada →</button></div>
    </div>;
  }

  return <div>
    <div className="row" style={{justifyContent:"space-between",marginBottom:10}}>
      <b style={{fontSize:15}}>{modo==="completo"?"Simulado completo":"Diagnóstico rápido"}</b>
      <span className="muted" style={{fontSize:13}}>{i+1} de {prova.length}</span>
    </div>
    <div className="bar" style={{marginBottom:14}}><i style={{width:((i+1)/prova.length*100)+"%",background:"var(--acc)"}}/></div>
    <QuestionCard q={q} indice={i} total={prova.length} onResp={(qq,ok)=>{
      setResp(r=>({...r,[qq.id]:{ok,area:qq.area,tema:qq.tema}}));
      registrar&&registrar(qq,ok); setSel(ok);
    }}/>
    <div className="row" style={{justifyContent:"space-between",marginTop:14}}>
      <span className="muted" style={{fontSize:12}}>{modo==="completo"?"Sem pressa: responda como numa prova.":"Responda no seu chute honesto — é só um mapa."}</span>
      <button className="btn sm" disabled={sel===null} onClick={()=>{
        setSel(null);
        if(i<prova.length-1) setI(i+1); else setFim(true);
      }}>{i<prova.length-1?"Próxima":"Ver resultado"}</button>
    </div>
  </div>;
}

/* =================== SIMULADO =================== */
function Simulado({pool,registrar,isPro}){
  const [run,setRun]=useState(false);const [prova,setProva]=useState([]);const [resp,setResp]=useState({});const [fim,setFim]=useState(false);
  const alvo=isPro?4:2; // por área; PRO monta simulado maior
  const montar=()=>{let sel=[];AREAS.forEach(a=>{const p=pool.filter(q=>q.area===a.k).sort(()=>Math.random()-0.5);sel=sel.concat(p.slice(0,alvo));});setProva(sel.sort(()=>Math.random()-0.5));setResp({});setFim(false);setRun(true);};
  const finalizar=()=>{prova.forEach(q=>{if(resp[q.id]!==undefined)registrar(q,resp[q.id]===q.correta);});setFim(true);};
  if(!run)return <div className="card"><h3 style={{fontSize:17,marginBottom:8}}>Simulado no formato oficial</h3>
    <div className="muted" style={{fontSize:14,marginBottom:14,lineHeight:1.6}}>Respeita a proporção de 20/área (escalada ao banco). {isPro?"":"No plano free o simulado é reduzido — o completo é PRO."}</div>
    <button className="btn" onClick={montar}>Gerar simulado</button></div>;
  const L=["A","B","C","D"];const ac=prova.filter(q=>resp[q.id]===q.correta).length;
  return <div>{!fim&&<div className="muted" style={{fontSize:13,marginBottom:12}}>{prova.length} questões · responda e finalize.</div>}
    {prova.map((q,idx)=><div key={q.id} className="card" style={{marginBottom:14}}>
      <div className="row" style={{gap:8,marginBottom:8}}><span className="muted" style={{fontSize:13}}>{idx+1}.</span><span className="pill" style={{color:"var(--acc)",borderColor:"var(--acc)"}}>{areaNome(q.area)}</span></div>
      <div style={{fontSize:15,lineHeight:1.55,marginBottom:4}}>{q.enun}</div>
      {q.alts.map((a,i)=>{let c="alt";if(fim){if(i===q.correta)c+=" correct";else if(resp[q.id]===i)c+=" wrong";else c+=" dim";}else if(resp[q.id]===i)c+=" correct";
        return <button key={i} className={c} disabled={fim} onClick={()=>setResp(r=>({...r,[q.id]:i}))}><b style={{color:"var(--muted)",marginRight:8}}>{L[i]}</b>{a}</button>;})}
      {fim&&<div className="comment">{q.coment}</div>}</div>)}
    {!fim?<button className="btn" onClick={finalizar}>Finalizar e corrigir</button>
      :<div className="card"><div className="row" style={{gap:30}}>
        <div><div className="tag muted">Nota</div><div className="kpi" style={{color:sem(Math.round(ac/prova.length*100))}}>{ac}/{prova.length}</div></div>
        <div><div className="tag muted">Percentual</div><div className="kpi">{Math.round(ac/prova.length*100)}%</div></div>
        <button className="btn ghost" onClick={()=>setRun(false)}>Novo</button></div></div>}
  </div>;
}

/* =================== BANCO =================== */
function Banco({questoes,uid,onAdd}){
  const porArea={};
  AREAS.forEach(a=>porArea[a.k]={tot:0,temas:new Set()});
  questoes.forEach(q=>{ if(porArea[q.area]){porArea[q.area].tot++; porArea[q.area].temas.add(q.tema);} });
  return <div>
    <div className="card" style={{marginBottom:16}}>
      <h3 style={{fontSize:17,marginBottom:4}}>Banco de questões</h3>
      <div className="muted" style={{fontSize:13}}>Você tem <b>{questoes.length}</b> questões no acervo. Precisa de mais? Gere questões inéditas no estilo INEP na aba <b>Gerar questão</b> — elas entram aqui automaticamente.</div>
    </div>
    <div className="grid" style={{gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",gap:12}}>
      {AREAS.map(a=><div key={a.k} className="card">
        <div className="row" style={{justifyContent:"space-between"}}>
          <span className="pill" style={{color:"var(--acc)",borderColor:"var(--acc)"}}>{a.k}</span>
          <span className="kpi" style={{fontSize:26}}>{porArea[a.k].tot}</span>
