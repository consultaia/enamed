<script>
  // Registro do service worker com atualização AUTOMÁTICA.
  // Sempre que você publicar uma versão nova, o app se atualiza sozinho
  // para todos os usuários — sem precisar limpar cache.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").then(function (reg) {
        // Verifica se há versão nova periodicamente e ao focar a aba.
        function checkUpdate(){ reg.update().catch(function(){}); }
        setInterval(checkUpdate, 60 * 1000);            // a cada 1 min
        window.addEventListener("focus", checkUpdate);   // ao voltar pra aba

        // Quando um SW novo assume o controle, recarrega a página uma vez.
        var recarregou = false;
        navigator.serviceWorker.addEventListener("controllerchange", function () {
          if (recarregou) return;
          recarregou = true;
          window.location.reload();
        });

        // Se um SW novo ficar "esperando", manda ele assumir imediatamente.
        reg.addEventListener("updatefound", function () {
          var novo = reg.installing;
          if (!novo) return;
          novo.addEventListener("statechange", function () {
            if (novo.state === "installed" && navigator.serviceWorker.controller) {
              novo.postMessage("skipWaiting");
            }
          });
        });
      }).catch(function(){});
    });
  }
</script>

  { id:"cm-ic-7", assunto:"cm-ic", frente:"Os 4 pilares que reduzem mortalidade na ICFEr?", verso:"'A-B-E-S': A (IECA/BRA ou sacubitril-valsartana/INRA), B (Betabloqueador), E (Espironolactona), S (inibidor SGLT2). Os quatro juntos salvam vida." },
  { id:"cm-ic-8", assunto:"cm-ic", frente:"Qual dos pilares é o mais novo e virou obrigatório?", verso:"O inibidor de SGLT2 (a 'gliflozina') — antes só diabético, hoje pilar da ICFEr mesmo sem diabetes." },
  { id:"cm-ic-9", assunto:"cm-ic", frente:"Em qual IC os 4 pilares foram provados?", verso:"Na ICFEr (fração reduzida). Gancho: 'só quem bombeia mal ganha os 4 remédios que salvam'." },
  { id:"cm-ic-10", assunto:"cm-ic", frente:"Critérios que ainda caem em prova para IC?", verso:"Framingham (sinais maiores e menores). Somados à clínica + BNP + eco." },
  { id:"cm-avc-1", assunto:"cm-avc", frente:"Mantra do AVC?", verso:"'Tempo é cérebro' — cada minuto sem fluxo mata milhões de neurônios. Reconhecer rápido é tudo." },
  { id:"cm-avc-2", assunto:"cm-avc", frente:"Como reconhecer AVC rapidinho?", verso:"SAMU/FAST: Sorriso (face caída), Abraço (fraqueza no braço), Mensagem (fala alterada), Urgência de ligar. Tudo SÚBITO." },

  { id:"cm-avc-7", assunto:"cm-avc", frente:"Contraindicações à trombólise?", verso:"Hemorragia, cirurgia recente, PA não controlada >185/110. Fora da janela ou com essas, não trombolisa." },

  { id:"cm-asma-dpoc-2", assunto:"cm-asma-dpoc", frente:"Quando a asma tipicamente piora?", verso:"À noite/madrugada, e melhora com broncodilatador. Caráter variável + história de atopia (rinite, eczema)." },
  { id:"cm-asma-dpoc-3", assunto:"cm-asma-dpoc", frente:"Qual o PILAR do tratamento de controle da asma?", verso:"Corticoide inalatório (CI) — trata a inflamação. 'Sem corticoide, a asma não se controla.'" },
  { id:"cm-asma-dpoc-4", assunto:"cm-asma-dpoc", frente:"O erro clássico que a banca cobra na asma?", verso:"Tratar só com broncodilatador de resgate (salbutamol) sem corticoide: alivia na hora, mas não controla e aumenta risco de crise grave." },
  { id:"cm-asma-dpoc-5", assunto:"cm-asma-dpoc", frente:"O que a GINA recomenda até nos quadros leves?", verso:"Corticoide inalatório (muitas vezes com formoterol) — mesmo na asma leve. Broncodilatador de longa NUNCA sozinho na asma." },
  { id:"cm-asma-dpoc-6", assunto:"cm-asma-dpoc", frente:"Tratamento da crise de asma?", verso:"'O-B-C': Oxigênio se hipoxemia, Broncodilatador de curta repetido (salbutamol), Corticoide SISTÊMICO precoce. Grave: sulfato de magnésio." },
  { id:"cm-asma-dpoc-7", assunto:"cm-asma-dpoc", frente:"Por que corticoide sistêmico precoce na crise?", verso:"Reduz a inflamação da crise E previne recaída. Quanto mais cedo, melhor." },
  { id:"cm-asma-dpoc-8", assunto:"cm-asma-dpoc", frente:"Sinais de gravidade na crise de asma?", verso:"Fala entrecortada, uso de musculatura acessória, saturação baixa, sonolência. 'Quem não fala frase inteira está grave.'" },
  { id:"cm-asma-dpoc-9", assunto:"cm-asma-dpoc", frente:"Causa quase sempre da DPOC?", verso:"Tabagismo, com longa carga tabágica, em adultos mais velhos. A obstrução é progressiva e pouco reversível." },
  { id:"cm-asma-dpoc-10", assunto:"cm-asma-dpoc", frente:"Broncodilatador de longa ação na asma pode ir sozinho?", verso:"Nunca. Sempre associado ao corticoide inalatório. 'Na asma, longa ação anda de mãos dadas com o corticoide.'" },
{ id:"cm-sepse-1", assunto:"cm-sepse", frente:"O que torna uma infecção uma SEPSE?", verso:"Quando o próprio corpo perde o controle e a infecção passa a causar DISFUNÇÃO DE ÓRGÃOS. 'Não é o micróbio, é a tempestade do imune que derruba os órgãos.'" },
  { id:"cm-sepse-2", assunto:"cm-sepse", frente:"Por que na sepse os órgãos falham mesmo com o coração batendo?", verso:"Os mediadores dilatam vasos e deixam capilares 'vazando' — a perfusão cai. 'O cano fura, o sangue não chega no destino.'" },
  { id:"cm-sepse-3", assunto:"cm-sepse", frente:"Os 3 sinais do qSOFA à beira do leito?", verso:"'22-100-confuso': FR ≥22, PAS ≤100, alteração mental. Dois ou mais = alerta de sepse." },
  { id:"cm-sepse-4", assunto:"cm-sepse", frente:"Sepse x choque séptico — o que separa?", verso:"Sepse = infecção COM disfunção. Choque = mesmo após volume, PERSISTE hipotensão (precisa vasopressor p/ PAM≥65) + lactato ≥2. 'Choque é a sepse que não levanta nem com soro.'" },
  { id:"cm-sepse-5", assunto:"cm-sepse", frente:"Vasopressor de escolha no choque séptico?", verso:"Noradrenalina. Primeira linha, sempre." },
  { id:"cm-sepse-6", assunto:"cm-sepse", frente:"O 'pacote da 1ª hora' da sepse, na ordem?", verso:"'La-He-A-Cris': Lactato, Hemoculturas ANTES do ATB, Antibiótico amplo precoce, Cristaloide 30 mL/kg. Depois reavalia." },
  { id:"cm-sepse-7", assunto:"cm-sepse", frente:"Por que colher hemocultura ANTES do antibiótico?", verso:"Para pegar o germe 'antes de o remédio bagunçar a cena do crime'. Depois do ATB, a cultura pode não crescer." },
  { id:"cm-sepse-8", assunto:"cm-sepse", frente:"Quanto cristaloide na hipotensão/lactato alto?", verso:"No mínimo 30 mL/kg. 'Encher o tanque furado enquanto se trata a fonte.'" },
  { id:"cm-sepse-9", assunto:"cm-sepse", frente:"Por que cada hora sem antibiótico importa?", verso:"Cada hora de atraso AUMENTA a mortalidade. Por isso o ATB de amplo espectro entra na 1ª hora, EV." },
  { id:"cm-sepse-10", assunto:"cm-sepse", frente:"Para que serve o lactato na sepse?", verso:"Marca a gravidade da hipoperfusão — quanto mais alto, pior a oxigenação dos tecidos. Serve de alarme e de acompanhamento." },
  { id:"cm-dengue-1", assunto:"cm-dengue", frente:"Por que a SEGUNDA dengue é mais perigosa?", verso:"Facilitação dependente de anticorpos: imunidade contra um sorotipo, mas a 2ª infecção por OUTRO tem risco maior de gravidade. 'A 2ª visita da dengue vem armada.'" },
  { id:"cm-dengue-2", assunto:"cm-dengue", frente:"Existe antiviral para dengue?", verso:"Não. Tratamento é hidratação e vigilância. 'Quem morre de dengue morre de CHOQUE — e choque se previne com água e olho clínico.'" },
  { id:"cm-dengue-3", assunto:"cm-dengue", frente:"As 3 fases da dengue?", verso:"Febril (dias 1–3), CRÍTICA (dias 3–7, na queda da febre), Recuperação. A linha do tempo é o que separa quem acerta de quem chuta." },
  { id:"cm-dengue-4", assunto:"cm-dengue", frente:"A armadilha mais cobrada da dengue?", verso:"Quando 'a febre passou e ele melhorou' — é EXATAMENTE a fase crítica, o momento de MAIOR atenção. A defervescência é a hora do perigo." },
  { id:"cm-dengue-5", assunto:"cm-dengue", frente:"O que de fato adoece na dengue grave?", verso:"O EXTRAVASAMENTO PLASMÁTICO: capilares vazam plasma pro terceiro espaço (abdome, pleura). O volume no vaso cai → choque. Não é o sangramento." },
  { id:"cm-dengue-6", assunto:"cm-dengue", frente:"Até quando reavaliar o paciente com dengue?", verso:"Diariamente, até 48h APÓS ficar sem febre. 'Sem febre não é alta — é vigilância redobrada.'" },
  { id:"cm-dengue-7", assunto:"cm-dengue", frente:"Qual mosquito e quantos sorotipos?", verso:"Aedes aegypti; 4 sorotipos (DENV 1–4). Cada infecção imuniza só contra aquele sorotipo." },
  { id:"cm-dengue-8", assunto:"cm-dengue", frente:"Sinais de alarme pedem o quê?", verso:"Reavaliação e hidratação vigorosa — são o aviso de que a fase crítica pode virar choque. Dor abdominal intensa, vômitos, sangramento, letargia." },
  { id:"cm-dengue-9", assunto:"cm-dengue", frente:"Por que país com todos os sorotipos tem mais casos graves?", verso:"Porque muita gente já teve uma dengue, e a próxima (outro sorotipo) tende a ser mais grave. Cada epidemia 'colhe' os que já se infectaram antes." },
  { id:"cm-dengue-10", assunto:"cm-dengue", frente:"Como se previne a morte por dengue?", verso:"Hidratação + reavaliação clínica frequente. Não há remédio que mate o vírus; o que salva é evitar o choque." },
  { id:"cm-tuberculose-1", assunto:"cm-tuberculose", frente:"Quadro clássico da TB pulmonar?", verso:"'Tosse+3S por semanas': tosse arrastada, Sudorese noturna, febre vesperTina, emagrecimento. Quadro que se arrasta." },
  { id:"cm-tuberculose-2", assunto:"cm-tuberculose", frente:"O que é 'sintomático respiratório' na APS?", verso:"Quem tosse há 3 semanas ou mais — a porta de entrada para investigar TB. Em HIV/contatos/vulneráveis, QUALQUER tosse já investiga." },
  { id:"cm-tuberculose-3", assunto:"cm-tuberculose", frente:"Exame INICIAL de escolha para TB hoje?", verso:"Teste Rápido Molecular (TRM-TB/Xpert): em ~2h detecta o DNA do bacilo E já diz se há resistência à rifampicina. Substituiu a baciloscopia como 1º exame." },
  { id:"cm-tuberculose-4", assunto:"cm-tuberculose", frente:"Para que ainda serve a baciloscopia?", verso:"Onde não há TRM, e principalmente para o CONTROLE MENSAL do tratamento. 'A molecular diagnostica; a baciloscopia acompanha.'" },
  { id:"cm-tuberculose-5", assunto:"cm-tuberculose", frente:"Achado clássico da TB na radiografia?", verso:"Cavitação em ápice pulmonar. A radiografia complementa o diagnóstico." },
  { id:"cm-tuberculose-6", assunto:"cm-tuberculose", frente:"A regra que 'não se negocia' na TB?", verso:"TODO paciente com TB deve ser TESTADO PARA HIV. Sem exceção." },
  { id:"cm-tuberculose-7", assunto:"cm-tuberculose", frente:"O esquema de tratamento da TB sensível?", verso:"RIPE: Rifampicina, Isoniazida, Pirazinamida, Etambutol. O 'famoso RIPE'." },
  { id:"cm-tuberculose-8", assunto:"cm-tuberculose", frente:"Quando pedir cultura com teste de sensibilidade?", verso:"Retratamento, suspeita de resistência, HIV, vulneráveis e casos paucibacilares. 'Situações especiais pedem a cultura completa.'" },
  { id:"cm-tuberculose-9", assunto:"cm-tuberculose", frente:"Como a TB se transmite e qual seu 'endereço social'?", verso:"Por aerossol (tosse do bacilífero). Concentra-se em privados de liberdade, situação de rua, HIV e vulneráveis." },
  { id:"cm-tuberculose-10", assunto:"cm-tuberculose", frente:"De quem é a busca ativa do sintomático respiratório?", verso:"Da equipe de saúde da família — atribuição da APS procurar ativamente o tossidor crônico." },
{ id:"cm-pac-1", assunto:"cm-pac", frente:"Agente nº1 da pneumonia comunitária?", verso:"Streptococcus pneumoniae (pneumococo), disparado. Atípicos (Mycoplasma, Chlamydophila, Legionella) e vírus completam." },
  { id:"cm-pac-2", assunto:"cm-pac", frente:"Apresentação típica da PAC?", verso:"Febre, tosse produtiva, dor pleurítica (piora ao respirar), dispneia. No exame: crepitações, sopro tubário, egofonia." },
  { id:"cm-pac-3", assunto:"cm-pac", frente:"A armadilha geriátrica da pneumonia?", verso:"O IDOSO pode chegar SEM febre — só confuso, caindo mais, ou com comorbidade descompensada. 'No idoso, não exija febre pra pensar em pneumonia.'" },
  { id:"cm-pac-4", assunto:"cm-pac", frente:"Como se diagnostica PAC?", verso:"Clínica + radiografia com consolidação. Na APS sem raio-x, o quadro clínico já autoriza tratar — não se adia ATB esperando imagem." },
  { id:"cm-pac-5", assunto:"cm-pac", frente:"Por que NÃO pedir raio-x de controle precoce?", verso:"A imagem demora SEMANAS pra limpar e pode 'piorar' nos primeiros dias enquanto o paciente melhora. 'Quem manda é a clínica, não o filme.'" },
  { id:"cm-pac-6", assunto:"cm-pac", frente:"Para que serve o CURB-65?", verso:"Decide ONDE tratar (casa x internação) — a decisão mais importante da PAC, mais que o antibiótico." },
  { id:"cm-pac-7", assunto:"cm-pac", frente:"Os itens do CURB-65?", verso:"Confusão; Ureia >50; FR ≥30 (Respiratória); Blood pressure baixa (PAS<90 ou PAD≤60); idade ≥65. 1 ponto cada." },
  { id:"cm-pac-8", assunto:"cm-pac", frente:"CURB-65 de 0 a 1: onde tratar?", verso:"Baixo risco — tratamento ambulatorial (em casa). Pontuações maiores puxam para internação/UTI." },
  { id:"cm-pac-9", assunto:"cm-pac", frente:"Egofonia, sopro tubário e crepitações indicam o quê?", verso:"Consolidação pulmonar — achados clássicos de pneumonia numa região do pulmão." },
  { id:"cm-pac-10", assunto:"cm-pac", frente:"Na APS sem raio-x na hora, o que fazer?", verso:"Tratar pela clínica compatível — não postergar o antibiótico esperando a imagem. 'A pneumonia não espera o filme.'" },
  { id:"cm-hiv-ist-1", assunto:"cm-hiv-ist", frente:"Quando iniciar TARV no HIV hoje?", verso:"Para TODOS, independentemente do CD4, o mais cedo possível — idealmente no MESMO DIA do diagnóstico. 'Não espera CD4 nem carga viral pra começar.'" },
  { id:"cm-hiv-ist-2", assunto:"cm-hiv-ist", frente:"O que significa I=I?", verso:"Indetectável = Intransmissível. Carga viral indetectável NÃO transmite HIV por via sexual. Conceito central da prevenção." },
  { id:"cm-hiv-ist-3", assunto:"cm-hiv-ist", frente:"Esquema preferencial inicial no Brasil?", verso:"TDF + 3TC + DTG (tenofovir + lamivudina + dolutegravir), comprimido único diário, grátis no SUS. DTG tem alta barreira genética." },
  { id:"cm-hiv-ist-4", assunto:"cm-hiv-ist", frente:"A pegadinha do dolutegravir com tuberculose?", verso:"Rifampicina acelera o metabolismo do DTG → dose DOBRADA (12/12h) na coinfecção TB. 'Rifampicina come o dolutegravir, então dobra.'" },
  { id:"cm-hiv-ist-5", assunto:"cm-hiv-ist", frente:"Qual marcador acompanha a EFICÁCIA do tratamento?", verso:"Carga viral. O CD4 informa risco imunológico e profilaxias, mas não é mais o gatilho para tratar." },
  { id:"cm-hiv-ist-6", assunto:"cm-hiv-ist", frente:"Como se faz o diagnóstico de HIV na APS?", verso:"Testes rápidos — dois testes conforme o fluxograma do Ministério. Diagnóstico e início do tratamento acontecem na atenção primária." },
  { id:"cm-hiv-ist-7", assunto:"cm-hiv-ist", frente:"Por que iniciar TARV precoce?", verso:"Menor mortalidade, menos adoecimento e menos transmissão. 'Quanto antes trata, melhor em tudo.'" },
  { id:"cm-hiv-ist-8", assunto:"cm-hiv-ist", frente:"O CD4 ainda serve pra quê?", verso:"Avaliar risco imunológico e necessidade de profilaxias de infecções oportunistas — não para decidir SE trata (todos tratam)." },
  { id:"cm-hiv-ist-9", assunto:"cm-hiv-ist", frente:"Vantagens do dolutegravir?", verso:"Alta barreira genética (dificulta resistência) e boa tolerabilidade. Por isso está no esquema preferencial." },
  { id:"cm-hiv-ist-10", assunto:"cm-hiv-ist", frente:"Como é a prevenção do HIV hoje?", verso:"COMBINADA: preservativo, testagem regular, tratamento como prevenção (I=I), além de PrEP e PEP. Várias camadas juntas." },
  { id:"cm-tireoide-1", assunto:"cm-tireoide", frente:"O eixo da tireoide em uma frase?", verso:"Feedback negativo: TRH→TSH→T4/T3, que avisam a hipófise pra parar. 'T4 sobe, hipófise cala; T4 cai, hipófise grita.'" },
  { id:"cm-tireoide-2", assunto:"cm-tireoide", frente:"Por que o TSH é o exame de rastreio?", verso:"É o mais sensível — se move PRIMEIRO, antes de o T4 sair da faixa. 'O TSH grita antes de tudo.'" },
  { id:"cm-tireoide-3", assunto:"cm-tireoide", frente:"TSH alto significa o quê (doença primária)?", verso:"A tireoide falha, o T4 cai, e a hipófise 'grita mais alto' → TSH SOBE. Hipotireoidismo primário." },
  { id:"cm-tireoide-4", assunto:"cm-tireoide", frente:"TSH baixo/suprimido significa?", verso:"A tireoide trabalha demais, o T4 sobe, a hipófise 'cala' → TSH DESCE. Hipertireoidismo." },
  { id:"cm-tireoide-5", assunto:"cm-tireoide", frente:"Causa mais comum de hipotireoidismo no Brasil?", verso:"Tireoidite de Hashimoto (autoimune, anti-TPO positivo). Onde há iodo suficiente, é a campeã." },
  { id:"cm-tireoide-6", assunto:"cm-tireoide", frente:"Sintomas do hipotireoidismo?", verso:"'Tudo LENTO e FRIO': fadiga, ganho de peso, intolerância ao frio, pele seca, constipação, bradicardia, sonolência, reflexos lentos." },
  { id:"cm-tireoide-7", assunto:"cm-tireoide", frente:"Como confirmar hipotireoidismo primário?", verso:"TSH ALTO + T4 livre BAIXO = trata. O corpo pede hormônio e a tireoide não entrega." },
  { id:"cm-tireoide-8", assunto:"cm-tireoide", frente:"O que é hipotireoidismo SUBCLÍNICO e a pegadinha?", verso:"TSH alto + T4 livre NORMAL. Pegadinha: NÃO trata todo mundo. Trata se TSH>10, sintomas, anti-TPO+, gestação/planejamento." },
  { id:"cm-tireoide-9", assunto:"cm-tireoide", frente:"Como tomar a levotiroxina?", verso:"Em JEJUM, 30–60 min antes do café, LONGE de cálcio, ferro e omeprazol (atrapalham a absorção)." },
  { id:"cm-tireoide-10", assunto:"cm-tireoide", frente:"De quanto em quanto tempo ajustar a levotiroxina?", verso:"Pelo TSH a cada 6–8 semanas — o eixo demora a equilibrar. 'Não redose em 2 semanas, o eixo é lento.'" },
{ id:"cm-anemias-1", assunto:"cm-anemias", frente:"O atalho que organiza TODA anemia?", verso:"Olhar o VCM. 'Micro pensa ferro, Normo pensa crônica/hemólise, Macro pensa vitamina.' Com o VCM na mão, o problema já está dividido em três." },
  { id:"cm-anemias-2", assunto:"cm-anemias", frente:"VCM abaixo de 80 (microcítica): pense em quê?", verso:"Ferro (ferropriva), talassemia, doença crônica. 'Célula pequena = falta matéria-prima (ferro).'" },
  { id:"cm-anemias-3", assunto:"cm-anemias", frente:"VCM acima de 100 (macrocítica): pense em quê?", verso:"B12, folato, álcool, hipotireoidismo. 'Célula grande e boba = falta vitamina.'" },
  { id:"cm-anemias-4", assunto:"cm-anemias", frente:"Qual o exame mais precoce da ferropriva e a armadilha?", verso:"Ferritina (reflete o ESTOQUE): baixa = fecha. Armadilha: é proteína de fase aguda — sobe na inflamação e MASCARA a deficiência." },
  { id:"cm-anemias-5", assunto:"cm-anemias", frente:"Padrão laboratorial da ferropriva?", verso:"Ferro baixo, TIBC/transferrina ALTA (o corpo faz mais 'caminhão' procurando ferro), saturação baixa, RDW alto." },
  { id:"cm-anemias-6", assunto:"cm-anemias", frente:"Homem adulto ou mulher pós-menopausa com ferropriva: o que é até prova em contrário?", verso:"SANGRAMENTO — obriga investigar o trato gastrointestinal, pensando em câncer colorretal. 'Ferro baixo neles = colonoscópio na mão.'" },
  { id:"cm-anemias-7", assunto:"cm-anemias", frente:"Ferropriva em mulher fértil e em criança: causas típicas?", verso:"Mulher fértil: menstruação (a maioria). Criança: dieta pobre e verminose." },
  { id:"cm-anemias-8", assunto:"cm-anemias", frente:"Como tomar o ferro oral?", verso:"Sulfato ferroso em JEJUM, com vitamina C, LONGE de leite e café. 'Vitamina C ajuda, leite e café atrapalham.'" },
  { id:"cm-anemias-9", assunto:"cm-anemias", frente:"Por quanto tempo manter o ferro após normalizar a Hb?", verso:"Mais 3 a 6 meses DEPOIS da hemoglobina normalizar — para repor o ESTOQUE, não só o sangue." },
  { id:"cm-anemias-10", assunto:"cm-anemias", frente:"Como diferenciar talassemia de ferropriva?", verso:"Talassemia: ferritina normal/alta, RDW normal, MUITOS eritrócitos para o grau de anemia. 'Ferro cheio + muitas hemácias pequenas = talassemia.'" },
  { id:"cm-drc-1", assunto:"cm-drc", frente:"O que define DRC (e a separa da lesão aguda)?", verso:"Alteração estrutural OU funcional do rim mantida por ≥3 MESES. 'Três meses é a fronteira entre agudo e crônico.'" },
  { id:"cm-drc-2", assunto:"cm-drc", frente:"As duas formas de diagnosticar DRC?", verso:"TFG <60, OU marcador de lesão (albuminúria, sedimento, imagem, biópsia) MESMO com TFG normal. 'Diabético com TFG 95 + albuminúria já tem DRC.'" },
  { id:"cm-drc-3", assunto:"cm-drc", frente:"As duas maiores causas de DRC no Brasil?", verso:"1º Diabetes, 2º Hipertensão. 'Nasce e deveria ser barrada na APS.'" },
  { id:"cm-drc-4", assunto:"cm-drc", frente:"O estadiamento KDIGO é como?", verso:"BIDIMENSIONAL: pela TFG (G1 a G5) E pela albuminúria (A1, A2, A3). O prognóstico é a combinação — o 'mapa de cores'." },
  { id:"cm-drc-5", assunto:"cm-drc", frente:"G1 e G2 (TFG ≥60) só são DRC quando?", verso:"Quando há MARCADOR de lesão. TFG de 85 isolada, sem albuminúria e sem mais nada, NÃO é doença." },
  { id:"cm-drc-6", assunto:"cm-drc", frente:"Por que a albuminúria é tão importante?", verso:"É três coisas ao mesmo tempo: marcador diagnóstico, prognóstico E alvo de tratamento. 'A albuminúria não é detalhe.'" },
  { id:"cm-drc-7", assunto:"cm-drc", frente:"Quem rastrear para DRC na APS?", verso:"Diabéticos, hipertensos, >60 anos, história familiar de doença renal, ou doença cardiovascular." },
  { id:"cm-drc-8", assunto:"cm-drc", frente:"Como rastrear DRC (a pegadinha operacional)?", verso:"Creatinina com TFG estimada + relação albumina/creatinina em amostra ISOLADA. 'NÃO precisa urina de 24h.'" },
  { id:"cm-drc-9", assunto:"cm-drc", frente:"TFG G5 significa o quê?", verso:"TFG <15 — falência renal, estágio final. G4 (15-29) já é grave e prepara terapia renal substitutiva." },
  { id:"cm-drc-10", assunto:"cm-drc", frente:"Categorias de albuminúria (A1/A2/A3)?", verso:"A1 <30 mg/g, A2 30–300, A3 >300. Quanto maior, pior o prognóstico." },
  { id:"cm-hepatites-1", assunto:"cm-hepatites", frente:"Como se organizam as hepatites virais?", verso:"Pela TRANSMISSÃO. 'A e E vão pela boca (fecal-oral); B, C e D vão pelo sangue/sexo.' Isso resolve metade das questões." },
  { id:"cm-hepatites-2", assunto:"cm-hepatites", frente:"Quais hepatites NÃO cronificam?", verso:"A (nunca cronifica) e E (habitualmente benigna, mas GRAVE na gestante). 'A e E: agudas e acabou.'" },
  { id:"cm-hepatites-3", assunto:"cm-hepatites", frente:"Qual hepatite é campeã de cronificação?", verso:"A C — 70 a 85% cronificam. 'C de Crônica.'" },
  { id:"cm-hepatites-4", assunto:"cm-hepatites", frente:"Por que vacinar contra hepatite B ao nascer?", verso:"B cronifica em ~5% dos adultos, mas em ATÉ 90% dos recém-nascidos infectados por via vertical. 'O RN é o mais vulnerável, por isso vacina já.'" },
  { id:"cm-hepatites-5", assunto:"cm-hepatites", frente:"HBsAg positivo significa?", verso:"Antígeno de superfície presente = TEM VÍRUS = infecção ativa (aguda, ou crônica se >6 meses). 'S de Sujeito infectado.'" },
  { id:"cm-hepatites-6", assunto:"cm-hepatites", frente:"Anti-HBs positivo significa?", verso:"Anticorpo de superfície = IMUNIDADE (por vacina ou cura). 'Anti-HBs = Anticorpo que Salva.'" },
  { id:"cm-hepatites-7", assunto:"cm-hepatites", frente:"Anti-HBc IgM x IgG?", verso:"IgM = infecção AGUDA/recente. IgG (total) = contato PRÉVIO com o vírus selvagem. 'M de Momento agudo.'" },
  { id:"cm-hepatites-8", assunto:"cm-hepatites", frente:"Por que o anti-HBc distingue vacinado de curado?", verso:"A vacina só tem o antígeno de superfície, NÃO produz anti-HBc. 'Quem tem anti-HBc viu o vírus de verdade, não só a vacina.'" },
  { id:"cm-hepatites-9", assunto:"cm-hepatites", frente:"Padrão do VACINADO?", verso:"Anti-HBs POSITIVO + anti-HBc NEGATIVO. 'Tem o anticorpo da superfície, mas nunca viu o vírus inteiro.'" },
  { id:"cm-hepatites-10", assunto:"cm-hepatites", frente:"HBeAg positivo indica?", verso:"Replicação intensa e alta infectividade. 'e de Espalha muito.'" },
{ id:"cm-tev-1", assunto:"cm-tev", frente:"TVP e TEP são duas doenças?", verso:"Não — são a MESMA doença (tromboembolismo venoso) em dois momentos. O trombo nasce na perna e viaja para o pulmão." },
  { id:"cm-tev-2", assunto:"cm-tev", frente:"A tríade de Virchow?", verso:"'ELH': Estase, Lesão endotelial, Hipercoagulabilidade. Todos os fatores de risco derivam desses três." },
  { id:"cm-tev-3", assunto:"cm-tev", frente:"Por que TEV é a principal morte hospitalar EVITÁVEL?", verso:"Quase todo internado tem ao menos um fator (imobilização, cirurgia, câncer). Por isso profilaxia é regra no hospital." },
  { id:"cm-tev-4", assunto:"cm-tev", frente:"Quadro da TVP e exame?", verso:"Dor + edema ASSIMÉTRICO de panturrilha, empastamento, calor local. Exame: ultrassom com doppler (compressão). Sinal de Homans é famoso mas ruim." },
  { id:"cm-tev-5", assunto:"cm-tev", frente:"Por que o TEP é 'o grande imitador'?", verso:"Dispneia SÚBITA, dor pleurítica, taquipneia, taquicardia, hipoxemia — pode abrir com síncope ou hemoptise. Imita muita coisa." },
  { id:"cm-tev-6", assunto:"cm-tev", frente:"O que o ECG mostra no TEP (e a pegadinha do S1Q3T3)?", verso:"Mais frequentemente só taquicardia sinusal. O clássico S1Q3T3 é RARO. 'Não espere o achado famoso; espere taquicardia.'" },
  { id:"cm-tev-7", assunto:"cm-tev", frente:"Gasometria no TEP?", verso:"Hipoxemia com HIPOCAPNIA (o paciente hiperventila). 'Falta oxigênio, mas o CO2 cai porque respira rápido.'" },
  { id:"cm-tev-8", assunto:"cm-tev", frente:"Raio-x normal em paciente muito dispneico e hipoxêmico: o que pensar?", verso:"Deve AUMENTAR a suspeita de TEP, não diminuir. 'Pulmão limpo + paciente sufocado = pense embolia.'" },
  { id:"cm-tev-9", assunto:"cm-tev", frente:"Como é a lógica diagnóstica do TEP?", verso:"PROBABILÍSTICA: primeiro estima a probabilidade (escore), depois decide o exame. 'Não sai pedindo angioTC pra todo mundo.'" },
  { id:"cm-tev-10", assunto:"cm-tev", frente:"Principais fatores de risco de TEV?", verso:"Imobilização, cirurgia (ortopédica de grande porte), câncer, gestação/puerpério, estrogênio, trombofilia, viagem longa, obesidade, idade, TEV prévio." },
  { id:"cm-fa-1", assunto:"cm-fa", frente:"Os dois achados de FA no ECG?", verso:"AUSÊNCIA de onda P + RR IRREGULARMENTE irregular (sem padrão). 'Sem P e sem ritmo = fibrilação.'" },
  { id:"cm-fa-2", assunto:"cm-fa", frente:"Os dois males que a FA causa?", verso:"1) Perde a contração atrial (~20% do débito) → cansaço, descompensa IC. 2) Sangue estagna no átrio → TROMBO → AVC. O 2º é o grave." },
  { id:"cm-fa-3", assunto:"cm-fa", frente:"Como é o AVC da FA?", verso:"Cardioembólico — caracteristicamente GRANDE e devastador. Prevenir isso é o objetivo central do tratamento." },
  { id:"cm-fa-4", assunto:"cm-fa", frente:"Fator associado mais comum à FA?", verso:"Hipertensão. Também: idade, valvopatia mitral, IC, hipertireoidismo, álcool, apneia do sono, sepse/pós-op." },
  { id:"cm-fa-5", assunto:"cm-fa", frente:"As 3 perguntas diante de uma FA, na ordem?", verso:"'Instável? Anticoagular? Frequência ou Ritmo?' A instabilidade tem prioridade ABSOLUTA." },
  { id:"cm-fa-6", assunto:"cm-fa", frente:"FA com instabilidade: conduta?", verso:"CARDIOVERSÃO ELÉTRICA SINCRONIZADA IMEDIATA — sem esperar exame, escore ou tempo de arritmia. 'Instável choca já.'" },
  { id:"cm-fa-7", assunto:"cm-fa", frente:"O que é 'instabilidade' na FA?", verso:"Hipotensão, angina, IC aguda, síncope ou rebaixamento. Qualquer um → cardioversão elétrica imediata." },
  { id:"cm-fa-8", assunto:"cm-fa", frente:"Controle de FREQUÊNCIA na FA estável: quais drogas?", verso:"Betabloqueador ou bloqueador de cálcio não di-hidropiridínico (diltiazem, verapamil). Digoxina fica para casos selecionados." },
  { id:"cm-fa-9", assunto:"cm-fa", frente:"Por que anticoagular na FA?", verso:"Para impedir o trombo no apêndice atrial de embolizar pro cérebro. O escore de risco (CHA2DS2-VASc) guia a decisão." },
  { id:"cm-fa-10", assunto:"cm-fa", frente:"Frequência x ritmo — o que cada estratégia busca?", verso:"Frequência: deixar a FA, mas desacelerar. Ritmo: tentar voltar ao sinusal. A escolha depende do paciente." },
  { id:"cm-cirrose-1", assunto:"cm-cirrose", frente:"O que é cirrose?", verso:"Ponto final de agressão crônica ao fígado: fibrose difusa + nódulos que distorcem a arquitetura e o fluxo." },
  { id:"cm-cirrose-2", assunto:"cm-cirrose", frente:"Causas principais de cirrose no Brasil?", verso:"Álcool, hepatites B e C, e — em ascensão — doença hepática gordurosa metabólica." },
  { id:"cm-cirrose-3", assunto:"cm-cirrose", frente:"Os DOIS grandes eixos das consequências da cirrose?", verso:"1) Insuficiência hepatocelular (fígado não trabalha). 2) Hipertensão portal (sangue não passa). Todo o resto deriva desses dois." },
  { id:"cm-cirrose-4", assunto:"cm-cirrose", frente:"Sinais da INSUFICIÊNCIA hepatocelular?", verso:"Icterícia, INR alargado, hipoalbuminemia, encefalopatia + sinais de estrogênio não metabolizado (aranhas vasculares, eritema palmar, ginecomastia)." },
  { id:"cm-cirrose-5", assunto:"cm-cirrose", frente:"Sinais da HIPERTENSÃO PORTAL?", verso:"Varizes esofágicas, ascite, esplenomegalia, circulação colateral. 'O sangue represa e busca desvios.'" },
  { id:"cm-cirrose-6", assunto:"cm-cirrose", frente:"As 4 descompensações da cirrose?", verso:"'A-S-E-I': Ascite, Sangramento por varizes, Encefalopatia, Icterícia. Qualquer uma vira 'descompensada'." },
  { id:"cm-cirrose-7", assunto:"cm-cirrose", frente:"Os dois escores prognósticos da cirrose?", verso:"Child-Pugh (bilirrubina, albumina, INR, ascite, encefalopatia) e MELD (bilirrubina, INR, creatinina — ordena fila de transplante)." },
  { id:"cm-cirrose-8", assunto:"cm-cirrose", frente:"O rastreio que muda desfecho no cirrótico?", verso:"Ultrassom a cada 6 MESES para detectar carcinoma hepatocelular. 'Todo cirrótico, US semestral.'" },
  { id:"cm-cirrose-9", assunto:"cm-cirrose", frente:"Como investigar ascite e o que é o GASA?", verso:"Paracentese + GASA (gradiente albumina soro-ascite). GASA ≥1,1 = hipertensão portal; <1,1 = outras causas (carcinomatose, etc.)." },
  { id:"cm-cirrose-10", assunto:"cm-cirrose", frente:"GASA ≥1,1: o que indica?", verso:"Hipertensão portal (cirrose, IC). 'Gradiente alto aponta o portal.'" },
{ id:"cm-itu-1", assunto:"cm-itu", frente:"O que divide ITU baixa de alta?", verso:"A FEBRE. Baixa (cistite) = sem febre, infecção de mucosa. Alta (pielonefrite) = com febre, invasão do parênquima renal. 'Febre subiu o andar.'" },
  { id:"cm-itu-2", assunto:"cm-itu", frente:"Sintomas da cistite (ITU baixa)?", verso:"Disúria, polaciúria, urgência, dor suprapúbica — SEM febre e sem repercussão sistêmica. 'Arde e aperta, mas não derruba.'" },
  { id:"cm-itu-3", assunto:"cm-itu", frente:"Sintomas da pielonefrite (ITU alta)?", verso:"Febre, calafrios, dor lombar com Giordano positivo, náusea/vômito. 'O paciente parece doente porque o rim foi invadido.'" },
  { id:"cm-itu-4", assunto:"cm-itu", frente:"Agente causador em ~80% das ITUs?", verso:"Escherichia coli. A campeã disparada." },
  { id:"cm-itu-5", assunto:"cm-itu", frente:"Como se diagnostica cistite não complicada?", verso:"CLÍNICO — mulher jovem, não gestante, sem anormalidade. 'Não precisa urocultura de rotina.'" },
  { id:"cm-itu-6", assunto:"cm-itu", frente:"Tratamento da cistite simples?", verso:"CURTO: nitrofurantoína 5 dias, fosfomicina dose única, ou SMX-TMP onde a resistência é baixa. 'Infecção de mucosa, tratamento curto.'" },
  { id:"cm-itu-7", assunto:"cm-itu", frente:"Por que EVITAR quinolona na cistite simples?", verso:"Efeitos adversos, resistência crescente e porque deve ser reservada. 'Guarde a quinolona para quando precisar de verdade.'" },
  { id:"cm-itu-8", assunto:"cm-itu", frente:"O que caracteriza ITU COMPLICADA?", verso:"Pelo hospedeiro ou anatomia: homem, gestante, criança, diabetes descompensado, cateter, obstrução, imunossupressão, recorrente ou hospitalar." },
  { id:"cm-itu-9", assunto:"cm-itu", frente:"Conduta na ITU complicada?", verso:"Urocultura, tratamento mais LONGO e investigar a causa. 'Outro animal — não trate como cistite simples.'" },
  { id:"cm-itu-10", assunto:"cm-itu", frente:"Na pielonefrite, quando colher urocultura e onde a quinolona tem lugar?", verso:"Urocultura ANTES do antibiótico. Caso leve/moderado pode ser ambulatorial — e AQUI a quinolona tem lugar." },
{ id:"cir-abdome-1", assunto:"cir-abdome", frente:"Os 4 padrões do abdome agudo?", verso:"Inflamatório, Obstrutivo, Perfurativo, Vascular. 'Cada padrão tem uma cara e uma conduta — encaixe o quadro em um deles.'" },
  { id:"cir-abdome-2", assunto:"cir-abdome", frente:"Abdome agudo INFLAMATÓRIO: cara clínica?", verso:"Dor que CRESCE e LOCALIZA, com febre (apendicite, colecistite). 'A dor vai se concentrando num ponto.'" },
  { id:"cir-abdome-3", assunto:"cir-abdome", frente:"Abdome agudo OBSTRUTIVO: cara clínica?", verso:"Dor em CÓLICA, parada de fezes e flatos, vômitos, distensão (bridas, hérnia, tumor). 'Nada passa, tudo distende.'" },
  { id:"cir-abdome-4", assunto:"cir-abdome", frente:"Abdome agudo PERFURATIVO: cara clínica?", verso:"Dor SÚBITA e intensa, abdome EM TÁBUA (úlcera perfurada). 'Rígido como tábua = furou.'" },
  { id:"cir-abdome-5", assunto:"cir-abdome", frente:"Abdome agudo VASCULAR: cara clínica?", verso:"Dor DESPROPORCIONAL ao exame, paciente grave (isquemia mesentérica, aneurisma roto). 'Dor enorme, exame pobre = pense vaso.'" },
  { id:"cir-abdome-6", assunto:"cir-abdome", frente:"A história clássica da apendicite?", verso:"Dor começa periumbilical (vaga) e MIGRA para fossa ilíaca direita quando atinge o peritônio. 'Do umbigo pra direita.'" },
  { id:"cir-abdome-7", assunto:"cir-abdome", frente:"Por que a dor da apendicite migra?", verso:"No início o apêndice 'avisa' pelo nervo visceral (vaga, no umbigo); depois a inflamação atinge o peritônio parietal e a dor localiza na FID." },
  { id:"cir-abdome-8", assunto:"cir-abdome", frente:"O que o sinal de Blumberg indica?", verso:"Dor à DESCOMPRESSÃO = irritação peritoneal. 'Peritônio inflamado fala a favor de cirurgia.'" },
  { id:"cir-abdome-9", assunto:"cir-abdome", frente:"Conduta na apendicite típica?", verso:"Apendicectomia (laparoscópica, inclusive em gestantes). 'Quadro claro + sinais peritoneais = opera, não fica pedindo exame.'" },
  { id:"cir-abdome-10", assunto:"cir-abdome", frente:"Para que serve o escore de Alvarado?", verso:"Estima probabilidade de apendicite (0–10). ≥7 = alta probabilidade, autoriza a cirurgia em muitos casos." },
  { id:"cir-trauma-1", assunto:"cir-trauma", frente:"A regra de ouro do ATLS?", verso:"Trata primeiro o que mata primeiro, e NÃO passa de letra sem resolver a anterior. Sequência rígida." },
  { id:"cir-trauma-2", assunto:"cir-trauma", frente:"O que é o 'X' do XABCDE?", verso:"Hemorragia eXsanguinante (sangramento externo maciço) — controlada ANTES da via aérea, porque mata em minutos. Novidade da 11ª edição." },
  { id:"cir-trauma-3", assunto:"cir-trauma", frente:"A = ? no ATLS?", verso:"Via Aérea COM proteção da coluna cervical. 'Todo politraumatizado tem lesão cervical até prova em contrário.'" },
  { id:"cir-trauma-4", assunto:"cir-trauma", frente:"B = ? e o que se pega aqui?", verso:"Respiração/ventilação — checar se os dois pulmões expandem. Pega pneumotórax hipertensivo e tórax instável." },
  { id:"cir-trauma-5", assunto:"cir-trauma", frente:"C = ? e a maior causa de choque no trauma?", verso:"Circulação — controlar hemorragia e repor volume (Ringer lactato). Maior causa de choque = SANGRAMENTO (hemorrágico)." },
  { id:"cir-trauma-6", assunto:"cir-trauma", frente:"Ressuscitação com controle de danos: os conceitos-chave?", verso:"Controlar hemorragia 1º, MENOS cristaloide, hemocomponentes cedo na proporção 1:1:1 (hemácias:plasma:plaquetas)." },
  { id:"cir-trauma-7", assunto:"cir-trauma", frente:"O que é hipotensão permissiva e a exceção?", verso:"Manter PAS ~80–90 até controlar o foco de sangramento. EXCEÇÃO: traumatismo cranioencefálico (aí não se permite hipotensão)." },
  { id:"cir-trauma-8", assunto:"cir-trauma", frente:"Qual droga precoce reduz mortalidade no trauma hemorrágico?", verso:"Ácido tranexâmico (1g EV + 1g em infusão). Precoce. 'Antifibrinolítico que segura o coágulo.'" },
  { id:"cir-trauma-9", assunto:"cir-trauma", frente:"Cristaloide preferido no trauma?", verso:"Ringer lactato. Mas a 11ª edição pede MENOS cristaloide e mais hemocomponentes." },
  { id:"cir-trauma-10", assunto:"cir-trauma", frente:"Sinais de via aérea ameaçada?", verso:"Estridor, sangue ou vômito na boca, rebaixamento de consciência. 'Se o ar não entra, resolve o A antes de tudo.'" },
  { id:"cir-posop-1", assunto:"cir-posop", frente:"Onde acontece boa parte das mortes cirúrgicas evitáveis?", verso:"No PÓS-operatório, por complicações que precisam ser reconhecidas cedo. 'A cirurgia não termina na sala.'" },
  { id:"cir-posop-2", assunto:"cir-posop", frente:"A profilaxia pré-op de destaque?", verso:"Prevenção de TVP em quem vai ficar imóvel. Avalia-se também risco cardíaco e respiratório." },
  { id:"cir-posop-3", assunto:"cir-posop", frente:"O truque da febre pós-operatória?", verso:"Pensar pela CRONOLOGIA — quando a febre aparece sugere a causa. 'A linha do tempo organiza o raciocínio.'" },
  { id:"cir-posop-4", assunto:"cir-posop", frente:"Febre nas primeiras 24–48h: causa provável?", verso:"Pulmonar (atelectasia — pulmão que não expande deitado). 'Febre precoce = estimule respirar e deambular.'" },
  { id:"cir-posop-5", assunto:"cir-posop", frente:"Os '5 Ws' da febre pós-op?", verso:"Wind (pulmão), Water (urina/ITU), Wound (ferida), Walking (TVP), Wonder drugs (febre medicamentosa). Clássico mnemônico." },
  { id:"cir-posop-6", assunto:"cir-posop", frente:"Febre pós-op mais TARDIA puxa para o quê?", verso:"Infecção urinária (sonda), infecção de ferida, TVP e coleções/abscessos. 'Quanto mais tarde, mais pensa infecção/coleção.'" },
  { id:"cir-posop-7", assunto:"cir-posop", frente:"O que é deiscência?", verso:"Abertura da ferida ou da anastomose. Complicação vigiada no pós-op, junto da infecção do sítio cirúrgico." },
  { id:"cir-posop-8", assunto:"cir-posop", frente:"'Wind' e 'Walking' correspondem a quê?", verso:"Wind = pulmão (atelectasia/pneumonia, febre precoce). Walking = TVP (panturrilha). 'Vento no pulmão, caminhada na perna.'" },
  { id:"cir-posop-9", assunto:"cir-posop", frente:"Como a segurança do paciente cirúrgico é garantida?", verso:"Checklists, profilaxia adequada e vigilância pós-op — reconhecer a febre pela cronologia e agir." },
  { id:"cir-posop-10", assunto:"cir-posop", frente:"'Water' e 'Wound' correspondem a quê?", verso:"Water = urina (ITU por sonda). Wound = ferida operatória (infecção do sítio). 'Água na urina, ferida na incisão.'" },
{ id:"cir-hernia-1", assunto:"cir-hernia", frente:"O que é uma hérnia?", verso:"Protrusão de um órgão (geralmente alça) por um ponto fraco da parede abdominal. A maioria dá abaulamento que sai ao esforço e some deitado." },
  { id:"cir-hernia-2", assunto:"cir-hernia", frente:"Qual hérnia é a mais frequente e qual a mais perigosa em mulheres?", verso:"Mais frequente: inguinal (virilha). Mais perigosa em mulheres: femoral (abaixo do ligamento inguinal, anel estreito)." },
  { id:"cir-hernia-3", assunto:"cir-hernia", frente:"Encarceramento x estrangulamento — a diferença que salva?", verso:"Encarcerada = IRREDUTÍVEL, mas com circulação. Estrangulada = irredutível + SEM sangue (isquemia, vai necrosar). 'Estrangulou, opera agora.'" },
  { id:"cir-hernia-4", assunto:"cir-hernia", frente:"Sinais de alarme de estrangulamento?", verso:"Hérnia que não reduz + dor intensa + sinais sistêmicos (vômito, obstrução, febre, taquicardia). 'Irredutível + dor + sistêmico = estrangulou.'" },
  { id:"cir-hernia-5", assunto:"cir-hernia", frente:"Por que a hérnia femoral é traiçoeira?", verso:"Passa num anel ESTREITO → encarcera e estrangula com mais frequência. Perfil de prova: mulher idosa, abaulamento irredutível na virilha, obstrução." },
  { id:"cir-hernia-6", assunto:"cir-hernia", frente:"Conduta na hérnia não complicada?", verso:"Cirurgia ELETIVA (fila do SUS). Sem urgência se reduz e não dói." },
  { id:"cir-hernia-7", assunto:"cir-hernia", frente:"Conduta na hérnia estrangulada?", verso:"Cirurgia de URGÊNCIA — não se perde tempo. A alça está isquêmica." },
  { id:"cir-hernia-8", assunto:"cir-hernia", frente:"Onde ficam a hérnia inguinal e a femoral em relação ao ligamento?", verso:"Inguinal ACIMA do ligamento inguinal; femoral ABAIXO dele. 'Femoral desce mais.'" },
  { id:"cir-hernia-9", assunto:"cir-hernia", frente:"O resumo do raciocínio de prova nas hérnias?", verso:"'Irredutível + dor + sinais sistêmicos = estrangulou = operou agora.' O resto é eletivo." },
  { id:"cir-hernia-10", assunto:"cir-hernia", frente:"O que é hérnia incisional?", verso:"Aparece na cicatriz de cirurgia prévia (ponto fraco criado pela incisão)." },
  { id:"cir-biliar-1", assunto:"cir-biliar", frente:"O perfil clássico dos '4 F' do cálculo biliar?", verso:"Female (mulher), Forty (~40 anos), Fat (sobrepeso), Fertile (multípara). O perfil que cai na prova." },
  { id:"cir-biliar-2", assunto:"cir-biliar", frente:"Colelitíase assintomática: opera?", verso:"NÃO. A maioria é assintomática e não se opera. 'Marcar operar todo mundo com cálculo é erro.'" },
  { id:"cir-biliar-3", assunto:"cir-biliar", frente:"Quando indicar colecistectomia profilática no cálculo assintomático?", verso:"Vesícula em porcelana (câncer), cálculo >3 cm, anemia hemolítica, alguns pólipos, candidato a transplante." },
  { id:"cir-biliar-4", assunto:"cir-biliar", frente:"Cólica biliar: características?", verso:"Cálculo impacta e DESIMPACTA. Dor em HD/epigástrio após refeição gordurosa, dura <6h e cede. SEM febre e SEM leucocitose (só obstrução transitória)." },
  { id:"cir-biliar-5", assunto:"cir-biliar", frente:"Por que a dor da cólica biliar vem após comida gordurosa?", verso:"A gordura estimula a colecistocinina → vesícula contrai contra o cálculo. 'Comeu gordura, a vesícula aperta no cálculo.'" },
  { id:"cir-biliar-6", assunto:"cir-biliar", frente:"Exame de escolha para a vesícula?", verso:"Ultrassonografia. Sempre a primeira para litíase biliar." },
  { id:"cir-biliar-7", assunto:"cir-biliar", frente:"Colecistite aguda: o que muda em relação à cólica?", verso:"O cálculo impacta e NÃO sai → a bile inflama a parede. Dor >6h e contínua, FEBRE e LEUCOCITOSE aparecem." },
  { id:"cir-biliar-8", assunto:"cir-biliar", frente:"O que é o sinal de Murphy?", verso:"Palpa o HD e pede pra inspirar; a vesícula inflamada desce, toca a mão e o paciente INTERROMPE a inspiração de dor. Clássico de colecistite." },
  { id:"cir-biliar-9", assunto:"cir-biliar", frente:"Achados de colecistite no ultrassom?", verso:"Parede espessada (>4 mm), líquido perivesicular, cálculo impactado, Murphy ultrassonográfico. 'Parede grossa + líquido em volta.'" },
  { id:"cir-biliar-10", assunto:"cir-biliar", frente:"Conduta na cólica biliar?", verso:"Colecistectomia ELETIVA, preferencialmente videolaparoscópica. Já na colecistite, a cirurgia é precoce." },
  { id:"cir-pancreatite-1", assunto:"cir-pancreatite", frente:"O que é pancreatite aguda?", verso:"O pâncreas se AUTODIGERINDO: enzimas que deviam ativar no intestino ativam dentro da glândula." },
  { id:"cir-pancreatite-2", assunto:"cir-pancreatite", frente:"As 2 principais causas no Brasil e a ordem?", verso:"1ª BILIAR (cálculo, mais em mulheres), 2ª ALCOÓLICA (mais em homens). Juntas, ~80% dos casos." },
  { id:"cir-pancreatite-3", assunto:"cir-pancreatite", frente:"Por que definir a etiologia importa?", verso:"Se for BILIAR, há conduta específica para impedir recorrência. 'Achar a causa muda o tratamento.'" },
  { id:"cir-pancreatite-4", assunto:"cir-pancreatite", frente:"Os critérios de Atlanta (2 de 3)?", verso:"1) Dor típica; 2) Amilase/lipase ≥3x o limite; 3) Imagem compatível. 'Dois dos três fecham.'" },
  { id:"cir-pancreatite-5", assunto:"cir-pancreatite", frente:"A dor típica da pancreatite?", verso:"Epigástrica, intensa, contínua, irradiando 'EM FAIXA' para o dorso, MELHORA inclinando pra frente. 'Dor em cinturão que alivia curvado.'" },
  { id:"cir-pancreatite-6", assunto:"cir-pancreatite", frente:"Amilase ou lipase — qual é melhor e por quê?", verso:"Lipase: mais específica e fica elevada por mais tempo. Ambas ≥3x o limite fecham o critério enzimático." },
  { id:"cir-pancreatite-7", assunto:"cir-pancreatite", frente:"A pegadinha campeã da pancreatite?", verso:"O VALOR da enzima NÃO indica gravidade. Amilase de 3.000 não é 'mais grave' que 400. 'Enzima alta ≠ caso grave.'" },
  { id:"cir-pancreatite-8", assunto:"cir-pancreatite", frente:"Com dor típica + lipase 3x, precisa de tomografia?", verso:"NÃO — o diagnóstico já está FEITO com 2 dos 3 critérios. 'Não peça TC pra confirmar o óbvio.'" },
  { id:"cir-pancreatite-9", assunto:"cir-pancreatite", frente:"Como se define GRAVIDADE (Atlanta revisada)?", verso:"Por FALÊNCIA ORGÂNICA: Leve = sem falência; Moderada = falência transitória (<48h) ou complicação local; Grave = falência PERSISTENTE (>48h)." },
  { id:"cir-pancreatite-10", assunto:"cir-pancreatite", frente:"Causas de pancreatite além de biliar e álcool?", verso:"Hipertrigliceridemia (>1.000), pós-CPRE, drogas, trauma, hipercalcemia." },
{ id:"cir-obstrucao-1", assunto:"cir-obstrucao", frente:"Os 4 sinais da obstrução intestinal?", verso:"Dor em CÓLICA, VÔMITOS, DISTENSÃO, PARADA de fezes e flatos. 'Use os quatro para localizar o nível.'" },
  { id:"cir-obstrucao-2", assunto:"cir-obstrucao", frente:"Obstrução ALTA (delgado): que sinais predominam?", verso:"Vômito PRECOCE e abundante, pouca distensão. 'Vômito cedo com barriga vazia = alta.'" },
  { id:"cir-obstrucao-3", assunto:"cir-obstrucao", frente:"Obstrução BAIXA (cólon): que sinais predominam?", verso:"DISTENSÃO importante, vômito TARDIO (pode ser fecaloide). 'Barriga estufada com vômito tardio = baixa.'" },
  { id:"cir-obstrucao-4", assunto:"cir-obstrucao", frente:"Causa nº1 de obstrução no DELGADO?", verso:"BRIDAS (aderências de cirurgia prévia), seguidas de hérnias e neoplasia. 'Quem já operou, pensa brida.'" },
  { id:"cir-obstrucao-5", assunto:"cir-obstrucao", frente:"Causa nº1 de obstrução no CÓLON?", verso:"NEOPLASIA, seguida de volvo e diverticulite. 'No cólon, pensa tumor.'" },
  { id:"cir-obstrucao-6", assunto:"cir-obstrucao", frente:"A armadilha clássica: paciente que NUNCA operou o abdome?", verso:"Brida é improvável → HÉRNIA encarcerada sobe ao topo. 'Sempre examine os orifícios herniários.'" },
  { id:"cir-obstrucao-7", assunto:"cir-obstrucao", frente:"O erro clássico da obstrução?", verso:"Esquecer a hérnia na virilha. 'Em toda obstrução, examine os orifícios herniários.'" },
  { id:"cir-obstrucao-8", assunto:"cir-obstrucao", frente:"Obstrução em crianças: pense em quê?", verso:"Intussuscepção e hérnia. Perfil diferente do adulto." },
  { id:"cir-obstrucao-9", assunto:"cir-obstrucao", frente:"O que o raio-x de abdome mostra na obstrução?", verso:"Distensão de alças, níveis hidroaéreos, ausência de gás distal. Se houver ar livre sob o diafragma (pneumoperitônio) = perfuração." },
  { id:"cir-obstrucao-10", assunto:"cir-obstrucao", frente:"Exame de escolha hoje na obstrução?", verso:"Tomografia de abdome com contraste — define nível, causa e sinais de sofrimento de alça." },
  { id:"cir-queimados-1", assunto:"cir-queimados", frente:"A inversão que a banca adora nas queimaduras?", verso:"A queimadura que NÃO DÓI é a mais grave (3º grau destruiu as terminações nervosas). 'Indolor = espessura total = enxerto.'" },
  { id:"cir-queimados-2", assunto:"cir-queimados", frente:"1º grau: características e a pegadinha do cálculo?", verso:"Só epiderme, eritema doloroso (insolação). PEGADINHA: o 1º grau NÃO entra no cálculo da superfície queimada." },
  { id:"cir-queimados-3", assunto:"cir-queimados", frente:"2º grau superficial: como é?", verso:"BOLHAS, base rósea e úmida, dói MUITO, cicatriza sozinho. 'Bolha que arde muito.'" },
  { id:"cir-queimados-4", assunto:"cir-queimados", frente:"3º grau: como é?", verso:"Espessura total: branco nacarado ou carbonizado, seco, rígido e INDOLOR. Exige enxerto." },
  { id:"cir-queimados-5", assunto:"cir-queimados", frente:"A regra dos nove no adulto?", verso:"Cabeça 9%, cada braço 9%, cada perna 18%, tronco anterior 18%, posterior 18%, períneo 1%. Estima a extensão." },
  { id:"cir-queimados-6", assunto:"cir-queimados", frente:"Por que crianças usam Lund-Browder?", verso:"A cabeça é proporcionalmente MAIOR (~18%) e as pernas menores. A regra dos nove do adulto não serve; Lund-Browder é mais precisa." },
  { id:"cir-queimados-7", assunto:"cir-queimados", frente:"O atalho da palma da mão?", verso:"A palma do PACIENTE ≈ 1% da superfície corporal dele. Útil para queimaduras esparsas." },
  { id:"cir-queimados-8", assunto:"cir-queimados", frente:"Queimado grave: qual a prioridade?", verso:"XABCDE — é politraumatizado. E o que mata cedo é a VIA AÉREA." },
  { id:"cir-queimados-9", assunto:"cir-queimados", frente:"Sinais de lesão inalatória?", verso:"Incêndio em ambiente FECHADO, queimadura de face, vibrissas chamuscadas, rouquidão, estridor, escarro carbonáceo." },
  { id:"cir-queimados-10", assunto:"cir-queimados", frente:"Conduta diante de suspeita de lesão inalatória?", verso:"INTUBAR PRECOCEMENTE — o edema progride e depois não se consegue mais intubar. 'Na dúvida, intube antes de perder a via aérea.'" },
  { id:"cir-torax-1", assunto:"cir-torax", frente:"A boa notícia do trauma torácico?", verso:"~85% se resolvem só com DRENO de tórax e suporte. A minoria precisa de toracotomia." },
  { id:"cir-torax-2", assunto:"cir-torax", frente:"Por que as lesões letais do tórax caem na avaliação primária?", verso:"Matam em MINUTOS. São diagnosticadas CLINICAMENTE e tratadas na hora, à beira do leito, sem esperar exame." },
  { id:"cir-torax-3", assunto:"cir-torax", frente:"As lesões torácicas letais imediatas?", verso:"Obstrução de via aérea, pneumotórax hipertensivo, pneumotórax aberto, hemotórax maciço, tamponamento cardíaco, tórax instável com contusão." },
  { id:"cir-torax-4", assunto:"cir-torax", frente:"A regra categórica do pneumotórax hipertensivo?", verso:"O diagnóstico é CLÍNICO — 'pedir raio-x mata o paciente'. Trata-se na hora." },
  { id:"cir-torax-5", assunto:"cir-torax", frente:"Como reconhecer pneumotórax hipertensivo?", verso:"Dispneia intensa, choque, TURGÊNCIA JUGULAR, desvio de traqueia CONTRALATERAL, timpanismo e ausência de murmúrio do lado afetado." },
  { id:"cir-torax-6", assunto:"cir-torax", frente:"Conduta no pneumotórax hipertensivo?", verso:"Descompressão IMEDIATA por agulha + drenagem torácica definitiva em seguida." },
  { id:"cir-torax-7", assunto:"cir-torax", frente:"Onde puncionar o pneumotórax hipertensivo (atualização ATLS)?", verso:"5º espaço intercostal na linha AXILAR MÉDIA (antes era 2º espaço, hemiclavicular). Parede mais fina, mais sucesso." },
  { id:"cir-torax-8", assunto:"cir-torax", frente:"Tamponamento cardíaco: como confunde e a quem é típico?", verso:"Também dá hipotensão + jugular túrgida. Típico do trauma PENETRANTE precordial. 'O irmão que confunde com o pneumotórax.'" },
  { id:"cir-torax-9", assunto:"cir-torax", frente:"A tríade de Beck?", verso:"Hipotensão + turgência jugular + abafamento de bulhas. Clássica do tamponamento cardíaco." },
  { id:"cir-torax-10", assunto:"cir-torax", frente:"Como diferenciar pneumotórax hipertensivo de tamponamento?", verso:"Ambos: hipotensão + jugular. Pneumotórax: traqueia desviada, timpanismo, sem murmúrio. Tamponamento: bulhas abafadas, trauma penetrante precordial." },
{ id:"cir-abdome-trauma-1", assunto:"cir-abdome-trauma", frente:"As duas perguntas que resolvem todo trauma abdominal?", verso:"1) Mecanismo: contuso ou penetrante? 2) O paciente está ESTÁVEL ou INSTÁVEL? A segunda manda." },
  { id:"cir-abdome-trauma-2", assunto:"cir-abdome-trauma", frente:"O princípio que a banca cobra no trauma abdominal?", verso:"NÃO é a lesão que manda operar — é a INSTABILIDADE. 'Baço grau IV estável pode não operar; grau II que choca vai pra sala.'" },
  { id:"cir-abdome-trauma-3", assunto:"cir-abdome-trauma", frente:"O que é o FAST e o que procura?", verso:"Ultrassom à beira do leito, em segundos, procurando líquido livre em 4 janelas: hepatorrenal (Morrison), esplenorrenal, pélvica e pericárdica." },
  { id:"cir-abdome-trauma-4", assunto:"cir-abdome-trauma", frente:"A regra de ouro do FAST?", verso:"FAST POSITIVO + paciente INSTÁVEL = LAPAROTOMIA imediata. Sem tomografia, sem mais nada." },
  { id:"cir-abdome-trauma-5", assunto:"cir-abdome-trauma", frente:"FAST NEGATIVO em paciente instável: o que significa?", verso:"A hemorragia está em OUTRO lugar. Procure nos 5 compartimentos: 'no chão e mais quatro'." },
  { id:"cir-abdome-trauma-6", assunto:"cir-abdome-trauma", frente:"Os 5 compartimentos de sangramento ('no chão e mais quatro')?", verso:"Hemorragia externa (chão), tórax, abdome, retroperitônio/pelve e ossos longos. 'Onde o sangue pode estar escondido.'" },
  { id:"cir-abdome-trauma-7", assunto:"cir-abdome-trauma", frente:"Paciente ESTÁVEL: exame de escolha?", verso:"Tomografia de abdome com contraste — estadia a lesão, mostra sangramento ativo e viabiliza o manejo não operatório." },
  { id:"cir-abdome-trauma-8", assunto:"cir-abdome-trauma", frente:"O padrão atual para trauma de baço e fígado no estável?", verso:"MANEJO NÃO OPERATÓRIO: observação monitorada. 'A evolução foi deixar de operar todo mundo.'" },
  { id:"cir-abdome-trauma-9", assunto:"cir-abdome-trauma", frente:"Quando entra a angioembolização?", verso:"Quando há 'blush' de contraste (extravasamento ativo) na tomografia. 'Sangramento ativo na TC → emboliza.'" },
  { id:"cir-abdome-trauma-10", assunto:"cir-abdome-trauma", frente:"Contuso x penetrante — qual a diferença de raciocínio inicial?", verso:"É a 1ª pergunta, mas a instabilidade decide. 'Mecanismo orienta, estabilidade manda.'" },
  { id:"cir-tce-1", assunto:"cir-tce", frente:"Classificação do TCE pela Glasgow?", verso:"Leve 13–15, Moderado 9–12, Grave ≤8. 'Oito ou menos é grave.'" },
  { id:"cir-tce-2", assunto:"cir-tce", frente:"Glasgow ≤8: conduta automática?", verso:"INTUBAR — o paciente não protege a via aérea. 'Glasgow 8, intuba.'" },
  { id:"cir-tce-3", assunto:"cir-tce", frente:"O que a 11ª edição do ATLS acrescenta na avaliação do TCE?", verso:"Valorizar os COMPONENTES (ocular, verbal, motor) + reatividade PUPILAR, e a TENDÊNCIA no tempo — não só o número total." },
  { id:"cir-tce-4", assunto:"cir-tce", frente:"Lesão primária x secundária no TCE?", verso:"Primária = dano do impacto, já aconteceu, ninguém desfaz. Secundária = o que vem DEPOIS e piora o cérebro. 'O tratamento é evitar a secundária.'" },
  { id:"cir-tce-5", assunto:"cir-tce", frente:"Os dois maiores vilões da lesão secundária?", verso:"HIPÓXIA e HIPOTENSÃO. 'Um único episódio de hipotensão DOBRA a mortalidade no TCE grave.'" },
  { id:"cir-tce-6", assunto:"cir-tce", frente:"As metas simples que salvam no TCE?", verso:"PAS em torno de 110+ e saturação acima de 90%. 'Metas simples salvam mais que manobra sofisticada.'" },
  { id:"cir-tce-7", assunto:"cir-tce", frente:"Hematoma EPIDURAL: origem e imagem?", verso:"Sangramento ARTERIAL (artéria meníngea média), associado a fratura do temporal. TC BICONVEXO (lenticular), NÃO cruza suturas." },
  { id:"cir-tce-8", assunto:"cir-tce", frente:"O intervalo lúcido é clássico de qual hematoma?", verso:"Epidural — o paciente 'acorda' e depois piora. Sangramento arterial que se acumula rápido." },
  { id:"cir-tce-9", assunto:"cir-tce", frente:"Outras causas de lesão secundária além de hipóxia/hipotensão?", verso:"Hipercapnia, hipertermia, hipoglicemia e hipertensão intracraniana. 'Vários hipos-hipers pioram o cérebro.'" },
  { id:"cir-tce-10", assunto:"cir-tce", frente:"Por que a hipotensão é proibida no TCE (lembrando o trauma)?", verso:"No trauma geral se permite hipotensão permissiva — EXCETO no TCE, onde ela dobra a mortalidade. 'No crânio, pressão não pode cair.'" },
  { id:"cir-colorretal-1", assunto:"cir-colorretal", frente:"Diverticulose x diverticulite?", verso:"Diverticulose = só a presença dos divertículos (assintomática, achado de colono). Diverticulite = inflamação/microperfuração de um deles." },
  { id:"cir-colorretal-2", assunto:"cir-colorretal", frente:"Onde se concentram os divertículos no Ocidente?", verso:"No SIGMOIDE. Favorecidos por idade e dieta pobre em fibras." },
  { id:"cir-colorretal-3", assunto:"cir-colorretal", frente:"O apelido que ajuda na diverticulite?", verso:"'Apendicite do lado ESQUERDO': dor em FIE, febre, leucocitose, alteração do hábito, paciente mais velho." },
  { id:"cir-colorretal-4", assunto:"cir-colorretal", frente:"Exame de escolha na diverticulite?", verso:"Tomografia de abdome com contraste — confirma e mostra complicações." },
  { id:"cir-colorretal-5", assunto:"cir-colorretal", frente:"A proibição que cai direto na diverticulite aguda?", verso:"NÃO fazer colonoscopia na fase AGUDA — risco de perfurar o cólon inflamado." },
  { id:"cir-colorretal-6", assunto:"cir-colorretal", frente:"Quando e por que fazer colonoscopia depois?", verso:"Em 6–8 semanas, OBRIGATÓRIA — para descartar que a 'diverticulite' fosse um CÂNCER de cólon." },
  { id:"cir-colorretal-7", assunto:"cir-colorretal", frente:"A classificação de Hinchey (I a IV)?", verso:"I = abscesso pericólico; II = abscesso pélvico/à distância; III = peritonite PURULENTA; IV = peritonite FECAL. Organiza gravidade e conduta." },
  { id:"cir-colorretal-8", assunto:"cir-colorretal", frente:"Conduta na diverticulite NÃO complicada?", verso:"Tratamento clínico; em selecionados, AMBULATORIAL. Tendência crescente a NÃO usar antibiótico de rotina na não complicada." },
  { id:"cir-colorretal-9", assunto:"cir-colorretal", frente:"Hinchey III x IV — o que os separa?", verso:"III = peritonite purulenta (pus). IV = peritonite fecal (fezes na cavidade). IV é mais grave." },
  { id:"cir-colorretal-10", assunto:"cir-colorretal", frente:"Por que a colonoscopia pós-diverticulite não se negocia?", verso:"Porque o que parecia diverticulite pode ser câncer de cólon. 'Confirmou diverticulite? Agenda a colono das 6–8 semanas.'" },
{ id:"go-prenatal-1", assunto:"go-prenatal", frente:"Para que serve o ácido fólico e quando começar?", verso:"Previne defeitos do tubo neural. Idealmente ANTES de engravidar e no 1º trimestre. 'Fólico protege o tubo neural.'" },
  { id:"go-prenatal-2", assunto:"go-prenatal", frente:"As sorologias de rotina do pré-natal?", verso:"Sífilis (VDRL), HIV, hepatite B, toxoplasmose. Rastreiam infecções transmissíveis ao bebê — muitas com tratamento que muda o desfecho." },
  { id:"go-prenatal-3", assunto:"go-prenatal", frente:"Glicemia de jejum no 1º trimestre: como interpretar?", verso:"≥126 = diabetes prévio; 92–125 = DMG; <92 = normal (completa rastreio depois). 'Noventa e dois é a linha do DMG.'" },
  { id:"go-prenatal-4", assunto:"go-prenatal", frente:"Quando e como fazer o TOTG?", verso:"Entre 24–28 semanas, com 75g, medindo jejum, 1h e 2h. Cortes: 92 / 180 / 153. 'Basta UM valor alterado para fechar DMG.'" },
  { id:"go-prenatal-5", assunto:"go-prenatal", frente:"A pegadinha do rastreio de DMG?", verso:"Jejum normal no 1º trimestre NÃO encerra — falta o TOTG das 24–28 semanas. 'Normal cedo não é alta; faça o TOTG.'" },
  { id:"go-prenatal-6", assunto:"go-prenatal", frente:"Qual vacina protege o RN contra coqueluche?", verso:"dTpa — dada a CADA gestação. 'A dTpa passa anticorpos pro bebê contra a coqueluche.'" },
  { id:"go-prenatal-7", assunto:"go-prenatal", frente:"Por que penicilina na sífilis gestacional é tão cobrada?", verso:"É o tratamento que muda o desfecho e previne sífilis congênita. 'Sífilis na gestante = penicilina.'" },
  { id:"go-prenatal-8", assunto:"go-prenatal", frente:"Onde a maioria das gestantes é acompanhada?", verso:"Na atenção primária — a maioria é de baixo risco. Roteiro de consultas e exames por trimestre é rotina do SUS." },
  { id:"go-prenatal-9", assunto:"go-prenatal", frente:"Ferro no pré-natal previne o quê?", verso:"Anemia gestacional. Suplementação de rotina junto com o ácido fólico." },
  { id:"go-prenatal-10", assunto:"go-prenatal", frente:"Glicemia de jejum ≥126 na gestante: o que é?", verso:"Diabetes PRÉVIO (não é DMG) — já existia antes da gestação. 'Cento e vinte e seis já é diabetes de verdade.'" },
  { id:"go-hemorragias-1", assunto:"go-hemorragias", frente:"Como organizar sangramento na gestação?", verso:"Pela METADE. 1ª metade (até ~20 sem): aborto, ectópica, mola. 2ª metade: DPP x placenta prévia." },
  { id:"go-hemorragias-2", assunto:"go-hemorragias", frente:"O mnemônico que separa DPP de PP?", verso:"'PP = sangue vivo e sem dor; DPP = dor e útero duro.' Resolve a questão que mais cai." },
  { id:"go-hemorragias-3", assunto:"go-hemorragias", frente:"A cara do DPP (descolamento)?", verso:"Dor abdominal + útero HIPERTÔNICO (duro) + sangue geralmente ESCURO + sofrimento fetal. Emergência — bebê perde oxigênio." },
  { id:"go-hemorragias-4", assunto:"go-hemorragias", frente:"Fatores de risco do DPP?", verso:"Hipertensão, trauma, uso de cocaína. 'Placenta que se solta antes da hora.'" },
  { id:"go-hemorragias-5", assunto:"go-hemorragias", frente:"A cara da placenta prévia?", verso:"Sangramento VIVO (vermelho), INDOLOR, sem hipertonia, de repetição. Placenta implantada sobre o colo." },
  { id:"go-hemorragias-6", assunto:"go-hemorragias", frente:"A regra de segurança absoluta na suspeita de placenta prévia?", verso:"NÃO fazer toque vaginal antes do ultrassom — o toque pode provocar hemorragia maciça. 'Suspeitou de PP, nada de toque.'" },
  { id:"go-hemorragias-7", assunto:"go-hemorragias", frente:"Gestação ectópica: a tríade?", verso:"Dor pélvica + atraso menstrual + beta-hCG positivo. Confirma com beta-hCG seriado + US transvaginal." },
  { id:"go-hemorragias-8", assunto:"go-hemorragias", frente:"Por que a ectópica é perigosa?", verso:"Se romper, causa abdome agudo HEMORRÁGICO. Emergência com risco de vida." },
  { id:"go-hemorragias-9", assunto:"go-hemorragias", frente:"Causas de sangramento na 1ª metade da gestação?", verso:"Abortamento, gestação ectópica e doença trofoblástica (mola). 'Até 20 semanas, pensa nesses três.'" },
  { id:"go-hemorragias-10", assunto:"go-hemorragias", frente:"DPP x PP: qual dói e qual não dói?", verso:"DPP DÓI (útero duro, sangue escuro). PP NÃO dói (sangue vivo). 'Dor aponta descolamento.'" },
  { id:"go-hpp-1", assunto:"go-hpp", frente:"Os '4 Ts' da hemorragia pós-parto?", verso:"Tônus (atonia), Trauma (lacerações), Tecido (restos placentários), Trombina (coagulação). 'Quatro Ts organizam a causa.'" },
  { id:"go-hpp-2", assunto:"go-hpp", frente:"Causa nº1 de HPP?", verso:"Atonia uterina (Tônus). O útero não contrai e os vasos ficam abertos. 'Útero mole é o vilão nº1.'" },
  { id:"go-hpp-3", assunto:"go-hpp", frente:"Por que o útero precisa contrair após o parto?", verso:"Para 'estrangular' os vasos que irrigavam a placenta — é a contração que estanca o sangramento. Útero atônico = sangra muito." },
  { id:"go-hpp-4", assunto:"go-hpp", frente:"Sinal clássico da atonia no exame?", verso:"Útero AMOLECIDO e ACIMA da cicatriz umbilical, com sangramento abundante. 'Mole e alto = atonia.'" },
  { id:"go-hpp-5", assunto:"go-hpp", frente:"Primeiro uterotônico na HPP por atonia?", verso:"OCITOCINA — primeira escolha, junto da massagem bimanual (manobra de Hamilton)." },
  { id:"go-hpp-6", assunto:"go-hpp", frente:"Qual droga precoce reduz mortalidade na HPP?", verso:"Ácido tranexâmico 1g EV na 'hora de ouro' (1ª hora), pode repetir após 30 min. 'Mesmo antifibrinolítico do trauma.'" },
  { id:"go-hpp-7", assunto:"go-hpp", frente:"Qual uterotônico é CONTRAINDICADO na hipertensão/pré-eclâmpsia?", verso:"Derivados do ergot (metilergometrina). 'Ergot sobe a pressão — proibido na pré-eclâmpsia.'" },
  { id:"go-hpp-8", assunto:"go-hpp", frente:"A conduta escalonada da HPP por atonia?", verso:"Massagem + ocitocina → outros uterotônicos (ergot, misoprostol) → balão de tamponamento → suturas/ligaduras → histerectomia (último recurso)." },
  { id:"go-hpp-9", assunto:"go-hpp", frente:"O erro comum na HPP?", verso:"Pular a etapa inicial (massagem + ocitocina + tranexâmico). 'Comece simples e escalone; não pule o básico.'" },
  { id:"go-hpp-10", assunto:"go-hpp", frente:"Por que a HPP é tão importante?", verso:"Uma das principais causas de morte materna — e muito EVITÁVEL quando se age rápido e na ordem certa." },
{ id:"go-rastreio-1", assunto:"go-rastreio", frente:"Método PRIMÁRIO do rastreio de câncer de colo hoje (MS 2025)?", verso:"Teste de DNA-HPV oncogênico (não mais a citologia), dos 25 aos 64 anos. 'Mudou: agora o DNA-HPV manda.'" },
  { id:"go-rastreio-2", assunto:"go-rastreio", frente:"Intervalo após DNA-HPV negativo?", verso:"5 anos — a maior sensibilidade do teste permite espaçar com segurança. 'Negativo? Só daqui a 5 anos.'" },
  { id:"go-rastreio-3", assunto:"go-rastreio", frente:"Por que NÃO rastrear colo antes dos 25 anos?", verso:"Predominam infecções transitórias e lesões que regridem. 'Rastrear cedo causa mais dano que benefício.'" },
  { id:"go-rastreio-4", assunto:"go-rastreio", frente:"DNA-HPV positivo para 16 ou 18: conduta?", verso:"Colposcopia DIRETO — são os mais oncogênicos. '16 e 18 furam a fila pra colposcopia.'" },
  { id:"go-rastreio-5", assunto:"go-rastreio", frente:"DNA-HPV positivo para outro tipo oncogênico (não 16/18)?", verso:"Citologia reflexa na mesma amostra: se alterada → colposcopia; se normal → repete em 1 ano." },
  { id:"go-rastreio-6", assunto:"go-rastreio", frente:"Onde não há DNA-HPV, como rastrear o colo?", verso:"Citologia (Papanicolau) a cada 3 anos, após 2 exames anuais normais. 'As duas realidades convivem hoje.'" },
  { id:"go-rastreio-7", assunto:"go-rastreio", frente:"Quando encerra o rastreio de colo?", verso:"Quando o último teste, feito acima dos 60 anos, é negativo." },
  { id:"go-rastreio-8", assunto:"go-rastreio", frente:"Método de rastreio populacional do câncer de mama?", verso:"Mamografia. O exame que reduz mortalidade na faixa etária definida." },
  { id:"go-rastreio-9", assunto:"go-rastreio", frente:"Por que fazer rastreio na faixa e intervalo certos importa tanto?", verso:"Rastrear fora disso gera DANO: sobrediagnóstico, exames e tratamentos desnecessários. 'Fazer errado também prejudica.'" },
  { id:"go-rastreio-10", assunto:"go-rastreio", frente:"O que é rastreamento?", verso:"Buscar doença em pessoas SEM sintomas, na faixa e intervalo em que comprovadamente reduz mortalidade." },
  { id:"go-preeclampsia-1", assunto:"go-preeclampsia", frente:"O divisor de águas das síndromes hipertensivas?", verso:"A marca das 20 SEMANAS. Antes = crônica; depois = gestacional ou pré-eclâmpsia. 'Vinte semanas divide tudo.'" },
  { id:"go-preeclampsia-2", assunto:"go-preeclampsia", frente:"Hipertensão gestacional x pré-eclâmpsia?", verso:"Gestacional: HAS após 20 sem, ISOLADA (sem proteinúria/lesão). Pré-eclâmpsia: após 20 sem COM proteinúria ou disfunção de órgão." },
  { id:"go-preeclampsia-3", assunto:"go-preeclampsia", frente:"A mudança que a banca cobra na pré-eclâmpsia?", verso:"A PROTEINÚRIA NÃO é mais obrigatória. Fecha com PA≥140/90 após 20 sem + proteinúria OU disfunção de órgão-alvo." },
  { id:"go-preeclampsia-4", assunto:"go-preeclampsia", frente:"Critérios de disfunção de órgão que fecham pré-eclâmpsia sem proteinúria?", verso:"Plaquetas <100.000, creatinina >1,1 (ou dobro), transaminases dobradas, EAP, sintomas cerebrais/visuais." },
  { id:"go-preeclampsia-5", assunto:"go-preeclampsia", frente:"Qual a doença POR TRÁS da pré-eclâmpsia?", verso:"Da PLACENTA: invasão trofoblástica falha → placenta isquêmica libera fatores que agridem o endotélio materno. 'Bate no rim, fígado, cérebro e pulmão, não só na pressão.'" },
  { id:"go-preeclampsia-6", assunto:"go-preeclampsia", frente:"Sinais de GRAVIDADE (alguns) na pré-eclâmpsia?", verso:"PAS≥160 ou PAD≥110, cefaleia persistente, sintomas visuais, dor epigástrica, plaquetopenia. 'Gravidade define o ritmo da conduta.'" },
  { id:"go-preeclampsia-7", assunto:"go-preeclampsia", frente:"Hipertensão crônica na gestação: quando?", verso:"HAS que já existia OU aparece ANTES de 20 semanas. 'Pressão alta cedo = crônica.'" },
  { id:"go-preeclampsia-8", assunto:"go-preeclampsia", frente:"O que é pré-eclâmpsia SOBREPOSTA?", verso:"A hipertensa crônica que piora e desenvolve pré-eclâmpsia. 'A crônica que virou pré-eclâmpsia.'" },
  { id:"go-preeclampsia-9", assunto:"go-preeclampsia", frente:"Por que as síndromes hipertensivas são tão importantes?", verso:"Principal causa de morte materna no Brasil — e quase toda morte por elas é EVITÁVEL." },
  { id:"go-preeclampsia-10", assunto:"go-preeclampsia", frente:"Como a proteinúria pode ser demonstrada?", verso:"≥300 mg/24h, OU relação proteína/creatinina ≥0,3, OU fita reagente 1+. Qualquer uma serve." },
  { id:"go-partograma-1", assunto:"go-partograma", frente:"Os 4 períodos do trabalho de parto?", verso:"Dilatação (1º), Expulsivo (2º), Dequitação (3º, placenta), 4º período de Greenberg (1ª hora, vigia hemorragia)." },
  { id:"go-partograma-2", assunto:"go-partograma", frente:"A partir de quantos cm começa a fase ativa hoje?", verso:"5 a 6 cm — não mais 4 cm. 'A fase ativa foi adiada para 5-6 cm.'" },
  { id:"go-partograma-3", assunto:"go-partograma", frente:"O que aconteceu com a curva de Friedman?", verso:"Foi SUPERADA — o parto progride mais devagar do que se pensava. 'Dilatação lenta com mãe e bebê bem é NORMAL.'" },
  { id:"go-partograma-4", assunto:"go-partograma", frente:"Por que aplicar Friedman ao pé da letra é ruim?", verso:"Gera diagnóstico falso de 'parada de progressão' e cesárea desnecessária. 'Muita cesárea no Brasil nasceu disso.'" },
  { id:"go-partograma-5", assunto:"go-partograma", frente:"O que são os planos de DeLee?", verso:"Medem a altura da apresentação, referência nas espinhas isquiáticas = plano ZERO. Acima: negativos; abaixo: positivos." },
  { id:"go-partograma-6", assunto:"go-partograma", frente:"O mecanismo do parto (sequência de movimentos)?", verso:"Insinuação, descida, flexão, rotação interna, desprendimento (deflexão), rotação externa, desprendimento dos ombros." },
  { id:"go-partograma-7", assunto:"go-partograma", frente:"O que é o partograma?", verso:"Registro gráfico do trabalho de parto: dilatação, descida, contrações, BCF, líquido amniótico e intervenções." },
  { id:"go-partograma-8", assunto:"go-partograma", frente:"Plano zero de DeLee corresponde a quê?", verso:"Às espinhas isquiáticas. 'Zero é a linha das espinhas; abaixo o bebê já desce pra saída.'" },
  { id:"go-partograma-9", assunto:"go-partograma", frente:"Dilatação lenta com mãe e bebê bem: o que fazer?", verso:"NADA de diagnosticar parada de progressão nem indicar cesárea. 'Lento e seguro não é distócia.'" },
  { id:"go-partograma-10", assunto:"go-partograma", frente:"O que é a variedade de posição?", verso:"Para onde aponta a nuca do bebê (ex.: occípito-esquerda-anterior). Avaliada junto da altura." },
{ id:"go-contracepcao-1", assunto:"go-contracepcao", frente:"Uso perfeito x uso típico — o que muda?", verso:"Perfeito = laboratório, sem falha humana. Típico = vida real, com esquecimento. 'A pílula cai muito no típico porque depende de lembrar.'" },
  { id:"go-contracepcao-2", assunto:"go-contracepcao", frente:"Por que os LARC (DIU, implante) são superiores?", verso:"Não dependem do usuário → eficácia >99% nos dois cenários. 'Quanto menos depende da memória, mais funciona.'" },
  { id:"go-contracepcao-3", assunto:"go-contracepcao", frente:"As 4 categorias de elegibilidade da OMS?", verso:"1 = sem restrição; 2 = benefício supera risco; 3 = risco supera benefício (evitar); 4 = risco INACEITÁVEL (não usar)." },
  { id:"go-contracepcao-4", assunto:"go-contracepcao", frente:"O que a categoria 4 do combinado significa?", verso:"Estrogênio PROIBIDO. 'A prova quase sempre pergunta quando o estrogênio não pode.'" },
  { id:"go-contracepcao-5", assunto:"go-contracepcao", frente:"Enxaqueca COM aura + estrogênio: qual categoria?", verso:"Categoria 4 (proibido, em qualquer idade) — risco de AVC. 'Aura fecha a porta do estrogênio.'" },
  { id:"go-contracepcao-6", assunto:"go-contracepcao", frente:"Tabagismo e estrogênio: quando é proibido?", verso:"≥35 anos que fuma ≥15 cigarros/dia = categoria 4. 'Fumante madura e pesada não usa combinado.'" },
  { id:"go-contracepcao-7", assunto:"go-contracepcao", frente:"Outras categorias 4 do estrogênio?", verso:"Hipertensão grave, TVP/embolia atual, alguns cânceres. 'Situações de risco vascular inaceitável.'" },
  { id:"go-contracepcao-8", assunto:"go-contracepcao", frente:"Os dois eixos que a prova cobra em contracepção?", verso:"Eficácia real (perfeito x típico) e ELEGIBILIDADE (critérios OMS). 'Funciona? E pode usar?'" },
  { id:"go-contracepcao-9", assunto:"go-contracepcao", frente:"O que são LARC?", verso:"Contraceptivos Reversíveis de Longa Ação: DIU e implante. Eficácia altíssima e independente do usuário." },
  { id:"go-contracepcao-10", assunto:"go-contracepcao", frente:"A lógica moderna da contracepção?", verso:"Quanto MENOS o método depende da pessoa lembrar, mais ele funciona na vida real. Por isso os LARC brilham." },
  { id:"go-corrimentos-1", assunto:"go-corrimentos", frente:"As 3 perguntas que resolvem corrimento vaginal?", verso:"Qual a COR/consistência? Tem ODOR? Tem PRURIDO? Três quadros dominam." },
  { id:"go-corrimentos-2", assunto:"go-corrimentos", frente:"Vaginose bacteriana: cara clínica?", verso:"Corrimento branco-acinzentado, fino, ODOR DE PEIXE que piora após relação/menstruação, SEM prurido. 'Desequilíbrio da flora, não infecção invasiva.'" },
  { id:"go-corrimentos-3", assunto:"go-corrimentos", frente:"Achados laboratoriais da vaginose?", verso:"pH >4,5, teste das aminas (KOH) positivo, clue cells. Trata com METRONIDAZOL, NÃO trata o parceiro." },
  { id:"go-corrimentos-4", assunto:"go-corrimentos", frente:"Candidíase: cara clínica?", verso:"Corrimento branco GRUMOSO (leite coalhado), SEM odor, PRURIDO INTENSO, ardor, hiperemia. 'O oposto da vaginose no prurido.'" },
  { id:"go-corrimentos-5", assunto:"go-corrimentos", frente:"O detalhe que separa candidíase das outras duas?", verso:"pH NORMAL (<4,5). 'Só a candidíase mantém o pH normal.'" },
  { id:"go-corrimentos-6", assunto:"go-corrimentos", frente:"O que favorece candidíase?", verso:"Diabetes descompensado, antibiótico recente, gestação, imunossupressão. 'Procure o que abriu a porta.'" },
  { id:"go-corrimentos-7", assunto:"go-corrimentos", frente:"Tricomoníase: cara clínica e o achado clássico?", verso:"Corrimento amarelo-esverdeado, BOLHOSO, abundante, com odor e prurido. Colo em framboesa/morango (colpite). pH >4,5." },
  { id:"go-corrimentos-8", assunto:"go-corrimentos", frente:"Qual das três é IST de verdade?", verso:"A TRICOMONÍASE — trata a parceria. Vaginose e candidíase não são ISTs clássicas." },
  { id:"go-corrimentos-9", assunto:"go-corrimentos", frente:"Vaginose x candidíase — prurido e odor?", verso:"Vaginose: odor de peixe, SEM prurido. Candidíase: SEM odor, prurido intenso. 'Cheiro na vaginose, coceira na cândida.'" },
  { id:"go-corrimentos-10", assunto:"go-corrimentos", frente:"Como tratar a candidíase?", verso:"Azólico (fluconazol oral ou tópico). Não trata parceria assintomática." },
  { id:"go-sua-1", assunto:"go-sua", frente:"O 1º passo obrigatório diante de SUA em idade fértil?", verso:"EXCLUIR GRAVIDEZ com beta-hCG. 'Aborto, ectópica e mola se apresentam sangrando — esquecer é o erro mais grosseiro.'" },
  { id:"go-sua-2", assunto:"go-sua", frente:"O 2º passo antes do diagnóstico no SUA?", verso:"Avaliar estabilidade hemodinâmica. 'Sangramento intenso é urgência antes de ser diagnóstico.'" },
  { id:"go-sua-3", assunto:"go-sua", frente:"O mnemônico das causas de SUA?", verso:"PALM-COEIN. PALM = estruturais (vê na imagem); COEIN = não estruturais (imagem não mostra)." },
  { id:"go-sua-4", assunto:"go-sua", frente:"O que é PALM (causas estruturais)?", verso:"Pólipo, Adenomiose, Leiomioma (mioma), Malignidade/hiperplasia. 'As que você VÊ na imagem.'" },
  { id:"go-sua-5", assunto:"go-sua", frente:"O que é COEIN (causas não estruturais)?", verso:"Coagulopatia, disfunção Ovulatória, Endometrial, Iatrogênica, Não classificada. 'As que a imagem não mostra.'" },
  { id:"go-sua-6", assunto:"go-sua", frente:"Por que a FIGO aposentou menorragia/metrorragia?", verso:"Confundiam mais do que explicavam. Hoje se descreve o que se vê (volume, duração, frequência, regularidade)." },
  { id:"go-sua-7", assunto:"go-sua", frente:"Na adolescente, causa comum de SUA?", verso:"Imaturidade do eixo (disfunção ovulatória). Sangramento por anovulação." },
  { id:"go-sua-8", assunto:"go-sua", frente:"Qual o melhor atalho para as causas de SUA?", verso:"A IDADE — orienta a hipótese mais provável. 'A faixa etária estreita o PALM-COEIN.'" },
  { id:"go-sua-9", assunto:"go-sua", frente:"O que é a letra 'I' de iatrogênica no PALM-COEIN?", verso:"Medicamentos, DIU, anticoagulante, hormônios. 'Causa criada por intervenção.'" },
  { id:"go-sua-10", assunto:"go-sua", frente:"Como definir SUA?", verso:"Qualquer alteração no volume, duração, frequência ou regularidade do sangramento uterino." },
  { id:"go-climaterio-1", assunto:"go-climaterio", frente:"Climatério x menopausa — a diferença que a prova troca?", verso:"Climatério = FASE de transição (dura anos). Menopausa = EVENTO, a última menstruação. 'Fase x evento.'" },
  { id:"go-climaterio-2", assunto:"go-climaterio", frente:"Como se diagnostica a menopausa?", verso:"RETROSPECTIVO: após 12 meses consecutivos de amenorreia. Idade média ~50 anos (45–55)." },
  { id:"go-climaterio-3", assunto:"go-climaterio", frente:"Amenorreia por menopausa abaixo dos 40 anos: o que é?", verso:"NÃO é menopausa — é insuficiência ovariana prematura, e exige investigação." },
  { id:"go-climaterio-4", assunto:"go-climaterio", frente:"Mulher >45 anos com sintomas típicos: precisa dosar FSH?", verso:"NÃO — o diagnóstico é CLÍNICO. 'Não peça FSH de rotina nesse cenário.'" },
  { id:"go-climaterio-5", assunto:"go-climaterio", frente:"Sintomas vasomotores: quais são e o destino?", verso:"Fogachos, ondas de calor, sudorese noturna. Incomodam muito mas MELHORAM com o tempo." },
  { id:"go-climaterio-6", assunto:"go-climaterio", frente:"Síndrome geniturinária da menopausa: o que é e o destino?", verso:"Secura vaginal, dispareunia, urgência, ITU de repetição. É PROGRESSIVA — sem tratamento, PIORA. 'O oposto dos fogachos.'" },
  { id:"go-climaterio-7", assunto:"go-climaterio", frente:"Consequências de longo prazo da queda do estrogênio?", verso:"Acelera perda óssea (osteoporose) e aumenta risco cardiovascular." },
  { id:"go-climaterio-8", assunto:"go-climaterio", frente:"Vasomotores x geniturinária — qual melhora e qual piora?", verso:"Vasomotores melhoram sozinhos; geniturinária piora sem tratamento. 'Calor passa, secura avança.'" },
  { id:"go-climaterio-9", assunto:"go-climaterio", frente:"Outros sintomas do climatério além dos vasomotores?", verso:"Distúrbio do sono e alterações de humor. Somam-se aos fogachos." },
  { id:"go-climaterio-10", assunto:"go-climaterio", frente:"O que é a menopausa precoce/insuficiência ovariana prematura?", verso:"Falência ovariana antes dos 40 anos — exige investigação, não é o climatério normal." },
{ id:"ped-desidratacao-1", assunto:"ped-desidratacao", frente:"Na diarreia aguda, o que de fato mata a criança?", verso:"A DESIDRATAÇÃO, não a infecção em si. Por isso o foco é avaliar o grau e repor líquidos. 'O vilão é a perda de água, não o germe.'" },
  { id:"ped-desidratacao-2", assunto:"ped-desidratacao", frente:"Como se avalia desidratação na criança?", verso:"CLINICAMENTE: estado geral, olhos (encovados?), sede (bebe com avidez? não bebe?), sinal da prega. 'Sem exame de sangue — é olho clínico.'" },
