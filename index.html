  { id:"ped-desidratacao-3", assunto:"ped-desidratacao", frente:"A regra prática dos 3 planos?", verso:"'A em casa, B na unidade (oral), C na veia.' Plano A sem desidratação, B com desidratação, C grave/choque." },
  { id:"ped-desidratacao-4", assunto:"ped-desidratacao", frente:"Plano A: o que é?", verso:"Sem desidratação — orientação e reidratação em CASA, mantendo a alimentação." },
  { id:"ped-desidratacao-5", assunto:"ped-desidratacao", frente:"Plano B: o que é?", verso:"Com desidratação sem choque — TRO SUPERVISIONADA na unidade, soro oral em volume calculado por algumas horas." },
  { id:"ped-desidratacao-6", assunto:"ped-desidratacao", frente:"Plano C: o que é?", verso:"Desidratação grave ou choque — hidratação VENOSA imediata. 'Criança em choque vai direto pra veia.'" },
  { id:"ped-desidratacao-7", assunto:"ped-desidratacao", frente:"Criança em choque ou que não consegue beber: conduta?", verso:"Plano C (venoso) DIRETO — não se insiste na via oral. 'Não bebe = não perde tempo com soro oral.'" },
  { id:"ped-desidratacao-8", assunto:"ped-desidratacao", frente:"Antibiótico é rotina na diarreia aguda?", verso:"NÃO — a maioria é viral. Fica para situações específicas (disenteria com gravidade, cólera). 'Diarreia não é sinônimo de antibiótico.'" },
  { id:"ped-desidratacao-9", assunto:"ped-desidratacao", frente:"O zinco na diarreia — para quê?", verso:"Reduz duração e gravidade. Indicado pelo MS na diarreia aguda da criança. 'Zinco encurta a diarreia.'" },
  { id:"ped-desidratacao-10", assunto:"ped-desidratacao", frente:"Mantém a alimentação durante a diarreia?", verso:"SIM — inclusive o aleitamento materno. 'Não suspende comida; continua alimentando.'" },
  { id:"ped-respiratorio-1", assunto:"ped-respiratorio", frente:"O erro clássico nas IVAS?", verso:"Medicalizar RESFRIADO com antibiótico. A maioria das IVAS é viral e autolimitada. 'Resfriado não pede antibiótico.'" },
  { id:"ped-respiratorio-2", assunto:"ped-respiratorio", frente:"Bronquiolite: idade típica e agente?", verso:"Lactente <2 anos, quase sempre pelo VSR (vírus sincicial respiratório). Começa como resfriado e evolui com chiado." },
  { id:"ped-respiratorio-3", assunto:"ped-respiratorio", frente:"Tratamento da bronquiolite?", verso:"SUPORTE: hidratação, oxigênio se preciso, desobstrução nasal. 'Broncodilatador e corticoide NÃO funcionam de rotina — ao contrário da asma.'" },
  { id:"ped-respiratorio-4", assunto:"ped-respiratorio", frente:"O que separa bronquiolite de asma no tratamento?", verso:"Na bronquiolite, broncodilatador/corticoide não ajudam de rotina; na asma, são o pilar. 'Chiado do lactente ≠ chiado do asmático.'" },
  { id:"ped-respiratorio-5", assunto:"ped-respiratorio", frente:"1ª linha da pneumonia típica em criança de 2m–5 anos?", verso:"AMOXICILINA 50 mg/kg/dia (pneumococo). 'Pneumonia comum de criança = amoxicilina.'" },
  { id:"ped-respiratorio-6", assunto:"ped-respiratorio", frente:"Pneumonia atípica em escolar/adolescente: agente e droga?", verso:"Mycoplasma pneumoniae → macrolídeo (azitromicina). 'Atípica do maiorzinho pede macrolídeo.'" },
  { id:"ped-respiratorio-7", assunto:"ped-respiratorio", frente:"Os sinais de gravidade que decidem internar?", verso:"Idade <2 meses, tiragem, taquipneia acima do corte, saturação <92%, toxemia, derrame, não aceita líquidos." },
  { id:"ped-respiratorio-8", assunto:"ped-respiratorio", frente:"O 'pulo do gato' da avaliação respiratória?", verso:"Contar a frequência respiratória pela IDADE (OMS define taquipneia por faixas). 'Taquipneia é o sinal que não se pode perder.'" },
  { id:"ped-respiratorio-9", assunto:"ped-respiratorio", frente:"Por que a maioria das IVAS é autolimitada?", verso:"São virais — resolvem sozinhas com suporte. 'Vírus não responde a antibiótico.'" },
  { id:"ped-respiratorio-10", assunto:"ped-respiratorio", frente:"Bebê <2 meses com pneumonia: conduta?", verso:"Internar — a própria idade já é sinal de gravidade. 'Menor de 2 meses não fica em casa.'" },
  { id:"ped-vacinas-1", assunto:"ped-vacinas", frente:"O que se dá AO NASCER?", verso:"BCG (formas graves de TB) + Hepatite B. 'Ao nascer = BCG + hepatite B.'" },
  { id:"ped-vacinas-2", assunto:"ped-vacinas", frente:"As contraindicações VERDADEIRAS de vacina?", verso:"Anafilaxia a dose/componente anterior; e, para vírus VIVO, imunossupressão importante e gestação. 'O resto costuma ser mito.'" },
  { id:"ped-vacinas-3", assunto:"ped-vacinas", frente:"As falsas contraindicações (pegadinha)?", verso:"Resfriado leve, febre baixa, antibiótico, desnutrição, prematuridade, alergia não anafilática. NADA disso contraindica. 'Quase tudo é falsa contraindicação.'" },
  { id:"ped-vacinas-4", assunto:"ped-vacinas", frente:"Criança com quadro leve e vacina atrasada: conduta?", verso:"VACINAR e atualizar o calendário — não adiar. 'Na dúvida com quadro leve, vacina.'" },
  { id:"ped-vacinas-5", assunto:"ped-vacinas", frente:"A vacina HPV mudou como (atualização)?", verso:"DOSE ÚNICA para meninas e meninos de 9 a 14 anos (quadrivalente: 6, 11, 16, 18). 'Agora é uma dose só.'" },
  { id:"ped-vacinas-6", assunto:"ped-vacinas", frente:"Qual vacina da gestante protege o RN e quando?", verso:"dTpa, a CADA gestação — protege o bebê contra coqueluche." },
  { id:"ped-vacinas-7", assunto:"ped-vacinas", frente:"Prematuridade adia vacina?", verso:"NÃO — segue a idade CRONOLÓGICA. 'O prematuro vacina na idade real, não na corrigida.'" },
  { id:"ped-vacinas-8", assunto:"ped-vacinas", frente:"Vacinas de vírus vivo são proibidas em quem?", verso:"Imunossuprimidos importantes e gestantes. Ex.: tríplice viral, febre amarela." },
  { id:"ped-vacinas-9", assunto:"ped-vacinas", frente:"Por que a prova cobra tanto as falsas contraindicações?", verso:"Porque adiar por 'mito' deixa a criança desprotegida. 'Reconhecer o mito evita a perda de oportunidade vacinal.'" },
  { id:"ped-vacinas-10", assunto:"ped-vacinas", frente:"Onde se concentram as principais vacinas do 1º ano?", verso:"Pentavalente, pólio, pneumocócica, rotavírus, meningocócica C, entre outras, em doses e reforços." },
{ id:"ped-desenvolvimento-1", assunto:"ped-desenvolvimento", frente:"Crescimento x desenvolvimento — a diferença?", verso:"Crescimento = ganho de TAMANHO (peso, altura, PC, visto em curvas). Desenvolvimento = ganho de HABILIDADES (motoras, fala, social, vistos em marcos). 'Tamanho x habilidade.'" },
  { id:"ped-desenvolvimento-2", assunto:"ped-desenvolvimento", frente:"A regra de ouro do aleitamento?", verso:"AME (aleitamento materno EXCLUSIVO) até 6 meses — só peito, sem água/chá. Complementado até 2 anos ou mais. 'Nada além do peito até os 6 meses.'" },
  { id:"ped-desenvolvimento-3", assunto:"ped-desenvolvimento", frente:"O erro clássico sobre água/chá no bebê?", verso:"Oferecer água ou chá antes dos 6 meses no bebê em AME é ERRO. 'Peito mata a sede também.'" },
  { id:"ped-desenvolvimento-4", assunto:"ped-desenvolvimento", frente:"Os marcos motores-chave por idade?", verso:"Sustento cefálico ~3m, senta sem apoio ~6m, engatinha/fica em pé ~9m, anda ~12m, primeiras palavras ~12m. 'Senta no 6, anda no 12.'" },
  { id:"ped-desenvolvimento-5", assunto:"ped-desenvolvimento", frente:"O que são sinais de alerta no desenvolvimento?", verso:"Atraso importante frente ao esperado para a idade — pedem investigação. 'A sequência importa mais que a data exata.'" },
  { id:"ped-desenvolvimento-6", assunto:"ped-desenvolvimento", frente:"Criança que 'cai de canal' na curva: o que fazer?", verso:"Investigar — sair do próprio percentil/canal ou ficar muito abaixo do esperado merece avaliação." },
  { id:"ped-desenvolvimento-7", assunto:"ped-desenvolvimento", frente:"O que é a puericultura?", verso:"O acompanhamento periódico da criança SAUDÁVEL — crescimento + desenvolvimento. 'O coração da pediatria na APS.'" },
  { id:"ped-desenvolvimento-8", assunto:"ped-desenvolvimento", frente:"Como se avalia o crescimento?", verso:"Por curvas/percentis ou escore-z de peso, comprimento/altura e perímetro cefálico. 'A criança deve crescer no seu canal.'" },
  { id:"ped-desenvolvimento-9", assunto:"ped-desenvolvimento", frente:"Até quando manter o peito?", verso:"Complementado (peito + comida) até 2 anos ou mais. Exclusivo só até os 6 meses." },
  { id:"ped-desenvolvimento-10", assunto:"ped-desenvolvimento", frente:"Primeiras palavras com sentido: por volta de quando?", verso:"Em torno de 12 meses, junto do andar. 'Um ano: primeiros passos e primeiras palavras.'" },
  { id:"ped-exantematicas-1", assunto:"ped-exantematicas", frente:"As 5 perguntas que organizam as exantemáticas?", verso:"Idade? Pródromo (o que veio ANTES)? Cara da mancha? Como progride? E o que a febre faz quando o exantema surge? 'Cinco perguntas resolvem quase tudo.'" },
  { id:"ped-exantematicas-2", assunto:"ped-exantematicas", frente:"As DUAS exantemáticas que fogem do 'viral e benigno'?", verso:"SARAMPO (mata, emergência de vigilância) e ESCARLATINA (bacteriana, tem antibiótico). 'O resto é suporte; essas duas são o alvo da prova.'" },
  { id:"ped-exantematicas-3", assunto:"ped-exantematicas", frente:"O achado PATOGNOMÔNICO do sarampo?", verso:"Manchas de KOPLIK: pontos brancos sobre base avermelhada na mucosa da bochecha, ANTES do exantema. 'Viu Koplik, fechou sarampo.'" },
  { id:"ped-exantematicas-4", assunto:"ped-exantematicas", frente:"O pródromo do sarampo?", verso:"CATARRAL intenso: febre alta, tosse, coriza e conjuntivite com fotofobia. 'Parece o pior resfriado da vida.'" },
  { id:"ped-exantematicas-5", assunto:"ped-exantematicas", frente:"Como progride o exantema do sarampo e o que a febre faz?", verso:"Maculopapular morbiliforme, começa atrás da orelha/face e desce (CRANIOCAUDAL). Detalhe traiçoeiro: a febre PERSISTE quando o exantema aparece (nas outras, cede). 'Febre que não cede com o exantema = sarampo.'" },
  { id:"ped-exantematicas-6", assunto:"ped-exantematicas", frente:"O tratamento do sarampo tem um 'algo a mais'?", verso:"Suporte + VITAMINA A para toda criança com sarampo — reduz morbimortalidade. 'Sarampo pede vitamina A.'" },
  { id:"ped-exantematicas-7", assunto:"ped-exantematicas", frente:"A principal causa de óbito no sarampo?", verso:"Pneumonia (também otite e encefalite). 'O sarampo mata pelo pulmão.'" },
  { id:"ped-exantematicas-8", assunto:"ped-exantematicas", frente:"A obrigação de saúde pública no sarampo?", verso:"NOTIFICAÇÃO IMEDIATA (até 24h) de todo caso SUSPEITO — não espera confirmar laboratório. 'Suspeitou, notifica em 24h.'" },
  { id:"ped-exantematicas-9", assunto:"ped-exantematicas", frente:"Escarlatina: por que é diferente das virais?", verso:"É BACTERIANA (estreptococo) — tem antibiótico. Língua em framboesa, exantema em lixa. 'A única exantemática clássica com antibiótico.'" },
  { id:"ped-exantematicas-10", assunto:"ped-exantematicas", frente:"A maioria das exantemáticas: qual o tratamento?", verso:"Suporte — são virais e benignas. As exceções que exigem ação são sarampo e escarlatina." },
  { id:"ped-ictericia-1", assunto:"ped-ictericia", frente:"Por que quase todo RN fica ictérico?", verso:"Produz MAIS bilirrubina (mais hemácias, que vivem menos) e elimina MENOS (fígado imaturo + reabsorção êntero-hepática). 'Fabrica muito, despacha pouco.'" },
  { id:"ped-ictericia-2", assunto:"ped-ictericia", frente:"O item MAIS cobrado de todos na icterícia neonatal?", verso:"Icterícia nas primeiras 24 HORAS de vida NUNCA é fisiológica — sem exceção. 'Amarelou no 1º dia? Patológico, ponto.'" },
  { id:"ped-ictericia-3", assunto:"ped-ictericia", frente:"Quando aparece a icterícia FISIOLÓGICA?", verso:"DEPOIS de 24-36h, pico no 3º-5º dia, à custa de bilirrubina INDIRETA, some em 1-2 semanas, bebê bem. 'Fisiológica chega depois do 1º dia.'" },
  { id:"ped-ictericia-4", assunto:"ped-ictericia", frente:"As zonas de Kramer — o que são e a ressalva?", verso:"Progressão de cima pra baixo: 1=face, 2=tronco até umbigo, 3=abdome baixo/coxas, 4=braços/pernas, 5=mãos/pés. Ressalva: Kramer só ESTIMA; decide-se pela dosagem. 'Quanto mais baixo, maior o nível.'" },
  { id:"ped-ictericia-5", assunto:"ped-ictericia", frente:"Os sinais de icterícia PATOLÓGICA?", verso:"(1) <24h de vida; (2) sobe >5 mg/dL/dia; (3) bilirrubina DIRETA elevada (colestase); (4) persiste >2 semanas no termo; (5) RN doente." },
  { id:"ped-ictericia-6", assunto:"ped-ictericia", frente:"Bilirrubina DIRETA elevada no RN significa o quê?", verso:"Colestase — e colestase NUNCA é fisiológica. Sempre investigar. 'Direta alta = alarme, sempre.'" },
  { id:"ped-ictericia-7", assunto:"ped-ictericia", frente:"Icterícia nas primeiras 24h: qual mecanismo pensar?", verso:"HEMÓLISE — principalmente incompatibilidade (Rh: mãe Rh- sensibilizada; ABO). 'Amarelou cedo = está quebrando hemácia.'" },
  { id:"ped-ictericia-8", assunto:"ped-ictericia", frente:"Como se decide a conduta na icterícia (não é pela pele)?", verso:"Pela DOSAGEM de bilirrubina (total e frações), plotada em gráfico por horas de vida. Kramer só orienta. 'A pele estima, a dosagem decide.'" },
  { id:"ped-ictericia-9", assunto:"ped-ictericia", frente:"Icterícia que persiste além de 2 semanas no RN a termo?", verso:"É patológica — investigar (pensar colestase, hipotireoidismo, etc.). 'Passou de 2 semanas, não é mais fisiológica.'" },
  { id:"ped-ictericia-10", assunto:"ped-ictericia", frente:"Qual o tratamento clássico da hiperbilirrubinemia indireta?", verso:"Fototerapia (e, em casos graves, exsanguineotransfusão) — para prevenir o kernicterus (impregnação cerebral). 'Luz azul quebra a bilirrubina na pele.'" },
{ id:"ped-febre-1", assunto:"ped-febre", frente:"O que é febre sem sinais localizatórios (FSSL)?", verso:"Febre de poucos dias em que anamnese e exame NÃO acham a origem. Maioria viral, mas o protocolo existe pelo medo de infecção bacteriana grave." },
  { id:"ped-febre-2", assunto:"ped-febre", frente:"A regra que salva questão na febre sem foco do lactente?", verso:"PEÇA URINA — a ITU é a causa bacteriana mais comum de febre sem foco no lactente e NÃO dá sintoma. 'Ela não vai contar que dói pra urinar.'" },
  { id:"ped-febre-3", assunto:"ped-febre", frente:"RN <28 dias com febre ≥38°C: conduta?", verso:"INTERNA, sempre. Investigação completa (hemograma, hemocultura, urina/urocultura e LÍQUOR) + antibiótico empírico. 'Neonato febril não vai pra casa.'" },
  { id:"ped-febre-4", assunto:"ped-febre", frente:"Por que não existe neonato febril 'de baixo risco'?", verso:"Imune imaturo, apresentação pobre, e ele despenca rápido. 'No RN, febre é internação e investigação total.'" },
  { id:"ped-febre-5", assunto:"ped-febre", frente:"De 1 a 3 meses com febre sem foco: conduta?", verso:"Protocolo: aparência + exames (leucograma, PCR/procalcitonina, urina). Só os de BAIXO RISCO por critério podem ser observados." },
  { id:"ped-febre-6", assunto:"ped-febre", frente:"Acima de 3 meses, vacinado e com bom estado geral?", verso:"Pode observar e tratar conforme o foco — mantendo a urina no radar quando não há foco." },
  { id:"ped-febre-7", assunto:"ped-febre", frente:"O que informa gravidade: o termômetro ou o estado geral?", verso:"O ESTADO GERAL. 'O termômetro engana; quem manda é a toxemia.'" },
  { id:"ped-febre-8", assunto:"ped-febre", frente:"Sinais de alerta (toxemia) na criança febril?", verso:"Letargia/irritabilidade que não cede ao colo, perfusão ruim (enchimento lento, extremidades frias), taquipneia, gemência, recusa alimentar, hipoatividade." },
  { id:"ped-febre-9", assunto:"ped-febre", frente:"A idade mudou a conduta na febre sem foco — resuma?", verso:"Quanto MENOR, mais rígido: RN interna sempre; 1-3m protocolo; >3m vacinado e bem pode observar. 'A idade comanda.'" },
  { id:"ped-febre-10", assunto:"ped-febre", frente:"Convulsão febril típica: como é?", verso:"Crise generalizada, breve (<15 min), única em 24h, entre 6 meses e 5 anos, com febre e sem infecção do SNC. Boa evolução." },
  { id:"ped-violencia-1", assunto:"ped-violencia", frente:"As 5 formas de violência contra a criança?", verso:"Física, psicológica, sexual, NEGLIGÊNCIA (a mais frequente e mais invisível) e Munchausen por procuração. 'A negligência é a campeã silenciosa.'" },
  { id:"ped-violencia-2", assunto:"ped-violencia", frente:"O que acende o alerta de maus-tratos (não é a lesão em si)?", verso:"A INCOMPATIBILIDADE: lesão que não combina com a história contada nem com o estágio de desenvolvimento. 'Bebê que não anda não faz hematoma de canela.'" },
  { id:"ped-violencia-3", assunto:"ped-violencia", frente:"Sinais que sugerem violência física?", verso:"Histórias que mudam, atraso em procurar atendimento, lesões em VÁRIOS estágios de cicatrização, marcas com formato de objeto (cinto, mão), queimadura em luva/meia (imersão)." },
  { id:"ped-violencia-4", assunto:"ped-violencia", frente:"O trio da SÍNDROME DO BEBÊ SACUDIDO?", verso:"Hemorragias retinianas + hematoma subdural + ausência de trauma que explique. 'Esse trio fecha o diagnóstico.'" },
  { id:"ped-violencia-5", assunto:"ped-violencia", frente:"Diante de SUSPEITA de violência (só suspeita), o que a lei obriga?", verso:"NOTIFICAÇÃO COMPULSÓRIA e IMEDIATA (até 24h) — não precisa de prova. 'Suspeitou, notifica; não é o médico que investiga o crime.'" },
  { id:"ped-violencia-6", assunto:"ped-violencia", frente:"Por dois caminhos que se somam, a notificação é feita como?", verso:"Ficha de notificação (SINAN) E comunicação ao Conselho Tutelar. 'Os dois canais, sempre.'" },
  { id:"ped-violencia-7", assunto:"ped-violencia", frente:"O erro do candidato 'por excesso de zelo' na violência?", verso:"Achar que precisa PROVAR antes de notificar. Não precisa — a suspeita já obriga a notificação. 'Provar não é papel do médico.'" },
  { id:"ped-violencia-8", assunto:"ped-violencia", frente:"Queimadura em 'luva' ou 'meia' com limite nítido sugere?", verso:"Imersão FORÇADA em água quente — sinal de violência física. 'Limite nítido = mão de adulto mergulhando.'" },
  { id:"ped-violencia-9", assunto:"ped-violencia", frente:"Fraturas suspeitas de maus-tratos em lactente?", verso:"Ossos longos, arcos costais ou metafisárias — em quem ainda não tem mobilidade pra causá-las sozinho." },
  { id:"ped-violencia-10", assunto:"ped-violencia", frente:"O que é Munchausen por procuração?", verso:"O cuidador INVENTA ou PROVOCA doença na criança para obter atenção médica. Forma grave e traiçoeira de violência." },
  { id:"ped-reanimacao-1", assunto:"ped-reanimacao", frente:"As 3 perguntas de ouro ao nascer?", verso:"Termo? Respirando ou chorando? Tônus bom? SIM às três → fica com a mãe. Qualquer NÃO → mesa de reanimação. 'Três sins, pele a pele.'" },
  { id:"ped-reanimacao-2", assunto:"ped-reanimacao", frente:"RN que vai bem: o que fazer com o cordão?", verso:"CLAMPEAMENTO TARDIO (1-3 min), contato pele a pele com a mãe, cuidados de rotina. 'Não corta o cordão com pressa.'" },
  { id:"ped-reanimacao-3", assunto:"ped-reanimacao", frente:"Os passos iniciais na mesa (30 segundos)?", verso:"Prover CALOR, POSICIONAR (leve extensão), ASPIRAR só se necessário, SECAR e ESTIMULAR. 'Tudo em meio minuto.'" },
  { id:"ped-reanimacao-4", assunto:"ped-reanimacao", frente:"O erro clássico da aspiração no RN?", verso:"Aspirar de ROTINA — provoca bradicardia reflexa e apneia. Aspira SÓ se necessário, boca antes das narinas. 'Aspiração de rotina é erro.'" },
  { id:"ped-reanimacao-5", assunto:"ped-reanimacao", frente:"Qual sinal COMANDA a reanimação neonatal?", verso:"A FREQUÊNCIA CARDÍACA. 'A FC manda em tudo na reanimação do RN.'" },
  { id:"ped-reanimacao-6", assunto:"ped-reanimacao", frente:"FC <100, apneia ou respiração irregular: conduta?", verso:"VENTILAÇÃO COM PRESSÃO POSITIVA (VPP). 'FC abaixo de 100 = VPP já.'" },
  { id:"ped-reanimacao-7", assunto:"ped-reanimacao", frente:"Qual a manobra MAIS IMPORTANTE da reanimação neonatal?", verso:"A VPP (ventilação com pressão positiva). 'O problema do RN que nasce mal é quase sempre respiratório — por isso VPP é o coração.'" },
  { id:"ped-reanimacao-8", assunto:"ped-reanimacao", frente:"Prematuro <34 semanas: como evitar hipotermia?", verso:"Saco plástico e touca, SEM secar. Meta térmica 36,5-37,5°C. 'A hipotermia mata o prematuro.'" },
  { id:"ped-reanimacao-9", assunto:"ped-reanimacao", frente:"Que porcentagem de RN precisa de ajuda e de manobras avançadas?", verso:"~10% precisam de alguma ajuda; só ~1% de manobras avançadas. 'Poucos, mas como nascem milhões, é muita gente.'" },
  { id:"ped-reanimacao-10", assunto:"ped-reanimacao", frente:"Por que tudo começa ANTES do nascimento?", verso:"Anamnese materna, material testado e equipe preparada — a diferença entre viver bem e sequela se decide em minutos." },
{ id:"ped-triagem-1", assunto:"ped-triagem", frente:"Teste do PEZINHO: quando colher e por quê esse prazo?", verso:"3º ao 5º DIA de vida. Cedo demais dá falso-negativo (fenilalanina precisa de leite p/ subir + pico fisiológico do TSH); tarde demais perde a janela de tratamento." },
  { id:"ped-triagem-2", assunto:"ped-triagem", frente:"As 6 doenças do pezinho clássico do SUS?", verso:"Fenilcetonúria, hipotireoidismo congênito, doença falciforme/hemoglobinopatias, fibrose cística, hiperplasia adrenal congênita, deficiência de biotinidase." },
  { id:"ped-triagem-3", assunto:"ped-triagem", frente:"O que a Lei 14.154/2021 mudou no pezinho?", verso:"Ampliou para 50+ doenças, com implantação PROGRESSIVA em 5 etapas — cobertura varia por estado/momento. 'Confira o que já está vigente.'" },
  { id:"ped-triagem-4", assunto:"ped-triagem", frente:"Teste da ORELHINHA: quando e o que detecta?", verso:"Emissões otoacústicas, antes da alta ou até o 1º mês. Detecta SURDEZ — e o cérebro tem janela pra linguagem, então achar cedo muda a vida." },
  { id:"ped-triagem-5", assunto:"ped-triagem", frente:"Teste do OLHINHO: quando e o que rastreia?", verso:"Reflexo vermelho, antes da alta e REPETIDO na puericultura. Rastreia catarata congênita, retinoblastoma e glaucoma congênito." },
  { id:"ped-triagem-6", assunto:"ped-triagem", frente:"Reflexo vermelho ausente/assimétrico/alterado: conduta?", verso:"Encaminhamento ao oftalmologista — regra dura, sem esperar. 'Olhinho alterado = oftalmo já.'" },
  { id:"ped-triagem-7", assunto:"ped-triagem", frente:"Por que colher o pezinho cedo demais falha?", verso:"O bebê precisa ter recebido proteína/leite pra fenilalanina subir, e o TSH tem pico fisiológico logo após o nascimento — daria falso-negativo." },
  { id:"ped-triagem-8", assunto:"ped-triagem", frente:"Qual o valor da triagem neonatal em saúde pública?", verso:"Detecta, em dias e barato, doenças que descobertas tarde já deixaram sequela irreversível. 'A janela mais barata e eficaz da saúde pública.'" },
  { id:"ped-triagem-9", assunto:"ped-triagem", frente:"O teste do coraçãozinho detecta o quê?", verso:"Oximetria de pulso (pré e pós-ductal) — rastreia cardiopatias congênitas críticas (ducto-dependentes) antes da alta." },
  { id:"ped-triagem-10", assunto:"ped-triagem", frente:"A lógica geral dos testes de triagem?", verso:"Saber de cada um: QUANDO se faz e O QUE detecta. 'Pezinho no 3º-5º dia, orelhinha e olhinho antes da alta.'" },
  { id:"ped-cardiopatias-1", assunto:"ped-cardiopatias", frente:"A pergunta que organiza cardiopatia congênita?", verso:"O bebê fica AZUL ou não? Acianótica (shunt E→D, hiperfluxo, IC) x cianótica (shunt D→E, sangue sem O2 na sistêmica). 'Azul ou não azul.'" },
  { id:"ped-cardiopatias-2", assunto:"ped-cardiopatias", frente:"Qual a cardiopatia congênita MAIS COMUM?", verso:"CIV (comunicação interventricular) — acianótica. 'A campeã de todas é a CIV.'" },
  { id:"ped-cardiopatias-3", assunto:"ped-cardiopatias", frente:"O quadro típico da ACIANÓTICA no lactente?", verso:"IC: taquipneia, sudorese e cansaço DURANTE A MAMADA (não dá conta de mamar), baixo ganho de peso, hepatomegalia, sopro. 'Cansa pra mamar.'" },
  { id:"ped-cardiopatias-4", assunto:"ped-cardiopatias", frente:"Os '5 T' das cardiopatias CIANÓTICAS?", verso:"Tetralogia de Fallot (a mais comum), Transposição das grandes artérias (a mais NEONATAL), Tronco arterioso, atresia Tricúspide, drenagem anômala Total de veias pulmonares." },
  { id:"ped-cardiopatias-5", assunto:"ped-cardiopatias", frente:"Qual cianótica se apresenta mais cedo, já no período neonatal?", verso:"Transposição das grandes artérias. 'Azul logo ao nascer = pensa transposição.'" },
  { id:"ped-cardiopatias-6", assunto:"ped-cardiopatias", frente:"O teste da HIPERÓXIA — como interpreta?", verso:"O2 a 100%: se a saturação MELHORA bem, a causa é PULMONAR; se NÃO melhora, é CARDÍACA (o shunt desvia do pulmão). 'Não melhorou com O2 = coração.'" },
  { id:"ped-cardiopatias-7", assunto:"ped-cardiopatias", frente:"O que são cardiopatias DUCTO-DEPENDENTES?", verso:"Malformações só compatíveis com a vida enquanto o CANAL ARTERIAL está aberto — é ele que leva o sangue aonde precisa. 'Fechou o canal, o bebê descompensa.'" },
  { id:"ped-cardiopatias-8", assunto:"ped-cardiopatias", frente:"Qual droga mantém o canal arterial aberto na emergência?", verso:"Prostaglandina E1 — 'segura o canal aberto' até a correção. Salva o bebê ducto-dependente." },
  { id:"ped-cardiopatias-9", assunto:"ped-cardiopatias", frente:"Por que a acianótica dá hiperfluxo pulmonar?", verso:"Shunt esquerda→direita: sangue já oxigenado volta pro pulmão → sobrecarga → IC. 'Sangue rodando à toa sobrecarrega o pulmão.'" },
  { id:"ped-cardiopatias-10", assunto:"ped-cardiopatias", frente:"Cianose que não melhora com oxigênio: o que pensar?", verso:"Cardiopatia cianótica com shunt — o O2 ofertado não alcança o sangue que desviou do pulmão." },
  { id:"ped-congenitas-1", assunto:"ped-congenitas", frente:"O que significa a sigla STORCH?", verso:"Sífilis, Toxoplasmose, Outras (parvovírus B19, varicela, zika), Rubéola, Citomegalovírus, Herpes. As infecções que atravessam a placenta." },
  { id:"ped-congenitas-2", assunto:"ped-congenitas", frente:"A regra do MOMENTO da infecção congênita?", verso:"Mais PRECOCE = menor transmissão, MAIOR gravidade. Mais tardia = maior transmissão, menor gravidade. 'Cedo transmite pouco mas estraga muito.'" },
  { id:"ped-congenitas-3", assunto:"ped-congenitas", frente:"Por que muitas congênitas são traiçoeiras?", verso:"São ASSINTOMÁTICAS ao nascer e só aparecem depois (surdez, déficit visual). 'Por isso rastreio e triagem valem mais que o exame do bebê aparentemente saudável.'" },
  { id:"ped-congenitas-4", assunto:"ped-congenitas", frente:"Por que a sífilis congênita é a mais cobrada?", verso:"É 100% EVITÁVEL — sua ocorrência denuncia falha do pré-natal (não testou ou não tratou). 'É o retrato de um sistema que falhou.'" },
  { id:"ped-congenitas-5", assunto:"ped-congenitas", frente:"Sinais do RN com sífilis congênita sintomática?", verso:"Rinite SANGUINOLENTA, PÊNFIGO palmoplantar, periostite/pseudoparalisia de Parrot, hepatoesplenomegalia, icterícia. 'Coriza com sangue + bolha na palma = pense sífilis.'" },
  { id:"ped-congenitas-6", assunto:"ped-congenitas", frente:"Manifestações TARDIAS da sífilis congênita?", verso:"Dentes de Hutchinson, nariz em sela, tíbia em sabre, surdez. 'O quadro clássico que aparece anos depois.'" },
  { id:"ped-congenitas-7", assunto:"ped-congenitas", frente:"O conceito de 'mãe adequadamente tratada' na sífilis?", verso:"Penicilina BENZATINA, esquema completo p/ o estágio, iniciado até 30 DIAS antes do parto, com queda da titulação — e parceiro tratado (critério do MS)." },
  { id:"ped-congenitas-8", assunto:"ped-congenitas", frente:"Toxoplasmose congênita: a tríade clássica?", verso:"Coriorretinite + hidrocefalia + calcificações intracranianas. 'A tríade de Sabin.'" },
  { id:"ped-congenitas-9", assunto:"ped-congenitas", frente:"Rubéola congênita: a tríade clássica?", verso:"Catarata + surdez + cardiopatia (PCA). 'As três marcas da rubéola no feto.'" },
  { id:"ped-congenitas-10", assunto:"ped-congenitas", frente:"O que 'Outras' (o O de STORCH) inclui de mais cobrado hoje?", verso:"Zika (microcefalia), parvovírus B19 (hidropisia), varicela. 'O zika trouxe o O de volta pra prova.'" },
{ id:"mfc-atributos-1", assunto:"mfc-atributos", frente:"Os 4 atributos ESSENCIAIS da APS (Starfield)?", verso:"Primeiro contato (acesso), Longitudinalidade, Integralidade, Coordenação. Os quatro pilares da APS de qualidade." },
  { id:"mfc-atributos-2", assunto:"mfc-atributos", frente:"Primeiro contato / acesso: o que é?", verso:"A APS é o PRIMEIRO recurso que a pessoa procura a cada novo problema. A porta de entrada do sistema." },
  { id:"mfc-atributos-3", assunto:"mfc-atributos", frente:"Longitudinalidade: o que é (e a palavra-chave)?", verso:"Vínculo e acompanhamento da MESMA pessoa/equipe ao longo do TEMPO. Palavra-chave: TEMPO. É o 'me acompanha há anos'." },
  { id:"mfc-atributos-4", assunto:"mfc-atributos", frente:"Integralidade: o que é (e a palavra-chave)?", verso:"Cuidar do CONJUNTO de necessidades (promoção, prevenção, cura, reabilitação), não só a queixa. Palavra-chave: AMPLITUDE." },
  { id:"mfc-atributos-5", assunto:"mfc-atributos", frente:"Coordenação: o que é?", verso:"A APS organiza e integra o cuidado que acontece em OUTROS pontos da rede. A APS é a maestrina da rede." },
  { id:"mfc-atributos-6", assunto:"mfc-atributos", frente:"A pegadinha MAIS frequente dos atributos?", verso:"Confundir LONGITUDINALIDADE (dimensão do TEMPO) com INTEGRALIDADE (AMPLITUDE do cuidado). Tempo x amplitude." },
  { id:"mfc-atributos-7", assunto:"mfc-atributos", frente:"'Sempre atendido pela mesma equipe, que acompanha há anos' — qual atributo?", verso:"LONGITUDINALIDADE (é o tempo/vínculo). Não confundir com integralidade." },
  { id:"mfc-atributos-8", assunto:"mfc-atributos", frente:"Os 3 atributos DERIVADOS da APS?", verso:"Orientação familiar, orientação comunitária, competência cultural. Qualificam a prática além dos 4 essenciais." },
  { id:"mfc-atributos-9", assunto:"mfc-atributos", frente:"Competência cultural: o que é?", verso:"Respeitar a cultura e os valores da população atendida. Atributo derivado." },
  { id:"mfc-atributos-10", assunto:"mfc-atributos", frente:"Orientação comunitária: o que é?", verso:"Conhecer e agir sobre o TERRITÓRIO e a comunidade, não só o indivíduo no consultório." },
  { id:"mfc-rastreio-1", assunto:"mfc-rastreio", frente:"Os 4 níveis de prevenção?", verso:"Primária (evitar surgir), Secundária (detectar cedo sem sintoma), Terciária (reduzir sequela), Quaternária (proteger do EXCESSO de medicina)." },
  { id:"mfc-rastreio-2", assunto:"mfc-rastreio", frente:"O que é prevenção QUATERNÁRIA?", verso:"Proteger o paciente do EXCESSO de medicina: evitar exames, diagnósticos e tratamentos desnecessários. Menos, às vezes, é mais." },
  { id:"mfc-rastreio-3", assunto:"mfc-rastreio", frente:"O que significa 'rastrear bem'?", verso:"Fazer só o que tem evidência de reduzir mortalidade, na faixa e no intervalo certos. Rastreio tem hora e público." },
  { id:"mfc-rastreio-4", assunto:"mfc-rastreio", frente:"O que 'rastrear mal' causa?", verso:"Exames de rotina sem indicação geram sobrediagnóstico, ansiedade, procedimentos e dano direto. Mais exame não é melhor cuidado." },
  { id:"mfc-rastreio-5", assunto:"mfc-rastreio", frente:"O exemplo CAMPEÃO de rastreio inadequado?", verso:"PSA em massa para próstata: NÃO recomendado como rastreio populacional pelo MS (muito sobrediagnóstico). PSA de rotina no assintomático é a alternativa errada." },
  { id:"mfc-rastreio-6", assunto:"mfc-rastreio", frente:"Diante de paciente ASSINTOMÁTICO, a conduta de qualidade?", verso:"Abordar o que muda desfecho (estilo de vida, vacinas, rastreios com evidência) e EVITAR o excesso." },
  { id:"mfc-rastreio-7", assunto:"mfc-rastreio", frente:"Prevenção PRIMÁRIA: exemplos?", verso:"Vacina, cessação do tabagismo: evitam a doença APARECER. Antes de existir a doença." },
  { id:"mfc-rastreio-8", assunto:"mfc-rastreio", frente:"Prevenção SECUNDÁRIA é sinônimo de quê?", verso:"Rastreamento: detectar cedo em quem NÃO tem sintoma. Achar antes de dar sintoma." },
  { id:"mfc-rastreio-9", assunto:"mfc-rastreio", frente:"Prevenção TERCIÁRIA: o que é?", verso:"Reduzir sequelas de doença JÁ instalada (reabilitação). Depois que a doença já está lá." },
  { id:"mfc-rastreio-10", assunto:"mfc-rastreio", frente:"'Mais exame' é sinônimo de melhor cuidado?", verso:"NÃO, muitas vezes é o contrário (dano da prevenção quaternária). Solicitar tudo de rotina costuma ser a resposta errada." },
  { id:"mfc-vigilancia-1", assunto:"mfc-vigilancia", frente:"O que é vigilância em saúde?", verso:"Ações que monitoram doenças/agravos na população para agir rápido: conter surtos, proteger contatos, orientar políticas." },
  { id:"mfc-vigilancia-2", assunto:"mfc-vigilancia", frente:"Qual a ferramenta prática do médico na vigilância?", verso:"A NOTIFICAÇÃO: comunicar oficialmente casos de certas doenças às autoridades. Notificar alimenta o sistema e dispara a resposta." },
  { id:"mfc-vigilancia-3", assunto:"mfc-vigilancia", frente:"Onde se registram as doenças de notificação compulsória?", verso:"No SINAN (Sistema de Informação de Agravos de Notificação). Lista definida pelo MS." },
  { id:"mfc-vigilancia-4", assunto:"mfc-vigilancia", frente:"A regra de ouro da notificação para a prova?", verso:"Confirmou (ou às vezes só suspeitou, conforme a doença) um caso da lista? NOTIFIQUE. Não notificar é falha grave." },
  { id:"mfc-vigilancia-5", assunto:"mfc-vigilancia", frente:"O que separa quem estudou vigilância: os dois prazos?", verso:"IMEDIATA (até 24h: sarampo, surtos, interesse internacional) x SEMANAL (a maioria de rotina). Diferenciar imediata de semanal é o diferencial." },
  { id:"mfc-vigilancia-6", assunto:"mfc-vigilancia", frente:"Exemplos de notificação IMEDIATA (24h)?", verso:"Sarampo, casos suspeitos de doenças de interesse internacional, surtos: alto potencial de disseminação/gravidade." },
  { id:"mfc-vigilancia-7", assunto:"mfc-vigilancia", frente:"Exemplos de doenças da lista de notificação compulsória?", verso:"Dengue, tuberculose, sífilis, hanseníase, violência, entre muitas. Se está na lista, notifica." },
  { id:"mfc-vigilancia-8", assunto:"mfc-vigilancia", frente:"A vigilância termina na notificação?", verso:"NÃO: investiga surtos (busca ativa, fonte), monitora indicadores e articula respostas. Notificar é o começo, não o fim." },
  { id:"mfc-vigilancia-9", assunto:"mfc-vigilancia", frente:"Por que Saúde Coletiva perpassa todas as áreas?", verso:"Uma questão de clínica, PED ou GO pode terminar cobrando a conduta de vigilância. Doença da lista no caso, pense notificação." },
  { id:"mfc-vigilancia-10", assunto:"mfc-vigilancia", frente:"O que é busca ativa de casos?", verso:"Procurar ativamente novos casos na investigação de um surto: parte da vigilância além da notificação passiva." },
{ id:"mfc-mccp-1", assunto:"mfc-mccp", frente:"O que é o Método Clínico Centrado na Pessoa (MCCP)?", verso:"Tratar a PESSOA que tem a doença, não só a doença. Entender a experiência do adoecer: o que sente, teme, espera. É a marca da MFC." },
  { id:"mfc-mccp-2", assunto:"mfc-mccp", frente:"'Centrado na pessoa' é o oposto de quê?", verso:"De 'centrado na doença'. Um trata o ser humano no contexto; o outro só o diagnóstico biomédico." },
  { id:"mfc-mccp-3", assunto:"mfc-mccp", frente:"Os componentes práticos do MCCP?", verso:"Explorar a doença E a experiência da pessoa, entendê-la no contexto (família, trabalho), e construir um plano CONJUNTO (decisão compartilhada)." },
  { id:"mfc-mccp-4", assunto:"mfc-mccp", frente:"O MCCP é 'ser bonzinho'?", verso:"NÃO: é uma técnica que melhora desfecho e adesão. Paciente que participa do plano adere muito mais." },
  { id:"mfc-mccp-5", assunto:"mfc-mccp", frente:"O que é o GENOGRAMA?", verso:"Mapa das relações e doenças da família ao longo das gerações. Ferramenta de abordagem familiar." },
  { id:"mfc-mccp-6", assunto:"mfc-mccp", frente:"O que é o ECOMAPA?", verso:"Mapa das relações da família com o MEIO (recursos, instituições, comunidade). Complementa o genograma." },
  { id:"mfc-mccp-7", assunto:"mfc-mccp", frente:"O que é territorialização?", verso:"Conhecer a área de abrangência da equipe: seus riscos e recursos. Ferramenta do trabalho comunitário." },
  { id:"mfc-mccp-8", assunto:"mfc-mccp", frente:"O que são determinantes sociais da saúde?", verso:"Moradia, renda, trabalho, educação: explicam boa parte do adoecimento e a APS precisa considerá-los." },
  { id:"mfc-mccp-9", assunto:"mfc-mccp", frente:"Para que serve a visita domiciliar?", verso:"Ver a pessoa no seu ambiente real: condições de vida, adesão, contexto familiar." },
  { id:"mfc-mccp-10", assunto:"mfc-mccp", frente:"Decisão compartilhada: por que melhora o cuidado?", verso:"Paciente que entende e participa do plano ADERE mais. O vínculo se fortalece e o desfecho melhora." },
  { id:"mfc-estudos-1", assunto:"mfc-estudos", frente:"A 1ª pergunta que classifica um estudo?", verso:"O pesquisador INTERVÉM ou apenas OBSERVA? Intervém (aloca) = experimental. Só observa = observacional." },
  { id:"mfc-estudos-2", assunto:"mfc-estudos", frente:"A 2ª pergunta (dentro dos observacionais)?", verso:"Por onde COMEÇA: pela exposição (coorte), pelo desfecho (caso-controle), ou pelos dois ao mesmo tempo (transversal)?" },
  { id:"mfc-estudos-3", assunto:"mfc-estudos", frente:"Estudo TRANSVERSAL: o que é e o que mede?", verso:"Uma FOTOGRAFIA: mede exposição e desfecho ao MESMO tempo. Barato, rápido, é o dos inquéritos. Mede PREVALÊNCIA." },
  { id:"mfc-estudos-4", assunto:"mfc-estudos", frente:"A limitação do transversal que a banca cobra?", verso:"Sem temporalidade: não se sabe o que veio antes (o obeso ficou sedentário ou o contrário?). Inferência causal frágil." },
  { id:"mfc-estudos-5", assunto:"mfc-estudos", frente:"Estudo CASO-CONTROLE: como funciona?", verso:"Começa pelo DESFECHO e olha pra trás: pega casos (doentes) e controles (sadios) e compara a exposição passada." },
  { id:"mfc-estudos-6", assunto:"mfc-estudos", frente:"Para que serve o caso-controle e qual sua medida?", verso:"Ideal para doenças RARAS e de longa latência. Mede ODDS RATIO (razão de chances). NÃO calcula incidência nem RR." },
  { id:"mfc-estudos-7", assunto:"mfc-estudos", frente:"O calcanhar de Aquiles do caso-controle?", verso:"Viés de MEMÓRIA: quem adoeceu lembra melhor das exposições. Distorce a comparação." },
  { id:"mfc-estudos-8", assunto:"mfc-estudos", frente:"Estudo de COORTE: como funciona e o que mede?", verso:"Começa pela EXPOSIÇÃO e SEGUE no tempo: acompanha expostos e não expostos. Mede INCIDÊNCIA e RISCO RELATIVO." },
  { id:"mfc-estudos-9", assunto:"mfc-estudos", frente:"Por que a coorte é o melhor observacional para causalidade?", verso:"A temporalidade está garantida (a exposição vem antes do desfecho). Preço: caro e demorado." },
  { id:"mfc-estudos-10", assunto:"mfc-estudos", frente:"Odds ratio x risco relativo: quem calcula cada um?", verso:"Caso-controle = odds ratio. Coorte = risco relativo (e incidência). O desenho define a medida." },
  { id:"mfc-testes-1", assunto:"mfc-testes", frente:"SENSIBILIDADE: o que é?", verso:"Capacidade de encontrar quem TEM a doença: proporção de positivos entre os doentes. Pega o doente." },
  { id:"mfc-testes-2", assunto:"mfc-testes", frente:"ESPECIFICIDADE: o que é?", verso:"Capacidade de descartar quem NÃO tem: proporção de negativos entre os sadios. Livra o sadio." },
  { id:"mfc-testes-3", assunto:"mfc-testes", frente:"O ponto que MAIS derruba candidato sobre sens/espec?", verso:"São propriedades DO TESTE: NÃO mudam quando você muda a população. 'Sensibilidade e especificidade não dependem da prevalência.'" },
  { id:"mfc-testes-4", assunto:"mfc-testes", frente:"O que é SnNout?", verso:"Teste muito Sensível, quando dá Negativo, afasta a doença (out). Poucos falsos-negativos. 'Sensível negativo exclui.'" },
  { id:"mfc-testes-5", assunto:"mfc-testes", frente:"O que é SpPin?", verso:"Teste muito Específico, quando dá Positivo, confirma a doença (in). Poucos falsos-positivos. 'Específico positivo confirma.'" },
  { id:"mfc-testes-6", assunto:"mfc-testes", frente:"No RASTREAMENTO, qual teste você quer e por quê?", verso:"SENSÍVEL: o pecado é deixar passar um doente. 'No rastreio, não pode escapar ninguém.'" },
  { id:"mfc-testes-7", assunto:"mfc-testes", frente:"Na CONFIRMAÇÃO, qual teste você quer e por quê?", verso:"ESPECÍFICO: o pecado é rotular e tratar um sadio. 'Na confirmação, não pode acusar inocente.'" },
  { id:"mfc-testes-8", assunto:"mfc-testes", frente:"Por que o HIV usa dois testes?", verso:"Triagem com teste sensível (não deixa passar) e confirmação com específico (não rotula à toa). 'Sensível primeiro, específico depois.'" },
  { id:"mfc-testes-9", assunto:"mfc-testes", frente:"Valor preditivo POSITIVO (VPP): o que responde?", verso:"A chance de realmente TER a doença, dado que o teste deu positivo. Responde: 'deu positivo, eu tenho?'" },
  { id:"mfc-testes-10", assunto:"mfc-testes", frente:"VPP e VPN dependem de quê (o coração do assunto)?", verso:"Da PREVALÊNCIA. O mesmo teste, em população com mais ou menos doença, muda os valores preditivos. 'Prevalência muda VPP/VPN, não sens/espec.'" },
];

const CURRICULO = [
  {id:"cm-acidobase",area:"CM",nome:"Distúrbios ácido-base",yield:3,
   questoes:["cm_acidobase_q1","cm_acidobase_q2","cm_acidobase_q3","cm_acidobase_q4"],
   fonte:"Interpretação de gasometria - princípios de fisiologia ácido-base (Guyton; UpToDate); fórmula de Winter.",
   aula:["O sangue precisa ficar num pH bem estreito, entre 7,35 e 7,45. Essa margem é pequena porque as enzimas que fazem o corpo funcionar só trabalham bem nessa faixa; fora dela, reações vitais começam a falhar. Quando o pH cai abaixo de 7,35 o sangue está ácido demais (acidose); acima de 7,45, básico demais (alcalose). Todo o assunto de gasometria é responder duas perguntas: por que o pH saiu do lugar, e o que o corpo está fazendo para corrigir.","Duas substâncias controlam o pH, e é essencial saber quem manda em cada uma. O gás carbônico (CO2) é regulado pelos PULMÕES — quanto mais CO2, mais ácido o sangue (CO2 é um ácido). O bicarbonato (HCO3) é regulado pelos RINS — quanto mais bicarbonato, mais básico (HCO3 é uma base). A partir disso: se o distúrbio nasce no pulmão (alteração do CO2), é RESPIRATÓRIO; se nasce no metabolismo/rim (alteração do HCO3), é METABÓLICO. Guardar 'CO2 = pulmão = ácido' e 'HCO3 = rim = base' resolve metade das questões.","O corpo nunca fica parado diante de um pH alterado: ele COMPENSA, tentando puxar o pH de volta ao normal. Se há uma acidose metabólica (bicarbonato baixo), o pulmão acelera e aprofunda a respiração para eliminar CO2 (o ácido volátil) e assim reduzir a acidez — é a respiração de Kussmaul, rápida e profunda, clássica da cetoacidose diabética. A compensação pulmonar é rápida (minutos a horas); a renal é lenta (horas a dias). Perceber a compensação é o que diferencia LER uma gasometria de decorar valores.","Dentro da acidose metabólica há duas famílias, e distinguir muda o diagnóstico. Quando um ácido NOVO se acumula no sangue (cetoácidos na cetoacidose, lactato no choque, toxinas), o ânion gap fica ALTO. Quando o problema é PERDA de bicarbonato (diarreia intensa, alguns problemas renais), o ânion gap fica NORMAL (também chamada hiperclorêmica). O ânion gap é apenas uma conta que estima se há 'ácido escondido' sobrando — pense nele como o detetive que aponta se entrou um ácido novo na jogada.","Na prova, o passo final é checar a compensação esperada com uma fórmula simples (fórmula de Winter, para acidose metabólica: pCO2 esperada = 1,5 x HCO3 + 8, com margem de ±2). Se a pCO2 real bate com a esperada, há um distúrbio só, bem compensado. Se NÃO bate, existe um segundo distúrbio escondido — o temido distúrbio MISTO, que é onde a banca separa quem entende de quem chutou. Exemplo real: um paciente com cetoacidose (acidose metabólica) que também vomita muito pode ter uma alcalose metabólica junto, e só a fórmula denuncia isso."],
   raciocinio:["Olhe o pH: abaixo de 7,35 é acidose; acima de 7,45 é alcalose. Esse é o distúrbio que domina.","Olhe HCO3 e pCO2: qual dos dois explica o pH? Se o HCO3 baixo explica a acidose, é metabólica; se o pCO2 alto explica, é respiratória.","Se for acidose metabólica, calcule o ânion gap: ALTO (acúmulo de ácido, ex.: cetoacidose, lactato) ou NORMAL (perda de bicarbonato, ex.: diarreia).","Cheque a compensação esperada (Winter, na acidose metabólica). Bateu = distúrbio único. Não bateu = há um distúrbio MISTO escondido."],
   nucleo:["Sequência fixa ao ler a gaso: 1) pH  2) HCO3 e pCO2 (quem é o primário)  3) ânion gap  4) compensação esperada.","Acidose metabólica: ânion gap ALTO (ácido acumulou) vs NORMAL/hiperclorêmica (perdeu bicarbonato).","Compensação da acidose metabólica: Winter → pCO2 esperada = 1,5 x HCO3 + 8 (±2).","Compensação que não bate = distúrbio MISTO."],
   pega:"Não pare no pH: sempre confira a compensação para não perder um distúrbio MISTO. Respiração de Kussmaul aponta acidose metabólica compensando.",mne:"Ânion gap ALTO = MUDPILES (Metanol, Uremia, cetoacidose Diabética, Paraldeído, Isoniazida/ferro, Lactato, Etilenoglicol, Salicilato).",sus:"Interpretação de gasometria cai contextualizada em caso clínico de urgência (cetoacidose, sepse) na prova."},
  {id:"cm-has",area:"CM",nome:"Hipertensão — manejo e metas",yield:3,
   questoes:["has_q1","has_q2","has_q3","has_q4"],
   fonte:"Diretriz Brasileira de Hipertensão Arterial 2020 (SBC/SBH/SBN), atualizada em 2025; Linha de Cuidado da HAS no adulto (Ministério da Saúde).",
   aula:["Pressão arterial é a força que o sangue faz contra a parede das artérias. Ela sobe e desce ao longo do dia (sobe no esforço, cai no sono) — isso é normal. O problema é quando fica CRONICAMENTE alta: aí, dia após dia, essa pressão extra vai desgastando as artérias, sobrecarregando o coração (que precisa bombear contra mais resistência) e lesando órgãos que dependem de vasos finos — rim, retina, cérebro. Como isso acontece em silêncio, por anos, sem dor nem sintoma, a HAS é a 'assassina silenciosa'. É por isso que medir a pressão de rotina, mesmo em quem se sente bem, salva vidas — e é papel central da atenção primária.",
     "Diagnóstico é o primeiro lugar onde a banca te derruba. NÃO se fecha hipertensão com uma única medida alta. O ponto de corte no consultório é 140/90 mmHg, mas precisa ser confirmado — em outra consulta, ou (melhor) por medida fora do consultório: a MAPA (aparelho que mede por 24h) ou a MRPA (o paciente mede em casa). Isso existe porque muita gente sobe a pressão só de estar no médico (o 'efeito do jaleco branco') e seria rotulada e medicada à toa. Guarde: uma aferição alta = investigar, não diagnosticar.",
     "O tratamento tem dois pilares que andam JUNTOS. O primeiro, para TODO hipertenso, é a mudança de estilo de vida: reduzir sal (o sódio retém água e sobe a pressão), perder peso, atividade física regular, moderar álcool, parar de fumar. Sozinha, em casos leves, ela às vezes já resolve. O segundo pilar é o remédio, e as três primeiras linhas — todas baratas e no SUS — são: diurético tiazídico (tira sal e água), IECA ou BRA (relaxam o vaso agindo no sistema renina-angiotensina) e bloqueador de canal de cálcio (relaxa a musculatura do vaso). A escolha entre elas depende do perfil: por exemplo, IECA/BRA são preferidos no diabético com doença renal, porque protegem o rim.",
     "Agora as duas pegadinhas clássicas. Primeira: o betabloqueador (propranolol, atenolol) NÃO é primeira linha na hipertensão comum. Ele só entra de largada quando há uma indicação a mais — o paciente também tem doença coronariana, insuficiência cardíaca ou certas arritmias. Marcar betabloqueador como 'tratamento inicial da HAS' é errar. Segunda: saber diferenciar URGÊNCIA de EMERGÊNCIA hipertensiva. Pressão muito alta (ex.: 200/120) SEM lesão aguda de órgão é urgência — baixa-se devagar, com medicação oral, em horas. Pressão muito alta (arbitrariamente PAS ≥180 e/ou PAD ≥120) COM lesão aguda de órgão-alvo acontecendo agora (AVC, edema agudo de pulmão, infarto, dissecção de aorta, eclâmpsia) é EMERGÊNCIA hipertensiva — precisa de medicação VENOSA e redução controlada, em ambiente monitorado, pelo risco iminente de morte. Baixar a pressão rápido demais numa urgência (que não precisava) pode causar isquemia. A conduta muda tudo conforme esse par.",
     "Por fim, a meta e o acompanhamento. A meta é individualizada pelo risco: PA < 140/90 para risco baixo/moderado, e < 130/80 para pacientes de ALTO risco (ex.: diabéticos, doença cardiovascular estabelecida). No idoso frágil a meta é mais permissiva (em torno de 140-149 de sistólica), porque baixar demais causa queda, tontura e hipotensão. Na prática do SUS, o hipertensão entra na linha de cuidado (o antigo HiperDia), com consultas regulares, aferição, e busca ativa de quem abandona — porque adesão é o maior desafio: como não dói, o paciente para o remédio. O médico de família acompanha isso ao longo do tempo."],
   raciocinio:["Confirme antes de rotular: uma medida alta não fecha diagnóstico. Peça nova aferição ou MAPA/MRPA.",
     "Avalie o risco: tem lesão de órgão-alvo? Diabetes? Doença renal? Isso define a meta e a droga preferida.",
     "Prescreva SEMPRE mudança de estilo de vida — em todos, do leve ao grave.",
     "Escolha a 1ª linha certa: tiazídico, IECA/BRA ou BCC. Betabloqueador só se houver indicação extra (coronariopatia, IC).",
     "Diante de pressão muito alta: procure lesão AGUDA de órgão. Achou (AVC, EAP, IAM)? Emergência (venoso). Não achou? Urgência (oral, devagar)."],
   nucleo:["Diagnóstico: ≥140/90 CONFIRMADO (nova medida ou MAPA/MRPA) — nunca com uma só aferição.","1ª linha: tiazídico OU IECA/BRA OU BCC. Betabloqueador não é 1ª linha sem indicação específica.","Emergência (lesão aguda de órgão → venoso) x urgência (sem lesão → oral, devagar).","Meta: <140/90 (risco baixo/moderado) e <130/80 (alto risco); idoso frágil mais permissiva."],
   pega:"Betabloqueador NÃO é 1ª linha sem indicação (coronariopatia/IC). E não confunda urgência (oral) com emergência (venoso, há lesão aguda de órgão).",
   mne:"1ª linha = 'TIB': Tiazídico, IECA/BRA, BCC.",sus:"Linha de cuidado da HAS na APS (HiperDia): rastreio, adesão e busca ativa."},
  {id:"cm-dm2",area:"CM",nome:"Diabetes tipo 2",yield:3,
   questoes:["cm_dm2_q1","cm_dm2_q2","cm_dm2_q3","cm_dm2_q4"],
   fonte:"Diretriz da Sociedade Brasileira de Diabetes (SBD) 2025 — diagnóstico, metas e tratamento do DM2; Tratamento do DM2 no SUS (SBD).",
   aula:["Diabetes tipo 2 é uma doença em que o corpo não consegue mais controlar bem o açúcar no sangue. Diferente do tipo 1 (que é falta de insulina), no tipo 2 o corpo até produz insulina, mas as células ficam 'surdas' a ela — é a resistência à insulina. Com o tempo o pâncreas cansa e a glicose sobe. O excesso de açúcar circulando vai lesando vasos pequenos e grandes: olhos, rins, nervos e coração.",
     "O diagnóstico se faz por qualquer um destes: glicemia de jejum >=126, HbA1c >=6,5%, glicemia 2h após o TOTG >=200, ou glicemia casual >=200 com sintomas. A HbA1c é útil porque mostra a média do açúcar dos últimos 2-3 meses — não depende de o paciente estar em jejum naquele dia.",
     "A metformina reduz a produção de glicose pelo fígado e melhora a resposta à insulina; é barata, segura e disponível no SUS. ATENÇÃO à atualização (SBD 2025): a metformina deixou de ser 1ª linha UNIVERSAL. Ela permanece como escolha inicial em monoterapia no paciente de risco cardiovascular baixo/intermediário, sem doença cardiorrenal nem obesidade e com HbA1c < 7,5%. Porém, em ALTO risco cardiovascular ou doença renal, entram precocemente os iSGLT2 (ex.: dapagliflozina) ou os agonistas de GLP-1, pelo benefício cardiorrenal; na obesidade, preferem-se GLP-1/tirzepatida (também ajudam a emagrecer); e com HbA1c ≥ 7,5% já se começa com combinação. A metformina é contraindicada quando a função renal está muito ruim (TFG baixa). No SUS, o esquema clássico segue metformina + sulfonilureia (gliclazida preferida).",
     "Tratar diabetes não é só baixar o número da glicose: é definir uma META individualizada de HbA1c: < 7% para a maioria dos adultos, < 7,5% em idosos, e < 8% em idosos com capacidade funcional reduzida (para evitar hipoglicemia) e rastrear as complicações periodicamente — fundo de olho, função renal, exame dos pés. Um erro comum é já querer insulinizar todo mundo de cara; a insulina entra quando os orais não dão conta."],
   raciocinio:["1. Confirme o diagnóstico (jejum, HbA1c, TOTG ou casual com sintomas).",
     "2. Cheque a função renal — ela decide se a metformina pode ser usada.",
     "3. Comece metformina (1ª linha) + mudança de estilo de vida.",
     "4. Defina a meta de HbA1c conforme o perfil do paciente (mais rígida no jovem, mais frouxa no idoso frágil).",
     "5. Programe o rastreio de complicações (retina, rim, neuropatia, pés)."],
   nucleo:["Diagnóstico: jejum >=126, HbA1c >=6,5%, TOTG 2h >=200.","Metformina: 1ª escolha se risco baixo/intermediário e HbA1c<7,5%; alto risco CV/renal → iSGLT2 ou GLP-1 precoce (SBD 2025).","Metas HbA1c: <7% (maioria), <7,5% (idoso), <8% (idoso frágil). Rastrear complicações (retina, rim, pés)."],
   pega:"Mudança SBD 2025: metformina não é mais 1ª linha universal — em alto risco CV/renal, iSGLT2 ou GLP-1 entram cedo. Não insulinizar todo mundo de cara.",mne:"Meta HbA1c: 7 / 7,5 / 8 (adulto / idoso / idoso frágil).",sus:"Linha de cuidado do DM na APS; no SUS, metformina + gliclazida."},
  {id:"cm-sca",area:"CM",nome:"Síndrome coronariana aguda (IAM)",yield:3,
   questoes:["cm_sca_q1","cm_sca_q2","cm_sca_q3","cm_sca_q4"],
   fonte:"Diretriz de SCA da Sociedade Brasileira de Cardiologia; Atualização AHA/ACC 2025 de Síndromes Coronarianas Agudas; 4ª Definição Universal de Infarto.",
   aula:["A síndrome coronariana aguda (SCA) acontece quando uma placa de gordura na parede da artéria coronária se rompe e forma um trombo, reduzindo ou bloqueando o fluxo de sangue para o músculo do coração. Se o vaso entope por completo, aquela região do miocárdio começa a morrer — é o infarto. O sintoma clássico é dor torácica em aperto, retroesternal, que pode irradiar para o braço esquerdo, mandíbula ou dorso, com sudorese, náusea e sensação de morte iminente. Idosos, diabéticos e mulheres podem ter apresentação atípica (dispneia, mal-estar), o que engana.","A SCA se divide em três, e o que separa é o eletrocardiograma (ECG) e a troponina. O ECG deve ser feito e interpretado em até 10 minutos da chegada. Se há SUPRADESNIVELAMENTO do segmento ST (ou bloqueio de ramo esquerdo novo), é o IAM COM SUPRA (IAMCSST) — a artéria está totalmente ocluída, é a emergência que exige reperfusão imediata. Se NÃO há supra, dosa-se a troponina: se ela sobe, é IAM SEM supra (IAMSSST); se permanece normal com quadro clínico compatível, é angina instável.","No IAM COM SUPRA, o tratamento é REPERFUNDIR (reabrir a artéria) o mais rápido possível — tempo é músculo. A primeira escolha é a angioplastia primária (cateterismo), com meta de tempo porta-balão de até 90 minutos (ou até 120 minutos se precisar transferir para um serviço com hemodinâmica). Se não for possível cumprir esse tempo, faz-se a TROMBÓLISE (fibrinolítico, como a tenecteplase), com meta de tempo porta-agulha de até 30 minutos — indicada em sintomas de até 12 horas e após checar contraindicações (sangramento, AVC recente, etc.). Todo paciente trombolisado depois vai para o cateterismo.","Junto da reperfusão, entra o tratamento medicamentoso, resumido às vezes como 'MONABICHA' — mas o essencial da prova é: dupla antiagregação plaquetária (AAS + um inibidor de P2Y12, como clopidogrel, ticagrelor ou prasugrel) por pelo menos 1 ano, anticoagulação, estatina de alta potência, e betabloqueador/IECA conforme o caso. Uma pegadinha importante: a MORFINA não deve ser dada de rotina precocemente no IAM com supra, porque a melhora da dor é um critério de reperfusão e a morfina mascara isso (além de reduzir a absorção dos antiplaquetários) — reserva-se para dor intolerável.","No IAM SEM supra e na angina instável, a lógica é diferente: NÃO se faz trombólise (não há benefício e pode prejudicar). Estratifica-se o risco (escores como GRACE, TIMI) e decide-se o momento do cateterismo — os de alto risco vão para a angiografia precoce (nas primeiras 24h). O tratamento antitrombótico e as estatinas também entram. Regra de ouro que a banca adora: paciente com dor torácica + supra de ST = reperfusão já; sem supra = troponina e estratificação de risco, sem trombolítico."],
   raciocinio:["Dor torácica típica → faça e interprete o ECG em até 10 minutos.","Tem supra de ST (ou BRE novo)? É IAMCSST: reperfusão IMEDIATA.","Reperfusão: angioplastia primária (porta-balão ≤90 min, ou ≤120 se transferir); se não der no tempo, trombólise (porta-agulha ≤30 min, sintomas ≤12h).","Sem supra? Dose a troponina: sobe = IAMSSST; normal = angina instável. NÃO trombolisar.","Sem supra: estratifique risco (GRACE/TIMI) e defina o cateterismo (alto risco = precoce, <24h).","Não dar morfina de rotina precoce no IAM com supra (mascara critério de reperfusão)."],
   nucleo:["ECG em ≤10 min. Com supra (ou BRE novo) = IAMCSST → reperfusão imediata.","Angioplastia primária: porta-balão ≤90 min (≤120 se transferir). Trombólise: porta-agulha ≤30 min, sintomas ≤12h.","Sem supra: troponina (sobe=IAMSSST; normal=angina instável). NÃO trombolisar; estratificar (GRACE/TIMI).","Dupla antiagregação (AAS + P2Y12) por ≥1 ano; estatina alta potência.","Morfina não de rotina precoce no IAMCSST."],
   pega:"Sem supra de ST NÃO se trombolisa (só o IAM COM supra). E não dar morfina de rotina precoce no IAM com supra — mascara o critério de reperfusão da dor.",mne:"COM supra = reperfundir já (balão ≤90 / agulha ≤30). SEM supra = troponina + risco.",sus:"Rede de atenção às urgências cardiovasculares; telecardiologia e SAMU para trombólise pré-hospitalar."},
  {id:"cm-ic",area:"CM",nome:"Insuficiência cardíaca",yield:3,
   questoes:["cm_ic_q1","cm_ic_q2","cm_ic_q3","cm_ic_q4"],
   fonte:"Diretriz Brasileira de Insuficiência Cardíaca Crônica e Aguda (SBC); Diretriz ESC de Insuficiência Cardíaca.",
   aula:["A insuficiência cardíaca (IC) é a incapacidade do coração de bombear sangue suficiente para atender o corpo, ou de fazê-lo à custa de pressões elevadas. É o destino final de muitas doenças cardíacas (hipertensão, infarto, valvopatias). O paciente típico tem dispneia aos esforços que progride, cansaço, e sinais de congestão: inchaço nas pernas (edema), falta de ar ao deitar (ortopneia), e despertar à noite sufocado (dispneia paroxística noturna).","A IC se classifica pela fração de ejeção (FE), que é o percentual de sangue que o ventrículo esquerdo ejeta a cada batida (normal ≥50%). IC com FE REDUZIDA (ICFEr): FE ≤40% — o coração bombeia mal. IC com FE preservada (ICFEp): FE ≥50% — o coração enche mal (rigidez), comum em idosos e hipertensos. Há ainda a faixa intermediária (41-49%). Essa divisão importa porque o tratamento que salva vida foi provado na ICFEr.","O diagnóstico junta clínica + exames: o BNP (ou NT-proBNP) é um peptídeo que sobe na IC e ajuda muito (um BNP normal praticamente afasta IC como causa da dispneia); o ecocardiograma confirma e mede a FE. Os critérios de Framingham (sinais maiores e menores) ainda aparecem em prova.","O tratamento da ICFEr é o coração da questão, porque tem os 'quatro pilares' que reduzem mortalidade — memorize-os: (1) IECA/BRA ou, preferencialmente, o sacubitril-valsartana (INRA); (2) betabloqueador (carvedilol, metoprolol ou bisoprolol); (3) antagonista do receptor mineralocorticoide (espironolactona); e (4) inibidor de SGLT2 (dapagliflozina/empagliflozina), o pilar mais novo. Diuréticos aliviam a congestão (melhoram sintoma) mas NÃO reduzem mortalidade — é uma pegadinha clássica.","Na IC aguda descompensada (o paciente que chega com edema agudo de pulmão, muito congesto), a lógica muda para aliviar rápido: oxigênio/ventilação, diurético venoso (furosemida) para tirar o excesso de volume, vasodilatador (nitrato) se a pressão permite, e tratar o fator que descompensou (má adesão, infecção, arritmia, isquemia). Resumo do raciocínio: ICFEr crônica = os 4 pilares que salvam vida; congestão aguda = diurético venoso e suporte."],
   raciocinio:["Reconheça a IC: dispneia progressiva + congestão (edema, ortopneia, DPN).","Classifique pela fração de ejeção: reduzida (≤40%), preservada (≥50%) ou intermediária.","Confirme: BNP/NT-proBNP (normal quase afasta) + ecocardiograma.","ICFEr crônica: institua os 4 pilares (IECA/BRA ou sacubitril-valsartana + betabloqueador + espironolactona + iSGLT2).","Lembre: diurético alivia sintoma mas não reduz mortalidade.","IC aguda congesta: O2/ventilação + diurético venoso + vasodilatador + tratar o gatilho."],
   nucleo:["IC classificada pela FE: reduzida (≤40%), preservada (≥50%), intermediária (41-49%).","Diagnóstico: BNP/NT-proBNP + ecocardiograma.","ICFEr — 4 pilares que reduzem mortalidade: IECA/BRA ou sacubitril-valsartana, betabloqueador, espironolactona, iSGLT2.","Diurético: alivia congestão, NÃO reduz mortalidade.","IC aguda: diurético venoso + vasodilatador + O2 + tratar gatilho."],
   pega:"Diurético melhora sintoma mas NÃO reduz mortalidade na IC — quem salva vida são os 4 pilares da ICFEr. Betabloqueador NÃO se inicia na descompensação aguda congesta.",mne:"4 pilares da ICFEr: IECA/BRA(ou INRA) + Betabloqueador + Espironolactona + iSGLT2.",sus:"Linha de cuidado da IC; medicações dos 4 pilares progressivamente incorporadas ao SUS."},
  {id:"cm-avc",area:"CM",nome:"AVC (isquêmico e hemorrágico)",yield:3,
   questoes:["cm_avc_q1","cm_avc_q2","cm_avc_q3","cm_avc_q4"],
   fonte:"Diretriz de Doença Cerebrovascular / AVC da Sociedade Brasileira de Doenças Cerebrovasculares e Ministério da Saúde; protocolos de trombólise (AHA/ASA).",
   aula:["O AVC (acidente vascular cerebral) é a interrupção súbita do fluxo de sangue em uma parte do cérebro, causando perda de função daquela área. Tempo é cérebro: a cada minuto sem fluxo, milhões de neurônios morrem. O reconhecimento rápido usa a sigla SAMU/FAST: alteração no Sorriso (face caída), fraqueza no Abraço (braço), mudança na fala (Mensagem), e a Urgência de ligar. Sinais típicos: hemiparesia súbita, desvio de rima, afasia, alteração visual — sempre de instalação abrupta.","Há dois tipos, e a tomografia de crânio SEM contraste é o exame que os separa — e é a primeira coisa a fazer, porque a conduta é oposta. AVC ISQUÊMICO (~85%): um trombo entope o vaso; na TC inicial pode não aparecer nada (ou sinais precoces). AVC HEMORRÁGICO (~15%): um vaso rompe e sangra; a TC mostra a hemorragia (área branca) de imediato. Você nunca trata um antes de excluir o outro — dar trombolítico num hemorrágico é catastrófico.","No AVC isquêmico, o tratamento que reabre o vaso é a TROMBÓLISE endovenosa (alteplase ou tenecteplase), e ela tem uma JANELA de tempo: até 4,5 horas do início dos sintomas. Fora da janela, ou com contraindicações (hemorragia, cirurgia recente, hipertensão não controlada >185/110), não se trombolisa. Para grandes vasos, existe ainda a trombectomia mecânica (retirar o trombo por cateter), com janela maior (até 24h em casos selecionados). Um detalhe de prova: no isquêmico, a hipertensão é tolerada (permite-se PA mais alta), e só se trata acima de limites altos — baixar demais piora a isquemia.","No AVC hemorrágico, não há trombólise (óbvio); o manejo é controlar a pressão arterial de forma mais rigorosa, corrigir coagulopatias, controlar a pressão intracraniana e avaliar necessidade de cirurgia (neurocirurgia). Em ambos, cuidados gerais importam: glicemia, temperatura, deglutição (risco de broncoaspiração), e depois a prevenção secundária (antiagregante e estatina no isquêmico; controlar fatores de risco). Resumo: TC primeiro para separar; isquêmico na janela = trombólise; hemorrágico = controle pressórico e neurocirurgia."],
   raciocinio:["Déficit neurológico focal SÚBITO → suspeite de AVC (FAST) e marque a hora do início.","Faça TC de crânio sem contraste IMEDIATAMENTE para separar isquêmico de hemorrágico.","Isquêmico + dentro de 4,5h + sem contraindicação = trombólise endovenosa.","Grande vaso: considere trombectomia mecânica (janela maior).","Hemorrágico: controle rigoroso da PA, corrigir coagulopatia, avaliar neurocirurgia.","No isquêmico, tolere a hipertensão (não baixar demais); trate só acima de limites altos."],
   nucleo:["TC de crânio sem contraste PRIMEIRO: separa isquêmico (~85%) de hemorrágico (~15%).","Isquêmico: trombólise EV até 4,5h; trombectomia mecânica até 24h (grande vaso selecionado).","Contraindicações à trombólise: hemorragia, PA >185/110 não controlada, cirurgia recente.","Isquêmico tolera hipertensão (não baixar demais).","Hemorrágico: sem trombólise; controle pressórico rigoroso e neurocirurgia."],
   pega:"Nunca trombolisar sem a TC que exclui hemorragia. No isquêmico, a hipertensão é TOLERADA (baixar demais piora a isquemia); no hemorrágico, o controle é rigoroso — condutas opostas.",mne:"AVC: FAST → TC → isquêmico na janela (4,5h) trombolisa; hemorrágico não.",sus:"Linha de cuidado do AVC; unidades de AVC e protocolo de trombólise na rede de urgência."},
  {id:"cm-asma-dpoc",area:"CM",nome:"Asma e DPOC",yield:2,
   questoes:["cm_asma_dpoc_q1","cm_asma_dpoc_q2","cm_asma_dpoc_q3","cm_asma_dpoc_q4"],
   fonte:"Diretrizes da Global Initiative for Asthma (GINA) e Global Initiative for Chronic Obstructive Lung Disease (GOLD); Sociedade Brasileira de Pneumologia e Tisiologia.",
   aula:["Asma e DPOC são as duas grandes doenças que obstruem o fluxo de ar, mas têm perfis diferentes. A ASMA é uma inflamação crônica das vias aéreas com hiper-reatividade: os brônquios reagem de forma exagerada a gatilhos (alérgenos, exercício, frio) e se fecham, mas de forma REVERSÍVEL. É comum começar na infância, tem caráter variável (piora à noite/madrugada, melhora com broncodilatador) e história de atopia (rinite, eczema). A DPOC é uma obstrução POUCO reversível, progressiva, causada quase sempre pelo tabagismo, típica de adultos mais velhos com longa carga tabágica.","Na asma, a base do tratamento mudou e a prova cobra isso: o corticoide inalatório (CI) é o pilar do controle — trata a inflamação. O erro clássico é tratar asma só com broncodilatador de resgate (salbutamol) sem corticoide: alivia na hora, mas não controla a doença e aumenta risco de crise grave. Hoje a GINA recomenda que até os quadros leves usem corticoide inalatório (frequentemente combinado com formoterol). Os broncodilatadores de longa ação entram associados ao CI conforme a gravidade — nunca sozinhos na asma.","Na crise de asma (exacerbação), o tratamento é: oxigênio se hipoxemia, broncodilatador de curta ação (salbutamol) repetido, e corticoide SISTÊMICO precoce (oral ou venoso) — o corticoide sistêmico reduz a inflamação da crise e previne recaída. Casos graves podem usar sulfato de magnésio. Sinais de gravidade (fala entrecortada, uso de musculatura acessória, saturação baixa, sonolência) indicam crise grave e necessidade de suporte.","Na DPOC, o pilar são os BRONCODILATADORES de longa ação (LABA e LAMA); o corticoide inalatório entra em perfis selecionados (mais exacerbações, eosinofilia) — é o oposto da lógica da asma. Medidas que mudam desfecho na DPOC: cessação do tabagismo (a única que altera a história natural), vacinação (influenza, pneumococo) e oxigenoterapia domiciliar nos hipoxêmicos crônicos. Na exacerbação de DPOC (piora da dispneia, mais secreção/purulência), usa-se broncodilatador, corticoide sistêmico por período curto e antibiótico quando há sinais de infecção bacteriana. Resumo: asma = corticoide inalatório é a base; DPOC = broncodilatador de longa ação é a base + parar de fumar."],
   raciocinio:["Separe os perfis: asma (jovem, atopia, reversível, variável) x DPOC (tabagista, idoso, pouco reversível, progressiva).","Asma crônica: o corticoide inalatório é a BASE (não tratar só com resgate).","Crise de asma: O2 + salbutamol repetido + corticoide sistêmico precoce.","DPOC crônica: broncodilatador de longa ação (LABA/LAMA) é a base; CI em casos selecionados.","DPOC: cessação do tabagismo é a única medida que muda a história natural; vacinar; O2 domiciliar se hipoxemia crônica.","Exacerbação de DPOC: broncodilatador + corticoide sistêmico curto + antibiótico se infecção."],
   nucleo:["Asma: inflamação reversível; corticoide inalatório é a BASE (não só broncodilatador de resgate).","Crise de asma: O2 + salbutamol + corticoide SISTÊMICO precoce (± sulfato de magnésio).","DPOC: obstrução pouco reversível (tabagismo); base é broncodilatador de longa ação (LABA/LAMA).","DPOC: cessação do tabagismo muda a história natural; vacinar; O2 domiciliar se hipoxêmico crônico.","CI: base na asma; na DPOC só em perfis selecionados (oposto)."],
   pega:"Não tratar asma só com broncodilatador de resgate — o corticoide inalatório é a base. Na DPOC é o inverso: broncodilatador de longa ação é a base, corticoide inalatório é seletivo.",mne:"Asma = Corticoide Inalatório na base. DPOC = Broncodilatador longo na base + parar de fumar.",sus:"Programa de controle da asma e do tabagismo na APS; dispensação de medicações inalatórias."},
  {id:"cm-sepse",area:"CM",nome:"Sepse e choque",yield:2,
   questoes:["cm_sepse_q1","cm_sepse_q2","cm_sepse_q3","cm_sepse_q4"],
   fonte:"Protocolo Gerenciado de Sepse do ILAS (Instituto Latino-Americano de Sepse); Surviving Sepsis Campaign 2021 (nota técnica ILAS).",
   aula:["Sepse não é 'infecção grave' apenas — é uma infecção que passou a causar disfunção de órgãos porque a resposta do próprio corpo saiu do controle. O sistema imune, tentando combater o micróbio, libera uma tempestade de mediadores que dilatam vasos, deixam os capilares 'vazando' e reduzem a perfusão. Resultado: mesmo com o coração batendo, os órgãos recebem menos oxigênio e começam a falhar (rim que não urina, confusão mental, pressão que cai). Reconhecer cedo é o que salva.","Para identificar rápido à beira do leito existe o qSOFA: três sinais simples — frequência respiratória ≥22, alteração do estado mental e pressão arterial sistólica ≤100. Dois ou mais acendem o alerta. Na UTI usa-se o SOFA completo, que pontua a disfunção de cada órgão. O ponto-chave da prova: sepse é infecção COM disfunção orgânica; choque séptico é a sepse que, mesmo após reposição volêmica adequada, mantém hipotensão exigindo vasopressor para manter a PAM ≥ 65 mmHg E cursa com lactato ≥ 2 mmol/L — é o estágio mais grave. O vasopressor de escolha é a noradrenalina.","O tratamento gira em torno do 'pacote da 1ª hora', e a ordem importa. Colher lactato (marca a gravidade da hipoperfusão), colher hemoculturas ANTES do antibiótico (para identificar o germe sem que o remédio atrapalhe), iniciar antibiótico de amplo espectro EV PRECOCE (na 1ª hora) e infundir cristaloide (no mínimo 30 mL/kg) se há hipotensão ou lactato elevado (≥ 2× o valor de referência). Depois, reavaliar a perfusão. Cada hora de atraso no antibiótico aumenta a mortalidade — por isso ele não pode esperar.","A pegadinha mais cobrada é justamente essa sequência: colher cultura é importante, MAS não pode atrasar a primeira dose de antibiótico. Se a coleta demora, colhe-se o que der e o antibiótico entra assim mesmo. Outro ponto: a reposição de volume é agressiva no início (o paciente está 'vazando' e vasodilatado), e a resposta é reavaliada por sinais de perfusão — pressão, diurese, lactato que cai, nível de consciência. No SUS, tudo começa no acolhimento com classificação de risco, que puxa o paciente febril e taquicárdico para a frente da fila."],
   raciocinio:["Suspeite de sepse em todo paciente com infecção + sinais de disfunção (qSOFA ≥2, confusão, oligúria, hipotensão).","Colha lactato e hemoculturas — mas sem atrasar o antibiótico.","Antibiótico de amplo espectro na 1ª hora. Não espere exame.","Cristaloide 30 mL/kg se hipotensão ou lactato alto; reavalie a perfusão.","Manteve hipotensão após volume + precisa de vasopressor + lactato alto? É choque séptico."],
   nucleo:["Sepse = infecção + disfunção orgânica (qSOFA/SOFA). Choque séptico = necessita vasopressor p/ PAM ≥65 + lactato ≥2 após volume adequado; vasopressor de escolha: noradrenalina.","Pacote 1ª hora: lactato, hemocultura ANTES do ATB, antibiótico precoce, cristaloide 30 mL/kg.","Reavaliar perfusão (PA, diurese, lactato, consciência).","Antibiótico não pode atrasar por causa da cultura."],
   pega:"Nunca atrasar o antibiótico esperando a coleta de cultura. Colher cultura sim, mas o ATB entra na 1ª hora.",mne:"1ª hora = 'LHAC': Lactato, Hemocultura, Antibiótico, Cristaloide.",sus:"Acolhimento com classificação de risco identifica a sepse na porta de entrada."},
  {id:"cm-dengue",area:"CM",nome:"Dengue e arboviroses",yield:3,
   questoes:["cm_dengue_q1","cm_dengue_q2","cm_dengue_q3","cm_dengue_q4"],
   fonte:"Dengue: diagnóstico e manejo clínico — adulto e criança, 6ª edição (Ministério da Saúde/SVSA, 2024); Guia de Vigilância em Saúde (MS); Nota Técnica de incorporação da vacina Qdenga ao PNI (MS, 2024).",
   aula:["A dengue é uma arbovirose transmitida pelo mosquito Aedes aegypti e tem quatro sorotipos (DENV-1 a 4). Pegar um deles dá imunidade permanente contra AQUELE sorotipo, mas só temporária contra os outros — e é justamente aí que mora o perigo: a segunda infecção, por um sorotipo diferente, tem risco MAIOR de gravidade (fenômeno de facilitação dependente de anticorpos). Por isso, em país com todos os sorotipos circulando como o Brasil, cada nova epidemia produz casos graves em quem já teve dengue antes. Não existe antiviral: o tratamento é hidratação e vigilância. Quem morre de dengue morre de choque, e choque se previne com água e olho clínico.",
     "A doença tem três fases, e entender a linha do tempo é o que separa quem acerta a questão de quem chuta. FASE FEBRIL (dias 1 a 3): febre alta, dor de cabeça, dor atrás dos olhos, mialgia, exantema — o paciente se sente péssimo, mas raramente está grave. FASE CRÍTICA (dias 3 a 7, na DEFERVESCÊNCIA): a febre CAI e, paradoxalmente, é agora que o paciente piora. FASE DE RECUPERAÇÃO: reabsorção dos líquidos, melhora. Grave isso, porque é a armadilha mais cobrada: quando o familiar diz 'a febre passou, ele está melhor', é exatamente o momento de maior atenção. Todo paciente com dengue deve ser reavaliado diariamente até 48h após ficar sem febre.",
     "O que adoece de verdade não é o sangramento — é o EXTRAVASAMENTO PLASMÁTICO. Os capilares ficam permeáveis e o plasma vaza do vaso para o terceiro espaço (abdome, pleura). Duas consequências: o volume dentro do vaso cai (hipovolemia → choque) e o sangue que sobra fica concentrado — por isso o HEMATÓCRITO SOBE. Um hematócrito em elevação progressiva é o alarme laboratorial mais importante: significa que o plasma está saindo. É por isso que o tratamento é volume, e não transfusão ou plaqueta: a plaquetopenia isolada, sem sangramento, NÃO é indicação de transfusão de plaquetas — outra pegadinha clássica.",
     "Os SINAIS DE ALARME marcam a entrada na fase crítica e mudam tudo na conduta. São eles: dor abdominal intensa e contínua; vômitos persistentes; acúmulo de líquidos (ascite, derrame pleural ou pericárdico); hipotensão postural/lipotimia; hepatomegalia maior que 2 cm; sangramento de mucosa; letargia ou irritabilidade; e aumento progressivo do hematócrito. A partir deles, o Ministério da Saúde estratifica em quatro grupos. GRUPO A: sem alarme, sem sangramento e sem condição de risco → hidratação ORAL em casa, 60 mL/kg/dia (1/3 com sal de reidratação oral, 2/3 com líquidos caseiros), retorno diário. GRUPO B: prova do laço positiva ou sangramento espontâneo de pele, OU condição de risco (menor de 2 anos, maior de 65, gestante, HAS, DM, asma, doença hematológica ou renal, hepatopatia, autoimune) ou risco social → HEMOGRAMA e observação na unidade; hematócrito normal cai para conduta do A, hematócrito alto sobe para C. GRUPO C: COM sinais de alarme, sem hipotensão → internação e expansão VENOSA com soro fisiológico 10 mL/kg na primeira hora, reavaliando e repetindo até 3 vezes. GRUPO D: choque/gravidade → 20 mL/kg em até 20 minutos, até 3 vezes, e leito de terapia intensiva.",
     "Três pontos finais que caem muito. (1) ANALGESIA: paracetamol e dipirona liberados; AAS e anti-inflamatórios (AINE) são CONTRAINDICADOS pelo risco de sangramento e de lesão renal. (2) VIGILÂNCIA: dengue é notificação compulsória SEMANAL — mas dengue GRAVE e ÓBITO por dengue são de notificação IMEDIATA (24h). (3) DIFERENCIAIS: chikungunya cursa com artralgia muito intensa, incapacitante, que pode cronificar por meses; zika dá exantema pruriginoso, conjuntivite e febre baixa ou ausente, e importa pela síndrome congênita e pela Guillain-Barré — zika em gestante é notificação imediata. Na prevenção, o eixo é o controle do vetor; a vacina Qdenga foi incorporada ao SUS em 2024, começando por adolescentes de 10 a 14 anos, em 2 doses com 3 meses de intervalo (a faixa vem sendo ampliada conforme a oferta — confira o calendário vigente)."],
   raciocinio:["Situe o paciente na linha do tempo: que dia de doença é? A piora mora entre o 3º e o 7º dia, quando a febre CAI.",
     "Procure ativamente os sinais de alarme (dor abdominal, vômitos, líquidos, hipotensão postural, hepatomegalia, sangramento, letargia, Ht subindo).",
     "Sem alarme e sem condição de risco = Grupo A: hidratação oral 60 mL/kg/dia em casa + retorno diário.",
     "Prova do laço positiva/sangramento de pele OU comorbidade/risco = Grupo B: hemograma na unidade e reclassificar pelo hematócrito.",
     "Com alarme = Grupo C: internar e expandir 10 mL/kg na 1ª hora. Com choque = Grupo D: 20 mL/kg em até 20 min + UTI.",
     "Nunca AAS/AINE. Plaquetopenia sem sangramento não se transfunde."],
   nucleo:["Fases: febril (1-3) → CRÍTICA na defervescência (3-7) → recuperação. Piora quando a febre cai.",
     "O mecanismo é extravasamento plasmático: hematócrito em ELEVAÇÃO é o alarme laboratorial-chave.",
     "Grupos: A (oral, 60 mL/kg/dia em casa) · B (hemograma na unidade) · C (alarme → 10 mL/kg na 1ª hora) · D (choque → 20 mL/kg em 20 min + UTI).",
     "Analgesia: paracetamol/dipirona. AAS e AINE CONTRAINDICADOS.",
     "Notificação semanal; dengue GRAVE e ÓBITO = imediata (24h). Zika em gestante = imediata.",
     "Chikungunya = artralgia intensa/crônica. Zika = exantema pruriginoso + conjuntivite, febre baixa/ausente."],
   pega:"A piora acontece na DEFERVESCÊNCIA (3º-7º dia), não no pico da febre — 'a febre passou' não é alta. Nunca AAS/AINE, e plaquetopenia isolada sem sangramento não se transfunde.",
   mne:"Alarme: dor Abdominal, Vômito, Líquidos, Hipotensão postural, Hepatomegalia, Sangramento, Letargia, Hematócrito subindo.",
   sus:"Notificação compulsória (grave/óbito em 24h), controle do Aedes e vacina Qdenga no PNI desde 2024 (início em 10-14 anos)."},

  {id:"cm-tuberculose",area:"CM",nome:"Tuberculose",yield:3,
   questoes:["cm_tb_q1","cm_tb_q2","cm_tb_q3","cm_tb_q4"],
   fonte:"Manual de Recomendações para o Controle da Tuberculose no Brasil (Ministério da Saúde/SVSA, atualização 2025); PCDT de Tuberculose; Diretrizes da OMS para TB drogarresistente (2022/2024).",
   aula:["A tuberculose é causada pelo Mycobacterium tuberculosis e se transmite por aerossol — o doente com TB pulmonar bacilífera tosse e espalha bacilos no ar. O Brasil está entre os países de alta carga, e a doença tem endereço social: concentra-se em pessoas privadas de liberdade, em situação de rua, pessoas vivendo com HIV e populações vulneráveis. O quadro clássico é arrastado: tosse por SEMANAS, febre vespertina, sudorese noturna e emagrecimento. A porta de entrada operacional da APS é o conceito de SINTOMÁTICO RESPIRATÓRIO — quem tosse há 3 semanas ou mais. Em pessoas vivendo com HIV, contatos e populações vulneráveis, QUALQUER tosse já investiga. A busca ativa desse tossidor é atribuição da equipe de saúde da família.",
