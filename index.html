<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Internato — Clínica Cirúrgica (protótipo)</title>
<style>
  :root{
    --bg:#0d1618; --panel:#12211f; --panel2:#16302b; --line:#1f3d37;
    --ink:#e8f2ee; --muted:#7fa49a; --acc:#3ddc97; --acc2:#5ec8ff;
    --warn:#f2c94c; --bad:#ff6b6b; --gold:#e6b450; --radius:14px;
    --glow:#12332c; --inputbg:#0a1512;
    --sans:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    --mono:'SFMono-Regular',ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 70% -10%,var(--glow) 0%,var(--bg) 55%);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  #app{max-width:1080px;margin:0 auto;padding:22px 18px 90px}
  h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em}
  button{font-family:inherit;cursor:pointer;border:none}
  .tag{font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
  .btn{background:var(--acc);color:#04120c;font-weight:700;padding:11px 16px;border-radius:10px;font-size:14px}
  .btn:hover{filter:brightness(1.08)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .btn.ghost:hover{border-color:var(--acc)}
  .btn.sm{padding:7px 12px;font-size:13px}
  .muted{color:var(--muted)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .grid{display:grid;gap:12px}
  .bar{height:8px;background:var(--inputbg);border-radius:99px;overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:99px;background:var(--acc)}
  .pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;border:1px solid var(--line);color:var(--muted)}
  .alt{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:13px 15px;border-radius:10px;margin-top:9px;font-size:15px;transition:.12s}
  .alt:hover{border-color:var(--acc)}
  .alt.correct{border-color:var(--acc);background:#123528}
  .alt.wrong{border-color:var(--bad);background:#331819}
  .alt.dim{opacity:.55}
  .comment{background:color-mix(in srgb, var(--acc) 12%, var(--panel));border-left:3px solid var(--acc);color:var(--ink);padding:12px 14px;border-radius:0 8px 8px 0;margin-top:14px;font-size:14px;line-height:1.55}
  .topico{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:15px;cursor:pointer;transition:.12s}
  .topico:hover{border-color:var(--acc)}
  .topico.soon{opacity:.72;cursor:default}
  .topico.soon:hover{border-color:var(--line)}
  .yield{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:color-mix(in srgb,var(--gold) 16%,var(--panel));border:1px solid color-mix(in srgb,var(--gold) 45%,var(--line));color:var(--gold)}
  .hero{background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 18%,var(--panel)),var(--panel));border:1px solid var(--acc);border-radius:16px;padding:20px;margin-bottom:18px}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   PROTÓTIPO — ABA INTERNATO (Clínica Cirúrgica)
   Objetivo: mostrar como as questões do PDF viram uma aba do app,
   com o mesmo motor de questões (enunciado + 4 alternativas +
   alternativa correta + comentário) usado hoje no ENAMED Engine.

   No app real, cada questão vira uma linha da tabela `questoes`
   (area:"CIR", tema, enunciado, alternativas, correta, comentario)
   ou entra num array em código. A estrutura abaixo já espelha isso.
   ============================================================ */

/* ---- 12 blocos do "CC - Tópicos A" ---- */
const BLOCOS = [
  {id:"abdome-agudo", nome:"Abdome agudo inflamatório e complicações", sub:"Apendicite · Colecistite · Diverticulite", total:19, yield:3},
  {id:"hernias",      nome:"Hérnias de parede abdominal",              sub:"Inguinal · Femoral · Incisional · Encarceramento", total:18, yield:3},
  {id:"posop",        nome:"Complicações e cuidados pós-operatórios",  sub:"Infecção · Hematoma · Seroma · Deiscência", total:10, yield:2},
  {id:"remit",        nome:"Resposta endócrino-metabólica ao trauma",  sub:"Fases ebb/flow · Cortisol · Catabolismo", total:8,  yield:2},
  {id:"preop",        nome:"Cuidados pré-op e risco cirúrgico",        sub:"ASA · Goldman · RCRI · Manejo de fármacos", total:10, yield:2},
  {id:"figado",       nome:"Afecções hepáticas",                       sub:"Hipertensão portal · Nódulos · Abscessos", total:10, yield:2},
  {id:"biliar",       nome:"Afecções da árvore biliar",               sub:"Coledocolitíase · Colangite · Íleo biliar", total:7,  yield:2},
  {id:"pancreas",     nome:"Afecções do pâncreas",                     sub:"Pancreatite · Pseudocisto · Neoplasias", total:12, yield:2},
  {id:"colorretal",   nome:"Câncer de cólon e reto",                   sub:"Rastreio · Estadiamento · Conduta", total:10, yield:2},
  {id:"toracocentese",nome:"Derrame pleural e toracocentese",          sub:"Light · Empiema · Técnica", total:9,  yield:1},
  {id:"suturas",      nome:"Fios, suturas e feridas",                  sub:"Absorvível/inabsorvível · Técnicas", total:9,  yield:1},
  {id:"orificiais",   nome:"Doenças orificiais",                       sub:"Hemorroidas · Fissura · Fístula · Abscesso", total:9,  yield:1},
];

/* ---- Banco de questões (formato = tabela `questoes`) ----
   Bloco 1 totalmente transcrito do PDF. Os demais entram igual. */
const QUESTOES = {
  "abdome-agudo":[
    {ref:"2024.2 ROT.1-B", enun:"Emergência: paciente de 55 anos com dor abdominal intensa, vômitos e rigidez abdominal. Radiografia de abdome revela ar sob o diafragma bilateralmente. Diagnóstico mais provável e intervenção inicial?",
     alts:["Pancreatite aguda; hidratação agressiva","Perfuração de víscera oca; laparotomia exploratória","Peritonite bacteriana espontânea; antibioticoterapia","Obstrução intestinal; dieta líquida e observação"],
     correta:1, coment:"Ar sob o diafragma (pneumoperitônio) sugere perfuração de víscera oca → cirurgia exploratória urgente. Pancreatite e PBE não cursam com pneumoperitônio; obstrução sem perfuração é conservadora."},
    {ref:"2024.2 ROT.1-B", enun:"Paciente de 22 anos, obeso, dor no quadrante inferior direito, anorexia e febre baixa há 2 dias; Blumberg positivo. Exame mais apropriado para confirmar apendicite aguda?",
     alts:["Ultrassonografia de abdome","Radiografia de abdome","Tomografia computadorizada de abdome","Ressonância magnética de abdome"],
     correta:2, coment:"A TC é o exame mais sensível e específico para apendicite. O US é limitado em obesos/distensão gasosa; a radiografia não serve; a RM não é rotina."},
    {ref:"2024.2 ROT.1-B", enun:"Paciente de 65 anos, hipertenso e diabético, com colecistite aguda (febre, dor no QSD, leucocitose). Após estabilização, plano de tratamento mais adequado?",
     alts:["Drenagem percutânea da vesícula como 1ª linha, adiando a cirurgia","ATB de amplo espectro + colecistectomia laparoscópica precoce (24–72h), conforme risco","ATB e aguardar 48h antes de considerar cirurgia","Colecistectomia laparoscópica imediata, independentemente do estado clínico"],
     correta:1, coment:"Equilíbrio ideal: ATB + colecistectomia laparoscópica precoce (24–72h) no paciente estabilizado. Drenagem percutânea fica para alto risco; esperar demais em comorbidades favorece complicações."},
    {ref:"2025.2 ROT.1-A", enun:"Homem de 62 anos, dor em hipogástrio há 48h, febre 38,5°C, dor no QIE sem irritação peritoneal. TC: espessamento do sigmoide e gás pericólico. Antibioticoterapia inicial mais adequada?",
     alts:["Ciprofloxacino em monoterapia","Metronidazol em monoterapia","Amoxicilina + clavulanato via oral, ambulatorial","Ceftriaxona IV + metronidazol IV"],
     correta:3, coment:"Diverticulite com febre e gás pericólico → internação e ATB IV cobrindo anaeróbios (Bacteroides) e gram-negativos (E. coli): ceftriaxona + metronidazol. Cipro isolado não cobre anaeróbio; metronidazol isolado só cobre anaeróbio."},
    {ref:"2025.2 ROT.1-A", enun:"Homem de 64 anos, dor em FIE há 48h, febre, parada de fezes/flatos, taquicárdico e hipotenso. TC: espessamento de sigmoide, ar extraluminal pericolônico e líquido livre. Conduta imediata?",
     alts:["Alta com ATB oral e retorno ambulatorial","Laparotomia exploradora de urgência","Internação para ATB venoso e observação, drenagem se piorar","Colonoscopia para confirmação diagnóstica"],
     correta:1, coment:"Diverticulite complicada com peritonite difusa + instabilidade → cirurgia imediata. Colonoscopia é contraindicada na fase aguda (risco de perfuração)."},
    {ref:"2025.2 ROT.1-A", enun:"Paciente de 12 anos: dor que iniciou difusa e migrou para FID, inapetência, náuseas, febre, plastrão palpável e descompressão brusca positiva. Principal hipótese?",
     alts:["Adenite mesentérica","Apendicite aguda","Intussuscepção intestinal","Gastroenterocolite aguda"],
     correta:1, coment:"Migração para FID + Blumberg + plastrão = apendicite aguda (Alvarado ~5). Adenite tem quadro viral prévio; intussuscepção é típica de <3 anos; GECA não dá dor migratória nem plastrão."},
    {ref:"2025.2 ROT.2-A", enun:"Paciente de 45 anos, dor súbita em hipocôndrio direito há 6h, contínua e progressiva, febre 38,3°C, Murphy positivo, leucocitose 14.000, sem alteração de bilirrubinas/enzimas pancreáticas. Diagnóstico?",
     alts:["Colecistite aguda","Coledocolitíase","Pancreatite aguda biliar","Colecistite crônica"],
     correta:0, coment:"Tríade da colecistite aguda: dor em HD, febre e leucocitose + Murphy positivo. Sem icterícia/colestase (afasta coledocolitíase) e sem amilase/lipase altas (afasta pancreatite)."},
    {ref:"2025.2 ROT.2-A", enun:"Pós-op de fratura de tíbia em uso de AINE: dor abdominal súbita, distensão, parada de fezes/flatos, febre, taquicardia, hipotensão, perda da macicez hepática e hipertimpanismo. Diagnóstico sindrômico?",
     alts:["Abdome agudo perfurativo","Abdome agudo vascular","Abdome agudo hemorrágico","Abdome agudo inflamatório"],
     correta:0, coment:"Provável perfuração de úlcera por AINE: dor súbita, irritação peritoneal, perda da macicez hepática (pneumoperitônio) e instabilidade = perfurativo. Hemorrágico dá choque sem pneumoperitônio; vascular dá dor desproporcional."},
    {ref:"2025.2 ROT.2-A", enun:"Homem de 22 anos, dor periumbilical que migrou para FID há 18h, náuseas/vômitos, pálido, sudoreico, PA 94/58, FC 124, defesa involuntária e descompressão difusa. Conduta mais adequada?",
     alts:["Analgesia e alta com retorno se piorar","ATB e hidratação venosa, observação por 24h","TC abdominal antes de qualquer intervenção","Cirurgia de urgência com suporte hemodinâmico e ATB de amplo espectro"],
     correta:3, coment:"Apendicite complicada (provável perfuração) com peritonite difusa e instabilidade → cirurgia de urgência após estabilização, independentemente do escore. TC só atrasaria."},
    {ref:"2025.2 ROT.2-A", enun:"Homem de 65 anos, dor no QIE há 3 dias, febre e diarreia, sem irritação peritoneal difusa. TC: espessamento do sigmoide e coleção de ~5 cm sugestiva de abscesso peridiverticular. Conduta inicial?",
     alts:["Internação, ATB venoso e drenagem percutânea do abscesso","Cirurgia de urgência com colectomia e colostomia","Colonoscopia urgente para afastar carcinoma","ATB oral ambulatorial com reavaliação em 48h"],
     correta:0, coment:"Diverticulite complicada por abscesso ≥4 cm: drenagem percutânea guiada por imagem + ATB IV. Cirurgia fica para peritonite/perfuração/falha; colonoscopia é contraindicada na fase aguda."},
    {ref:"2025.2 ROT.3-A", enun:"Homem de 28 anos, dor epigástrica há 24h que migrou para o QID, anorexia, náuseas, febre, dor em FID, leucocitose com desvio. Pela fisiopatologia, é mais compatível com:",
     alts:["Apendicite aguda (dor visceral evoluindo para irritação peritoneal localizada)","Diverticulite aguda à direita","Pancreatite aguda","Colecistite aguda"],
     correta:0, coment:"Apendicite: dor inicialmente visceral (epigástrio/mesogástrio) que migra para FID com a irritação peritoneal somática. Pancreatite irradia para dorso; colecistite fica em HD; diverticulite à direita é rara."},
    {ref:"2025.1 ROT.1-B", enun:"Homem de 45 anos com apendicite aguda complicada por abscesso localizado (TC); equipe opta por manejo medicamentoso antes da cirurgia. Melhor esquema antimicrobiano inicial?",
     alts:["Cefazolina + metronidazol","Clindamicina isolada","Ceftriaxona + metronidazol","Ciprofloxacino isolado"],
     correta:2, coment:"Ceftriaxona + metronidazol cobre gram-negativos entéricos, anaeróbios (Bacteroides) e gram-positivos — padrão em infecção intra-abdominal complicada polimicrobiana. Cefazolina/clindamicina não cobrem bem gram-negativos; cipro não cobre anaeróbio."},
    {ref:"2025.1 ROT.1-B", enun:"Homem de 45 anos, dor que se localizou em FID, náuseas, febre, perda de apetite; Blumberg positivo, defesa, sem icterícia; Alvarado = 7. Conduta mais adequada?",
     alts:["Solicitar exames e aguardar 48h antes de definir diagnóstico","Iniciar ATB e considerar cirurgia, dado o Alvarado alto","US para excluir apendicite/diverticulite, TC só se dúvida quanto a colecistite","TC para confirmar apendicite e excluir colecistite/diverticulite"],
     correta:1, coment:"Quadro clássico com Alvarado 7 (alto risco): internação, avaliação cirúrgica, ATB e cirurgia sem imagem adicional. Aguardar 48h aumenta risco de perfuração; imagem pode atrasar o tratamento."},
    {ref:"2025.1 ROT.1-B", enun:"Homem de 65 anos, dor intensa no QIE, febre 38,5°C, desidratação, defesa muscular sem irritação franca, 20.000 leucócitos. TC: abscesso pericólico de 6 cm na FIE, sem perfuração livre. 1º episódio. Tratamento mais apropriado?",
     alts:["Drenagem percutânea do abscesso + tratamento clínico com ATB","Colostomia em alça imediata","Tratamento conservador com ATB, anti-inflamatórios e repouso","Cirurgia laparoscópica de ressecção do segmento afetado"],
     correta:0, coment:"Abscesso diverticular >3 cm: drenagem percutânea + ATB, estabilizando antes de qualquer cirurgia. ATB isolado é insuficiente com abscesso drenável; ressecção/colostomia ficam para falha ou complicação."},
    {ref:"2025.1 ROT.2-B", enun:"Paciente de 24 anos, dor epigástrica que migrou para o QID, sinais de Blumberg e Rovsing presentes, Alvarado 8. Patógeno mais comumente combatido na antibioticoterapia?",
     alts:["Staphylococcus aureus","Streptococcus pyogenes","Staphylococcus epidermidis","Escherichia coli"],
     correta:3, coment:"Apendicite aguda: patógeno mais comum é a E. coli (gram-negativa da flora do intestino grosso). As demais são gram-positivas (pele, faringite, infecção hospitalar)."},
    {ref:"2025.1 ROT.3-B", enun:"Paciente de 45 anos, dor no QIE, febre e leucocitose. TC: espessamento da parede do sigmoide, infiltração da gordura pericólica e bolhas de gás extraluminal sem líquido livre abundante. Diagnóstico?",
     alts:["Adenite mesentérica","Diverticulite aguda do sigmoide","Apendicite aguda","Colecistite aguda"],
     correta:1, coment:"Diverticulite aguda do sigmoide (comum após 40 anos), com achados clássicos de TC. Apendicite dá espessamento do apêndice; colecistite acomete a vesícula."},
    {ref:"2025.1 ROT.3-B", enun:"Paciente de 68 anos, diabético insulinodependente, dor no HD há 48h, náusea, vômito, febre. TC sugere colecistite aguda enfisematosa. Principal agente etiológico?",
     alts:["Escherichia coli","Clostridium perfringens","Klebsiella pneumoniae","Proteus mirabilis"],
     correta:1, coment:"Colecistite enfisematosa (gás na parede, mais comum em diabéticos): agente mais comum é o Clostridium perfringens (welchii), anaeróbio formador de gás. E. coli/Klebsiella podem ocorrer, mas são menos prevalentes."},
    {ref:"2026.1 ROT.1-A", enun:"Homem de 32 anos, dor há 36h que migrou para QID e ficou difusa e intensa, febre alta, PA 92/58, FC 122, rigidez, descompressão positiva, distensão, leucócitos 19.800 com desvio. Conduta imediata?",
     alts:["Solicitar TC e manter analgesia, aguardando imagem antes de decidir","Programar drenagem percutânea e apendicectomia eletiva em 6 semanas","Iniciar ressuscitação volêmica + ATB IV de amplo espectro e encaminhar imediatamente à cirurgia","ATB venoso e encaminhar ao CTI para monitorização"],
     correta:2, coment:"Apendicite complicada por perfuração e peritonite generalizada com instabilidade: estabilizar (volume + ATB IV) e cirurgia imediata. Esperar imagem ou tratar só clinicamente atrasa o definitivo."},
    {ref:"2026.1 ROT.1-A", enun:"Homem de 47 anos, dor há 18h em hipogástrio/FIE, piora progressiva, febre baixa, alteração do hábito intestinal, dor no QIE com defesa; nega dor em HD e Murphy negativo. Diagnóstico mais provável?",
     alts:["Diverticulite aguda","Apendicite aguda","Colecistite aguda","Pancreatite aguda"],
     correta:0, coment:"Dor no QIE + febre + alteração do hábito intestinal = diverticulite. Sem sinais de colecistite (dor em HD, Murphy) e padrão não compatível com apendicite (QID) ou pancreatite (dor em faixa para dorso)."},
  ],
  /* Os outros 11 blocos entram exatamente no mesmo formato. */
};

/* =================== render =================== */
const app = document.getElementById("app");
const L = ["A","B","C","D","E"];
let estado = {tela:"lista", bloco:null};

function el(tag, attrs={}, ...filhos){
  const n=document.createElement(tag);
  for(const k in attrs){
    if(k==="class") n.className=attrs[k];
    else if(k==="html") n.innerHTML=attrs[k];
    else if(k.startsWith("on")) n.addEventListener(k.slice(2).toLowerCase(),attrs[k]);
    else n.setAttribute(k,attrs[k]);
  }
  filhos.flat().forEach(f=>{ if(f==null)return; n.appendChild(typeof f==="string"?document.createTextNode(f):f); });
  return n;
}

function render(){
  app.innerHTML="";
  if(estado.tela==="lista") return telaLista();
  return telaBloco(estado.bloco);
}

function telaLista(){
  const feitos = Object.keys(QUESTOES).length;
  app.appendChild(el("div",{class:"tag",style:"color:var(--acc)"},"ENAMED ENGINE · INTERNATO"));
  app.appendChild(el("h1",{style:"font-size:28px;margin:6px 0 4px"},"Clínica Cirúrgica"));
  app.appendChild(el("div",{class:"hero"},
    el("b",{style:"font-size:16px"},"Questões do internato — Afya"),
    el("div",{class:"muted",style:"font-size:13.5px;margin-top:6px;line-height:1.55"},
      "131 questões organizadas em 12 blocos, no formato dos rodízios (2024.2 a 2026.1). Escolha um bloco e treine com correção comentada, igual ao restante do app."),
  ));

  const grid = el("div",{class:"grid",style:"grid-template-columns:repeat(auto-fill,minmax(300px,1fr))"});
  BLOCOS.forEach(b=>{
    const pronto = !!QUESTOES[b.id];
    const card = el("div",{class:"topico"+(pronto?"":" soon"), onClick:()=>{ if(pronto){estado={tela:"bloco",bloco:b.id}; window.scrollTo(0,0); render();} }},
      el("div",{class:"row",style:"justify-content:space-between;align-items:flex-start"},
        el("div",{style:"flex:1"},
          el("div",{style:"font-weight:700;font-size:15.5px;line-height:1.3"},b.nome),
          el("div",{class:"muted",style:"font-size:12.5px;margin-top:4px"},b.sub),
        ),
        b.yield>=3 ? el("span",{class:"yield"},"ALTO RENDIMENTO") : null,
      ),
      el("div",{class:"row",style:"justify-content:space-between;margin-top:12px"},
        el("span",{class:"pill",style:pronto?"color:var(--acc);border-color:var(--acc)":""}, b.total+" questões"),
        el("span",{class:"muted",style:"font-size:12px"}, pronto?"Disponível ✓":"Em breve"),
      ),
    );
    grid.appendChild(card);
  });
  app.appendChild(grid);

  app.appendChild(el("div",{class:"muted",style:"font-size:12px;margin-top:18px;text-align:center"},
    "Protótipo · "+feitos+" de 12 blocos carregados. Os demais entram no mesmo formato."));
}

function telaBloco(id){
  const meta = BLOCOS.find(b=>b.id===id);
  const qs = QUESTOES[id]||[];
  let i=0, respondida=false, acertos=0, respostas=[];

  app.appendChild(el("button",{class:"btn ghost sm",onClick:()=>{estado={tela:"lista"};window.scrollTo(0,0);render();}},"← Blocos"));
  const head = el("div",{style:"margin:14px 0 4px"},
    el("div",{class:"tag",style:"color:var(--acc)"},"CLÍNICA CIRÚRGICA"),
    el("h2",{style:"font-size:22px;margin-top:4px"},meta.nome),
  );
  app.appendChild(head);

  const barra = el("div",{class:"bar",style:"margin:14px 0"}); const barraI=el("i"); barra.appendChild(barraI);
  app.appendChild(barra);
  const container = el("div"); app.appendChild(container);
  const rodape = el("div",{class:"row",style:"margin-top:14px"}); app.appendChild(rodape);

  function desenhar(){
    barraI.style.width = (((i+ (respondida?1:0))/qs.length)*100)+"%";
    container.innerHTML=""; rodape.innerHTML="";
    if(i>=qs.length){
      container.appendChild(el("div",{class:"card"},
        el("div",{class:"tag",style:"color:var(--acc)"},"BLOCO CONCLUÍDO"),
        el("div",{style:"font-size:34px;font-weight:800;letter-spacing:-.03em;margin:8px 0 2px"}, acertos+" / "+qs.length),
        el("div",{class:"muted",style:"font-size:14px;margin-bottom:14px"}, Math.round(acertos/qs.length*100)+"% de acerto neste bloco."),
        el("div",{class:"row"},
          el("button",{class:"btn ghost",onClick:()=>{i=0;acertos=0;respondida=false;respostas=[];desenhar();}},"↻ Refazer bloco"),
          el("button",{class:"btn",onClick:()=>{estado={tela:"lista"};window.scrollTo(0,0);render();}},"Voltar aos blocos"),
        ),
      ));
      return;
    }
    const q=qs[i];
    const cartao = el("div",{class:"card"},
      el("div",{class:"row",style:"justify-content:space-between;margin-bottom:10px"},
        el("div",{class:"row",style:"gap:8"},
          el("span",{class:"pill",style:"color:var(--acc);border-color:var(--acc)"},"Cirurgia"),
          el("span",{class:"pill"},meta.nome.split(" ").slice(0,2).join(" ")),
          q.ref? el("span",{class:"pill",style:"color:var(--acc2)"},q.ref):null,
        ),
        el("span",{class:"muted",style:"font-size:13px"}, (i+1)+"/"+qs.length),
      ),
      el("div",{style:"font-size:15.5px;line-height:1.6;margin-bottom:6px"}, q.enun),
    );
    q.alts.forEach((a,idx)=>{
      const b=el("button",{class:"alt"}, el("b",{style:"color:var(--muted);margin-right:8px"},L[idx]), a);
      b.addEventListener("click",()=>{
        if(respondida) return;
        respondida=true; const ok=idx===q.correta; if(ok)acertos++; respostas[i]=idx;
        [...cartao.querySelectorAll(".alt")].forEach((btn,k)=>{
          if(k===q.correta) btn.classList.add("correct");
          else if(k===idx) btn.classList.add("wrong");
          else btn.classList.add("dim");
        });
        cartao.appendChild(el("div",{class:"comment"},
          el("b",{style:"color:"+(ok?"var(--acc)":"var(--bad)")}, ok?"Correto. ":"Incorreto. "), q.coment));
        desenharRodape();
      });
      cartao.appendChild(b);
    });
    container.appendChild(cartao);
    if(respondida){ // caso volte a desenhar já respondida (não usado, mas seguro)
    }
    desenharRodape();
  }

  function desenharRodape(){
    rodape.innerHTML="";
    const btn = el("button",{class:"btn",disabled: !respondida ? "" : null,
      onClick:()=>{ if(!respondida)return; i++; respondida=false; desenhar(); }},
      i<qs.length-1 ? "Próxima" : "Ver resultado");
    if(!respondida) btn.setAttribute("disabled","");
    rodape.appendChild(btn);
    rodape.appendChild(el("span",{class:"muted",style:"font-size:13px"}, respondida?"":"Escolha uma alternativa para avançar."));
  }

  desenhar();
}

render();
</script>
</body>
</html>
