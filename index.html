     "Fecha o tema o SOPRO, que é o motivo mais comum de encaminhamento — e a boa notícia: a maioria dos sopros na criança é INOCENTE (funcional). O sopro inocente é sistólico, suave, curto, muda com a posição e vem em criança assintomática, com pulsos normais e sem outros achados. Os sinais de ALERTA que exigem investigação com ecocardiograma são: sopro DIASTÓLICO (nunca é inocente), sopro holossistólico, frêmito, sopro alto (3/6 ou mais), sintomas (cansaço à mamada, baixo ganho de peso), cianose, pulsos alterados e história familiar. E, ligando com o assunto anterior: é justamente para pegar as críticas antes do colapso que existe o teste do coraçãozinho, entre 24 e 48 horas."],
   raciocinio:["O bebê é azul ou não? Acianótica (shunt E→D, hiperfluxo, IC): CIV (a mais comum), CIA, PCA, coarctação. Cianótica (shunt D→E): os 5 T.",
     "Lactente com taquipneia, sudorese à MAMADA, baixo ganho de peso e hepatomegalia = insuficiência cardíaca por hiperfluxo.",
     "Cianose: faça o teste da hiperóxia — não melhorou com O2 a 100% = CARDÍACA; melhorou = pulmonar.",
     "RN que colapsa (choque/cianose grave) nos primeiros dias de vida = pense DUCTO-DEPENDENTE → PROSTAGLANDINA E1 para MANTER o canal aberto + centro terciário.",
     "Palpe os pulsos FEMORAIS e compare PA de membros superiores e inferiores: diferença = coarctação de aorta.",
     "Crise hipoxêmica na tetralogia de Fallot: posição GENUPEITORAL + O2 + morfina + volume.",
     "Sopro: a maioria é INOCENTE (sistólico, suave, criança bem). Investigue se: diastólico, holossistólico, frêmito, ≥3/6, sintomas, cianose ou pulsos alterados."],
   nucleo:["Acianóticas (shunt E→D, hiperfluxo, IC): CIV é a cardiopatia congênita MAIS COMUM; também CIA, PCA e coarctação.",
     "IC do lactente: taquipneia, sudorese e cansaço À MAMADA, baixo ganho ponderal, hepatomegalia.",
     "Cianóticas — os 5 T: Tetralogia de Fallot (mais comum no geral), Transposição das grandes artérias (mais comum no período NEONATAL), Tronco arterioso, atresia Tricúspide, drenagem anômala Total de veias pulmonares.",
     "Teste da hiperóxia: NÃO melhora com O2 100% = cianose CARDÍACA; melhora = pulmonar.",
     "DUCTO-DEPENDENTES (TGA, atresia pulmonar, coarctação grave, hipoplasia de VE): o RN colapsa quando o canal FECHA → PROSTAGLANDINA E1 para MANTER o canal aberto + transferência.",
     "Coarctação: diferença de pulso/PA entre membros superiores e inferiores; pulsos FEMORAIS diminuídos/ausentes.",
     "Tetralogia de Fallot: CIV + estenose pulmonar + dextroposição da aorta + hipertrofia de VD. Crise hipoxêmica ('tet spell') → posição GENUPEITORAL + O2 + morfina + volume.",
     "Sopro inocente: sistólico, suave, assintomático, pulsos normais. Alerta: DIASTÓLICO (nunca inocente), holossistólico, frêmito, ≥3/6, sintomas, cianose, pulsos alterados."],
   pega:"Recém-nascido que descompensa em choque nos primeiros dias de vida = cardiopatia DUCTO-DEPENDENTE: a conduta é PROSTAGLANDINA para MANTER o canal ABERTO. Cianose que não melhora com O2 a 100% é cardíaca, não pulmonar. E sopro DIASTÓLICO nunca é inocente.",
   mne:"5 T das cianóticas. Canal fechou = colapsou → prostaglandina ABRE. Fallot em crise = genupeitoral. Femoral fraco = coarctação.",
   sus:"Teste do coraçãozinho (24-48h) rastreia as críticas na maternidade do SUS; diagnóstico precoce depende de referência à cardiologia pediátrica."},

  {id:"ped-congenitas",area:"PED",nome:"Infecções congênitas (STORCH)",yield:3,
   questoes:["ped_cong_q1","ped_cong_q2","ped_cong_q3","ped_cong_q4"],
   fonte:"Protocolo de Sífilis Congênita e Guia de Vigilância em Saúde (Ministério da Saúde); PCDT de Toxoplasmose Congênita; Documento Científico de Neonatologia/Infectologia da Sociedade Brasileira de Pediatria; protocolo de vigilância da síndrome congênita associada ao zika (MS).",
   aula:["As infecções congênitas são as que atravessam a placenta e chegam ao feto, resumidas na sigla STORCH: Sífilis, Toxoplasmose, Outras (parvovírus B19, varicela, zika), Rubéola, Citomegalovírus e Herpes. Duas ideias governam o tema. A primeira: muitas são ASSINTOMÁTICAS ao nascer e só mostram a cara depois, como surdez ou déficit visual — por isso o rastreio no pré-natal e a triagem neonatal valem mais que o exame do bebê aparentemente saudável. A segunda: o momento da infecção importa — quanto mais PRECOCE na gestação, menor a chance de transmitir, porém MAIOR a gravidade; quanto mais tardia, maior a transmissão e menor a gravidade.",
     "SÍFILIS CONGÊNITA é a mais cobrada, e por um motivo desconfortável: ela é 100% evitável, e sua ocorrência denuncia falha do sistema — pré-natal que não testou, ou que testou e não tratou direito. No RN sintomático, procure: rinite SANGUINOLENTA (coriza serossanguinolenta, muito característica), PÊNFIGO palmoplantar (lesões bolhosas em palmas e plantas), lesões ósseas com periostite e a pseudoparalisia de Parrot (o bebê não mexe o membro de dor), hepatoesplenomegalia e icterícia. As manifestações tardias completam o quadro clássico: dentes de Hutchinson, nariz em sela, tíbia em sabre e surdez. E o conceito operacional que decide a questão é o de MÃE ADEQUADAMENTE TRATADA: penicilina benzatina, no esquema completo e apropriado ao estágio, iniciado até 30 DIAS antes do parto, com queda adequada da titulação — e, pelo critério do Ministério, com o parceiro também tratado. Se a mãe NÃO foi adequadamente tratada, TODO recém-nascido é investigado (VDRL do sangue periférico, hemograma, raio-x de ossos longos, líquor) e tratado conforme o achado. Sífilis congênita é notificação compulsória.",
     "TOXOPLASMOSE congênita tem uma tríade com nome: a TRÍADE DE SABIN — coriorretinite (a mais frequente e a que rouba a visão), hidrocefalia e calcificações cerebrais DIFUSAS. Na gestante, o tratamento tem duas lógicas: ESPIRAMICINA quando a infecção é materna e o feto ainda não está infectado, para tentar impedir a passagem; e sulfadiazina + pirimetamina + ácido folínico quando há infecção fetal confirmada (após o primeiro trimestre). O recém-nascido infectado trata por 12 meses com sulfadiazina + pirimetamina + ácido folínico.",
     "CITOMEGALOVÍRUS é a infecção congênita MAIS COMUM e a principal causa NÃO genética de surdez neurossensorial. O quadro: microcefalia com calcificações PERIVENTRICULARES, petéquias e o aspecto de 'blueberry muffin', hepatoesplenomegalia, icterícia. O diagnóstico se faz por PCR na urina ou saliva nas primeiras 3 SEMANAS de vida (depois disso não se distingue infecção congênita de adquirida). Casos selecionados — sintomáticos, com acometimento do sistema nervoso — tratam com ganciclovir/valganciclovir, que melhora o desfecho auditivo.",
     "E aqui está o pulo do gato que a banca adora: as CALCIFICAÇÕES separam as duas grandes. TOXOPLASMOSE = calcificações DIFUSAS + HIDROCEFALIA. CMV = calcificações PERIVENTRICULARES + MICROCEFALIA. Guarde esse par e você acerta a questão de imagem. Completando: a síndrome congênita do ZIKA cursa com microcefalia de desproporção craniofacial, calcificações subcorticais e artrogripose — e zika em gestante é notificação IMEDIATA. A RUBÉOLA congênita tem sua própria tríade: surdez + catarata + cardiopatia (tipicamente persistência do canal arterial). E o HERPES neonatal, adquirido em geral na passagem pelo canal de parto, apresenta-se com vesículas, encefalite ou sepse — e trata-se com aciclovir."],
   raciocinio:["Lembre da regra do tempo: infecção precoce na gestação = transmite menos, mas é mais grave; tardia = transmite mais, é menos grave.",
     "RN com rinite sanguinolenta + pênfigo palmoplantar + lesões ósseas = sífilis congênita.",
     "Cheque se a mãe foi ADEQUADAMENTE tratada: penicilina benzatina, esquema completo pelo estágio, iniciado até 30 dias antes do parto, com queda de titulação (e parceiro tratado).",
     "Mãe NÃO adequadamente tratada = investigar TODO RN (VDRL, hemograma, Rx de ossos longos, líquor) e tratar. Notificar.",
     "Coriorretinite + hidrocefalia + calcificações DIFUSAS = toxoplasmose (tríade de Sabin).",
     "Microcefalia + calcificações PERIVENTRICULARES + surdez = citomegalovírus (o mais comum); diagnóstico por PCR em urina/saliva nas 3 primeiras semanas.",
     "Surdez + catarata + cardiopatia (PCA) = rubéola congênita. Microcefalia com desproporção craniofacial + artrogripose = zika (notificação imediata).",
     "Vesículas/encefalite/sepse no neonato = herpes → aciclovir."],
   nucleo:["STORCH: Sífilis, Toxoplasmose, Outras (parvovírus, varicela, zika), Rubéola, Citomegalovírus, Herpes. Muitas são assintomáticas ao nascer.",
     "Regra do tempo: infecção PRECOCE = menos transmissão, mais gravidade. TARDIA = mais transmissão, menos gravidade.",
     "Sífilis congênita: rinite SANGUINOLENTA, PÊNFIGO palmoplantar, periostite/pseudoparalisia de Parrot, hepatoesplenomegalia. Tardias: dentes de Hutchinson, nariz em sela, tíbia em sabre, surdez.",
     "Mãe adequadamente tratada = penicilina benzatina, esquema completo pelo estágio, iniciado até 30 DIAS antes do parto, com queda de titulação (e parceiro tratado). Se não: investigar TODO RN (VDRL, hemograma, Rx ossos longos, líquor) e tratar. Notificação compulsória.",
     "Toxoplasmose — tríade de Sabin: coriorretinite + hidrocefalia + calcificações DIFUSAS. Gestante: espiramicina (feto não infectado) ou sulfadiazina + pirimetamina + ácido folínico (infecção fetal). RN: 12 meses de tratamento.",
     "CMV: a congênita MAIS COMUM; principal causa não genética de SURDEZ. Microcefalia + calcificações PERIVENTRICULARES + blueberry muffin. PCR urina/saliva nas 3 primeiras semanas; ganciclovir/valganciclovir em selecionados.",
     "DIFERENCIAL DE IMAGEM: toxoplasmose = calcificações DIFUSAS + hidrocefalia · CMV = calcificações PERIVENTRICULARES + microcefalia.",
     "Rubéola congênita: surdez + catarata + cardiopatia (PCA). Zika: microcefalia com desproporção craniofacial, calcificações subcorticais, artrogripose — notificação IMEDIATA. Herpes neonatal: vesículas/encefalite/sepse → aciclovir."],
   pega:"Toxoplasmose = calcificações DIFUSAS + hidrocefalia; CMV = calcificações PERIVENTRICULARES + microcefalia — a banca troca os dois. E o conceito de 'mãe adequadamente tratada' na sífilis exige penicilina benzatina completa iniciada até 30 dias antes do parto: fora disso, investiga-se e trata-se o RN.",
   mne:"Toxo = Difusa + hidrocefalia. CMV = periVentricular + microcefalia. Sífilis = rinite sanguinolenta + pênfigo palmoplantar. Rubéola = surdez + catarata + PCA.",
   sus:"Sífilis congênita é evento sentinela de falha do pré-natal e notificação compulsória; testagem rápida e penicilina na UBS previnem 100% dos casos."},
  {id:"mfc-atributos",area:"MFC",nome:"Atributos da APS (Starfield)",yield:3,
   questoes:["mfc_atributos_q1","mfc_atributos_q2","mfc_atributos_q3","mfc_atributos_q4"],
   fonte:"Starfield B. Atenção Primária (traduzido MS/UNESCO); Política Nacional de Atenção Básica - PNAB (Portaria 2.436/2017); Diretrizes Curriculares Nacionais de Medicina.",
   aula:["A atenção primária (APS) é a porta de entrada e a base de todo o sistema de saúde, e a professora Barbara Starfield definiu os atributos que fazem uma APS ser de qualidade. A prova adora cobrar o RECONHECIMENTO de cada atributo dentro de um caso — por isso não basta decorar a lista, é preciso entender o que cada um significa na prática.","São quatro atributos ESSENCIAIS. Primeiro contato / acesso: a APS é o primeiro recurso que a pessoa procura a cada novo problema. Longitudinalidade: o vínculo e o acompanhamento da MESMA pessoa/equipe ao longo do TEMPO, conhecendo sua história (é o atributo do 'me acompanha há anos'). Integralidade: oferecer ou garantir o cuidado para o conjunto de necessidades (promoção, prevenção, cura, reabilitação), não só a queixa do dia. Coordenação: a APS organiza e integra o cuidado que acontece em outros pontos da rede (encaminhamentos, resultados, continuidade).","Além desses, há três atributos DERIVADOS, que qualificam a prática: orientação familiar (considerar a família no cuidado), orientação comunitária (conhecer e agir sobre o território e a comunidade) e competência cultural (respeitar a cultura e os valores da população atendida).","A pegadinha mais frequente é confundir LONGITUDINALIDADE com INTEGRALIDADE. Longitudinalidade é a dimensão do TEMPO — a mesma equipe acompanhando a pessoa por anos. Integralidade é a AMPLITUDE do cuidado — abraçar todas as necessidades, não só a doença atual. No caso clínico, 'sempre atendido pela mesma equipe, que acompanha sua história ao longo dos anos' = longitudinalidade. Esses atributos são a base conceitual da Estratégia Saúde da Família e das Diretrizes Curriculares — quase garantia de cair."],
   raciocinio:["Diante do caso, identifique QUAL atributo está sendo descrito.","Vínculo/acompanhamento ao longo do TEMPO pela mesma equipe = longitudinalidade.","Cuidado AMPLO (todas as necessidades, promoção à reabilitação) = integralidade.","Primeiro recurso procurado a cada problema = primeiro contato/acesso.","Organizar o cuidado na rede (encaminhar, integrar resultados) = coordenação."],
   nucleo:["Essenciais: 1º contato/acesso, Longitudinalidade, Integralidade, Coordenação.","Derivados: orientação familiar, comunitária e competência cultural.","Longitudinalidade = TEMPO/vínculo; Integralidade = AMPLITUDE do cuidado.","Base conceitual da ESF e das DCN."],
   pega:"Não confunda longitudinalidade (vínculo ao longo do tempo) com integralidade (amplitude do cuidado). A banca troca os dois.",mne:"Essenciais = 'LICo': Longitudinalidade, Integralidade, Coordenação + primeiro Contato.",sus:"Atributos de Starfield fundamentam a ESF e as Diretrizes Curriculares."},
  {id:"mfc-rastreio",area:"MFC",nome:"Rastreamentos no SUS",yield:3,
   questoes:["mfc_rastreio_q1","mfc_rastreio_q2","mfc_rastreio_q3","mfc_rastreio_q4"],
   fonte:"Cadernos de Atenção Primária e Rastreamento (Ministério da Saúde); conceito de prevenção quaternária (WONCA); recomendações do INCA.",
   aula:["A Medicina de Família tem uma preocupação que a prova ama: não basta prevenir, é preciso prevenir CERTO, sem causar dano. Os níveis de prevenção ajudam a pensar. Primária: evitar a doença aparecer (vacina, cessação do tabagismo). Secundária: detectar cedo em quem não tem sintoma (rastreamento). Terciária: reduzir sequelas de doença já instalada (reabilitação). E há a quaternária: proteger o paciente do EXCESSO de medicina — evitar exames, diagnósticos e tratamentos desnecessários.","Rastrear bem significa fazer só o que tem evidência de reduzir mortalidade, na faixa e no intervalo certos (colo, mama, alguns outros). Rastrear mal — pedir uma bateria de exames 'de rotina' sem indicação — gera sobrediagnóstico, ansiedade, procedimentos desnecessários e às vezes dano direto. É aí que entra a prevenção quaternária.","O exemplo campeão de prova é o rastreamento de câncer de PRÓSTATA por PSA em massa: NÃO é recomendado como rastreamento populacional pelo MS, porque o balanço de benefício e dano não favorece (muito sobrediagnóstico de tumores que nunca dariam problema). Marcar 'solicitar PSA e toque de rotina em homem assintomático' costuma ser a alternativa errada.","O raciocínio que a banca quer: diante de um paciente assintomático, a conduta de qualidade é abordar o que muda desfecho (estilo de vida, vacinas, rastreios com evidência) e EVITAR o excesso. 'Mais exame' não é sinônimo de 'melhor cuidado' — muitas vezes é o contrário."],
   raciocinio:["Classifique a ação: prevenção primária, secundária, terciária ou quaternária.","Rastreie só o que tem evidência, na faixa/intervalo corretos.","Desconfie de 'bateria de exames de rotina' sem indicação (sobrediagnóstico).","PSA/toque de rotina em homem assintomático NÃO é rastreamento recomendado.","Priorize o que muda desfecho (estilo de vida, vacinas, rastreios válidos)."],
   nucleo:["Níveis: primária, secundária (rastreio), terciária, quaternária.","Prevenção quaternária: evitar excesso de medicina/sobrediagnóstico.","Rastrear só com evidência, na faixa/intervalo certos.","Rastreio de próstata por PSA em massa NÃO é recomendado."],
   pega:"Rastreio de próstata por PSA em massa NÃO é recomendado. Mais exame ≠ melhor cuidado (prevenção quaternária).",mne:"Rastreio bom = evidência + faixa certa.",sus:"Prevenção quaternária é conceito muito querido da MFC brasileira."},
  {id:"mfc-vigilancia",area:"MFC",nome:"Vigilância e notificação",yield:3,
   questoes:["mfc_vigilancia_q1","mfc_vigilancia_q2","mfc_vigilancia_q3","mfc_vigilancia_q4"],
   fonte:"Portaria de Consolidação nº 4/2017 e Portaria 204/2016 (Lista Nacional de Notificação Compulsória); Guia de Vigilância em Saúde (Ministério da Saúde).",
   aula:["Vigilância em saúde é o conjunto de ações que monitora doenças e agravos na população para agir rápido — conter surtos, proteger contatos, orientar políticas. A ferramenta prática que o médico usa é a NOTIFICAÇÃO: comunicar oficialmente os casos de certas doenças às autoridades de saúde. Isso alimenta o sistema e dispara as respostas.","As doenças de notificação compulsória são registradas no SINAN (Sistema de Informação de Agravos de Notificação). A lista é definida pelo Ministério da Saúde e inclui doenças como dengue, tuberculose, sífilis, hanseníase, violência, entre muitas. A regra de ouro para a prova: confirmou (ou às vezes só suspeitou, conforme a doença) um caso da lista? Notifique. Não notificar é falha grave e cai como 'pegadinha' de conduta.","Um ponto que separa quem estudou: o PRAZO. Algumas doenças exigem notificação IMEDIATA (em até 24 horas) por serem de alto potencial de disseminação ou gravidade — por exemplo, sarampo, casos suspeitos de doenças de interesse internacional, surtos. Outras têm notificação semanal (a maioria das de rotina). Saber diferenciar imediata de semanal é o diferencial em muitas questões.","A vigilância não para na notificação: ela investiga surtos (busca ativa de casos, identificação da fonte), monitora indicadores e articula respostas intersetoriais. Na prática do SUS, isso é eixo de Saúde Coletiva, que PERPASSA todas as áreas — uma questão de clínica, pediatria ou GO pode terminar cobrando 'e qual a conduta de vigilância?'. Por isso, sempre que o caso trouxer uma doença da lista, pense: notificar (SINAN), no prazo certo, e investigar se for surto."],
   raciocinio:["O caso traz uma doença da lista de notificação compulsória? Então notifique.","Registre no SINAN.","Verifique o PRAZO: imediata (24h) para as de alto risco/surtos; semanal para as de rotina.","Se houver surto, dispare a investigação (busca ativa, fonte).","Lembre: vigilância/Saúde Coletiva perpassa todas as áreas da prova."],
   nucleo:["Doenças de notificação compulsória → registrar no SINAN.","Prazo: notificação IMEDIATA (24h) para alto risco/surtos; semanal para as de rotina.","Confirmou/suspeitou caso da lista = notifique.","Vigilância também investiga surtos (busca ativa, fonte)."],
   pega:"Saber quais doenças são de notificação IMEDIATA (24h) vs semanal. E lembrar: notificar não depende de o paciente evoluir mal.",mne:"Confirmou doença da lista = notifica no SINAN.",sus:"Eixo de Saúde Coletiva — perpassa todas as áreas do ENAMED."},
  {id:"mfc-mccp",area:"MFC",nome:"Método centrado na pessoa",yield:2,
   questoes:["mfc_mccp_q1","mfc_mccp_q2","mfc_mccp_q3","mfc_mccp_q4"],
   fonte:"Método Clínico Centrado na Pessoa (Stewart et al.); Política Nacional de Atenção Básica - PNAB; Tratado de Medicina de Família e Comunidade (SBMFC).",
   aula:["O Método Clínico Centrado na Pessoa (MCCP) é a marca da Medicina de Família: em vez de tratar só a doença, trata-se a PESSOA que tem a doença. Isso significa entender, além do diagnóstico biomédico, a experiência do adoecer — o que a pessoa sente, teme, espera, e como aquilo afeta sua vida. Paciente que entende e participa do plano adere muito mais.","Na prática, o MCCP combina explorar a doença E a experiência da pessoa, entender a pessoa no seu contexto (família, trabalho, comunidade), e construir um plano CONJUNTO (decisão compartilhada), fortalecendo o vínculo. Não é 'ser bonzinho' — é uma técnica que melhora desfecho e adesão.","A MFC também trabalha com ferramentas de abordagem familiar e do território: o genograma (mapa das relações e doenças da família ao longo das gerações), o ecomapa (relações da família com o meio), a visita domiciliar (ver a pessoa no seu ambiente) e a territorialização (conhecer a área de abrangência, seus riscos e recursos).","Por trás de tudo estão os determinantes sociais da saúde — moradia, renda, trabalho, educação — que explicam boa parte do adoecimento e que a APS precisa considerar. Raciocínio de prova: 'centrado na pessoa' é o oposto de 'centrado na doença'; e as ferramentas (genograma, visita, território) aparecem em casos de família/comunidade."],
   raciocinio:["Trate a pessoa, não só a doença: explore a experiência do adoecer.","Entenda o contexto (família, trabalho, comunidade).","Construa o plano em conjunto (decisão compartilhada) — melhora a adesão.","Use ferramentas: genograma, ecomapa, visita domiciliar, territorialização.","Considere os determinantes sociais da saúde."],
   nucleo:["MCCP: doença + experiência da pessoa; plano conjunto.","Ferramentas: genograma, ecomapa, visita domiciliar.","Territorialização e determinantes sociais da saúde.","Centrado na pessoa ≠ centrado na doença."],
   pega:"Centrado na pessoa é diferente de centrado na doença. A decisão compartilhada melhora a adesão.",mne:"MCCP = pessoa antes da doença.",sus:"Trabalho da ESF no território; determinantes sociais nas DCN."},
  {id:"mfc-estudos",area:"MFC",nome:"Tipos de estudo epidemiológico",yield:3,
   questoes:["mfc_est_q1","mfc_est_q2","mfc_est_q3","mfc_est_q4"],
   fonte:"Rouquayrol — Epidemiologia & Saúde; Medronho — Epidemiologia; Fletcher — Epidemiologia Clínica; classificação de níveis de evidência (GRADE).",
   aula:["Epidemiologia parece decoreba, mas é o contrário: são poucas ideias que se encaixam. A primeira divisão é simples — o pesquisador INTERVÉM ou apenas OBSERVA? Se ele aloca quem recebe o quê, o estudo é EXPERIMENTAL (ensaio clínico). Se ele só observa o que a vida já fez, é OBSERVACIONAL. E dentro dos observacionais, a segunda pergunta é: por onde o estudo COMEÇA — pela exposição, pelo desfecho, ou pelos dois ao mesmo tempo? Responder essas duas perguntas identifica o desenho em qualquer questão.",
     "TRANSVERSAL (seccional): é uma FOTOGRAFIA. Mede a exposição e o desfecho AO MESMO TEMPO, num único momento. É barato e rápido, e é o desenho dos inquéritos de saúde. A medida que ele produz é a PREVALÊNCIA. E sua limitação é a que a banca cobra: como tudo foi medido junto, não se sabe o que veio antes — o obeso ficou sedentário ou o sedentário ficou obeso? Sem temporalidade, a inferência causal é frágil. CASO-CONTROLE: começa pelo DESFECHO e olha para trás (retrospectivo) — pega quem tem a doença (casos), quem não tem (controles) e compara a exposição pregressa. É a escolha para doenças RARAS e de longa latência, porque não é preciso esperar. Sua medida é o ODDS RATIO (razão de chances); ele NÃO calcula incidência nem risco relativo. Seu calcanhar: o viés de memória (quem adoeceu lembra melhor das exposições).",
     "COORTE: começa pela EXPOSIÇÃO e SEGUE no tempo — acompanha expostos e não expostos para ver quem adoece. É o melhor observacional para causalidade, porque a temporalidade está garantida. Mede INCIDÊNCIA e produz o RISCO RELATIVO. O preço: é caro, demorado e sofre com perdas de seguimento; e é péssimo para doenças raras (você seguiria milhares de pessoas para ver dois casos). ECOLÓGICO: a unidade de análise é o GRUPO, a população — compara, por exemplo, consumo de sal por país e mortalidade por AVC por país. É útil para gerar hipóteses e ninguém é medido individualmente. Daí seu erro típico, com nome próprio: a FALÁCIA ECOLÓGICA, que é atribuir ao indivíduo o que se observou no grupo.",
     "No topo da pirâmide estão os EXPERIMENTAIS. No ensaio clínico randomizado (ECR), o pesquisador ALOCA a intervenção por sorteio, e cada peça tem uma função clara: a RANDOMIZAÇÃO distribui igualmente os fatores de confusão — inclusive os que ninguém conhece, e isso nenhum estudo observacional consegue; o CEGAMENTO impede que a expectativa contamine a aferição; e a análise por INTENÇÃO DE TRATAR mantém cada participante no grupo em que foi sorteado, preservando o benefício da randomização mesmo com abandonos. É o padrão-ouro para eficácia. Acima dele, apenas a revisão sistemática com metanálise, que sintetiza os ECR existentes.",
     "As medidas fecham o raciocínio. RISCO RELATIVO (coorte e ECR) = incidência nos expostos dividida pela dos não expostos. ODDS RATIO (caso-controle) aproxima o RR quando a doença é rara. Interpretação: valor igual a 1 = sem associação; maior que 1 = fator de risco; menor que 1 = proteção. E o detalhe que decide a questão: se o INTERVALO DE CONFIANÇA de 95% CRUZA o 1, o resultado NÃO é estatisticamente significativo — não importa o quanto o número pareça impressionante. Ainda: NNT (número necessário para tratar) = 1 dividido pela redução absoluta de risco, e quanto MENOR o NNT, melhor a intervenção. Os vieses a conhecer são três: seleção, aferição/informação (o de memória mora aqui) e CONFUNDIMENTO — que se controla com randomização, pareamento, estratificação ou análise multivariada. E a máxima final: associação NÃO é causalidade (para isso existem os critérios de Bradford Hill — temporalidade, força, gradiente dose-resposta, plausibilidade, consistência)."],
   raciocinio:["Pergunte 1: houve INTERVENÇÃO alocada pelo pesquisador? Sim = experimental (ECR). Não = observacional.",
     "Pergunte 2: por onde começou? Exposição e desfecho juntos = transversal (prevalência). Do desfecho para trás = caso-controle (odds ratio). Da exposição para frente = coorte (incidência e risco relativo).",
     "Unidade de análise é o GRUPO/população? Ecológico — cuidado com a falácia ecológica.",
     "Doença RARA ou de longa latência? Caso-controle. Quer incidência e causalidade? Coorte. Quer eficácia? ECR.",
     "Leia a medida: RR/OR = 1 (sem associação), >1 (risco), <1 (proteção).",
     "Olhe o IC 95%: se CRUZA o 1, não é significativo.",
     "Antes de concluir causa, cheque temporalidade e confundimento. Associação não é causalidade."],
   nucleo:["Transversal: fotografia, exposição e desfecho juntos → PREVALÊNCIA. Não define temporalidade (causalidade frágil).",
     "Caso-controle: parte do DESFECHO, retrospectivo. Bom para doença RARA. Medida: ODDS RATIO. Viés de memória. Não dá incidência.",
     "Coorte: parte da EXPOSIÇÃO, segue no tempo. Medida: INCIDÊNCIA e RISCO RELATIVO. Caro, longo, ruim para doença rara.",
     "Ecológico: unidade = grupo/população. Erro típico: FALÁCIA ECOLÓGICA.",
     "ECR: randomização (controla confundidores conhecidos E desconhecidos) + cegamento + intenção de tratar. Padrão-ouro de eficácia; acima só revisão sistemática/metanálise.",
     "RR/OR: 1 = sem associação; >1 risco; <1 proteção. IC 95% que CRUZA o 1 = não significativo. NNT = 1/RAR (menor é melhor).",
     "Vieses: seleção, aferição/informação (memória), confundimento (randomização, pareamento, estratificação, multivariada)."],
   pega:"Transversal NÃO estabelece causalidade (mede prevalência, não sabe o que veio antes) e caso-controle NÃO calcula incidência nem risco relativo — só odds ratio. E IC 95% que cruza o 1 significa resultado NÃO significativo.",
   mne:"Caso-Controle = do desfeCho para trás (Odds Ratio). COorte = da expOsição para frente (Risco Relativo, Incidência). TRAnsversal = fotogRAfia (prevalência).",
   sus:"Inquéritos transversais (ex.: Vigitel, PNS) orientam políticas; epidemiologia é eixo de Saúde Coletiva e perpassa toda a prova."},

  {id:"mfc-testes",area:"MFC",nome:"Testes diagnósticos e rastreamento",yield:3,
   questoes:["mfc_test_q1","mfc_test_q2","mfc_test_q3","mfc_test_q4"],
   fonte:"Fletcher — Epidemiologia Clínica; Medronho — Epidemiologia; Cadernos de Atenção Primária e diretrizes de rastreamento (Ministério da Saúde/INCA).",
   aula:["Nenhum teste é perfeito, e entender ONDE cada um erra é o que separa o médico que pede exame do que interpreta exame. Duas propriedades descrevem o teste. SENSIBILIDADE é a capacidade de encontrar quem TEM a doença — a proporção de positivos entre os doentes. ESPECIFICIDADE é a capacidade de descartar quem NÃO tem — a proporção de negativos entre os sadios. Grave o essencial: sensibilidade e especificidade são propriedades DO TESTE. Elas NÃO mudam quando você muda a população — este é o ponto que mais derruba candidato.",
     "Para usar isso na prática existem dois apelidos que valem ouro. SnNout: um teste muito SENSÍVEL, quando dá NEGATIVO, AFASTA a doença (poucos falsos-negativos — se fosse doente, ele teria pegado). SpPin: um teste muito ESPECÍFICO, quando dá POSITIVO, CONFIRMA a doença (poucos falsos-positivos — se ele acusou, é porque é). A consequência prática é imediata: no RASTREAMENTO você quer um teste SENSÍVEL, porque o pecado ali é deixar passar um doente; na CONFIRMAÇÃO você quer um teste ESPECÍFICO, porque o pecado é rotular e tratar quem é sadio. É exatamente por isso que o diagnóstico do HIV usa um teste rápido sensível na triagem e outro para confirmar.",
     "Agora os valores preditivos, que respondem à pergunta que o paciente faz de verdade: 'deu positivo — eu tenho?'. O VALOR PREDITIVO POSITIVO (VPP) é a chance de realmente ter a doença dado que o teste deu positivo. O VALOR PREDITIVO NEGATIVO (VPN) é a chance de realmente não ter, dado que deu negativo. E aqui está o coração do assunto: VPP e VPN DEPENDEM DA PREVALÊNCIA. O MESMO teste, com a mesmíssima sensibilidade e especificidade, tem VPP alto onde a doença é comum e VPP BAIXO onde ela é rara. Quanto mais rara a doença na população testada, maior a proporção de falsos-positivos entre os positivos.",
     "Essa dependência da prevalência explica o dano do rastreamento indiscriminado, e liga direto com a prevenção quaternária. Se você aplica um teste em massa numa população de baixíssima prevalência, a maior parte dos positivos será FALSO-positiva — e cada um deles vira ansiedade, exame invasivo, biópsia, complicação. Não é que o teste seja ruim; é que ele foi usado no lugar errado. É por isso que rastrear fora da faixa etária ou fora do grupo de risco não é 'zelo extra': é produzir dano. E é por isso que 'mais exame' não significa 'melhor cuidado'.",
     "Fecham o tema três conceitos. O TRADE-OFF: sensibilidade e especificidade puxam em direções opostas — ao baixar o ponto de corte de um exame você pega mais doentes (sobe a sensibilidade) mas também mais sadios (cai a especificidade), e vice-versa. A curva ROC representa esse balanço, e quanto maior a área sob a curva, melhor o teste globalmente. Por fim, para saber se um rastreamento vale a pena, não basta o teste ser bom: a doença precisa ser relevante, ter fase pré-clínica detectável e ter tratamento que MUDE o desfecho quando aplicado cedo (critérios de Wilson e Jungner). Sem isso, antecipar o diagnóstico só faz o paciente saber por mais tempo que vai morrer — é o viés de antecipação diagnóstica (lead time bias), que dá a ilusão de sobrevida maior sem salvar ninguém."],
   raciocinio:["Identifique o que a questão pede: propriedade do TESTE (sensibilidade/especificidade) ou probabilidade para o PACIENTE (VPP/VPN)?",
     "Sensibilidade e especificidade NÃO mudam com a prevalência. VPP e VPN MUDAM.",
     "Rastreamento → teste SENSÍVEL (não pode deixar passar). Confirmação → teste ESPECÍFICO (não pode rotular sadio).",
     "SnNout: teste sensível NEGATIVO afasta. SpPin: teste específico POSITIVO confirma.",
     "Doença rara + teste em massa = enxurrada de FALSO-POSITIVO (VPP baixo) → dano, sobrediagnóstico, prevenção quaternária.",
     "Lembre do trade-off: mexer no ponto de corte sobe um e desce o outro (curva ROC).",
     "Rastrear só vale se houver tratamento precoce que MUDE o desfecho — senão é só lead time bias."],
   nucleo:["Sensibilidade = detecta quem TEM. Especificidade = exclui quem NÃO tem. São propriedades do TESTE e não mudam com a prevalência.",
     "SnNout (sensível + negativo = afasta) · SpPin (específico + positivo = confirma).",
     "Rastreio quer SENSIBILIDADE; confirmação quer ESPECIFICIDADE.",
     "VPP e VPN DEPENDEM DA PREVALÊNCIA — mesmo teste tem VPP baixo em população de baixa prevalência.",
     "Rastrear doença rara em massa = maioria dos positivos é FALSO-positivo → dano (liga com prevenção quaternária).",
     "Trade-off sensibilidade x especificidade (ponto de corte); curva ROC e área sob a curva.",
     "Rastreamento só se justifica se o tratamento precoce mudar o desfecho (Wilson e Jungner); cuidado com lead time bias."],
   pega:"Sensibilidade e especificidade NÃO mudam com a prevalência — VPP e VPN mudam. Por isso o mesmo teste, aplicado onde a doença é rara, produz sobretudo falso-positivo.",
   mne:"SnNout: Sensível + Negativo = afasta (out). SpPin: Específico + Positivo = confirma (in). Rastreio = Sensível.",
   sus:"Fundamenta as diretrizes de rastreamento do INCA/MS e a prevenção quaternária na APS."},

  {id:"mfc-indicadores",area:"MFC",nome:"Indicadores de saúde",yield:3,
   questoes:["mfc_ind_q1","mfc_ind_q2","mfc_ind_q3","mfc_ind_q4"],
   fonte:"RIPSA — Indicadores e Dados Básicos para a Saúde no Brasil; Guia de Vigilância em Saúde e painéis do DATASUS (Ministério da Saúde); Rouquayrol — Epidemiologia & Saúde.",
   aula:["Indicador é o jeito de transformar a saúde de uma população em número comparável. E o primeiro par que a prova cobra é INCIDÊNCIA versus PREVALÊNCIA. Incidência conta os casos NOVOS que surgem num período — é a velocidade com que a doença aparece, é medida de RISCO. Prevalência conta os casos EXISTENTES num momento — é a CARGA que a doença impõe ao sistema, útil para planejar serviço. A relação entre elas é intuitiva: a prevalência é aproximadamente a incidência multiplicada pela DURAÇÃO da doença. Daí duas consequências que caem: uma doença crônica e longa (como o diabetes) tem prevalência ALTA mesmo com incidência modesta, porque ninguém 'sai' do estoque; e se surge um tratamento que CURA rápido, a prevalência despenca sem que a incidência tenha mudado — assim como ela também cai se a doença passa a matar rápido. Prevalência subindo, portanto, nem sempre é má notícia.",
     "MORTALIDADE e LETALIDADE são o segundo par, e trocá-los é erro clássico. Mortalidade é o número de óbitos dividido pela POPULAÇÃO — mede o risco de morrer na população geral. Letalidade é o número de óbitos dividido pelos DOENTES — mede a GRAVIDADE da doença, o quanto ela mata quem a pega. Uma doença pode ter letalidade altíssima (como a raiva, que mata quase todos os infectados) e mortalidade baixíssima (porque quase ninguém pega). O contrário também existe: a gripe tem letalidade baixa e, por atingir milhões, produz muitos óbitos.",
     "O indicador mais emblemático é o COEFICIENTE DE MORTALIDADE INFANTIL: óbitos de menores de 1 ano divididos pelos nascidos VIVOS, multiplicado por 1.000. Ele é considerado um espelho do desenvolvimento social, não só da saúde. Divide-se em componentes: NEONATAL PRECOCE (0 a 6 dias), NEONATAL TARDIO (7 a 27 dias) e PÓS-NEONATAL (28 a 364 dias). A leitura desses componentes conta a história do Brasil: o componente PÓS-neonatal — ligado a infecção, diarreia e desnutrição — caiu muito com saneamento, vacina, aleitamento e terapia de reidratação oral; hoje predomina o componente NEONATAL, que depende da qualidade da assistência ao pré-natal, ao parto e ao recém-nascido. Ou seja: onde a mortalidade infantil ainda é alta à custa do pós-neonatal, o problema é social/saneamento; quando ela é predominantemente neonatal, o problema é a assistência.",
     "A MORTALIDADE MATERNA tem duas particularidades cobradas. Primeiro, é expressa como RAZÃO (não coeficiente): óbitos maternos divididos por 100.000 nascidos VIVOS — atenção às duas coisas, é razão e é por 100 mil. Segundo, classifica-se em causas DIRETAS (complicações da própria gravidez, parto e puerpério — hipertensão, hemorragia, infecção, aborto inseguro) e INDIRETAS (doença prévia agravada pela gestação). No Brasil predominam as diretas, ou seja, mortes majoritariamente EVITÁVEIS — o que faz desse indicador um retrato da qualidade da assistência obstétrica.",
     "Fecham o tema outros indicadores e as fontes. Mortalidade PROPORCIONAL mostra a fatia de cada causa (ou faixa etária) no total de óbitos — a curva de Nelson de Moraes usa a mortalidade proporcional por idade para classificar o nível de saúde. Esperança de vida ao nascer, envelhecimento populacional e transição demográfica e epidemiológica (de doenças infecciosas para crônicas e causas externas) completam o quadro brasileiro. E os dados vêm de sistemas que você precisa saber nomear: SIM (mortalidade), SINASC (nascidos vivos), SINAN (agravos de notificação), SIH (internações), SIA (ambulatorial) e e-SUS APS (atenção primária). Questão que dá o nome do sistema pede que você reconheça o que ele registra."],
   raciocinio:["Casos NOVOS num período = incidência (risco). Casos EXISTENTES num momento = prevalência (carga).",
     "Prevalência ≈ incidência x duração: doença crônica longa tem prevalência alta; cura rápida (ou morte rápida) derruba a prevalência sem mudar a incidência.",
     "Óbitos / POPULAÇÃO = mortalidade. Óbitos / DOENTES = letalidade (gravidade). Não troque.",
     "Mortalidade infantil = óbitos <1 ano / nascidos vivos x 1.000. Veja o componente: pós-neonatal alto = problema social/saneamento; neonatal alto = qualidade da assistência ao pré-natal/parto.",
     "Mortalidade materna é RAZÃO, por 100.000 nascidos vivos. Causas diretas predominam = mortes evitáveis.",
     "Identifique a fonte: SIM (óbitos), SINASC (nascidos vivos), SINAN (agravos), SIH (internação), e-SUS APS."],
   nucleo:["Incidência = casos NOVOS (risco). Prevalência = casos EXISTENTES (carga). Prevalência ≈ incidência x duração.",
     "Mortalidade = óbitos/população. LETALIDADE = óbitos/doentes (gravidade da doença). Raiva: letalidade altíssima, mortalidade baixa.",
     "Mortalidade infantil = óbitos <1 ano / nascidos vivos x 1.000. Componentes: neonatal precoce (0-6d), neonatal tardio (7-27d), pós-neonatal (28-364d).",
     "No Brasil o pós-neonatal caiu (saneamento, vacina, TRO, aleitamento) e hoje predomina o NEONATAL — depende da assistência ao pré-natal/parto.",
     "Mortalidade materna: RAZÃO por 100.000 nascidos vivos; causas diretas (hipertensão, hemorragia, infecção) predominam = evitáveis.",
     "Mortalidade proporcional e curva de Nelson de Moraes; transição demográfica e epidemiológica.",
     "Sistemas: SIM (óbitos) · SINASC (nascidos vivos) · SINAN (notificação) · SIH (internações) · SIA · e-SUS APS."],
   pega:"Letalidade (óbitos/DOENTES) não é mortalidade (óbitos/POPULAÇÃO). E mortalidade materna é RAZÃO por 100.000 nascidos vivos — não por 1.000. Prevalência que sobe pode significar que se está tratando melhor, não adoecendo mais.",
   mne:"Incidência = casos Novos. Prevalência = casos que Permanecem. Letalidade = mata os doenTes. Infantil ÷ nascidos vivos x1.000; Materna ÷ nascidos vivos x100.000.",
   sus:"Indicadores do DATASUS/RIPSA orientam o planejamento; mortalidade infantil e materna são metas de pactuação no SUS."},

  {id:"mfc-etica",area:"MFC",nome:"Ética médica e bioética",yield:3,
   questoes:["mfc_etica_q1","mfc_etica_q2","mfc_etica_q3","mfc_etica_q4"],
   fonte:"Código de Ética Médica — Resolução CFM 2.217/2018 e alterações; Beauchamp e Childress — Princípios de Ética Biomédica; Resolução CFM 1.805/2006 (ortotanásia); Resolução CFM 1.995/2012 (diretivas antecipadas de vontade); ECA — Lei 8.069/1990.",
   aula:["A bioética moderna trabalha com quatro princípios, e praticamente toda questão de ética é um CONFLITO entre dois deles. AUTONOMIA: respeitar a decisão do paciente sobre o próprio corpo. BENEFICÊNCIA: agir para o bem dele. NÃO MALEFICÊNCIA: acima de tudo, não causar dano. JUSTIÇA: distribuir os recursos com equidade. Repare que o dilema clássico é autonomia contra beneficência — o paciente recusa o que o médico acha bom para ele. E a chave de leitura da prova brasileira é esta: o Código de Ética Médica de 2018 é fortemente centrado na AUTONOMIA. Diante de duas alternativas, a que respeita a decisão do paciente capaz e informado costuma ser a correta.",
     "O CONSENTIMENTO LIVRE E ESCLARECIDO é a autonomia na prática: o paciente capaz decide depois de informado — e decidir inclui RECUSAR tratamento, mesmo que o médico discorde. Existem exceções bem delimitadas: na EMERGÊNCIA com risco iminente de morte, o médico age sem consentimento (o dever de socorro prevalece); e no paciente incapaz, decide o representante legal. No menor de idade, quem consente é o responsável, mas a criança deve ser ouvida conforme sua maturidade. O caso clássico é a Testemunha de Jeová: em situação ELETIVA, respeita-se a recusa da transfusão do adulto capaz e buscam-se alternativas; diante de risco IMINENTE de morte, o Código autoriza o médico a transfundir. Guarde o par: autonomia é a regra, emergência com risco de vida é a exceção.",
     "O SIGILO é dever, mas não é absoluto — ele cede em três situações: por DEVER LEGAL, por JUSTA CAUSA, ou por autorização expressa do paciente. Dever legal é, por exemplo, a notificação compulsória: notificar tuberculose, dengue ou violência não é quebra indevida de sigilo, é cumprir a lei. Justa causa é proteger a vida do paciente ou de terceiros. O ponto mais cobrado é o ADOLESCENTE: ele tem direito à privacidade e ao atendimento DESACOMPANHADO, e o sigilo se mantém — inclusive sobre vida sexual e contracepção. Só se rompe diante de risco (gravidez, abuso, ideação suicida, uso grave de drogas), e mesmo assim comunicando ANTES ao próprio adolescente que a informação será compartilhada. Negar atendimento a adolescente desacompanhado é erro.",
     "O FIM DA VIDA tem três palavras que a banca troca de propósito. ORTOTANÁSIA é permitir a morte no seu tempo natural — não iniciar ou suspender tratamentos FÚTEIS que só prolongam o morrer, mantendo sempre os cuidados paliativos e o conforto. É ÉTICA e permitida (Resolução CFM 1.805/2006). DISTANÁSIA é a obstinação terapêutica: insistir em intervenções inúteis e prolongar o sofrimento — é o que se deve EVITAR. EUTANÁSIA é provocar ativamente a morte: é PROIBIDA no Brasil e configura crime. Ligadas a isso estão as DIRETIVAS ANTECIPADAS DE VONTADE (Resolução CFM 1.995/2012), em que a pessoa registra previamente o que aceita ou recusa caso perca a capacidade de decidir — e elas prevalecem sobre o desejo dos familiares. E cuidado paliativo NÃO é 'desistir do paciente': é tratar ativamente o sofrimento.",
     "Fecham o tema alguns pontos práticos. O erro médico se apura por três condutas: IMPERÍCIA (falta de conhecimento/habilidade técnica), IMPRUDÊNCIA (agir com pressa ou risco desnecessário, fazer o que não deveria) e NEGLIGÊNCIA (deixar de fazer o que deveria, omissão). A publicidade médica tem limites: é vedado sensacionalismo, autopromoção, garantia de resultado e a divulgação de imagens de 'antes e depois'. O atestado deve corresponder à verdade — atestar falsamente é infração ética e crime. E a OBJEÇÃO DE CONSCIÊNCIA existe, mas tem limites claros: ela NÃO se aplica quando há risco de morte, na ausência de outro profissional que assuma, nem pode resultar em abandono do paciente — o médico deve garantir a continuidade do cuidado. Resumo do que a banca quer: autonomia como regra, sigilo que cede à lei e à proteção, ortotanásia sim e eutanásia não."],
   raciocinio:["Identifique os princípios em conflito — quase sempre autonomia versus beneficência.",
     "Paciente capaz e informado pode RECUSAR tratamento: a autonomia é a regra no CEM 2018.",
     "Exceção: emergência com risco IMINENTE de morte permite agir sem consentimento (inclui transfundir a Testemunha de Jeová em risco de vida).",
     "Sigilo cede por dever legal (notificação compulsória), justa causa (proteger vida) ou autorização do paciente.",
     "Adolescente: atendimento desacompanhado e sigilo garantidos; rompe-se só diante de risco, avisando antes o próprio adolescente.",
     "Fim de vida: ortotanásia PERMITIDA (suspender fútil, manter paliativo) · distanásia = obstinação, evitar · eutanásia = PROIBIDA. Diretivas antecipadas prevalecem sobre a vontade da família.",
     "Erro: imperícia (não sabe) · imprudência (faz o que não devia) · negligência (deixa de fazer)."],
   nucleo:["Princípios: autonomia, beneficência, não maleficência, justiça. O CEM 2018 é centrado na AUTONOMIA.",
     "Consentimento livre e esclarecido: paciente capaz pode RECUSAR. Exceções: emergência com risco iminente de morte e incapacidade.",
     "Testemunha de Jeová: eletivo = respeitar a recusa; risco iminente de morte = transfundir.",
     "Sigilo cede por: dever legal (notificação compulsória), justa causa (proteção da vida) ou autorização do paciente.",
     "Adolescente tem direito a atendimento DESACOMPANHADO e a sigilo; rompe-se só em risco, comunicando antes a ele.",
     "Ortotanásia = permitida (CFM 1.805/2006) · distanásia = obstinação a evitar · eutanásia = proibida. Diretivas antecipadas (CFM 1.995/2012) prevalecem sobre a família.",
     "Erro médico: imperícia (não sabe) · imprudência (faz o que não devia) · negligência (omite). Publicidade: vedado sensacionalismo e 'antes e depois'.",
     "Objeção de consciência não vale em risco de morte, sem outro profissional, nem pode abandonar o paciente."],
   pega:"Ortotanásia é PERMITIDA e eutanásia é PROIBIDA — a banca troca os nomes. Notificação compulsória NÃO é quebra indevida de sigilo, é dever legal. E adolescente tem direito a ser atendido desacompanhado, com sigilo.",
   mne:"ORTOtanásia = morte no tempo cORTO/certo (permitida) · DISTanásia = DISTende o sofrimento (evitar) · EUtanásia = EU provoco a morte (proibida).",
   sus:"Autonomia, sigilo e cuidado no fim de vida atravessam a prática da APS; ética é eixo transversal do ENAMED."},
  {id:"tv-saudemental",area:"CM",nome:"Saúde Mental na APS (transversal)",yield:3,
   questoes:["tv_saudemental_q1","tv_saudemental_q2","tv_saudemental_q3","tv_saudemental_q4"],
   fonte:"Linhas de Cuidado em Saúde Mental (Ministério da Saúde); Cadernos de Atenção Básica nº 34 (Saúde Mental); Rede de Atenção Psicossocial - RAPS; Portaria 204/2016 e Lei 13.819/2019 (notificação de violência autoprovocada).",
   aula:["Boa parte do sofrimento mental é atendida (ou deveria ser) na atenção primária, não só pelo psiquiatra. A prova cobra a abordagem inicial de quadros comuns — depressão, ansiedade, uso de álcool/drogas — e a segurança diante do risco de suicídio. Reconhecer e manejar o básico na APS, articulando a rede, é a competência esperada.","Na depressão, a escolha do tratamento depende da gravidade: na depressão LEVE a MODERADA, a psicoterapia (intervenções psicossociais) é 1ª linha e pode dispensar remédio; na moderada a GRAVE, o antidepressivo é indicado. Quando se medica, a 1ª linha são os ISRS (inibidores seletivos da recaptação de serotonina, como fluoxetina e sertralina), pelo bom perfil de segurança, disponíveis na Rename. Os antidepressivos tricíclicos (amitriptilina) devem ser usados com CAUTELA pelo risco de overdose (letais em superdosagem) — dispensar em quantidades menores e supervisão. A pegadinha clássica: benzodiazepínico NÃO é 1ª linha para depressão/ansiedade — alivia sintoma agudo, mas causa dependência e não trata o transtorno de base.","No uso de álcool e outras drogas, a APS rastreia (instrumentos como AUDIT/CAGE), aborda e encaminha/articula com a RAPS (Rede de Atenção Psicossocial), da qual fazem parte os CAPS. A lógica é de cuidado no território, redução de danos, e não apenas 'internar'.","O risco de suicídio é o ponto mais sensível: deve ser avaliado ativamente (perguntar sobre suicídio NÃO induz o ato), e a segurança do paciente é prioridade — o que justifica quebrar o sigilo para proteger a vida, restringir acesso a meios, não deixar a pessoa sozinha e, em risco iminente, encaminhar à emergência psiquiátrica. Ponto de alto rendimento: toda violência autoprovocada (tentativa de suicídio, automutilação, ideação) é de NOTIFICAÇÃO COMPULSÓRIA IMEDIATA (Portaria 204/2016 e Lei 13.819/2019), via ficha de notificação. Saúde Mental é eixo TRANSVERSAL: aparece embutida em casos de outras áreas (a puérpera, o adolescente, o idoso)."],
   raciocinio:["Reconheça o quadro (depressão, ansiedade, uso de substância) na APS.","Depressão/ansiedade com indicação de medicar: ISRS de 1ª linha.","Evite benzodiazepínico como 1ª linha crônica (dependência).","Álcool/drogas: rastreie e articule com a RAPS/CAPS.","Avalie ativamente o risco de suicídio; priorize a segurança (pode romper sigilo em risco)."],
   nucleo:["Depressão leve-moderada: psicoterapia 1ª linha. Moderada-grave: ISRS 1ª linha (tricíclico com cautela, risco de overdose).","Benzodiazepínico não é 1ª linha crônica.","Álcool/drogas: rastreio (AUDIT/CAGE) + RAPS/CAPS.","Risco de suicídio: avaliar ativamente, priorizar segurança. Violência autoprovocada = notificação compulsória imediata."],
   pega:"Benzodiazepínico NÃO é 1ª linha para depressão/ansiedade. Saúde Mental vem embutida em casos de outras áreas.",mne:"Humor deprimido persistente na APS = pense ISRS.",sus:"RAPS (Rede de Atenção Psicossocial) e matriciamento — eixo transversal do ENAMED."},
  {id:"tv-sus",area:"MFC",nome:"Princípios do SUS (transversal)",yield:3,
   questoes:["tv_sus_q1","tv_sus_q2","tv_sus_q3","tv_sus_q4"],
   fonte:"Constituição Federal de 1988 (art. 196 a 200); Lei 8.080/1990 (Lei Orgânica da Saúde) e Lei 8.142/1990 (participação e financiamento); Decreto 7.508/2011.",
   aula:["O SUS é a espinha dorsal do ENAMED — a prova é declaradamente ancorada nele, então entender seus princípios é obrigatório. E há uma distinção que a banca cobra sempre: princípios (o que o SUS busca) versus diretrizes organizativas (como ele se organiza para isso). Confundir os dois é erro garantido.","Os PRINCÍPIOS (doutrinários) são três: Universalidade (saúde é direito de todos, sem discriminação), Integralidade (atender o conjunto de necessidades, da promoção à reabilitação) e Equidade (tratar desigualmente os desiguais — dar mais a quem precisa mais, para reduzir injustiças). Equidade NÃO é igualdade: igualdade é dar o mesmo a todos; equidade é dar conforme a necessidade.","As DIRETRIZES organizativas dizem como o sistema se estrutura: Descentralização (gestão compartilhada entre União, estados e municípios, com comando único em cada esfera), Regionalização e hierarquização (organizar serviços por território e níveis de complexidade, em rede) e Participação social (a comunidade participa e controla via conselhos e conferências de saúde).","O controle social é um pilar democrático: os Conselhos de Saúde (paritários, com usuários, trabalhadores e gestores) e as Conferências acompanham e deliberam sobre políticas. Raciocínio de prova: se a alternativa fala em 'universalidade/integralidade/equidade', é princípio; se fala em 'descentralização/regionalização/participação', é diretriz. E equidade ≠ igualdade."],
   raciocinio:["Separe princípios (o que busca) de diretrizes (como se organiza).","Princípios: Universalidade, Integralidade, Equidade.","Equidade = dar conforme a necessidade (≠ igualdade).","Diretrizes: descentralização, regionalização/hierarquização, participação social.","Controle social: conselhos e conferências de saúde."],
   nucleo:["Princípios: Universalidade, Integralidade, Equidade.","Diretrizes: descentralização, regionalização/hierarquização, participação social.","Equidade ≠ igualdade (dar conforme a necessidade).","Controle social: conselhos (paritários) e conferências."],
   pega:"Não confunda princípio (universalidade/integralidade/equidade) com diretriz (descentralização etc.). Equidade ≠ igualdade.",mne:"Princípios = 'UIE': Universalidade, Integralidade, Equidade.",sus:"O ENAMED é declaradamente ancorado no SUS — este tema perpassa a prova."},

  {id:"go_prenatal_q4",area:"GO",tema:"Pré-natal e rastreios",transv:[],dif:2,premium:false,enun:"Qual suplementação iniciada idealmente antes/no início da gestação previne defeitos do tubo neural?",alts:["Ferro","Ácido fólico","Cálcio","Vitamina C"],correta:1,coment:"Ácido fólico previne defeitos do tubo neural; ferro previne anemia."},
  {id:"go_hpp_q1",area:"GO",tema:"Hemorragia pós-parto",transv:[],dif:2,premium:false,enun:"Puérpera com sangramento vaginal abundante após parto vaginal; ao exame, útero amolecido e acima da cicatriz umbilical. Causa e primeira medida?",alts:["Laceração de canal; sutura imediata","Atonia uterina; massagem bimanual + ocitocina","Retenção placentária; curetagem imediata","Coagulopatia; plasma fresco"],correta:1,coment:"Útero amolecido = atonia (1ª causa de HPP). Primeira medida: massagem uterina bimanual + ocitocina."},
  {id:"go_hpp_q2",area:"GO",tema:"Hemorragia pós-parto",transv:[],dif:2,premium:false,enun:"Quais são as quatro causas clássicas de hemorragia pós-parto?",alts:["Tônus, Trauma, Tecido, Trombina","Febre, dor, edema, rubor","Anemia, hipertensão, infecção, dor","Placenta, cordão, âmnio, colo"],correta:0,coment:"Os 4 Ts: Tônus (atonia), Trauma (laceração), Tecido (restos), Trombina (coagulopatia)."},
  {id:"go_hpp_q3",area:"GO",tema:"Hemorragia pós-parto",transv:[],dif:2,premium:false,enun:"Qual medida do manejo ativo do terceiro período previne a HPP?",alts:["Esperar a placenta sair sozinha sem intervenção","Administrar ocitocina profilática logo após a saída do bebê","Massagear o útero apenas se sangrar muito","Clampear o cordão tardiamente sempre"],correta:1,coment:"O manejo ativo (ocitocina profilática + tração controlada do cordão) reduz a HPP."},
  {id:"go_hpp_q4",area:"GO",tema:"Hemorragia pós-parto",transv:[],dif:2,premium:false,enun:"A massagem + ocitocina não controlaram a atonia. Qual a próxima etapa do escalonamento?",alts:["Apenas observar","Outros uterotônicos e/ou balão de tamponamento, escalonando até cirurgia se necessário","Alta hospitalar","Suspender toda medicação"],correta:1,coment:"O manejo é escalonado: se massagem + ocitocina falham, usa-se outros uterotônicos, balão intrauterino e, por fim, cirurgia."},
  {id:"ped_desidratacao_q1",area:"PED",tema:"Diarreia e desidratação (TRO)",transv:[],dif:2,premium:false,enun:"Criança de 2 anos com diarreia, olhos encovados, bebe com avidez, prega cutânea desfaz lentamente, sem choque. Qual o plano de hidratação?",alts:["Plano A domiciliar","Plano B: TRO supervisionada na unidade","Plano C: hidratação venosa imediata","Antibiótico e alta"],correta:1,coment:"Desidratação moderada (sede ávida, prega lenta) sem choque = Plano B (TRO supervisionada na unidade)."},
  {id:"ped_desidratacao_q2",area:"PED",tema:"Diarreia e desidratação (TRO)",transv:[],dif:2,premium:false,enun:"Lactente com diarreia, letárgico, incapaz de beber, pulso fino. Conduta?",alts:["Plano A","Plano B (oral)","Plano C: hidratação venosa imediata","Aguardar melhora espontânea"],correta:2,coment:"Sinais de gravidade/choque ou incapacidade de beber = Plano C (venoso) direto."},
  {id:"ped_desidratacao_q3",area:"PED",tema:"Diarreia e desidratação (TRO)",transv:[],dif:2,premium:false,enun:"Sobre o antibiótico na diarreia aguda da criança, é correto:",alts:["É rotina em todos os casos","Não é rotina — a maioria é viral; reserva-se a situações específicas","Substitui a reidratação","Deve ser dado antes de avaliar a hidratação"],correta:1,coment:"Antibiótico não é rotina (a maioria é viral). A base é reidratar; ATB só em casos selecionados."},
  {id:"ped_desidratacao_q4",area:"PED",tema:"Diarreia e desidratação (TRO)",transv:[],dif:2,premium:false,enun:"Além da reidratação, qual medida reduz a duração e a gravidade da diarreia na criança?",alts:["Jejum prolongado","Zinco","Antitérmico contínuo","Suspender o leite materno"],correta:1,coment:"O zinco reduz duração/gravidade; mantém-se a alimentação (inclusive leite materno)."},
  {id:"ped_respiratorio_q1",area:"PED",tema:"IVAS, bronquiolite e pneumonia",transv:[],dif:2,premium:false,enun:"Lactente de 5 meses, previamente hígido, com coriza que evoluiu com sibilância, taquipneia e tiragem leve, saturação 94%. Etiologia mais provável e conduta?",alts:["Bactéria; antibiótico","Vírus sincicial respiratório; tratamento de suporte","Asma; corticoide sistêmico","Aspiração; broncoscopia"],correta:1,coment:"Bronquiolite viral (VSR é a principal causa): tratamento de suporte. Broncodilatador/corticoide não de rotina."},
  {id:"ped_respiratorio_q2",area:"PED",tema:"IVAS, bronquiolite e pneumonia",transv:[],dif:2,premium:false,enun:"Criança de 3 anos com febre alta, taquipneia e consolidação lobar ao raio-x, sem sinais de gravidade, aceitando líquidos. Tratamento ambulatorial de 1ª linha?",alts:["Azitromicina","Amoxicilina","Ceftriaxona intravenosa","Apenas sintomáticos"],correta:1,coment:"Pneumonia comunitária típica ambulatorial: amoxicilina de 1ª linha."},
  {id:"ped_respiratorio_q3",area:"PED",tema:"IVAS, bronquiolite e pneumonia",transv:[],dif:2,premium:false,enun:"O que, na criança com pneumonia, mais indica necessidade de INTERNAÇÃO?",alts:["Tosse há 2 dias","Tiragem/retração e hipoxemia (sinais de gravidade da OMS)","Coriza","Febre de 37,8°C isolada"],correta:1,coment:"Sinais de gravidade da OMS (tiragem, taquipneia por idade, saturação baixa) definem internação e antibiótico parenteral."},
  {id:"ped_respiratorio_q4",area:"PED",tema:"IVAS, bronquiolite e pneumonia",transv:[],dif:2,premium:false,enun:"Por que broncodilatador e corticoide não são usados de rotina na bronquiolite?",alts:["Porque a bronquiolite é bacteriana","Porque a bronquiolite é viral e não responde bem a essas drogas, sendo o tratamento de suporte","Porque pioram a febre","Porque só servem para adultos"],correta:1,coment:"A bronquiolite (VSR) tem tratamento essencialmente de suporte; broncodilatador/corticoide não trazem benefício de rotina."},
  {id:"mfc_atributos_q1",area:"MFC",tema:"Atributos da APS (Starfield)",transv:[],dif:2,premium:false,enun:"Paciente é sempre atendido pela mesma equipe da ESF, que acompanha sua história ao longo dos anos e coordena seus encaminhamentos. Qual atributo está MAIS evidente na parte do acompanhamento ao longo do tempo?",alts:["Integralidade","Longitudinalidade","Competência cultural","Primeiro contato"],correta:1,coment:"Vínculo e acompanhamento contínuo no tempo pela mesma equipe = longitudinalidade."},
  {id:"mfc_atributos_q2",area:"MFC",tema:"Atributos da APS (Starfield)",transv:[],dif:2,premium:false,enun:"A equipe garante à paciente ações de promoção, prevenção, tratamento e reabilitação, abraçando o conjunto de suas necessidades. Qual atributo?",alts:["Longitudinalidade","Integralidade","Coordenação","Orientação comunitária"],correta:1,coment:"Cuidado amplo, para o conjunto de necessidades = integralidade (amplitude)."},
  {id:"mfc_atributos_q3",area:"MFC",tema:"Atributos da APS (Starfield)",transv:[],dif:2,premium:false,enun:"A UBS organiza os encaminhamentos ao especialista, recebe os resultados e mantém a continuidade do cuidado na rede. Qual atributo?",alts:["Primeiro contato","Coordenação","Competência cultural","Integralidade"],correta:1,coment:"Integrar e organizar o cuidado que ocorre em outros pontos da rede = coordenação."},
  {id:"mfc_atributos_q4",area:"MFC",tema:"Atributos da APS (Starfield)",transv:[],dif:2,premium:false,enun:"Quais são os quatro atributos ESSENCIAIS da APS segundo Starfield?",alts:["Primeiro contato, longitudinalidade, integralidade e coordenação","Família, comunidade, cultura e território","Promoção, prevenção, cura e reabilitação","Universalidade, integralidade, equidade e descentralização"],correta:0,coment:"Os essenciais são: primeiro contato/acesso, longitudinalidade, integralidade e coordenação. Os demais são derivados."},
  {id:"mfc_vigilancia_q1",area:"MFC",tema:"Vigilância e notificação",transv:[],dif:2,premium:false,enun:"Na UBS, você confirma um caso de dengue. Qual a conduta correta de vigilância?",alts:["Notificar apenas se houver óbito","Notificação compulsória, registrada no SINAN","Notificar somente se virar surto","Não há necessidade de notificar"],correta:1,coment:"Dengue é de notificação compulsória e deve ser registrada no SINAN, independentemente da evolução."},
  {id:"mfc_vigilancia_q2",area:"MFC",tema:"Vigilância e notificação",transv:[],dif:2,premium:false,enun:"Qual dessas situações exige notificação IMEDIATA (em até 24 horas)?",alts:["Caso isolado de hipertensão","Caso suspeito de sarampo","Diabetes tipo 2","Cefaleia tensional"],correta:1,coment:"Sarampo (e surtos/doenças de interesse internacional) exige notificação imediata em 24h."},
  {id:"mfc_vigilancia_q3",area:"MFC",tema:"Vigilância e notificação",transv:[],dif:2,premium:false,enun:"Em qual sistema são registradas as doenças de notificação compulsória?",alts:["SISREG","SINAN","e-SUS apenas","Não há registro"],correta:1,coment:"As doenças de notificação compulsória são registradas no SINAN."},
  {id:"mfc_vigilancia_q4",area:"MFC",tema:"Vigilância e notificação",transv:[],dif:2,premium:false,enun:"A notificação de uma doença da lista depende de o paciente evoluir mal?",alts:["Sim, só se internar","Não — confirmado (ou suspeito, conforme a doença) o caso da lista, notifica-se","Só se houver óbito","Só em surtos"],correta:1,coment:"A notificação é feita pela presença do caso da lista, não pela gravidade da evolução."},
  {id:"cm_dm2_q1",area:"CM",tema:"Diabetes tipo 2",transv:[],dif:2,premium:false,enun:"Homem de 52 anos, DM2 recém-diagnosticado, risco cardiovascular baixo, sem doença cardiorrenal nem obesidade, HbA1c 7,0%, função renal normal. Conduta farmacológica inicial (SBD 2025)?",alts:["Insulina NPH ao deitar","Metformina em monoterapia","Iniciar iSGLT2 + GLP-1 de imediato","Apenas dieta por 12 meses"],correta:1,coment:"Na SBD 2025, a metformina em monoterapia segue como escolha inicial para risco CV baixo/intermediário, sem doença cardiorrenal/obesidade e HbA1c < 7,5%. Em alto risco CV/renal, iSGLT2 ou GLP-1 entrariam cedo."},
  {id:"cm_dm2_q2",area:"CM",tema:"Diabetes tipo 2",transv:[],dif:2,premium:false,enun:"Qual valor fecha diagnóstico de diabetes em jejum?",alts:["Glicemia de jejum ≥100","Glicemia de jejum ≥126","HbA1c ≥5,7%","TOTG 2h ≥140"],correta:1,coment:"Jejum ≥126 (confirmado) fecha diabetes. HbA1c ≥6,5% e TOTG 2h ≥200 também."},
  {id:"cm_dm2_q3",area:"CM",tema:"Diabetes tipo 2",transv:[],dif:2,premium:false,enun:"Paciente com DM2 e TFG muito reduzida. Qual cuidado com a metformina?",alts:["Aumentar a dose","Pode ser contraindicada pela função renal ruim","Associar sempre insulina","Não há restrição"],correta:1,coment:"Com função renal muito reduzida (TFG baixa) a metformina pode ser contraindicada."},
  {id:"cm_dm2_q4",area:"CM",tema:"Diabetes tipo 2",transv:[],dif:2,premium:false,enun:"Sobre a meta de HbA1c no DM2, é correto:",alts:["É igual para todos","É individualizada: mais rígida no jovem, mais frouxa no idoso frágil","Deve ser sempre <5%","Não importa a idade"],correta:1,coment:"A meta é individualizada (geral <7%), mais frouxa em idosos frágeis pelo risco de hipoglicemia."},
  {id:"cir_posop_q1",area:"CIR",tema:"Pré-op e complicações",transv:[],dif:2,premium:false,enun:"Paciente no 1º dia pós-operatório com febre de 38°C, sem outros sinais localizatórios. Causa mais provável?",alts:["Abscesso intracavitário","Atelectasia (causa pulmonar)","TVP","Infecção de ferida"],correta:1,coment:"Febre nas primeiras 24-48h costuma ser pulmonar (atelectasia). Estimular respiração e deambulação."},
  {id:"cir_posop_q2",area:"CIR",tema:"Pré-op e complicações",transv:[],dif:2,premium:false,enun:"A regra dos '5 Ws' organiza as causas de qual complicação pós-operatória?",alts:["Sangramento","Febre","Náusea","Dor"],correta:1,coment:"Os 5 Ws (Wind, Water, Wound, Walking, Wonder drugs) organizam as causas de febre pós-op."},
  {id:"cir_posop_q3",area:"CIR",tema:"Pré-op e complicações",transv:[],dif:2,premium:false,enun:"Qual profilaxia é fundamental no pré-operatório de paciente que ficará imóvel?",alts:["Profilaxia de TVP","Antibiótico por 30 dias","Corticoide","Diurético"],correta:0,coment:"A profilaxia de TVP é fundamental em pacientes que ficarão imóveis."},
  {id:"cir_posop_q4",area:"CIR",tema:"Pré-op e complicações",transv:[],dif:2,premium:false,enun:"Febre pós-operatória que aparece tardiamente (após alguns dias) sugere principalmente:",alts:["Atelectasia","Infecção (ferida, ITU) ou coleção/abscesso","Febre do jaleco","Nada relevante"],correta:1,coment:"Febre tardia puxa a investigação para infecção (ferida, urina) ou coleções/abscessos."},
  {id:"cir_hernia_q1",area:"CIR",tema:"Hérnias de parede",transv:[],dif:2,premium:false,enun:"Mulher idosa com abaulamento inguinal direito irredutível há 24h, vômitos, parada de eliminação de flatos e hiperemia local. Hipótese?",alts:["Hérnia inguinal redutível","Hérnia femoral encarcerada/estrangulada","Isquemia mesentérica primária","Neoplasia de cólon"],correta:1,coment:"Abaulamento irredutível + obstrução + sinais inflamatórios = hérnia encarcerada/estrangulada (femoral, mais comum em mulheres). Emergência cirúrgica."},
  {id:"cir_hernia_q2",area:"CIR",tema:"Hérnias de parede",transv:[],dif:2,premium:false,enun:"Qual a diferença entre encarceramento e estrangulamento?",alts:["São sinônimos","Encarceramento = irredutível com circulação; estrangulamento = irredutível com isquemia","Estrangulamento é sempre indolor","Encarceramento exige cirurgia imediata sempre"],correta:1,coment:"Encarceramento: irredutível, circulação mantida. Estrangulamento: irredutível + isquemia = emergência."},
  {id:"cir_hernia_q3",area:"CIR",tema:"Hérnias de parede",transv:[],dif:2,premium:false,enun:"Qual hérnia tem maior risco de estrangular, sobretudo em mulheres?",alts:["Umbilical","Femoral","Incisional","Epigástrica"],correta:1,coment:"A femoral, por passar num anel estreito, encarcera/estrangula mais, sobretudo em mulheres."},
  {id:"cir_hernia_q4",area:"CIR",tema:"Hérnias de parede",transv:[],dif:2,premium:false,enun:"Hérnia inguinal não complicada, redutível, assintomática. Conduta?",alts:["Cirurgia de urgência imediata","Correção cirúrgica eletiva (fila do SUS)","Nunca operar","Antibiótico"],correta:1,coment:"Hérnia não complicada é cirurgia eletiva; urgência é reservada ao estrangulamento."},
  {id:"go_hemorragias_q1",area:"GO",tema:"Hemorragias da gestação",transv:[],dif:2,premium:false,enun:"Gestante no 3º trimestre, hipertensa, com dor abdominal, útero hipertônico, sangramento escuro e BCF 90 bpm. Diagnóstico mais provável?",alts:["Placenta prévia","Descolamento prematuro de placenta (DPP)","Rotura de vasa prévia","Trabalho de parto normal"],correta:1,coment:"Dor + hipertonia + sangue escuro + sofrimento fetal, com fator de risco (HAS) = DPP. Emergência."},
  {id:"go_hemorragias_q2",area:"GO",tema:"Hemorragias da gestação",transv:[],dif:2,premium:false,enun:"Gestante no 3º trimestre com sangramento vermelho vivo, indolor, de repetição, sem hipertonia. Conduta que NÃO deve ser feita antes do ultrassom?",alts:["Monitorar sinais vitais","Toque vaginal","Avaliar BCF","Acesso venoso"],correta:1,coment:"Suspeita de placenta prévia: não fazer toque vaginal antes do US (risco de hemorragia maciça)."},
  {id:"go_hemorragias_q3",area:"GO",tema:"Hemorragias da gestação",transv:[],dif:2,premium:false,enun:"Qual exame confirma gestação ectópica?",alts:["Apenas exame físico","Beta-hCG seriado associado a ultrassom transvaginal","Raio-x de abdome","Hemograma isolado"],correta:1,coment:"Ectópica: beta-hCG (seriado) + ultrassom transvaginal."},
  {id:"go_hemorragias_q4",area:"GO",tema:"Hemorragias da gestação",transv:[],dif:2,premium:false,enun:"O sangramento típico da placenta prévia é:",alts:["Escuro e muito doloroso","Vermelho vivo e indolor","Sempre acompanhado de hipertonia","Apenas no parto"],correta:1,coment:"Placenta prévia: sangue vivo, indolor, frequentemente de repetição."},
  {id:"go_rastreio_q1",area:"GO",tema:"Rastreio CA colo e mama",transv:[],dif:2,premium:false,enun:"Mulher de 30 anos, assintomática, em município onde o teste de DNA-HPV já está implantado. Segundo a diretriz do MS (2025), o rastreamento de câncer de colo deve ser:",alts:["Citologia (Papanicolau) anual","Teste de DNA-HPV oncogênico, e se negativo repetir em 5 anos","Colposcopia imediata","Não rastrear antes dos 35 anos"],correta:1,coment:"Diretriz MS 2025: método primário é o teste de DNA-HPV oncogênico (25-64 anos); se negativo, repete em 5 anos."},
  {id:"go_rastreio_q2",area:"GO",tema:"Rastreio CA colo e mama",transv:[],dif:2,premium:false,enun:"Em uma UBS onde o teste de DNA-HPV ainda NÃO foi implantado, como deve ser feito o rastreamento de câncer de colo?",alts:["Suspender o rastreamento até o teste chegar","Manter a citologia a cada 3 anos, após dois exames anuais normais","Encaminhar todas para colposcopia","Fazer citologia anual por toda a vida"],correta:1,coment:"Na transição, onde o DNA-HPV não está disponível, mantém-se a citologia trienal após dois anuais consecutivos normais."},
  {id:"go_rastreio_q3",area:"GO",tema:"Rastreio CA colo e mama",transv:[],dif:2,premium:false,enun:"Adolescente de 20 anos, sexualmente ativa, assintomática, solicita 'preventivo'. Conduta quanto ao rastreamento de colo?",alts:["Iniciar o teste de DNA-HPV agora","Não iniciar o rastreamento antes dos 25 anos","Fazer colposcopia","Citologia a cada 6 meses"],correta:1,coment:"Não se inicia o rastreamento de colo (nem DNA-HPV nem citologia) antes dos 25 anos, pela alta taxa de infecções transitórias e risco de sobretratamento."},
  {id:"go_rastreio_q4",area:"GO",tema:"Rastreio CA colo e mama",transv:[],dif:2,premium:false,enun:"Qual a recomendação do rastreamento populacional de câncer de mama pelo Ministério da Saúde?",alts:["Mamografia anual dos 40 aos 70 anos","Mamografia a cada 2 anos, na faixa de 50 a 69 anos (ampliada para até 74 anos pelo MS em 2025)","Ultrassonografia anual a partir dos 30","Ressonância bienal dos 45 aos 60"],correta:1,coment:"Mamografia bienal; faixa 50-69 (INCA), ampliada para 50-74 pelo MS em 2025. Rastreio anual dos 40 não é o padrão populacional."},
  {id:"ped_vacinas_q1",area:"PED",tema:"Calendário vacinal",transv:[],dif:2,premium:false,enun:"Criança com resfriado leve e febre baixa (37,8°C), com vacina atrasada. Conduta?",alts:["Adiar todas as vacinas","Vacinar normalmente e atualizar o calendário","Só vacinar após 30 dias sem sintomas","Contraindicar por 6 meses"],correta:1,coment:"Resfriado leve e febre baixa NÃO contraindicam; deve-se vacinar e fazer o resgate do calendário."},
  {id:"ped_vacinas_q2",area:"PED",tema:"Calendário vacinal",transv:[],dif:2,premium:false,enun:"Quais vacinas são aplicadas ao nascer?",alts:["Tríplice viral e febre amarela","BCG e hepatite B","Pentavalente e pólio","HPV e meningo"],correta:1,coment:"Ao nascer: BCG (formas graves de TB) e hepatite B."},
  {id:"ped_vacinas_q3",area:"PED",tema:"Calendário vacinal",transv:[],dif:2,premium:false,enun:"Qual é uma contraindicação VERDADEIRA a vacina de vírus vivo (ex.: tríplice viral)?",alts:["Prematuridade","Imunossupressão importante ou gestação","Resfriado leve","Uso de antibiótico"],correta:1,coment:"Vírus vivo é contraindicado em imunossupressão importante e gestação."},
  {id:"ped_vacinas_q4",area:"PED",tema:"Calendário vacinal",transv:[],dif:2,premium:false,enun:"Prematuro em boas condições, na idade de vacinar. Conduta quanto ao calendário?",alts:["Adiar por ser prematuro","Seguir a idade cronológica e vacinar","Reduzir as doses pela metade","Contraindicar todas"],correta:1,coment:"Prematuridade não contraindica; segue-se a idade cronológica para vacinar."},
  {id:"ped_desenvolvimento_q1",area:"PED",tema:"Crescimento e aleitamento",transv:[],dif:2,premium:false,enun:"Até que idade se recomenda o aleitamento materno EXCLUSIVO?",alts:["Até 3 meses","Até 6 meses","Até 12 meses","Até 2 anos"],correta:1,coment:"AME até 6 meses (só leite materno); complementar até 2 anos ou mais."},
  {id:"ped_desenvolvimento_q2",area:"PED",tema:"Crescimento e aleitamento",transv:[],dif:2,premium:false,enun:"Por volta de qual idade se espera que a criança ande sem apoio?",alts:["6 meses","12 meses","18 meses apenas","3 meses"],correta:1,coment:"O andar sem apoio é esperado por volta dos 12 meses (com variação)."},
  {id:"ped_desenvolvimento_q3",area:"PED",tema:"Crescimento e aleitamento",transv:[],dif:2,premium:false,enun:"Bebê de 3 meses em aleitamento exclusivo. Pode-se oferecer chá para cólica?",alts:["Sim, à vontade","Não — no aleitamento exclusivo não se oferece água ou chá antes dos 6 meses","Sim, mas só à noite","Somente água"],correta:1,coment:"No AME não se oferece água/chá antes dos 6 meses."},
  {id:"ped_desenvolvimento_q4",area:"PED",tema:"Crescimento e aleitamento",transv:[],dif:2,premium:false,enun:"Uma criança que 'cai de canal' na curva de crescimento ou tem atraso importante de marcos deve:",alts:["Ser apenas observada por anos","Ser investigada","Receber alta da puericultura","Trocar de fórmula sem avaliação"],correta:1,coment:"Queda de canal ou atraso importante são sinais de alerta que exigem investigação."},
  {id:"mfc_rastreio_q1",area:"MFC",tema:"Rastreamentos no SUS",transv:[],dif:2,premium:false,enun:"Homem de 52 anos, assintomático, sem história familiar, na primeira consulta. Conforme rastreamento baseado em evidência, o médico de família deve:",alts:["Solicitar PSA e toque retal de rotina","Abordar estilo de vida/cessação do tabagismo e acompanhar, sem rastreios sem evidência","Pedir colonoscopia imediata","Solicitar TC de tórax de rotina"],correta:1,coment:"Prevenção quaternária: não rastrear o que não tem evidência (PSA em massa). Foco no que muda desfecho."},
  {id:"mfc_rastreio_q2",area:"MFC",tema:"Rastreamentos no SUS",transv:[],dif:2,premium:false,enun:"Evitar exames, diagnósticos e tratamentos desnecessários é qual nível de prevenção?",alts:["Primária","Secundária","Terciária","Quaternária"],correta:3,coment:"Prevenção quaternária: proteger o paciente do excesso de medicina."},
  {id:"mfc_rastreio_q3",area:"MFC",tema:"Rastreamentos no SUS",transv:[],dif:2,premium:false,enun:"O rastreamento populacional de câncer de próstata por PSA em massa é:",alts:["Recomendado para todos acima de 40","Não recomendado como rastreamento populacional pelo MS","Obrigatório anualmente","Recomendado só para mulheres"],correta:1,coment:"PSA em massa não é recomendado como rastreio populacional (balanço dano/benefício desfavorável)."},
  {id:"mfc_rastreio_q4",area:"MFC",tema:"Rastreamentos no SUS",transv:[],dif:2,premium:false,enun:"Reabilitar um paciente após AVC, reduzindo sequelas, é prevenção:",alts:["Primária","Secundária","Terciária","Quaternária"],correta:2,coment:"Reduzir sequelas de doença já instalada = prevenção terciária."},
  {id:"mfc_mccp_q1",area:"MFC",tema:"Método centrado na pessoa",transv:[],dif:2,premium:false,enun:"O médico de família explora não só o diagnóstico, mas o que a paciente sente, teme e espera, e constrói o plano junto com ela. Isso caracteriza:",alts:["Método centrado na doença","Método clínico centrado na pessoa (MCCP)","Abordagem exclusivamente biomédica","Consulta de urgência"],correta:1,coment:"Considerar a experiência da pessoa e decidir em conjunto é o MCCP."},
  {id:"mfc_mccp_q2",area:"MFC",tema:"Método centrado na pessoa",transv:[],dif:2,premium:false,enun:"Qual ferramenta mapeia as relações e doenças da família ao longo das gerações?",alts:["Ecomapa","Genograma","Territorialização","Prontuário eletrônico"],correta:1,coment:"O genograma mapeia relações e doenças familiares através das gerações."},
  {id:"mfc_mccp_q3",area:"MFC",tema:"Método centrado na pessoa",transv:[],dif:2,premium:false,enun:"Fatores como moradia, renda, trabalho e educação, que influenciam o adoecimento, são chamados de:",alts:["Fatores de risco laboratoriais","Determinantes sociais da saúde","Sinais de alarme","Contraindicações"],correta:1,coment:"São os determinantes sociais da saúde, centrais na abordagem da APS."},
  {id:"mfc_mccp_q4",area:"MFC",tema:"Método centrado na pessoa",transv:[],dif:2,premium:false,enun:"A decisão compartilhada com o paciente, no MCCP, tende a:",alts:["Piorar a adesão","Melhorar a adesão ao plano","Não influenciar nada","Substituir o diagnóstico"],correta:1,coment:"Envolver o paciente na decisão melhora a adesão ao tratamento."},
  {id:"tv_saudemental_q1",area:"CM",tema:"Saúde Mental na APS (transversal)",transv:[],dif:2,premium:false,enun:"Mulher de 34 anos na APS com humor deprimido, anedonia e insônia há 8 semanas, sem risco de suicídio e sem mania. Primeira linha de tratamento medicamentoso no SUS?",alts:["Amitriptilina em dose plena imediata","ISRS (fluoxetina/sertralina)","Benzodiazepínico contínuo","Antipsicótico"],correta:1,coment:"ISRS são 1ª linha por segurança e tolerabilidade, disponíveis na Rename."},
  {id:"tv_saudemental_q2",area:"CM",tema:"Saúde Mental na APS (transversal)",transv:[],dif:2,premium:false,enun:"Por que o benzodiazepínico não é 1ª linha para ansiedade/depressão crônica?",alts:["Não alivia nada","Causa dependência e não trata o transtorno de base","É proibido no SUS","Só serve para crianças"],correta:1,coment:"Benzodiazepínico pode aliviar sintoma agudo, mas causa dependência e não trata o transtorno de base."},
  {id:"tv_saudemental_q3",area:"CM",tema:"Saúde Mental na APS (transversal)",transv:[],dif:2,premium:false,enun:"Paciente com uso problemático de álcool. Qual a abordagem da APS?",alts:["Apenas internar","Rastrear (AUDIT/CAGE), abordar e articular com a RAPS/CAPS","Ignorar, não é papel da APS","Prescrever benzodiazepínico contínuo"],correta:1,coment:"A APS rastreia e articula com a RAPS (CAPS), com lógica de cuidado no território e redução de danos."},
  {id:"tv_saudemental_q4",area:"CM",tema:"Saúde Mental na APS (transversal)",transv:[],dif:2,premium:false,enun:"Diante de paciente com risco de suicídio, é correto:",alts:["Nunca perguntar para não induzir","Avaliar ativamente o risco e priorizar a segurança, podendo romper o sigilo para proteger a vida","Dar alta imediata","Aguardar piora"],correta:1,coment:"Avalia-se ativamente; a proteção da vida é prioridade e pode justificar romper o sigilo e acionar a rede."},
  {id:"tv_sus_q1",area:"MFC",tema:"Princípios do SUS (transversal)",transv:[],dif:2,premium:false,enun:"Tratar desigualmente os desiguais, oferecendo mais a quem precisa mais, corresponde a qual princípio do SUS?",alts:["Universalidade","Integralidade","Equidade","Descentralização"],correta:2,coment:"Equidade: dar conforme a necessidade (diferente de igualdade, que é dar o mesmo a todos)."},
  {id:"tv_sus_q2",area:"MFC",tema:"Princípios do SUS (transversal)",transv:[],dif:2,premium:false,enun:"Qual dos itens é uma DIRETRIZ organizativa do SUS (não um princípio)?",alts:["Universalidade","Integralidade","Equidade","Descentralização"],correta:3,coment:"Descentralização é diretriz organizativa; universalidade, integralidade e equidade são princípios."},
  {id:"tv_sus_q3",area:"MFC",tema:"Princípios do SUS (transversal)",transv:[],dif:2,premium:false,enun:"Os três princípios doutrinários do SUS são:",alts:["Universalidade, integralidade e equidade","Descentralização, regionalização e participação","Promoção, prevenção e cura","Eficiência, eficácia e economia"],correta:0,coment:"Princípios doutrinários: universalidade, integralidade e equidade."},
  {id:"tv_sus_q4",area:"MFC",tema:"Princípios do SUS (transversal)",transv:[],dif:2,premium:false,enun:"A participação da comunidade no SUS, via conselhos e conferências, é chamada de:",alts:["Descentralização","Controle social (participação social)","Regionalização","Hierarquização"],correta:1,coment:"É o controle social (participação social), diretriz do SUS exercida por conselhos e conferências."},
