     "Agora a situação especial que mais aparece: a BACTERIÚRIA ASSINTOMÁTICA. Ela é a presença de bactéria na urina SEM sintomas — e a regra é NÃO TRATAR. Tratar bacteriúria assintomática em idoso, em paciente cateterizado ou em quem tem urina 'suja' no exame de rotina é erro clássico: não melhora desfecho e só seleciona resistência. Existem exatamente duas exceções: a GESTANTE e o paciente que vai passar por procedimento urológico invasivo. Um detalhe correlato: urina com cheiro forte ou aspecto turvo, sem sintomas, não é indicação de antibiótico.",
     "Na GESTANTE, tudo se inverte, e por bons motivos: a bacteriúria assintomática se RASTREIA com urocultura no pré-natal e se TRATA sempre, porque nela o risco de evoluir para pielonefrite é alto, e a pielonefrite gestacional se associa a parto prematuro e complicações. Quanto às drogas: usam-se cefalexina, amoxicilina e nitrofurantoína (esta evitada perto do parto/termo); evitam-se quinolonas, e a sulfa é evitada no primeiro trimestre e próximo ao termo. Após tratar, faz-se urocultura de controle. Por fim, na ITU DE REPETIÇÃO investiga-se, orientam-se medidas comportamentais (hidratação, micção pós-coital) e considera-se profilaxia em casos selecionados. Resumo do que a banca quer: cistite simples é clínica e tratamento curto; bacteriúria assintomática não trata, exceto gestante e pré-procedimento urológico; e pielonefrite que não melhora em 48-72h pede imagem."],
   raciocinio:["Tem FEBRE e Giordano positivo? É pielonefrite (alta). Sem febre, só disúria/polaciúria/dor suprapúbica? Cistite (baixa).",
     "Cistite não complicada em mulher jovem não gestante: diagnóstico CLÍNICO, sem urocultura de rotina → tratamento CURTO (nitrofurantoína 5 dias, fosfomicina dose única, SMX-TMP se resistência baixa). Evite quinolona.",
     "É complicada (homem, gestante, criança, cateter, obstrução, DM descompensado, imunossupressão, hospitalar)? Urocultura, tratamento mais longo e investigação.",
     "Pielonefrite: urocultura ANTES do ATB. Ambulatorial (leve/moderada): quinolona ou cefalosporina, 7-14 dias.",
     "Interne se: vômitos/não tolera VO, gestante, sepse, obstrução ou falha ambulatorial.",
     "NÃO melhorou em 48-72h? Faça IMAGEM: procure abscesso ou OBSTRUÇÃO (urgência urológica — precisa drenar).",
     "Bacteriúria ASSINTOMÁTICA: não trate — exceto GESTANTE e antes de procedimento urológico invasivo.",
     "Gestante: rastreie com urocultura no pré-natal e trate sempre; use cefalexina/amoxicilina/nitrofurantoína (evitar no termo); evite quinolona."],
   nucleo:["Cistite (baixa): disúria, polaciúria, dor suprapúbica, SEM febre. Pielonefrite (alta): febre, calafrio, Giordano +. Agente: E. coli (~80%).",
     "Cistite não complicada (mulher jovem, não gestante): diagnóstico CLÍNICO, sem urocultura. Tratamento CURTO: nitrofurantoína 5 dias, fosfomicina dose única, SMX-TMP (se resistência <20%). Evitar quinolona.",
     "Complicada: homem, gestante, criança, DM descompensado, cateter, obstrução/anomalia, imunossupressão, recorrente, hospitalar → urocultura + tratamento prolongado + investigação.",
     "Pielonefrite: urocultura ANTES do antibiótico; ambulatorial com quinolona ou cefalosporina por 7-14 dias.",
     "Internar: vômitos/intolerância à VO, gestante, sepse, obstrução, falha ambulatorial.",
     "Sem melhora em 48-72h → IMAGEM (USG/TC): abscesso ou OBSTRUÇÃO. Pielonefrite obstruída = urgência urológica (drenar; antibiótico sozinho não resolve).",
     "Bacteriúria ASSINTOMÁTICA: NÃO tratar. Exceções: GESTANTE e pré-procedimento urológico invasivo.",
     "Gestante: rastrear urocultura no pré-natal e tratar sempre (risco de pielonefrite e parto prematuro). Cefalexina, amoxicilina, nitrofurantoína (evitar próximo ao termo); evitar quinolona; urocultura de controle."],
   pega:"Bacteriúria assintomática NÃO se trata — exceto na gestante e antes de procedimento urológico. Tratar o idoso com 'urina suja' e sem sintomas é erro clássico. E pielonefrite que não melhora em 48-72h pede imagem: obstrução é urgência urológica, não se resolve com antibiótico.",
   mne:"Febre + Giordano = alta (pielonefrite). Sem febre = baixa (cistite, tratamento curto). Assintomático não trata — salvo GESTANTE.",
   sus:"Cistite não complicada é resolutiva na APS (diagnóstico clínico, tratamento curto); urocultura de rastreio faz parte do pré-natal."},
  {id:"cir-biliar",area:"CIR",nome:"Colelitíase, colecistite e colangite",yield:3,
   questoes:["cir_biliar_q1","cir_biliar_q2","cir_biliar_q3","cir_biliar_q4"],
   fonte:"Tokyo Guidelines 2018 (TG18) — diagnóstico e manejo de colecistite e colangite agudas; Sabiston — Tratado de Cirurgia; Colégio Brasileiro de Cirurgia Digestiva (CBCD).",
   aula:["Cálculo na vesícula é achado comuníssimo, e o perfil clássico ajuda: os '4 F' — female (mulher), forty (por volta dos 40), fat (sobrepeso) e fertile (multípara). Mas o dado que abre o assunto é outro: a MAIORIA dos portadores de cálculo é ASSINTOMÁTICA, e colelitíase assintomática NÃO se opera. Só se indica cirurgia profilática em situações específicas: vesícula em porcelana (risco de câncer), cálculo grande (acima de 3 cm), anemia hemolítica, alguns pólipos e candidatos a transplante. Marcar 'operar todo mundo que tem cálculo' é erro.",
     "A CÓLICA BILIAR é o cálculo que impacta no infundíbulo ou no ducto cístico e depois se desimpacta. Dá dor em hipocôndrio direito ou epigástrio, tipicamente após refeição gordurosa (a gordura estimula a colecistocinina, a vesícula contrai contra o cálculo), dura MENOS de 6 horas e cede — e o ponto-chave: NÃO há febre nem leucocitose, porque ainda não houve inflamação, só obstrução transitória. O exame é a ULTRASSONOGRAFIA, que é a escolha para vesícula. A conduta é colecistectomia ELETIVA, preferencialmente videolaparoscópica.",
     "A COLECISTITE AGUDA é quando o cálculo impacta e NÃO sai: a bile retida inflama a parede. Muda tudo — a dor passa de 6 horas e é contínua, aparecem FEBRE e LEUCOCITOSE, e surge o SINAL DE MURPHY: você palpa o hipocôndrio direito e pede para o paciente inspirar; a vesícula inflamada desce, encontra sua mão e ele interrompe a inspiração de dor. Na ultrassonografia: parede espessada (acima de 4 mm), líquido perivesicular, cálculo impactado e Murphy ultrassonográfico. O tratamento é internação, jejum, hidratação, antibiótico e COLECISTECTOMIA PRECOCE — idealmente nas primeiras 72 horas, na mesma internação. A antiga conduta de 'esfriar o processo e operar dali a 6 semanas' foi abandonada: operar cedo tem menos complicação e menos custo.",
     "Quando o cálculo migra para o colédoco, o quadro muda de endereço. COLEDOCOLITÍASE dá icterícia, colúria e acolia fecal, com padrão laboratorial COLESTÁTICO: bilirrubina DIRETA, fosfatase alcalina e GGT elevadas. A ultrassonografia sugere (colédoco dilatado acima de 6 mm), e a confirmação se faz por colangiorressonância ou ecoendoscopia — atenção, porque a CPRE é procedimento TERAPÊUTICO e não deve ser usada apenas para diagnosticar, já que tem risco (inclusive de pancreatite pós-CPRE). E se essa via biliar obstruída INFECTA, temos a COLANGITE AGUDA: a TRÍADE DE CHARCOT é dor + febre + ICTERÍCIA (repare: é a icterícia que diferencia da colecistite). Se somarem hipotensão e confusão mental, vira a PÊNTADE DE REYNOLDS — colangite grave, com mortalidade alta. O tratamento é antibiótico MAIS DRENAGEM da via biliar (CPRE): antibiótico sozinho não resolve um abscesso sob pressão, e é a drenagem que salva.",
     "Fechando com os diferenciais que a banca adora. Se o cálculo desce e obstrui a papila, ele pode desencadear PANCREATITE BILIAR — que é a principal causa de pancreatite aguda no Brasil. E existe um sinal que muda completamente o raciocínio: a VESÍCULA PALPÁVEL e INDOLOR num paciente ICTÉRICO é o sinal de COURVOISIER-TERRIER, e ele NÃO fala a favor de cálculo — fala a favor de neoplasia periampular (tipicamente câncer de cabeça de pâncreas). A lógica é elegante: a vesícula de quem tem cálculo crônico é fibrótica e não distende; já a obstrução lenta por tumor deixa a vesícula encher, palpável e sem dor. Resumo: cólica (menos de 6h, sem febre) → eletiva; colecistite (Murphy + febre) → operar precoce; colangite (Charcot, com icterícia) → antibiótico + drenar."],
   raciocinio:["Cálculo assintomático? NÃO opera (salvo vesícula em porcelana, cálculo >3 cm, anemia hemolítica, pré-transplante).",
     "Dor <6h, pós-gordura, SEM febre e SEM leucocitose = cólica biliar → USG e colecistectomia ELETIVA.",
     "Dor >6h + febre + leucocitose + Murphy = colecistite aguda → internar, antibiótico e colecistectomia PRECOCE (até ~72h, mesma internação).",
     "Apareceu ICTERÍCIA com colúria/acolia e padrão colestático (BD, FA, GGT)? Pense coledocolitíase → colangioRM/ecoendoscopia (CPRE é terapêutica).",
     "Dor + febre + icterícia = tríade de Charcot = COLANGITE → antibiótico + DRENAGEM da via biliar. Com hipotensão e confusão = pêntade de Reynolds (grave).",
     "Vesícula PALPÁVEL e INDOLOR + icterícia = Courvoisier-Terrier → pense neoplasia periampular, não cálculo."],
   nucleo:["Maioria dos cálculos é assintomática e NÃO se opera. Exceções: vesícula em porcelana, cálculo >3 cm, anemia hemolítica, pré-transplante.",
     "Cólica biliar: <6h, sem febre/leucocitose → USG → colecistectomia eletiva (videolaparoscópica).",
     "Colecistite aguda: >6h + febre + leucocitose + MURPHY; USG com parede >4 mm e líquido perivesicular → colecistectomia PRECOCE (≤72h, mesma internação).",
     "Coledocolitíase: icterícia + colúria/acolia + BD/FA/GGT altas; confirmar com colangioRM ou ecoendoscopia. CPRE é TERAPÊUTICA.",
     "Colangite: tríade de CHARCOT (dor + febre + icterícia). Pêntade de REYNOLDS acrescenta hipotensão e confusão = grave.",
     "Colangite trata-se com antibiótico + DRENAGEM da via biliar (a drenagem é o que salva).",
     "Courvoisier-Terrier (vesícula palpável e INDOLOR + icterícia) = neoplasia periampular."],
   pega:"Cálculo assintomático não opera. E a icterícia é o divisor: colecistite tem Murphy e febre SEM icterícia; colangite tem a tríade de Charcot COM icterícia e exige DRENAGEM, não só antibiótico. Vesícula palpável indolor + icterícia = câncer, não cálculo.",
   mne:"CHARCOT = 3 (dor, febre, icterícia). REYNOLDS = 5 (+ hipotensão + confusão). Murphy = colecistite. Courvoisier = câncer.",
   sus:"Colecistectomia eletiva é procedimento de alta demanda na fila do SUS; a APS reconhece e referencia a urgência biliar."},

  {id:"cir-pancreatite",area:"CIR",nome:"Pancreatite aguda",yield:3,
   questoes:["cir_pancre_q1","cir_pancre_q2","cir_pancre_q3","cir_pancre_q4"],
   fonte:"Classificação de Atlanta revisada (2012); diretrizes da International Association of Pancreatology/American Pancreatic Association (IAP/APA); American Gastroenterological Association (AGA) — manejo da pancreatite aguda; Sabiston.",
   aula:["Pancreatite aguda é o pâncreas se autodigerindo: as enzimas que deveriam ser ativadas no intestino ativam-se dentro da própria glândula. Duas causas respondem por cerca de 80% dos casos e você precisa saber a ordem no Brasil: a BILIAR (cálculo que obstrui a papila) é a primeira, mais comum em mulheres; a ALCOÓLICA é a segunda, mais comum em homens. Depois vêm hipertrigliceridemia (em geral acima de 1.000 mg/dL), pós-CPRE, drogas, trauma e hipercalcemia. Definir a etiologia não é detalhe acadêmico: se for biliar, existe uma conduta específica para impedir que aconteça de novo.",
     "O diagnóstico segue a classificação de ATLANTA e exige 2 de 3 critérios: (1) DOR abdominal típica — epigástrica, intensa, contínua, irradiando 'em faixa' para o dorso, e que melhora quando o paciente se inclina para a frente; (2) AMILASE ou LIPASE pelo menos 3 VEZES acima do limite superior da normalidade (a lipase é mais específica e permanece elevada por mais tempo); (3) imagem compatível. A consequência prática é o que a prova cobra: com dor típica e lipase 3x, o diagnóstico está FEITO — não é preciso tomografia. E guarde a pegadinha campeã: o VALOR da enzima NÃO indica gravidade. Amilase de 3.000 não é 'mais grave' que amilase de 400.",
     "A gravidade, pela Atlanta revisada, se define por FALÊNCIA ORGÂNICA: LEVE = sem falência e sem complicação local; MODERADAMENTE GRAVE = falência transitória (menos de 48h) ou complicação local; GRAVE = falência orgânica PERSISTENTE, além de 48 horas. Existem escores auxiliares (Ranson, APACHE II, BISAP) e a PCR acima de 150 em 48h sugere gravidade. Quanto à TOMOGRAFIA: ela NÃO é para diagnosticar nem para as primeiras horas — feita cedo demais, subestima a necrose, que leva dias para se delimitar. Indica-se após 48 a 72 horas, quando há dúvida diagnóstica ou suspeita de complicação.",
     "O tratamento é SUPORTE, e três condutas mudaram — são exatamente as que a banca cobra. (1) HIDRATAÇÃO venosa vigorosa nas primeiras horas, preferindo Ringer lactato, guiada por resposta (diurese, perfusão), somada a analgesia adequada e controle de eletrólitos. (2) NUTRIÇÃO ENTERAL PRECOCE: o velho dogma do 'jejum prolongado para repousar o pâncreas' com nutrição parenteral foi ABANDONADO. Alimenta-se cedo (nas primeiras 24-72h, por via oral se o paciente tolerar), porque a dieta enteral preserva a barreira intestinal e REDUZ infecção e mortalidade. (3) ANTIBIÓTICO PROFILÁTICO NÃO é indicado na pancreatite necrosante ESTÉRIL — antibiótico só entra diante de infecção documentada ou forte suspeita.",
     "Fechando com a etiologia biliar e as complicações. Se a causa foi cálculo e a pancreatite é LEVE, faz-se a COLECISTECTOMIA na MESMA INTERNAÇÃO — mandar o paciente para casa com a vesícula é convidá-lo a voltar com outra pancreatite. A CPRE de urgência não é para todo mundo: reserva-se aos casos com COLANGITE associada ou obstrução biliar persistente. As complicações locais evoluem no tempo: coleções agudas, necrose (estéril ou infectada) e, mais tarde, pseudocisto. Quando a necrose infecta, a abordagem moderna é o 'step-up' — escalonar da drenagem percutânea/endoscópica para a necrosectomia, e o mais TARDE possível (idealmente após 4 semanas, quando a necrose está delimitada). Resumo do que cai: enzima não mede gravidade; TC não é precoce; hidrata bem, alimenta cedo, não dá antibiótico profilático; e se for biliar, tira a vesícula antes da alta."],
   raciocinio:["Dor epigástrica em faixa para o dorso que melhora inclinando à frente? Pense pancreatite.",
     "Diagnóstico = 2 de 3 (Atlanta): dor típica + lipase/amilase ≥3x + imagem. Com dor típica e lipase 3x, NÃO precisa de TC.",
     "Não use o valor da enzima como medida de gravidade — gravidade é falência orgânica (persistente >48h = grave).",
     "Busque a etiologia: biliar (mais comum, mulher) x alcoólica (homem) x triglicerídeos >1000.",
     "Trate: hidratação vigorosa (Ringer lactato) + analgesia + nutrição ENTERAL precoce. Sem antibiótico profilático na necrose estéril.",
     "TC só após 48-72h, se dúvida ou suspeita de complicação (precoce subestima necrose).",
     "Se biliar e LEVE: colecistectomia na MESMA internação. CPRE de urgência apenas com colangite ou obstrução persistente."],
   nucleo:["Causas: BILIAR (1ª, mulheres) e ALCOÓLICA (2ª, homens) = ~80%. Também hipertrigliceridemia >1000, pós-CPRE, drogas.",
     "Atlanta: diagnóstico com 2 de 3 — dor típica, amilase/LIPASE ≥3x o normal, imagem compatível.",
     "O VALOR da enzima NÃO indica gravidade. Gravidade = falência orgânica: transitória <48h (moderadamente grave) x PERSISTENTE >48h (grave).",
     "TC não é precoce: indicada após 48-72h (dúvida ou complicação); feita cedo, subestima necrose.",
     "Tratamento: hidratação vigorosa (Ringer lactato), analgesia e NUTRIÇÃO ENTERAL PRECOCE (jejum prolongado/parenteral foi abandonado).",
     "Antibiótico profilático NÃO na necrose estéril — só com infecção comprovada/suspeita forte.",
     "Biliar leve: colecistectomia na MESMA internação. CPRE urgente só se colangite ou obstrução persistente.",
     "Necrose infectada: abordagem 'step-up' (drenagem antes de necrosectomia), o mais tardia possível (~4 semanas)."],
   pega:"O valor da amilase/lipase NÃO mede gravidade. Não peça TC nas primeiras horas (subestima necrose), não faça jejum prolongado (alimente cedo, por via enteral) e não use antibiótico profilático na necrose estéril.",
   mne:"Atlanta = 2 de 3 (Dor + enzima 3x + Imagem). Grave = falência >48h. Biliar leve = vesícula sai ANTES da alta.",
   sus:"Pancreatite biliar é causa frequente de internação; a colecistectomia na mesma internação evita reinternação e nova crise."},

  {id:"cir-obstrucao",area:"CIR",nome:"Obstrução intestinal",yield:3,
   questoes:["cir_obst_q1","cir_obst_q2","cir_obst_q3","cir_obst_q4"],
   fonte:"Sabiston — Tratado de Cirurgia; World Society of Emergency Surgery (WSES) — Bologna Guidelines para obstrução de delgado por aderências; Colégio Brasileiro de Cirurgiões.",
   aula:["A obstrução intestinal se anuncia por quatro sinais que valem como bloco: dor em CÓLICA, VÔMITOS, DISTENSÃO abdominal e PARADA de eliminação de fezes e flatos. O que a prova quer é que você use esses quatro para localizar o nível, porque a proporção entre eles muda conforme a altura. Obstrução ALTA (delgado proximal): vômito PRECOCE e abundante, com pouca distensão — o conteúdo não teve espaço para acumular. Obstrução BAIXA (cólon): DISTENSÃO importante e vômito TARDIO, que pode ser fecaloide, com parada de eliminação precoce. Vômito cedo com barriga vazia = alta; barriga estufada com vômito tardio = baixa.",
     "As causas seguem um mapa que você precisa decorar porque cai direto. No DELGADO, a campeã são as BRIDAS (aderências de cirurgia abdominal prévia), seguidas de hérnias e de neoplasia. No CÓLON, a campeã é a NEOPLASIA, seguida de volvo e de diverticulite. Em crianças, pense intussuscepção e hérnia. E existe um detalhe que a banca usa como armadilha: se o paciente NUNCA operou o abdome, brida é improvável — e aí a HÉRNIA encarcerada sobe ao topo da lista. Por isso a regra prática: em toda obstrução, EXAMINE os orifícios herniários. A hérnia esquecida na virilha é o erro clássico.",
     "O diagnóstico começa com a radiografia de abdome, que mostra distensão de alças, níveis hidroaéreos e ausência de gás distal — e, se houver pneumoperitônio (ar livre sob o diafragma), o assunto vira perfuração. Mas o exame de escolha hoje é a TOMOGRAFIA de abdome com contraste: ela define o NÍVEL da obstrução, a CAUSA e, principalmente, se há sofrimento da alça.",
     "E é justamente aí que mora a decisão que a questão cobra: distinguir obstrução SIMPLES de ESTRANGULADA (aquela em que a alça perdeu o suprimento de sangue e está isquemiando). Os sinais de alarme são: a dor deixa de ser em cólica e vira CONTÍNUA; febre; taquicardia; leucocitose; acidose metabólica com lactato elevado; sinais de irritação peritoneal. Na tomografia: pneumatose intestinal, líquido livre e alça que não realça com o contraste. Qualquer um desses = CIRURGIA DE URGÊNCIA. Também vão direto para a sala: hérnia estrangulada, volvo com sofrimento e perfuração.",
     "Sem sinais de sofrimento, porém, nem toda obstrução opera de imediato — e essa é a pegadinha invertida. A obstrução de delgado por BRIDA, sem sinais de estrangulamento, tenta-se primeiro CONSERVADORA: jejum, SONDA NASOGÁSTRICA para descomprimir, hidratação venosa e correção de eletrólitos. Some-se a prova com CONTRASTE HIDROSSOLÚVEL (gastrografina), que é ao mesmo tempo diagnóstica e terapêutica — se o contraste alcança o cólon em cerca de 24 horas, prediz resolução sem cirurgia. Reavalia-se de perto: piora ou ausência de resolução em 48-72 horas = operar. Já a obstrução por CÂNCER de cólon habitualmente exige abordagem cirúrgica. E o VOLVO DE SIGMOIDE tem conduta própria: descompressão endoscópica para desfazer a torção e, pela altíssima recidiva, sigmoidectomia na mesma internação."],
   raciocinio:["Reconheça o bloco: cólica + vômitos + distensão + parada de fezes e flatos.",
     "Localize pelo padrão: vômito precoce com pouca distensão = ALTA (delgado). Distensão grande com vômito tardio/fecaloide = BAIXA (cólon).",
     "Pense na causa pelo sítio: delgado = BRIDAS (1ª), hérnia, tumor. Cólon = NEOPLASIA (1ª), volvo, diverticulite.",
     "Sem cirurgia abdominal prévia? EXAMINE os orifícios herniários — hérnia encarcerada sobe na lista.",
     "Peça TC com contraste: define nível, causa e sofrimento de alça.",
     "Procure ESTRANGULAMENTO: dor contínua (não mais em cólica), febre, taquicardia, leucocitose, lactato, peritonismo; na TC pneumatose, líquido livre, alça sem realce → CIRURGIA JÁ.",
     "Brida SEM sofrimento: conservador (jejum + SNG + hidratação + contraste hidrossolúvel) e reavaliar; falha em 48-72h = operar."],
   nucleo:["Quadro: dor em cólica + vômitos + distensão + parada de fezes e flatos.",
     "ALTA (delgado): vômito precoce, pouca distensão. BAIXA (cólon): muita distensão, vômito tardio/fecaloide.",
     "Causas — delgado: BRIDAS (1ª), hérnias, tumor. Cólon: NEOPLASIA (1ª), volvo, diverticulite. Sem cirurgia prévia? pense HÉRNIA e examine os orifícios herniários.",
     "Rx: níveis hidroaéreos, distensão, ausência de gás distal; pneumoperitônio = perfuração. TC com contraste é o exame de escolha.",
     "ESTRANGULAMENTO (opera já): dor contínua, febre, taquicardia, leucocitose, lactato/acidose, peritonismo; TC com pneumatose, líquido livre, alça sem realce.",
     "Brida sem sofrimento: conservador — jejum, SNG, hidratação, eletrólitos e contraste hidrossolúvel (diagnóstico E terapêutico; chegou ao cólon em 24h prediz resolução). Falha em 48-72h = cirurgia.",
     "Volvo de sigmoide: descompressão endoscópica + sigmoidectomia na mesma internação (alta recidiva)."],
   pega:"Nem toda obstrução opera de imediato: brida SEM sinais de sofrimento tenta conservador. Mas sinal de estrangulamento (dor que vira contínua, febre, lactato, peritonismo) não espera. E em paciente sem cirurgia prévia, examine a virilha — a hérnia encarcerada é a esquecida.",
   mne:"Delgado = Brida. Cólon = Câncer. Dor que deixa de ser cólica e vira contínua = estrangulou.",
   sus:"Reconhecimento e referência rápida da urgência abdominal pela APS/SAMU; câncer de cólon obstruído revela diagnóstico tardio."},

  {id:"cir-queimados",area:"CIR",nome:"Queimaduras",yield:2,
   questoes:["cir_queim_q1","cir_queim_q2","cir_queim_q3","cir_queim_q4"],
   fonte:"Cartilha para Tratamento de Emergência das Queimaduras (Ministério da Saúde); ATLS 11ª edição — anexo de queimaduras; American Burn Association; fórmula de Parkland.",
   aula:["Queimadura se descreve por duas coisas: PROFUNDIDADE e EXTENSÃO. Na profundidade: o 1º GRAU atinge só a epiderme — é o eritema doloroso da insolação, e o detalhe que cai é que ele NÃO entra no cálculo da superfície corporal queimada. O 2º GRAU SUPERFICIAL forma BOLHAS, tem base rósea e úmida e dói MUITO; cicatriza sozinho. O 2º grau profundo é mais pálido e MENOS doloroso. O 3º GRAU é espessura total: aspecto branco nacarado ou carbonizado, seco, rígido — e INDOLOR, porque destruiu as terminações nervosas; exige enxerto. Guarde a inversão que a banca adora: a queimadura que NÃO DÓI é a mais grave.",
     "A extensão se estima pela REGRA DOS NOVE no adulto: cabeça 9%, cada membro superior 9%, cada membro inferior 18%, tronco anterior 18%, tronco posterior 18% e períneo 1%. Na CRIANÇA a proporção é outra, porque a cabeça é proporcionalmente maior (cerca de 18%) e as pernas menores (cerca de 13,5% cada) — por isso usa-se a tabela de Lund-Browder, mais precisa nessa idade. Um atalho útil: a palma da mão do PACIENTE equivale a aproximadamente 1% da superfície corporal dele. E repetindo, porque é o erro mais comum: o 1º grau não conta.",
     "Queimado grave é politraumatizado: a prioridade é o XABCDE. E o que mata cedo é a VIA AÉREA. Suspeite de LESÃO INALATÓRIA se houve incêndio em ambiente FECHADO, se há queimadura de face, vibrissas nasais chamuscadas, rouquidão, estridor ou escarro carbonáceo. Diante disso, INTUBE PRECOCEMENTE — o edema progride e, se você esperar, perde a via aérea e não consegue mais intubar. Some-se a intoxicação por MONÓXIDO DE CARBONO, com uma armadilha técnica: a oximetria de pulso ENGANA, lendo saturação normal, porque não distingue a carboxi-hemoglobina da oxi-hemoglobina. A conduta é oxigênio a 100% e dosagem de carboxi-hemoglobina.",
     "A reposição volêmica usa a fórmula de PARKLAND: 4 mL x peso (kg) x %SCQ de Ringer lactato nas primeiras 24 horas — METADE desse volume nas primeiras 8 HORAS e a outra metade nas 16 horas seguintes. Dois detalhes que a questão explora: as 8 horas contam a partir do MOMENTO DA QUEIMADURA, não da chegada ao hospital (se o paciente chegou 3h depois, o volume da primeira metade tem de correr em 5h); e a fórmula é apenas uma ESTIMATIVA inicial — o guia verdadeiro é a resposta clínica, sobretudo a DIURESE (0,5 a 1 mL/kg/h no adulto, 1 mL/kg/h na criança). Infundir 'a fórmula' cegamente leva ao excesso de volume (o chamado fluid creep), que também faz mal. Completam o atendimento: analgesia venosa, retirada de anéis e roupas, AQUECIMENTO do paciente e profilaxia antitetânica. Não se passa gelo (aprofunda a lesão e causa hipotermia) e não se usa antibiótico sistêmico profilático.",
     "Duas situações fecham o tema. A queimadura CIRCUNFERENCIAL — que dá a volta em um membro ou no tórax — cria uma casca rígida que estrangula: no membro, gera síndrome compartimental (dor, ausência de pulso, palidez); no tórax, impede a expansão e o paciente não ventila. O tratamento é a ESCAROTOMIA, incisão de urgência que libera. Já a queimadura ELÉTRICA engana pela aparência: a lesão de entrada e saída pode ser pequena, mas a corrente destrói músculo profundo no trajeto — daí rabdomiólise com mioglobinúria (urina escura), risco de insuficiência renal (exige hidratação mais generosa) e arritmias. Encaminham-se ao centro de queimados: grandes extensões, 3º grau, queimaduras de face, mãos, pés, períneo e articulações, elétricas, químicas, lesão inalatória, extremos de idade e as circunferenciais."],
   raciocinio:["Classifique a profundidade: bolha e muita dor = 2º superficial; branco/carbonizado e INDOLOR = 3º grau (o pior).",
     "Calcule a extensão pela regra dos nove (criança: Lund-Browder; palma do paciente ≈ 1%). NÃO conte o 1º grau.",
     "Priorize o XABCDE. Incêndio em ambiente fechado, face queimada, vibrissas chamuscadas, rouquidão ou escarro carbonáceo = intubar PRECOCE.",
     "Suspeita de monóxido: a oximetria mente — dê O2 a 100% e dose carboxi-hemoglobina.",
     "Parkland: 4 mL x kg x %SCQ de Ringer lactato em 24h; metade nas primeiras 8h contadas DA QUEIMADURA. Ajuste pela DIURESE (0,5-1 mL/kg/h).",
     "Circunferencial em membro ou tórax = escarotomia de urgência.",
     "Elétrica: lesão externa pequena engana — vigie rabdomiólise/mioglobinúria e arritmia, hidrate mais."],
   nucleo:["Profundidade: 1º grau (eritema, NÃO entra no cálculo) · 2º superficial (bolhas, muito doloroso) · 2º profundo (pálido, menos dor) · 3º grau (branco/carbonizado, INDOLOR, exige enxerto).",
     "Extensão: regra dos nove no adulto (cabeça 9, MS 9 cada, MI 18 cada, tronco 18+18, períneo 1). Criança: cabeça ~18, pernas ~13,5 (Lund-Browder). Palma do paciente ≈1%.",
     "Lesão inalatória (ambiente fechado, face queimada, vibrissas, rouquidão, escarro carbonáceo) = INTUBAR PRECOCE, antes do edema.",
     "Monóxido de carbono: oximetria de pulso ENGANA → O2 a 100% e carboxi-hemoglobina.",
     "Parkland: 4 mL x kg x %SCQ (Ringer lactato) em 24h — metade nas primeiras 8h A PARTIR DA QUEIMADURA. Guia real = DIURESE 0,5-1 mL/kg/h (1 na criança).",
     "Não passar gelo; aquecer o paciente; analgesia venosa; profilaxia antitetânica; sem antibiótico sistêmico profilático.",
     "Circunferencial (membro/tórax) → ESCAROTOMIA. Elétrica → dano profundo oculto, rabdomiólise/mioglobinúria, arritmia."],
   pega:"A queimadura que NÃO dói é a mais grave (3º grau). O 1º grau NÃO entra no cálculo da superfície. E as 8 horas de Parkland contam do momento da QUEIMADURA, não da chegada — a fórmula é estimativa: quem manda é a diurese.",
   mne:"Parkland = 4 x peso x %SCQ · metade em 8h (desde a queimadura). Regra dos 9. Não dói = 3º grau. Circunferencial = escarotomia.",
   sus:"Rede de urgência e referência a centro de queimados; profilaxia antitetânica conforme o PNI."},
  {id:"cir-torax",area:"CIR",nome:"Trauma torácico",yield:3,
   questoes:["cir_tx_q1","cir_tx_q2","cir_tx_q3","cir_tx_q4"],
   fonte:"ATLS — Advanced Trauma Life Support, 11ª edição (American College of Surgeons); PHTLS; Sociedade Brasileira de Cirurgia Torácica.",
   aula:["O tórax assusta, mas guarda uma boa notícia: cerca de 85% dos traumas torácicos se resolvem com DRENO de tórax e suporte — a minoria precisa de toracotomia. A má notícia é que as lesões que matam, matam em minutos. Por isso o ATLS as coloca na avaliação PRIMÁRIA (no B e no C), e todas elas têm a mesma característica: são diagnosticadas CLINICAMENTE e tratadas na hora, à beira do leito, sem esperar exame. As letais imediatas são: obstrução de via aérea, pneumotórax hipertensivo, pneumotórax aberto, hemotórax maciço, tamponamento cardíaco e tórax instável com contusão pulmonar.",
     "PNEUMOTÓRAX HIPERTENSIVO é a estrela do tema e a regra é categórica: o diagnóstico é CLÍNICO — pedir raio-x mata o paciente. O ar entra na pleura e não sai, a pressão empurra o mediastino e dobra as veias cavas: o retorno venoso despenca e o paciente choca. Você reconhece por dispneia intensa, hipotensão/choque, TURGÊNCIA JUGULAR, desvio de traqueia para o lado CONTRALATERAL, timpanismo e ausência de murmúrio vesicular do lado afetado. A conduta é descompressão IMEDIATA por agulha e, em seguida, DRENAGEM torácica definitiva. Atenção à atualização: o ATLS mudou o local da punção — hoje se recomenda o 5º ESPAÇO INTERCOSTAL na linha AXILAR MÉDIA (antes era o 2º espaço na linha hemiclavicular), porque a parede é mais fina ali e a taxa de sucesso é maior.",
     "TAMPONAMENTO CARDÍACO é o irmão que confunde. Ele também dá hipotensão com jugular túrgida, e é típico do trauma PENETRANTE na região precordial. A tríade de BECK reúne: hipotensão + turgência jugular + BULHAS ABAFADAS; some-se o pulso paradoxal. O que separa dos dois na beira do leito? O pneumotórax hipertensivo tem AUSÊNCIA de murmúrio vesicular e desvio de traqueia; o tamponamento tem murmúrio NORMAL e bulhas abafadas. O diagnóstico se confirma pela janela pericárdica do FAST. A pericardiocentese é apenas uma PONTE — o tratamento definitivo é cirúrgico (janela pericárdica/toracotomia).",
     "HEMOTÓRAX MACIÇO tem números que caem: drenagem imediata de mais de 1.500 mL, OU saída superior a 200 mL/hora por 2 a 4 horas = indicação de TORACOTOMIA. A conduta inicial é drenar e repor volume/hemocomponentes ao mesmo tempo. PNEUMOTÓRAX ABERTO (a ferida 'soprante', quando o orifício é grande): o ar entra pela ferida em vez de pela traqueia. O tratamento é o curativo de TRÊS PONTAS — fixado em três lados, funcionando como válvula que deixa sair e não deixa entrar —, seguido de drenagem em outro sítio. E aqui está a pegadinha: ocluir a ferida nos QUATRO lados transforma o pneumotórax aberto em HIPERTENSIVO.",
     "TÓRAX INSTÁVEL (flail chest) é a fratura de duas ou mais costelas em dois ou mais pontos, criando um segmento solto que se move PARADOXALMENTE (afunda na inspiração). Mas o conceito que a prova quer é outro: o que mata não é o osso solto — é a CONTUSÃO PULMONAR subjacente. Por isso o tratamento é ANALGESIA adequada (bloqueios), fisioterapia e suporte ventilatório conforme a necessidade, e não a fixação cirúrgica de rotina. Completam o repertório: a contusão miocárdica (arritmias após trauma esternal), a ruptura traumática de aorta (suspeita pelo mecanismo de desaceleração e pelo MEDIASTINO ALARGADO no raio-x) e a ruptura diafragmática (vísceras no tórax, mais comum à esquerda)."],
   raciocinio:["Lembre: ~85% do trauma torácico resolve com DRENO — mas as letais imediatas são clínicas e se tratam no B e no C.",
     "Hipotensão + jugular túrgida: pense nos dois. AUSÊNCIA de murmúrio + desvio de traqueia = PNEUMOTÓRAX HIPERTENSIVO. Murmúrio normal + bulhas abafadas = TAMPONAMENTO.",
     "Pneumotórax hipertensivo: diagnóstico CLÍNICO, nunca espere raio-x → descompressão por agulha no 5º EIC, linha AXILAR MÉDIA (ATLS 11) + drenagem.",
     "Tamponamento (trauma penetrante precordial): FAST confirma; pericardiocentese é ponte, o definitivo é cirúrgico.",
     "Hemotórax: drenou >1.500 mL de imediato OU >200 mL/h por 2-4h = TORACOTOMIA.",
     "Pneumotórax aberto: curativo de TRÊS pontas + dreno em outro sítio. Nunca ocluir os 4 lados (vira hipertensivo).",
     "Tórax instável: o problema é a CONTUSÃO pulmonar → analgesia e suporte ventilatório, não fixação de rotina.",
     "Mediastino alargado após desaceleração = suspeite de ruptura de aorta."],
   nucleo:["~85% do trauma torácico se resolve com DRENO de tórax; as letais imediatas são diagnóstico CLÍNICO na avaliação primária.",
     "Pneumotórax HIPERTENSIVO: hipotensão + jugular túrgida + AUSÊNCIA de MV + desvio de traqueia contralateral + timpanismo. NÃO pedir raio-x. Descompressão por agulha no 5º EIC / linha AXILAR MÉDIA (ATLS 11) e depois DRENO.",
     "TAMPONAMENTO: tríade de BECK (hipotensão + jugular túrgida + BULHAS ABAFADAS) + pulso paradoxal; trauma penetrante precordial. FAST confirma; pericardiocentese é PONTE, definitivo é cirúrgico.",
     "Diferença à beira do leito: hipertensivo = sem MV e traqueia desviada · tamponamento = MV normal e bulhas abafadas.",
     "Hemotórax MACIÇO: >1.500 mL imediatos OU >200 mL/h por 2-4h → TORACOTOMIA. Drenar e repor simultaneamente.",
     "Pneumotórax ABERTO: curativo de TRÊS pontas (válvula) + dreno em outro local. Ocluir os 4 lados → vira hipertensivo.",
     "Tórax instável: ≥2 costelas em ≥2 pontos, movimento paradoxal; o que mata é a CONTUSÃO PULMONAR → analgesia + suporte ventilatório (não fixação de rotina).",
     "Também: contusão miocárdica (arritmia), ruptura de aorta (desaceleração + mediastino alargado), ruptura diafragmática (mais à esquerda)."],
   pega:"Pneumotórax hipertensivo é diagnóstico CLÍNICO — esperar o raio-x mata. E não confunda com tamponamento: os dois têm hipotensão e jugular túrgida, mas o hipertensivo NÃO tem murmúrio e desvia a traqueia. Ocluir uma ferida soprante nos 4 lados cria um hipertensivo.",
   mne:"Beck = 3 (hipotensão + jugular + bulhas abafadas). Hipertensivo = sem MV + traqueia desviada → agulha no 5º EIC axilar média. Hemotórax: 1.500 ou 200/h = toracotomia.",
   sus:"Atendimento pré-hospitalar (SAMU) e rede de urgência: a descompressão é procedimento de sala vermelha, sem exame."},

  {id:"cir-abdome-trauma",area:"CIR",nome:"Trauma abdominal",yield:3,
   questoes:["cir_abt_q1","cir_abt_q2","cir_abt_q3","cir_abt_q4"],
   fonte:"ATLS — Advanced Trauma Life Support, 11ª edição; World Society of Emergency Surgery (WSES) — trauma de baço e fígado; Sabiston — Tratado de Cirurgia.",
   aula:["Todo o trauma abdominal cabe em duas perguntas, e respondê-las na ordem certa resolve qualquer questão. Primeira: o mecanismo é CONTUSO ou PENETRANTE? Segunda, e a mais importante: o paciente está ESTÁVEL ou INSTÁVEL? Guarde desde já o princípio que a banca cobra: não é a LESÃO que manda operar — é a INSTABILIDADE. Um baço grau IV em paciente estável pode não ser operado; um grau II em paciente que choca vai para a sala.",
     "No paciente INSTÁVEL, o objetivo é achar rápido de onde vem o sangue, e a ferramenta é o FAST: ultrassonografia à beira do leito, em segundos, procurando líquido livre em quatro janelas — hepatorrenal (espaço de Morrison), esplenorrenal, pélvica e pericárdica. A regra de ouro: FAST POSITIVO em paciente INSTÁVEL = LAPAROTOMIA imediata, sem tomografia, sem mais nada. E o inverso é igualmente importante: FAST NEGATIVO num paciente instável significa que a hemorragia está em OUTRO lugar — procure nos cinco compartimentos clássicos, resumidos como 'no chão e mais quatro': hemorragia externa, tórax, abdome, retroperitônio/pelve e ossos longos.",
     "No paciente ESTÁVEL, o exame de escolha é a TOMOGRAFIA de abdome com contraste: ela estadia a lesão, mostra sangramento ativo e — principalmente — viabiliza o MANEJO NÃO OPERATÓRIO, que é hoje o padrão para trauma de BAÇO e FÍGADO no paciente estável. Trata-se com observação em ambiente monitorado, e a angioembolização entra quando há 'blush' de contraste (extravasamento ativo). Ou seja: a evolução do trauma abdominal foi deixar de operar todo mundo — mas isso só vale enquanto o paciente sustenta a estabilidade.",
     "No trauma PENETRANTE, o agente muda a probabilidade. Ferimento por ARMA DE FOGO em abdome anterior tem alta chance de lesão visceral e vai, na maioria, para laparotomia. Já a ARMA BRANCA permite conduta mais SELETIVA: se o paciente está estável, sem peritonite e sem evisceração, pode-se explorar a ferida localmente e observar. E existem as INDICAÇÕES ABSOLUTAS de laparotomia, que você deve reconhecer de imediato: instabilidade com FAST positivo, sinais de peritonite, evisceração, sangramento pela sonda nasogástrica ou pelo reto, pneumoperitônio no raio-x e empalamento.",
     "Fecham o tema três situações. A FRATURA DE PELVE que sangra: o retroperitônio comporta litros e o paciente sangra sem barriga distendida — a conduta inicial é a CINTA pélvica (fechar o anel), seguida de angioembolização ou packing. A lesão de VÍSCERA OCA: ela não sangra muito, mas contamina — e por isso se manifesta TARDE, com peritonite horas depois, o que a faz escapar da avaliação inicial. E a CIRURGIA DE CONTROLE DE DANOS (damage control), conceito da 11ª edição: no paciente exangue, a cirurgia inicial não é definitiva — controla-se o sangramento e a contaminação, deixa-se o abdome aberto, leva-se o doente para a UTI para corrigir a TRÍADE LETAL (hipotermia, acidose e coagulopatia) e só depois se volta para reconstruir. Operar 'bonito' num paciente que está morrendo é o erro que a filosofia do controle de danos veio corrigir."],
   raciocinio:["Duas perguntas: contuso ou penetrante? ESTÁVEL ou INSTÁVEL? A instabilidade é que manda operar — não o grau da lesão.",
     "INSTÁVEL: faça o FAST. POSITIVO = LAPAROTOMIA imediata (sem TC).",
     "FAST negativo em instável? A hemorragia está em outro lugar: 'no chão e mais quatro' (externa, tórax, abdome, pelve/retroperitônio, ossos longos).",
     "ESTÁVEL: TOMOGRAFIA com contraste → permite MANEJO NÃO OPERATÓRIO de baço e fígado (padrão atual), com angioembolização se houver blush.",
     "Arma de FOGO em abdome anterior: laparotomia na maioria. Arma BRANCA: seletivo, se estável, sem peritonite e sem evisceração.",
     "Indicações ABSOLUTAS de laparotomia: instabilidade com FAST+, peritonite, evisceração, sangue por SNG/reto, pneumoperitônio, empalamento.",
     "Fratura de pelve sangrando: CINTA pélvica → angioembolização/packing.",
     "Paciente exangue: CONTROLE DE DANOS — controlar sangramento/contaminação, abdome aberto, corrigir a tríade letal (hipotermia, acidose, coagulopatia) na UTI e reoperar depois."],
   nucleo:["Duas perguntas: contuso x penetrante; ESTÁVEL x INSTÁVEL. O que indica cirurgia é a INSTABILIDADE, não o grau da lesão.",
     "FAST: 4 janelas (hepatorrenal/Morrison, esplenorrenal, pélvica, pericárdica). FAST POSITIVO + INSTÁVEL = LAPAROTOMIA imediata.",
     "FAST negativo em instável = procurar a hemorragia nos outros compartimentos ('no chão e mais quatro': externa, tórax, abdome, pelve/retroperitônio, ossos longos).",
     "ESTÁVEL: TC com contraste é o exame de escolha e viabiliza o MANEJO NÃO OPERATÓRIO de baço e fígado (padrão atual); angioembolização se blush.",
     "Penetrante: arma de FOGO em abdome anterior → laparotomia na maioria. Arma BRANCA → seletivo se estável, sem peritonite/evisceração.",
     "Laparotomia ABSOLUTA: instabilidade com FAST+, peritonite, evisceração, sangue por SNG/reto, pneumoperitônio, empalamento.",
     "Fratura de pelve: sangra no retroperitônio → cinta pélvica + angioembolização/packing.",
     "Víscera oca: contamina mais do que sangra — apresenta-se TARDE, com peritonite.",
     "Controle de danos (ATLS 11): controlar sangramento e contaminação, abdome aberto, corrigir a TRÍADE LETAL (hipotermia, acidose, coagulopatia) e reoperar depois."],
   pega:"Quem indica a cirurgia é a INSTABILIDADE, não o grau da lesão: baço e fígado em paciente estável têm manejo NÃO operatório. E FAST negativo em paciente instável não tranquiliza — significa que o sangue está em outro compartimento.",
   mne:"Instável + FAST+ = laparotomia. Estável = TC (e talvez não operar). Sangue: 'no chão e mais quatro'. Exangue = controle de danos.",
   sus:"Rede de urgência e regulação para centro de trauma; o FAST está cada vez mais disponível na sala vermelha do SUS."},

  {id:"cir-tce",area:"CIR",nome:"Traumatismo cranioencefálico",yield:3,
   questoes:["cir_tce_q1","cir_tce_q2","cir_tce_q3","cir_tce_q4"],
   fonte:"Diretrizes da Brain Trauma Foundation; ATLS — Advanced Trauma Life Support, 11ª edição; Sociedade Brasileira de Neurocirurgia; regras canadenses e de New Orleans para TC no TCE leve.",
   aula:["O TCE se classifica pela escala de Glasgow: LEVE de 13 a 15, MODERADO de 9 a 12 e GRAVE quando menor ou igual a 8. E dessa classificação sai a primeira conduta automática: Glasgow menor ou igual a 8 = INTUBAR, porque o paciente não protege a via aérea. A 11ª edição do ATLS acrescenta um refinamento: valorize os COMPONENTES da escala (abertura ocular, resposta verbal e motora) e a reatividade PUPILAR, e não apenas o número total — dois pacientes com Glasgow 9 podem ser muito diferentes, e a tendência ao longo do tempo importa mais que a foto isolada.",
     "O conceito que governa todo o tratamento é a distinção entre lesão PRIMÁRIA e SECUNDÁRIA. A lesão primária é o dano do impacto — ela já aconteceu no momento do trauma e nenhum médico pode desfazê-la. A lesão SECUNDÁRIA é tudo o que acontece DEPOIS e piora o cérebro: hipóxia, HIPOTENSÃO, hipercapnia, hipertermia, hipoglicemia e hipertensão intracraniana. E é aqui que está o ponto: o tratamento inteiro do TCE consiste em EVITAR a lesão secundária. Os dois maiores vilões são HIPÓXIA e HIPOTENSÃO — um único episódio de hipotensão praticamente DOBRA a mortalidade no TCE grave. Por isso as metas simples salvam mais que qualquer manobra sofisticada: manter a pressão sistólica adequada (em torno de 110 ou mais) e a saturação acima de 90%.",
     "Os dois hematomas que a prova compara. EPIDURAL (extradural): sangramento ARTERIAL, tipicamente da artéria meníngea média, associado a fratura do osso temporal. Na tomografia é BICONVEXO (lenticular) e NÃO cruza as suturas. O clássico é o INTERVALO LÚCIDO: o paciente perde a consciência, acorda e conversa, e depois deteriora rapidamente. É cirúrgico e tem BOM prognóstico se drenado a tempo — porque o cérebro em si sofreu pouco; o que mata é a compressão. SUBDURAL: sangramento VENOSO das veias-ponte, imagem em CRESCENTE (côncava), que CRUZA as suturas. É comum em idosos e etilistas, porque a atrofia cerebral estica as veias-ponte e um trauma banal já as rompe. O prognóstico é PIOR que o do epidural, porque quase sempre há lesão cerebral associada. E há a forma CRÔNICA: idoso com confusão e declínio progressivo semanas depois de um trauma que ninguém lembra.",
     "HIPERTENSÃO INTRACRANIANA: o crânio é uma caixa rígida (doutrina de Monro-Kellie) — se algo cresce lá dentro, outra coisa precisa sair, e quando os mecanismos se esgotam a pressão dispara. Manifesta-se com cefaleia, vômitos e rebaixamento; e há dois sinais que você não pode perder. A TRÍADE DE CUSHING — HIPERTENSÃO arterial + BRADICARDIA + irregularidade respiratória — é sinal TARDIO e grave (repare que é o oposto do choque, onde a pressão cai e a frequência sobe). E a ANISOCORIA com midríase fixa indica herniação uncal, com compressão do III nervo craniano: emergência absoluta. O manejo: cabeceira elevada a 30°, normocapnia (a hiperventilação só é usada como PONTE curta diante de herniação iminente, porque ela reduz o fluxo cerebral), salina hipertônica ou manitol, sedação e analgesia, controle de temperatura e glicemia, evitar hipotensão a todo custo, tomografia e neurocirurgia.",
     "Fecha o tema quem precisa de TOMOGRAFIA no TCE LEVE — porque a maioria não precisa. Os critérios (regras canadenses/New Orleans) incluem: Glasgow menor que 15 duas horas após o trauma, suspeita de fratura afundada ou de base de crânio, dois ou mais episódios de vômito, idade igual ou superior a 65 anos, uso de anticoagulante ou coagulopatia, e perda de consciência/amnésia com mecanismo perigoso. E a FRATURA DE BASE DE CRÂNIO tem sinais próprios: equimose periorbitária bilateral (sinal do guaxinim), equimose retroauricular (sinal de Battle), hemotímpano e saída de líquor pelo nariz ou ouvido. Diante deles, uma proibição prática que cai muito: NÃO passar sonda NASOgástrica nem sonda nasal — há relato de a sonda atravessar a fratura e entrar no crânio. Use a via oral."],
   raciocinio:["Classifique pela Glasgow: leve 13-15 · moderado 9-12 · grave ≤8. Glasgow ≤8 = INTUBAR.",
     "Lembre do eixo do tratamento: a lesão primária já ocorreu — todo o cuidado é EVITAR a lesão SECUNDÁRIA (hipóxia e HIPOTENSÃO são os maiores vilões).",
     "Metas: PAS adequada (~≥110) e SatO2 ≥90%. Uma hipotensão isolada dobra a mortalidade.",
     "Imagem BICONVEXA que não cruza suturas + intervalo lúcido + fratura temporal = EPIDURAL (arterial, meníngea média) → cirúrgico, bom prognóstico se drenado a tempo.",
     "Imagem em CRESCENTE que cruza suturas, idoso/etilista, trauma leve = SUBDURAL (venoso, veias-ponte) → prognóstico pior.",
     "Hipertensão + BRADICARDIA + respiração irregular = tríade de Cushing (HIC, sinal TARDIO). Anisocoria com midríase fixa = herniação uncal.",
     "Maneje a HIC: cabeceira 30°, normocapnia (hiperventilar só como ponte), salina hipertônica/manitol, sedação, evitar hipotensão, TC e neurocirurgia.",
     "TCE leve: TC se Glasgow <15 após 2h, suspeita de fratura afundada/base, ≥2 vômitos, ≥65 anos, anticoagulado, mecanismo perigoso.",
     "Sinais de fratura de base (guaxinim, Battle, hemotímpano, fístula liquórica): NUNCA sonda nasogástrica — use a via ORAL."],
   nucleo:["Glasgow: leve 13-15 · moderado 9-12 · grave ≤8. Glasgow ≤8 = INTUBAR. ATLS 11 valoriza COMPONENTES e pupilas, não só o total.",
     "Lesão PRIMÁRIA (já ocorreu) x SECUNDÁRIA (hipóxia, HIPOTENSÃO, hipercapnia, hipertermia, hipoglicemia, HIC). Todo o tratamento é evitar a secundária.",
     "Hipóxia e hipotensão são os maiores vilões: uma hipotensão DOBRA a mortalidade. Metas: PAS ~≥110 e SatO2 ≥90%.",
     "EPIDURAL: arterial (meníngea média), fratura temporal, BICONVEXO, NÃO cruza suturas, INTERVALO LÚCIDO. Cirúrgico, BOM prognóstico.",
     "SUBDURAL: venoso (veias-ponte), CRESCENTE, CRUZA suturas, idoso/etilista com trauma leve. Prognóstico PIOR (lesão cerebral associada). Forma crônica: confusão progressiva semanas após.",
     "HIC (Monro-Kellie): tríade de CUSHING = hipertensão + BRADICARDIA + respiração irregular (sinal TARDIO). Anisocoria/midríase fixa = herniação uncal.",
     "Manejo da HIC: cabeceira 30°, normocapnia (hiperventilação só como ponte), salina hipertônica/manitol, sedação/analgesia, evitar hipotensão, TC + neurocirurgia.",
     "TC no TCE leve: Glasgow <15 após 2h, fratura afundada/base, ≥2 vômitos, ≥65 anos, anticoagulante/coagulopatia, mecanismo perigoso.",
     "Fratura de base: guaxinim, Battle, hemotímpano, fístula liquórica → PROIBIDA a sonda nasogástrica (usar via oral)."],
   pega:"A tríade de Cushing é hipertensão + BRADICARDIA (o oposto do choque) e é sinal TARDIO. Epidural cruza? NÃO — é biconvexo e não cruza suturas; o subdural é em crescente e cruza. E com sinais de fratura de base, nada de sonda nasogástrica.",
   mne:"EpiDural = lente biconvexa, artéria, intervalo lúcido, bom prognóstico. SubDural = crescente, veia, idoso, pior. Cushing = pressão sobe, pulso desce.",
   sus:"Rede de urgência e regulação neurocirúrgica; prevenção (capacete, cinto, álcool ao volante) é política de saúde pública."},

  {id:"cir-colorretal",area:"CIR",nome:"Doença diverticular e câncer colorretal",yield:2,
   questoes:["cir_colo_q1","cir_colo_q2","cir_colo_q3","cir_colo_q4"],
   fonte:"Diretrizes da Sociedade Brasileira de Coloproctologia; World Society of Emergency Surgery (WSES) — diverticulite aguda; classificação de Hinchey; INCA/Ministério da Saúde — rastreamento do câncer colorretal.",
   aula:["Divertículos são herniações da mucosa através de pontos frágeis da parede intestinal, favorecidas pela idade e pela dieta pobre em fibras; no Ocidente concentram-se no SIGMOIDE. Distinga os dois termos: DIVERTICULOSE é apenas a presença dos divertículos — assintomática, achado de colonoscopia. DIVERTICULITE é a inflamação/microperfuração de um deles. E o quadro clínico tem um apelido que ajuda: é a 'apendicite do lado esquerdo' — dor em fossa ilíaca ESQUERDA, febre, leucocitose e alteração do hábito intestinal, num paciente em geral mais velho.",
     "O exame de escolha é a TOMOGRAFIA de abdome com contraste, que confirma e — mais importante — mostra se há complicação. E há uma proibição que cai direto: NÃO se faz colonoscopia na fase AGUDA, pelo risco de perfurar um cólon inflamado. A colonoscopia vem DEPOIS, em 6 a 8 semanas, e ela é obrigatória por um motivo: descartar que aquilo que pareceu diverticulite fosse, na verdade, um câncer de cólon.",
     "A classificação de HINCHEY organiza a gravidade e a conduta: I = abscesso pericólico; II = abscesso pélvico ou à distância; III = peritonite PURULENTA generalizada; IV = peritonite FECAL. A conduta acompanha. Diverticulite NÃO complicada (sem abscesso nem perfuração): tratamento clínico — e aqui houve uma mudança que a prova já cobra: em pacientes selecionados (imunocompetentes, sem comorbidade relevante, tolerando via oral e com bom suporte), o manejo pode ser AMBULATORIAL e, na doença não complicada, há tendência crescente a NÃO usar antibiótico de rotina. Abscesso maior que 4-5 cm: drenagem PERCUTÂNEA guiada por imagem. Hinchey III e IV (peritonite): CIRURGIA — clássica cirurgia de Hartmann (ressecção com colostomia) ou ressecção com anastomose primária conforme as condições.",
     "O CÂNCER COLORRETAL é o terceiro mais incidente no Brasil, e seu comportamento clínico depende do LADO — este é o ponto que a banca adora. Cólon DIREITO: o lúmen é largo e as fezes ainda são líquidas, então o tumor cresce sem obstruir e se manifesta por SANGRAMENTO OCULTO, levando a ANEMIA FERROPRIVA, perda de peso e às vezes massa palpável. Cólon ESQUERDO e reto: lúmen estreito, fezes já sólidas — daí alteração do hábito intestinal, fezes em fita, hematoquezia e OBSTRUÇÃO. Amarre isso com um assunto que você já viu: homem adulto ou mulher pós-menopausa com anemia ferropriva = colonoscopia, porque pode ser um tumor de cólon direito sangrando em silêncio. Os fatores de risco: idade, dieta rica em carne processada e pobre em fibras, obesidade, tabagismo, álcool, história familiar, doença inflamatória intestinal e as síndromes hereditárias (Lynch, polipose adenomatosa familiar).",
     "O RASTREAMENTO fecha o tema, e é onde ele encontra a atenção primária. Para risco médio, o INCA/Ministério da Saúde recomenda rastrear a partir dos 50 ANOS, indo até cerca de 75, com pesquisa de SANGUE OCULTO nas fezes (anual ou bienal) e colonoscopia caso o resultado seja positivo; a colonoscopia a cada 10 anos é o padrão-ouro onde há disponibilidade. Note que sociedades internacionais vêm antecipando o início para os 45 anos, pelo aumento da incidência em jovens — divergência que pode aparecer na prova. Já quem tem alto risco (história familiar de primeiro grau, síndromes hereditárias, DII) rastreia mais cedo e com intervalos menores. E a pegadinha final, elegante: rastreamento é para ASSINTOMÁTICO. Paciente COM sintomas (sangramento, anemia, mudança de hábito) não 'rastreia' — ele INVESTIGA, e vai direto para a colonoscopia, independentemente da idade."],
   raciocinio:["Dor em fossa ilíaca ESQUERDA + febre + leucocitose no adulto mais velho = diverticulite ('apendicite da esquerda').",
     "Confirme com TC de abdome com contraste. NÃO faça colonoscopia na fase aguda (risco de perfuração) — faça em 6-8 semanas para excluir neoplasia.",
     "Classifique (Hinchey): I abscesso pericólico · II abscesso pélvico/à distância · III peritonite purulenta · IV peritonite fecal.",
     "Não complicada: tratamento clínico; em selecionados, ambulatorial e até sem antibiótico. Abscesso >4-5 cm: drenagem percutânea. Hinchey III/IV: cirurgia (Hartmann ou ressecção com anastomose).",
     "Câncer pelo LADO: direito = sangramento oculto → ANEMIA FERROPRIVA, massa. Esquerdo/reto = alteração do hábito, fezes em fita, hematoquezia, OBSTRUÇÃO.",
     "Anemia ferropriva em homem/pós-menopausa = colonoscopia (pode ser tumor de cólon direito).",
     "Rastreio (risco médio): a partir dos 50 anos (INCA/MS) até ~75 — sangue oculto nas fezes, colonoscopia se positivo; colonoscopia a cada 10 anos onde disponível. Alto risco: mais cedo e mais frequente.",
     "Paciente SINTOMÁTICO não rastreia — investiga com colonoscopia, em qualquer idade."],
   nucleo:["Diverticulose = divertículos assintomáticos. Diverticulite = inflamação/perfuração; dor em FID ESQUERDA + febre + leucocitose ('apendicite do lado esquerdo'), sigmoide.",
     "Exame de escolha: TC de abdome com contraste. Colonoscopia é PROIBIDA na fase aguda; faz-se em 6-8 semanas para excluir câncer.",
     "HINCHEY: I abscesso pericólico · II abscesso pélvico/à distância · III peritonite PURULENTA · IV peritonite FECAL.",
     "Não complicada: clínico; em selecionados, ambulatorial e tendência a NÃO usar antibiótico. Abscesso >4-5 cm: drenagem percutânea. III/IV: cirurgia (Hartmann ou ressecção com anastomose).",
     "Câncer colorretal: 3º mais incidente no Brasil. DIREITO = lúmen largo, fezes líquidas → sangramento oculto, ANEMIA FERROPRIVA, massa. ESQUERDO/reto = lúmen estreito, fezes sólidas → alteração do hábito, fezes em fita, hematoquezia, OBSTRUÇÃO.",
     "Anemia ferropriva em homem/mulher pós-menopausa → colonoscopia.",
     "Rastreio risco médio (INCA/MS): 50 a ~75 anos — sangue oculto nas fezes (anual/bienal) + colonoscopia se positivo; colonoscopia a cada 10 anos onde disponível. Sociedades internacionais antecipam para 45 anos.",
     "Rastreamento é para ASSINTOMÁTICO: paciente com sintomas investiga direto com colonoscopia, em qualquer idade."],
   pega:"Colonoscopia NÃO se faz na diverticulite aguda (perfura) — mas é obrigatória em 6-8 semanas, para não deixar passar um câncer. E rastreamento é para assintomático: quem tem sangramento ou anemia vai direto para a colonoscopia, independentemente da idade.",
   mne:"Diverticulite = apendicite da ESQUERDA → TC (nunca colono na aguda). Hinchey III/IV = cirurgia. Cólon Direito = anemia (Discreto/oculto). Esquerdo = obstrução.",
   sus:"Rastreio do câncer colorretal por sangue oculto na APS a partir dos 50 anos; a fila de colonoscopia é gargalo conhecido do SUS."},
  {id:"go-prenatal",area:"GO",nome:"Pré-natal e rastreios",yield:3,
   questoes:["go_prenatal_q1","go_prenatal_q2","go_prenatal_q3","go_prenatal_q4"],
   fonte:"Protocolo de DMG (Ministério da Saúde/OPAS/FEBRASGO); Diretriz da Sociedade Brasileira de Diabetes 2025 – rastreamento da hiperglicemia na gestação; Caderneta da Gestante (MS).",
   aula:["O pré-natal existe para transformar uma gestação num processo vigiado, pegando cedo os problemas que ameaçam mãe e bebê. A maioria das gestantes é de baixo risco e é acompanhada na atenção primária, com um número mínimo de consultas e uma bateria de exames distribuída pelos trimestres. Saber esse roteiro é o que a banca cobra, porque é a rotina do SUS.","Logo no início entram a suplementação e as sorologias. Ácido fólico (idealmente antes de engravidar e no 1º trimestre) previne defeitos do tubo neural; ferro previne anemia. As sorologias de rotina (sífilis/VDRL, HIV, hepatite B, toxoplasmose) rastreiam infecções que podem ser transmitidas ao bebê — muitas com tratamento que muda o desfecho, como a penicilina na sífilis.","O rastreamento do diabetes gestacional (DMG) é um clássico de prova e tem uma lógica de dois tempos. No 1º trimestre pede-se a glicemia de jejum: se vier ≥126, já é diabetes prévio; se vier entre 92 e 125, é DMG; se estiver normal (<92), o rastreamento se completa mais tarde. Entre 24 e 28 semanas faz-se o TOTG com 75g de glicose, medindo três pontos: jejum, 1 hora e 2 horas. Os cortes para DMG são 92 (jejum), 180 (1h) e 153 (2h) mg/dL — e basta UM valor alterado para fechar o diagnóstico. Ou seja: jejum normal no início NÃO encerra o assunto — falta o TOTG no 24-28. (Onde não há TOTG disponível, o MS aceita repetir a glicemia de jejum entre 24-28 semanas.)","A imunização na gestação também cai muito. As recomendadas incluem dTpa (protege o recém-nascido contra coqueluche, dada a cada gestação), influenza e hepatite B. Vacinas de vírus vivo (como tríplice viral e febre amarela) são, em regra, evitadas na gestação. Fechar o pré-natal é somar: consultas regulares + exames por trimestre + suplementação + sorologias + rastreio de DMG (jejum e TOTG) + vacinas."],
   raciocinio:["Confirme a gestação e classifique o risco: baixo risco fica na APS.","Inicie suplementação (ácido fólico, ferro) e solicite as sorologias de rotina.","DMG: peça glicemia de jejum no 1º tri. ≥126 = diabetes prévio; 92-125 = DMG; <92 = normal, siga para o TOTG.","Entre 24 e 28 semanas: TOTG 75g para flagrar o DMG tardio.","Atualize as vacinas indicadas (dTpa, influenza, hepB); evite vírus vivo."],
   nucleo:["Baixo risco é acompanhado na APS; roteiro de consultas e exames por trimestre.","DMG: jejum no 1º tri (≥126 prévio; 92-125 DMG; <92 normal); TOTG 75g em 24-28 sem (cortes 92/180/153; 1 valor já fecha).","Suplementação: ácido fólico e ferro. Sorologias: sífilis, HIV, hepB, toxo.","Vacinas: dTpa (cada gestação), influenza, hepB; evitar vírus vivo."],
   pega:"Jejum normal no 1º trimestre NÃO encerra o rastreio de DMG — falta o TOTG 75g entre 24 e 28 semanas. Jejum ≥126 já é diabetes prévio.",mne:"DMG: jejum cedo, TOTG no 24-28.",sus:"Pré-natal de baixo risco é atribuição da APS (protocolo do MS)."},
  {id:"go-hemorragias",area:"GO",nome:"Hemorragias da gestação",yield:3,
   questoes:["go_hemorragias_q1","go_hemorragias_q2","go_hemorragias_q3","go_hemorragias_q4"],
   fonte:"Manual de Gestação de Alto Risco (Ministério da Saúde); Tratado de Obstetrícia (FEBRASGO); protocolos de sangramento na gestação.",
   aula:["Sangramento na gestação assusta, mas o raciocínio fica simples quando você separa por METADE da gravidez. Na primeira metade (até ~20 semanas), as causas principais são abortamento, gestação ectópica e doença trofoblástica (mola). Na segunda metade, o duelo clássico é entre descolamento prematuro de placenta (DPP) e placenta prévia (PP) — e distinguir os dois é a questão que mais cai.","O DPP é a placenta que se solta antes da hora. A cara: dor abdominal + útero HIPERTÔNICO (duro, contraído) + sangramento geralmente escuro + sinais de sofrimento fetal. Frequentemente há um fator de risco: hipertensão, trauma, uso de cocaína. É uma emergência — o bebê está perdendo oxigênio.","A placenta prévia é a placenta implantada sobre o colo. A cara é oposta: sangramento VIVO (vermelho vivo), em geral INDOLOR, sem hipertonia, muitas vezes de repetição. A regra de segurança absoluta: na suspeita de placenta prévia, NÃO se faz toque vaginal antes do ultrassom — o toque pode provocar hemorragia maciça.","Na primeira metade, dois cuidados de prova: gestação ectópica (dor pélvica + atraso menstrual + beta-hCG positivo) confirma-se com beta-hCG seriado + ultrassom transvaginal, e é causa de abdome agudo hemorrágico se romper. Resumo mnemônico: PP = sangue vivo e sem dor; DPP = dor e útero duro. E nunca tocar antes do US na suspeita de PP."],
   raciocinio:["Separe pela metade da gestação: 1ª metade (aborto, ectópica, mola) x 2ª metade (DPP x PP).","Dor + útero hipertônico + sangue escuro + sofrimento fetal + fator de risco = DPP (emergência).","Sangue vivo, indolor, sem hipertonia, de repetição = placenta prévia.","Suspeita de PP: NÃO fazer toque vaginal antes do ultrassom.","Dor pélvica + atraso + beta-hCG positivo = investigar ectópica (beta seriado + US transvaginal)."],
   nucleo:["1ª metade: abortamento, ectópica, mola. 2ª metade: DPP x placenta prévia.","DPP: dor + hipertonia uterina + sangue escuro + sofrimento fetal.","PP: sangramento vivo, indolor, de repetição; não tocar antes do US.","Ectópica: beta-hCG + US transvaginal."],
   pega:"Na suspeita de placenta prévia, NUNCA fazer toque vaginal antes do ultrassom (risco de hemorragia maciça).",mne:"PP = sangue vivo, sem dor. DPP = dor + útero duro.",sus:"Identificação e referência rápida ao pré-natal de alto risco."},
  {id:"go-hpp",area:"GO",nome:"Hemorragia pós-parto",yield:3,
   questoes:["go_hpp_q1","go_hpp_q2","go_hpp_q3","go_hpp_q4"],
   fonte:"Zero Morte Materna por Hemorragia (OPAS/OMS); Diretrizes de manejo da HPP (Ministério da Saúde/FEBRASGO); protocolos estaduais de HPP.",
   aula:["Hemorragia pós-parto (HPP) é uma das principais causas de morte materna e, felizmente, muito evitável quando se age rápido e na ordem certa. Para não travar na hora, memorize as causas pelos '4 Ts': Tônus (útero que não contrai — atonia), Trauma (lacerações do canal), Tecido (restos placentários retidos) e Trombina (distúrbios de coagulação). Cada T tem uma conduta, mas um deles domina as estatísticas.","A atonia uterina é a causa nº 1 de HPP. Depois do parto, o útero precisa contrair firmemente para 'estrangular' os vasos que irrigavam a placenta — é essa contração que estanca o sangramento. Quando o útero fica amolecido e mal contraído (atônico), esses vasos continuam abertos e a paciente sangra muito. No exame, o sinal é clássico: útero amolecido e acima da cicatriz umbilical, com sangramento abundante.","Diante de HPP por atonia, a conduta é escalonada e começa simples: massagem uterina bimanual (manobra de Hamilton, que estimula a contração) somada a uterotônicos, sendo a OCITOCINA a primeira escolha. Junto, e precocemente (na chamada hora de ouro, a 1ª hora), administra-se o ÁCIDO TRANEXÂMICO 1 g EV, que reduz a mortalidade por sangramento e pode ser repetido após 30 minutos. Se a ocitocina não resolve, escalona-se para outros uterotônicos: derivados do ergot (metilergometrina — CONTRAINDICADA na hipertensão/pré-eclâmpsia) e o misoprostol. Persistindo, parte-se para balão intrauterino de tamponamento, suturas/ligaduras cirúrgicas e, como último recurso, a histerectomia. O erro comum é pular a etapa inicial — massagem + ocitocina (+ tranexâmico) resolvem a maioria.","A prevenção é tão importante quanto o tratamento: o manejo ativo do terceiro período do parto (ocitocina profilática logo após a saída do bebê, tração controlada do cordão) reduz muito a HPP. Na prova, o raciocínio é: sangramento pós-parto + útero amolecido = atonia; primeira medida = massagem + ocitocina. E sempre começar investigando o T mais provável (tônus) antes de pensar em laceração ou retenção."],
   raciocinio:["Diante de sangramento pós-parto, pense nos 4 Ts: Tônus, Trauma, Tecido, Trombina.","Examine o útero: amolecido e alto = atonia (o T mais comum).","Comece pelo básico: massagem uterina bimanual + ocitocina + ácido tranexâmico 1g EV precoce (hora de ouro).","Não resolveu? Escalone: outros uterotônicos → balão → cirurgia.","Lembre da prevenção: manejo ativo do 3º período (ocitocina profilática)."],
   nucleo:["Causas de HPP = 4 Ts: Tônus (atonia), Trauma, Tecido, Trombina.","Atonia é a 1ª causa; sinal: útero amolecido e acima da cicatriz umbilical.","Inicial: massagem bimanual + ocitocina + ácido tranexâmico 1g EV precoce. Escalona: ergot (não na HAS) → misoprostol → balão → cirurgia.","Prevenção: manejo ativo do 3º período (ocitocina profilática)."],
   pega:"Comece sempre pela atonia (útero amolecido) — massagem + ocitocina — antes de investigar laceração ou retenção.",mne:"HPP = os 4 Ts. Atonia primeiro.",sus:"Protocolo de HPP e 'kit hemorragia' nas maternidades do SUS."},
  {id:"go-rastreio",area:"GO",nome:"Rastreio CA colo e mama",yield:2,
   questoes:["go_rastreio_q1","go_rastreio_q2","go_rastreio_q3","go_rastreio_q4"],
   fonte:"Diretrizes Brasileiras para o Rastreamento do Câncer do Colo do Útero – Parte I (Portaria SAES/SECTICS nº 13, de 29/07/2025, MS/INCA); Rastreamento de câncer de mama – Nota Técnica MS/INCA (2025).",
   aula:["O rastreamento busca a doença em pessoas SEM sintomas, na faixa etária e no intervalo em que comprovadamente reduz mortalidade. Fazer certo é tão importante quanto não fazer errado: rastrear fora da faixa ou com intervalo errado gera dano (sobrediagnóstico, exames e tratamentos desnecessários). Por isso os números caem literalmente na prova — e mudaram recentemente, então atenção às diretrizes vigentes.",
     "Câncer de colo do útero — MUDANÇA IMPORTANTE (Diretriz MS 2025). O método primário passou a ser o TESTE DE DNA-HPV oncogênico (não mais a citologia), na faixa dos 25 aos 64 anos. Após um teste NEGATIVO, o intervalo é de 5 anos (a maior sensibilidade do teste permite espaçar com segurança). Não se rastreia antes dos 25 anos, pois nessa idade predominam infecções transitórias e lesões que regridem — rastrear cedo causa mais dano que benefício. O rastreamento se encerra quando o último teste, feito acima dos 60 anos, é negativo.",
     "Ainda no colo, o que fazer com o teste POSITIVO (noção geral): se vier HPV 16 ou 18 (os mais oncogênicos), encaminha-se direto para colposcopia. Se vier outro tipo oncogênico (diferente de 16/18), faz-se a citologia reflexa na mesma amostra — se ela vier alterada, colposcopia; se normal, repete-se o teste em 1 ano. Importante para a transição: onde o teste de DNA-HPV ainda NÃO está disponível, mantém-se o rastreamento pela CITOLOGIA (Papanicolau) a cada 3 anos, após dois exames anuais consecutivos normais. Ou seja, as duas realidades convivem hoje conforme a região.",
     "Câncer de mama. O rastreamento populacional é a MAMOGRAFIA a cada 2 anos (bienal). A faixa etária clássica do INCA é 50 a 69 anos; em 2025 o Ministério da Saúde ampliou o rastreamento organizado para 50 a 74 anos. Para mulheres de 40 a 49 anos, a mamografia pode ser feita por demanda/decisão médica após esclarecer riscos e benefícios — não é rastreamento populacional de rotina. Fora dessas faixas, o rastreamento populacional não é recomendado. (Sociedades como FEBRASGO/SBM defendem início aos 40 anualmente — é a divergência que pode aparecer na prova.)",
     "O raciocínio-chave: memorize as faixas e intervalos ATUAIS e desconfie de alternativas que rastreiam em EXCESSO (citológico anual para sempre, mamografia anual dos 40 aos 70 sem indicação, rastrear colo aos 20 anos). E lembre da transição do colo: DNA-HPV a cada 5 anos onde disponível; citologia trienal onde ainda não chegou. A banca cobra tanto o número certo quanto o reconhecimento do excesso como erro."],
   raciocinio:["Rastreamento é para assintomáticos, na faixa e intervalo que reduzem mortalidade.",
     "Colo (diretriz 2025): DNA-HPV oncogênico, 25 a 64 anos, a cada 5 anos após teste negativo.",
     "Onde o DNA-HPV ainda não chegou: citologia a cada 3 anos após 2 anuais normais (transição).",
     "Não iniciar rastreio de colo antes dos 25 anos.",
     "Mama: mamografia bienal; 50-69 (INCA) / ampliada para 50-74 (MS 2025); 40-49 por decisão médica.",
     "Desconfie de alternativas que rastreiam em excesso (fora da faixa/intervalo)."],
   nucleo:["Colo (MS 2025): teste de DNA-HPV oncogênico, 25-64 anos, a cada 5 anos se negativo.",
     "Transição: onde não há DNA-HPV, mantém citologia trienal após 2 anuais normais.",
     "HPV 16/18 → colposcopia direta; outros tipos → citologia reflexa.",
     "Mama: mamografia bienal, 50-69 (INCA) / 50-74 (MS 2025); 40-49 por decisão médica.",
     "Não rastrear fora da faixa/intervalo."],
   pega:"O colo mudou: DNA-HPV a cada 5 anos (25-64), não mais citologia trienal como padrão — mas a citologia trienal segue valendo onde o teste molecular ainda não chegou. Não iniciar antes dos 25.",
   mne:"Colo: DNA-HPV 25-64 / 5 anos. Mama: mamografia 50-69(74) / 2 anos.",
   sus:"Rastreamento organizado no SUS (INCA); transição do Papanicolau para DNA-HPV em curso desde 2025."},
  {id:"go-preeclampsia",area:"GO",nome:"Síndromes hipertensivas da gestação",yield:3,
   questoes:["go_pe_q1","go_pe_q2","go_pe_q3","go_pe_q4"],
   fonte:"Manual de Gestação de Alto Risco (Ministério da Saúde, 2022 e atualizações); Protocolo de Pré-eclâmpsia (FEBRASGO); Recomendações da OMS/OPAS para uso do sulfato de magnésio; Diretriz ACOG de Hipertensão na Gestação (Practice Bulletin).",
   aula:["As síndromes hipertensivas são a principal causa de morte materna no Brasil — e quase toda morte por elas é evitável. Antes de qualquer conduta, é preciso classificar, e o divisor de águas é a marca das 20 SEMANAS. São quatro categorias. HIPERTENSÃO CRÔNICA: já existia antes da gestação ou aparece ANTES de 20 semanas. HIPERTENSÃO GESTACIONAL: surge APÓS 20 semanas, isolada, sem proteinúria e sem lesão de órgão. PRÉ-ECLÂMPSIA: surge após 20 semanas com proteinúria ou disfunção de órgão-alvo. PRÉ-ECLÂMPSIA SOBREPOSTA: a hipertensa crônica que piora e desenvolve pré-eclâmpsia. Antes de 20 semanas com pressão alta = crônica; depois de 20 = gestacional ou pré-eclâmpsia, conforme haja ou não repercussão.",
     "A definição de pré-eclâmpsia mudou, e a banca cobra a mudança: a PROTEINÚRIA NÃO É MAIS OBRIGATÓRIA. Fecha-se pré-eclâmpsia com PA ≥ 140/90 mmHg após 20 semanas MAIS um dos dois: (a) proteinúria — ≥ 300 mg em 24h, ou relação proteína/creatinina urinária ≥ 0,3, ou fita reagente 1+; OU (b), na AUSÊNCIA de proteinúria, disfunção de órgão-alvo: plaquetas < 100.000, creatinina > 1,1 mg/dL (ou o dobro do basal), transaminases o dobro do normal, edema agudo de pulmão, ou sintomas cerebrais/visuais. Por trás disso há uma doença da PLACENTA: a invasão trofoblástica falha, a placenta isquêmica libera fatores que agridem o endotélio da mãe inteira — por isso a doença bate no rim, no fígado, no cérebro e no pulmão, e não só na pressão.",
     "Reconhecer GRAVIDADE é o que define o ritmo. São sinais de gravidade: PA sistólica ≥ 160 ou diastólica ≥ 110; cefaleia persistente que não cede; escotomas, turvação visual ou fotofobia; dor epigástrica ou em hipocôndrio direito (fígado distendido — sinal traiçoeiro, frequentemente confundido com gastrite); plaquetopenia; alteração de função renal ou hepática; e edema agudo de pulmão. Duas complicações fecham o quadro: a síndrome HELLP (Hemólise + Elevação de enzimas hepáticas + Low Platelets — plaquetopenia), que pode ocorrer até sem hipertensão exuberante; e a ECLÂMPSIA, que é a convulsão tônico-clônica na pré-eclâmpsia, sem outra causa.",
     "Agora o núcleo absoluto da prova: são DOIS eixos de tratamento que NUNCA se confundem. (1) SULFATO DE MAGNÉSIO — serve para PREVENIR e TRATAR a convulsão. Ele NÃO é anti-hipertensivo e não baixa a pressão; quem marca 'sulfato para controlar a PA' erra. Esquemas: Pritchard (4 g EV de ataque + 10 g IM, manutenção 5 g IM de 4/4h) ou Zuspan (4 g EV de ataque + 1 a 2 g/h EV em bomba). Monitorização obrigatória do risco de intoxicação, pelo tripé: reflexo patelar PRESENTE, frequência respiratória ≥ 16 irpm e diurese ≥ 25-30 mL/h. Antídoto: GLUCONATO DE CÁLCIO 10% EV. (2) ANTI-HIPERTENSIVO — para a emergência (PA ≥ 160/110), usa-se hidralazina, nifedipino ou labetalol, com redução CONTROLADA (baixar demais reduz a perfusão placentária). Para manutenção: metildopa, nifedipino. E o que jamais se prescreve na gestante: IECA e BRA, que são fetotóxicos.",
     "O tratamento DEFINITIVO da pré-eclâmpsia é o PARTO — retirar a placenta é curar a doença. A decisão do momento equilibra mãe e prematuridade: gestação a termo (≥ 37 semanas) com pré-eclâmpsia = parto; com sinais de GRAVIDADE a partir de 34 semanas = parto; abaixo de 34 semanas, tenta-se conduta expectante em centro terciário, com corticoide para maturação pulmonar fetal, desde que mãe e feto permitam. Eclâmpsia, HELLP ou descontrole materno = interromper, mas ESTABILIZANDO A MÃE PRIMEIRO — não se corre para a cesárea com a paciente convulsionando: sulfato, via aérea, controle pressório, depois o parto. Outra pegadinha: pré-eclâmpsia NÃO é indicação automática de cesárea; a via é obstétrica. Por fim, a PREVENÇÃO, que cai muito: AAS em dose baixa (100 mg/dia, faixa 75-150) iniciado entre 12 e 16 semanas nas gestantes de alto risco, associado a suplementação de cálcio onde a ingesta é baixa — realidade da maioria da população brasileira."],
   raciocinio:["Marque as 20 semanas: PA alta ANTES = hipertensão crônica; DEPOIS = gestacional ou pré-eclâmpsia.",
     "Pré-eclâmpsia = PA ≥140/90 após 20 sem + proteinúria OU disfunção de órgão-alvo (proteinúria não é obrigatória).",
     "Procure sinais de gravidade: PA ≥160/110, cefaleia, escotomas, dor epigástrica, plaquetopenia, edema pulmonar.",
     "Convulsão = eclâmpsia → SULFATO DE MAGNÉSIO (não é anti-hipertensivo). Monitore reflexo patelar, FR ≥16 e diurese; antídoto = gluconato de cálcio.",
     "PA ≥160/110 → anti-hipertensivo de emergência (hidralazina/nifedipino/labetalol), redução controlada. Nunca IECA/BRA.",
     "Defina o parto: ≥37 sem = parto; grave ≥34 sem = parto; <34 sem = expectante + corticoide em centro terciário.",
     "Estabilize a mãe ANTES de interromper. E lembre da prevenção: AAS 100 mg a partir de 12-16 sem no alto risco + cálcio."],
   nucleo:["Classificação pelas 20 semanas: crônica (antes) x gestacional/pré-eclâmpsia (depois) x sobreposta.",
     "Pré-eclâmpsia: PA ≥140/90 após 20 sem + proteinúria (≥300mg/24h, P/C ≥0,3 ou fita 1+) OU disfunção de órgão-alvo. Proteinúria NÃO é obrigatória.",
     "Gravidade: PA ≥160/110, cefaleia, escotomas, dor epigástrica, plaquetopenia, alteração renal/hepática, edema pulmonar. HELLP = hemólise + enzimas + plaquetopenia.",
     "Sulfato de magnésio = anticonvulsivante (Pritchard ou Zuspan). Controle: reflexo patelar, FR ≥16, diurese ≥25-30 mL/h. Antídoto: gluconato de cálcio 10%.",
     "Anti-hipertensivo na emergência: hidralazina, nifedipino, labetalol. Manutenção: metildopa/nifedipino. IECA e BRA são PROIBIDOS.",
     "Tratamento definitivo = PARTO. ≥37 sem parto; grave ≥34 parto; <34 expectante + corticoide. Estabilizar a mãe antes.",
     "Prevenção: AAS 100 mg/dia a partir de 12-16 semanas no alto risco + cálcio."],
   pega:"Sulfato de magnésio NÃO baixa a pressão — ele previne/trata a convulsão. São dois eixos separados. E pré-eclâmpsia não é indicação automática de cesárea; a via é obstétrica.",
   mne:"HELLP = Hemólise + Enzimas (Elevadas) + Low Platelets. Intoxicação pelo sulfato: perdeu o reflexo patelar → gluconato de cálcio.",
   sus:"Principal causa de morte materna evitável; pré-natal de alto risco, sulfato disponível na maternidade e AAS profilático na APS."},

  {id:"go-partograma",area:"GO",nome:"Trabalho de parto e partograma",yield:3,
   questoes:["go_parto_q1","go_parto_q2","go_parto_q3","go_parto_q4"],
   fonte:"Diretrizes Nacionais de Assistência ao Parto Normal (Ministério da Saúde/Conitec, versão 2022); Recomendações da OMS para os cuidados intraparto para uma experiência positiva de parto (2018); Lei 11.108/2005 (acompanhante); Tratado de Obstetrícia (FEBRASGO).",
   aula:["O trabalho de parto se divide em quatro períodos: DILATAÇÃO (1º), EXPULSIVO (2º, da dilatação total ao nascimento), DEQUITAÇÃO (3º, saída da placenta) e o 4º período (Greenberg, a primeira hora após, quando se vigia a hemorragia). O primeiro período se subdivide em fase LATENTE (contrações irregulares, dilatação lenta) e fase ATIVA. E aqui está a atualização que a prova cobra: a fase ativa hoje é considerada a partir de 5 a 6 cm de dilatação — não mais dos 4 cm. Mais importante: a velha curva de Friedman, que exigia 1 cm por hora, foi SUPERADA. Sabe-se que o parto normal progride mais devagar do que se pensava, e uma dilatação lenta, com mãe e bebê bem, é normal e NÃO autoriza diagnosticar 'parada de progressão' nem indicar cesárea. Boa parte das cesáreas desnecessárias no Brasil nasceu de aplicar Friedman ao pé da letra.",
     "O mecanismo do parto é a sequência de movimentos que o feto executa para atravessar a bacia: insinuação, descida, flexão, rotação interna, desprendimento (deflexão), rotação externa e desprendimento dos ombros. A altura da apresentação é medida pelos PLANOS DE DeLEE, tendo como referência as espinhas isquiáticas — que são o plano ZERO. Acima delas, valores negativos (-1, -2, -3); abaixo, positivos (+1, +2, +3), com o polo já descendo para a saída. Junto se avalia a variedade de posição (ex.: occípito-esquerda-anterior), que diz para onde aponta a nuca do bebê.",
     "O PARTOGRAMA é o registro gráfico do trabalho de parto: dilatação, descida da apresentação, contrações, batimentos cardíacos fetais, aspecto do líquido amniótico e as intervenções. Ele tem uma LINHA DE ALERTA e, quatro horas à direita dela, uma LINHA DE AÇÃO. Cruzar a linha de alerta significa que a progressão está mais lenta que o esperado e pede reavaliação; cruzar a linha de ação exige decisão. O valor do partograma é ser um instrumento visual que evita tanto a intervenção precipitada quanto a demora perigosa. Vale saber que a OMS, em 2018, passou a questionar o partograma clássico com linha de ação rígida e propôs um novo instrumento (Labour Care Guide) — mas as diretrizes brasileiras seguem trabalhando com o partograma, então é ele que você responde na prova.",
     "As BOAS PRÁTICAS são o coração da questão de parto no ENAMED, porque a diretriz brasileira é explicitamente humanizadora. O que se DEVE fazer: garantir ACOMPANHANTE de livre escolha da mulher (é direito garantido pela Lei 11.108/2005 — negar é ilegal); permitir liberdade de POSIÇÃO e deambulação; oferecer métodos não farmacológicos de alívio da dor (banho, bola, massagem, deambulação); estimular a ingesta de líquidos; fazer o CONTATO PELE A PELE imediato; realizar o clampeamento OPORTUNO/tardio do cordão (em torno de 1 a 3 minutos, quando o bebê nasce bem — melhora as reservas de ferro); e apoiar o aleitamento na PRIMEIRA HORA de vida.",
     "E o que NÃO se faz de rotina — a lista de onde saem as alternativas erradas: episiotomia de rotina (é seletiva, não rotineira); MANOBRA DE KRISTELLER (a pressão no fundo do útero está PROIBIDA — causa lesão materna e fetal e nunca deve ser feita); enema; tricotomia (raspar pelos); amniotomia de rotina; ocitocina de rotina para 'acelerar'; posição de litotomia obrigatória; aspiração de rotina das vias aéreas do recém-nascido saudável; e separar mãe e bebê. Na vigilância fetal do parto de BAIXO risco, o padrão é a AUSCULTA INTERMITENTE — a cardiotocografia contínua de rotina não melhora desfecho e aumenta cesárea. Regra de ouro para a prova: diante das alternativas, escolha a que RESPEITA a fisiologia e a autonomia da mulher e desconfie de toda intervenção 'de rotina'."],
   raciocinio:["Situe o período: dilatação (latente x ativa), expulsivo, dequitação, Greenberg (1ª hora, vigiar hemorragia).",
     "Fase ativa começa em 5-6 cm. Friedman (1 cm/h) está SUPERADO: parto lento com mãe e feto bem é normal — não é indicação de cesárea.",
     "Meça a altura pelos planos de DeLee (espinhas isquiáticas = plano 0).",
     "Registre no partograma; cruzar a linha de alerta = reavaliar; linha de ação (4h depois) = decidir.",
     "Garanta as boas práticas: acompanhante (Lei 11.108), liberdade de posição, alívio não farmacológico, pele a pele, clampeamento tardio, aleitamento na 1ª hora.",
     "Elimine o que é 'de rotina': episiotomia, Kristeller (proibida), enema, tricotomia, amniotomia, ocitocina, litotomia, aspiração do RN.",
     "Baixo risco: ausculta intermitente (não cardiotoco contínua)."],
