  {id:"cm_sca_q1",area:"CM",tema:"Síndrome coronariana aguda (IAM)",transv:[],dif:2,premium:false,enun:"Homem de 58 anos, dor torácica em aperto há 1 hora, sudorese. ECG com supradesnivelamento de ST em parede inferior. O hospital tem hemodinâmica disponível. Conduta prioritária?",alts:["Trombólise imediata","Angioplastia primária (reperfusão), idealmente com porta-balão ≤90 minutos","Aguardar a troponina para decidir","Alta com AAS e retorno ambulatorial"],correta:1,coment:"IAM COM supra em serviço com hemodinâmica: angioplastia primária é a 1ª escolha, meta porta-balão ≤90 min. Reperfusão tem prioridade absoluta."},
  {id:"cm_sca_q2",area:"CM",tema:"Síndrome coronariana aguda (IAM)",transv:[],dif:2,premium:false,enun:"Paciente com IAM com supra chega a hospital SEM hemodinâmica, e a transferência levaria mais de 2 horas. Qual a conduta?",alts:["Aguardar a transferência sem tratamento","Trombólise (fibrinolítico) com meta porta-agulha ≤30 minutos, se sem contraindicações","Apenas AAS e observação","Repetir ECG em 6 horas"],correta:1,coment:"Se não é possível angioplastia no tempo (transferência >120 min), indica-se trombólise (porta-agulha ≤30 min), em sintomas ≤12h e sem contraindicações. Depois, transferir para cateterismo."},
  {id:"cm_sca_q3",area:"CM",tema:"Síndrome coronariana aguda (IAM)",transv:[],dif:2,premium:false,enun:"Mulher de 65 anos com dor torácica, ECG SEM supra de ST, troponina elevada. Qual conduta está CORRETA?",alts:["Trombólise imediata","Estratificar risco (GRACE/TIMI) e definir cateterismo; NÃO trombolisar","Alta imediata","Fibrinolítico se dor persistir"],correta:1,coment:"IAM SEM supra (troponina elevada): não se trombolisa. Estratifica-se o risco e define-se o momento do cateterismo (precoce se alto risco)."},
  {id:"cm_sca_q4",area:"CM",tema:"Síndrome coronariana aguda (IAM)",transv:[],dif:2,premium:false,enun:"Por que a morfina não deve ser administrada de rotina precocemente no IAM com supra?",alts:["Porque causa hipertensão","Porque a melhora da dor é critério de reperfusão e a morfina a mascara (além de reduzir absorção dos antiplaquetários)","Porque não tem efeito analgésico","Porque está contraindicada em toda dor torácica"],correta:1,coment:"A analgesia precoce com morfina mascara a dor, que é um critério clínico de reperfusão, e reduz a absorção dos antiagregantes. Reserva-se para dor intolerável."},
  {id:"cm_ic_q1",area:"CM",tema:"Insuficiência cardíaca",transv:[],dif:2,premium:false,enun:"Homem de 60 anos, dispneia aos esforços, edema de MMII, eco com FE de 30%. Qual conjunto de fármacos comprovadamente REDUZ mortalidade nesse paciente?",alts:["Apenas furosemida","Os 4 pilares: IECA/BRA ou sacubitril-valsartana + betabloqueador + espironolactona + iSGLT2","Digoxina isolada","Apenas nitrato"],correta:1,coment:"ICFEr (FE ≤40%): os 4 pilares reduzem mortalidade. Diurético alivia congestão mas não muda mortalidade."},
  {id:"cm_ic_q2",area:"CM",tema:"Insuficiência cardíaca",transv:[],dif:2,premium:false,enun:"Sobre o uso de diuréticos na insuficiência cardíaca, é correto afirmar:",alts:["Reduzem a mortalidade","Aliviam a congestão e os sintomas, mas não reduzem mortalidade","Substituem os betabloqueadores","São contraindicados na IC"],correta:1,coment:"Diuréticos controlam a congestão/sintomas, porém não reduzem mortalidade — papel diferente dos 4 pilares."},
  {id:"cm_ic_q3",area:"CM",tema:"Insuficiência cardíaca",transv:[],dif:2,premium:false,enun:"Paciente com IC e FE de 55%, hipertenso, idoso. Como se classifica a IC quanto à fração de ejeção?",alts:["IC com FE reduzida","IC com FE preservada","Não é insuficiência cardíaca","IC intermediária"],correta:1,coment:"FE ≥50% = IC com fração de ejeção preservada (ICFEp), comum em idosos e hipertensos (coração enche mal)."},
  {id:"cm_ic_q4",area:"CM",tema:"Insuficiência cardíaca",transv:[],dif:2,premium:false,enun:"Qual exame laboratorial, quando NORMAL, praticamente afasta a IC como causa da dispneia?",alts:["Troponina","BNP / NT-proBNP","Hemograma","D-dímero"],correta:1,coment:"O BNP/NT-proBNP normal tem alto valor preditivo negativo: torna a IC improvável como causa da dispneia."},
  {id:"cm_avc_q1",area:"CM",tema:"AVC (isquêmico e hemorrágico)",transv:[],dif:2,premium:false,enun:"Paciente com hemiparesia súbita há 2 horas. Qual o primeiro exame e o objetivo?",alts:["Ressonância para confirmar o diagnóstico","Tomografia de crânio sem contraste, para separar AVC isquêmico de hemorrágico","Eletroencefalograma","Punção lombar"],correta:1,coment:"A TC de crânio sem contraste é o primeiro exame: diferencia isquêmico de hemorrágico, o que define condutas opostas."},
  {id:"cm_avc_q2",area:"CM",tema:"AVC (isquêmico e hemorrágico)",transv:[],dif:2,premium:false,enun:"AVC isquêmico confirmado, início dos sintomas há 3 horas, PA 160/90, sem contraindicações. Conduta de reperfusão?",alts:["Trombólise endovenosa (dentro da janela de 4,5h)","Aguardar 24 horas","Anti-hipertensivo agressivo primeiro","Nenhuma reperfusão é possível"],correta:0,coment:"Isquêmico dentro de 4,5h e sem contraindicação: trombólise endovenosa. A PA de 160/90 é tolerada no isquêmico."},
  {id:"cm_avc_q3",area:"CM",tema:"AVC (isquêmico e hemorrágico)",transv:[],dif:2,premium:false,enun:"Sobre a pressão arterial no AVC isquêmico agudo, é correto:",alts:["Deve ser baixada agressivamente sempre","É tolerada (permite-se PA mais elevada); baixar demais piora a isquemia","Não influencia a conduta","Deve ficar abaixo de 110/70"],correta:1,coment:"No isquêmico tolera-se hipertensão (mantém perfusão da área de penumbra); trata-se só acima de limites altos, ou antes da trombólise (>185/110)."},
  {id:"cm_avc_q4",area:"CM",tema:"AVC (isquêmico e hemorrágico)",transv:[],dif:2,premium:false,enun:"Paciente com AVC hemorrágico confirmado na TC. Qual conduta é adequada?",alts:["Trombólise endovenosa imediata","Controle rigoroso da pressão arterial, correção de coagulopatia e avaliação neurocirúrgica","Antiagregante em dose alta","Trombectomia mecânica"],correta:1,coment:"No hemorrágico NÃO se trombolisa: controla-se rigorosamente a PA, corrige-se coagulopatia e avalia-se neurocirurgia."},
  {id:"cm_asma_dpoc_q1",area:"CM",tema:"Asma e DPOC",transv:[],dif:2,premium:false,enun:"Jovem de 20 anos com asma, usando apenas salbutamol de resgate várias vezes por semana, com sintomas noturnos. Qual a conduta correta segundo a GINA?",alts:["Manter só o salbutamol de resgate","Introduzir corticoide inalatório como base do tratamento (controle da inflamação)","Prescrever antibiótico","Iniciar corticoide oral contínuo"],correta:1,coment:"A base do tratamento da asma é o corticoide inalatório. Tratar só com resgate não controla a doença e aumenta o risco de crise grave."},
  {id:"cm_asma_dpoc_q2",area:"CM",tema:"Asma e DPOC",transv:[],dif:2,premium:false,enun:"Criança/adulto em crise de asma (exacerbação) com dispneia e sibilância. Além de O2 e salbutamol, qual medida é fundamental e precoce?",alts:["Antibiótico de rotina","Corticoide sistêmico (oral ou venoso) precoce","Broncodilatador de longa ação isolado","Sedação"],correta:1,coment:"Na crise de asma, o corticoide sistêmico precoce reduz a inflamação e previne recaída. Antibiótico não é rotina."},
  {id:"cm_asma_dpoc_q3",area:"CM",tema:"Asma e DPOC",transv:[],dif:2,premium:false,enun:"Homem de 65 anos, tabagista de longa data, com dispneia progressiva e pouca reversibilidade ao broncodilatador. Qual a ÚNICA medida que altera a história natural da DPOC?",alts:["Corticoide inalatório","Cessação do tabagismo","Antibiótico contínuo","Mucolítico"],correta:1,coment:"A cessação do tabagismo é a única medida que muda a história natural da DPOC. Broncodilatadores aliviam sintomas; vacinação e O2 (se hipoxemia) também ajudam."},
  {id:"cm_asma_dpoc_q4",area:"CM",tema:"Asma e DPOC",transv:[],dif:2,premium:false,enun:"Sobre o papel do corticoide inalatório, qual afirmação está correta?",alts:["É a base tanto da asma quanto da DPOC","É a base da asma; na DPOC entra apenas em perfis selecionados (ex.: exacerbações, eosinofilia)","Não é usado na asma","É contraindicado na asma leve"],correta:1,coment:"Corticoide inalatório é a base da asma; na DPOC a base são os broncodilatadores de longa ação, e o CI é reservado a casos selecionados."},
  {id:"cm_dengue_q1",area:"CM",tema:"Dengue e arboviroses",transv:[],dif:2,premium:false,enun:"Homem de 40 anos, 5º dia de doença, refere que a febre cedeu ontem, mas evoluiu com dor abdominal intensa e contínua e vômitos persistentes. PA 110/70 (sem hipotensão), hematócrito em elevação. Classificação e conduta?",alts:["Grupo A; hidratação oral domiciliar","Grupo C; internação e expansão venosa com 10 mL/kg na primeira hora","Grupo B; apenas hemograma e alta","Grupo D; 20 mL/kg em 20 minutos"],correta:1,coment:"Dor abdominal intensa, vômitos persistentes e hematócrito subindo são sinais de ALARME, sem hipotensão = Grupo C: internação e expansão com soro fisiológico 10 mL/kg na 1ª hora, reavaliando (até 3 vezes). O Grupo D exige choque/hipotensão."},
  {id:"cm_dengue_q2",area:"CM",tema:"Dengue e arboviroses",transv:[],dif:2,premium:false,enun:"Por que o paciente com dengue tende a piorar justamente quando a febre cede, entre o 3º e o 7º dia?",alts:["Porque o vírus se multiplica mais sem febre","Porque é a fase crítica, em que ocorre extravasamento plasmático (hemoconcentração e hipovolemia)","Porque a plaqueta cai apenas após a febre","Porque a antibioticoterapia falhou"],correta:1,coment:"A defervescência marca a entrada na fase crítica: os capilares extravasam plasma, o hematócrito sobe e o volume intravascular cai, levando ao choque. Por isso 'a febre passou' não significa melhora."},
  {id:"cm_dengue_q3",area:"CM",tema:"Dengue e arboviroses",transv:[],dif:2,premium:false,enun:"Paciente com dengue e mialgia intensa solicita analgésico. Qual conduta está correta?",alts:["Prescrever ácido acetilsalicílico (AAS)","Prescrever paracetamol ou dipirona; AAS e AINEs são contraindicados","Prescrever ibuprofeno em dose alta","Prescrever diclofenaco intramuscular"],correta:1,coment:"Na dengue usa-se paracetamol ou dipirona. AAS e anti-inflamatórios não esteroidais são contraindicados pelo risco de sangramento e lesão renal."},
  {id:"cm_dengue_q4",area:"CM",tema:"Dengue e arboviroses",transv:[],dif:2,premium:false,enun:"Mulher de 30 anos, 3º dia de dengue, sem sinais de alarme e sem comorbidades, mas com prova do laço positiva. Conduta segundo o MS?",alts:["Grupo A: hidratação oral em casa, sem exame","Grupo B: solicitar hemograma na unidade e reclassificar conforme o hematócrito","Grupo C: expansão venosa imediata","Alta sem retorno"],correta:1,coment:"Prova do laço positiva (ou sangramento espontâneo de pele) sem sinais de alarme = Grupo B: hemograma na unidade com hidratação oral supervisionada; hematócrito normal reclassifica para conduta do Grupo A, hematócrito aumentado sobe para o Grupo C."},

  {id:"cm_tb_q1",area:"CM",tema:"Tuberculose",transv:[],dif:2,premium:false,enun:"Homem de 45 anos, em situação de rua, com tosse há 4 semanas, febre vespertina, sudorese noturna e emagrecimento. Qual o exame INICIAL de escolha para o diagnóstico?",alts:["Baciloscopia de escarro em 3 amostras","Teste rápido molecular para tuberculose (TRM-TB)","Prova tuberculínica (PPD)","Cultura para micobactérias apenas"],correta:1,coment:"O TRM-TB é o exame inicial de escolha: em cerca de 2h detecta o DNA do M. tuberculosis e ainda identifica resistência à rifampicina. A baciloscopia fica onde não há TRM e para o controle mensal do tratamento; a prova tuberculínica serve para ILTB, não para doença ativa."},
  {id:"cm_tb_q2",area:"CM",tema:"Tuberculose",transv:[],dif:2,premium:false,enun:"Confirmada tuberculose pulmonar sensível em adulto virgem de tratamento. Qual o esquema básico preconizado pelo Ministério da Saúde?",alts:["2RHZE + 4RH (total de 6 meses)","3RH + 3RE (total de 6 meses)","Rifampicina isolada por 4 meses","2RHZ + 7RH (total de 9 meses)"],correta:0,coment:"Esquema básico: 2 meses de RHZE (fase intensiva) + 4 meses de RH (manutenção), em dose fixa combinada, totalizando 6 meses, preferencialmente sob tratamento diretamente observado (TDO)."},
  {id:"cm_tb_q3",area:"CM",tema:"Tuberculose",transv:[],dif:2,premium:false,enun:"Paciente no 10º dia de RIPE retorna assustado porque a urina está alaranjada. Conduta?",alts:["Suspender todo o esquema imediatamente","Tranquilizar: é efeito esperado da rifampicina; manter o esquema e orientar que ela reduz a eficácia do anticoncepcional oral","Trocar a rifampicina por estreptomicina","Solicitar biópsia renal"],correta:1,coment:"A coloração alaranjada da urina e secreções é efeito esperado da rifampicina e NÃO indica suspensão. Vale orientar o paciente e lembrar da interação com o anticoncepcional oral (reduz a eficácia)."},
  {id:"cm_tb_q4",area:"CM",tema:"Tuberculose",transv:[],dif:2,premium:false,enun:"Contato domiciliar de paciente bacilífero: assintomático, radiografia de tórax normal, prova tuberculínica de 8 mm, vacinado com BCG na infância. Conduta?",alts:["Nada a fazer, pois o BCG explica o resultado","Tratar infecção latente (ILTB), pois o corte é ≥5 mm independentemente do BCG","Iniciar esquema básico RIPE por 6 meses","Repetir a prova tuberculínica em 2 anos"],correta:1,coment:"Excluída doença ativa (assintomático + Rx normal), PT ≥5 mm indica ILTB — o corte foi unificado em 5 mm, independentemente de BCG prévio. Trata-se com rifampicina 4 meses (120 doses), isoniazida 9 meses (270 doses) ou 3HP (rifapentina + isoniazida, 12 doses semanais). RIPE é para doença ativa."},

  {id:"cm_pac_q1",area:"CM",tema:"Pneumonia adquirida na comunidade",transv:[],dif:2,premium:false,enun:"Mulher de 72 anos com tosse e dispneia. Ao exame: confusa, FR 32 irpm, PA 85/55 mmHg. Ureia de 60 mg/dL. Qual a pontuação no CURB-65 e a conduta?",alts:["1 ponto; tratamento ambulatorial","3 pontos; ambulatorial com reavaliação em 48h","5 pontos; internação, com avaliação de terapia intensiva","0 ponto; apenas sintomáticos"],correta:2,coment:"Pontua em todos: Confusão (1) + Ureia >50 (1) + FR ≥30 (1) + PA sistólica <90 (1) + idade ≥65 (1) = 5 pontos. Com ≥3 pontos, interna-se e avalia-se terapia intensiva."},
  {id:"cm_pac_q2",area:"CM",tema:"Pneumonia adquirida na comunidade",transv:[],dif:2,premium:false,enun:"Homem de 35 anos, previamente hígido, sem uso recente de antibiótico, com PAC e CURB-65 de 0 ponto. Qual o tratamento ambulatorial de 1ª linha?",alts:["Amoxicilina","Levofloxacino","Ceftriaxona intramuscular","Vancomicina oral"],correta:0,coment:"Adulto hígido, sem comorbidade nem uso recente de ATB e escore baixo: amoxicilina (alternativa, macrolídeo). Quinolona respiratória não é a escolha empírica de rotina no Brasil."},
  {id:"cm_pac_q3",area:"CM",tema:"Pneumonia adquirida na comunidade",transv:[],dif:2,premium:false,enun:"Por que se evita prescrever quinolona respiratória (levofloxacino/moxifloxacino) empiricamente no Brasil a um paciente com tosse arrastada e emagrecimento?",alts:["Porque não cobre pneumococo","Porque tem ação contra o bacilo da tuberculose: melhora parcialmente, MASCARA o diagnóstico de TB e seleciona resistência","Porque não existe no SUS","Porque só pode ser usada por via venosa"],correta:1,coment:"As quinolonas respiratórias têm atividade antimicobacteriana. Num paciente que na verdade tem TB, elas mascaram o quadro, atrasam o diagnóstico e selecionam resistência — por isso não são a escolha empírica de rotina aqui."},
  {id:"cm_pac_q4",area:"CM",tema:"Pneumonia adquirida na comunidade",transv:[],dif:2,premium:false,enun:"Paciente internado com PAC, no 3º dia de antibiótico, afebril, sem dispneia e melhorando clinicamente. A radiografia de controle mostra consolidação um pouco maior. Conduta?",alts:["Trocar o antibiótico imediatamente por falha terapêutica","Manter o esquema: a imagem atrasa em relação à clínica e o Rx de controle precoce não é rotina","Solicitar tomografia e broncoscopia de urgência","Associar antifúngico"],correta:1,coment:"A resolução radiológica é lenta (semanas) e a imagem pode até piorar nos primeiros dias enquanto o paciente melhora. Quem define resposta é a evolução clínica; radiografia de controle precoce não é rotina."},

  {id:"cm_hiv_q1",area:"CM",tema:"HIV e ISTs na APS",transv:[],dif:2,premium:false,enun:"Homem de 28 anos recebe diagnóstico de HIV na UBS por testagem rápida. Está assintomático e ainda não colheu CD4 nem carga viral. Conduta?",alts:["Aguardar o CD4 para decidir se trata","Iniciar TARV imediatamente, independentemente do CD4 — idealmente no mesmo dia","Só tratar se CD4 < 350","Encaminhar e aguardar consulta com infectologista em 3 meses"],correta:1,coment:"A TARV está indicada para TODAS as pessoas vivendo com HIV, independentemente do CD4, com início o mais precoce possível (idealmente no mesmo dia do diagnóstico). Não se espera CD4 nem carga viral para iniciar."},
  {id:"cm_hiv_q2",area:"CM",tema:"HIV e ISTs na APS",transv:[],dif:2,premium:false,enun:"Qual o esquema antirretroviral inicial preferencial para adultos no Brasil?",alts:["AZT + 3TC + efavirenz","TDF + 3TC + dolutegravir (DTG)","Ritonavir isolado","TDF + 3TC apenas"],correta:1,coment:"O esquema preferencial é tenofovir (TDF) + lamivudina (3TC) + dolutegravir (DTG), em comprimido único diário, disponível no SUS. Em coinfecção com TB usando rifampicina, o dolutegravir passa a 12/12h."},
  {id:"cm_hiv_q3",area:"CM",tema:"HIV e ISTs na APS",transv:[],dif:2,premium:false,enun:"Gestante com VDRL 1:32 e teste treponêmico positivo, com história de alergia comprovada à penicilina. Conduta correta?",alts:["Tratar com doxiciclina","Dessensibilizar e tratar com penicilina benzatina — é a única opção que trata o feto","Tratar com azitromicina","Não tratar até o parto"],correta:1,coment:"Penicilina benzatina é a única droga que trata adequadamente o feto. Na gestante alérgica, indica-se dessensibilização. Doxiciclina é contraindicada na gestação e não trata o feto; usá-la significa gestante inadequadamente tratada e risco de sífilis congênita."},
  {id:"cm_hiv_q4",area:"CM",tema:"HIV e ISTs na APS",transv:[],dif:2,premium:false,enun:"Paciente procura a unidade 24 horas após relação sexual desprotegida com pessoa vivendo com HIV de carga viral desconhecida. Conduta?",alts:["Não há profilaxia possível após 12 horas","Indicar PEP: iniciar o quanto antes, no limite de 72 horas da exposição, mantendo por 28 dias","Iniciar PrEP contínua e reavaliar em 30 dias","Apenas testar em 3 meses"],correta:1,coment:"A PEP é indicada em até 72 horas da exposição (quanto antes, melhor — idealmente nas 2 primeiras horas) e mantida por 28 dias. Após 72h não se indica PEP. A PrEP é prevenção contínua, para uso ANTES da exposição."},
  {id:"go_pe_q1",area:"GO",tema:"Síndromes hipertensivas da gestação",transv:[],dif:2,premium:false,enun:"Gestante de 33 semanas, PA 165/112 mmHg, cefaleia persistente e escotomas, plaquetas 88.000, proteinúria negativa. Como classificar?",alts:["Hipertensão gestacional, pois não há proteinúria","Pré-eclâmpsia com sinais de gravidade — a proteinúria não é obrigatória quando há disfunção de órgão-alvo","Hipertensão crônica","Quadro sem repercussão, apenas observar"],correta:1,coment:"Após 20 semanas, PA ≥140/90 com disfunção de órgão-alvo (plaquetopenia <100.000, sintomas cerebrais/visuais) fecha pré-eclâmpsia MESMO sem proteinúria. PA ≥160/110, cefaleia e escotomas caracterizam gravidade."},
  {id:"go_pe_q2",area:"GO",tema:"Síndromes hipertensivas da gestação",transv:[],dif:2,premium:false,enun:"Gestante com pré-eclâmpsia apresenta crise convulsiva tônico-clônica. Qual a droga indicada e com que finalidade?",alts:["Sulfato de magnésio, para reduzir a pressão arterial","Sulfato de magnésio, para tratar e prevenir novas convulsões (não é anti-hipertensivo)","Hidralazina, para tratar a convulsão","Diazepam como primeira linha, substituindo o sulfato"],correta:1,coment:"Eclâmpsia trata-se com sulfato de magnésio (Pritchard ou Zuspan), que é ANTICONVULSIVANTE — não baixa a pressão. O controle pressórico é feito à parte, com hidralazina/nifedipino/labetalol. São dois eixos distintos."},
  {id:"go_pe_q3",area:"GO",tema:"Síndromes hipertensivas da gestação",transv:[],dif:2,premium:false,enun:"Durante a manutenção do sulfato de magnésio, a paciente apresenta abolição do reflexo patelar e FR de 10 irpm. Conduta imediata?",alts:["Aumentar a dose do sulfato","Suspender o sulfato e administrar gluconato de cálcio 10% EV","Administrar hidralazina","Manter a infusão e reavaliar em 1 hora"],correta:1,coment:"São sinais de intoxicação pelo magnésio. O tripé de monitorização é reflexo patelar presente, FR ≥16 irpm e diurese ≥25-30 mL/h. Diante da intoxicação: suspender o sulfato e aplicar o antídoto — gluconato de cálcio 10% EV."},
  {id:"go_pe_q4",area:"GO",tema:"Síndromes hipertensivas da gestação",transv:[],dif:2,premium:false,enun:"Gestante de 14 semanas com fatores de risco importantes para pré-eclâmpsia (hipertensão crônica e pré-eclâmpsia em gestação anterior). Qual medida preventiva está indicada?",alts:["Iniciar IECA profilático","AAS em dose baixa (100 mg/dia) a partir de 12-16 semanas, associado a cálcio se baixa ingesta","Repouso absoluto no leito até o parto","Sulfato de magnésio profilático desde já"],correta:1,coment:"A prevenção da pré-eclâmpsia no alto risco é AAS em dose baixa (75-150 mg, habitualmente 100 mg/dia), iniciado entre 12 e 16 semanas, mais suplementação de cálcio onde a ingesta é baixa. IECA é fetotóxico e proibido; repouso absoluto não previne."},

  {id:"go_parto_q1",area:"GO",tema:"Trabalho de parto e partograma",transv:[],dif:2,premium:false,enun:"Primigesta em trabalho de parto, 6 cm de dilatação, evoluindo cerca de 0,7 cm/h, com BCF normais, bolsa íntegra e boa vitalidade materna e fetal. Conduta?",alts:["Diagnosticar parada de progressão e indicar cesárea","Manter o acompanhamento: a curva de Friedman (1 cm/h) está superada e a evolução lenta com bem-estar é normal","Administrar ocitocina de rotina para acelerar","Realizar manobra de Kristeller no expulsivo"],correta:1,coment:"A exigência de 1 cm/h (Friedman) foi superada: o parto normal progride mais devagar do que se pensava. Com mãe e feto bem, evolução lenta NÃO é distocia nem indicação de cesárea. Ocitocina de rotina não se faz, e Kristeller é proibida."},
  {id:"go_parto_q2",area:"GO",tema:"Trabalho de parto e partograma",transv:[],dif:2,premium:false,enun:"Qual prática está PROIBIDA na assistência ao parto, por causar lesão materna e fetal?",alts:["Contato pele a pele imediato","Manobra de Kristeller (pressão no fundo uterino)","Clampeamento tardio do cordão","Liberdade de posição no trabalho de parto"],correta:1,coment:"A manobra de Kristeller está proibida. As demais são boas práticas recomendadas pelas Diretrizes Nacionais de Assistência ao Parto Normal."},
  {id:"go_parto_q3",area:"GO",tema:"Trabalho de parto e partograma",transv:[],dif:2,premium:false,enun:"A parturiente deseja a presença de sua irmã durante todo o trabalho de parto e o nascimento. A maternidade alega 'norma interna' e recusa. Isso é:",alts:["Correto, pois a instituição define suas regras","Ilegal: o acompanhante de livre escolha é direito garantido pela Lei 11.108/2005","Permitido apenas no pós-parto","Aceitável se houver superlotação"],correta:1,coment:"A Lei 11.108/2005 garante à parturiente o direito a acompanhante de livre escolha durante todo o trabalho de parto, parto e pós-parto imediato no SUS. Norma interna não revoga lei."},
  {id:"go_parto_q4",area:"GO",tema:"Trabalho de parto e partograma",transv:[],dif:2,premium:false,enun:"No partograma, a apresentação fetal está no plano 0 de DeLee. Isso significa que:",alts:["O polo cefálico está no nível das espinhas isquiáticas","O polo cefálico ainda está alto e móvel","O bebê já está coroando","A dilatação é de 0 cm"],correta:0,coment:"Os planos de DeLee tomam as espinhas isquiáticas como plano ZERO. Acima delas, valores negativos (mais alto); abaixo, positivos (descendo para a saída)."},
  {id:"ped_exant_q1",area:"PED",tema:"Doenças exantemáticas",transv:[],dif:2,premium:false,enun:"Menino de 4 anos, não vacinado, com febre alta há 4 dias, tosse intensa, coriza e conjuntivite com fotofobia. Ao exame, pontos brancos sobre base eritematosa na mucosa jugal e exantema maculopapular iniciando na região retroauricular. Diagnóstico e conduta?",alts:["Rubéola; apenas sintomáticos e alta","Sarampo; notificação IMEDIATA (24h) da suspeita, vitamina A, suporte, isolamento e bloqueio vacinal dos contatos em 72h","Escarlatina; penicilina benzatina","Exantema súbito; observação domiciliar"],correta:1,coment:"Pródromo catarral (tosse, coriza, conjuntivite) + manchas de Koplik (patognomônicas, surgem ANTES do exantema) + exantema craniocaudal iniciando atrás da orelha = sarampo. Notifica-se a SUSPEITA em até 24h, sem esperar sorologia; administra-se vitamina A, isola-se e faz-se bloqueio vacinal dos contatos suscetíveis em até 72h."},
  {id:"ped_exant_q2",area:"PED",tema:"Doenças exantemáticas",transv:[],dif:2,premium:false,enun:"Criança de 6 anos com faringite, exantema micropapular áspero ('pele em lixa'), palidez perioral, acentuação do exantema nas dobras e língua em framboesa. Qual o agente e por que se trata com antibiótico?",alts:["Vírus do sarampo; o antibiótico previne pneumonia","Streptococcus pyogenes; a penicilina previne febre reumática","Parvovírus B19; o antibiótico encurta o exantema","Herpes-vírus 6; previne convulsão febril"],correta:1,coment:"É escarlatina, causada por toxina do Streptococcus pyogenes — a única exantemática bacteriana da lista. Sinais: pele em lixa, Filatov (palidez perioral), Pastia (dobras) e língua em framboesa. Trata-se com penicilina, e a razão principal é PREVENIR A FEBRE REUMÁTICA."},
  {id:"ped_exant_q3",area:"PED",tema:"Doenças exantemáticas",transv:[],dif:2,premium:false,enun:"Lactente de 10 meses teve febre alta por 4 dias, que cessou abruptamente ontem. Hoje, já AFEBRIL e em bom estado geral, surgiu exantema maculopapular no tronco. Diagnóstico mais provável?",alts:["Sarampo","Exantema súbito (roséola, herpes-vírus 6)","Escarlatina","Rubéola congênita"],correta:1,coment:"No exantema súbito a febre alta desaparece ABRUPTAMENTE e só então surge o exantema, com a criança já bem — o oposto do sarampo, em que a febre persiste quando a mancha aparece. É causa frequente de convulsão febril."},
  {id:"ped_exant_q4",area:"PED",tema:"Doenças exantemáticas",transv:[],dif:2,premium:false,enun:"Irmão de 3 anos, não vacinado e assintomático, teve contato com caso de sarampo há 48 horas. Conduta?",alts:["Nada a fazer, pois está assintomático","Bloqueio vacinal: vacinar em até 72 horas da exposição","Iniciar antibiótico profilático","Aguardar o aparecimento do exantema para vacinar"],correta:1,coment:"O bloqueio vacinal dos contatos suscetíveis deve ser feito em até 72 horas da exposição — é ação de vigilância que interrompe a cadeia de transmissão. Aguardar sintomas é perder a janela."},

  {id:"ped_ict_q1",area:"PED",tema:"Icterícia neonatal",transv:[],dif:2,premium:false,enun:"Recém-nascido a termo apresenta icterícia com 18 horas de vida. Qual a interpretação correta?",alts:["É fisiológica, pois ocorre na primeira semana","É sempre PATOLÓGICA — icterícia nas primeiras 24 horas exige investigação de hemólise","É esperada no aleitamento materno exclusivo","Só investigar se atingir as mãos e os pés"],correta:1,coment:"Icterícia nas primeiras 24 horas de vida NUNCA é fisiológica, sem exceção. Obriga investigação — sobretudo de hemólise (incompatibilidade Rh ou ABO, esferocitose, deficiência de G6PD). A fisiológica aparece após 24-36h, com pico no 3º-5º dia."},
  {id:"ped_ict_q2",area:"PED",tema:"Icterícia neonatal",transv:[],dif:2,premium:false,enun:"RN com icterícia precoce; mãe tipo sanguíneo O positivo e recém-nascido tipo A positivo. Qual a hipótese mais provável?",alts:["Incompatibilidade Rh","Incompatibilidade ABO — a causa mais comum de doença hemolítica do RN, geralmente mais branda","Atresia de vias biliares","Icterícia do leite materno"],correta:1,coment:"Mãe O com filho A ou B configura incompatibilidade ABO, a mais comum e habitualmente mais branda. A incompatibilidade Rh (mãe Rh negativo sensibilizada, Coombs direto positivo) é a forma grave. Atresia cursa com bilirrubina DIRETA alta e é tardia."},
  {id:"ped_ict_q3",area:"PED",tema:"Icterícia neonatal",transv:[],dif:2,premium:false,enun:"Lactente de 5 semanas mantém icterícia, com colúria e fezes esbranquiçadas (acolia). Bilirrubina DIRETA elevada. Conduta?",alts:["Iniciar fototerapia e reavaliar em 48h","Investigar imediatamente colestase/atresia de vias biliares — é urgência, pois a cirurgia de Kasai deve ocorrer preferencialmente antes das 8 semanas","Suspender o aleitamento materno por 72h","Tranquilizar: é icterícia do leite materno"],correta:1,coment:"Bilirrubina DIRETA alta é colestase e NUNCA é fisiológica. Acolia fecal + colúria apontam atresia de vias biliares: urgência de investigação e encaminhamento, pois o prognóstico da portoenterostomia de Kasai depende de ser feita precocemente (preferencialmente antes de 8 semanas). Fototerapia não trata bilirrubina direta e ainda causa a síndrome do bebê bronzeado."},
  {id:"ped_ict_q4",area:"PED",tema:"Icterícia neonatal",transv:[],dif:2,premium:false,enun:"Qual complicação a fototerapia visa evitar no RN com hiperbilirrubinemia indireta?",alts:["Anemia ferropriva","Kernicterus (encefalopatia bilirrubínica crônica: paralisia cerebral atetoide, surdez neurossensorial)","Atresia de vias biliares","Enterocolite necrosante"],correta:1,coment:"A bilirrubina INDIRETA é lipossolúvel, atravessa a barreira hematoencefálica e se deposita nos núcleos da base, causando encefalopatia aguda e, como sequela permanente, o kernicterus — paralisia cerebral atetoide, surdez neurossensorial e paralisia do olhar. É inteiramente evitável, e é por isso que se trata."},

  {id:"ped_febre_q1",area:"PED",tema:"Febre sem foco e convulsão febril",transv:[],dif:2,premium:false,enun:"Recém-nascido de 20 dias de vida, em bom estado geral aparente, com febre aferida de 38,5°C e exame físico sem foco. Conduta?",alts:["Alta com antitérmico e reavaliação em 24h","Internação com investigação completa — hemograma, hemocultura, urina/urocultura e LÍQUOR — e antibiótico empírico","Apenas coletar urina e liberar","Observar por 4 horas e liberar se ceder a febre"],correta:1,coment:"Abaixo de 28 dias, febre ≥38°C obriga internação, investigação completa (incluindo punção lombar) e antibiótico empírico. Não existe 'neonato febril de baixo risco' para manejo domiciliar: a imunidade é imatura, a apresentação é pobre e a deterioração é rápida."},
  {id:"ped_febre_q2",area:"PED",tema:"Febre sem foco e convulsão febril",transv:[],dif:2,premium:false,enun:"Criança de 2 anos, previamente hígida, teve crise tônico-clônica generalizada de 3 minutos durante pico febril, única nas últimas 24h, com recuperação completa e exame neurológico normal. Conduta?",alts:["Punção lombar, EEG e tomografia de crânio para todos os casos","Diagnosticar convulsão febril SIMPLES: tratar o foco da febre e orientar a família, sem punção lombar, EEG ou TC de rotina","Iniciar anticonvulsivante contínuo por 2 anos","Internar em UTI para monitorização"],correta:1,coment:"Convulsão febril simples: 6 meses a 5 anos, crise generalizada, <15 minutos, única em 24h, com recuperação completa. É benigna — não exige punção lombar, EEG nem neuroimagem de rotina, e não se prescreve anticonvulsivante contínuo. O tratamento é orientar a família."},
  {id:"ped_febre_q3",area:"PED",tema:"Febre sem foco e convulsão febril",transv:[],dif:2,premium:false,enun:"Duas crianças chegam à UBS: A, com 40°C, ativa, brincando e interagindo; B, com 38°C, prostrada, gemente e com enchimento capilar lento. Qual afirmação está correta?",alts:["A criança A é mais grave, pois a febre é mais alta","A criança B é mais grave: a gravidade se define pelo ESTADO GERAL, não pela altura da febre","Ambas têm a mesma gravidade","A febre de 40°C causa dano cerebral e exige internação"],correta:1,coment:"A altura da febre isolada não define gravidade. Sinais de toxemia (letargia, gemência, perfusão ruim, taquipneia, recusa alimentar) é que indicam risco. E a febre, por si, não causa dano cerebral."},
  {id:"ped_febre_q4",area:"PED",tema:"Febre sem foco e convulsão febril",transv:[],dif:2,premium:false,enun:"Criança de 3 anos com febre alta e surgimento de petéquias em tronco e membros, com aspecto toxemiado. Conduta?",alts:["Aguardar hemograma e sorologias antes de qualquer conduta","Tratar como meningococcemia até prova em contrário: antibiótico imediato e suporte, sem esperar exames","Prescrever antitérmico e reavaliar em 24h","Apenas anti-histamínico para o rash"],correta:1,coment:"Febre + petéquias em criança toxemiada é meningococcemia até prova em contrário — emergência. O antibiótico não pode esperar resultado de exame; cada hora de atraso aumenta a mortalidade."},

  {id:"ped_viol_q1",area:"PED",tema:"Violência contra a criança",transv:[],dif:2,premium:false,enun:"Lactente de 4 meses é levado ao PS com fratura de fêmur. A mãe relata que 'caiu do sofá'. Ao exame, há também hematomas em diferentes estágios de cicatrização. Conduta?",alts:["Aceitar a história, tratar a fratura e dar alta","Notificar a SUSPEITA de violência em até 24h (ficha/SINAN + Conselho Tutelar), acolher, cuidar e documentar objetivamente","Aguardar confirmação por perícia antes de notificar","Confrontar a mãe e exigir que ela confesse"],correta:1,coment:"Lesão incompatível com o estágio de desenvolvimento (lactente de 4 meses não produz esse trauma) somada a hematomas em vários estágios levanta forte suspeita de maus-tratos. A notificação é compulsória e IMEDIATA da SUSPEITA (ECA art. 13), por ficha no SINAN e comunicação ao Conselho Tutelar. O médico não investiga nem confronta: acolhe, cuida, documenta e aciona a rede."},
  {id:"ped_viol_q2",area:"PED",tema:"Violência contra a criança",transv:[],dif:2,premium:false,enun:"Adolescente de 13 anos chega à unidade 12 horas após violência sexual, acompanhada da tia, sem boletim de ocorrência. Conduta correta?",alts:["Encaminhar à delegacia para registrar B.O. antes de qualquer atendimento","Atender imediatamente: o B.O. NÃO é exigência — iniciar PEP para HIV (até 72h, por 28 dias), profilaxia de IST, contracepção de emergência e hepatite B, além de notificar","Aguardar autorização judicial","Somente coletar exames e liberar sem profilaxia"],correta:1,coment:"O atendimento à violência sexual é urgência e não depende de boletim de ocorrência, perícia prévia ou autorização judicial. As profilaxias têm janela: PEP para HIV até 72h (28 dias), profilaxia de IST, contracepção de emergência até 5 dias e hepatite B. Notificação imediata + Conselho Tutelar. Ainda: sexo com menor de 14 anos é estupro de vulnerável."},
  {id:"ped_viol_q3",area:"PED",tema:"Violência contra a criança",transv:[],dif:2,premium:false,enun:"Sobre a notificação de violência contra crianças e adolescentes, é correto afirmar:",alts:["Só se notifica após confirmação diagnóstica","Notifica-se a SUSPEITA, de forma compulsória e imediata (24h); deixar de notificar é infração prevista no ECA","A notificação substitui o cuidado clínico","Depende da autorização da família"],correta:1,coment:"A suspeita basta — não se espera confirmação. A notificação é compulsória e imediata (24h), pela ficha (SINAN) e ao Conselho Tutelar, conforme o art. 13 do ECA; a omissão configura infração (art. 245 do ECA). Não depende de autorização da família, e o sigilo cede à proteção da criança."},
  {id:"ped_viol_q4",area:"PED",tema:"Violência contra a criança",transv:[],dif:2,premium:false,enun:"Lactente com rebaixamento do nível de consciência. A tomografia mostra hematoma subdural e a fundoscopia revela hemorragias retinianas, sem história de trauma que explique o quadro. Hipótese?",alts:["Meningite bacteriana","Síndrome do bebê sacudido (trauma craniano abusivo)","Convulsão febril complexa","Icterícia nuclear"],correta:1,coment:"A tríade hematoma subdural + hemorragias retinianas + ausência de trauma que explique caracteriza a síndrome do bebê sacudido (trauma craniano abusivo). É violência física e exige notificação imediata e acionamento do Conselho Tutelar."},
  {id:"mfc_est_q1",area:"MFC",tema:"Tipos de estudo epidemiológico",transv:[],dif:2,premium:false,enun:"Pesquisadores selecionam 200 pacientes com câncer de pâncreas (raro) e 200 sem a doença, e comparam retrospectivamente a exposição prévia ao tabagismo. Qual o desenho e a medida de associação adequada?",alts:["Coorte; risco relativo","Caso-controle; odds ratio (razão de chances)","Transversal; prevalência","Ensaio clínico randomizado; NNT"],correta:1,coment:"Partir do DESFECHO (doentes e não doentes) e olhar para trás a exposição caracteriza o caso-controle — desenho de escolha para doenças RARAS. Ele fornece odds ratio; NÃO calcula incidência nem risco relativo. Seu viés típico é o de memória."},
  {id:"mfc_est_q2",area:"MFC",tema:"Tipos de estudo epidemiológico",transv:[],dif:2,premium:false,enun:"Um inquérito mede, em um único momento, o índice de massa corporal e o nível de atividade física de 3.000 adultos. Qual a principal limitação desse desenho?",alts:["É muito caro e demorado","Não estabelece TEMPORALIDADE: como exposição e desfecho são medidos juntos, não se sabe o que veio antes — inferência causal frágil","Não permite calcular prevalência","Exige randomização"],correta:1,coment:"É um estudo transversal (seccional): fotografia que mede exposição e desfecho ao mesmo tempo e fornece PREVALÊNCIA. É barato e rápido, mas sem temporalidade — não se sabe se o sedentarismo levou à obesidade ou o contrário."},
  {id:"mfc_est_q3",area:"MFC",tema:"Tipos de estudo epidemiológico",transv:[],dif:2,premium:false,enun:"Um ensaio clínico relata risco relativo de 0,82 para o desfecho, com intervalo de confiança de 95% de 0,65 a 1,04. Como interpretar?",alts:["Há redução de risco estatisticamente significativa","O IC 95% CRUZA o 1: o resultado NÃO é estatisticamente significativo","O tratamento aumentou o risco","O estudo prova causalidade"],correta:1,coment:"RR menor que 1 sugere proteção, mas o intervalo de confiança vai de 0,65 a 1,04 — ou seja, CRUZA o valor 1 (ausência de associação). Portanto o resultado não é estatisticamente significativo."},
  {id:"mfc_est_q4",area:"MFC",tema:"Tipos de estudo epidemiológico",transv:[],dif:2,premium:false,enun:"Qual é a principal vantagem da RANDOMIZAÇÃO em um ensaio clínico?",alts:["Elimina a necessidade de grupo controle","Distribui igualmente entre os grupos os fatores de confusão, inclusive os DESCONHECIDOS","Garante que não haverá perdas de seguimento","Substitui o cegamento"],correta:1,coment:"Só a randomização equilibra confundidores conhecidos E desconhecidos — algo que nenhum estudo observacional consegue. O cegamento tem outra função (reduzir viés de aferição) e a análise por intenção de tratar preserva o benefício da randomização apesar dos abandonos."},

  {id:"mfc_test_q1",area:"MFC",tema:"Testes diagnósticos e rastreamento",transv:[],dif:2,premium:false,enun:"Um teste com sensibilidade de 95% e especificidade de 90% é aplicado primeiro em população de alta prevalência e depois em população de baixa prevalência. O que acontece?",alts:["A sensibilidade cai na população de baixa prevalência","Sensibilidade e especificidade NÃO mudam; o VPP cai na população de baixa prevalência (mais falso-positivos entre os positivos)","O VPP não se altera, pois é propriedade do teste","O teste perde a especificidade"],correta:1,coment:"Sensibilidade e especificidade são propriedades do TESTE e independem da prevalência. Já VPP e VPN dependem dela: quanto mais rara a doença, menor o VPP e maior a proporção de falso-positivos entre os que testaram positivo."},
  {id:"mfc_test_q2",area:"MFC",tema:"Testes diagnósticos e rastreamento",transv:[],dif:2,premium:false,enun:"Para um teste de RASTREAMENTO populacional, qual característica é prioritária e por quê?",alts:["Alta especificidade, para não rotular sadios","Alta SENSIBILIDADE, para não deixar passar doentes (o positivo será depois confirmado por teste específico)","Baixo custo apenas","Alta prevalência do teste"],correta:1,coment:"No rastreio o pecado é deixar passar um doente, então prioriza-se a SENSIBILIDADE (SnNout: sensível + negativo afasta). A confirmação fica para um teste ESPECÍFICO (SpPin: específico + positivo confirma) — é o modelo usado, por exemplo, no diagnóstico do HIV."},
  {id:"mfc_test_q3",area:"MFC",tema:"Testes diagnósticos e rastreamento",transv:[],dif:2,premium:false,enun:"Ao reduzir o ponto de corte de um exame quantitativo para 'não perder casos', o que ocorre?",alts:["Sobem a sensibilidade e a especificidade juntas","Sobe a sensibilidade e CAI a especificidade (mais falso-positivos) — é o trade-off representado pela curva ROC","Ambas caem","Nada muda, pois o teste é o mesmo"],correta:1,coment:"Sensibilidade e especificidade puxam em direções opostas: baixar o corte captura mais doentes, mas também mais sadios. A curva ROC representa esse balanço, e a área sob a curva resume o desempenho global."},
  {id:"mfc_test_q4",area:"MFC",tema:"Testes diagnósticos e rastreamento",transv:[],dif:2,premium:false,enun:"Um rastreamento antecipa o diagnóstico, e os pacientes rastreados 'sobrevivem mais tempo após o diagnóstico', embora morram na mesma data que morreriam. Esse fenômeno chama-se:",alts:["Falácia ecológica","Viés de antecipação diagnóstica (lead time bias)","Viés de memória","Confundimento"],correta:1,coment:"O lead time bias dá a ilusão de sobrevida maior apenas porque o relógio começou a contar antes. Por isso rastrear só se justifica quando o tratamento precoce MUDA o desfecho (critérios de Wilson e Jungner) — antecipar sem mudar desfecho apenas prolonga o tempo de saber."},

  {id:"mfc_ind_q1",area:"MFC",tema:"Indicadores de saúde",transv:[],dif:2,premium:false,enun:"A raiva humana mata praticamente todos os infectados, mas ocorrem pouquíssimos casos por ano no país. Como se descrevem esses dois fatos?",alts:["Alta mortalidade e alta letalidade","Alta LETALIDADE (óbitos/doentes) e baixa MORTALIDADE (óbitos/população)","Alta incidência e baixa prevalência","Alta prevalência e alta mortalidade"],correta:1,coment:"Letalidade = óbitos entre os DOENTES (mede a gravidade da doença). Mortalidade = óbitos na POPULAÇÃO. A raiva tem letalidade próxima de 100% e mortalidade baixíssima, pois quase ninguém adoece."},
  {id:"mfc_ind_q2",area:"MFC",tema:"Indicadores de saúde",transv:[],dif:2,premium:false,enun:"Um novo tratamento cura rapidamente uma doença crônica. Sem que a incidência mude, o que acontece com a prevalência?",alts:["Aumenta, pois há mais diagnósticos","DIMINUI, pois a prevalência é aproximadamente incidência x DURAÇÃO — encurtar a duração reduz o estoque de casos","Permanece idêntica","Torna-se igual à incidência"],correta:1,coment:"Prevalência ≈ incidência x duração. Curar rápido (ou, infelizmente, matar rápido) encurta a duração e derruba a prevalência sem que a incidência tenha mudado. Por isso prevalência não é medida de risco."},
  {id:"mfc_ind_q3",area:"MFC",tema:"Indicadores de saúde",transv:[],dif:2,premium:false,enun:"Em um município, a mortalidade infantil caiu e hoje o componente NEONATAL é o predominante. Qual a leitura correta?",alts:["O problema principal passou a ser saneamento e desnutrição","O componente pós-neonatal (infecção, diarreia, desnutrição) foi reduzido; o desafio atual está na qualidade da assistência ao pré-natal, ao parto e ao recém-nascido","A mortalidade infantil deixou de ser um bom indicador","Houve erro de registro no SINASC"],correta:1,coment:"O componente pós-neonatal (28-364 dias) responde a saneamento, vacina, aleitamento e TRO — e cai primeiro. Quando resta predominantemente o neonatal (0-27 dias), o gargalo é a assistência ao pré-natal, parto e RN."},
  {id:"mfc_ind_q4",area:"MFC",tema:"Indicadores de saúde",transv:[],dif:2,premium:false,enun:"Sobre a mortalidade materna no Brasil, é correto afirmar:",alts:["É um coeficiente calculado por 1.000 habitantes","É uma RAZÃO, calculada por 100.000 nascidos vivos, com predomínio de causas DIRETAS (hipertensão, hemorragia, infecção) — em grande parte evitáveis","Predominam as causas indiretas","Não é indicador de qualidade da assistência"],correta:1,coment:"É expressa como RAZÃO de mortalidade materna: óbitos maternos por 100.000 nascidos vivos. No Brasil predominam as causas diretas — complicações da própria gestação, parto e puerpério —, majoritariamente evitáveis, o que faz do indicador um retrato da assistência obstétrica."},

  {id:"mfc_etica_q1",area:"MFC",tema:"Ética médica e bioética",transv:[],dif:2,premium:false,enun:"Paciente adulto, lúcido e plenamente informado, recusa um tratamento indicado. Não há risco iminente de morte. Conduta ética?",alts:["Tratar assim mesmo, pela beneficência","RESPEITAR a recusa: o paciente capaz e informado tem autonomia para recusar, registrando a decisão e mantendo o vínculo e o cuidado","Acionar a justiça imediatamente","Dar alta administrativa e encerrar o acompanhamento"],correta:1,coment:"O Código de Ética Médica de 2018 é centrado na AUTONOMIA: o paciente capaz e informado pode recusar tratamento. O médico esclarece, registra e mantém o cuidado — não abandona. A exceção é a emergência com risco iminente de morte."},
  {id:"mfc_etica_q2",area:"MFC",tema:"Ética médica e bioética",transv:[],dif:2,premium:false,enun:"Paciente terminal, sem possibilidade de cura. A equipe suspende medidas fúteis que apenas prolongariam o processo de morrer, mantendo analgesia e conforto. Isso se chama:",alts:["Eutanásia, proibida no Brasil","ORTOTANÁSIA, conduta ética e permitida (Resolução CFM 1.805/2006)","Distanásia","Suicídio assistido"],correta:1,coment:"Ortotanásia é permitir a morte no tempo natural, suspendendo o fútil e mantendo cuidados paliativos — é ética e permitida. Distanásia é a obstinação terapêutica (prolongar o sofrimento), que se deve evitar. Eutanásia é provocar ativamente a morte e é proibida no Brasil."},
  {id:"mfc_etica_q3",area:"MFC",tema:"Ética médica e bioética",transv:[],dif:2,premium:false,enun:"Adolescente de 15 anos procura a UBS desacompanhada, para orientação sobre contracepção. Conduta correta?",alts:["Recusar o atendimento sem a presença do responsável","Atender e manter o sigilo: o adolescente tem direito a atendimento desacompanhado e à privacidade; o sigilo só se rompe diante de risco, comunicando antes a ela","Comunicar imediatamente os pais sobre tudo","Encaminhar ao Conselho Tutelar por procurar sozinha"],correta:1,coment:"O adolescente tem direito ao atendimento desacompanhado e ao sigilo, inclusive sobre vida sexual e contracepção. A quebra só se justifica diante de risco (abuso, gravidez, ideação suicida, uso grave de drogas) e deve ser comunicada previamente ao próprio adolescente. Recusar atendimento é erro."},
  {id:"mfc_etica_q4",area:"MFC",tema:"Ética médica e bioética",transv:[],dif:2,premium:false,enun:"O médico notifica um caso de tuberculose ao SINAN sem pedir autorização ao paciente. Do ponto de vista ético, isso é:",alts:["Quebra indevida de sigilo, passível de punição","Correto: a notificação compulsória é DEVER LEGAL, uma das hipóteses em que o sigilo cede","Correto apenas se o paciente concordar","Facultativo, conforme o julgamento do médico"],correta:1,coment:"O sigilo cede por dever legal, justa causa ou autorização do paciente. A notificação compulsória é dever legal — notificar não é quebra indevida de sigilo, e deixar de notificar é que configura infração."},
  {id:"cir_biliar_q1",area:"CIR",tema:"Colelitíase, colecistite e colangite",transv:[],dif:2,premium:false,enun:"Mulher de 45 anos, com dor em hipocôndrio direito há 12 horas, contínua, febre de 38,3°C, leucocitose e parada da inspiração à palpação do hipocôndrio direito. USG: parede vesicular de 6 mm, líquido perivesicular e cálculo impactado. Conduta?",alts:["Colecistectomia eletiva em 6-8 semanas, após 'esfriar' o processo","Internação, antibiótico e COLECISTECTOMIA PRECOCE, preferencialmente nas primeiras 72 horas / mesma internação","CPRE de urgência","Apenas sintomáticos e alta"],correta:1,coment:"Dor >6h + febre + leucocitose + sinal de Murphy + USG típica = colecistite aguda. A conduta atual é colecistectomia PRECOCE, na mesma internação (idealmente até 72h) — a antiga estratégia de operar depois de 6-8 semanas foi abandonada por ter mais complicações."},
  {id:"cir_biliar_q2",area:"CIR",tema:"Colelitíase, colecistite e colangite",transv:[],dif:2,premium:false,enun:"Homem de 62 anos com dor em hipocôndrio direito, febre com calafrios e ICTERÍCIA. Evolui com hipotensão e confusão mental. Diagnóstico e conduta?",alts:["Colecistite aguda; colecistectomia eletiva","Colangite aguda grave (tríade de Charcot + pêntade de Reynolds); antibiótico E DRENAGEM da via biliar (CPRE)","Hepatite viral; suporte clínico","Cólica biliar; analgesia e alta"],correta:1,coment:"Dor + febre + icterícia = tríade de Charcot (colangite). Somando hipotensão e confusão, completa-se a pêntade de Reynolds — colangite grave. O tratamento exige antibiótico MAIS drenagem da via biliar: antibiótico isolado não resolve uma via obstruída e infectada."},
  {id:"cir_biliar_q3",area:"CIR",tema:"Colelitíase, colecistite e colangite",transv:[],dif:2,premium:false,enun:"Paciente de 50 anos, assintomático, descobre em USG de rotina colelitíase (cálculo de 1 cm), sem qualquer sintoma. Conduta?",alts:["Colecistectomia imediata para todos os portadores de cálculo","Conduta expectante: colelitíase assintomática NÃO tem indicação cirúrgica de rotina","CPRE profilática","Antibiótico por 10 dias"],correta:1,coment:"A maioria dos portadores de cálculo é assintomática e não opera. Exceções para cirurgia profilática: vesícula em porcelana, cálculo >3 cm, anemia hemolítica, alguns pólipos e candidatos a transplante."},
  {id:"cir_biliar_q4",area:"CIR",tema:"Colelitíase, colecistite e colangite",transv:[],dif:2,premium:false,enun:"Homem de 68 anos com icterícia progressiva, indolor, perda de peso e vesícula PALPÁVEL e INDOLOR ao exame. Qual a principal hipótese?",alts:["Coledocolitíase por cálculo","Neoplasia periampular (sinal de Courvoisier-Terrier)","Colecistite aguda","Hepatite alcoólica"],correta:1,coment:"Vesícula palpável e indolor em paciente ictérico é o sinal de Courvoisier-Terrier, que aponta obstrução neoplásica (tipicamente câncer de cabeça de pâncreas). Na doença calculosa crônica a vesícula é fibrótica e não distende."},

  {id:"cir_pancre_q1",area:"CIR",tema:"Pancreatite aguda",transv:[],dif:2,premium:false,enun:"Mulher de 48 anos com dor epigástrica intensa irradiando em faixa para o dorso, que melhora ao inclinar-se para frente. Lipase 5 vezes acima do limite superior. Qual a conduta diagnóstica?",alts:["Solicitar tomografia de abdome imediatamente para confirmar","O diagnóstico JÁ está feito (Atlanta: dor típica + lipase ≥3x) — não é necessária tomografia neste momento","Aguardar nova dosagem de amilase em 24h","Realizar CPRE diagnóstica"],correta:1,coment:"Atlanta exige 2 de 3 critérios: dor típica, amilase/lipase ≥3x o limite superior, ou imagem compatível. Com dor típica + lipase 5x, o diagnóstico está fechado. A TC não é exame diagnóstico inicial e, feita precocemente, subestima a necrose."},
  {id:"cir_pancre_q2",area:"CIR",tema:"Pancreatite aguda",transv:[],dif:2,premium:false,enun:"Dois pacientes com pancreatite aguda: A com amilase de 3.000 U/L e sem falência orgânica; B com amilase de 400 U/L e insuficiência respiratória persistente há 72h. Qual afirmação está correta?",alts:["A é mais grave, pois a enzima está muito mais alta","B é o caso GRAVE: gravidade se define por falência orgânica PERSISTENTE (>48h), e o valor da enzima não mede gravidade","Ambos são leves","A enzima define a necessidade de cirurgia"],correta:1,coment:"O valor da amilase/lipase NÃO se correlaciona com gravidade. Pela Atlanta revisada, pancreatite grave é a que cursa com falência orgânica PERSISTENTE (além de 48 horas)."},
  {id:"cir_pancre_q3",area:"CIR",tema:"Pancreatite aguda",transv:[],dif:2,premium:false,enun:"Sobre o suporte na pancreatite aguda, qual conduta está de acordo com as recomendações atuais?",alts:["Jejum prolongado com nutrição parenteral para 'repousar o pâncreas'","Hidratação vigorosa com Ringer lactato e NUTRIÇÃO ENTERAL PRECOCE (24-72h), por via oral se tolerada","Antibiótico profilático para todos os casos de necrose estéril","Restrição hídrica nas primeiras 24 horas"],correta:1,coment:"O dogma do jejum prolongado com parenteral foi abandonado: a nutrição enteral precoce preserva a barreira intestinal e reduz infecção e mortalidade. A hidratação vigorosa (Ringer lactato) guiada por resposta é o pilar. Antibiótico profilático não é indicado na necrose estéril."},
  {id:"cir_pancre_q4",area:"CIR",tema:"Pancreatite aguda",transv:[],dif:2,premium:false,enun:"Paciente com pancreatite aguda BILIAR LEVE, em recuperação, sem colangite. Qual a conduta antes da alta?",alts:["Alta e colecistectomia eletiva em 6 meses","COLECISTECTOMIA na MESMA internação, para prevenir recorrência","CPRE de urgência para todos","Manter apenas dieta pobre em gorduras"],correta:1,coment:"Na pancreatite biliar leve, a colecistectomia deve ser feita na mesma internação — dar alta com a vesícula significa risco alto de nova pancreatite. A CPRE de urgência reserva-se aos casos com colangite associada ou obstrução biliar persistente."},

  {id:"cir_obst_q1",area:"CIR",tema:"Obstrução intestinal",transv:[],dif:2,premium:false,enun:"Homem de 60 anos, com laparotomia prévia, apresenta dor em cólica, vômitos, distensão e parada de eliminação de fezes e flatos há 24h. Está afebril, sem taquicardia, sem peritonismo; TC mostra obstrução de delgado por aderência, sem sinais de sofrimento de alça. Conduta inicial?",alts:["Laparotomia de urgência imediata","Tratamento CONSERVADOR: jejum, sonda nasogástrica, hidratação, correção de eletrólitos e prova com contraste hidrossolúvel, reavaliando","Colonoscopia descompressiva","Alta com laxante"],correta:1,coment:"Obstrução de delgado por brida SEM sinais de estrangulamento tenta-se conservadora: jejum, SNG, hidratação e contraste hidrossolúvel (diagnóstico e terapêutico — se alcança o cólon em ~24h, prediz resolução). Opera-se se houver piora ou ausência de resolução em 48-72h."},
  {id:"cir_obst_q2",area:"CIR",tema:"Obstrução intestinal",transv:[],dif:2,premium:false,enun:"Durante a observação de uma obstrução intestinal, o paciente evolui com dor que deixou de ser em cólica e tornou-se CONTÍNUA, febre, taquicardia, leucocitose e lactato elevado. Conduta?",alts:["Manter conservador por mais 48h","Cirurgia de URGÊNCIA: são sinais de estrangulamento (isquemia de alça)","Repetir o contraste hidrossolúvel","Iniciar apenas analgesia potente"],correta:1,coment:"Dor que vira contínua, febre, taquicardia, leucocitose, lactato e peritonismo indicam estrangulamento — a alça está isquemiando. Na TC somam-se pneumatose, líquido livre e alça sem realce. Isso é indicação de cirurgia imediata."},
  {id:"cir_obst_q3",area:"CIR",tema:"Obstrução intestinal",transv:[],dif:2,premium:false,enun:"Quais são as causas MAIS COMUNS de obstrução no intestino delgado e no cólon, respectivamente?",alts:["Neoplasia e brida","BRIDAS (aderências) no delgado; NEOPLASIA no cólon","Volvo e intussuscepção","Diverticulite e hérnia"],correta:1,coment:"No delgado, a causa mais comum são as bridas/aderências pós-operatórias (seguidas de hérnias e tumores). No cólon, a causa mais comum é a neoplasia (seguida de volvo e diverticulite)."},
  {id:"cir_obst_q4",area:"CIR",tema:"Obstrução intestinal",transv:[],dif:2,premium:false,enun:"Paciente com quadro obstrutivo e NENHUMA cirurgia abdominal prévia. Qual passo do exame físico não pode ser esquecido?",alts:["Ausculta cardíaca minuciosa","Exame dos ORIFÍCIOS HERNIÁRIOS — hérnia encarcerada é causa importante em quem nunca operou","Fundoscopia","Toque de tireoide"],correta:1,coment:"Sem cirurgia prévia, brida é improvável e a hérnia encarcerada sobe na lista. Deixar de examinar as regiões inguinal, femoral e umbilical é o erro clássico — a hérnia esquecida na virilha."},

  {id:"cir_queim_q1",area:"CIR",tema:"Queimaduras",transv:[],dif:2,premium:false,enun:"Vítima de incêndio apresenta área extensa de pele com aspecto branco nacarado, seca, rígida e INDOLOR ao toque. Como classificar?",alts:["1º grau, o mais superficial","3º grau (espessura total): indolor porque destruiu as terminações nervosas; exige enxerto","2º grau superficial","Não é queimadura, é isquemia"],correta:1,coment:"A ausência de dor é sinal de gravidade: no 3º grau a lesão é de espessura total e destrói as terminações nervosas. O 2º grau superficial, ao contrário, forma bolhas e é muito doloroso."},
  {id:"cir_queim_q2",area:"CIR",tema:"Queimaduras",transv:[],dif:2,premium:false,enun:"Homem resgatado de incêndio em ambiente FECHADO, com queimadura de face, vibrissas nasais chamuscadas, rouquidão e escarro carbonáceo. Saturação na oximetria de pulso: 98%. Conduta prioritária?",alts:["Aguardar, pois a saturação está normal","INTUBAÇÃO PRECOCE por suspeita de lesão inalatória, e oxigênio a 100% — a oximetria ENGANA na intoxicação por monóxido","Apenas nebulização com broncodilatador","Iniciar Parkland e reavaliar a via aérea em 6h"],correta:1,coment:"Ambiente fechado, face queimada, vibrissas chamuscadas, rouquidão e escarro carbonáceo indicam lesão inalatória: intuba-se PRECOCE, antes que o edema feche a via aérea. E a oximetria de pulso não distingue carboxi-hemoglobina de oxi-hemoglobina — por isso mostra valor normal falsamente; a conduta é O2 a 100% e dosar carboxi-hemoglobina."},
  {id:"cir_queim_q3",area:"CIR",tema:"Queimaduras",transv:[],dif:2,premium:false,enun:"Adulto de 70 kg com 30% de superfície corporal queimada (2º e 3º graus). Pela fórmula de Parkland, qual o volume das primeiras 24 horas e como distribuí-lo?",alts:["4.200 mL, todo nas primeiras 8 horas","8.400 mL de Ringer lactato: metade (4.200 mL) nas primeiras 8 horas contadas DO MOMENTO DA QUEIMADURA e metade nas 16 horas seguintes","2.100 mL em 24 horas","Restringir volume para evitar edema"],correta:1,coment:"Parkland: 4 mL x 70 kg x 30% = 8.400 mL de Ringer lactato em 24h; metade nas primeiras 8 horas, contadas a partir do momento da QUEIMADURA (não da chegada), e a outra metade nas 16h seguintes. A fórmula é estimativa — o ajuste real é pela diurese (0,5-1 mL/kg/h)."},
  {id:"cir_queim_q4",area:"CIR",tema:"Queimaduras",transv:[],dif:2,premium:false,enun:"Paciente com queimadura CIRCUNFERENCIAL de terceiro grau em membro superior evolui com dor intensa, palidez e ausência de pulso distal. Conduta?",alts:["Elevar o membro e observar","ESCAROTOMIA de urgência — a escara rígida circunferencial causa síndrome compartimental","Aplicar gelo local","Aguardar o enxerto"],correta:1,coment:"A queimadura circunferencial forma uma casca rígida que estrangula o membro (síndrome compartimental) ou, no tórax, impede a ventilação. O tratamento é a escarotomia de urgência. Gelo nunca: aprofunda a lesão e causa hipotermia."},
  {id:"go_contra_q1",area:"GO",tema:"Contracepção e planejamento reprodutivo",transv:[],dif:2,premium:false,enun:"Mulher de 26 anos deseja contracepção. Refere enxaqueca COM aura desde a adolescência. Qual método está CONTRAINDICADO (categoria 4 da OMS) e qual a alternativa?",alts:["DIU de cobre está contraindicado; usar pílula combinada","O contraceptivo COMBINADO (com estrogênio) está contraindicado pelo risco de AVC; alternativas: progestágeno isolado, implante ou DIU","Nenhum método é contraindicado","Apenas o preservativo pode ser usado"],correta:1,coment:"Enxaqueca COM aura é categoria 4 para métodos combinados em QUALQUER idade, pelo risco de AVC isquêmico. A conduta é retirar o estrogênio: progestágeno isolado, implante, DIU de cobre ou SIU de levonorgestrel são opções seguras."},
  {id:"go_contra_q2",area:"GO",tema:"Contracepção e planejamento reprodutivo",transv:[],dif:2,premium:false,enun:"Adolescente de 17 anos, nuligesta, sexualmente ativa, deseja um método de alta eficácia e refere dificuldade em lembrar da pílula. Conduta?",alts:["Contraindicar DIU por ser nuligesta e adolescente","Oferecer LARC (DIU ou implante): não são contraindicados em nuligestas nem em adolescentes e independem da adesão diária — associar preservativo (dupla proteção)","Manter a pílula e reforçar a orientação","Indicar apenas tabelinha"],correta:1,coment:"O mito de que DIU não pode em nuligesta/adolescente é uma das alternativas erradas mais cobradas. LARC são elegíveis, têm eficácia >99% e não dependem de memória — indicação ideal nesse caso. O preservativo entra para prevenir IST (dupla proteção)."},
  {id:"go_contra_q3",area:"GO",tema:"Contracepção e planejamento reprodutivo",transv:[],dif:2,premium:false,enun:"Mulher procura a UBS 48 horas após relação desprotegida. Sobre a contracepção de emergência, é correto afirmar:",alts:["Não há mais nada a fazer após 24 horas","Levonorgestrel 1,5 mg pode ser usado em até 5 dias (quanto antes, mais eficaz); age inibindo/atrasando a OVULAÇÃO e NÃO é abortivo — o DIU de cobre é a emergência mais eficaz","É abortiva e não pode ser oferecida no SUS","Só pode ser usada com receita de especialista"],correta:1,coment:"A contracepção de emergência com levonorgestrel 1,5 mg é indicada em até 5 dias, com eficácia maior quanto mais precoce. O mecanismo é inibir ou atrasar a ovulação — não interrompe gravidez implantada, logo não é abortiva. O DIU de cobre é a opção de emergência mais eficaz e já permanece como método contínuo."},
  {id:"go_contra_q4",area:"GO",tema:"Contracepção e planejamento reprodutivo",transv:[],dif:2,premium:false,enun:"Mulher de 23 anos, sem filhos, solicita laqueadura tubária. Segundo a Lei 9.263/1996 com as alterações da Lei 14.443/2022, é correto:",alts:["Só é permitida a partir dos 25 anos e com dois filhos vivos","É permitida a partir de 21 anos (ou com 2 filhos vivos), respeitado o prazo mínimo de 60 dias entre a manifestação da vontade e o ato, SEM necessidade de consentimento do cônjuge","Exige obrigatoriamente autorização do marido","É proibida a qualquer mulher sem filhos"],correta:1,coment:"A Lei 14.443/2022 alterou a Lei do Planejamento Familiar: idade mínima de 21 anos (ou 2 filhos vivos), prazo mínimo de 60 dias entre a manifestação e o procedimento, dispensa do consentimento do cônjuge e permissão da esterilização durante o parto/cesárea."},

  {id:"go_corr_q1",area:"GO",tema:"Corrimentos, úlceras genitais e DIP",transv:[],dif:2,premium:false,enun:"Mulher com corrimento branco-acinzentado, homogêneo, com odor de peixe que piora após a relação, SEM prurido. pH vaginal 5,5, teste das aminas positivo e clue cells. Diagnóstico e conduta?",alts:["Candidíase; fluconazol e tratar parceiro","Vaginose bacteriana; metronidazol e NÃO tratar o parceiro","Tricomoníase; metronidazol e tratar o parceiro","Cervicite gonocócica; ceftriaxona"],correta:1,coment:"Odor de peixe, corrimento acinzentado homogêneo, pH >4,5, aminas positivo e clue cells = vaginose bacteriana — desequilíbrio de flora, sem inflamação (por isso sem prurido importante). Trata-se com metronidazol e NÃO se trata a parceria."},
  {id:"go_corr_q2",area:"GO",tema:"Corrimentos, úlceras genitais e DIP",transv:[],dif:2,premium:false,enun:"Paciente com corrimento branco, grumoso ('leite coalhado'), sem odor, com prurido vulvar intenso e hiperemia. pH vaginal 4,0. Diagnóstico?",alts:["Vaginose bacteriana","Candidíase vulvovaginal — note o pH NORMAL, que a diferencia das demais","Tricomoníase","Doença inflamatória pélvica"],correta:1,coment:"Corrimento grumoso, sem odor, com prurido intenso e pH NORMAL (<4,5) caracteriza candidíase. Vaginose e tricomoníase cursam com pH >4,5. Vale investigar fatores predisponentes: diabetes, antibiótico recente, gestação, imunossupressão."},
  {id:"go_corr_q3",area:"GO",tema:"Corrimentos, úlceras genitais e DIP",transv:[],dif:2,premium:false,enun:"Mulher de 24 anos com dor em hipogástrio, dor à mobilização do colo uterino e dor anexial bilateral ao toque. Afebril, bom estado geral. Conduta?",alts:["Aguardar cultura endocervical antes de tratar","Iniciar tratamento EMPÍRICO de DIP: os critérios mínimos já estão presentes e o atraso custa fertilidade","Apenas analgesia e reavaliar em 7 dias","Indicar histerectomia"],correta:1,coment:"Dor pélvica + dor à mobilização do colo + dor anexial são os critérios MÍNIMOS de DIP e autorizam o tratamento empírico imediato. Não se espera confirmação: o preço de não tratar é infertilidade, gravidez ectópica e dor pélvica crônica. Interna-se se gestante, abscesso tubo-ovariano, quadro grave, falha ambulatorial, impossibilidade de seguimento ou dúvida diagnóstica."},
  {id:"go_corr_q4",area:"GO",tema:"Corrimentos, úlceras genitais e DIP",transv:[],dif:2,premium:false,enun:"Homem com úlcera genital ÚNICA, INDOLOR, de fundo limpo e base endurecida, com adenopatia inguinal que não supura. Diagnóstico e tratamento?",alts:["Cancro mole; azitromicina","Cancro duro (sífilis primária); penicilina benzatina","Herpes genital; aciclovir","Donovanose; doxiciclina"],correta:1,coment:"Úlcera ÚNICA, INDOLOR, fundo limpo e base endurecida = cancro duro da sífilis primária → penicilina benzatina. O cancro mole dá úlceras MÚLTIPLAS e DOLOROSAS, de fundo sujo, com bubão que supura. Herpes vem precedido de vesículas agrupadas."},

  {id:"go_sua_q1",area:"GO",tema:"Sangramento uterino anormal",transv:[],dif:2,premium:false,enun:"Mulher de 32 anos, em idade fértil, chega com sangramento vaginal aumentado há 5 dias. Qual o PRIMEIRO passo?",alts:["Solicitar histeroscopia","Dosar beta-hCG para excluir gravidez e avaliar a estabilidade hemodinâmica","Iniciar anticoncepcional imediatamente","Indicar histerectomia"],correta:1,coment:"Em toda mulher em idade fértil com sangramento, o primeiro passo é excluir gravidez (beta-hCG) — abortamento, gestação ectópica e doença trofoblástica se apresentam assim. Em paralelo, avalia-se estabilidade hemodinâmica."},
  {id:"go_sua_q2",area:"GO",tema:"Sangramento uterino anormal",transv:[],dif:2,premium:false,enun:"Mulher de 58 anos, na menopausa há 6 anos, apresenta sangramento vaginal. Conduta?",alts:["Tranquilizar: pode ser uma 'menstruação atrasada'","Investigar: sangramento na pós-menopausa é CÂNCER DE ENDOMÉTRIO até prova em contrário — USG transvaginal e, se eco endometrial >4-5 mm, biópsia/histeroscopia","Prescrever terapia hormonal","Repetir avaliação em 1 ano"],correta:1,coment:"Sangramento após a menopausa nunca é normal: é câncer de endométrio até prova em contrário. Investiga-se com USG transvaginal, medindo o eco endometrial; espessura acima de 4-5 mm indica amostragem (biópsia ou histeroscopia, esta o padrão-ouro)."},
  {id:"go_sua_q3",area:"GO",tema:"Sangramento uterino anormal",transv:[],dif:2,premium:false,enun:"Adolescente de 14 anos com sangramento menstrual muito intenso DESDE A MENARCA, com anemia. Além da anovulação por imaturidade do eixo, o que não pode deixar de ser investigado?",alts:["Câncer de endométrio","COAGULOPATIA — sobretudo doença de von Willebrand","Menopausa precoce","Mioma submucoso gigante"],correta:1,coment:"Sangramento intenso desde a MENARCA levanta a suspeita de coagulopatia, e a doença de von Willebrand é a mais comum e subdiagnosticada. É a letra 'C' do PALM-COEIN e não pode ser atribuída apenas à imaturidade do eixo."},
  {id:"go_sua_q4",area:"GO",tema:"Sangramento uterino anormal",transv:[],dif:2,premium:false,enun:"Na classificação FIGO PALM-COEIN, quais causas compõem o grupo PALM?",alts:["Coagulopatia, Ovulatória, Endometrial, Iatrogênica","Causas ESTRUTURAIS: Pólipo, Adenomiose, Leiomioma e Malignidade/hiperplasia","Apenas causas hormonais","Somente causas medicamentosas"],correta:1,coment:"PALM reúne as causas ESTRUTURAIS (visíveis à imagem): Pólipo, Adenomiose, Leiomioma e Malignidade/hiperplasia. COEIN reúne as NÃO estruturais: Coagulopatia, disfunção Ovulatória, Endometrial, Iatrogênica e Não classificada."},

  {id:"go_clim_q1",area:"GO",tema:"Climatério e menopausa",transv:[],dif:2,premium:false,enun:"Mulher de 51 anos com fogachos e irregularidade menstrual há 1 ano. Como se confirma a menopausa?",alts:["Dosando FSH imediatamente","É diagnóstico CLÍNICO e RETROSPECTIVO: após 12 meses consecutivos de amenorreia; acima de 45 anos com sintomas típicos não é necessário dosar FSH","Por ultrassonografia transvaginal","Por biópsia de endométrio"],correta:1,coment:"Menopausa é a última menstruação, reconhecida retrospectivamente após 12 meses de amenorreia. Em mulher acima de 45 anos com sintomas típicos, o diagnóstico é clínico — pedir FSH de rotina é desnecessário. Abaixo de 40 anos, pensa-se em insuficiência ovariana prematura."},
  {id:"go_clim_q2",area:"GO",tema:"Climatério e menopausa",transv:[],dif:2,premium:false,enun:"Mulher de 52 anos, COM útero, menopausa há 2 anos, com fogachos intensos e sem contraindicações. Qual esquema de terapia hormonal é adequado?",alts:["Estrogênio isolado","Estrogênio ASSOCIADO a progestágeno — o progestágeno protege o endométrio","Progestágeno isolado sempre","Nenhuma TH, pois já passaram 2 anos"],correta:1,coment:"Mulher com útero exige estrogênio + progestágeno: o progestágeno protege o endométrio, pois estrogênio sem oposição causa hiperplasia e câncer de endométrio. Estrogênio isolado é só para histerectomizadas. E ela está dentro da janela de oportunidade (<60 anos e <10 anos de menopausa)."},
  {id:"go_clim_q3",area:"GO",tema:"Climatério e menopausa",transv:[],dif:2,premium:false,enun:"O que significa a 'janela de oportunidade' na terapia hormonal do climatério?",alts:["Só se pode usar TH durante o primeiro ano de menopausa","Iniciar a TH antes dos 60 anos OU dentro de 10 anos da menopausa, quando o benefício supera o risco em mulheres sem contraindicação","Que a TH deve ser usada por toda a vida","Que a TH só serve para osteoporose"],correta:1,coment:"As reanálises do WHI mostraram que o risco dependia de QUEM era tratada: iniciar TH em mulheres já idosas e distantes da menopausa desloca a relação risco/benefício. Dentro da janela (<60 anos ou <10 anos de menopausa), em mulher sem contraindicação, o benefício supera o risco para sintomas vasomotores moderados a graves."},
  {id:"go_clim_q4",area:"GO",tema:"Climatério e menopausa",transv:[],dif:2,premium:false,enun:"Paciente com antecedente de câncer de mama apresenta secura vaginal intensa, dispareunia e ITU de repetição. Conduta mais adequada?",alts:["Terapia hormonal sistêmica com estrogênio","Estrogênio VAGINAL de baixa dose e lubrificantes/hidratantes — a absorção sistêmica é mínima e a síndrome geniturinária é progressiva, não melhora sozinha","Apenas orientar e aguardar melhora espontânea","Progestágeno sistêmico em alta dose"],correta:1,coment:"A TH sistêmica é contraindicada no câncer de mama. Já a síndrome geniturinária da menopausa é PROGRESSIVA e exige tratamento: o estrogênio vaginal em baixa dose tem absorção sistêmica mínima e bom perfil de segurança, somando-se a lubrificantes e hidratantes. Aguardar melhora espontânea não é conduta — esse grupo de sintomas piora com o tempo."},
  {id:"cm_tir_q1",area:"CM",tema:"Distúrbios da tireoide",transv:[],dif:2,premium:false,enun:"Mulher de 42 anos, assintomática, com TSH de 6,8 mUI/L e T4 livre NORMAL, anti-TPO negativo, sem desejo de engravidar. Conduta?",alts:["Iniciar levotiroxina imediatamente","Hipotireoidismo SUBCLÍNICO sem critério de tratamento: acompanhar e repetir o exame — trata-se se TSH >10, sintomas, anti-TPO+, gestação ou planejamento","Solicitar cintilografia","Iniciar metimazol"],correta:1,coment:"TSH alto com T4 livre normal define hipotireoidismo subclínico, e não se trata todo mundo. Indicações de tratar: TSH acima de 10, presença de sintomas, anti-TPO positivo, gestação ou planejamento de gestação. Fora disso, acompanha-se."},
  {id:"cm_tir_q2",area:"CM",tema:"Distúrbios da tireoide",transv:[],dif:2,premium:false,enun:"Paciente em uso de levotiroxina por hipotireoidismo descobre que está grávida de 8 semanas. Conduta quanto à medicação?",alts:["Suspender a levotiroxina durante a gestação","AUMENTAR a dose (cerca de 30%) e usar metas de TSH mais rígidas — jamais suspender, pelo risco ao neurodesenvolvimento fetal","Trocar por metimazol","Manter exatamente a mesma dose sem controle"],correta:1,coment:"A gestação aumenta a demanda de hormônio tireoidiano: a dose de levotiroxina deve SUBIR (~30%), com metas de TSH mais rígidas por trimestre. Hipotireoidismo não tratado na gestante prejudica o neurodesenvolvimento fetal. Suspender é erro grave."},
  {id:"cm_tir_q3",area:"CM",tema:"Distúrbios da tireoide",transv:[],dif:2,premium:false,enun:"Homem de 35 anos com dor cervical anterior, febre baixa após quadro viral, TSH suprimido e T4 livre alto. Cintilografia mostra captação BAIXA. Diagnóstico e tratamento?",alts:["Doença de Graves; metimazol","Tireoidite subaguda; anti-inflamatório e betabloqueador — antitireoidiano NÃO funciona, pois o hormônio é liberado do estoque e não produzido","Bócio multinodular tóxico; iodo radioativo","Crise tireotóxica; tionamida em alta dose"],correta:1,coment:"Tireoide dolorosa após quadro viral, com hipertireoidismo e captação BAIXA à cintilografia, é tireoidite subaguda: a glândula rompeu e liberou hormônio pré-formado. Antitireoidiano não tem o que bloquear — trata-se com AINE e betabloqueador. Graves capta MUITO e cursa com oftalmopatia/TRAb+."},
  {id:"cm_tir_q4",area:"CM",tema:"Distúrbios da tireoide",transv:[],dif:2,premium:false,enun:"Paciente com doença de Graves em uso de metimazol há 3 semanas procura o PS com febre e dor de garganta intensa. Conduta?",alts:["Prescrever sintomáticos: é uma virose comum","SUSPENDER o metimazol e solicitar hemograma com URGÊNCIA — suspeita de agranulocitose","Dobrar a dose do metimazol","Iniciar iodo radioativo imediatamente"],correta:1,coment:"Febre e dor de garganta em paciente usando tionamida (metimazol/propiltiouracil) é sinal de alarme para AGRANULOCITOSE: suspende-se a droga e faz-se hemograma de urgência. Tratar como virose comum pode ser fatal."},

  {id:"cm_anem_q1",area:"CM",tema:"Anemias",transv:[],dif:2,premium:false,enun:"Homem de 58 anos, assintomático, com anemia microcítica e ferritina baixa em exame de rotina. Qual a conduta ESSENCIAL além de repor ferro?",alts:["Apenas repor ferro e reavaliar em 1 ano","INVESTIGAR o trato gastrointestinal: em homem adulto, anemia ferropriva é sangramento até prova em contrário (atenção ao câncer colorretal)","Iniciar transfusão","Solicitar eletroforese de hemoglobina apenas"],correta:1,coment:"Homem adulto ou mulher pós-menopausa com anemia ferropriva tem sangramento crônico até prova em contrário — a investigação do TGI é obrigatória, com destaque para câncer colorretal. Repor ferro sem investigar mascara um diagnóstico grave."},
  {id:"cm_anem_q2",area:"CM",tema:"Anemias",transv:[],dif:2,premium:false,enun:"Idoso com anemia macrocítica, neutrófilos hipersegmentados, parestesias e marcha atáxica. Qual erro deve ser evitado?",alts:["Dosar B12 e folato antes de repor","Repor FOLATO isoladamente: corrige a anemia e MASCARA a deficiência de B12, enquanto a lesão neurológica progride (podendo ser irreversível)","Investigar anemia perniciosa","Suspender metformina se for o caso"],correta:1,coment:"Sintomas neurológicos apontam deficiência de B12 (o folato não os causa). Repor folato isolado corrige o hemograma e dá falsa segurança, enquanto a degeneração combinada subaguda avança. Sempre dosar e repor B12 antes."},
  {id:"cm_anem_q3",area:"CM",tema:"Anemias",transv:[],dif:2,premium:false,enun:"Criança de 8 anos com doença falciforme chega ao PS com crise álgica intensa em membros. Conduta?",alts:["Analgesia com dipirona apenas, evitando opioide pelo risco de dependência","HIDRATAÇÃO + ANALGESIA POTENTE (incluindo opioide) + O2 se hipoxemia — subtratar a dor é o erro clássico nessa população","Transfusão de rotina em toda crise álgica","Antibiótico para todas as crises"],correta:1,coment:"A crise vaso-oclusiva exige hidratação e analgesia adequada, com opioide quando a dor é intensa. O receio infundado de dependência leva ao subtratamento sistemático de pacientes falciformes — erro documentado e cobrado."},
  {id:"cm_anem_q4",area:"CM",tema:"Anemias",transv:[],dif:2,premium:false,enun:"Qual conjunto laboratorial sugere HEMÓLISE?",alts:["Reticulócitos baixos, LDH baixo, haptoglobina alta","Reticulócitos ALTOS, LDH alto, bilirrubina INDIRETA alta e haptoglobina BAIXA","Ferritina baixa e TIBC alta","VCM baixo com RDW normal"],correta:1,coment:"Na hemólise a medula responde (reticulócitos altos), há liberação de conteúdo celular (LDH alto), aumento de bilirrubina indireta e consumo de haptoglobina (que fica baixa). O Coombs direto separa as hemólises imunes das não imunes."},

  {id:"cm_drc_q1",area:"CM",tema:"Doença renal crônica",transv:[],dif:2,premium:false,enun:"Diabético tipo 2, TFG estimada de 95 mL/min, com relação albumina/creatinina urinária de 120 mg/g confirmada em duas amostras ao longo de 4 meses. É correto afirmar:",alts:["Não tem doença renal, pois a TFG está normal","TEM DRC: o diagnóstico se faz por TFG <60 OU por marcador de lesão (albuminúria) mantido por ≥3 meses, mesmo com TFG normal — estágio G1/A2","Precisa de urina de 24h para confirmar","Deve iniciar diálise"],correta:1,coment:"DRC é definida por alteração estrutural ou funcional por ≥3 meses: TFG <60 OU marcador de lesão. Albuminúria persistente com TFG normal já é DRC (G1, A2). A amostra isolada com relação albumina/creatinina é o padrão — não é preciso urina de 24h."},
  {id:"cm_drc_q2",area:"CM",tema:"Doença renal crônica",transv:[],dif:2,premium:false,enun:"Paciente com DRC e albuminúria inicia IECA. Após 2 semanas, a creatinina subiu de 1,3 para 1,6 mg/dL (cerca de 23%), com potássio normal. Conduta?",alts:["Suspender o IECA imediatamente por nefrotoxicidade","MANTER: elevação de até ~30% da creatinina ao iniciar IECA/BRA é ESPERADA e reflete a queda desejada da pressão intraglomerular","Trocar por AINE","Encaminhar para diálise"],correta:1,coment:"O aumento de até cerca de 30% da creatinina após iniciar IECA/BRA é esperado e não indica suspensão — decorre da redução da pressão intraglomerular, que é justamente o efeito protetor. Reavalia-se se a elevação for maior ou se houver hipercalemia importante."},
  {id:"cm_drc_q3",area:"CM",tema:"Doença renal crônica",transv:[],dif:2,premium:false,enun:"Qual classe farmacológica, incorporada como pilar do tratamento da DRC, reduz a progressão da doença renal e eventos cardiovasculares INCLUSIVE em pacientes NÃO diabéticos?",alts:["Anti-inflamatórios não esteroidais","Inibidores de SGLT2 (dapagliflozina, empagliflozina)","Aminoglicosídeos","Diuréticos de alça"],correta:1,coment:"Os iSGLT2 consolidaram-se como pilar da nefroproteção, reduzindo progressão da DRC e desfechos cardiovasculares mesmo em não diabéticos. AINEs e aminoglicosídeos, ao contrário, são nefrotóxicos e devem ser evitados."},
  {id:"cm_drc_q4",area:"CM",tema:"Doença renal crônica",transv:[],dif:2,premium:false,enun:"Sobre a indicação de diálise na DRC, é correto afirmar:",alts:["Deve ser iniciada quando a creatinina ultrapassa determinado valor fixo","Indica-se por SÍNDROME URÊMICA ou complicações refratárias ao tratamento clínico (hipercalemia grave, acidose grave, hipervolemia/EAP, pericardite, encefalopatia) — não por um número isolado","É indicada a todos com TFG <60","Depende exclusivamente da idade do paciente"],correta:1,coment:"A decisão de dialisar é CLÍNICA: síndrome urêmica ou complicações refratárias. Nenhum valor isolado de creatinina indica diálise por si só. TFG <30 (G4) é critério de referência ao nefrologista, não de diálise imediata."},
