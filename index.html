   raciocinio:["Separe pela metade da gestação: 1ª metade (aborto, ectópica, mola) x 2ª metade (DPP x PP).","Dor + útero hipertônico + sangue escuro + sofrimento fetal + fator de risco = DPP (emergência).","Sangue vivo, indolor, sem hipertonia, de repetição = placenta prévia.","Suspeita de PP: NÃO fazer toque vaginal antes do ultrassom.","Dor pélvica + atraso + beta-hCG positivo = investigar ectópica (beta seriado + US transvaginal)."],
   nucleo:["1ª metade: abortamento, ectópica, mola. 2ª metade: DPP x placenta prévia.","DPP: dor + hipertonia uterina + sangue escuro + sofrimento fetal.","PP: sangramento vivo, indolor, de repetição; não tocar antes do US.","Ectópica: beta-hCG + US transvaginal."],
   pega:"Na suspeita de placenta prévia, NUNCA fazer toque vaginal antes do ultrassom (risco de hemorragia maciça).",mne:"PP = sangue vivo, sem dor. DPP = dor + útero duro.",sus:"Identificação e referência rápida ao pré-natal de alto risco."},
  {id:"go-hpp",area:"GO",nome:"Hemorragia pós-parto",yield:3,
   questoes:["go_hpp_q1","go_hpp_q2","go_hpp_q3","go_hpp_q4"],
   fonte:"Zero Morte Materna por Hemorragia (OPAS/OMS); Diretrizes de manejo da HPP (Ministério da Saúde/FEBRASGO); protocolos estaduais de HPP.",
   aula:["Hemorragia pós-parto (HPP) é uma das principais causas de morte materna e, felizmente, muito evitável quando se age rápido e na ordem certa. Para não travar na hora, memorize as causas pelos '4 Ts': Tônus (útero que não contrai — atonia), Trauma (lacerações do canal), Tecido (restos placentários retidos) e Trombina (distúrbios de coagulação). Cada T tem uma conduta, mas um deles domina as estatísticas.","A atonia uterina é a causa nº 1 de HPP. Depois do parto, o útero precisa contrair firmemente para 'estrangular' os vasos que irrigavam a placenta — é essa contração que estanca o sangramento. Quando o útero fica amolecido e mal contraído (atônico), esses vasos continuam abertos e a paciente sangra muito. No exame, o sinal é clássico: útero amolecido e acima da cicatriz umbilical, com sangramento abundante.","Diante de HPP por atonia, a conduta é escalonada e começa simples: massagem uterina bimanual (manobra de Hamilton, que estimula a contração) somada a uterotônicos, sendo a OCITOCINA a primeira escolha. Junto, e precocemente (na chamada hora de ouro, a 1ª hora), administra-se o ÁCIDO TRANEXÂMICO 1 g EV, que reduz a mortalidade por sangramento e pode ser repetido após 30 minutos. Se a ocitocina não resolve, escalona-se para outros uterotônicos: derivados do ergot (metilergometrina — CONTRAINDICADA na hipertensão/pré-eclâmpsia) e o misoprostol. Persistindo, parte-se para balão intrauterino de tamponamento, suturas/ligaduras cirúrgicas e, como último recurso, a histerectomia. O erro comum é pular a etapa inicial — massagem + ocitocina (+ tranexâmico) resolvem a maioria.","A prevenção é tão importante quanto o tratamento: o manejo ativo do terceiro período do parto (ocitocina profilática logo após a saída do bebê, tração controlada do cordão) reduz muito a HPP. Na prova, o raciocínio é: sangramento pós-parto + útero amolecido = atonia; primeira medida = massagem + ocitocina. E sempre começar investigando o T mais provável (tônus) antes de pensar em laceração ou retenção."],
   raciocinio:["Diante de sangramento pós-parto, pense nos 4 Ts: Tônus, Trauma, Tecido, Trombina.","Examine o útero: amolecido e alto = atonia (o T mais comum).","Comece pelo básico: massagem uterina bimanual + ocitocina + ácido tranexâmico 1g EV precoce (hora de ouro).","Não resolveu? Escalone: outros uterotônicos → balão → cirurgia.","Lembre da prevenção: manejo ativo do 3º período (ocitocina profilática)."],
   nucleo:["Causas de HPP = 4 Ts: Tônus (atonia), Trauma, Tecido, Trombina.","Atonia é a 1ª causa; sinal: útero amolecido e acima da cicatriz umbilical.","Inicial: massagem bimanual + ocitocina + ácido tranexâmico 1g EV precoce. Escalona: ergot (não na HAS) → misoprostol → balão → cirurgia.","Prevenção: manejo ativo do 3º período (ocitocina profilática)."],
   pega:"Comece sempre pela atonia (útero amolecido) — massagem + ocitocina — antes de investigar laceração ou retenção.",mne:"HPP = os 4 Ts. Atonia primeiro.",sus:"Protocolo de HPP e 'kit hemorragia' nas maternidades do SUS."},
  {id:"go-rastreio",area:"GO",nome:"Rastreio CA colo e mama",yield:2,
   questoes:["go_rastreio_q1","go_rastreio_q2","go_rastreio_q3","go_rastreio_q4"],
   fonte:"Diretrizes Brasileiras para o Rastreamento do Câncer do Colo do Útero – Parte I (Portaria SAES/SECTICS nº 13, de 29/07/2025, MS/INCA); Rastreamento de câncer de mama – Nota Técnica MS/INCA (2025).",
   aula:["O rastreamento busca a doença em pessoas SEM sintomas, na faixa etária e no intervalo em que comprovadamente reduz mortalidade. Fazer certo é tão importante quanto não fazer errado: rastrear fora da faixa ou com intervalo errado gera dano (sobrediagnóstico, exames e tratamentos desnecessários). Por isso os números caem literalmente na prova — e mudaram recentemente, então atenção às diretrizes vigentes.",
     "Câncer de colo do útero — MUDANÇA IMPORTANTE (Diretriz MS 2025). O método primário passou a ser o TESTE DE DNA-HPV oncogênico (não mais a citologia), na faixa dos 25 aos 64 anos. Após um teste NEGATIVO, o intervalo é de 5 anos (a maior sensibilidade do teste permite espaçar com segurança). Não se rastreia antes dos 25 anos, pois nessa idade predominam infecções transitórias e lesões que regridem — rastrear cedo causa mais dano que benefício. O rastreamento se encerra quando o último teste, feito acima dos 60 anos, é negativo.",
     "Ainda no colo, o que fazer com o teste POSITIVO (noção geral): se vier HPV 16 ou 18 (os mais oncogênicos), encaminha-se direto para colposcopia. Se vier outro tipo oncogênico (diferente de 16/18), faz-se a citologia reflexa na mesma amostra — se ela vier alterada, colposcopia; se normal, repete-se o teste em 1 ano. Importante para a transição: onde o teste de DNA-HPV ainda NÃO está disponível, mantém-se o rastreamento pela CITOLOGIA (Papanicolau) a cada 3 anos, após dois exames anuais consecutivos normais. Ou seja, as duas realidades convivem hoje conforme a região.",
     "Câncer de mama. O rastreamento populacional é a MAMOGRAFIA a cada 2 anos (bienal). A faixa etária clássica do INCA é 50 a 69 anos; em 2025 o Ministério da Saúde ampliou o rastreamento organizado para 50 a 74 anos. Para mulheres de 40 a 49 anos, a mamografia pode ser feita por demanda/decisão médica após esclarecer riscos e benefícios — não é rastreamento populacional de rotina. Fora dessas faixas, o rastreamento populacional não é recomendado. (Sociedades como FEBRASGO/SBM defendem início aos 40 anualmente — é a divergência que pode aparecer na prova.)",
     "O raciocínio-chave: memorize as faixas e intervalos ATUAIS e desconfie de alternativas que rastreiam em EXCESSO (citológico anual para sempre, mamografia anual dos 40 aos 70 sem indicação, rastrear colo aos 20 anos). E lembre da transição do colo: DNA-HPV a cada 5 anos onde disponível; citologia trienal onde ainda não chegou. A banca cobra tanto o número certo quanto o reconhecimento do excesso como erro."],
   raciocinio:["Rastreamento é para assintomáticos, na faixa e intervalo que reduzem mortalidade.",
     "Colo (diretriz 2025): DNA-HPV oncogênico, 25 a 64 anos, a cada 5 anos após teste negativo.",
     "Onde o DNA-HPV ainda não chegou: citologia a cada 3 anos após 2 anuais normais (transição).",
     "Não iniciar rastreio de colo antes dos 25 anos.",
     "Mama: mamografia bienal; 50-69 (INCA) / ampliada para 50-74 (MS 2025); 40-49 por decisão médica.",
     "Desconfie de alternativas que rastreiam em excesso (fora da faixa/intervalo)."],
   nucleo:["Colo (MS 2025): teste de DNA-HPV oncogênico, 25-64 anos, a cada 5 anos se negativo.",
     "Transição: onde não há DNA-HPV, mantém citologia trienal após 2 anuais normais.",
     "HPV 16/18 → colposcopia direta; outros tipos → citologia reflexa.",
     "Mama: mamografia bienal, 50-69 (INCA) / 50-74 (MS 2025); 40-49 por decisão médica.",
     "Não rastrear fora da faixa/intervalo."],
   pega:"O colo mudou: DNA-HPV a cada 5 anos (25-64), não mais citologia trienal como padrão — mas a citologia trienal segue valendo onde o teste molecular ainda não chegou. Não iniciar antes dos 25.",
   mne:"Colo: DNA-HPV 25-64 / 5 anos. Mama: mamografia 50-69(74) / 2 anos.",
   sus:"Rastreamento organizado no SUS (INCA); transição do Papanicolau para DNA-HPV em curso desde 2025."},
  {id:"go-preeclampsia",area:"GO",nome:"Síndromes hipertensivas da gestação",yield:3,
   questoes:["go_pe_q1","go_pe_q2","go_pe_q3","go_pe_q4"],
   fonte:"Manual de Gestação de Alto Risco (Ministério da Saúde, 2022 e atualizações); Protocolo de Pré-eclâmpsia (FEBRASGO); Recomendações da OMS/OPAS para uso do sulfato de magnésio; Diretriz ACOG de Hipertensão na Gestação (Practice Bulletin).",
   aula:["As síndromes hipertensivas são a principal causa de morte materna no Brasil — e quase toda morte por elas é evitável. Antes de qualquer conduta, é preciso classificar, e o divisor de águas é a marca das 20 SEMANAS. São quatro categorias. HIPERTENSÃO CRÔNICA: já existia antes da gestação ou aparece ANTES de 20 semanas. HIPERTENSÃO GESTACIONAL: surge APÓS 20 semanas, isolada, sem proteinúria e sem lesão de órgão. PRÉ-ECLÂMPSIA: surge após 20 semanas com proteinúria ou disfunção de órgão-alvo. PRÉ-ECLÂMPSIA SOBREPOSTA: a hipertensa crônica que piora e desenvolve pré-eclâmpsia. Antes de 20 semanas com pressão alta = crônica; depois de 20 = gestacional ou pré-eclâmpsia, conforme haja ou não repercussão.",
     "A definição de pré-eclâmpsia mudou, e a banca cobra a mudança: a PROTEINÚRIA NÃO É MAIS OBRIGATÓRIA. Fecha-se pré-eclâmpsia com PA ≥ 140/90 mmHg após 20 semanas MAIS um dos dois: (a) proteinúria — ≥ 300 mg em 24h, ou relação proteína/creatinina urinária ≥ 0,3, ou fita reagente 1+; OU (b), na AUSÊNCIA de proteinúria, disfunção de órgão-alvo: plaquetas < 100.000, creatinina > 1,1 mg/dL (ou o dobro do basal), transaminases o dobro do normal, edema agudo de pulmão, ou sintomas cerebrais/visuais. Por trás disso há uma doença da PLACENTA: a invasão trofoblástica falha, a placenta isquêmica libera fatores que agridem o endotélio da mãe inteira — por isso a doença bate no rim, no fígado, no cérebro e no pulmão, e não só na pressão.",
     "Reconhecer GRAVIDADE é o que define o ritmo. São sinais de gravidade: PA sistólica ≥ 160 ou diastólica ≥ 110; cefaleia persistente que não cede; escotomas, turvação visual ou fotofobia; dor epigástrica ou em hipocôndrio direito (fígado distendido — sinal traiçoeiro, frequentemente confundido com gastrite); plaquetopenia; alteração de função renal ou hepática; e edema agudo de pulmão. Duas complicações fecham o quadro: a síndrome HELLP (Hemólise + Elevação de enzimas hepáticas + Low Platelets — plaquetopenia), que pode ocorrer até sem hipertensão exuberante; e a ECLÂMPSIA, que é a convulsão tônico-clônica na pré-eclâmpsia, sem outra causa.",
     "Agora o núcleo absoluto da prova: são DOIS eixos de tratamento que NUNCA se confundem. (1) SULFATO DE MAGNÉSIO — serve para PREVENIR e TRATAR a convulsão. Ele NÃO é anti-hipertensivo e não baixa a pressão; quem marca 'sulfato para controlar a PA' erra. Esquemas: Pritchard (4 g EV de ataque + 10 g IM, manutenção 5 g IM de 4/4h) ou Zuspan (4 g EV de ataque + 1 a 2 g/h EV em bomba). Monitorização obrigatória do risco de intoxicação, pelo tripé: reflexo patelar PRESENTE, frequência respiratória ≥ 16 irpm e diurese ≥ 25-30 mL/h. Antídoto: GLUCONATO DE CÁLCIO 10% EV. (2) ANTI-HIPERTENSIVO — para a emergência (PA ≥ 160/110), usa-se hidralazina, nifedipino ou labetalol, com redução CONTROLADA (baixar demais reduz a perfusão placentária). Para manutenção: metildopa, nifedipino. E o que jamais se prescreve na gestante: IECA e BRA, que são fetotóxicos.",
     "O tratamento DEFINITIVO da pré-eclâmpsia é o PARTO — retirar a placenta é curar a doença. A decisão do momento equilibra mãe e prematuridade: gestação a termo (≥ 37 semanas) com pré-eclâmpsia = parto; com sinais de GRAVIDADE a partir de 34 semanas = parto; abaixo de 34 semanas, tenta-se conduta expectante em centro terciário, com corticoide para maturação pulmonar fetal, desde que mãe e feto permitam. Eclâmpsia, HELLP ou descontrole materno = interromper, mas ESTABILIZANDO A MÃE PRIMEIRO — não se corre para a cesárea com a paciente convulsionando: sulfato, via aérea, controle pressório, depois o parto. Outra pegadinha: pré-eclâmpsia NÃO é indicação automática de cesárea; a via é obstétrica. Por fim, a PREVENÇÃO, que cai muito: AAS em dose baixa (100 mg/dia, faixa 75-150) iniciado entre 12 e 16 semanas nas gestantes de alto risco, associado a suplementação de cálcio onde a ingesta é baixa — realidade da maioria da população brasileira."],
   raciocinio:["Marque as 20 semanas: PA alta ANTES = hipertensão crônica; DEPOIS = gestacional ou pré-eclâmpsia.",
     "Pré-eclâmpsia = PA ≥140/90 após 20 sem + proteinúria OU disfunção de órgão-alvo (proteinúria não é obrigatória).",
     "Procure sinais de gravidade: PA ≥160/110, cefaleia, escotomas, dor epigástrica, plaquetopenia, edema pulmonar.",
     "Convulsão = eclâmpsia → SULFATO DE MAGNÉSIO (não é anti-hipertensivo). Monitore reflexo patelar, FR ≥16 e diurese; antídoto = gluconato de cálcio.",
     "PA ≥160/110 → anti-hipertensivo de emergência (hidralazina/nifedipino/labetalol), redução controlada. Nunca IECA/BRA.",
     "Defina o parto: ≥37 sem = parto; grave ≥34 sem = parto; <34 sem = expectante + corticoide em centro terciário.",
     "Estabilize a mãe ANTES de interromper. E lembre da prevenção: AAS 100 mg a partir de 12-16 sem no alto risco + cálcio."],
   nucleo:["Classificação pelas 20 semanas: crônica (antes) x gestacional/pré-eclâmpsia (depois) x sobreposta.",
     "Pré-eclâmpsia: PA ≥140/90 após 20 sem + proteinúria (≥300mg/24h, P/C ≥0,3 ou fita 1+) OU disfunção de órgão-alvo. Proteinúria NÃO é obrigatória.",
     "Gravidade: PA ≥160/110, cefaleia, escotomas, dor epigástrica, plaquetopenia, alteração renal/hepática, edema pulmonar. HELLP = hemólise + enzimas + plaquetopenia.",
     "Sulfato de magnésio = anticonvulsivante (Pritchard ou Zuspan). Controle: reflexo patelar, FR ≥16, diurese ≥25-30 mL/h. Antídoto: gluconato de cálcio 10%.",
     "Anti-hipertensivo na emergência: hidralazina, nifedipino, labetalol. Manutenção: metildopa/nifedipino. IECA e BRA são PROIBIDOS.",
     "Tratamento definitivo = PARTO. ≥37 sem parto; grave ≥34 parto; <34 expectante + corticoide. Estabilizar a mãe antes.",
     "Prevenção: AAS 100 mg/dia a partir de 12-16 semanas no alto risco + cálcio."],
   pega:"Sulfato de magnésio NÃO baixa a pressão — ele previne/trata a convulsão. São dois eixos separados. E pré-eclâmpsia não é indicação automática de cesárea; a via é obstétrica.",
   mne:"HELLP = Hemólise + Enzimas (Elevadas) + Low Platelets. Intoxicação pelo sulfato: perdeu o reflexo patelar → gluconato de cálcio.",
   sus:"Principal causa de morte materna evitável; pré-natal de alto risco, sulfato disponível na maternidade e AAS profilático na APS."},

  {id:"go-partograma",area:"GO",nome:"Trabalho de parto e partograma",yield:3,
   questoes:["go_parto_q1","go_parto_q2","go_parto_q3","go_parto_q4"],
   fonte:"Diretrizes Nacionais de Assistência ao Parto Normal (Ministério da Saúde/Conitec, versão 2022); Recomendações da OMS para os cuidados intraparto para uma experiência positiva de parto (2018); Lei 11.108/2005 (acompanhante); Tratado de Obstetrícia (FEBRASGO).",
   aula:["O trabalho de parto se divide em quatro períodos: DILATAÇÃO (1º), EXPULSIVO (2º, da dilatação total ao nascimento), DEQUITAÇÃO (3º, saída da placenta) e o 4º período (Greenberg, a primeira hora após, quando se vigia a hemorragia). O primeiro período se subdivide em fase LATENTE (contrações irregulares, dilatação lenta) e fase ATIVA. E aqui está a atualização que a prova cobra: a fase ativa hoje é considerada a partir de 5 a 6 cm de dilatação — não mais dos 4 cm. Mais importante: a velha curva de Friedman, que exigia 1 cm por hora, foi SUPERADA. Sabe-se que o parto normal progride mais devagar do que se pensava, e uma dilatação lenta, com mãe e bebê bem, é normal e NÃO autoriza diagnosticar 'parada de progressão' nem indicar cesárea. Boa parte das cesáreas desnecessárias no Brasil nasceu de aplicar Friedman ao pé da letra.",
     "O mecanismo do parto é a sequência de movimentos que o feto executa para atravessar a bacia: insinuação, descida, flexão, rotação interna, desprendimento (deflexão), rotação externa e desprendimento dos ombros. A altura da apresentação é medida pelos PLANOS DE DeLEE, tendo como referência as espinhas isquiáticas — que são o plano ZERO. Acima delas, valores negativos (-1, -2, -3); abaixo, positivos (+1, +2, +3), com o polo já descendo para a saída. Junto se avalia a variedade de posição (ex.: occípito-esquerda-anterior), que diz para onde aponta a nuca do bebê.",
     "O PARTOGRAMA é o registro gráfico do trabalho de parto: dilatação, descida da apresentação, contrações, batimentos cardíacos fetais, aspecto do líquido amniótico e as intervenções. Ele tem uma LINHA DE ALERTA e, quatro horas à direita dela, uma LINHA DE AÇÃO. Cruzar a linha de alerta significa que a progressão está mais lenta que o esperado e pede reavaliação; cruzar a linha de ação exige decisão. O valor do partograma é ser um instrumento visual que evita tanto a intervenção precipitada quanto a demora perigosa. Vale saber que a OMS, em 2018, passou a questionar o partograma clássico com linha de ação rígida e propôs um novo instrumento (Labour Care Guide) — mas as diretrizes brasileiras seguem trabalhando com o partograma, então é ele que você responde na prova.",
     "As BOAS PRÁTICAS são o coração da questão de parto no ENAMED, porque a diretriz brasileira é explicitamente humanizadora. O que se DEVE fazer: garantir ACOMPANHANTE de livre escolha da mulher (é direito garantido pela Lei 11.108/2005 — negar é ilegal); permitir liberdade de POSIÇÃO e deambulação; oferecer métodos não farmacológicos de alívio da dor (banho, bola, massagem, deambulação); estimular a ingesta de líquidos; fazer o CONTATO PELE A PELE imediato; realizar o clampeamento OPORTUNO/tardio do cordão (em torno de 1 a 3 minutos, quando o bebê nasce bem — melhora as reservas de ferro); e apoiar o aleitamento na PRIMEIRA HORA de vida.",
     "E o que NÃO se faz de rotina — a lista de onde saem as alternativas erradas: episiotomia de rotina (é seletiva, não rotineira); MANOBRA DE KRISTELLER (a pressão no fundo do útero está PROIBIDA — causa lesão materna e fetal e nunca deve ser feita); enema; tricotomia (raspar pelos); amniotomia de rotina; ocitocina de rotina para 'acelerar'; posição de litotomia obrigatória; aspiração de rotina das vias aéreas do recém-nascido saudável; e separar mãe e bebê. Na vigilância fetal do parto de BAIXO risco, o padrão é a AUSCULTA INTERMITENTE — a cardiotocografia contínua de rotina não melhora desfecho e aumenta cesárea. Regra de ouro para a prova: diante das alternativas, escolha a que RESPEITA a fisiologia e a autonomia da mulher e desconfie de toda intervenção 'de rotina'."],
   raciocinio:["Situe o período: dilatação (latente x ativa), expulsivo, dequitação, Greenberg (1ª hora, vigiar hemorragia).",
     "Fase ativa começa em 5-6 cm. Friedman (1 cm/h) está SUPERADO: parto lento com mãe e feto bem é normal — não é indicação de cesárea.",
     "Meça a altura pelos planos de DeLee (espinhas isquiáticas = plano 0).",
     "Registre no partograma; cruzar a linha de alerta = reavaliar; linha de ação (4h depois) = decidir.",
     "Garanta as boas práticas: acompanhante (Lei 11.108), liberdade de posição, alívio não farmacológico, pele a pele, clampeamento tardio, aleitamento na 1ª hora.",
     "Elimine o que é 'de rotina': episiotomia, Kristeller (proibida), enema, tricotomia, amniotomia, ocitocina, litotomia, aspiração do RN.",
     "Baixo risco: ausculta intermitente (não cardiotoco contínua)."],
   nucleo:["Períodos: dilatação · expulsivo · dequitação · 4º (Greenberg, 1ª hora).",
     "Fase ativa a partir de 5-6 cm. Curva de Friedman (1 cm/h) SUPERADA — lentidão com bem-estar não é distocia.",
     "Planos de DeLee: espinhas isquiáticas = 0 (acima negativo, abaixo positivo).",
     "Partograma: linha de alerta → reavaliar; linha de ação (4h à direita) → decidir.",
     "Fazer: acompanhante (Lei 11.108/2005), liberdade de posição, alívio não farmacológico, pele a pele, clampeamento tardio (1-3 min), aleitamento na 1ª hora.",
     "NÃO de rotina: episiotomia, Kristeller (PROIBIDA), enema, tricotomia, amniotomia, ocitocina, litotomia, aspiração do RN.",
     "Baixo risco: ausculta intermitente; cardiotocografia contínua de rotina aumenta cesárea sem melhorar desfecho."],
   pega:"Manobra de Kristeller é PROIBIDA e episiotomia não é de rotina. E a curva de Friedman caiu: parto lento com mãe e feto bem NÃO é parada de progressão nem indicação de cesárea.",
   mne:"Na dúvida, marque a alternativa que respeita a fisiologia e a autonomia — e desconfie de tudo que for 'de rotina'.",
   sus:"Diretrizes Nacionais de Assistência ao Parto Normal e Rede Cegonha/Rede Alyne; acompanhante é direito legal (Lei 11.108/2005)."},
  {id:"ped-desidratacao",area:"PED",nome:"Diarreia e desidratação (TRO)",yield:3,
   questoes:["ped_desidratacao_q1","ped_desidratacao_q2","ped_desidratacao_q3","ped_desidratacao_q4"],
   fonte:"Manejo do Paciente com Diarreia (Ministério da Saúde/SVSA, 2023 — unificado com SBP e SBI); estratégia AIDPI Criança.",
   aula:["A diarreia aguda é uma das principais causas de internação e morte de crianças pequenas no mundo, e quase sempre o que mata não é a infecção em si, mas a DESIDRATAÇÃO. Por isso o foco do atendimento é avaliar o grau de desidratação e repor líquidos na medida certa. A boa notícia é que a maioria se resolve com reidratação oral, uma das intervenções mais custo-efetivas da saúde pública.","Avaliar a desidratação é clínico, por sinais: estado geral (alerta, irritado ou letárgico), olhos (normais ou encovados), sede (bebe normal, bebe com avidez, ou não consegue beber), e o sinal da prega cutânea (some rápido, lento, ou muito lento). Com base nisso, classifica-se em: sem desidratação, com desidratação (moderada), ou desidratação grave/com choque.","A conduta segue três planos. Plano A (sem desidratação): orientação e reidratação em casa, mantendo a alimentação. Plano B (com desidratação, sem choque): terapia de reidratação oral (TRO) SUPERVISIONADA na unidade, com soro de reidratação oral em volume calculado, por algumas horas. Plano C (desidratação grave ou choque): hidratação VENOSA imediata. A regra prática: A em casa, B na unidade (oral), C na veia.","Pontos que a banca adora: a criança em choque ou que não consegue beber vai direto para o Plano C (venoso) — não se insiste na via oral. O antibiótico NÃO é rotina (a maioria é viral); fica para situações específicas (disenteria com gravidade, cólera). Mantém-se a alimentação (e o aleitamento materno). O ZINCO reduz duração e gravidade e, pela atualização do MS, é indicado para crianças de 6 meses a 5 anos, 20 mg/dia (antes era só a partir dos 5 anos). Outra novidade: a ONDANSETRONA (antiemético) pode ser usada em vômitos persistentes que atrapalham a reidratação oral — exceto em gestantes."],
   raciocinio:["Avalie o grau de desidratação por sinais: estado geral, olhos, sede, prega cutânea.","Sem desidratação → Plano A (casa, mantendo alimentação).","Com desidratação, sem choque → Plano B (TRO supervisionada na unidade).","Grave / choque / não consegue beber → Plano C (venoso, imediato).","Lembre: antibiótico não é rotina; mantenha alimentação e ofereça zinco."],
   nucleo:["Avaliar grau de desidratação por sinais (olhos, sede, prega, estado geral).","Plano A: casa. Plano B: TRO supervisionada na unidade. Plano C: venoso.","Choque ou incapaz de beber = Plano C direto.","Antibiótico não é rotina; manter alimentação. Zinco: 6 meses-5 anos, 20 mg/dia. Ondansetrona em vômitos persistentes (exceto gestante)."],
   pega:"Choque ou criança que não bebe = Plano C (venoso) direto. Antibiótico não é rotina na diarreia aguda.",mne:"A em casa, B na unidade (oral), C na veia.",sus:"A TRO é política clássica de saúde pública que reduziu a mortalidade infantil."},
  {id:"ped-respiratorio",area:"PED",nome:"IVAS, bronquiolite e pneumonia",yield:3,
   questoes:["ped_respiratorio_q1","ped_respiratorio_q2","ped_respiratorio_q3","ped_respiratorio_q4"],
   fonte:"Documento Científico de Pneumonia Comunitária da Sociedade Brasileira de Pediatria (SBP); estratégia AIDPI (Ministério da Saúde).",
   aula:["As infecções respiratórias são o motivo mais comum de atendimento pediátrico, e a habilidade cobrada é saber separar o que é leve do que é grave, e viral do que é bacteriano. A maioria das infecções de vias aéreas superiores (IVAS) é viral e autolimitada. O erro clássico é medicalizar resfriado com antibiótico.","A bronquiolite é típica do lactente (menor de 2 anos) e quase sempre causada por um vírus, o VSR (vírus sincicial respiratório). Começa como um resfriado e evolui com chiado (sibilância), tosse e desconforto respiratório. O ponto central: o tratamento é de SUPORTE — hidratação, oxigênio se necessário, desobstrução nasal. Broncodilatador e corticoide NÃO funcionam de rotina na bronquiolite, diferentemente da asma.","A pneumonia comunitária, por sua vez, costuma ter febre alta, taquipneia e sinais de esforço. Na criança de 2 meses a 5 anos, o tratamento ambulatorial de 1ª linha da pneumonia bacteriana típica (pneumococo) é a AMOXICILINA, 50 mg/kg/dia (de 8/8h ou 12/12h). Em escolares e adolescentes com quadro de pneumonia ATÍPICA (Mycoplasma pneumoniae), prefere-se um macrolídeo (azitromicina). O que decide se a criança fica em casa ou interna são os SINAIS DE GRAVIDADE: idade < 2 meses, tiragem (retração), taquipneia acima do corte para a idade, saturação < 92%, toxemia, derrame pleural ou incapacidade de aceitar líquidos.","Contar a frequência respiratória pela idade é o 'pulo do gato' — a OMS define taquipneia por faixas (por exemplo, mais alta em bebês). Uma criança com pneumonia e hipoxemia ou tiragem importante precisa de internação e antibiótico parenteral (como ceftriaxona), não de amoxicilina oral em casa. Resumo do raciocínio: bronquiolite (lactente, viral) = suporte; pneumonia típica = amoxicilina; e são os sinais de gravidade que definem o nível de cuidado."],
   raciocinio:["IVAS geralmente é viral e autolimitada — não medicalizar resfriado com antibiótico.","Lactente com sibilância pós-resfriado = bronquiolite (VSR): tratamento de SUPORTE.","Pneumonia bacteriana típica ambulatorial: amoxicilina de 1ª linha.","Conte a FR pela idade e busque sinais de gravidade da OMS (tiragem, hipoxemia).","Sinais de gravidade → internação + antibiótico parenteral (ex.: ceftriaxona)."],
   nucleo:["Bronquiolite (VSR, lactente): tratamento de suporte; broncodilatador/corticoide não de rotina.","Pneumonia típica (2m-5a): amoxicilina 50 mg/kg/dia. Atípica (escolar, Mycoplasma): macrolídeo.","Internar se: <2 meses, tiragem, taquipneia por idade, SatO2<92%, toxemia, derrame, não aceita líquidos.","Com gravidade: internar + antibiótico parenteral."],
   pega:"Bronquiolite não responde a broncodilatador/corticoide de rotina (é suporte). Contar a FR pela idade define gravidade.",mne:"Bronquiolite = suporte; pneumonia típica = amox.",sus:"Estratégia AIDPI orienta a abordagem das doenças prevalentes na infância na APS."},
  {id:"ped-vacinas",area:"PED",nome:"Calendário vacinal",yield:3,
   questoes:["ped_vacinas_q1","ped_vacinas_q2","ped_vacinas_q3","ped_vacinas_q4"],
   fonte:"Calendário Nacional de Vacinação 2025 e Instrução Normativa do PNI (Ministério da Saúde/SVSA).",
   aula:["O calendário vacinal é um dos maiores sucessos da saúde pública brasileira (PNI), e a prova cobra tanto o QUE se dá em cada idade quanto — principalmente — as falsas contraindicações. Saber que a maioria dos 'motivos' para adiar vacina é mito evita que a criança fique desprotegida.","Ao nascer, duas vacinas: BCG (contra formas graves de tuberculose) e hepatite B. No primeiro ano concentram-se as principais: pentavalente, poliomielite, pneumocócica, rotavírus, meningocócica C, entre outras, em esquema com doses e reforços. Não é preciso decorar cada data, mas reconhecer o 'ao nascer = BCG + hepatite B' e a lógica das doses no 1º ano.","As contraindicações VERDADEIRAS são poucas: reação anafilática grave a dose anterior/componente, e — para vacinas de vírus VIVO (como tríplice viral, febre amarela) — imunossupressão importante e gestação. O resto costuma ser FALSA contraindicação.","As falsas contraindicações são a pegadinha: resfriado leve, febre baixa, uso de antibiótico, desnutrição, prematuridade (segue idade cronológica), história de alergia não anafilática — NADA disso contraindica vacinar. O raciocínio de prova: diante de uma criança com quadro leve e vacina atrasada, a conduta correta quase sempre é VACINAR (e fazer a atualização/resgate do calendário), não adiar.","Atualização recente que cai na prova: a vacina HPV passou a ser em DOSE ÚNICA para meninas e meninos de 9 a 14 anos (quadrivalente: tipos 6, 11, 16 e 18). E lembre da vacina da gestante — a dTpa, a cada gestação, protege o recém-nascido contra coqueluche nos primeiros meses de vida."],
   raciocinio:["Ao nascer, pense BCG + hepatite B.","No 1º ano, as principais vacinas em doses e reforços.","Contraindicação verdadeira: anafilaxia prévia; e vírus vivo em imunossuprimido/gestante.","Resfriado leve, febre baixa, antibiótico, prematuridade = NÃO contraindicam.","Vacina atrasada + quadro leve = vacinar e fazer resgate."],
   nucleo:["Ao nascer: BCG + hepatite B.","1º ano: pentavalente (2-4-6m), pólio, pneumo, rotavírus, meningo C. HPV: dose única dos 9-14 anos.","Contraindicação real: anafilaxia; vírus vivo em imunossuprimido/gestante.","Falsas: resfriado leve, febre baixa, ATB, prematuridade."],
   pega:"A maioria das 'contraindicações' é FALSA (resfriado leve, febre baixa não contraindicam). A verdadeira para vírus vivo é imunossupressão/gestação.",mne:"Ao nascer = BCG + Hep B.",sus:"PNI é um dos maiores programas de imunização do mundo (viés de saúde pública)."},
  {id:"ped-desenvolvimento",area:"PED",nome:"Crescimento e aleitamento",yield:2,
   questoes:["ped_desenvolvimento_q1","ped_desenvolvimento_q2","ped_desenvolvimento_q3","ped_desenvolvimento_q4"],
   fonte:"Caderneta de Saúde da Criança e AIDPI (Ministério da Saúde); marcos do desenvolvimento (SBP); recomendações de aleitamento materno (OMS/MS).",
   aula:["Acompanhar crescimento e desenvolvimento é o coração da puericultura — as consultas periódicas da criança saudável. Crescimento é o ganho de tamanho (peso, comprimento/altura, perímetro cefálico), avaliado em curvas/percentis. Desenvolvimento é a aquisição de habilidades (motoras, linguagem, social), avaliada por marcos esperados para cada idade.","Os marcos motores dão o ritmo: sustento cefálico por volta dos 3 meses, sentar sem apoio por volta dos 6, engatinhar/ficar em pé lá pelos 9, andar por volta dos 12 meses, primeiras palavras com sentido em torno de 12 meses. Não é preciso cravar datas exatas, mas reconhecer a sequência e os SINAIS DE ALERTA (atraso importante em relação ao esperado), que exigem investigação.","A alimentação tem uma regra de ouro cobrada sempre: aleitamento materno EXCLUSIVO até os 6 meses (só leite materno, sem água, chá ou outros alimentos), e complementado (mantendo o peito + introdução alimentar) até 2 anos ou mais. Oferecer água/chá antes dos 6 meses no bebê em aleitamento exclusivo é erro.","As curvas de crescimento (percentis/escore-z) mostram se a criança cresce no seu canal. Uma criança que 'cai' de canal ou está muito abaixo do esperado merece investigação. Raciocínio de prova: reconhecer marcos por idade, saber AME até 6 meses, e identificar sinais de alerta que pedem avaliação."],
   raciocinio:["Separe crescimento (tamanho, curvas) de desenvolvimento (habilidades, marcos).","Reconheça os marcos motores por idade (sentar ~6m, andar ~12m).","AME até 6 meses; complementar até 2 anos ou mais.","Não ofereça água/chá antes dos 6 meses no aleitamento exclusivo.","Atraso importante ou queda de canal = investigar."],
   nucleo:["Marcos por idade (sustento cefálico ~3m, sentar ~6m, andar ~12m).","AME até 6 meses; complementar até 2 anos ou mais.","Curvas de crescimento (percentis/escore-z).","Sinais de alerta exigem investigação."],
   pega:"Aleitamento materno EXCLUSIVO até 6 meses — nada de água/chá antes disso. Atraso importante de marco = investigar.",mne:"AME até 6 meses.",sus:"Puericultura e caderneta da criança na APS."},
  {id:"mfc-atributos",area:"MFC",nome:"Atributos da APS (Starfield)",yield:3,
   questoes:["mfc_atributos_q1","mfc_atributos_q2","mfc_atributos_q3","mfc_atributos_q4"],
   fonte:"Starfield B. Atenção Primária (traduzido MS/UNESCO); Política Nacional de Atenção Básica - PNAB (Portaria 2.436/2017); Diretrizes Curriculares Nacionais de Medicina.",
   aula:["A atenção primária (APS) é a porta de entrada e a base de todo o sistema de saúde, e a professora Barbara Starfield definiu os atributos que fazem uma APS ser de qualidade. A prova adora cobrar o RECONHECIMENTO de cada atributo dentro de um caso — por isso não basta decorar a lista, é preciso entender o que cada um significa na prática.","São quatro atributos ESSENCIAIS. Primeiro contato / acesso: a APS é o primeiro recurso que a pessoa procura a cada novo problema. Longitudinalidade: o vínculo e o acompanhamento da MESMA pessoa/equipe ao longo do TEMPO, conhecendo sua história (é o atributo do 'me acompanha há anos'). Integralidade: oferecer ou garantir o cuidado para o conjunto de necessidades (promoção, prevenção, cura, reabilitação), não só a queixa do dia. Coordenação: a APS organiza e integra o cuidado que acontece em outros pontos da rede (encaminhamentos, resultados, continuidade).","Além desses, há três atributos DERIVADOS, que qualificam a prática: orientação familiar (considerar a família no cuidado), orientação comunitária (conhecer e agir sobre o território e a comunidade) e competência cultural (respeitar a cultura e os valores da população atendida).","A pegadinha mais frequente é confundir LONGITUDINALIDADE com INTEGRALIDADE. Longitudinalidade é a dimensão do TEMPO — a mesma equipe acompanhando a pessoa por anos. Integralidade é a AMPLITUDE do cuidado — abraçar todas as necessidades, não só a doença atual. No caso clínico, 'sempre atendido pela mesma equipe, que acompanha sua história ao longo dos anos' = longitudinalidade. Esses atributos são a base conceitual da Estratégia Saúde da Família e das Diretrizes Curriculares — quase garantia de cair."],
   raciocinio:["Diante do caso, identifique QUAL atributo está sendo descrito.","Vínculo/acompanhamento ao longo do TEMPO pela mesma equipe = longitudinalidade.","Cuidado AMPLO (todas as necessidades, promoção à reabilitação) = integralidade.","Primeiro recurso procurado a cada problema = primeiro contato/acesso.","Organizar o cuidado na rede (encaminhar, integrar resultados) = coordenação."],
   nucleo:["Essenciais: 1º contato/acesso, Longitudinalidade, Integralidade, Coordenação.","Derivados: orientação familiar, comunitária e competência cultural.","Longitudinalidade = TEMPO/vínculo; Integralidade = AMPLITUDE do cuidado.","Base conceitual da ESF e das DCN."],
   pega:"Não confunda longitudinalidade (vínculo ao longo do tempo) com integralidade (amplitude do cuidado). A banca troca os dois.",mne:"Essenciais = 'LICo': Longitudinalidade, Integralidade, Coordenação + primeiro Contato.",sus:"Atributos de Starfield fundamentam a ESF e as Diretrizes Curriculares."},
  {id:"mfc-rastreio",area:"MFC",nome:"Rastreamentos no SUS",yield:3,
   questoes:["mfc_rastreio_q1","mfc_rastreio_q2","mfc_rastreio_q3","mfc_rastreio_q4"],
   fonte:"Cadernos de Atenção Primária e Rastreamento (Ministério da Saúde); conceito de prevenção quaternária (WONCA); recomendações do INCA.",
   aula:["A Medicina de Família tem uma preocupação que a prova ama: não basta prevenir, é preciso prevenir CERTO, sem causar dano. Os níveis de prevenção ajudam a pensar. Primária: evitar a doença aparecer (vacina, cessação do tabagismo). Secundária: detectar cedo em quem não tem sintoma (rastreamento). Terciária: reduzir sequelas de doença já instalada (reabilitação). E há a quaternária: proteger o paciente do EXCESSO de medicina — evitar exames, diagnósticos e tratamentos desnecessários.","Rastrear bem significa fazer só o que tem evidência de reduzir mortalidade, na faixa e no intervalo certos (colo, mama, alguns outros). Rastrear mal — pedir uma bateria de exames 'de rotina' sem indicação — gera sobrediagnóstico, ansiedade, procedimentos desnecessários e às vezes dano direto. É aí que entra a prevenção quaternária.","O exemplo campeão de prova é o rastreamento de câncer de PRÓSTATA por PSA em massa: NÃO é recomendado como rastreamento populacional pelo MS, porque o balanço de benefício e dano não favorece (muito sobrediagnóstico de tumores que nunca dariam problema). Marcar 'solicitar PSA e toque de rotina em homem assintomático' costuma ser a alternativa errada.","O raciocínio que a banca quer: diante de um paciente assintomático, a conduta de qualidade é abordar o que muda desfecho (estilo de vida, vacinas, rastreios com evidência) e EVITAR o excesso. 'Mais exame' não é sinônimo de 'melhor cuidado' — muitas vezes é o contrário."],
   raciocinio:["Classifique a ação: prevenção primária, secundária, terciária ou quaternária.","Rastreie só o que tem evidência, na faixa/intervalo corretos.","Desconfie de 'bateria de exames de rotina' sem indicação (sobrediagnóstico).","PSA/toque de rotina em homem assintomático NÃO é rastreamento recomendado.","Priorize o que muda desfecho (estilo de vida, vacinas, rastreios válidos)."],
   nucleo:["Níveis: primária, secundária (rastreio), terciária, quaternária.","Prevenção quaternária: evitar excesso de medicina/sobrediagnóstico.","Rastrear só com evidência, na faixa/intervalo certos.","Rastreio de próstata por PSA em massa NÃO é recomendado."],
   pega:"Rastreio de próstata por PSA em massa NÃO é recomendado. Mais exame ≠ melhor cuidado (prevenção quaternária).",mne:"Rastreio bom = evidência + faixa certa.",sus:"Prevenção quaternária é conceito muito querido da MFC brasileira."},
  {id:"mfc-vigilancia",area:"MFC",nome:"Vigilância e notificação",yield:3,
   questoes:["mfc_vigilancia_q1","mfc_vigilancia_q2","mfc_vigilancia_q3","mfc_vigilancia_q4"],
   fonte:"Portaria de Consolidação nº 4/2017 e Portaria 204/2016 (Lista Nacional de Notificação Compulsória); Guia de Vigilância em Saúde (Ministério da Saúde).",
   aula:["Vigilância em saúde é o conjunto de ações que monitora doenças e agravos na população para agir rápido — conter surtos, proteger contatos, orientar políticas. A ferramenta prática que o médico usa é a NOTIFICAÇÃO: comunicar oficialmente os casos de certas doenças às autoridades de saúde. Isso alimenta o sistema e dispara as respostas.","As doenças de notificação compulsória são registradas no SINAN (Sistema de Informação de Agravos de Notificação). A lista é definida pelo Ministério da Saúde e inclui doenças como dengue, tuberculose, sífilis, hanseníase, violência, entre muitas. A regra de ouro para a prova: confirmou (ou às vezes só suspeitou, conforme a doença) um caso da lista? Notifique. Não notificar é falha grave e cai como 'pegadinha' de conduta.","Um ponto que separa quem estudou: o PRAZO. Algumas doenças exigem notificação IMEDIATA (em até 24 horas) por serem de alto potencial de disseminação ou gravidade — por exemplo, sarampo, casos suspeitos de doenças de interesse internacional, surtos. Outras têm notificação semanal (a maioria das de rotina). Saber diferenciar imediata de semanal é o diferencial em muitas questões.","A vigilância não para na notificação: ela investiga surtos (busca ativa de casos, identificação da fonte), monitora indicadores e articula respostas intersetoriais. Na prática do SUS, isso é eixo de Saúde Coletiva, que PERPASSA todas as áreas — uma questão de clínica, pediatria ou GO pode terminar cobrando 'e qual a conduta de vigilância?'. Por isso, sempre que o caso trouxer uma doença da lista, pense: notificar (SINAN), no prazo certo, e investigar se for surto."],
   raciocinio:["O caso traz uma doença da lista de notificação compulsória? Então notifique.","Registre no SINAN.","Verifique o PRAZO: imediata (24h) para as de alto risco/surtos; semanal para as de rotina.","Se houver surto, dispare a investigação (busca ativa, fonte).","Lembre: vigilância/Saúde Coletiva perpassa todas as áreas da prova."],
   nucleo:["Doenças de notificação compulsória → registrar no SINAN.","Prazo: notificação IMEDIATA (24h) para alto risco/surtos; semanal para as de rotina.","Confirmou/suspeitou caso da lista = notifique.","Vigilância também investiga surtos (busca ativa, fonte)."],
   pega:"Saber quais doenças são de notificação IMEDIATA (24h) vs semanal. E lembrar: notificar não depende de o paciente evoluir mal.",mne:"Confirmou doença da lista = notifica no SINAN.",sus:"Eixo de Saúde Coletiva — perpassa todas as áreas do ENAMED."},
  {id:"mfc-mccp",area:"MFC",nome:"Método centrado na pessoa",yield:2,
   questoes:["mfc_mccp_q1","mfc_mccp_q2","mfc_mccp_q3","mfc_mccp_q4"],
   fonte:"Método Clínico Centrado na Pessoa (Stewart et al.); Política Nacional de Atenção Básica - PNAB; Tratado de Medicina de Família e Comunidade (SBMFC).",
   aula:["O Método Clínico Centrado na Pessoa (MCCP) é a marca da Medicina de Família: em vez de tratar só a doença, trata-se a PESSOA que tem a doença. Isso significa entender, além do diagnóstico biomédico, a experiência do adoecer — o que a pessoa sente, teme, espera, e como aquilo afeta sua vida. Paciente que entende e participa do plano adere muito mais.","Na prática, o MCCP combina explorar a doença E a experiência da pessoa, entender a pessoa no seu contexto (família, trabalho, comunidade), e construir um plano CONJUNTO (decisão compartilhada), fortalecendo o vínculo. Não é 'ser bonzinho' — é uma técnica que melhora desfecho e adesão.","A MFC também trabalha com ferramentas de abordagem familiar e do território: o genograma (mapa das relações e doenças da família ao longo das gerações), o ecomapa (relações da família com o meio), a visita domiciliar (ver a pessoa no seu ambiente) e a territorialização (conhecer a área de abrangência, seus riscos e recursos).","Por trás de tudo estão os determinantes sociais da saúde — moradia, renda, trabalho, educação — que explicam boa parte do adoecimento e que a APS precisa considerar. Raciocínio de prova: 'centrado na pessoa' é o oposto de 'centrado na doença'; e as ferramentas (genograma, visita, território) aparecem em casos de família/comunidade."],
   raciocinio:["Trate a pessoa, não só a doença: explore a experiência do adoecer.","Entenda o contexto (família, trabalho, comunidade).","Construa o plano em conjunto (decisão compartilhada) — melhora a adesão.","Use ferramentas: genograma, ecomapa, visita domiciliar, territorialização.","Considere os determinantes sociais da saúde."],
   nucleo:["MCCP: doença + experiência da pessoa; plano conjunto.","Ferramentas: genograma, ecomapa, visita domiciliar.","Territorialização e determinantes sociais da saúde.","Centrado na pessoa ≠ centrado na doença."],
   pega:"Centrado na pessoa é diferente de centrado na doença. A decisão compartilhada melhora a adesão.",mne:"MCCP = pessoa antes da doença.",sus:"Trabalho da ESF no território; determinantes sociais nas DCN."},
  {id:"tv-saudemental",area:"CM",nome:"Saúde Mental na APS (transversal)",yield:3,
   questoes:["tv_saudemental_q1","tv_saudemental_q2","tv_saudemental_q3","tv_saudemental_q4"],
   fonte:"Linhas de Cuidado em Saúde Mental (Ministério da Saúde); Cadernos de Atenção Básica nº 34 (Saúde Mental); Rede de Atenção Psicossocial - RAPS; Portaria 204/2016 e Lei 13.819/2019 (notificação de violência autoprovocada).",
   aula:["Boa parte do sofrimento mental é atendida (ou deveria ser) na atenção primária, não só pelo psiquiatra. A prova cobra a abordagem inicial de quadros comuns — depressão, ansiedade, uso de álcool/drogas — e a segurança diante do risco de suicídio. Reconhecer e manejar o básico na APS, articulando a rede, é a competência esperada.","Na depressão, a escolha do tratamento depende da gravidade: na depressão LEVE a MODERADA, a psicoterapia (intervenções psicossociais) é 1ª linha e pode dispensar remédio; na moderada a GRAVE, o antidepressivo é indicado. Quando se medica, a 1ª linha são os ISRS (inibidores seletivos da recaptação de serotonina, como fluoxetina e sertralina), pelo bom perfil de segurança, disponíveis na Rename. Os antidepressivos tricíclicos (amitriptilina) devem ser usados com CAUTELA pelo risco de overdose (letais em superdosagem) — dispensar em quantidades menores e supervisão. A pegadinha clássica: benzodiazepínico NÃO é 1ª linha para depressão/ansiedade — alivia sintoma agudo, mas causa dependência e não trata o transtorno de base.","No uso de álcool e outras drogas, a APS rastreia (instrumentos como AUDIT/CAGE), aborda e encaminha/articula com a RAPS (Rede de Atenção Psicossocial), da qual fazem parte os CAPS. A lógica é de cuidado no território, redução de danos, e não apenas 'internar'.","O risco de suicídio é o ponto mais sensível: deve ser avaliado ativamente (perguntar sobre suicídio NÃO induz o ato), e a segurança do paciente é prioridade — o que justifica quebrar o sigilo para proteger a vida, restringir acesso a meios, não deixar a pessoa sozinha e, em risco iminente, encaminhar à emergência psiquiátrica. Ponto de alto rendimento: toda violência autoprovocada (tentativa de suicídio, automutilação, ideação) é de NOTIFICAÇÃO COMPULSÓRIA IMEDIATA (Portaria 204/2016 e Lei 13.819/2019), via ficha de notificação. Saúde Mental é eixo TRANSVERSAL: aparece embutida em casos de outras áreas (a puérpera, o adolescente, o idoso)."],
   raciocinio:["Reconheça o quadro (depressão, ansiedade, uso de substância) na APS.","Depressão/ansiedade com indicação de medicar: ISRS de 1ª linha.","Evite benzodiazepínico como 1ª linha crônica (dependência).","Álcool/drogas: rastreie e articule com a RAPS/CAPS.","Avalie ativamente o risco de suicídio; priorize a segurança (pode romper sigilo em risco)."],
   nucleo:["Depressão leve-moderada: psicoterapia 1ª linha. Moderada-grave: ISRS 1ª linha (tricíclico com cautela, risco de overdose).","Benzodiazepínico não é 1ª linha crônica.","Álcool/drogas: rastreio (AUDIT/CAGE) + RAPS/CAPS.","Risco de suicídio: avaliar ativamente, priorizar segurança. Violência autoprovocada = notificação compulsória imediata."],
   pega:"Benzodiazepínico NÃO é 1ª linha para depressão/ansiedade. Saúde Mental vem embutida em casos de outras áreas.",mne:"Humor deprimido persistente na APS = pense ISRS.",sus:"RAPS (Rede de Atenção Psicossocial) e matriciamento — eixo transversal do ENAMED."},
  {id:"tv-sus",area:"MFC",nome:"Princípios do SUS (transversal)",yield:3,
   questoes:["tv_sus_q1","tv_sus_q2","tv_sus_q3","tv_sus_q4"],
   fonte:"Constituição Federal de 1988 (art. 196 a 200); Lei 8.080/1990 (Lei Orgânica da Saúde) e Lei 8.142/1990 (participação e financiamento); Decreto 7.508/2011.",
   aula:["O SUS é a espinha dorsal do ENAMED — a prova é declaradamente ancorada nele, então entender seus princípios é obrigatório. E há uma distinção que a banca cobra sempre: princípios (o que o SUS busca) versus diretrizes organizativas (como ele se organiza para isso). Confundir os dois é erro garantido.","Os PRINCÍPIOS (doutrinários) são três: Universalidade (saúde é direito de todos, sem discriminação), Integralidade (atender o conjunto de necessidades, da promoção à reabilitação) e Equidade (tratar desigualmente os desiguais — dar mais a quem precisa mais, para reduzir injustiças). Equidade NÃO é igualdade: igualdade é dar o mesmo a todos; equidade é dar conforme a necessidade.","As DIRETRIZES organizativas dizem como o sistema se estrutura: Descentralização (gestão compartilhada entre União, estados e municípios, com comando único em cada esfera), Regionalização e hierarquização (organizar serviços por território e níveis de complexidade, em rede) e Participação social (a comunidade participa e controla via conselhos e conferências de saúde).","O controle social é um pilar democrático: os Conselhos de Saúde (paritários, com usuários, trabalhadores e gestores) e as Conferências acompanham e deliberam sobre políticas. Raciocínio de prova: se a alternativa fala em 'universalidade/integralidade/equidade', é princípio; se fala em 'descentralização/regionalização/participação', é diretriz. E equidade ≠ igualdade."],
