<style>
  :root{
    --bg:#0d1618; --panel:#12211f; --panel2:#16302b; --line:#1f3d37;
    --ink:#e8f2ee; --muted:#7fa49a; --acc:#3ddc97; --acc2:#5ec8ff;
    --warn:#f2c94c; --bad:#ff6b6b; --gold:#e6b450; --radius:14px;
    --glow:#12332c; --inputbg:#0a1512; --bar:#0a1512;
    --mono:'SFMono-Regular',ui-monospace,Menlo,Consolas,monospace;
    --sans:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  html[data-tema="claro"]{
    --bg:#f4f7f6; --panel:#ffffff; --panel2:#eef4f2; --line:#d5e2dd;
    --ink:#12211f; --muted:#5c7a72; --acc:#0f9d6b; --acc2:#1f7fbf;
    --warn:#b7860b; --bad:#c0392b; --gold:#a97b18;
    --glow:#dcece6; --inputbg:#ffffff; --bar:#e3ece9;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 70% -10%,var(--glow) 0%,var(--bg) 55%);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  #root{max-width:1080px;margin:0 auto;padding:22px 18px 90px}
  h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em}
  button{font-family:inherit;cursor:pointer;border:none}
  .tag{font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
  .btn{background:var(--acc);color:#04120c;font-weight:700;padding:11px 16px;border-radius:10px;font-size:14px}
  .btn:hover{filter:brightness(1.08)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .btn.ghost:hover{border-color:var(--acc)}
  .btn.sm{padding:7px 12px;font-size:13px}
  .nav{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 24px}
  .nav button{background:transparent;color:var(--muted);padding:9px 14px;border-radius:9px;font-size:14px;font-weight:600;border:1px solid transparent}
  .nav button.on{background:var(--panel2);color:var(--ink);border-color:var(--line)}
  .grid{display:grid;gap:14px}
  .muted{color:var(--muted)}
  .bar{height:8px;background:var(--bar);border-radius:99px;overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:99px}
  .alt{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:13px 15px;border-radius:10px;margin-top:9px;font-size:15px;transition:.12s}
  .alt:hover{border-color:var(--acc)}
  .alt.correct{border-color:var(--acc);background:#123528}
  .alt.wrong{border-color:var(--bad);background:#331819}
  .alt.dim{opacity:.55}
  .pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;border:1px solid var(--line);color:var(--muted)}
  input,textarea,select{width:100%;background:var(--inputbg);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:10px 12px;font-family:inherit;font-size:14px}
  textarea{min-height:70px;resize:vertical}
  label{font-size:12px;color:var(--muted);display:block;margin:12px 0 5px;font-weight:600}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .kpi{font-size:34px;font-weight:800;letter-spacing:-.03em}
  table{width:100%;border-collapse:collapse;font-size:14px}
  td,th{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
  .sem{width:11px;height:11px;border-radius:99px;display:inline-block}
  .comment{background:color-mix(in srgb, var(--acc) 12%, var(--panel));border-left:3px solid var(--acc);color:var(--ink);padding:12px 14px;border-radius:0 8px 8px 0;margin-top:14px;font-size:14px;line-height:1.55}
  .block{border-radius:10px;padding:12px 14px;margin-top:10px;font-size:14px;line-height:1.55}
  .b-nucleo{background:color-mix(in srgb, var(--acc) 12%, var(--panel));border-left:3px solid var(--acc);color:var(--ink)}
  .b-pega{background:color-mix(in srgb, var(--warn) 14%, var(--panel));border-left:3px solid var(--warn);color:var(--ink)}
  .b-mne{background:color-mix(in srgb, var(--acc2) 12%, var(--panel));border-left:3px solid var(--acc2);color:var(--ink)}
  .b-sus{background:color-mix(in srgb, #b98cff 14%, var(--panel));border-left:3px solid #b98cff;color:var(--ink)}
  .b-metodo{background:var(--panel2);border:1px dashed var(--line);color:var(--ink)}
  .hero{background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 18%,var(--panel)),var(--panel));border:1px solid var(--acc);color:var(--ink);border-radius:16px;padding:20px}
  .rate{display:flex;gap:6px;margin-top:8px}
  .rate button{width:38px;height:38px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);color:var(--ink);font-weight:700}
  .rate button.on{background:var(--acc);color:#04120c;border-color:var(--acc)}
  .topico{border:1px solid var(--line);border-radius:12px;margin-top:10px;overflow:hidden}
  .topico>.head{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;cursor:pointer;background:var(--panel2)}
  .topico>.body{padding:0 15px 15px}
  .yield{font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px}
  .lock{background:color-mix(in srgb,#b98cff 12%,var(--panel));border:1px solid color-mix(in srgb,#b98cff 40%,var(--line));color:var(--ink);border-radius:12px;padding:16px;text-align:center}
  .center{min-height:80vh;display:flex;align-items:center;justify-content:center}
  .auth{max-width:380px;width:100%}
  .link{color:var(--acc);cursor:pointer;font-weight:600}
</style>

<script type="text/babel">

// URL do seu Cloudflare Worker (ex.: https://enamed-worker.SEU-SUBDOMINIO.workers.dev)
const WORKER_URL = "COLE_A_URL_DO_SEU_WORKER_AQUI";

const sb = CONFIGURADO ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

const AREAS = [
  {k:"CM",nome:"Clínica Médica",meta:20},
  {k:"CIR",nome:"Cirurgia",meta:20},
  {k:"GO",nome:"Gineco/Obstetrícia",meta:20},

/* ---- CURRÍCULO (conteúdo da Trilha; vive no código) ---- */
const CURRICULO = [
  {id:"cm-acidobase",area:"CM",nome:"Distúrbios ácido-base",yield:3,
   questoes:["cm_acidobase_q1","cm_acidobase_q2","cm_acidobase_q3","cm_acidobase_q4"],
   fonte:"Interpretação de gasometria - princípios de fisiologia ácido-base (Guyton; UpToDate); fórmula de Winter.",
   aula:["O sangue precisa ficar num pH bem estreito, entre 7,35 e 7,45. Essa margem é pequena porque as enzimas que fazem o corpo funcionar só trabalham bem nessa faixa; fora dela, reações vitais começam a falhar. Quando o pH cai abaixo de 7,35 o sangue está ácido demais (acidose); acima de 7,45, básico demais (alcalose). Todo o assunto de gasometria é responder duas perguntas: por que o pH saiu do lugar, e o que o corpo está fazendo para corrigir.","Duas substâncias controlam o pH, e é essencial saber quem manda em cada uma. O gás carbônico (CO2) é regulado pelos PULMÕES — quanto mais CO2, mais ácido o sangue (CO2 é um ácido). O bicarbonato (HCO3) é regulado pelos RINS — quanto mais bicarbonato, mais básico (HCO3 é uma base). A partir disso: se o distúrbio nasce no pulmão (alteração do CO2), é RESPIRATÓRIO; se nasce no metabolismo/rim (alteração do HCO3), é METABÓLICO. Guardar 'CO2 = pulmão = ácido' e 'HCO3 = rim = base' resolve metade das questões.","O corpo nunca fica parado diante de um pH alterado: ele COMPENSA, tentando puxar o pH de volta ao normal. Se há uma acidose metabólica (bicarbonato baixo), o pulmão acelera e aprofunda a respiração para eliminar CO2 (o ácido volátil) e assim reduzir a acidez — é a respiração de Kussmaul, rápida e profunda, clássica da cetoacidose diabética. A compensação pulmonar é rápida (minutos a horas); a renal é lenta (horas a dias). Perceber a compensação é o que diferencia LER uma gasometria de decorar valores.","Dentro da acidose metabólica há duas famílias, e distinguir muda o diagnóstico. Quando um ácido NOVO se acumula no sangue (cetoácidos na cetoacidose, lactato no choque, toxinas), o ânion gap fica ALTO. Quando o problema é PERDA de bicarbonato (diarreia intensa, alguns problemas renais), o ânion gap fica NORMAL (também chamada hiperclorêmica). O ânion gap é apenas uma conta que estima se há 'ácido escondido' sobrando — pense nele como o detetive que aponta se entrou um ácido novo na jogada.","Na prova, o passo final é checar a compensação esperada com uma fórmula simples (fórmula de Winter, para acidose metabólica: pCO2 esperada = 1,5 x HCO3 + 8, com margem de ±2). Se a pCO2 real bate com a esperada, há um distúrbio só, bem compensado. Se NÃO bate, existe um segundo distúrbio escondido — o temido distúrbio MISTO, que é onde a banca separa quem entende de quem chutou. Exemplo real: um paciente com cetoacidose (acidose metabólica) que também vomita muito pode ter uma alcalose metabólica junto, e só a fórmula denuncia isso."],
   raciocinio:["Olhe o pH: abaixo de 7,35 é acidose; acima de 7,45 é alcalose. Esse é o distúrbio que domina.","Olhe HCO3 e pCO2: qual dos dois explica o pH? Se o HCO3 baixo explica a acidose, é metabólica; se o pCO2 alto explica, é respiratória.","Se for acidose metabólica, calcule o ânion gap: ALTO (acúmulo de ácido, ex.: cetoacidose, lactato) ou NORMAL (perda de bicarbonato, ex.: diarreia).","Cheque a compensação esperada (Winter, na acidose metabólica). Bateu = distúrbio único. Não bateu = há um distúrbio MISTO escondido."],
   nucleo:["Sequência fixa ao ler a gaso: 1) pH  2) HCO3 e pCO2 (quem é o primário)  3) ânion gap  4) compensação esperada.","Acidose metabólica: ânion gap ALTO (ácido acumulou) vs NORMAL/hiperclorêmica (perdeu bicarbonato).","Compensação da acidose metabólica: Winter → pCO2 esperada = 1,5 x HCO3 + 8 (±2).","Compensação que não bate = distúrbio MISTO."],
   pega:"Não pare no pH: sempre confira a compensação para não perder um distúrbio MISTO. Respiração de Kussmaul aponta acidose metabólica compensando.",mne:"Ânion gap ALTO = MUDPILES (Metanol, Uremia, cetoacidose Diabética, Paraldeído, Isoniazida/ferro, Lactato, Etilenoglicol, Salicilato).",sus:"Interpretação de gasometria cai contextualizada em caso clínico de urgência (cetoacidose, sepse) na prova."},
  {id:"cm-has",area:"CM",nome:"Hipertensão — manejo e metas",yield:3,
   questoes:["has_q1","has_q2","has_q3","has_q4"],
   fonte:"Diretriz Brasileira de Hipertensão Arterial 2020 (SBC/SBH/SBN), atualizada em 2025; Linha de Cuidado da HAS no adulto (Ministério da Saúde).",
   aula:["Pressão arterial é a força que o sangue faz contra a parede das artérias. Ela sobe e desce ao longo do dia (sobe no esforço, cai no sono) — isso é normal. O problema é quando fica CRONICAMENTE alta: aí, dia após dia, essa pressão extra vai desgastando as artérias, sobrecarregando o coração (que precisa bombear contra mais resistência) e lesando órgãos que dependem de vasos finos — rim, retina, cérebro. Como isso acontece em silêncio, por anos, sem dor nem sintoma, a HAS é a 'assassina silenciosa'. É por isso que medir a pressão de rotina, mesmo em quem se sente bem, salva vidas — e é papel central da atenção primária.",
     "Diagnóstico é o primeiro lugar onde a banca te derruba. NÃO se fecha hipertensão com uma única medida alta. O ponto de corte no consultório é 140/90 mmHg, mas precisa ser confirmado — em outra consulta, ou (melhor) por medida fora do consultório: a MAPA (aparelho que mede por 24h) ou a MRPA (o paciente mede em casa). Isso existe porque muita gente sobe a pressão só de estar no médico (o 'efeito do jaleco branco') e seria rotulada e medicada à toa. Guarde: uma aferição alta = investigar, não diagnosticar.",
     "O tratamento tem dois pilares que andam JUNTOS. O primeiro, para TODO hipertenso, é a mudança de estilo de vida: reduzir sal (o sódio retém água e sobe a pressão), perder peso, atividade física regular, moderar álcool, parar de fumar. Sozinha, em casos leves, ela às vezes já resolve. O segundo pilar é o remédio, e as três primeiras linhas — todas baratas e no SUS — são: diurético tiazídico (tira sal e água), IECA ou BRA (relaxam o vaso agindo no sistema renina-angiotensina) e bloqueador de canal de cálcio (relaxa a musculatura do vaso). A escolha entre elas depende do perfil: por exemplo, IECA/BRA são preferidos no diabético com doença renal, porque protegem o rim.",
     "Agora as duas pegadinhas clássicas. Primeira: o betabloqueador (propranolol, atenolol) NÃO é primeira linha na hipertensão comum. Ele só entra de largada quando há uma indicação a mais — o paciente também tem doença coronariana, insuficiência cardíaca ou certas arritmias. Marcar betabloqueador como 'tratamento inicial da HAS' é errar. Segunda: saber diferenciar URGÊNCIA de EMERGÊNCIA hipertensiva. Pressão muito alta (ex.: 200/120) SEM lesão aguda de órgão é urgência — baixa-se devagar, com medicação oral, em horas. Pressão muito alta (arbitrariamente PAS ≥180 e/ou PAD ≥120) COM lesão aguda de órgão-alvo acontecendo agora (AVC, edema agudo de pulmão, infarto, dissecção de aorta, eclâmpsia) é EMERGÊNCIA hipertensiva — precisa de medicação VENOSA e redução controlada, em ambiente monitorado, pelo risco iminente de morte. Baixar a pressão rápido demais numa urgência (que não precisava) pode causar isquemia. A conduta muda tudo conforme esse par.",
     "Por fim, a meta e o acompanhamento. A meta é individualizada pelo risco: PA < 140/90 para risco baixo/moderado, e < 130/80 para pacientes de ALTO risco (ex.: diabéticos, doença cardiovascular estabelecida). No idoso frágil a meta é mais permissiva (em torno de 140-149 de sistólica), porque baixar demais causa queda, tontura e hipotensão. Na prática do SUS, o hipertensão entra na linha de cuidado (o antigo HiperDia), com consultas regulares, aferição, e busca ativa de quem abandona — porque adesão é o maior desafio: como não dói, o paciente para o remédio. O médico de família acompanha isso ao longo do tempo."],
   raciocinio:["Confirme antes de rotular: uma medida alta não fecha diagnóstico. Peça nova aferição ou MAPA/MRPA.",
     "Avalie o risco: tem lesão de órgão-alvo? Diabetes? Doença renal? Isso define a meta e a droga preferida.",
     "Prescreva SEMPRE mudança de estilo de vida — em todos, do leve ao grave.",
     "Escolha a 1ª linha certa: tiazídico, IECA/BRA ou BCC. Betabloqueador só se houver indicação extra (coronariopatia, IC).",
     "Diante de pressão muito alta: procure lesão AGUDA de órgão. Achou (AVC, EAP, IAM)? Emergência (venoso). Não achou? Urgência (oral, devagar)."],
   nucleo:["Diagnóstico: ≥140/90 CONFIRMADO (nova medida ou MAPA/MRPA) — nunca com uma só aferição.","1ª linha: tiazídico OU IECA/BRA OU BCC. Betabloqueador não é 1ª linha sem indicação específica.","Emergência (lesão aguda de órgão → venoso) x urgência (sem lesão → oral, devagar).","Meta: <140/90 (risco baixo/moderado) e <130/80 (alto risco); idoso frágil mais permissiva."],
   pega:"Betabloqueador NÃO é 1ª linha sem indicação (coronariopatia/IC). E não confunda urgência (oral) com emergência (venoso, há lesão aguda de órgão).",
   mne:"1ª linha = 'TIB': Tiazídico, IECA/BRA, BCC.",sus:"Linha de cuidado da HAS na APS (HiperDia): rastreio, adesão e busca ativa."},
  {id:"cm-dm2",area:"CM",nome:"Diabetes tipo 2",yield:3,
   questoes:["cm_dm2_q1","cm_dm2_q2","cm_dm2_q3","cm_dm2_q4"],
   fonte:"Diretriz da Sociedade Brasileira de Diabetes (SBD) 2025 — diagnóstico, metas e tratamento do DM2; Tratamento do DM2 no SUS (SBD).",
   aula:["Diabetes tipo 2 é uma doença em que o corpo não consegue mais controlar bem o açúcar no sangue. Diferente do tipo 1 (que é falta de insulina), no tipo 2 o corpo até produz insulina, mas as células ficam 'surdas' a ela — é a resistência à insulina. Com o tempo o pâncreas cansa e a glicose sobe. O excesso de açúcar circulando vai lesando vasos pequenos e grandes: olhos, rins, nervos e coração.",
     "O diagnóstico se faz por qualquer um destes: glicemia de jejum >=126, HbA1c >=6,5%, glicemia 2h após o TOTG >=200, ou glicemia casual >=200 com sintomas. A HbA1c é útil porque mostra a média do açúcar dos últimos 2-3 meses — não depende de o paciente estar em jejum naquele dia.",
     "A metformina reduz a produção de glicose pelo fígado e melhora a resposta à insulina; é barata, segura e disponível no SUS. ATENÇÃO à atualização (SBD 2025): a metformina deixou de ser 1ª linha UNIVERSAL. Ela permanece como escolha inicial em monoterapia no paciente de risco cardiovascular baixo/intermediário, sem doença cardiorrenal nem obesidade e com HbA1c < 7,5%. Porém, em ALTO risco cardiovascular ou doença renal, entram precocemente os iSGLT2 (ex.: dapagliflozina) ou os agonistas de GLP-1, pelo benefício cardiorrenal; na obesidade, preferem-se GLP-1/tirzepatida (também ajudam a emagrecer); e com HbA1c ≥ 7,5% já se começa com combinação. A metformina é contraindicada quando a função renal está muito ruim (TFG baixa). No SUS, o esquema clássico segue metformina + sulfonilureia (gliclazida preferida).",
     "Tratar diabetes não é só baixar o número da glicose: é definir uma META individualizada de HbA1c: < 7% para a maioria dos adultos, < 7,5% em idosos, e < 8% em idosos com capacidade funcional reduzida (para evitar hipoglicemia) e rastrear as complicações periodicamente — fundo de olho, função renal, exame dos pés. Um erro comum é já querer insulinizar todo mundo de cara; a insulina entra quando os orais não dão conta."],
   raciocinio:["1. Confirme o diagnóstico (jejum, HbA1c, TOTG ou casual com sintomas).",
     "2. Cheque a função renal — ela decide se a metformina pode ser usada.",
     "3. Comece metformina (1ª linha) + mudança de estilo de vida.",
     "4. Defina a meta de HbA1c conforme o perfil do paciente (mais rígida no jovem, mais frouxa no idoso frágil).",
     "5. Programe o rastreio de complicações (retina, rim, neuropatia, pés)."],
   nucleo:["Diagnóstico: jejum >=126, HbA1c >=6,5%, TOTG 2h >=200.","Metformina: 1ª escolha se risco baixo/intermediário e HbA1c<7,5%; alto risco CV/renal → iSGLT2 ou GLP-1 precoce (SBD 2025).","Metas HbA1c: <7% (maioria), <7,5% (idoso), <8% (idoso frágil). Rastrear complicações (retina, rim, pés)."],
   pega:"Mudança SBD 2025: metformina não é mais 1ª linha universal — em alto risco CV/renal, iSGLT2 ou GLP-1 entram cedo. Não insulinizar todo mundo de cara.",mne:"Meta HbA1c: 7 / 7,5 / 8 (adulto / idoso / idoso frágil).",sus:"Linha de cuidado do DM na APS; no SUS, metformina + gliclazida."},
  {id:"cm-sca",area:"CM",nome:"Síndrome coronariana aguda (IAM)",yield:3,
   questoes:["cm_sca_q1","cm_sca_q2","cm_sca_q3","cm_sca_q4"],
   fonte:"Diretriz de SCA da Sociedade Brasileira de Cardiologia; Atualização AHA/ACC 2025 de Síndromes Coronarianas Agudas; 4ª Definição Universal de Infarto.",
   aula:["A síndrome coronariana aguda (SCA) acontece quando uma placa de gordura na parede da artéria coronária se rompe e forma um trombo, reduzindo ou bloqueando o fluxo de sangue para o músculo do coração. Se o vaso entope por completo, aquela região do miocárdio começa a morrer — é o infarto. O sintoma clássico é dor torácica em aperto, retroesternal, que pode irradiar para o braço esquerdo, mandíbula ou dorso, com sudorese, náusea e sensação de morte iminente. Idosos, diabéticos e mulheres podem ter apresentação atípica (dispneia, mal-estar), o que engana.","A SCA se divide em três, e o que separa é o eletrocardiograma (ECG) e a troponina. O ECG deve ser feito e interpretado em até 10 minutos da chegada. Se há SUPRADESNIVELAMENTO do segmento ST (ou bloqueio de ramo esquerdo novo), é o IAM COM SUPRA (IAMCSST) — a artéria está totalmente ocluída, é a emergência que exige reperfusão imediata. Se NÃO há supra, dosa-se a troponina: se ela sobe, é IAM SEM supra (IAMSSST); se permanece normal com quadro clínico compatível, é angina instável.","No IAM COM SUPRA, o tratamento é REPERFUNDIR (reabrir a artéria) o mais rápido possível — tempo é músculo. A primeira escolha é a angioplastia primária (cateterismo), com meta de tempo porta-balão de até 90 minutos (ou até 120 minutos se precisar transferir para um serviço com hemodinâmica). Se não for possível cumprir esse tempo, faz-se a TROMBÓLISE (fibrinolítico, como a tenecteplase), com meta de tempo porta-agulha de até 30 minutos — indicada em sintomas de até 12 horas e após checar contraindicações (sangramento, AVC recente, etc.). Todo paciente trombolisado depois vai para o cateterismo.","Junto da reperfusão, entra o tratamento medicamentoso, resumido às vezes como 'MONABICHA' — mas o essencial da prova é: dupla antiagregação plaquetária (AAS + um inibidor de P2Y12, como clopidogrel, ticagrelor ou prasugrel) por pelo menos 1 ano, anticoagulação, estatina de alta potência, e betabloqueador/IECA conforme o caso. Uma pegadinha importante: a MORFINA não deve ser dada de rotina precocemente no IAM com supra, porque a melhora da dor é um critério de reperfusão e a morfina mascara isso (além de reduzir a absorção dos antiplaquetários) — reserva-se para dor intolerável.","No IAM SEM supra e na angina instável, a lógica é diferente: NÃO se faz trombólise (não há benefício e pode prejudicar). Estratifica-se o risco (escores como GRACE, TIMI) e decide-se o momento do cateterismo — os de alto risco vão para a angiografia precoce (nas primeiras 24h). O tratamento antitrombótico e as estatinas também entram. Regra de ouro que a banca adora: paciente com dor torácica + supra de ST = reperfusão já; sem supra = troponina e estratificação de risco, sem trombolítico."],
   raciocinio:["Dor torácica típica → faça e interprete o ECG em até 10 minutos.","Tem supra de ST (ou BRE novo)? É IAMCSST: reperfusão IMEDIATA.","Reperfusão: angioplastia primária (porta-balão ≤90 min, ou ≤120 se transferir); se não der no tempo, trombólise (porta-agulha ≤30 min, sintomas ≤12h).","Sem supra? Dose a troponina: sobe = IAMSSST; normal = angina instável. NÃO trombolisar.","Sem supra: estratifique risco (GRACE/TIMI) e defina o cateterismo (alto risco = precoce, <24h).","Não dar morfina de rotina precoce no IAM com supra (mascara critério de reperfusão)."],
   nucleo:["ECG em ≤10 min. Com supra (ou BRE novo) = IAMCSST → reperfusão imediata.","Angioplastia primária: porta-balão ≤90 min (≤120 se transferir). Trombólise: porta-agulha ≤30 min, sintomas ≤12h.","Sem supra: troponina (sobe=IAMSSST; normal=angina instável). NÃO trombolisar; estratificar (GRACE/TIMI).","Dupla antiagregação (AAS + P2Y12) por ≥1 ano; estatina alta potência.","Morfina não de rotina precoce no IAMCSST."],
   pega:"Sem supra de ST NÃO se trombolisa (só o IAM COM supra). E não dar morfina de rotina precoce no IAM com supra — mascara o critério de reperfusão da dor.",mne:"COM supra = reperfundir já (balão ≤90 / agulha ≤30). SEM supra = troponina + risco.",sus:"Rede de atenção às urgências cardiovasculares; telecardiologia e SAMU para trombólise pré-hospitalar."},
  {id:"cm-ic",area:"CM",nome:"Insuficiência cardíaca",yield:3,
   questoes:["cm_ic_q1","cm_ic_q2","cm_ic_q3","cm_ic_q4"],
   fonte:"Diretriz Brasileira de Insuficiência Cardíaca Crônica e Aguda (SBC); Diretriz ESC de Insuficiência Cardíaca.",
   aula:["A insuficiência cardíaca (IC) é a incapacidade do coração de bombear sangue suficiente para atender o corpo, ou de fazê-lo à custa de pressões elevadas. É o destino final de muitas doenças cardíacas (hipertensão, infarto, valvopatias). O paciente típico tem dispneia aos esforços que progride, cansaço, e sinais de congestão: inchaço nas pernas (edema), falta de ar ao deitar (ortopneia), e despertar à noite sufocado (dispneia paroxística noturna).","A IC se classifica pela fração de ejeção (FE), que é o percentual de sangue que o ventrículo esquerdo ejeta a cada batida (normal ≥50%). IC com FE REDUZIDA (ICFEr): FE ≤40% — o coração bombeia mal. IC com FE preservada (ICFEp): FE ≥50% — o coração enche mal (rigidez), comum em idosos e hipertensos. Há ainda a faixa intermediária (41-49%). Essa divisão importa porque o tratamento que salva vida foi provado na ICFEr.","O diagnóstico junta clínica + exames: o BNP (ou NT-proBNP) é um peptídeo que sobe na IC e ajuda muito (um BNP normal praticamente afasta IC como causa da dispneia); o ecocardiograma confirma e mede a FE. Os critérios de Framingham (sinais maiores e menores) ainda aparecem em prova.","O tratamento da ICFEr é o coração da questão, porque tem os 'quatro pilares' que reduzem mortalidade — memorize-os: (1) IECA/BRA ou, preferencialmente, o sacubitril-valsartana (INRA); (2) betabloqueador (carvedilol, metoprolol ou bisoprolol); (3) antagonista do receptor mineralocorticoide (espironolactona); e (4) inibidor de SGLT2 (dapagliflozina/empagliflozina), o pilar mais novo. Diuréticos aliviam a congestão (melhoram sintoma) mas NÃO reduzem mortalidade — é uma pegadinha clássica.","Na IC aguda descompensada (o paciente que chega com edema agudo de pulmão, muito congesto), a lógica muda para aliviar rápido: oxigênio/ventilação, diurético venoso (furosemida) para tirar o excesso de volume, vasodilatador (nitrato) se a pressão permite, e tratar o fator que descompensou (má adesão, infecção, arritmia, isquemia). Resumo do raciocínio: ICFEr crônica = os 4 pilares que salvam vida; congestão aguda = diurético venoso e suporte."],
   raciocinio:["Reconheça a IC: dispneia progressiva + congestão (edema, ortopneia, DPN).","Classifique pela fração de ejeção: reduzida (≤40%), preservada (≥50%) ou intermediária.","Confirme: BNP/NT-proBNP (normal quase afasta) + ecocardiograma.","ICFEr crônica: institua os 4 pilares (IECA/BRA ou sacubitril-valsartana + betabloqueador + espironolactona + iSGLT2).","Lembre: diurético alivia sintoma mas não reduz mortalidade.","IC aguda congesta: O2/ventilação + diurético venoso + vasodilatador + tratar o gatilho."],
   nucleo:["IC classificada pela FE: reduzida (≤40%), preservada (≥50%), intermediária (41-49%).","Diagnóstico: BNP/NT-proBNP + ecocardiograma.","ICFEr — 4 pilares que reduzem mortalidade: IECA/BRA ou sacubitril-valsartana, betabloqueador, espironolactona, iSGLT2.","Diurético: alivia congestão, NÃO reduz mortalidade.","IC aguda: diurético venoso + vasodilatador + O2 + tratar gatilho."],
   pega:"Diurético melhora sintoma mas NÃO reduz mortalidade na IC — quem salva vida são os 4 pilares da ICFEr. Betabloqueador NÃO se inicia na descompensação aguda congesta.",mne:"4 pilares da ICFEr: IECA/BRA(ou INRA) + Betabloqueador + Espironolactona + iSGLT2.",sus:"Linha de cuidado da IC; medicações dos 4 pilares progressivamente incorporadas ao SUS."},
  {id:"cm-avc",area:"CM",nome:"AVC (isquêmico e hemorrágico)",yield:3,
   questoes:["cm_avc_q1","cm_avc_q2","cm_avc_q3","cm_avc_q4"],
   fonte:"Diretriz de Doença Cerebrovascular / AVC da Sociedade Brasileira de Doenças Cerebrovasculares e Ministério da Saúde; protocolos de trombólise (AHA/ASA).",
   aula:["O AVC (acidente vascular cerebral) é a interrupção súbita do fluxo de sangue em uma parte do cérebro, causando perda de função daquela área. Tempo é cérebro: a cada minuto sem fluxo, milhões de neurônios morrem. O reconhecimento rápido usa a sigla SAMU/FAST: alteração no Sorriso (face caída), fraqueza no Abraço (braço), mudança na fala (Mensagem), e a Urgência de ligar. Sinais típicos: hemiparesia súbita, desvio de rima, afasia, alteração visual — sempre de instalação abrupta.","Há dois tipos, e a tomografia de crânio SEM contraste é o exame que os separa — e é a primeira coisa a fazer, porque a conduta é oposta. AVC ISQUÊMICO (~85%): um trombo entope o vaso; na TC inicial pode não aparecer nada (ou sinais precoces). AVC HEMORRÁGICO (~15%): um vaso rompe e sangra; a TC mostra a hemorragia (área branca) de imediato. Você nunca trata um antes de excluir o outro — dar trombolítico num hemorrágico é catastrófico.","No AVC isquêmico, o tratamento que reabre o vaso é a TROMBÓLISE endovenosa (alteplase ou tenecteplase), e ela tem uma JANELA de tempo: até 4,5 horas do início dos sintomas. Fora da janela, ou com contraindicações (hemorragia, cirurgia recente, hipertensão não controlada >185/110), não se trombolisa. Para grandes vasos, existe ainda a trombectomia mecânica (retirar o trombo por cateter), com janela maior (até 24h em casos selecionados). Um detalhe de prova: no isquêmico, a hipertensão é tolerada (permite-se PA mais alta), e só se trata acima de limites altos — baixar demais piora a isquemia.","No AVC hemorrágico, não há trombólise (óbvio); o manejo é controlar a pressão arterial de forma mais rigorosa, corrigir coagulopatias, controlar a pressão intracraniana e avaliar necessidade de cirurgia (neurocirurgia). Em ambos, cuidados gerais importam: glicemia, temperatura, deglutição (risco de broncoaspiração), e depois a prevenção secundária (antiagregante e estatina no isquêmico; controlar fatores de risco). Resumo: TC primeiro para separar; isquêmico na janela = trombólise; hemorrágico = controle pressórico e neurocirurgia."],
   raciocinio:["Déficit neurológico focal SÚBITO → suspeite de AVC (FAST) e marque a hora do início.","Faça TC de crânio sem contraste IMEDIATAMENTE para separar isquêmico de hemorrágico.","Isquêmico + dentro de 4,5h + sem contraindicação = trombólise endovenosa.","Grande vaso: considere trombectomia mecânica (janela maior).","Hemorrágico: controle rigoroso da PA, corrigir coagulopatia, avaliar neurocirurgia.","No isquêmico, tolere a hipertensão (não baixar demais); trate só acima de limites altos."],
   nucleo:["TC de crânio sem contraste PRIMEIRO: separa isquêmico (~85%) de hemorrágico (~15%).","Isquêmico: trombólise EV até 4,5h; trombectomia mecânica até 24h (grande vaso selecionado).","Contraindicações à trombólise: hemorragia, PA >185/110 não controlada, cirurgia recente.","Isquêmico tolera hipertensão (não baixar demais).","Hemorrágico: sem trombólise; controle pressórico rigoroso e neurocirurgia."],
   pega:"Nunca trombolisar sem a TC que exclui hemorragia. No isquêmico, a hipertensão é TOLERADA (baixar demais piora a isquemia); no hemorrágico, o controle é rigoroso — condutas opostas.",mne:"AVC: FAST → TC → isquêmico na janela (4,5h) trombolisa; hemorrágico não.",sus:"Linha de cuidado do AVC; unidades de AVC e protocolo de trombólise na rede de urgência."},
  {id:"cm-asma-dpoc",area:"CM",nome:"Asma e DPOC",yield:2,
   questoes:["cm_asma_dpoc_q1","cm_asma_dpoc_q2","cm_asma_dpoc_q3","cm_asma_dpoc_q4"],
   fonte:"Diretrizes da Global Initiative for Asthma (GINA) e Global Initiative for Chronic Obstructive Lung Disease (GOLD); Sociedade Brasileira de Pneumologia e Tisiologia.",
   aula:["Asma e DPOC são as duas grandes doenças que obstruem o fluxo de ar, mas têm perfis diferentes. A ASMA é uma inflamação crônica das vias aéreas com hiper-reatividade: os brônquios reagem de forma exagerada a gatilhos (alérgenos, exercício, frio) e se fecham, mas de forma REVERSÍVEL. É comum começar na infância, tem caráter variável (piora à noite/madrugada, melhora com broncodilatador) e história de atopia (rinite, eczema). A DPOC é uma obstrução POUCO reversível, progressiva, causada quase sempre pelo tabagismo, típica de adultos mais velhos com longa carga tabágica.","Na asma, a base do tratamento mudou e a prova cobra isso: o corticoide inalatório (CI) é o pilar do controle — trata a inflamação. O erro clássico é tratar asma só com broncodilatador de resgate (salbutamol) sem corticoide: alivia na hora, mas não controla a doença e aumenta risco de crise grave. Hoje a GINA recomenda que até os quadros leves usem corticoide inalatório (frequentemente combinado com formoterol). Os broncodilatadores de longa ação entram associados ao CI conforme a gravidade — nunca sozinhos na asma.","Na crise de asma (exacerbação), o tratamento é: oxigênio se hipoxemia, broncodilatador de curta ação (salbutamol) repetido, e corticoide SISTÊMICO precoce (oral ou venoso) — o corticoide sistêmico reduz a inflamação da crise e previne recaída. Casos graves podem usar sulfato de magnésio. Sinais de gravidade (fala entrecortada, uso de musculatura acessória, saturação baixa, sonolência) indicam crise grave e necessidade de suporte.","Na DPOC, o pilar são os BRONCODILATADORES de longa ação (LABA e LAMA); o corticoide inalatório entra em perfis selecionados (mais exacerbações, eosinofilia) — é o oposto da lógica da asma. Medidas que mudam desfecho na DPOC: cessação do tabagismo (a única que altera a história natural), vacinação (influenza, pneumococo) e oxigenoterapia domiciliar nos hipoxêmicos crônicos. Na exacerbação de DPOC (piora da dispneia, mais secreção/purulência), usa-se broncodilatador, corticoide sistêmico por período curto e antibiótico quando há sinais de infecção bacteriana. Resumo: asma = corticoide inalatório é a base; DPOC = broncodilatador de longa ação é a base + parar de fumar."],
   raciocinio:["Separe os perfis: asma (jovem, atopia, reversível, variável) x DPOC (tabagista, idoso, pouco reversível, progressiva).","Asma crônica: o corticoide inalatório é a BASE (não tratar só com resgate).","Crise de asma: O2 + salbutamol repetido + corticoide sistêmico precoce.","DPOC crônica: broncodilatador de longa ação (LABA/LAMA) é a base; CI em casos selecionados.","DPOC: cessação do tabagismo é a única medida que muda a história natural; vacinar; O2 domiciliar se hipoxemia crônica.","Exacerbação de DPOC: broncodilatador + corticoide sistêmico curto + antibiótico se infecção."],
   nucleo:["Asma: inflamação reversível; corticoide inalatório é a BASE (não só broncodilatador de resgate).","Crise de asma: O2 + salbutamol + corticoide SISTÊMICO precoce (± sulfato de magnésio).","DPOC: obstrução pouco reversível (tabagismo); base é broncodilatador de longa ação (LABA/LAMA).","DPOC: cessação do tabagismo muda a história natural; vacinar; O2 domiciliar se hipoxêmico crônico.","CI: base na asma; na DPOC só em perfis selecionados (oposto)."],
   pega:"Não tratar asma só com broncodilatador de resgate — o corticoide inalatório é a base. Na DPOC é o inverso: broncodilatador de longa ação é a base, corticoide inalatório é seletivo.",mne:"Asma = Corticoide Inalatório na base. DPOC = Broncodilatador longo na base + parar de fumar.",sus:"Programa de controle da asma e do tabagismo na APS; dispensação de medicações inalatórias."},
  {id:"cm-sepse",area:"CM",nome:"Sepse e choque",yield:2,
   questoes:["cm_sepse_q1","cm_sepse_q2","cm_sepse_q3","cm_sepse_q4"],
   fonte:"Protocolo Gerenciado de Sepse do ILAS (Instituto Latino-Americano de Sepse); Surviving Sepsis Campaign 2021 (nota técnica ILAS).",
   aula:["Sepse não é 'infecção grave' apenas — é uma infecção que passou a causar disfunção de órgãos porque a resposta do próprio corpo saiu do controle. O sistema imune, tentando combater o micróbio, libera uma tempestade de mediadores que dilatam vasos, deixam os capilares 'vazando' e reduzem a perfusão. Resultado: mesmo com o coração batendo, os órgãos recebem menos oxigênio e começam a falhar (rim que não urina, confusão mental, pressão que cai). Reconhecer cedo é o que salva.","Para identificar rápido à beira do leito existe o qSOFA: três sinais simples — frequência respiratória ≥22, alteração do estado mental e pressão arterial sistólica ≤100. Dois ou mais acendem o alerta. Na UTI usa-se o SOFA completo, que pontua a disfunção de cada órgão. O ponto-chave da prova: sepse é infecção COM disfunção orgânica; choque séptico é a sepse que, mesmo após reposição volêmica adequada, mantém hipotensão exigindo vasopressor para manter a PAM ≥ 65 mmHg E cursa com lactato ≥ 2 mmol/L — é o estágio mais grave. O vasopressor de escolha é a noradrenalina.","O tratamento gira em torno do 'pacote da 1ª hora', e a ordem importa. Colher lactato (marca a gravidade da hipoperfusão), colher hemoculturas ANTES do antibiótico (para identificar o germe sem que o remédio atrapalhe), iniciar antibiótico de amplo espectro EV PRECOCE (na 1ª hora) e infundir cristaloide (no mínimo 30 mL/kg) se há hipotensão ou lactato elevado (≥ 2× o valor de referência). Depois, reavaliar a perfusão. Cada hora de atraso no antibiótico aumenta a mortalidade — por isso ele não pode esperar.","A pegadinha mais cobrada é justamente essa sequência: colher cultura é importante, MAS não pode atrasar a primeira dose de antibiótico. Se a coleta demora, colhe-se o que der e o antibiótico entra assim mesmo. Outro ponto: a reposição de volume é agressiva no início (o paciente está 'vazando' e vasodilatado), e a resposta é reavaliada por sinais de perfusão — pressão, diurese, lactato que cai, nível de consciência. No SUS, tudo começa no acolhimento com classificação de risco, que puxa o paciente febril e taquicárdico para a frente da fila."],
   raciocinio:["Suspeite de sepse em todo paciente com infecção + sinais de disfunção (qSOFA ≥2, confusão, oligúria, hipotensão).","Colha lactato e hemoculturas — mas sem atrasar o antibiótico.","Antibiótico de amplo espectro na 1ª hora. Não espere exame.","Cristaloide 30 mL/kg se hipotensão ou lactato alto; reavalie a perfusão.","Manteve hipotensão após volume + precisa de vasopressor + lactato alto? É choque séptico."],
   nucleo:["Sepse = infecção + disfunção orgânica (qSOFA/SOFA). Choque séptico = necessita vasopressor p/ PAM ≥65 + lactato ≥2 após volume adequado; vasopressor de escolha: noradrenalina.","Pacote 1ª hora: lactato, hemocultura ANTES do ATB, antibiótico precoce, cristaloide 30 mL/kg.","Reavaliar perfusão (PA, diurese, lactato, consciência).","Antibiótico não pode atrasar por causa da cultura."],
   pega:"Nunca atrasar o antibiótico esperando a coleta de cultura. Colher cultura sim, mas o ATB entra na 1ª hora.",mne:"1ª hora = 'LHAC': Lactato, Hemocultura, Antibiótico, Cristaloide.",sus:"Acolhimento com classificação de risco identifica a sepse na porta de entrada."},
  {id:"cm-dengue",area:"CM",nome:"Dengue e arboviroses",yield:3,
   questoes:["cm_dengue_q1","cm_dengue_q2","cm_dengue_q3","cm_dengue_q4"],
   fonte:"Dengue: diagnóstico e manejo clínico — adulto e criança, 6ª edição (Ministério da Saúde/SVSA, 2024); Guia de Vigilância em Saúde (MS); Nota Técnica de incorporação da vacina Qdenga ao PNI (MS, 2024).",
   aula:["A dengue é uma arbovirose transmitida pelo mosquito Aedes aegypti e tem quatro sorotipos (DENV-1 a 4). Pegar um deles dá imunidade permanente contra AQUELE sorotipo, mas só temporária contra os outros — e é justamente aí que mora o perigo: a segunda infecção, por um sorotipo diferente, tem risco MAIOR de gravidade (fenômeno de facilitação dependente de anticorpos). Por isso, em país com todos os sorotipos circulando como o Brasil, cada nova epidemia produz casos graves em quem já teve dengue antes. Não existe antiviral: o tratamento é hidratação e vigilância. Quem morre de dengue morre de choque, e choque se previne com água e olho clínico.",
     "A doença tem três fases, e entender a linha do tempo é o que separa quem acerta a questão de quem chuta. FASE FEBRIL (dias 1 a 3): febre alta, dor de cabeça, dor atrás dos olhos, mialgia, exantema — o paciente se sente péssimo, mas raramente está grave. FASE CRÍTICA (dias 3 a 7, na DEFERVESCÊNCIA): a febre CAI e, paradoxalmente, é agora que o paciente piora. FASE DE RECUPERAÇÃO: reabsorção dos líquidos, melhora. Grave isso, porque é a armadilha mais cobrada: quando o familiar diz 'a febre passou, ele está melhor', é exatamente o momento de maior atenção. Todo paciente com dengue deve ser reavaliado diariamente até 48h após ficar sem febre.",
     "O que adoece de verdade não é o sangramento — é o EXTRAVASAMENTO PLASMÁTICO. Os capilares ficam permeáveis e o plasma vaza do vaso para o terceiro espaço (abdome, pleura). Duas consequências: o volume dentro do vaso cai (hipovolemia → choque) e o sangue que sobra fica concentrado — por isso o HEMATÓCRITO SOBE. Um hematócrito em elevação progressiva é o alarme laboratorial mais importante: significa que o plasma está saindo. É por isso que o tratamento é volume, e não transfusão ou plaqueta: a plaquetopenia isolada, sem sangramento, NÃO é indicação de transfusão de plaquetas — outra pegadinha clássica.",
     "Os SINAIS DE ALARME marcam a entrada na fase crítica e mudam tudo na conduta. São eles: dor abdominal intensa e contínua; vômitos persistentes; acúmulo de líquidos (ascite, derrame pleural ou pericárdico); hipotensão postural/lipotimia; hepatomegalia maior que 2 cm; sangramento de mucosa; letargia ou irritabilidade; e aumento progressivo do hematócrito. A partir deles, o Ministério da Saúde estratifica em quatro grupos. GRUPO A: sem alarme, sem sangramento e sem condição de risco → hidratação ORAL em casa, 60 mL/kg/dia (1/3 com sal de reidratação oral, 2/3 com líquidos caseiros), retorno diário. GRUPO B: prova do laço positiva ou sangramento espontâneo de pele, OU condição de risco (menor de 2 anos, maior de 65, gestante, HAS, DM, asma, doença hematológica ou renal, hepatopatia, autoimune) ou risco social → HEMOGRAMA e observação na unidade; hematócrito normal cai para conduta do A, hematócrito alto sobe para C. GRUPO C: COM sinais de alarme, sem hipotensão → internação e expansão VENOSA com soro fisiológico 10 mL/kg na primeira hora, reavaliando e repetindo até 3 vezes. GRUPO D: choque/gravidade → 20 mL/kg em até 20 minutos, até 3 vezes, e leito de terapia intensiva.",
     "Três pontos finais que caem muito. (1) ANALGESIA: paracetamol e dipirona liberados; AAS e anti-inflamatórios (AINE) são CONTRAINDICADOS pelo risco de sangramento e de lesão renal. (2) VIGILÂNCIA: dengue é notificação compulsória SEMANAL — mas dengue GRAVE e ÓBITO por dengue são de notificação IMEDIATA (24h). (3) DIFERENCIAIS: chikungunya cursa com artralgia muito intensa, incapacitante, que pode cronificar por meses; zika dá exantema pruriginoso, conjuntivite e febre baixa ou ausente, e importa pela síndrome congênita e pela Guillain-Barré — zika em gestante é notificação imediata. Na prevenção, o eixo é o controle do vetor; a vacina Qdenga foi incorporada ao SUS em 2024, começando por adolescentes de 10 a 14 anos, em 2 doses com 3 meses de intervalo (a faixa vem sendo ampliada conforme a oferta — confira o calendário vigente)."],
   raciocinio:["Situe o paciente na linha do tempo: que dia de doença é? A piora mora entre o 3º e o 7º dia, quando a febre CAI.",
     "Procure ativamente os sinais de alarme (dor abdominal, vômitos, líquidos, hipotensão postural, hepatomegalia, sangramento, letargia, Ht subindo).",
     "Sem alarme e sem condição de risco = Grupo A: hidratação oral 60 mL/kg/dia em casa + retorno diário.",
     "Prova do laço positiva/sangramento de pele OU comorbidade/risco = Grupo B: hemograma na unidade e reclassificar pelo hematócrito.",
     "Com alarme = Grupo C: internar e expandir 10 mL/kg na 1ª hora. Com choque = Grupo D: 20 mL/kg em até 20 min + UTI.",
     "Nunca AAS/AINE. Plaquetopenia sem sangramento não se transfunde."],
   nucleo:["Fases: febril (1-3) → CRÍTICA na defervescência (3-7) → recuperação. Piora quando a febre cai.",
     "O mecanismo é extravasamento plasmático: hematócrito em ELEVAÇÃO é o alarme laboratorial-chave.",
     "Grupos: A (oral, 60 mL/kg/dia em casa) · B (hemograma na unidade) · C (alarme → 10 mL/kg na 1ª hora) · D (choque → 20 mL/kg em 20 min + UTI).",
     "Analgesia: paracetamol/dipirona. AAS e AINE CONTRAINDICADOS.",
     "Notificação semanal; dengue GRAVE e ÓBITO = imediata (24h). Zika em gestante = imediata.",
     "Chikungunya = artralgia intensa/crônica. Zika = exantema pruriginoso + conjuntivite, febre baixa/ausente."],
   pega:"A piora acontece na DEFERVESCÊNCIA (3º-7º dia), não no pico da febre — 'a febre passou' não é alta. Nunca AAS/AINE, e plaquetopenia isolada sem sangramento não se transfunde.",
   mne:"Alarme: dor Abdominal, Vômito, Líquidos, Hipotensão postural, Hepatomegalia, Sangramento, Letargia, Hematócrito subindo.",
   sus:"Notificação compulsória (grave/óbito em 24h), controle do Aedes e vacina Qdenga no PNI desde 2024 (início em 10-14 anos)."},

  {id:"cm-tuberculose",area:"CM",nome:"Tuberculose",yield:3,
   questoes:["cm_tb_q1","cm_tb_q2","cm_tb_q3","cm_tb_q4"],
   fonte:"Manual de Recomendações para o Controle da Tuberculose no Brasil (Ministério da Saúde/SVSA, atualização 2025); PCDT de Tuberculose; Diretrizes da OMS para TB drogarresistente (2022/2024).",
   aula:["A tuberculose é causada pelo Mycobacterium tuberculosis e se transmite por aerossol — o doente com TB pulmonar bacilífera tosse e espalha bacilos no ar. O Brasil está entre os países de alta carga, e a doença tem endereço social: concentra-se em pessoas privadas de liberdade, em situação de rua, pessoas vivendo com HIV e populações vulneráveis. O quadro clássico é arrastado: tosse por SEMANAS, febre vespertina, sudorese noturna e emagrecimento. A porta de entrada operacional da APS é o conceito de SINTOMÁTICO RESPIRATÓRIO — quem tosse há 3 semanas ou mais. Em pessoas vivendo com HIV, contatos e populações vulneráveis, QUALQUER tosse já investiga. A busca ativa desse tossidor é atribuição da equipe de saúde da família.",
     "O diagnóstico mudou e a prova cobra a mudança. O exame INICIAL de escolha é o TESTE RÁPIDO MOLECULAR (TRM-TB / Xpert MTB/RIF): em cerca de 2 horas detecta o DNA do bacilo e, de quebra, já informa se há resistência à RIFAMPICINA. A baciloscopia (pesquisa de BAAR no escarro) continua tendo dois papéis: onde o TRM não está disponível, e principalmente para o CONTROLE MENSAL do tratamento. A cultura com teste de sensibilidade é indicada em situações especiais: retratamento, suspeita de resistência, pessoas vivendo com HIV, populações vulneráveis e casos paucibacilares. A radiografia de tórax complementa (o clássico é cavitação em ápice). E uma regra que não se negocia: TODO paciente com tuberculose deve ser testado para HIV.",
     "O tratamento da TB sensível é o esquema básico, o famoso RIPE, em dose fixa combinada: 2 meses de RHZE (Rifampicina, isoniazida [H], Pirazinamida, Etambutol) na fase intensiva, seguidos de 4 meses de RH na fase de manutenção — total de 6 meses. O tratamento é gratuito e feito preferencialmente sob TDO (tratamento diretamente observado), porque o abandono é o maior inimigo: gera recaída e resistência. Os efeitos adversos têm dicas mnemônicas úteis: etambutol causa neurite óptica (afeta o OLHO, avalie a visão de cores); isoniazida causa neuropatia periférica (previne-se com piridoxina); pirazinamida eleva o ácido úrico; e rifampicina deixa a urina/secreções ALARANJADAS — isso NÃO é motivo para suspender, mas exige avisar o paciente e lembrar que ela reduz a eficácia do anticoncepcional oral. Hepatotoxicidade é o efeito grave a monitorar.",
     "Ao lado da doença ativa existe a INFECÇÃO LATENTE (ILTB): a pessoa carrega o bacilo dormente, não está doente e não transmite — mas pode adoecer no futuro, e tratar isso evita o caso novo. Rastreia-se em contatos, pessoas vivendo com HIV, candidatos a anti-TNF, transplantados, silicose. O diagnóstico é pela prova tuberculínica (PT) ou IGRA, SEMPRE depois de excluir doença ativa (clínica + radiografia). Atenção ao ponto que mais derruba: o corte da PT foi UNIFICADO em ≥5 mm, independentemente de vacinação prévia com BCG. As opções de tratamento são: rifampicina por 4 meses (120 doses) — preferida em menores de 10 anos, maiores de 50, hepatopatas e intolerantes à isoniazida; isoniazida por 9 meses (270 doses); ou o esquema 3HP, com rifapentina + isoniazida semanal, 12 doses — mais curto e com melhor adesão.",
     "Fechando com vigilância e as armadilhas. A tuberculose é doença de NOTIFICAÇÃO COMPULSÓRIA (SINAN), com investigação obrigatória dos contatos e acompanhamento até o encerramento. Nos casos com resistência, os esquemas orais modernos contendo bedaquilina substituíram os injetáveis, encurtando o tratamento. Duas pegadinhas de ouro: (1) baciloscopia NEGATIVA não exclui tuberculose — a sensibilidade é limitada, e é por isso que o TRM-TB é o exame inicial; (2) NUNCA prescreva fluoroquinolona (levofloxacino, moxifloxacino) a um tossidor crônico sem antes excluir TB: essas drogas têm ação antimicobacteriana, melhoram o paciente parcialmente, MASCARAM o diagnóstico e ainda selecionam resistência. E jamais monoterapia — tratar TB com uma droga só é fabricar bacilo resistente."],
   raciocinio:["Tosse ≥3 semanas = sintomático respiratório → investigue TB. Em PVHIV/contatos/vulneráveis, qualquer tosse.",
     "Peça o TRM-TB como exame INICIAL (2h, detecta DNA + resistência à rifampicina). Baciloscopia negativa NÃO exclui.",
     "Teste TODO paciente com TB para HIV. Cultura + TSA em retratamento, HIV, suspeita de resistência.",
     "Confirmou TB sensível: esquema básico 2RHZE + 4RH (6 meses), em TDO, e NOTIFIQUE no SINAN.",
     "Investigue os contatos: se assintomático + Rx normal + PT ≥5 mm → tratar ILTB (rifampicina 4 meses, isoniazida 9 meses ou 3HP).",
     "Nunca dar fluoroquinolona ao tossidor crônico antes de excluir TB; nunca monoterapia."],
   nucleo:["Sintomático respiratório = tosse ≥3 semanas (qualquer tosse em PVHIV/vulneráveis).",
     "Exame INICIAL: TRM-TB (detecta DNA + resistência à rifampicina). Baciloscopia: onde não há TRM e para controle mensal.",
     "Esquema básico: 2RHZE + 4RH = 6 meses, dose fixa combinada, com TDO. Testar HIV em todos.",
     "Efeitos: Etambutol = olho (neurite óptica) · Isoniazida = nervo (piridoxina) · Pirazinamida = ácido úrico · Rifampicina = urina laranja e corta o anticoncepcional.",
     "ILTB: PT ≥5 mm (corte unificado, independe de BCG) após excluir doença ativa → rifampicina 4 meses, isoniazida 9 meses ou 3HP (12 doses semanais).",
     "Notificação compulsória (SINAN) + investigação de contatos."],
   pega:"Baciloscopia negativa NÃO exclui TB — o inicial é o TRM-TB. E nunca prescrever fluoroquinolona a tossidor crônico sem excluir TB: mascara o diagnóstico e seleciona resistência. Corte da PT é ≥5 mm, mesmo com BCG prévio.",
   mne:"RIPE: 2RHZE + 4RH. Etambutol=Olho · Isoniazida=Nervo · Pirazinamida=Ácido úrico · Rifampicina=uRina laRanja.",
   sus:"Busca ativa do sintomático respiratório, TDO, tratamento gratuito e notificação compulsória — eixo da APS."},

  {id:"cm-pac",area:"CM",nome:"Pneumonia adquirida na comunidade",yield:3,
   questoes:["cm_pac_q1","cm_pac_q2","cm_pac_q3","cm_pac_q4"],
   fonte:"Diretrizes brasileiras para pneumonia adquirida na comunidade em adultos (Sociedade Brasileira de Pneumologia e Tisiologia — SBPT); Diretriz ATS/IDSA de PAC em adultos (2019); escores CURB-65/CRB-65.",
   aula:["Pneumonia adquirida na comunidade (PAC) é a infecção do parênquima pulmonar que começa fora do hospital. O agente mais comum, disparado, é o Streptococcus pneumoniae (pneumococo); os 'atípicos' (Mycoplasma, Chlamydophila, Legionella) e os vírus completam o quadro. A apresentação típica: febre, tosse produtiva, dor torácica que piora ao respirar (pleurítica), dispneia, e ao exame crepitações, sopro tubário ou egofonia numa região. Mas cuidado com a armadilha geriátrica: o IDOSO pode chegar SEM febre, apenas confuso, caindo mais, ou com uma comorbidade descompensada. Não exigir febre para pensar em pneumonia no idoso é um dos ganhos fáceis da prova.",
     "O diagnóstico é clínica + radiografia de tórax mostrando consolidação. Na atenção primária, onde muitas vezes não há raio-x na hora, o quadro clínico compatível já autoriza tratar — não se posterga antibiótico esperando imagem. Nos pacientes que internam, acrescentam-se hemograma, ureia, gasometria/oximetria e culturas. Um ponto que a banca adora: NÃO se pede radiografia de controle precoce de rotina. A imagem demora semanas para limpar e pode até 'piorar' nos primeiros dias enquanto o paciente melhora clinicamente — quem manda é a evolução clínica, não o filme.",
     "A decisão mais importante na PAC não é qual antibiótico, é ONDE tratar. Para isso existe o CURB-65, que soma 1 ponto para cada item: Confusão mental; Ureia > 50 mg/dL; frequência Respiratória ≥ 30; Blood pressure (PA) baixa — sistólica < 90 ou diastólica ≤ 60; e idade ≥ 65 anos. Interpretação: 0 a 1 ponto = tratamento ambulatorial; 2 pontos = considerar internação; 3 ou mais = internação, avaliando terapia intensiva. Na APS, onde não há ureia, usa-se o CRB-65 (os mesmos itens sem a ureia). Saturação de O2 < 92% também puxa para a internação, e o escore não substitui o julgamento clínico: suporte social ruim, incapacidade de tomar via oral ou comorbidade descompensada internam mesmo com escore baixo.",
     "Escolhido o local, vem o antibiótico. Ambulatorial, adulto previamente hígido e sem uso recente de antibiótico: AMOXICILINA (alternativa: macrolídeo). Ambulatorial com comorbidades ou uso recente de antibiótico: amoxicilina-clavulanato associado a macrolídeo, ou uma quinolona respiratória. Internado fora da UTI: betalactâmico + macrolídeo. UTI: betalactâmico + macrolídeo ou quinolona respiratória. A duração é curta — em geral 5 a 7 dias, com mínimo de 5 dias e o paciente estável e afebril por 48 a 72 horas. Prolongar antibiótico 'por garantia' não melhora desfecho e seleciona resistência.",
     "As armadilhas finais. A maior, no Brasil, é a QUINOLONA RESPIRATÓRIA (levofloxacino, moxifloxacino): ela tem atividade contra o bacilo da tuberculose, então tratar uma 'pneumonia' que na verdade é TB com quinolona melhora parcialmente o paciente, MASCARA o diagnóstico e seleciona resistência — por isso não é a primeira escolha empírica de rotina aqui, e diante de tosse arrastada com emagrecimento você pensa TB antes. Segunda: derrame pleural associado exige toracocentese para diferenciar derrame parapneumônico simples de EMPIEMA (que precisa de drenagem, não só antibiótico). Terceira: bronquite aguda é viral e não se trata com antibiótico. E a prevenção existe e é do SUS: vacina influenza anual e pneumocócica nos grupos indicados reduzem internação e óbito."],
   raciocinio:["Suspeitou de PAC? Clínica + raio-x. No idoso, não exija febre — confusão e queda podem ser a única pista.",
     "Calcule o CURB-65 (ou CRB-65 na APS) para decidir ONDE tratar: 0-1 casa · 2 considerar internar · ≥3 internar e avaliar UTI.",
     "Cheque também a saturação (<92% interna) e o contexto social — o escore não manda sozinho.",
     "Ambulatorial hígido: amoxicilina. Com comorbidade/ATB recente: amoxi-clavulanato + macrolídeo ou quinolona respiratória.",
     "Internado não-UTI: betalactâmico + macrolídeo. Duração 5-7 dias, afebril e estável por 48-72h.",
     "Tosse arrastada + emagrecimento? Pense TB ANTES de dar quinolona. Derrame? Toracocentese para excluir empiema."],
   nucleo:["Agente mais comum: pneumococo. Idoso pode não ter febre (só confusão/queda).",
     "CURB-65: Confusão · Ureia >50 · FR ≥30 · PA <90/≤60 · ≥65 anos. 0-1 ambulatorial · 2 considerar internar · ≥3 internar/UTI. Na APS: CRB-65.",
     "Ambulatorial hígido: amoxicilina. Com comorbidade: amoxi-clav + macrolídeo ou quinolona respiratória.",
     "Internado não-UTI: betalactâmico + macrolídeo. Duração 5-7 dias.",
     "Não pedir Rx de controle precoce de rotina — a imagem atrasa em relação à clínica.",
     "Quinolona mascara TB. Derrame pleural → toracocentese (empiema drena)."],
   pega:"Quinolona respiratória tem ação anti-TB: mascara tuberculose no tossidor crônico. E não peça raio-x de controle precoce — a imagem piora/atrasa enquanto o paciente melhora.",
   mne:"CURB-65 = Confusão · Ureia · Respiração ≥30 · Blood pressure baixa · ≥65 anos.",
   sus:"Vacina influenza e pneumocócica no PNI; manejo ambulatorial da PAC de baixo risco é da APS."},

  {id:"cm-hiv-ist",area:"CM",nome:"HIV e ISTs na APS",yield:3,
   questoes:["cm_hiv_q1","cm_hiv_q2","cm_hiv_q3","cm_hiv_q4"],
   fonte:"PCDT para Manejo da Infecção pelo HIV em Adultos (Ministério da Saúde, 2024); PCDT para Atenção Integral às Pessoas com Infecções Sexualmente Transmissíveis (MS); PCDT de PrEP e de PEP de risco à infecção pelo HIV (MS).",
   aula:["O HIV deixou de ser assunto exclusivo do infectologista: a testagem rápida, o diagnóstico e até o início do tratamento acontecem na atenção primária. O diagnóstico se faz com testes rápidos (dois testes, conforme o fluxograma do Ministério), e a mensagem central mudou completamente nos últimos anos: a terapia antirretroviral (TARV) está indicada para TODAS as pessoas vivendo com HIV, independentemente da contagem de CD4, e deve ser iniciada o mais cedo possível — idealmente no MESMO DIA do diagnóstico. Não se espera CD4 nem carga viral para começar. Quanto mais precoce a TARV, menor a mortalidade, menor o adoecimento e menor a transmissão. Daí o conceito de I=I: pessoa com carga viral INDETECTÁVEL não transmite o HIV por via sexual — é INTRANSMISSÍVEL.",
     "O esquema preferencial inicial no Brasil é a combinação TDF + 3TC + DTG (tenofovir + lamivudina + dolutegravir), em comprimido único diário, disponível gratuitamente no SUS. O dolutegravir tem alta barreira genética e boa tolerabilidade. Uma situação especial que cai em prova: na coinfecção com TUBERCULOSE em uso de rifampicina, o dolutegravir precisa de ajuste (dose dobrada, 12/12h), porque a rifampicina acelera seu metabolismo. O acompanhamento se faz por CARGA VIRAL (o marcador de eficácia do tratamento); o CD4 informa o risco imunológico e a necessidade de profilaxias de infecções oportunistas, mas não é mais o gatilho para tratar.",
     "A prevenção hoje é COMBINADA, e a prova cobra as siglas. Preservativo, testagem regular, tratamento como prevenção (I=I), redução de danos e vacinação (HPV, hepatite B) compõem a base. A PrEP (profilaxia PRÉ-exposição) é medicação de uso contínuo para pessoas sob maior risco, disponível no SUS. E a PEP (profilaxia PÓS-exposição) é a corrida contra o relógio: deve começar o quanto antes, idealmente nas primeiras 2 horas, e o limite máximo é 72 HORAS após a exposição — de risco sexual, ocupacional ou por violência sexual — mantida por 28 dias. Passou de 72h, não se indica PEP. Guardar '72 horas / 28 dias' resolve a questão.",
     "Na sífilis, a regra de ouro é uma só: o tratamento é PENICILINA BENZATINA, e na gestante ela é a ÚNICA opção que trata também o FETO. Sífilis recente (primária, secundária ou latente recente, com menos de 1 ano): 2,4 milhões UI, dose única. Sífilis tardia ou de duração ignorada: 2,4 milhões UI por semana, 3 doses (total 7,2 milhões UI). O seguimento é com VDRL/teste não treponêmico, esperando queda de pelo menos duas diluições. Duas pegadinhas pesadas: (1) a penicilina benzatina PODE e DEVE ser aplicada na UBS — o risco de anafilaxia é baixíssimo, e encaminhar a gestante 'para aplicar em outro lugar' é erro que produz sífilis congênita; (2) na gestante com alergia comprovada à penicilina, a conduta é DESSENSIBILIZAR e usar penicilina — doxiciclina não trata o feto e a gestante não é considerada adequadamente tratada.",
     "Fechando com o raciocínio da APS. As ISTs andam juntas: diante de uma, teste o 'pacote' — HIV, sífilis, hepatite B e hepatite C — e trate parcerias. Nas síndromes, usa-se a abordagem sindrômica: corrimento uretral/cervical cobre gonococo e clamídia (ceftriaxona + azitromicina), sem esperar cultura. E a vigilância é obrigatória: HIV/aids, sífilis ADQUIRIDA, sífilis em GESTANTE e sífilis CONGÊNITA são todas de notificação compulsória, assim como as hepatites virais. Resumo do que a banca quer: TARV para todos e no mesmo dia; TDF+3TC+DTG; PEP em até 72h por 28 dias; penicilina benzatina na UBS, com dessensibilização se alergia na gestante."],
   raciocinio:["Diagnosticou HIV? Inicie TARV IMEDIATAMENTE — não espere CD4 nem carga viral.",
     "Esquema preferencial: TDF + 3TC + DTG, 1 comprimido/dia. Com rifampicina (TB), dobre o dolutegravir para 12/12h.",
     "Monitore por CARGA VIRAL. Reforce I=I: indetectável = intransmissível.",
     "Exposição de risco? PEP o quanto antes, limite de 72 HORAS, por 28 dias. Maior risco contínuo? PrEP.",
     "Sífilis: penicilina benzatina. Recente = 1 dose (2,4 mi UI). Tardia/ignorada = 3 doses semanais.",
     "Gestante alérgica: DESSENSIBILIZE — doxiciclina não trata o feto. Aplique na própria UBS.",
     "Testou uma IST? Teste o pacote (HIV, sífilis, hepatites B e C), trate parcerias e notifique."],
   nucleo:["TARV para TODOS, independente de CD4, iniciada no mesmo dia. I=I (indetectável = intransmissível).",
     "Esquema inicial: TDF + 3TC + DTG (dose única diária). Com rifampicina: dolutegravir 12/12h.",
     "Acompanhamento pela CARGA VIRAL; CD4 avalia risco/profilaxias.",
     "PEP: até 72h da exposição, por 28 dias. PrEP: uso contínuo para maior risco, disponível no SUS.",
     "Sífilis: penicilina benzatina — recente 2,4 mi UI dose única; tardia/ignorada 3 doses semanais. Seguimento com VDRL.",
     "Penicilina se aplica na UBS. Gestante alérgica = dessensibilizar (doxiciclina não trata o feto).",
     "Notificação compulsória: HIV/aids, sífilis adquirida, em gestante e congênita, hepatites virais."],
   pega:"Penicilina benzatina PODE e DEVE ser aplicada na UBS — não encaminhe. Gestante alérgica: dessensibiliza, porque doxiciclina não trata o feto. E TARV começa no mesmo dia, sem esperar CD4.",
   mne:"HIV inicial = TDF + 3TC + DTG (1 comprimido/dia). PEP = 72 horas / 28 dias.",
   sus:"Testagem rápida, TARV, PrEP, PEP e penicilina na APS; HIV e sífilis (adquirida, gestante e congênita) são notificação compulsória."},
  {id:"cir-abdome",area:"CIR",nome:"Abdome agudo",yield:3,
   questoes:["cir_abdome_q1","cir_abdome_q2","cir_abdome_q3","cir_abdome_q4"],
   fonte:"Diretrizes para o Manejo da Apendicite Aguda (Sociedade Brasileira de Cirurgia Digestiva – SBCD, 2025); escore de Alvarado; WSES (World Society of Emergency Surgery).",
   aula:["Abdome agudo é dor abdominal de início recente que exige decisão rápida: operar ou não. A chave para não se perder é encaixar o quadro em um de quatro padrões, porque cada um tem uma cara e uma conduta. Inflamatório (apendicite, colecistite): dor que cresce e localiza, com febre. Obstrutivo (bridas, hérnia, tumor): dor em cólica, parada de eliminação de fezes e flatos, vômitos, distensão. Perfurativo (úlcera perfurada): dor súbita e intensa, abdome em tábua. Vascular/hemorrágico (isquemia mesentérica, aneurisma roto): dor desproporcional ao exame, paciente grave.","A apendicite é a estrela da prova porque tem uma história muito característica. Começa com dor mal localizada em volta do umbigo (o apêndice inflamado ainda 'avisa' pelo nervo visceral), e em algumas horas MIGRA para a fossa ilíaca direita, quando a inflamação atinge o peritônio parietal e a dor fica bem localizada. Junto vêm febre baixa, náusea, perda de apetite e leucocitose. No exame, sinais de irritação peritoneal como o Blumberg (dor à descompressão) apontam que já há peritônio inflamado.","O raciocínio que a banca quer: irritação peritoneal (peritonismo) fala a favor de abordagem cirúrgica. Numa apendicite típica, com quadro clínico claro e sinais peritoneais, a conduta é APENDICECTOMIA (preferencialmente laparoscópica, inclusive em gestantes) — não se fica pedindo exame atrás de exame nem tratando só com antibiótico ambulatorial quando o quadro é evidente. O escore de ALVARADO (0-10) auxilia: ≥7 indica alta probabilidade (autoriza a cirurgia em muitos protocolos); ≤3 torna o diagnóstico pouco provável. A imagem entra nos casos DUVIDOSOS/atípicos: a ultrassonografia é a 1ª escolha em CRIANÇAS e GESTANTES (evita radiação), e a tomografia com contraste é o padrão-ouro no ADULTO (apêndice > 6 mm, apendicolito). Já a apendicite COMPLICADA com abscesso/fleimão pode ser manejada com antibiótico + drenagem e apendicectomia de intervalo (8-12 semanas).","As armadilhas moram nos extremos de idade e na gestante. Na criança pequena, no idoso e na grávida a apresentação é atípica — o apêndice pode estar deslocado, a dor não migra classicamente, e o diagnóstico atrasa, aumentando o risco de perfuração. Outro alerta: dor abdominal DESPROPORCIONAL ao que se vê no exame, num paciente com fatores de risco vascular, deve levantar isquemia mesentérica, que é grave e engana por ter exame inicial 'pobre'."],
   raciocinio:["Encaixe a dor em um dos 4 padrões: inflamatório, obstrutivo, perfurativo, vascular/hemorrágico.","Procure irritação peritoneal (Blumberg, defesa). Presente = pense em abordagem cirúrgica.","Apendicite: dor que migra para FID + peritonismo + leucocitose = quadro clássico → apendicectomia.","Quadro claro não precisa de imagem para adiar; imagem é para casos atípicos/duvidosos.","Cuidado com apresentação atípica em criança, idoso e gestante; e com dor desproporcional (isquemia)."],
   nucleo:["4 padrões: inflamatório, obstrutivo, perfurativo, vascular/hemorrágico.","Apendicite clássica: dor periumbilical que MIGRA para FID + febre + Blumberg + leucocitose.","Irritação peritoneal = cirurgia (apendicectomia, preferir laparoscópica). Alvarado ≥7 = alta probabilidade.","Imagem só no duvidoso: USG em criança/gestante, TC no adulto. Atípico em criança/idoso/gestante; dor desproporcional = isquemia."],
   pega:"Não adie o óbvio pedindo exames num quadro clássico de apendicite; e lembre da apresentação atípica em criança/idoso/gestante.",mne:"Migração da dor + Blumberg = apendicite.",sus:"A APS reconhece e referencia a tempo a urgência cirúrgica."},
  {id:"cir-trauma",area:"CIR",nome:"Trauma — ABCDE (ATLS)",yield:3,
   questoes:["cir_trauma_q1","cir_trauma_q2","cir_trauma_q3","cir_trauma_q4"],
   fonte:"ATLS – Advanced Trauma Life Support 11ª edição (American College of Surgeons, 2025 — algoritmo xABCDE e ressuscitação com controle de danos); PHTLS.",
   aula:["No trauma grave, o que mata é o tempo e a desorganização. O ATLS resolve isso com uma sequência rígida que trata primeiro o que mata primeiro. A regra de ouro: você não passa para a próxima letra sem resolver a anterior. ATUALIZAÇÃO (ATLS 11ª edição/PHTLS): a sequência clássica ABCDE ganhou um X na frente — virou XABCDE. O X é a hemorragia eXsanguinante (sangramento externo maciço), que deve ser controlada ANTES mesmo da via aérea, porque uma hemorragia grande mata em minutos. Depois do X, segue-se a ordem tradicional.","A = Via aérea com proteção da coluna cervical. Antes de tudo, garantir que o ar entra, sempre imobilizando o pescoço (todo politraumatizado tem lesão cervical até prova em contrário). Sinais de via aérea ameaçada: estridor, sangue ou vômito na boca, rebaixamento de consciência. B = Respiração (ventilação): checar se os dois pulmões expandem — aqui se pega o pneumotórax hipertensivo, o tórax instável. C = Circulação: controlar hemorragias (comprimir, torniquete) e repor volume — o cristaloide preferido é o Ringer lactato. A maior causa de choque no trauma é sangramento (choque hemorrágico, estratificado em leve, moderado e grave — ver adiante). Conceitos-chave da 11ª edição (ressuscitação com controle de danos): controlar a hemorragia primeiro, USAR MENOS cristaloide e partir cedo para hemocomponentes na proporção 1:1:1 (hemácias:plasma:plaquetas); hipotensão permissiva (manter PAS ~80-90 até controlar o foco, exceto em traumatismo cranioencefálico); e uso PRECOCE do ácido tranexâmico (1 g EV + 1 g em 8h) no trauma com sangramento significativo.","D = Disfunção neurológica: avaliar consciência pela escala de Glasgow (a 11ª edição valoriza a pontuação por COMPONENTES — abertura ocular, resposta verbal e motora — e a tendência, não só o número total) e as pupilas. A prevenção da lesão cerebral SECUNDÁRIA (evitar hipóxia e hipotensão) já começa na avaliação primária. E = Exposição: despir o paciente para não perder lesões, evitando a hipotermia. O raciocínio-chave da prova: diante de um politraumatizado hipotenso, pense HEMORRAGIA até prova em contrário — não é 'pressão baixa de susto'. E a prioridade nunca muda: se há problema de via aérea (A), ele vem antes de tratar o choque (C).","Um exemplo típico de questão: vítima inconsciente com estridor e sangue na boca. Muitos se assustam com a pressão ou querem pedir tomografia — mas a resposta é garantir a via aérea (A) com proteção cervical, porque é o A que está falhando e vai matar primeiro. O FAST (ultrassom à beira do leito) e a reposição entram no C, depois. Seguir a ordem é o que a banca cobra.","Sobre o CHOQUE HEMORRÁGICO, houve uma mudança importante na 11ª edição: o antigo modelo RÍGIDO de quatro classes (I a IV por porcentagem de perda de sangue) foi SIMPLIFICADO para uma avaliação clínica e fisiológica em TRÊS categorias — LEVE, MODERADO e GRAVE. A lógica saiu de estimar o percentual de sangue perdido para reconhecer rápido a gravidade e interromper o ciclo do choque (a tríade letal: hipotermia, acidose e coagulopatia). Isso porque os sinais vitais isolados enganam: idosos, pacientes em uso de betabloqueador e atletas podem não taquicardizar, e a queda da pressão costuma ser tardia. Por isso valorizam-se marcadores fisiológicos de hipoperfusão — o LACTATO (>4 mmol/L indica gravidade, e seu clareamento é meta da ressuscitação) e o déficit de base — e o Shock Index (frequência cardíaca dividida pela pressão sistólica), mais sensível que os sinais vitais isolados. O manejo prioriza controle imediato da hemorragia + hemocomponentes precoces, em vez de estratificar em classes numéricas."],
   raciocinio:["Siga X → A → B → C → D → E, sem pular etapa (X = hemorragia exsanguinante externa, primeiro de tudo).","A: via aérea ameaçada (estridor, sangue, rebaixamento)? Garanta a via aérea com proteção cervical antes de tudo.","B: os dois pulmões expandem? Pegue aqui pneumotórax hipertensivo.","C: controle a hemorragia (comprima) e reponha volume. Hipotensão no trauma = hemorragia até prova em contrário.","D e E: avalie consciência/pupilas e exponha o paciente, evitando hipotermia."],
   nucleo:["Ordem XABCDE (ATLS 11): X hemorragia exsanguinante externa (antes do A), A via aérea + coluna cervical, B ventilação, C circulação, D neuro, E exposição.","Via aérea ameaçada tem prioridade máxima.","Hipotensão no trauma = hemorragia até prova em contrário. ATLS 11: choque em 3 categorias (leve/moderado/grave), foco em interromper o ciclo; lactato/déficit de base e Shock Index como marcadores; sinais vitais enganam idoso/betabloqueado.","C: Ringer lactato, ácido tranexâmico precoce (1g+1g/8h), hipotensão permissiva, transfusão 1:1:1."],
   pega:"A prioridade é sempre a via aérea (A) — não se trata o choque (C) antes de garantir o A. Hipotensão no trauma é sangramento.",mne:"ABCDE — nesta ordem, sempre.",sus:"Atendimento pré-hospitalar (SAMU) e regulação compõem a rede de urgência."},
  {id:"cir-posop",area:"CIR",nome:"Pré-op e complicações",yield:2,
   questoes:["cir_posop_q1","cir_posop_q2","cir_posop_q3","cir_posop_q4"],
   fonte:"Cuidados perioperatórios e complicações pós-operatórias (Sabiston; ACERTO/ERAS); segurança do paciente cirúrgico (OMS/checklist).",
   aula:["O cuidado cirúrgico não termina na sala de operação — boa parte das mortes evitáveis acontece no PÓS-operatório, por complicações que o médico precisa reconhecer cedo. Antes disso, no pré-operatório, avalia-se o risco do paciente (cardíaco, respiratório) e institui-se profilaxia, com destaque para a prevenção de trombose venosa profunda (TVP) em quem vai ficar imóvel.","A complicação mais cobrada é a FEBRE pós-operatória, e o truque é pensar pela CRONOLOGIA — quando a febre aparece sugere a causa. Nas primeiras 24-48h, costuma ser pulmonar (atelectasia, pelo pulmão que não expande direito deitado). Depois, entram infecção urinária (relacionada a sonda), infecção da ferida operatória, TVP e, mais tarde, coleções/abscessos. Essa linha do tempo organiza o raciocínio.","Uma regra mnemônica clássica ajuda: os '5 Ws' da febre pós-op — Wind (pulmão, atelectasia/pneumonia), Water (urina, ITU), Wound (ferida), Walking (TVP, panturrilha) e Wonder drugs (febre medicamentosa). Além da febre, vigiam-se a deiscência (abertura da ferida/anastomose) e a infecção do sítio cirúrgico.","O elo com o mundo real (e com o seu NSP): a segurança do paciente cirúrgico depende de checklists, profilaxia adequada e vigilância pós-operatória — reconhecer a febre pela cronologia e agir. Febre nas primeiras 48h geralmente é pulmonar (estimular respiração, deambulação); febre mais tardia puxa a investigação para infecção/coleção."],
   raciocinio:["No pré-op, avalie risco e institua profilaxia (TVP).","Diante de febre pós-op, pense na CRONOLOGIA.","Primeiras 24-48h: pense pulmão (atelectasia).","Mais tardia: ITU, ferida, TVP, coleção/abscesso.","Use os 5 Ws para não esquecer nenhuma causa."],
   nucleo:["Pré-op: avaliação de risco e profilaxia de TVP.","Febre pós-op pela cronologia: 24-48h → pulmão; tardia → infecção/coleção.","5 Ws: Wind, Water, Wound, Walking, Wonder drugs.","Vigiar deiscência e infecção do sítio cirúrgico."],
   pega:"Febre nas primeiras 24-48h costuma ser pulmonar (atelectasia); febre tardia sugere infecção/coleção.",mne:"Febre pós-op = 5 Ws.",sus:"Segurança do paciente e checklist cirúrgico (tema do NSP)."},
  {id:"cir-hernia",area:"CIR",nome:"Hérnias de parede",yield:1,
   questoes:["cir_hernia_q1","cir_hernia_q2","cir_hernia_q3","cir_hernia_q4"],
   fonte:"Diretrizes de hérnia da parede abdominal (European Hernia Society; Sociedade Brasileira de Hérnia); Sabiston - Tratado de Cirurgia.",
   aula:["Hérnia é a protrusão de um órgão (geralmente alça intestinal) por um ponto fraco da parede abdominal. As mais comuns são a inguinal (na virilha, a mais frequente), a femoral (abaixo do ligamento inguinal, mais comum e mais perigosa em mulheres), a umbilical e a incisional (na cicatriz de cirurgia prévia). A maioria é assintomática ou dá abaulamento que sai ao esforço e some deitado.","O que transforma uma hérnia banal em emergência são duas palavras que você precisa diferenciar. ENCARCERAMENTO: a hérnia fica IRREDUTÍVEL (não volta ao lugar), mas o conteúdo ainda tem circulação. ESTRANGULAMENTO: além de irredutível, o suprimento de sangue foi cortado — a alça está isquêmica e vai necrosar. O estrangulamento é emergência cirúrgica imediata.","Os sinais de alarme: hérnia que não reduz + dor intensa + sinais sistêmicos (vômitos, sinais de obstrução, febre, taquicardia) = pense estrangulamento. A hérnia femoral merece atenção especial porque, por passar num anel estreito, encarcera e estrangula com mais frequência — e costuma cair na prova exatamente com esse perfil (mulher idosa, abaulamento irredutível na virilha, obstrução).","A conduta: hérnia não complicada é cirurgia eletiva (na fila do SUS). Hérnia estrangulada é cirurgia de urgência — não se perde tempo. Resumo do raciocínio de prova: irredutível + dor + sinais sistêmicos = estrangulou = operou agora."],
   raciocinio:["Identifique o tipo (inguinal, femoral, umbilical, incisional).","A hérnia reduz (volta ao lugar) ou não? Irredutível é sinal de alerta.","Irredutível + dor + sinais sistêmicos (vômito, obstrução) = estrangulamento.","Estrangulou = cirurgia de urgência. Não complicada = eletiva.","Lembre: femoral encarcera/estrangula mais, sobretudo em mulheres."],
   nucleo:["Tipos: inguinal, femoral, umbilical, incisional.","Encarceramento = irredutível (circulação mantida). Estrangulamento = irredutível + isquemia.","Estrangulamento é emergência cirúrgica.","Femoral estrangula mais (anel estreito)."],
   pega:"Hérnia femoral estrangula mais; irredutível + dor + sinais sistêmicos = estrangulamento = operar agora.",mne:"Estrangulou = operou.",sus:"Hérnia não complicada entra na fila cirúrgica eletiva do SUS."},
  {id:"go-prenatal",area:"GO",nome:"Pré-natal e rastreios",yield:3,
   questoes:["go_prenatal_q1","go_prenatal_q2","go_prenatal_q3","go_prenatal_q4"],
   fonte:"Protocolo de DMG (Ministério da Saúde/OPAS/FEBRASGO); Diretriz da Sociedade Brasileira de Diabetes 2025 – rastreamento da hiperglicemia na gestação; Caderneta da Gestante (MS).",
   aula:["O pré-natal existe para transformar uma gestação num processo vigiado, pegando cedo os problemas que ameaçam mãe e bebê. A maioria das gestantes é de baixo risco e é acompanhada na atenção primária, com um número mínimo de consultas e uma bateria de exames distribuída pelos trimestres. Saber esse roteiro é o que a banca cobra, porque é a rotina do SUS.","Logo no início entram a suplementação e as sorologias. Ácido fólico (idealmente antes de engravidar e no 1º trimestre) previne defeitos do tubo neural; ferro previne anemia. As sorologias de rotina (sífilis/VDRL, HIV, hepatite B, toxoplasmose) rastreiam infecções que podem ser transmitidas ao bebê — muitas com tratamento que muda o desfecho, como a penicilina na sífilis.","O rastreamento do diabetes gestacional (DMG) é um clássico de prova e tem uma lógica de dois tempos. No 1º trimestre pede-se a glicemia de jejum: se vier ≥126, já é diabetes prévio; se vier entre 92 e 125, é DMG; se estiver normal (<92), o rastreamento se completa mais tarde. Entre 24 e 28 semanas faz-se o TOTG com 75g de glicose, medindo três pontos: jejum, 1 hora e 2 horas. Os cortes para DMG são 92 (jejum), 180 (1h) e 153 (2h) mg/dL — e basta UM valor alterado para fechar o diagnóstico. Ou seja: jejum normal no início NÃO encerra o assunto — falta o TOTG no 24-28. (Onde não há TOTG disponível, o MS aceita repetir a glicemia de jejum entre 24-28 semanas.)","A imunização na gestação também cai muito. As recomendadas incluem dTpa (protege o recém-nascido contra coqueluche, dada a cada gestação), influenza e hepatite B. Vacinas de vírus vivo (como tríplice viral e febre amarela) são, em regra, evitadas na gestação. Fechar o pré-natal é somar: consultas regulares + exames por trimestre + suplementação + sorologias + rastreio de DMG (jejum e TOTG) + vacinas."],
   raciocinio:["Confirme a gestação e classifique o risco: baixo risco fica na APS.","Inicie suplementação (ácido fólico, ferro) e solicite as sorologias de rotina.","DMG: peça glicemia de jejum no 1º tri. ≥126 = diabetes prévio; 92-125 = DMG; <92 = normal, siga para o TOTG.","Entre 24 e 28 semanas: TOTG 75g para flagrar o DMG tardio.","Atualize as vacinas indicadas (dTpa, influenza, hepB); evite vírus vivo."],
   nucleo:["Baixo risco é acompanhado na APS; roteiro de consultas e exames por trimestre.","DMG: jejum no 1º tri (≥126 prévio; 92-125 DMG; <92 normal); TOTG 75g em 24-28 sem (cortes 92/180/153; 1 valor já fecha).","Suplementação: ácido fólico e ferro. Sorologias: sífilis, HIV, hepB, toxo.","Vacinas: dTpa (cada gestação), influenza, hepB; evitar vírus vivo."],
   pega:"Jejum normal no 1º trimestre NÃO encerra o rastreio de DMG — falta o TOTG 75g entre 24 e 28 semanas. Jejum ≥126 já é diabetes prévio.",mne:"DMG: jejum cedo, TOTG no 24-28.",sus:"Pré-natal de baixo risco é atribuição da APS (protocolo do MS)."},
  {id:"go-hemorragias",area:"GO",nome:"Hemorragias da gestação",yield:3,
   questoes:["go_hemorragias_q1","go_hemorragias_q2","go_hemorragias_q3","go_hemorragias_q4"],
   fonte:"Manual de Gestação de Alto Risco (Ministério da Saúde); Tratado de Obstetrícia (FEBRASGO); protocolos de sangramento na gestação.",
   aula:["Sangramento na gestação assusta, mas o raciocínio fica simples quando você separa por METADE da gravidez. Na primeira metade (até ~20 semanas), as causas principais são abortamento, gestação ectópica e doença trofoblástica (mola). Na segunda metade, o duelo clássico é entre descolamento prematuro de placenta (DPP) e placenta prévia (PP) — e distinguir os dois é a questão que mais cai.","O DPP é a placenta que se solta antes da hora. A cara: dor abdominal + útero HIPERTÔNICO (duro, contraído) + sangramento geralmente escuro + sinais de sofrimento fetal. Frequentemente há um fator de risco: hipertensão, trauma, uso de cocaína. É uma emergência — o bebê está perdendo oxigênio.","A placenta prévia é a placenta implantada sobre o colo. A cara é oposta: sangramento VIVO (vermelho vivo), em geral INDOLOR, sem hipertonia, muitas vezes de repetição. A regra de segurança absoluta: na suspeita de placenta prévia, NÃO se faz toque vaginal antes do ultrassom — o toque pode provocar hemorragia maciça.","Na primeira metade, dois cuidados de prova: gestação ectópica (dor pélvica + atraso menstrual + beta-hCG positivo) confirma-se com beta-hCG seriado + ultrassom transvaginal, e é causa de abdome agudo hemorrágico se romper. Resumo mnemônico: PP = sangue vivo e sem dor; DPP = dor e útero duro. E nunca tocar antes do US na suspeita de PP."],
